Repository Reader is an ABAC-enabled role that grants pull permissions (content and metadata read), and adding an ABAC condition on the repository name scopes the assignment to backend/api only. AcrPull is a legacy role that is not honored in an ABAC-enabled registry. Container Registry Repository Contributor also grants write and delete, exceeding pull-only. Container Registry Repository Catalog Lister only lists repository names, cannot read image content, and ignores ABAC conditions.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions"},{"id":"1.1.1-96","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Contoso Retail assigned the Container Registry Repository Reader role with an ABAC condition on its ABAC-enabled Azure Container Registry. Users can pull images, but running az acr repository list returns nothing. Which additional role lets those users enumerate the repository names in the registry?","choices":["AcrPull","Container Registry Repository Contributor","Owner","Container Registry Repository Catalog Lister"],"answer":[3],"explanation":"The ABAC-enabled repository roles do not include catalog listing. Container Registry Repository Catalog Lister grants permission to list all repository names, and it does not support ABAC conditions. AcrPull is a legacy role not honored under ABAC. Container Registry Repository Contributor grants read, write, and delete on content but still no catalog listing. Owner in ABAC mode grants only registry control-plane management, not data-plane catalog listing.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions"},{"id":"1.1.1-97","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fabrikam IoT operates field devices that are not Microsoft Entra identities. Each device must pull images from only one repository using a credential that can be given an expiration date and revoked without affecting other devices. Which authentication approach fits?","choices":["An ABAC condition on a Container Registry Repository Reader role assignment","The registry admin account credentials","An AcrPull role assignment for a user-assigned managed identity","A repository-scoped token with an associated scope map"],"answer":[3],"explanation":"A repository-scoped token with an associated scope map provides a non-Microsoft Entra credential that can be scoped to specific repositories and actions, given a password expiration, and disabled or deleted at any time. ABAC conditions and AcrPull role assignments apply only to Microsoft Entra identities, which these devices are not. The registry admin account is a single shared credential that grants access to the entire registry, not a single repository.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-98","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Tailwind Traders build pipelines repeatedly pull public base images from Docker Hub and now hit anonymous pull rate limits. The team wants pulls served from local copies in their Azure Container Registry that refresh automatically on first pull. Which feature should they configure?","choices":["Configure a geo-replication region","Run az acr import for each image","Configure an artifact cache rule with upstream credentials","Deploy a connected registry"],"answer":[2],"explanation":"Artifact cache (pull-through cache) transparently caches an upstream image in the registry on first pull, and authenticating the cache rule with Docker Hub credentials mitigates the anonymous pull rate limits. az acr import performs a one-time manual copy that does not transparently refresh. A connected registry is an on-premises or remote replica for local pulls, not an upstream cache. Geo-replication replicates your own registry across Azure regions, not content from Docker Hub.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-99","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Adatum Manufacturing runs container workloads on a factory floor cluster that has intermittent connectivity to Azure. The team needs a registry running on-premises that regularly synchronizes images with the cloud-based Azure Container Registry so pods can pull locally during outages. Which feature meets this need?","choices":["Enable geo-replication to a nearer Azure region","Deploy a connected registry on the on-premises cluster","Create artifact cache rules on the cloud registry","Use az acr import to copy images locally"],"answer":[1],"explanation":"A connected registry is a Premium feature that deploys an on-premises or remote replica which synchronizes content with its cloud parent registry and supports pulls even with limited connectivity. Geo-replication only spans Azure regions, not on-premises locations. Artifact cache pulls upstream images into the cloud registry, not into an on-premises replica. az acr import copies images between registries but does not provide a continuously synchronized local registry.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-100","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Litware Health has a compliance requirement that every newly pushed image must be invisible and unpullable to normal users until a security scan validates it and marks it as safe. Which Azure Container Registry configuration enforces this gate?","choices":["Enable the registry quarantine configuration","Enable the soft delete policy","Configure a retention policy for untagged manifests","Enable RBAC Registry + ABAC Repository Permissions"],"answer":[0],"explanation":"When quarantine is enabled on the registry, every pushed image is quarantined and cannot be pulled by normal users until it passes validation and is marked safe by a principal holding the quarantine role. Soft delete recovers accidentally deleted artifacts. A retention policy auto-purges untagged manifests. ABAC scopes repository permissions to identities but does not hold new images behind a scan.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-101","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Wide World Importers wants to recover images that operators occasionally delete by accident, keeping them restorable for a configurable number of days. The team also notices this policy conflicts with one they already considered. Which policy should they enable?","choices":["Configure a retention policy","Re-import the image with az acr import","Enable the quarantine configuration","Enable the soft delete policy"],"answer":[3],"explanation":"The soft delete policy retains deleted artifacts for a configurable window of 1 to 90 days, during which they can be listed and restored. It cannot be enabled together with the retention policy. A retention policy does the opposite by auto-deleting untagged manifests, and it cannot coexist with soft delete. Quarantine gates unscanned images rather than recovering deletions. az acr import only helps if a copy still exists in another registry.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-102","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Proseware deployed a custom Linux container to Azure App Service. The container listens on port 8080, but requests to the site fail and the container is restarted. What is the correct way to tell App Service which port the container listens on?","choices":["Set the WEBSITES_PORT app setting to 8080","Add a sidecar container with target port 8080","Set WEBSITE_SWAP_WARMUP_PING_PATH to the app root","Enable the Always On setting"],"answer":[0],"explanation":"By default App Service assumes a custom container listens on port 80. Setting the WEBSITES_PORT app setting to 8080 tells the platform which port the container is bound to. A sidecar adds a companion container and does not change the main container port. WEBSITE_SWAP_WARMUP_PING_PATH tunes slot-swap warm-up. Always On keeps the app loaded but does not map the container port.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-103","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee runs Web App for Containers and must pull its image from Azure Container Registry without storing any registry username or password. The app identity already has the AcrPull role on the registry. Which configuration enables the pull?","choices":["Enable the admin account on the registry and store its password in app settings","Set the WEBSITES_PORT app setting","Add DOCKER_REGISTRY_SERVER_PASSWORD as an app setting","Set the acrUseManagedIdentityCreds site config to true"],"answer":[3],"explanation":"After the app identity is granted AcrPull, setting acrUseManagedIdentityCreds to true configures the web app to pull the image using its managed identity, with no stored credentials. The admin account and DOCKER_REGISTRY_SERVER_PASSWORD both rely on stored credentials, which the requirement forbids. WEBSITES_PORT maps the container port and is unrelated to registry authentication.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions"},{"id":"1.1.1-104","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel runs a Linux Web App for Containers and deploys to a staging slot before swapping into production. Users experience cold-start errors immediately after each swap. Which configuration warms the app before the swap completes to eliminate this downtime?","choices":["Add the applicationInitialization element to Web.config","Increase the instance count","Enable auto swap on the production slot","Configure WEBSITE_SWAP_WARMUP_PING_PATH and WEBSITE_SWAP_WARMUP_PING_STATUSES"],"answer":[3],"explanation":"These app settings make App Service warm up the source slot by pinging a specified health path and waiting for expected status codes before completing the swap, which removes post-swap cold starts. The applicationInitialization element in Web.config is a Windows and IIS mechanism not used by Linux containers. Auto swap is not supported for Web App for Containers on Linux. Adding instances does not warm the new instances before the swap.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-105","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Alpine Ski House wants to run an OpenTelemetry Collector alongside the main application container in a single Linux App Service app so the two communicate over localhost, without deploying a separate app. Which approach should the team use?","choices":["Deploy the collector to a separate App Service app","Deploy the collector to a staging deployment slot","Add the collector as a sidecar container with isMain set to false","Add the collector as an init container"],"answer":[2],"explanation":"A sidecar-enabled App Service app has one main container (isMain true) and up to nine sidecar containers (isMain false) that share the same network namespace and communicate over localhost. A separate app would not share localhost with the main container. A deployment slot is a staging copy of the same app, not a co-located companion container. App Service does not provide a Kubernetes-style init container for this purpose.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-106","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Coho Winery runs several Dapr-enabled container apps in one Azure Container Apps environment. A Service Bus pub/sub Dapr component must be loaded only by two specific apps and by no others. Which mechanism restricts which apps load the component?","choices":["Add the two Dapr application IDs to the component scopes array","Name the component after the two apps","Restrict the component by revision label","List the container app resource names in the metadata"],"answer":[0],"explanation":"By default all Dapr-enabled apps in an environment load every deployed component. The scopes array restricts loading to the listed Dapr application IDs. Component naming does not control which apps load it. Revision labels govern traffic to revisions, not component scope. Scopes match the Dapr application ID, not the container app resource name.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-107","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Relecloud runs a stateful web app on Azure Container Apps and must route every HTTP request from a given client to the same replica. Which ingress setting achieves this?","choices":["Set clientCertificateMode to Require","Configure traffic splitting weights","Set stickySessions.affinity to sticky","Add ipSecurityRestrictions rules"],"answer":[2],"explanation":"Session affinity, also called sticky sessions, with the affinity value set to sticky routes all requests from a client to the same container app replica. clientCertificateMode configures mTLS client certificates. Traffic splitting distributes requests across revisions rather than pinning a client to a replica. IP restrictions filter source addresses.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-108","obj":"1.1.1","difficulty":"hard","type":"single","stem":"VanArsdel needs its Azure Container Apps ingress to require a client certificate from callers and forward it to the app so the application can perform mutual TLS authentication. Which ingress setting should be configured?","choices":["Set allowInsecure to false","Enable session affinity","Set clientCertificateMode to Require","Configure a CORS policy"],"answer":[2],"explanation":"Setting clientCertificateMode to Require makes the ingress require a client certificate and forward it to the app (in the X-Forwarded-Client-Cert header) for mTLS. allowInsecure only controls whether HTTP is redirected to HTTPS. Session affinity pins clients to replicas. A CORS policy governs cross-origin browser requests. None of these require a client certificate.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-109","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Trey Research runs a background processor on Azure Container Apps that should scale out based on the number of messages waiting in an Azure Service Bus queue and scale to zero when the queue is empty. Which scaling configuration meets this requirement?","choices":["Add an HTTP concurrency scale rule","Add a custom scale rule using the azure-servicebus KEDA scaler","Add a CPU utilization scale rule","Set minReplicas and maxReplicas only"],"answer":[1],"explanation":"Container Apps custom scale rules map to KEDA scalers. The azure-servicebus scaler scales on queue message count and supports scaling in to zero replicas when idle. HTTP rules scale on concurrent requests, not queue depth. CPU rules scale on processor usage and cannot scale to zero. Setting replica bounds alone provides no event-driven trigger.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-110","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Blue Yonder runs a container app on Azure Container Apps whose replicas write data that must survive replica restarts and be shared across all replicas. Which volume type should the app mount?","choices":["Mount an Azure Files share as a storage mount","Use the default ephemeral storage","Mount a secret volume","Add a Dapr output binding"],"answer":[0],"explanation":"An Azure Files storage mount provides durable storage that persists across container restarts and is shared by all replicas of the app. Ephemeral storage is per-replica and is lost on restart. A secret volume exposes secrets read-only rather than general application data. A Dapr output binding is an API call to an external service, not a mounted filesystem shared by replicas.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-111","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Fabrikam Media added a GPU user node pool to its Azure Kubernetes Service cluster. Only GPU workloads should schedule onto that pool, and ordinary application pods must be kept off it. Which configuration enforces this?","choices":["Apply a node taint to the pool and a matching toleration to the GPU pods","Add only a node label and a nodeSelector on the pods","Configure a Horizontal Pod Autoscaler","Cordon the GPU nodes"],"answer":[0],"explanation":"A node taint such as sku=gpu:NoSchedule repels every pod that lacks a matching toleration, so only the GPU pods that carry the toleration are scheduled onto the pool. A label with a nodeSelector attracts GPU pods but does not repel other pods from the pool. A Horizontal Pod Autoscaler scales replica count. Cordoning marks nodes unschedulable for all pods, including the GPU workloads.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-112","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Contoso Air runs pods on Azure Kubernetes Service that must authenticate to Azure Key Vault without any stored secrets, with each workload getting its own identity through its Kubernetes service account. Which approach should the team use?","choices":["Use the AKS kubelet managed identity","Configure Microsoft Entra Workload ID with a federated credential and an annotated service account","Use the cluster service principal","Grant the node pool a system-assigned identity"],"answer":[1],"explanation":"Microsoft Entra Workload ID federates a Kubernetes service account to a user-assigned managed identity through the OIDC issuer, giving each pod keyless, per-workload access to Azure resources such as Key Vault. The kubelet managed identity is a node-level identity used to pull images from ACR, not per-pod application access. The cluster service principal authenticates the cluster control plane to Azure. A node pool identity is still node-scoped rather than per-workload.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-113","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank wants a deployment on Azure Kubernetes Service to automatically increase and decrease its number of pod replicas based on observed CPU utilization. Which component provides this behavior?","choices":["The cluster autoscaler","The Horizontal Pod Autoscaler","The Vertical Pod Autoscaler","Node autoprovisioning"],"answer":[1],"explanation":"The Horizontal Pod Autoscaler adjusts the number of pod replicas of a workload based on observed metrics such as CPU utilization. The cluster autoscaler adds or removes nodes rather than pods. The Vertical Pod Autoscaler adjusts per-pod CPU and memory requests rather than replica count. Node autoprovisioning selects and provisions node SKUs, not pod replicas.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-114","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Humongous Insurance needs layer 7 HTTP routing by URL path inside its Azure Kubernetes Service cluster using a managed NGINX ingress controller, with certificates from Azure Key Vault and records in Azure DNS, and minimal operational overhead. Which option best fits?","choices":["Expose the app with a Service of type LoadBalancer","Enable the application routing add-on for managed NGINX ingress","Deploy Application Gateway for Containers","Deploy the Istio ingress gateway"],"answer":[1],"explanation":"The application routing add-on provides a managed in-cluster NGINX ingress controller with integrated Azure Key Vault certificate management and Azure DNS integration, and it requires minimal configuration. A Service of type LoadBalancer operates at layer 4 and cannot route by URL path. Application Gateway for Containers is an Azure-hosted gateway that exposes an FQDN rather than the in-cluster managed NGINX requested. The Istio ingress gateway adds a full service mesh, which is unnecessary overhead here.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-115","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Contoso Suites must host a containerized inference API that autoscales on Service Bus queue depth, scales to zero to control cost, and needs no Kubernetes cluster to operate. Which should you use?","choices":["Azure Container Apps with a KEDA queue scaler","Azure Kubernetes Service with a KEDA queue scaler","Azure Container Apps with a CPU scale rule","Azure App Service with metric autoscale"],"answer":[0],"explanation":"Container Apps gives serverless scale-to-zero with a KEDA queue scaler, meeting all three needs. AKS+KEDA adds a cluster to manage, the CPU rule ignores queue depth, and App Service cannot scale to zero.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-116","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. must let an AKS cluster pull from Azure Container Registry with no stored credentials and least privilege. What should you do?","choices":["Assign the AcrPull role to the cluster's managed identity","Enable the ACR admin user and store the password","Use a service principal with Contributor on the registry","Make the registry public"],"answer":[0],"explanation":"AcrPull on the managed identity is keyless and least-privilege. The admin user stores a password, Contributor over-grants, and a public registry removes access control.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-117","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Litware, Inc. must build an image in the cloud and push it, with no local Docker daemon. Which command replaces the blank?\n\n```\n# build in the cloud and push\n________ --registry myreg --image api:v2 .\n```","choices":["az acr build","docker build","az acr import","az acr update"],"answer":[0],"explanation":"az acr build builds and pushes in the registry with no local daemon. docker build needs a local daemon, import copies an existing image, and update changes registry settings.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-118","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Relecloud runs a container app that must read an API key from Key Vault and pick up rotations automatically, without redeploying. What should you do?","choices":["Reference the Key Vault secret's latest version from the app","Copy the current secret value into a Container Apps secret","Set the key as a plaintext environment variable","Bake the key into the image"],"answer":[0],"explanation":"A reference to the latest version surfaces rotations without redeploying. A copied value goes stale, a plaintext env var is insecure, and a baked key cannot rotate.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-119","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders sees AKS pods restart with OOMKilled. What is the root cause?","choices":["The container memory limit is below the app's usage","The node has too few CPUs","The image tag is wrong","The service has no endpoints"],"answer":[0],"explanation":"OOMKilled means the container exceeded its memory limit. Too few CPUs throttle, a wrong tag fails the pull, and missing endpoints break routing.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-120","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Coho Winery must cut Container Apps cost. Select two actions that reduce cost. (Select two.)","choices":["Enable scale to zero for idle periods","Use a consumption workload profile","Pin a high fixed replica count","Provision a dedicated GPU profile","Disable log collection entirely"],"answer":[0,1],"explanation":"Scale to zero and the consumption profile bill only for actual use. Fixed replicas and a dedicated GPU profile raise cost, and disabling logs harms observability without meaningfully cutting cost.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-121","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Wide World Importers must run a containerized GPU inference workload that scales to zero when idle, with no servers to manage. What should you use?","choices":["Azure Container Apps with a consumption (serverless) GPU profile","An always-on AKS GPU node pool","An App Service plan with a GPU","A dedicated GPU virtual machine"],"answer":[0],"explanation":"Container Apps serverless GPU runs on a consumption workload profile and scales to zero. The AKS pool, App Service GPU, and dedicated VM keep GPUs allocated and billing.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-122","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Contoso needs to host a containerized microservice that must scale to zero when idle, scale out on Azure Service Bus queue depth, use Dapr pub/sub for service-to-service calls, and require no node or cluster management. Which compute host meets all requirements?","choices":["Azure Kubernetes Service with a KEDA add-on","Azure App Service for Containers","Azure Container Instances","Azure Container Apps"],"answer":[3],"explanation":"Container Apps natively provides scale-to-zero, KEDA-based queue scaling, and managed Dapr with no cluster to operate. AKS can do KEDA and Dapr but forces you to manage the cluster, violating the no-management constraint. App Service for Containers has no native KEDA queue scaling or built-in Dapr and does not scale to zero for containers. Container Instances has no KEDA scale rules or built-in Dapr.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-123","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Fabrikam runs a complex platform that requires custom CNI networking, node-level taints and tolerations for GPU isolation, and a custom kube-scheduler configuration. Which host satisfies every requirement with the least friction?","choices":["Azure App Service for Containers","Azure Container Apps","Azure Kubernetes Service","Azure Container Instances"],"answer":[2],"explanation":"Only AKS exposes the full Kubernetes control plane, so custom CNI, node taints/tolerations, and scheduler configuration are all available. App Service and Container Apps abstract the nodes and scheduler away, so custom CNI and taints are not exposed. Container Instances offers no node pools, taints, or scheduler control at all.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-124","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which Azure Container Registry service tier is required to enable geo-replication?","choices":["Basic","Standard","Premium","Standard with the replication add-on"],"answer":[2],"explanation":"Geo-replication is a Premium-tier-only feature of Azure Container Registry. Basic and Standard do not support geo-replication. There is no Standard replication add-on; the capability is gated entirely to Premium.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-geo-replication"},{"id":"1.1.1-125","obj":"1.1.1","difficulty":"medium","type":"single","stem":"A CI pipeline at Northwind pushes images to a registry in East US. Pods in East US, West Europe, and Southeast Asia must pull from a single image reference (myreg.azurecr.io/app:tag) with in-region latency, sharing one set of credentials and role assignments. What is the best design?","choices":["Create one Premium registry and add geo-replicas in West Europe and Southeast Asia","Create three separate Standard registries and use az acr import to copy images to each","Put a Standard registry behind Azure Front Door for global caching","Create a Basic registry in each region and sync them with Azure Traffic Manager"],"answer":[0],"explanation":"A Premium registry with geo-replicas gives a single global endpoint, one set of credentials and role assignments, and routes each client to the nearest replica. Three separate registries mean three credential sets and three image references, breaking the single-reference and single-credential constraints. Front Door caching does not give a writable in-region registry endpoint and still uses one region for pulls. Separate Basic registries cannot be synced by Traffic Manager and multiply credentials.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-126","obj":"1.1.1","difficulty":"hard","type":"single","stem":"An AKS cluster must pull images from a private Azure Container Registry using keyless authentication. Which identity should receive the AcrPull role on the registry?","choices":["The cluster kubelet (node pool) managed identity","The user's Microsoft Entra account","The AKS control plane managed identity","The Azure subscription owner"],"answer":[0],"explanation":"The kubelet identity attached to the node pool performs the image pull, so it is the identity that needs AcrPull on the registry. A user account is not used for automated node pulls. The control plane identity manages cluster resources, not image pulls. Subscription owner is a broad control-plane role and is not the identity kubelet presents to the registry.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-127","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Tailwind Traders wants an App Service Linux custom container to pull from ACR using its system-assigned managed identity, with no admin account and no stored credentials. The identity is already enabled. Which two configuration actions are correct together?","choices":["Set acrUseManagedIdentityCreds to true and assign AcrPull to the identity on the registry","Set acrUserManagedIdentityID to the identity client ID and assign Contributor","Enable the ACR admin account and store the password as an app setting","Assign AcrPush to the identity and enable anonymous pull"],"answer":[0],"explanation":"For a system-assigned identity you set acrUseManagedIdentityCreds to true and grant that identity AcrPull (data-plane read) on the registry. acrUserManagedIdentityID is only for user-assigned identities, and Contributor is control-plane, not the data-plane pull role. Enabling the admin account contradicts the no-admin/no-credential requirement. AcrPush grants write access it does not need, and anonymous pull defeats the keyless private-pull goal.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-128","obj":"1.1.1","difficulty":"medium","type":"single","stem":"A pod on AKS shows a container status of OOMKilled with exit code 137. Which statement accurately describes what happened?","choices":["The whole pod was evicted by the kubelet because the node ran low on memory","The pod failed its readiness probe and was removed from the Service","The node was cordoned and drained during a rolling upgrade","The container exceeded its memory limit and was terminated by the kernel OOM killer, then restarted, while other containers in the pod can keep running"],"answer":[3],"explanation":"OOMKilled is a container-level event: the container that breaches its memory limit is killed by the Linux OOM killer (exit 137) and restarted; sibling containers can continue. Node-pressure eviction is a separate pod-level mechanism reported as Failed/Evicted, not OOMKilled. Readiness-probe failure removes the pod from Service endpoints but does not produce exit 137. Cordon/drain is an upgrade operation, not an OOM kill.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-129","obj":"1.1.1","difficulty":"hard","type":"single","stem":"A container at Woodgrove is intermittently inaccessible and its container keeps restarting with reason OOMKilled; the spec sets a memory limit of 256Mi. Which action addresses the root cause?","choices":["Add a liveness probe so Kubernetes restarts the container faster","Set memory requests and limits based on the app's measured usage (raise the limit if needed)","Increase the Deployment replica count to spread the load","Add more nodes to the cluster"],"answer":[1],"explanation":"OOMKilled means the container needs more memory than its limit allows; measuring actual usage and setting appropriate requests/limits is the root-cause fix. A liveness probe only restarts the container faster and treats the symptom. Adding replicas or nodes does not change a single container's per-container memory limit, so each replica still gets OOMKilled.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-130","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Before you can split incoming traffic between two revisions of an Azure Container App, what must you do first?","choices":["Enable multiple revision mode on the container app","Create a second Container Apps environment","Deploy the revisions as separate container apps","Enable Dapr on both revisions"],"answer":[0],"explanation":"Traffic splitting is only available in multiple revision mode; single revision mode always routes all traffic to the latest revision. A second environment or separate apps would not be two revisions of one app. Dapr is unrelated to revision traffic weighting.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-131","obj":"1.1.1","difficulty":"medium","type":"single","stem":"An operator updates the value of a secret referenced by a running Azure Container App. Which statement is correct?","choices":["The secret change automatically creates a new revision","The app must be deleted and recreated to read the new value","Secrets can only be changed by redeploying the entire environment","The change is application-scope, so no new revision is created and existing revisions must be restarted or a new revision deployed to pick up the value"],"answer":[3],"explanation":"Secrets are application-scope; changing them does not create a new revision, and existing revisions must be restarted (or a new revision deployed) to see the updated value. Secret changes do not trigger a new revision automatically. Deleting the app or redeploying the environment is unnecessary and far beyond what is required.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-132","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Relecloud wants a Container App to scale to zero when idle but keep at least two replicas when busy. Which scale-rule type prevents scaling to zero and must therefore be avoided as the only trigger if scale-to-zero is required?","choices":["Azure Service Bus queue length rule","HTTP concurrent-requests rule","CPU or memory utilization rule","Cron/scheduled rule"],"answer":[2],"explanation":"Apps that scale on CPU or memory load cannot scale to zero, so a CPU/memory rule as the sole trigger blocks scale-to-zero. Queue-length, HTTP, and scheduled KEDA rules all support scaling to zero; only resource (CPU/memory) rules keep at least one replica running.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-133","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Litware wants to run a GPU-accelerated inference Container App using serverless (Consumption) GPU that scales to zero. Which environment prerequisite must be satisfied?","choices":["A Consumption-only environment is sufficient","The app must run in a workload profiles environment; Consumption-only environments do not support GPU","GPU is available only on Azure Container Instances, not Container Apps","A Dedicated GPU profile must be added after the app is created"],"answer":[1],"explanation":"Serverless GPUs require a workload profiles environment; Consumption-only environments do not support GPU. A Consumption-only environment cannot host GPU. Container Apps does support serverless GPU (not only ACI). Dedicated GPU profiles must be configured when the environment is created, not added afterward, and are separate from serverless Consumption GPU.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-134","obj":"1.1.1","difficulty":"medium","type":"single","stem":"A nightly batch process at Proseware must run on a fixed cron schedule, execute to completion, and then stop. Which Azure Container Apps job trigger type fits best?","choices":["Manual","Event","Schedule","Ingress"],"answer":[2],"explanation":"A Schedule-triggered job runs on a cron expression, executes to completion, and stops, matching a nightly batch. Manual runs only on demand (a single execution you start). Event triggers scale on an event source, not a fixed clock. Ingress is not a job trigger type.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-135","obj":"1.1.1","difficulty":"hard","type":"single","stem":"An event-driven Container Apps job at Adventure Works must process a batch where up to 10 replicas run at once and the job is considered complete only after 200 replicas finish successfully. Which two properties encode this?","choices":["parallelism = 200 and replicaCompletionCount = 10","parallelism = 10 and replicaCompletionCount = 200","maxSurge = 10 and maxUnavailable = 200","minReplicas = 10 and maxReplicas = 200"],"answer":[1],"explanation":"parallelism caps concurrent replicas (10) and replicaCompletionCount sets the number of successful completions required for overall completion (200). Swapping the values would run 200 at once and finish after 10, the opposite of the requirement. maxSurge/maxUnavailable are Kubernetes rolling-update fields, and minReplicas/maxReplicas are app scaling settings, not job completion controls.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-136","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee wants application images to rebuild automatically whenever the shared base image is patched and pushed to the registry, with no manual step. Which ACR Tasks capability provides this?","choices":["A quick task run with az acr build","A multi-step task run manually with az acr run","A retention policy on the registry","A base image update trigger on an automatically triggered task"],"answer":[3],"explanation":"An automatically triggered task with a base image update trigger detects the new base image and rebuilds dependent application images automatically. A quick task and a manually run multi-step task both require you to invoke them. A retention policy manages image cleanup, not rebuilds.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-137","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Graphic Design Institute uses ACR Tasks with a Git repository context. Which trigger is enabled by default?","choices":["Pull request trigger","Commit trigger","Timer/scheduled trigger","Base image update trigger for public Docker Hub bases"],"answer":[1],"explanation":"For a Git context, the commit trigger is enabled by default; a code commit starts a build. Pull-request triggers are not enabled by default. Timer and base-image triggers must be configured explicitly and are not the default Git trigger.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-138","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Which statement about the az acr build command is correct?","choices":["It builds the image in the cloud close to the registry and pushes it to the registry on success, without requiring a local Docker install","It builds the image on your local Docker daemon and then uploads it","It only validates the Dockerfile syntax without producing an image","It requires the registry admin account to be enabled"],"answer":[0],"explanation":"az acr build performs a quick task that builds natively in Azure and pushes the successful image to the registry, needing no local Docker engine. It does not use the local Docker daemon, does more than syntax validation, and authenticates via Azure CLI rather than requiring the admin account.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-139","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Best For You Organics must copy an image from Docker Hub into a private ACR from a management workstation that has no Docker engine installed and cannot run a build. Which command accomplishes this?","choices":["docker pull then docker push","az acr build","az acr import","az acr task create"],"answer":[2],"explanation":"az acr import copies images between registries (including Docker Hub) directly, with no local Docker engine and no build step. docker pull/push requires a Docker engine. az acr build runs a build from a Dockerfile rather than copying an existing image. az acr task create defines an ongoing task, not a one-time import.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-140","obj":"1.1.1","difficulty":"medium","type":"single","stem":"In an App Service Linux custom container with sidecar support, which container receives inbound external traffic?","choices":["Every container in the app receives external traffic","The container with the lowest target port","All sidecar containers, but not the main container","Only the container with isMain set to true"],"answer":[3],"explanation":"Only the main container (isMain = true) receives external traffic; sidecars have isMain = false. Sidecars do not receive external traffic, port number does not determine the main container, and the inverse (sidecars only) is wrong.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-141","obj":"1.1.1","difficulty":"hard","type":"single","stem":"A Deployment at Trey Research has 4 replicas and must stay serving during updates: at least 3 pods available at all times and extra pods allowed temporarily. Which rolling-update settings meet both constraints?","choices":["maxUnavailable = 1 and maxSurge = 1","maxUnavailable = 2 and maxSurge = 0","maxUnavailable = 0 and maxSurge = 0","strategy type Recreate"],"answer":[0],"explanation":"maxUnavailable = 1 keeps at least 3 of 4 available, and maxSurge = 1 permits a temporary extra pod so the update proceeds smoothly. maxUnavailable = 2 would drop to 2 available, breaking the at-least-3 rule. maxUnavailable = 0 with maxSurge = 0 makes progress impossible. Recreate terminates all old pods first, causing downtime.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-142","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which statement about the maxUnavailable setting during AKS node pool upgrades is correct?","choices":["It can be set on any node pool, including system node pools","It cannot be set on system node pools","It always creates surge nodes before draining","It is ignored unless Dapr is enabled"],"answer":[1],"explanation":"maxUnavailable cannot be set on AKS system node pools; it applies to user node pools for in-place, cordon-and-drain upgrades. It is specifically disallowed on system node pools. Unlike max surge, maxUnavailable does not create surge nodes; it cordons and drains in place. Dapr is unrelated to node upgrades.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-143","obj":"1.1.1","difficulty":"medium","type":"single","stem":"VanArsdel must dedicate a GPU node pool so that only GPU workloads run there AND those GPU pods run nowhere else. Which combination achieves both directions of isolation?","choices":["A nodeSelector on the pods only","A NoSchedule taint on the nodes only","A NoSchedule taint plus matching toleration, and a nodeSelector or node affinity on the pods for the GPU node label","A PreferNoSchedule taint on the nodes only"],"answer":[2],"explanation":"The taint plus toleration keeps non-GPU pods off the GPU nodes; the nodeSelector/affinity forces GPU pods onto the labeled GPU nodes, covering both directions. A nodeSelector alone still lets other pods land on GPU nodes because it does not repel them. A taint alone repels others but does not force GPU pods onto those nodes. PreferNoSchedule is only a soft preference, so it does not guarantee isolation.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-144","obj":"1.1.1","difficulty":"hard","type":"single","stem":"On AKS, how does a nodeSelector differ from a node taint?","choices":["A nodeSelector repels non-matching pods; a taint attracts matching pods","They are identical and interchangeable","A nodeSelector works only with spot node pools","A nodeSelector prioritizes matching nodes but does not repel other pods, whereas a taint prevents non-tolerating pods from scheduling"],"answer":[3],"explanation":"Pods without a matching nodeSelector can still be scheduled on labeled nodes (soft steering), while a taint hard-blocks pods that lack a matching toleration. The first option reverses their behaviors. They are not identical, and nodeSelector is not restricted to spot node pools.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-145","obj":"1.1.1","difficulty":"easy","type":"single","stem":"To schedule a pod onto an AKS Spot node pool, which pod configuration is required to match the default Spot taint kubernetes.azure.com/scalesetpriority=spot:NoSchedule?","choices":["Only a higher pod priority class","A toleration for the spot taint (typically with node affinity for the spot label)","A larger memory request","An init container that removes the taint"],"answer":[1],"explanation":"The Spot node pool is tainted NoSchedule, so the pod needs a matching toleration (commonly paired with node affinity for the spot label) to land there. Priority class and larger memory requests do not satisfy a taint. Pods cannot remove node taints via an init container.","ref":"https://learn.microsoft.com/azure/aks/spot-node-pool"},{"id":"1.1.1-146","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel is migrating an existing Windows web application into a container and needs deployment slots for staged swaps, built-in custom domain and managed TLS, and minimal operations overhead. Which host is the best fit?","choices":["Azure Kubernetes Service","Azure Container Apps","Azure App Service for Containers","Azure Container Instances"],"answer":[2],"explanation":"App Service offers deployment slots, built-in custom domains and managed certificates, and low operational overhead for a web app. AKS is operations-heavy and has no built-in slots. Container Apps uses revisions and traffic splitting rather than slots and lacks the same integrated TLS/domain web workflow. Container Instances has no slots, autoscaling, or managed TLS story.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-147","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Which statement about enabling Dapr on an Azure Container App is correct?","choices":["Dapr settings are a revision-scope change and create a new revision","Dapr settings are an application-scope change and do not create a new revision","Dapr can only be enabled by recreating the environment","Dapr requires the Dedicated plan"],"answer":[1],"explanation":"Dapr configuration lives in the application-scope (configuration) section, so changing it does not create a new revision. It is not revision-scope, does not require recreating the environment, and does not require the Dedicated plan.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-148","obj":"1.1.1","difficulty":"easy","type":"single","stem":"A KEDA scale rule on a Container App must authenticate to a Service Bus queue using a connection string that cannot be stored in plain text in the template. What is the recommended approach?","choices":["Hard-code the connection string in the scale rule metadata","Store it in a Kubernetes ConfigMap","Pass it as a command-line argument to the container","Reference an application secret from the scale rule authentication (secretRef)"],"answer":[3],"explanation":"Container Apps secrets are application-scope and can be referenced from scale-rule authentication (secretRef), keeping the value out of plaintext template fields. Hard-coding or passing as an argument exposes the secret. Container Apps does not expose Kubernetes ConfigMaps to the user for this purpose.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-149","obj":"1.1.1","difficulty":"medium","type":"single","stem":"For a Deployment that must update with zero downtime, which strategy type should you choose over Recreate?","choices":["RollingUpdate","Recreate","Canary (a built-in strategy type)","OnDelete"],"answer":[0],"explanation":"RollingUpdate incrementally replaces pods so the app stays available; Recreate terminates all old pods first, causing downtime. Recreate causes downtime. Canary and Blue are deployment patterns, not built-in Deployment strategy type values. OnDelete is a DaemonSet/StatefulSet update strategy, not a Deployment strategy type.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-150","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Which Azure Container Registry tier is required to use Private Link with private endpoints?","choices":["Basic","Standard","Premium","Any tier with the networking add-on"],"answer":[2],"explanation":"Private endpoints/Private Link for ACR is a Premium-tier capability. Basic and Standard do not support private endpoints, and there is no separate networking add-on that unlocks them below Premium.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-151","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard needs GPU-accelerated AI inference that scales to zero when idle, bills per second, and requires no Kubernetes cluster to manage. Which option best fits?","choices":["An AKS GPU node pool","Azure Container Apps with a serverless (Consumption) GPU workload profile","An App Service Premium plan with a GPU","Azure Container Instances with a GPU SKU (generally available)"],"answer":[1],"explanation":"Container Apps serverless GPU provides scale-to-zero, per-second billing, and no cluster management for GPU inference. An AKS GPU node pool requires cluster management and does not natively scale GPU nodes to zero per-second. App Service does not offer GPU compute. ACI GPU SKUs are not the managed scale-to-zero, per-second serverless GPU experience described.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-152","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which characteristic accurately describes Azure Container Registry geo-replication?","choices":["It uses an active-active model with eventual consistency, so any geo-replica accepts pushes, pulls, and deletes","It uses a primary-secondary model where only the home region accepts writes","Each geo-replica requires its own separate credentials and image reference","Geo-replicas are strongly consistent, so a cross-region pull immediately after a push always succeeds"],"answer":[0],"explanation":"ACR geo-replication is active-active with eventual consistency; every replica is writable and content syncs in the background. It is not primary-secondary. Replicas share one credential set and one global endpoint. Consistency is eventual, so a cross-region pull immediately after a push can fail with manifest unknown until replication catches up.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-geo-replication"},{"id":"1.1.1-153","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Complete the Azure CLI command that runs an ACR quick task to build an image in the cloud and push it to the registry on success.\n\n```\naz acr ________ \\\n  --registry $ACR_NAME \\\n  --image webapp:v1 \\\n  --file Dockerfile .\n```","choices":["run","build","task","import"],"answer":[1],"explanation":"az acr build performs a quick task that builds the image in Azure and pushes it to the registry when the build succeeds. az acr run executes a YAML multi-step task, not a single Dockerfile build+push. az acr task defines or manages a persistent task. az acr import copies an existing image and does not build from a Dockerfile.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-154","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Complete the kubectl command that performs a rolling update by changing the container image of a running Deployment.\n\n```\nkubectl ________ deployment/web \\\n  web=myregistry.azurecr.io/web:v2\n```","choices":["apply image","set image","patch image","edit image"],"answer":[1],"explanation":"kubectl set image updates the container image of a Deployment and triggers a rolling update. There is no kubectl apply image, patch image, or edit image subcommand; apply takes a manifest file, patch takes a patch document, and edit opens an editor.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-155","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Complete the kubectl command that shows the events and container statuses (including an OOMKilled reason) for a specific pod.\n\n```\nkubectl ________ pod mypod -n prod\n```","choices":["get","logs","describe","top"],"answer":[2],"explanation":"kubectl describe pod shows the Events and Container Statuses sections where the OOMKilled reason and exit code appear. kubectl get lists pods without the detailed reason. kubectl logs shows container output, not termination reason. kubectl top shows resource usage metrics, not the OOMKilled event.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-156","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Complete the Azure CLI command that assigns 80 percent of traffic to one Container Apps revision and 20 percent to another.\n\n```\naz containerapp ingress traffic ________ \\\n  --name orders --resource-group rg \\\n  --revision-weight rev-a=80 rev-b=20\n```","choices":["update","split","set","route"],"answer":[2],"explanation":"az containerapp ingress traffic set configures the per-revision traffic weights. split, update, and route are not valid subcommands of az containerapp ingress traffic; the weighting verb is set.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-157","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Complete the Azure CLI command that copies an image from Docker Hub into a private Azure Container Registry without a local Docker engine.\n\n```\naz acr ________ \\\n  --name myregistry \\\n  --source docker.io/library/nginx:latest \\\n  --image nginx:latest\n```","choices":["copy","pull","import","load"],"answer":[2],"explanation":"az acr import copies an image from another registry (including Docker Hub) directly into ACR, no Docker engine required. az acr copy, az acr pull, and az acr load are not valid ACR commands for this operation; import is the correct verb.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-158","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Complete the Azure CLI command that creates an AKS node pool tainted so only tolerating pods (for example GPU workloads) can schedule on it.\n\n```\naz aks nodepool add \\\n  --resource-group rg --cluster-name aks \\\n  --name gpunp \\\n  --________ sku=gpu:NoSchedule\n```","choices":["labels","node-taints","annotations","node-labels"],"answer":[1],"explanation":"--node-taints applies the taint (key=value:effect) to every node in the new node pool so only pods with a matching toleration schedule there. --labels and --node-labels add metadata used by nodeSelector but do not repel pods. --annotations is not a scheduling-restriction parameter.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-159","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Northwind wants an App Service web app to pull a private ACR image using its already-enabled system-assigned managed identity, with no admin account and no stored registry credentials. Which two actions are required? (Select two.)","choices":["Assign the AcrPull role to the web app's identity scoped to the registry","Set acrUseManagedIdentityCreds to true on the web app","Enable the ACR admin account and store the password as an app setting","Assign the Contributor role to the web app on the registry","Set acrUserManagedIdentityID to the system identity's client ID"],"answer":[0,1],"explanation":"AcrPull grants the identity data-plane pull rights, and acrUseManagedIdentityCreds = true tells App Service to authenticate to ACR with that managed identity. Enabling the admin account and storing a password contradicts the keyless requirement. Contributor is a broad control-plane role, not the pull role. acrUserManagedIdentityID applies only to user-assigned identities, not the system-assigned identity in this scenario.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-160","obj":"1.1.1","difficulty":"easy","type":"multi","stem":"Which two Azure Container Registry capabilities require the Premium service tier? (Select two.)","choices":["Geo-replication","Private endpoints (Private Link)","Webhook integration","Authentication with Microsoft Entra ID","The registry admin account"],"answer":[0,1],"explanation":"Geo-replication and private endpoints are Premium-only ACR features. Webhook integration, Microsoft Entra authentication, and the admin account are available on Basic and Standard tiers, so they do not require Premium.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-161","obj":"1.1.1","difficulty":"medium","type":"multi","stem":"Microsoft Defender for Cloud scans images in an Azure Container Registry. Which two of the following are documented scan triggers? (Select two.)","choices":["On push to the registry","On import into the registry","On deletion of a tag","On creation of the registry","On geo-replica synchronization"],"answer":[0,1],"explanation":"Defender scans images on push and on import (in addition to periodic rescans of recently pulled images). Tag deletion, registry creation, and geo-replica sync are not documented scan triggers; scanning is tied to images entering the registry, not to deletes or replication events.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-162","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Which two changes to an Azure Container App are application-scope and therefore do NOT create a new revision? (Select two.)","choices":["Updating a secret value","Changing traffic-splitting rules","Changing the container image","Adding a scale rule","Changing the revision suffix"],"answer":[0,1],"explanation":"Secret values and traffic-splitting rules live in the configuration (application-scope) section, so changing them does not create a new revision. Changing the container image, adding a scale rule, and changing the revision suffix are all template (revision-scope) changes that create a new revision.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-163","obj":"1.1.1","difficulty":"easy","type":"multi","stem":"Wide World Importers must ensure GPU pods land only on GPU nodes and that non-GPU pods never occupy those expensive nodes. Which two measures together enforce this? (Select two.)","choices":["Apply a NoSchedule taint to the GPU node pool and add a matching toleration to the GPU pods","Add a nodeSelector or node affinity for the GPU node label to the GPU pods","Increase the Deployment replica count for the GPU workload","Set maxUnavailable to 0 on the GPU node pool","Apply only a PreferNoSchedule taint to the GPU nodes"],"answer":[0,1],"explanation":"The NoSchedule taint plus toleration keeps non-GPU pods off the GPU nodes, and the nodeSelector/affinity forces GPU pods onto the labeled GPU nodes. Raising replica count does not control placement. maxUnavailable affects upgrades, not scheduling. PreferNoSchedule is only a soft preference and does not guarantee non-GPU pods stay off.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-164","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Contoso maintains a base image and an application image in the same Premium registry. An ACR task must rebuild the application image automatically whenever the base image is patched. The task was created but never runs on a base-image push. Which condition must be satisfied for the base-image update trigger to fire?","choices":["The base image must be re-tagged with a new unique version tag on each patch so the trigger can compare digests","The application image must be a buildtime stage in a multi-stage Dockerfile so ACR can track it as an intermediate image","The task must be run at least once so ACR can determine and track the application image dependencies, and the base image must carry a stable tag","The base-image-trigger-enabled property must be explicitly set to False so ACR switches to dependency polling"],"answer":[2],"explanation":"ACR only tracks dependencies after the task builds the image at least once, and it triggers only when the base image uses a stable tag such as node:9-alpine. A new unique version tag does NOT trigger a rebuild; only stable-tag updates do. base-image-trigger-enabled is True by default and setting it False disables the trigger. ACR tracks base images for runtime (application) images, not intermediate buildtime stages in multi-stage Dockerfiles.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-165","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Fabrikam converts a registry to RBAC Registry + ABAC Repository Permissions mode. A service principal that previously held AcrPush now fails to push images. The team wants the principal to push to every repository, exactly as before. Which action restores registry-wide push access?","choices":["Assign the Container Registry Repository Writer role without any ABAC conditions","Assign the Owner role, which grants data plane push permissions in ABAC-enabled registries","Assign the Container Registry Repository Writer role with an ABAC condition matching a repository wildcard prefix","Reassign the legacy AcrPush role, which is honored again once ABAC conditions are added"],"answer":[0],"explanation":"An ABAC-enabled role assigned without conditions acts as a registry-wide assignment, equivalent to the legacy AcrPush role. A wildcard-prefix condition scopes the assignment to matching repositories only, not registry-wide. Legacy AcrPush is not honored in ABAC-enabled registries regardless of conditions. Owner in an ABAC-enabled registry grants only control plane permissions, not data plane push.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions"},{"id":"1.1.1-166","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Tailwind Traders grants a monitoring identity the Container Registry Repository Reader role scoped with an ABAC condition to the payments repository. The identity can pull from payments but the vulnerability scanner cannot enumerate the registry catalog to discover other repositories. Which additional role assignment is required, and how must it be scoped?","choices":["Assign Container Registry Repository Catalog Lister, which cannot take ABAC conditions and therefore lists all repositories","Assign the Reader control plane role scoped to the registry to enable catalog enumeration","Assign Container Registry Repository Contributor scoped to payments to inherit catalog listing","Add a second ABAC condition to the Repository Reader assignment granting the _catalog action"],"answer":[0],"explanation":"Repository Reader does not grant catalog listing; the separate Catalog Lister role does, and it does not support ABAC conditions so it always lists all repositories. ABAC conditions cannot add catalog list permission to Repository Reader. Repository Contributor also lacks catalog list permission. The control plane Reader role does not grant data plane catalog enumeration.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions"},{"id":"1.1.1-167","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Adventure Works must give a fleet of IoT devices individual, time-limited pull access to a single repository, without creating Microsoft Entra identities for each device. Which authentication mechanism meets all three constraints?","choices":["The registry admin account shared across all devices","Non-Microsoft Entra repository-scoped tokens paired with a scope map","Container Registry Repository Reader role assignments with ABAC repository conditions","AKS cross-tenant service principal role assignments"],"answer":[1],"explanation":"Non-Entra tokens with scope maps provide scoped, time-limited repository access without requiring a Microsoft Entra identity per device. ABAC role assignments require Microsoft Entra identities, which the scenario forbids. The single admin account is registry-wide and not per-device. Cross-tenant service principals are Entra-based and not per-device scoped.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-168","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Northwind configures ACR-to-ACR artifact caching so a downstream Premium registry mirrors a repository from an upstream registry. Pulls succeed but the team must avoid storing any username or password in Azure Key Vault. Which configuration satisfies the no-stored-credentials constraint while still authenticating to the upstream registry?","choices":["Authenticate with a user-assigned managed identity granted Container Registry Repository Reader on the ABAC-enabled upstream registry, referenced by the cache rule --identity parameter","Enable anonymous pull on the upstream registry and create the cache rule with no credentials","Create a credential set in Key Vault holding the upstream admin username and password, referenced by -c on the cache rule","Use a non-Entra repository-scoped token from the upstream registry stored as a Key Vault secret"],"answer":[0],"explanation":"ACR-to-ACR caching authenticates with a user-assigned managed identity holding Repository Reader on the ABAC-enabled upstream registry, so no credentials are stored in Key Vault. A credential set stores the username and password in Key Vault, which is forbidden. Anonymous pull is not the azurecr.io upstream path and weakens security. A token stored as a Key Vault secret still stores a credential.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-169","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank sources images from Docker Hub through an ACR artifact cache rule to avoid Docker Hub rate limits. Anonymous pulls of these public images previously worked directly. What is required to create the Docker Hub cache rule?","choices":["Nothing extra, because Docker Hub cache rules are created without credentials like Microsoft Artifact Registry","The Basic tier is insufficient; artifact cache requires the Premium tier for Docker Hub","A connected registry in ReadOnly mode acting as the Docker Hub proxy","A credential set, because Docker Hub as an artifact cache upstream supports authenticated pulls only"],"answer":[3],"explanation":"As an artifact cache upstream, Docker Hub supports authenticated pulls only, so a credential set is required to create the cache rule. Unlike Microsoft Artifact Registry which supports unauthenticated pulls, Docker Hub requires credentials. A connected registry is a separate on-premises feature, not a Docker Hub proxy. Artifact cache is available in Basic, Standard, and Premium tiers, not Premium only.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-170","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Relecloud deploys a connected registry on an Azure Arc-enabled Kubernetes cluster. The parent cloud registry is in ReadOnly mode. The on-premises team wants the connected registry in ReadWrite mode so developers can push locally and sync up to the cloud. Why does creation of the ReadWrite child fail?","choices":["ReadWrite mode is only valid when the connected registry is deployed on an IoT Edge device, not on Arc-enabled Kubernetes","A connected registry must be compatible with its parent; if the parent uses ReadOnly mode, the child must also use ReadOnly","ReadWrite requires the parent registry to be geo-replicated to at least two regions first","The child inherits the parent mode automatically, so the explicit --mode ReadWrite flag is rejected as redundant"],"answer":[1],"explanation":"If the parent registry uses ReadOnly mode, child registries must also use ReadOnly; only a ReadWrite parent allows either mode in children. Deployment target (Arc-enabled Kubernetes vs IoT Edge) does not govern the mode. Geo-replication is unrelated to connected registry mode compatibility. The mode is not silently inherited; the constraint is a compatibility rule with the parent, not a redundancy rejection.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-171","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Proseware runs a CI pipeline that pushes myapp:v1 to the East US geo-replica of a Premium registry, then AKS pods in West Europe immediately pull myapp:v1 and intermittently fail with manifest unknown. Given ACR geo-replication uses an active-active model with eventual consistency, which mitigation directly addresses the failure?","choices":["Move ACR Tasks to the West Europe region so the push originates closer to the consumers","Disable eventual consistency on the registry so all geo-replicas update synchronously","Switch the registry to a primary-secondary replication model so only East US accepts writes","Have pods pull from the West Europe regional endpoint after a webhook confirms replication completed in that geo-replica, or add retry with backoff"],"answer":[3],"explanation":"Eventual consistency means a cross-region pull can race replication; using webhooks to confirm replication or adding retry with backoff resolves the manifest unknown failures. ACR geo-replication is always active-active; there is no primary-secondary option to select. Synchronous consistency cannot be enabled; the model is eventual by design. ACR Tasks are bound to the home region and cannot be relocated to a replica; this does not fix cross-region replication lag.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-172","obj":"1.1.1","difficulty":"easy","type":"single","stem":"VanArsdel enables regional endpoints on a geo-replicated Premium registry and pins East US AKS clusters to myregistry.eastus.geo.azurecr.io for predictable routing. During an East US regional degradation, those clusters stop pulling and are not rerouted. Why?","choices":["Regional endpoints are Basic-tier only and lack the failover logic present in Premium","Health-aware failover applies only to the global endpoint; a regional endpoint talks directly to one geo-replica and is not automatically rerouted","The home region must be East US for regional-endpoint failover to activate","Regional endpoints require dedicated data endpoints, and without them failover is disabled"],"answer":[1],"explanation":"Health-aware failover reroutes only global endpoint traffic; when you pin to a regional endpoint you target one geo-replica directly and ACR does not auto-reroute if that region degrades. Dedicated data endpoints affect layer blob download paths, not failover eligibility. The home region does not govern regional-endpoint failover. Regional endpoints are a Premium-tier feature, not Basic; the tier is not the cause.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-173","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Litware disables public network access on a Premium registry and adds a private endpoint. Microsoft Defender for Cloud vulnerability scanning of pushed images stops producing findings. Which single setting restores scanning while keeping public access disabled?","choices":["Re-enable public network access temporarily during each daily rescan window","Assign the Defender scanner the AcrQuarantineReader role on the registry","Enable the network setting that allows trusted Microsoft services to access the registry","Switch the registry to RBAC Registry + ABAC Repository Permissions mode"],"answer":[2],"explanation":"When network rules restrict a registry, enabling allow trusted Microsoft services lets Defender for Cloud authenticate and pull images to scan them. Re-enabling public access defeats the requirement to keep it disabled. AcrQuarantineReader governs quarantined images, not Defender network access. The role assignment permission mode does not control network access for the scanner.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-174","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Munson's Pickles pushes an image to a registry monitored by Microsoft Defender for Containers, remediates a critical finding, and pushes the fixed image with the same tag. Later, Defender still reports the old vulnerability. Given how Defender scans registry images, what is the most likely explanation?","choices":["The old image still exists in the registry and can be pulled by its digest, so its findings persist until it is removed","Defender only scans images on the first push and never rescans after remediation","Retagging an image prevents Defender from scanning it entirely","Findings for the old image are removed within one hour of any new push to the registry"],"answer":[0],"explanation":"Reassigning a tag leaves the old image resolvable by digest; if it has findings and can still be pulled, Defender continues to surface those vulnerabilities. Defender performs daily rescans of images pushed or pulled in the last 30 days, so it does rescan. Retagging does not block scanning. Finding removal is tied to image deletion, not to a new push of a different image.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-175","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard implements the Quarantine pattern for third-party OCI artifacts. The orchestrator imports an external image into an untrusted quarantine registry, runs CVE and malware checks, and only then promotes it. Which statement about the quarantine registry's role is correct?","choices":["It holds a local copy of the image so validations run against tampering-resistant, workload-isolated content before promotion to the trusted registry","It is the same registry as the trusted store, distinguished only by a repository namespace","It replaces the need for Microsoft Defender for Containers scanning on the trusted registry","It rewrites the image layers to strip detected vulnerabilities before promotion"],"answer":[0],"explanation":"The quarantine registry imports a local copy that is isolated from workloads during validation, protecting against tampering and consumption until the image is deemed trusted. The quarantine process does not change the artifact composition; it validates, it does not remediate layers. Quarantine and trusted stores are segmented, not the same registry with a namespace. Defender continues to cover all registries; quarantine does not replace it.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-176","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Fourth Coffee runs a custom Linux container in Azure App Service. The container listens on port 8080, but App Service returns HTTP errors because it forwards requests to the default port. The team wants the fewest changes. Which single configuration resolves this?","choices":["Set WEBSITE_SWAP_WARMUP_PING_PATH to the port number","Enable the sidecar feature and route port 8080 through a proxy sidecar","Set the WEBSITES_PORT app setting to 8080","Expose two ports in the Dockerfile so App Service can negotiate the correct one"],"answer":[2],"explanation":"App Service assumes port 80 by default; setting WEBSITES_PORT to the container's listening port tells App Service where to forward HTTP requests. App Service allows a container to expose only one port for HTTP; adding a second does not help. WEBSITE_SWAP_WARMUP_PING_PATH configures slot-swap warm-up, not the container port. A proxy sidecar is unnecessary complexity when WEBSITES_PORT solves it directly.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-177","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Alpine Ski House wants its App Service custom container to pull its image from Azure Container Registry without any stored registry credentials, using a user-assigned managed identity. Which two-part configuration is required?","choices":["Enable the system-assigned identity only, because user-assigned identities cannot pull from ACR","Grant the identity Owner on the registry and set WEBSITES_PORT to the registry login server","Grant the identity AcrPull on the registry, set acrUseManagedIdentityCreds to true, and set acrUserManagedIdentityID to the identity client ID","Store the registry admin credentials as slot settings and mark them sticky"],"answer":[2],"explanation":"The app needs AcrPull on the registry, acrUseManagedIdentityCreds set to true, and for a user-assigned identity, acrUserManagedIdentityID set to that identity's client ID. Owner is excessive and WEBSITES_PORT is unrelated to registry auth. User-assigned identities are explicitly supported for ACR pull. Storing admin credentials contradicts the credential-free requirement.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-178","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Trey Research enables a sidecar-enabled Linux custom container app in App Service with an nginx main container and an OpenTelemetry collector sidecar. External HTTP traffic must reach only nginx. How is this guaranteed in the sitecontainers configuration?","choices":["Only the container with the highest target-port receives external traffic","Each sidecar sets a WEBSITES_PORT value lower than the main container's port","The collector sidecar is deployed to a separate deployment slot from the main container","The main container is marked isMain true and receives external traffic; every sidecar is marked isMain false"],"answer":[3],"explanation":"In a sidecar-enabled Linux app, only the container with isMain set to true receives external traffic; all sidecars set isMain to false. WEBSITES_PORT ordering does not determine which container is public. Sidecars share the app, not separate slots. Target-port magnitu
