 capture deletes; incremental snapshot mode and point-in-time mode are not Azure Cosmos DB change feed modes.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-32","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Which change feed mode is enabled by default in Azure Cosmos DB?","choices":["Full export mode","Archive mode","Latest version mode","All versions and deletes mode"],"answer":[2],"explanation":"Latest version mode is the default change feed mode, providing the latest version of each item from creates and updates. Full export mode and archive mode are not change feed modes, and all versions and deletes mode must be explicitly enabled with continuous backups.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-33","obj":"2.1.1","difficulty":"hard","type":"single","stem":"To read the Azure Cosmos DB change feed in all versions and deletes mode, what must be configured on the account?","choices":["Strong consistency","A hierarchical partition key","A vector index","Continuous backups"],"answer":[3],"explanation":"All versions and deletes mode requires continuous backups to be configured, which creates the all versions and deletes change feed. Strong consistency, hierarchical partition keys, and vector indexes are unrelated requirements and do not enable this change feed mode.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-34","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Which system function performs a vector similarity search in an Azure Cosmos DB for NoSQL query?","choices":["StringEquals","ArrayLength","VectorDistance","DateTimeAdd"],"answer":[2],"explanation":"The VectorDistance system function computes the distance between a stored vector and a query vector to rank items by similarity. StringEquals compares strings, ArrayLength counts array elements, and DateTimeAdd manipulates dates; none perform vector search.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-35","obj":"2.1.1","difficulty":"medium","type":"single","stem":"What is the default distance function used for vector search in Azure Cosmos DB for NoSQL?","choices":["Cosine","Euclidean","Dot product","Manhattan"],"answer":[0],"explanation":"Cosine is the default distance function and works well for general text similarity with embeddings such as those from Azure OpenAI. Euclidean and Dot product are supported alternatives but are not the default, and Manhattan distance is not offered.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-36","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which of the following is a valid vector index type in Azure Cosmos DB for NoSQL?","choices":["B-tree","diskANN","columnstore","bitmap"],"answer":[1],"explanation":"diskANN is a supported vector index type in Azure Cosmos DB for NoSQL, alongside flat and quantizedFlat. B-tree, columnstore, and bitmap are traditional relational index types and are not vector index options in Azure Cosmos DB for NoSQL.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-37","obj":"2.1.1","difficulty":"easy","type":"single","stem":"In vector search, a vector embedding is best described as which of the following?","choices":["An encrypted copy of the original document","A compressed backup of a container","A pointer to a physical partition","A numerical representation of data in a high-dimensional space"],"answer":[3],"explanation":"A vector embedding is a mathematical, numerical representation of data in a high-dimensional space where position reflects the data's characteristics. An embedding is not encryption, a backup, or a partition pointer; it captures semantic meaning as coordinates in vector space.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-38","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Which practice does Microsoft recommend for vector search queries in Azure Cosmos DB for NoSQL?","choices":["Always disable the vector index before querying","Always include a TOP N clause in the SELECT statement","Always use strong consistency","Always query without an ORDER BY clause"],"answer":[1],"explanation":"Microsoft recommends always using a TOP N clause so the vector search returns a bounded result set and avoids unnecessary RU cost and latency. Disabling the index, forcing strong consistency, or omitting ORDER BY do not improve vector query efficiency and can hurt performance or accuracy.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-39","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which set of distance functions does Azure Cosmos DB for NoSQL support for vector search?","choices":["Cosine, Euclidean, and Dot product","Hamming, Jaccard, and Levenshtein","Manhattan, Chebyshev, and Minkowski","Haversine, Great-circle, and Vincenty"],"answer":[0],"explanation":"Azure Cosmos DB for NoSQL supports Cosine, Euclidean (L2), and Dot product distance functions for vector similarity. The other sets list string or geographic distance measures that Azure Cosmos DB for NoSQL vector search does not offer.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-40","obj":"2.1.1","difficulty":"easy","type":"single","stem":"When enabling vector support in Azure Database for PostgreSQL, what name is used in the CREATE EXTENSION command?","choices":["vector","pgvector","embedding","pgai"],"answer":[0],"explanation":"Although the community calls it pgvector, the extension and binary name is simply vector, so the command is CREATE EXTENSION vector. pgvector is the project name, not the extension identifier; embedding and pgai are not the extension name to create.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/service-overview"},{"id":"2.1.1-41","obj":"2.1.1","difficulty":"medium","type":"single","stem":"What capability does the pgvector extension add to Azure Database for PostgreSQL?","choices":["Automatic table partitioning","Full-text search in 50 languages","Vector similarity search","Columnar storage compression"],"answer":[2],"explanation":"The pgvector extension adds open-source vector similarity search, letting PostgreSQL store and query embeddings. pgvector does not provide table partitioning, multilingual full-text search, or columnar compression; those are separate PostgreSQL features.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-42","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which data type does the pgvector extension introduce for storing embeddings in PostgreSQL?","choices":["jsonb","vector","geometry","hstore"],"answer":[1],"explanation":"pgvector introduces the vector data type, used when defining a column that holds vector embeddings. jsonb, geometry, and hstore are existing PostgreSQL types for JSON, spatial, and key-value data, not for embeddings.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-43","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Which pgvector index type uses a graph-based algorithm for approximate nearest-neighbor search?","choices":["B-tree","GIN","BRIN","HNSW"],"answer":[3],"explanation":"HNSW (Hierarchical Navigable Small World) is a graph-based index in pgvector that approximates nearest-neighbor queries efficiently. B-tree, GIN, and BRIN are standard PostgreSQL index types not designed for approximate vector similarity search.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-44","obj":"2.1.1","difficulty":"medium","type":"single","stem":"What does Azure Managed Redis provide?","choices":["An in-memory data store","A relational SQL database","An object blob storage service","An email delivery gateway"],"answer":[0],"explanation":"Azure Managed Redis provides a fully managed in-memory data store based on Redis, used for caching, session state, and similar low-latency patterns. It is not a relational database, blob storage service, or email gateway; those are other, unrelated Azure services.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-45","obj":"2.1.1","difficulty":"hard","type":"single","stem":"In the cache-aside pattern used with Azure Managed Redis, how is data placed into the cache?","choices":["It is loaded all at once when the cache starts","It is never removed once written","It is loaded on demand only as needed","It is replicated from another Redis cluster automatically"],"answer":[2],"explanation":"In the cache-aside pattern the application loads data into the cache on demand, only as needed, on a cache miss. Cache-aside does not preload everything at startup, keep data forever, or rely on automatic cross-cluster replication to populate the cache.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-46","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Which module must be enabled on Azure Managed Redis to support vector similarity search?","choices":["RediSearch","RedisBloom","RedisTimeSeries","RedisGears"],"answer":[0],"explanation":"Azure Managed Redis uses the RediSearch module to provide vector similarity search, and it must be enabled when the cache is created. RedisBloom (probabilistic data structures), RedisTimeSeries (time-series data), and RedisGears (server-side functions) do not provide vector search.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-47","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders wants to store shopping-cart and user session data in Azure Managed Redis for fast access. Which caching pattern fits this scenario?","choices":["Content cache","Session store","Data cache","Job and message queuing"],"answer":[1],"explanation":"The session store pattern uses an in-memory cache to hold shopping-cart and user session data, which is faster than querying a relational database on every request. Content cache serves static page fragments, data cache offloads backend database reads, and job and message queuing defers long-running work; none target session data specifically.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-48","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Lucerne Publishing needs to run a SQL query against an Azure Cosmos DB for NoSQL container from a Python app. What should you use?","choices":["The change feed processor","The SDK query_items method","The bulk import tool","The Data Migration tool"],"answer":[1],"explanation":"query_items runs the SQL query from the SDK. The change feed reads changes, and the bulk and migration tools move data, not query it.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-49","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Margie's Travel sees high RU cost because every property in a Cosmos DB container is indexed, though queries filter on two. What should you do?","choices":["Increase the provisioned RUs","Change consistency to eventual","Index only the queried paths","Change the partition key"],"answer":[2],"explanation":"Trimming the indexing policy to queried paths lowers per-query RU cost. Raising RUs pays more, eventual consistency does not cut query cost, and the partition key is fixed.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-50","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Nod Publishers runs a read-heavy Cosmos DB app where each user must read their own recent writes at low cost. Which consistency level should you use?","choices":["Strong","Bounded staleness","Session","Eventual"],"answer":[2],"explanation":"Session gives read-your-own-writes at low RU cost. Strong and bounded staleness cost more, and eventual drops read-your-own-writes.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-51","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders needs every read to return the most recent globally committed write, with no staleness. Which level should you use?","choices":["Strong","Session","Eventual","Bounded staleness"],"answer":[0],"explanation":"Only Strong guarantees the latest globally committed read. Session, eventual, and bounded staleness all allow stale reads.","ref":"https://learn.microsoft.com/azure/architecture/guide/technology-choices/vector-search"},{"id":"2.1.1-52","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Proseware, Inc. stores article embeddings in Cosmos DB for NoSQL and must return the articles closest in meaning to a query. What should you do?","choices":["Detect changes with the change feed","Run an unfiltered SELECT and sort in the app","Use a composite index on text fields","Store embeddings and run a vector search"],"answer":[3],"explanation":"A vector search performs semantic similarity. The change feed, an app-side sort, and a text index are not semantic search.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-53","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Relecloud must reindex a downstream store whenever items change in Cosmos DB, reliably and in order. What should you use?","choices":["A timer that polls the container","A Time to Live setting","A change feed processor","A periodic large query"],"answer":[2],"explanation":"The change feed gives reliable, ordered detection of changes. Polling and periodic queries are unreliable, and TTL deletes data.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-54","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Southridge Video needs a Cosmos DB partition key that spreads writes evenly and avoids a hot partition. Which should you choose?","choices":["A region field with few distinct values","A high-cardinality user identifier","A boolean active flag","A date truncated to the day"],"answer":[1],"explanation":"A high-cardinality key spreads writes and avoids a hot partition. A region, a boolean, and a truncated date are low-cardinality and create hot partitions.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-55","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Tailspin Toys stores embeddings in Azure Database for PostgreSQL and must return similar documents for the requesting customer only. What should you do?","choices":["A pgvector search across all rows","A B-tree index and exact-match query","A full-text search filtered by customer","A pgvector search plus a metadata filter on the customer"],"answer":[3],"explanation":"Similarity plus a metadata filter returns results that are both similar and tenant-scoped. A full-scan search leaks other tenants, and B-tree or full-text are not semantic.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-56","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Trey Research needs to reduce the latency of vector similarity queries in PostgreSQL. What should you do?","choices":["Increase max_connections","Create an HNSW index on the embedding column","Add a B-tree index on a text column","Vacuum the table"],"answer":[1],"explanation":"An HNSW index cuts vector-query latency. Connection tuning, a text index, and vacuum do not speed vector search.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-57","obj":"2.1.1","difficulty":"hard","type":"single","stem":"VanArsdel, Ltd. sees throughput drop under many short-lived PostgreSQL connections. What should you do?","choices":["Increase the compute tier","Add a read replica","Enable connection pooling","Increase the statement timeout"],"answer":[2],"explanation":"Connection pooling fixes throughput loss from many short-lived connections. Scaling up, a replica, and a longer timeout do not fix connection churn.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/service-overview"},{"id":"2.1.1-58","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Wide World Importers must choose a column type to store embeddings in PostgreSQL. Which type?","choices":["jsonb","text","bytea","vector"],"answer":[3],"explanation":"Embeddings need the pgvector vector type for distance operators and indexes. jsonb, text, and bytea cannot use vector distance operators.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-59","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Wingtip Toys repeatedly requests the same lookups and needs an in-memory store that expires results after a set time. What should you do?","choices":["Store the values permanently","Cache the values in Redis with a TTL","Publish the values on a channel","Append the values to a Redis stream"],"answer":[1],"explanation":"Redis with a TTL is the in-memory cache with expiration. Permanent storage, a channel, and a stream are not a TTL cache.","ref":"https://learn.microsoft.com/azure/architecture/guide/technology-choices/vector-search"},{"id":"2.1.1-60","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank must ensure Redis entries are not served after the source data changes. What should you do?","choices":["Increase the TTL","Disable key eviction","Delete or update the key when the source changes","Move to a larger cache tier"],"answer":[2],"explanation":"Invalidating the key on source change keeps the cache fresh. A longer TTL, no eviction, and a bigger tier do not guarantee freshness.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-61","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Adventure Works Cycles needs similarity search over vectors held in Azure Managed Redis. What should you do?","choices":["Store the vectors in a sorted set","Store the vectors in a hash with no index","Publish the vectors on a channel","Create a vector index and run a similarity search"],"answer":[3],"explanation":"A Redis vector index enables similarity search. Sorted sets, plain hashes, and channels cannot do similarity search.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-62","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Northwind Retail stores each order in an Azure Cosmos DB for NoSQL container partitioned by /customerId. A checkout service already knows both the order id and the customerId and must fetch a single order document with the lowest possible request unit (RU) charge and latency. Which read operation should the service use?","choices":["A SQL query SELECT * FROM c WHERE c.id = @id AND c.customerId = @cid with enable_cross_partition_query set to true","A SQL query SELECT * FROM c WHERE c.id = @id with enable_cross_partition_query set to true","A change feed read filtered to the customerId partition","A point read with read_item, passing the order id and the customerId as the partition key"],"answer":[3],"explanation":"A point read is a key/value lookup on the item id plus partition key and is the most efficient read in Azure Cosmos DB, costing about 1 RU for a 1 KB item. A query that filters on id and partition key is still a query, not a point read, and consumes more RUs. Adding enable_cross_partition_query fans the query out further. The change feed streams changes over time and is not a mechanism for fetching one current document.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-63","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Contoso Logistics runs a Python service against an Azure Cosmos DB for NoSQL container partitioned by /warehouseId. A frequently run query returns items for one known warehouse but is charging high RUs because it fans out to every physical partition. Which change to the query_items call reduces the RU charge the most?","choices":["Set populate_query_metrics to true","Increase max_item_count so more items return per page","Pass the partition_key argument so the query is scoped to that single logical partition","Set enable_cross_partition_query to true"],"answer":[2],"explanation":"Supplying the partition_key restricts the query to a single logical partition, avoiding a cross-partition fan-out and lowering the RU charge. populate_query_metrics only reports diagnostics. max_item_count changes page size, not partitions scanned. enable_cross_partition_query explicitly allows the expensive fan-out this scenario is trying to avoid.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-64","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Fabrikam Media writes large product documents to an Azure Cosmos DB for NoSQL container. Only two properties are ever queried, yet write RU charges are high because every property is indexed. The team wants to cut write RU cost while keeping those two queries working. Which indexing policy change is correct?","choices":["Switch the indexing mode from consistent to none for the container","Exclude the root path /* and explicitly include only the two queried property paths","Add a composite index on the two queried properties","Increase the container provisioned throughput"],"answer":[1],"explanation":"Indexing cost correlates directly with the number of unique paths indexed. Excluding the root and including only the two queried paths reduces indexed paths and therefore write RU charge while keeping those queries served by the index. Indexing mode none disables indexing entirely and would break the queries. A composite index helps multi-property ORDER BY or filter+sort queries but adds paths rather than removing them. Raising throughput increases cost instead of reducing per-write charge.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-65","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Adventure Works runs an Azure Cosmos DB for NoSQL query that filters on /status and sorts by /createdDate in a single query. The query fails asking for a specific index. Which indexing construct satisfies an ORDER BY across a filter and a sort property efficiently?","choices":["A composite index on (/status, /createdDate)","A spatial index on /createdDate","Excluding /status from the index","A vector index on /createdDate"],"answer":[0],"explanation":"Composite indexes serve queries that filter and order across multiple properties. A composite index on the filter and sort properties lets Azure Cosmos DB satisfy the ORDER BY efficiently. Spatial indexes are for geospatial data. Excluding the property removes it from indexing and worsens the query. Vector indexes are for VectorDistance similarity search, not scalar ordering.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-66","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Tailwind Traders wants Azure Cosmos DB for NoSQL to automatically index any new property added to their evolving document schema, while still excluding a couple of large unused subtrees. Which include/exclude strategy meets this goal?","choices":["Exclude the root path /* and include only the paths currently in use","Set indexing mode to none and rely on point reads","Remove both includedPaths and excludedPaths from the policy","Include the root path /* and add the unused subtrees to excludedPaths"],"answer":[3],"explanation":"Including the root path /* means new properties are indexed automatically, and listing the unused subtrees under excludedPaths keeps them out. This is the recommended strategy for evolving schemas. Excluding the root requires explicitly adding every future property, defeating auto-indexing. Indexing mode none disables all indexing. An indexing policy must declare /* as either an included or excluded path, so removing both is invalid.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-67","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Litware Bank runs a web session in which a user updates their profile and immediately reads it back. The application requires that within that user's own session the read always reflects the user's latest write, with the lowest latency and highest availability among options that guarantee this. Which Azure Cosmos DB consistency level fits best?","choices":["Eventual","Consistent prefix","Session","Strong"],"answer":[2],"explanation":"Session consistency guarantees read-your-writes, monotonic reads, and monotonic writes within a single session, and is the default level offering low latency and high availability while still guaranteeing a client reads its own writes. Eventual and consistent prefix do not guarantee read-your-writes. Strong guarantees the latest global write but at higher latency, lower availability, and double read RU cost, more than this per-session requirement needs.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-68","obj":"2.1.1","difficulty":"medium","type":"single","stem":"An architect at Proseware notes that a read-heavy Azure Cosmos DB for NoSQL workload doubled its RU consumption after a consistency change, even though query volume was unchanged. Which consistency level, when configured, doubles the RU charge of every read while guaranteeing reads always return the most recently committed write globally?","choices":["Session","Strong","Eventual","Consistent prefix"],"answer":[1],"explanation":"Strong consistency guarantees reads return the last committed write, and under strong (or bounded staleness) the RU cost of any read operation is doubled. Session, eventual, and consistent prefix do not double read RU cost. Only strong and bounded staleness double it, and among the options only strong also guarantees the latest committed value on every read.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-69","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Wingtip Toys needs a consistency guarantee where reads can lag the latest write, but only by a bounded amount that they can express either as a number of versions or as a time interval. Which Azure Cosmos DB consistency level supports configuring staleness by operations (MaxStalenessPrefix) or time (MaxStalenessIntervalInSeconds)?","choices":["Bounded staleness","Session","Eventual","Consistent prefix"],"answer":[0],"explanation":"Bounded staleness lets you bound how far reads can lag, configured either by a maximum number of operations (MaxStalenessPrefix) or a maximum time interval (MaxStalenessIntervalInSeconds). Session bounds staleness to a session, not by versions or time. Eventual and consistent prefix provide no configurable staleness bound.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-70","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee provisioned an Azure Cosmos DB account with the default consistency level set to Session. A developer wants a specific client to request Strong consistency for one operation. What is the outcome of requesting Strong on that request?","choices":["The request succeeds and returns strongly consistent data","The account default silently changes to Strong for all clients","The request is downgraded to Eventual","The request fails because a per-request ConsistencyLevel override can only relax consistency below the account default, not strengthen it"],"answer":[3],"explanation":"A requested consistency level must match or be weaker than the level provisioned for the account. The ConsistencyLevel override can relax below the account default but cannot strengthen above it, so requesting Strong above a Session default is not allowed. It does not succeed, because you cannot strengthen past the account default with ConsistencyLevel. The account default is not changed by a single request, and the request is not silently downgraded to Eventual.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-71","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Humongous Insurance stores multitenant event data in Azure Cosmos DB for NoSQL. One large tenant exceeds the 20 GB logical partition limit when partitioned by /tenantId, but partitioning by /userId makes every per-tenant query a fan-out. They want per-tenant queries routed efficiently and room to grow beyond 20 GB per tenant. Which partition key design is correct?","choices":["A single partition key of /userId","A single partition key of /tenantId","A hierarchical (subpartitioned) key of /tenantId then /userId","A synthetic partition key concatenating tenantId and userId as a string"],"answer":[2],"explanation":"A hierarchical partition key on /tenantId then /userId lets a single tenant exceed 20 GB across physical partitions, and queries specifying tenantId (or tenantId and userId) are routed to only the relevant partitions. A single /userId key makes per-tenant queries fan out. A single /tenantId key hits the 20 GB logical partition limit for the large tenant. A synthetic concatenated key adds complexity and still fans out for tenant-level queries unless every user is specified.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-72","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A developer at Coho Winery is scripting creation of a subpartitioned Azure Cosmos DB for NoSQL container with keys /TenantId, /UserId, and /SessionId. Which partition key definition values are required for hierarchical partition keys?","choices":["kind set to Hash and version 1","kind set to MultiHash and version 2","kind set to Range and version 2","kind set to MultiHash and version 1"],"answer":[1],"explanation":"Hierarchical partition keys use a partition key definition with kind MultiHash and version 2, listing up to three key paths. Single (non-hierarchical) keys use Hash. Range is not a valid partition key kind here, and version must be 2 for MultiHash subpartitioning, not 1.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-73","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A container at Blue Yonder uses a hierarchical partition key of /TenantId then /UserId then /SessionId. An engineer runs a query whose only filter is WHERE c.UserId = @u. How is this query routed?","choices":["As a fan-out query to all physical partitions","To the single physical partition holding that UserId","To only the physical partitions holding that TenantId","It is rejected as an invalid query"],"answer":[0],"explanation":"Providing only a middle level of the hierarchy (UserId) without the leading TenantId cannot be prefix-routed, so the query fans out to all physical partitions. There is no single partition for a middle-only value. Efficient routing requires the leading key (TenantId), or the full prefix. The query is valid but expensive, not rejected.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-74","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Graphic Design Institute has an existing Azure Cosmos DB for NoSQL container partitioned by /region and now wants a hierarchical partition key of /region then /storeId. What is the supported way to make this change?","choices":["Alter the existing container to add the second-level key in place","Add /storeId to the indexing policy of the existing container","Enable subpartitioning by setting version to 2 on the existing container","Create a new container with the hierarchical key and run a container copy job to move the data"],"answer":[3],"explanation":"Adding hierarchical partition keys to an existing container is not supported. You create a new container with the desired hierarchical key and use a container copy job to migrate the data. The partition key cannot be altered in place, the indexing policy does not define partitioning, and toggling the version on an existing container does not convert it to subpartitioned.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-75","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Relecloud stores 1536-dimension embeddings from an Azure OpenAI model in Azure Cosmos DB for NoSQL and needs low-latency approximate similarity search across millions of vectors. Which vector index type should they define?","choices":["flat","quantizedFlat","diskANN","A composite index on the vector path"],"answer":[2],"explanation":"diskANN builds an approximate nearest neighbor index supporting up to 4096 dimensions and is designed for fast, efficient search at large scale. flat is limited to 505 dimensions and does an exhaustive brute-force scan. quantizedFlat is brute-force and recommended only up to about 50,000 scoped vectors. A composite index does not serve VectorDistance searches.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-76","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A team at Margie's Travel stores 384-dimension embeddings for a small catalog of a few thousand items in Azure Cosmos DB for NoSQL and requires guaranteed 100 percent recall (the exact nearest neighbors). Which vector index type meets this requirement?","choices":["diskANN","flat","A geospatial index","No index, relying on autoscale"],"answer":[1],"explanation":"The flat index performs a brute-force exact search producing 100 percent recall and supports up to 505 dimensions, which fits 384-dimension vectors for a small dataset. diskANN is approximate and does not guarantee exact recall. A geospatial index is unrelated to vector similarity. Autoscale governs throughput, not recall.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-77","obj":"2.1.1","difficulty":"medium","type":"single","stem":"An engineer at VanArsdel writes an Azure Cosmos DB for NoSQL vector query using VectorDistance in the ORDER BY clause, and RU charges and latency are far higher than expected. Which correction most directly addresses this?","choices":["Add a TOP N clause to the SELECT so only the closest N results are returned","Remove the ORDER BY VectorDistance clause","Switch the account to Strong consistency","Set enable_cross_partition_query to false"],"answer":[0],"explanation":"A vector search without a TOP N clause tries to return far more results than needed, increasing RU cost and latency. Always use TOP N with VectorDistance ordering. Removing the ORDER BY defeats similarity ranking. Strong consistency would raise, not lower, RU cost. Disabling cross-partition query can break a search that must span partitions and does not address the missing TOP N.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-78","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A developer at Alpine Ski House provisioned an Azure Cosmos DB for NoSQL container without a vector index and now wants to add vector search to the existing container. What is true about enabling the vector index?","choices":["The vector index can be added to the existing container at any time and later disabled","Vector search only works on containers using shared (database-level) throughput","A vector index can use a wildcard path such as /* to cover all properties","The vector index is immutable and must be defined at container creation time"],"answer":[3],"explanation":"The vector index is immutable and must be defined when the container is created; once vector indexing and search are enabled they cannot be disabled. It cannot be added to an existing container after the fact or later disabled. Vector search is not supported on shared throughput accounts, and vector policy paths cannot use wildcards or be nested in arrays.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-79","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A data engineer at Trey Research must audit deletes in an Azure Cosmos DB for NoSQL container and process every intermediate update to an item, even when several updates happen between reads. Which change feed configuration meets this requirement?","choices":["Latest version mode","A time to live (TTL) policy on the container","All versions and deletes mode with continuous backups configured","Latest version mode with a soft-delete flag"],"answer":[2],"explanation":"All versions and deletes mode records creates, updates, and deletes in order, including intermediate versions, and requires continuous backups to be configured on the account. Latest version mode omits deletes and can miss intermediate updates. TTL deletes data but is not a change feed audit mechanism. A soft-delete flag with latest version mode captures the flag update but still misses intermediate versions and native delete metadata.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-80","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Fabrikam runs an Azure Cosmos DB for NoSQL change feed in latest version mode to replicate changes downstream, but hard deletes are never propagated. Without switching change feed modes, how should deletes be surfaced to the consumer?","choices":["Enable Strong consistency on the account","Add a soft-delete marker property to the item on deletion and let TTL remove it later","Increase the change feed processor lease count","Switch the container to autoscale throughput"],"answer":[1],"explanation":"Latest version mode does not capture deletes. The common pattern is to update the item with a soft-delete marker (which appears in the feed) and set a TTL so the item is later removed automatically. Consistency level does not affect delete capture. Lease count only parallelizes processing. Autoscale changes throughput, not whether deletes appear in the feed.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-81","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A team at Wide World Importers deploys the Azure Cosmos DB change feed processor across several compute instances for scale and resilience. Which component tracks progress and lets work be distributed and resumed across those instances?","choices":["A separate lease container","The monitored (feed) container itself","The indexing policy","The vector embedding policy"],"answer":[0],"explanation":"The change feed processor uses a lease container to maintain state, distribute work across instances, and resume from checkpoints. The monitored container is the source of changes, not the state store. The indexing policy and vector embedding policy are unrelated to change feed lease coordination.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-82","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An architect at Contoso is choosing change feed modes. They need to read changes going all the way back to the origin of the container at any time. Which statement about retention is correct?","choices":["All versions and deletes mode has unlimited retention, while latest version mode is limited to seven days","Both modes are limited to the continuous backup period","Both modes have unlimited retention","Latest version mode has unlimited retention, while all versions and deletes mode only reads within the continuous backup period"],"answer":[3],"explanation":"Latest version mode retains changes for the life of the container (unlimited), while all versions and deletes mode can only read changes within the account's continuous backup retention period. The retention characteristics are reversed in the other options. All versions and deletes mode is bounded by the backup window, and latest version mode is not limited to seven days.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-83","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Lamna Healthcare stores chat session documents in Azure Cosmos DB for NoSQL and wants each document automatically deleted 3600 seconds after its last update, with no explicit delete calls from the application. What container configuration achieves this?","choices":["Set DefaultTimeToLive to -1 on the container","Leave DefaultTimeToLive as null and set ttl on each item","Set DefaultTimeToLive to 3600 on the container","Set DefaultTimeToLive to 0 on the container"],"answer":[2],"explanation":"Setting DefaultTimeToLive to a positive value (3600) makes every item expire that many seconds after its last modified time, deleted automatically as a background task. -1 means items never expire by default. If the container DefaultTimeToLive is null, item-level ttl is ignored, so items would not expire. A value of 0 is not a valid TTL setting.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-84","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A container at Woodgrove Bank has DefaultTimeToLive set to -1. A developer sets ttl to 600 on one specific item. What happens?","choices":["The item never expires because the container TTL is -1","That one item expires 600 seconds after its last modification while other items do not expire","Setting item ttl is ignored because container TTL must be a positive number","All items in the container expire after 600 seconds"],"answer":[1],"explanation":"With container TTL set to -1, items do not expire by default, but an item-level ttl overrides that default, so the item with ttl 600 expires after 600 seconds while the rest remain. The item does expire because its item-level ttl overrides the container default. Item ttl is honored as long as container TTL is not null, including when it is -1, and only the overridden item is affected.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/time-to-live"},{"id":"2.1.1-85","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An operations engineer at Munson's Pickles wants to completely disable TTL on an Azure Cosmos DB for NoSQL container so the background expiration process stops checking, even for items that previously set their own ttl. Which action is correct?","choices":["Remove (set to null) the DefaultTimeToLive property on the container","Set DefaultTimeToLive to -1 on the container","Set DefaultTimeToLive to 0 on the container","Delete each item ttl property individually"],"answer":[0],"explanation":"Removing the DefaultTimeToLive property (setting it to null) turns TTL off and stops the background expiration process, and item-level ttl values are then ignored. This differs from setting -1. Setting -1 keeps TTL on with no default and still honors item-level ttl overrides. A value of 0 is invalid. Editing every item ttl is impractical and does not disable the container-level process.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/time-to-live"},{"id":"2.1.1-86","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Southridge Video has an Azure Cosmos DB for NoSQL container with unpredictable, spiky traffic. During occasional spikes requests are rate-limited under the current fixed throughput, and the team does not want to manually adjust RU/s. Which throughput configuration is most appropriate?","choices":["Standard (manual) provisioned throughput at the peak value","Standard (manual) provisioned throughput at the average value","Disable indexing to save RUs","Autoscale provisioned throughput with an appropriate max RU/s"],"answer":[3],"explanation":"Autoscale automatically scales throughput between 10 percent of the maximum and the maximum, absorbing unpredictable spikes without manual intervention, and is cost-effective when average utilization is below about 66 percent. Manual at peak wastes money during idle hours and still needs manual changes to move the ceiling. Manual at average continues to rate-limit during spikes. Disabling indexing harms queries and does not address spike handling.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-87","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A team at Fabrikam sets an Azure Cosmos DB container to autoscale with a maximum of 20,000 RU/s. During an idle hour with no traffic, what is the minimum RU/s the system scales down to, and how is that hour billed?","choices":["It scales to 0 RU/s and the hour is free","It stays at 20,000 RU/s and is billed at the full maximum","It scales to 2,000 RU/s (10 percent of max) and is billed at that level","It scales to 400 RU/s, the fixed autoscale floor"],"answer":[2],"explanation":"Autoscale scales down to 10 percent of the maximum. For a 20,000 RU/s max, the floor is 2,000 RU/s, and autoscale bills for the highest RU/s reached in the hour, which during idle is the 2,000 RU/s minimum. Autoscale does not scale to zero or bill nothing. It does not stay pinned at the maximum during idle. The floor is 10 percent of the configured max, not a fixed 400 RU/s.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-88","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Contoso analyzed an Azure Cosmos DB container with steady traffic whose normalized RU consumption stays between 72 and 100 percent every hour. Which throughput choice is the more cost-effective and why?","choices":["Autoscale, because it always costs less than manual","Standard (manual) provisioned throughput, because average utilization above 66 percent favors manual","Serverless, because steady workloads are billed per request","Autoscale, because the 1.5x rate is waived above 66 percent utilization"],"answer":[1],"explanation":"When average utilization across the month exceeds about 66 percent, standard (manual) throughput is cheaper than autoscale, whose per-RU/s rate is 1.5x the manual rate. Autoscale is not always cheaper and its 1.5x rate is not waived. Serverless suits intermittent low-traffic workloads, not steady high utilization.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-89","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Nod Publishers is building a retrieval-augmented generation app on Azure Database for PostgreSQL flexible server with pgvector. They want an approximate nearest neighbor index with the best speed-recall tradeoff, and they need to create the index before bulk-loading data because loading happens continuously. Which index type fits?","choices":["HNSW","IVFFlat","A B-tree index on the vector column","No index (exact search)"],"answer":[0],"explanation":"HNSW gives a better speed-recall tradeoff than IVFFlat and, unlike IVFFlat, has no training step, so it can be created on an empty table before data is loaded. IVFFlat requires representative data to train its lists, so building it on an empty table yields poor recall. A B-tree cannot serve vector distance searches. No index means exhaustive exact search with poor performance at scale.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-90","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Fincher Labs uses pgvector on Azure Database for PostgreSQL and prioritizes fast index build time and low memory use, accepting somewhat lower query performance, on a dataset that is fully loaded before indexing. Which index and practice apply?","choices":["HNSW, and create the index on the empty table first","IVFFlat with an ef_construction of 64","HNSW with a lists value of 100","IVFFlat, and load the data before creating the index"],"answer":[3],"explanation":"IVFFlat has faster build times and lower memory use than HNSW at the cost of query performance, and data should be loaded before creating the index so its lists reflect the data distribution. HNSW trades more build time and memory for better queries. ef_construction is an HNSW parameter, not IVFFlat. lists is an IVFFlat parameter, not HNSW, so those combinations are mismatched.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-91","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A developer at Ashford Analytics tries to create an index on a pgvector column declared simply as embedding vector and gets an error that the column does not have dimensions. They also plan to store 3072-dimension embeddings. What are the relevant constraints for IVFFlat or HNSW indexing?","choices":["The column can be indexed without declared dimensions if data is loaded first","The column must declare its dimensions, and IVFFlat/HNSW can index at most 2000 dimensions","IVFFlat/HNSW can index up to 16000 dimensions once dimensions are declared","Only DiskANN requires declared dimensions"],"answer":[1],"explanation":"To index a pgvector column it must have its dimensions declared, and IVFFlat and HNSW can index columns with at most 2000 dimensions, so 3072-dimension vectors need dimensionality reduction to be indexed. Dimensions must be declared regardless of load order. The IVFFlat/HNSW limit is 2000 dimensions, not 16000. The dimension requirement applies to indexing generally, not only DiskANN.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-92","obj":"2.1.1","difficulty":"medium","type":"single","stem":"After building an HNSW index in Azure Database for PostgreSQL, a team at Relecloud wants to raise recall for a specific set of queries in one transaction without changing the setting for the whole connection. Which parameter do they adjust, and how?","choices":["Increase hnsw.ef_search using SET LOCAL inside the transaction","Increase lists using SET LOCAL inside the transaction","Increase probes using SET LOCAL inside the transaction","Increase m using SET LOCAL inside the transaction"],"answer":[0],"explanation":"hnsw.ef_search controls the size of the dynamic candidate list at query time (default 40). Higher values raise recall, and using SET LOCAL inside a transaction block scopes the change to that transaction. lists and probes are IVFFlat parameters, not HNSW. m is an HNSW build-time parameter fixed at index creation, not a query-time recall knob.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-93","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A team at Datum tuned an IVFFlat index in Azure Database for PostgreSQL and wants to raise search accuracy at query time, accepting slower searches. Which parameter should they increase?","choices":["ef_construction","m","hnsw.ef_search","probes"],"answer":[3],"explanation":"For IVFFlat, the probes parameter controls how many lists are searched. Increasing probes improves accuracy at the cost of search speed. ef_construction and m are HNSW build-time parameters, and hnsw.ef_search is the HNSW query-time knob. None of them tune an IVFFlat search.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-94","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard builds a RAG search on Azure Database for PostgreSQL that must return only documents in a chosen category and, within that category, the most semantically similar chunks. How should the query combine relational filtering with vector search?","choices":["Copy matching rows to a separate pure vector database and search there","Store the category inside the embedding vector itself","Run a WHERE clause on the category column combined with ORDER BY on the embedding distance in the same SQL query","Use two unrelated queries and intersect the results in application code"],"answer":[2],"explanation":"Because pgvector stores embeddings alongside the relational data, a single SQL statement can filter on the category column with WHERE and rank by vector distance with ORDER BY, combining metadata filtering and semantic search efficiently. A separate vector database duplicates data and loses the colocation benefit. Categories cannot be meaningfully encoded into an embedding for exact filtering. Intersecting in application code is slower and unnecessary when SQL can do both.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-95","obj":"2.1.1","difficulty":"medium","type":"single","stem":"An engineer at Fabrikam wants to generate embeddings for text stored in Azure Database for PostgreSQL by calling Azure OpenAI directly from SQL, keeping the data in the database. Which extensions enable this, and what setup is required?","choices":["Only the vector extension; no allowlisting is needed","The azure_ai and vector extensions, after allowlisting them via azure.extensions and running CREATE EXTENSION","The pg_stat_statements extension alone","The wal2json extension for logical decoding"],"answer":[1],"explanation":"The azure_ai extension lets the database call Azure OpenAI to create embeddings, and it is commonly paired with the vector extension to store them. Both must be allowlisted (azure.extensions) and installed with CREATE EXTENSION. The vector extension alone stores vectors but cannot call Azure OpenAI. pg_stat_statements is for query statistics, and wal2json is for logical decoding, neither of which generates embeddings.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-96","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A serverless API at Wingtip opens many short-lived connections to Azure Database for PostgreSQL flexible server, and the server is hitting resource limits from too many Postgres backend processes. Which built-in feature best addresses this?","choices":["Enable the built-in PgBouncer connection pooler on port 6432","Scale up to the Memory Optimized tier","Create an HNSW index to speed queries","Increase max_item_count on the client"],"answer":[0],"explanation":"Azure Database for PostgreSQL flexible server includes built-in PgBouncer on port 6432, which pools and reuses connections so many short-lived client connections share a small set of server connections, relieving the per-process overhead. Scaling up adds capacity but does not solve connection churn efficiently. An HNSW index speeds vector queries, not connection handling. max_item_count is a Cosmos DB client setting, unrelated to PostgreSQL.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/service-overview"},{"id":"2.1.1-97","obj":"2.1.1","difficulty":"easy","type":"single","stem":"After enabling the built-in PgBouncer on Azure Database for PostgreSQL flexible server (default pool mode), a team at Proseware finds that SET search_path issued in one transaction does not persist for later queries on the same client. Why, and what is the recommended fix?","choices":["PgBouncer is failing; restart the server to persist session settings","Session settings never work in PostgreSQL; hardcode the schema in every query","Switch PgBouncer to statement pooling to keep session state","In transaction pooling mode server connections return to the pool after each transaction, so use ALTER ROLE to set the parameter permanently or use a direct connection"],"answer":[3],"explanation":"The built-in PgBouncer defaults to transaction pooling, where a server connection is released after each transaction and a later transaction may use a different one, so session-level SET does not persist. Use ALTER ROLE for a durable setting or a direct (non-pooled) connection. This is expected pooling behavior, not a failure needing a restart. Session settings do work on direct connections. Statement pooling is even more restrictive and does not preserve session state; it also breaks multi-statement transactions.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-98","obj":"2.1.1","difficulty":"medium","type":"single","stem":"An engineer at Tailwind runs Azure Database for PostgreSQL flexible server on the Burstable compute tier and wants to enable the built-in PgBouncer connection pooler. What should they expect?","choices":["PgBouncer works on Burstable exactly as on other tiers","PgBouncer requires the Flash Optimized tier","The built-in PgBouncer is not supported on the Burstable tier; they must move to General Purpose or Memory Optimized","PgBouncer only works with the vector extension enabled"],"answer":[2],"explanation":"The built-in PgBouncer feature is supported on the General Purpose and Memory Optimized compute tiers, not on the Burstable tier. Changing to Burstable removes the built-in PgBouncer capability. It does not work on Burstable. There is no Flash Optimized tier for PostgreSQL flexible server, and PgBouncer does not depend on the vector extension.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-99","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Consolidated Messenger runs a high-concurrency vector workload on Azure Database for PostgreSQL flexible server and needs a high memory-to-CPU ratio so more of the HNSW index and working set stay in memory for faster transaction processing. Which compute tier is most appropriate?","choices":["Burstable","Memory Optimized","General Purpose","Elastic cluster coordinator on Burstable"],"answer":[1],"explanation":"The Memory Optimized tier provides the highest memory per vCore (about 6.75 to 9.5 GiB), suited to high-performance, high-concurrency workloads that benefit from keeping more data in memory. Burstable is for intermittent low-CPU dev/test workloads and uses a CPU credit model. General Purpose balances CPU and memory (4 GiB per vCore) but offers less memory per core. Burstable does not support the built-in pooler and is not for production concurrency.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-100","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Wide World Importers has a product catalog too large to preload into Azure Managed Redis. They want the application to read from Redis first and, on a miss, read from the source database and populate the cache. Which caching pattern is this?","choices":["Cache-aside","Content cache for static templates","Session store","Write-behind logging"],"answer":[0],"explanation":"The cache-aside pattern loads data into the cache on demand: the application checks the cache, and on a miss reads from the data store and adds the value to the cache for later requests. Content cache is for static page fragments like headers and footers. Session store keeps per-user session state. Write-behind is a write strategy, not the on-demand read-population described here.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-101","obj":"2.1.1","difficulty":"medium","type":"single","stem":"An architect at Lucerne Publishing plans to use Azure Managed Redis as a low-latency vector database for a RAG app. What must be configured, and when?","choices":["Enable the RediSearch module after the instance is created, using any clustering policy","Enable RediSearch on the Flash Optimized tier for best vector performance","Set the eviction policy to allkeys-lru so vectors are evicted under pressure","Enable the RediSearch module during provisioning, and use the Enterprise clustering policy with the NoEviction eviction policy"],"answer":[3],"explanation":"Vector search in Azure Managed Redis uses the RediSearch module, which must be enabled at provisioning (modules cannot be added later) and requires the Enterprise clustering policy and the NoEviction eviction policy. Modules cannot be added after creation, and RediSearch requires Enterprise clustering, not any policy. RediSearch is not available on the Flash Optimized tier. RediSearch requires NoEviction, so an LRU eviction policy is invalid.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-102","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A developer at Fourth Coffee is defining a vector index in Azure Managed Redis with the RediSearch module. Which index types and distance metrics are supported?","choices":["IVFFlat and DiskANN index types with only COSINE","quantizedFlat and diskANN index types with L2 only","FLAT and HNSW index types with L2, COSINE, and IP distance metrics","Only a single brute-force index with Euclidean distance"],"answer":[2],"explanation":"RediSearch in Azure Managed Redis supports KNN search with FLAT and HNSW vector indexes and the L2, COSINE, and IP distance metrics. IVFFlat and DiskANN are pgvector/Cosmos DB concepts, and quantizedFlat/diskANN are Azure Cosmos DB index types, not RediSearch types. RediSearch supports more than a single index type and more than one metric.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-103","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A team at Adatum needs vector similarity search in Azure Managed Redis and is comparing tiers for cost. On which tier is RediSearch (and therefore vector search) unavailable?","choices":["Memory Optimized","Flash Optimized","Balanced","Compute Optimized"],"answer":[1],"explanation":"RediSearch is available on the Memory Optimized, Balanced, and Compute Optimized tiers but not on the Flash Optimized tier, so vector search cannot run there. Memory Optimized, Balanced, and Compute Optimized all support RediSearch and vector search; only Flash Optimized does not.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-104","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Blue Yonder stores document embeddings in Azure Managed Redis and needs queries that return the nearest vectors but only among documents matching a specific tenant ID and category. What should they store alongside each vector to enable this hybrid filtering?","choices":["Metadata fields such as tenant ID, category, title, and source URL, so queries can filter and return source information","Only the raw embedding vector","A second copy of the vector in a different distance metric","Nothing extra; RediSearch infers tenants automatically"],"answer":[0],"explanation":"Storing metadata (tenant ID, category, title, source URL, timestamps, access-control fields) with each vector lets RediSearch combine KNN search with numeric, text, and tag filters for hybrid search and return source details. Storing only the vector leaves nothing to filter on. A duplicate vector in another metric does not enable metadata filtering. RediSearch cannot infer tenant boundaries without stored fields.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-105","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Contoso wants to cut Azure OpenAI cost and latency by reusing a cached completion whenever a new user prompt is semantically similar to a previous one, using Azure Managed Redis. Which pattern is this?","choices":["Content caching of static HTML fragments","A write-behind cache of prompts","Session store keyed by user cookie","Semantic caching using vector similarity search"],"answer":[3],"explanation":"Semantic caching stores completions as embeddings and reuses a cached response when a new prompt is semantically similar to a prior one, reducing LLM cost and latency, and relies on vector similarity search. Content caching serves static fragments by exact key, not semantic similarity. Write-behind is a write strategy. Session store keys by user session, not by prompt similarity.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-106","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A team at Margie's Travel uses Azure Managed Redis as a cache-aside cache for a product catalog and must ensure entries do not serve stale data indefinitely after the source database changes. Which mechanism most directly bounds staleness of cached entries?","choices":["Rely on the NoEviction policy to refresh keys automatically","Store the catalog in a RediSearch vector index","Set a TTL (expiration) on cached keys so they refresh after a set period","Increase the number of client connections"],"answer":[2],"explanation":"Setting a TTL (expiration) on cached keys bounds how long a stale value can be served: after the TTL elapses the key expires and the next read repopulates it from the source, a core part of the cache-aside strategy. NoEviction prevents keys from being removed under memory pressure and does not refresh them. A vector index does not address staleness of cached values. More connections do not affect data freshness.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-107","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Contoso runs an Azure Cosmos DB for NoSQL container. A reporting query uses ORDER BY c.price, c.rating and consumes high RUs. Which change lets the query sort on both properties efficiently?","choices":["Rely on the default range indexes that Cosmos DB maintains on each property","Create a spatial index that covers the price and rating properties","Define a composite index on (price ascending, rating ascending) in the indexing policy","Switch the indexing mode from consistent to lazy"],"answer":[2],"explanation":"An ORDER BY clause on two or more properties requires a composite index defined on those properties in the matching sequence and order. Default range indexes serve single-property ORDER BY and filters but cannot satisfy a multi-property sort. Spatial indexes serve geospatial ST_ functions only. Indexing mode controls when the index updates, not whether multi-property ORDER BY is supported.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-108","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Adventure Works has a Cosmos DB query WHERE c.name = 'John' AND c.age > 18. They want a composite index to optimize it. How should the composite index be defined?","choices":["Place the range-filtered property first in the composite index","Define the equality property first and the range-filtered property last","Add two range filters to a single composite index","Use the /* wildcard in the composite path so all properties are covered"],"answer":[1],"explanation":"For a composite index, equality-filtered properties must come first and the single range-filtered property must be defined last. Putting the range property first breaks the ordering rule. A single composite index can optimize at most one range filter, not two. Composite paths cannot use the /* wildcard.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-109","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Fabrikam needs several item writes to succeed or fail together as one atomic unit in Azure Cosmos DB for NoSQL. What is the key requirement for using a transactional batch?","choices":["The operations can span any partition key values within the container","The batch must include a pre-trigger to enforce atomicity","Each operation needs its own If-Match ETag to be atomic","All operations must target the same partition key value"],"answer":[3],"explanation":"A transactional batch is scoped to a single logical partition, so every operation must share the same partition key value. Batches cannot span partition keys. Triggers are not required and in fact cannot run inside a transactional batch. ETags provide optimistic concurrency, not batch atomicity, which comes from the shared partition scope.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-110","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Tailwind Traders submits a Cosmos DB transactional batch of 150 small operations that share one partition key, and it fails. Which limit is the most likely cause?","choices":["A transactional batch payload cannot exceed 4 MB","A transactional batch supports at most 100 operations","A transactional batch cannot exceed 10 operations","A transactional batch must complete within 30 seconds"],"answer":[1],"explanation":"A transactional batch is limited to 100 operations, so 150 operations exceeds the cap regardless of item size. The payload limit is 2 MB, not 4 MB (4 MB is the max query response). The operation cap is 100, not 10. The single-operation execution limit is 5 seconds, not 30.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-111","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Wingtip Toys wants to prevent lost updates when two clients replace the same Cosmos DB item concurrently. Which approach implements optimistic concurrency control?","choices":["Send the item _etag in the If-None-Match header to block the update","Rely on the fact that a stale _etag returns HTTP 409 Conflict","Send the item _etag in the If-Match header; a stale value returns HTTP 412","Set the account consistency level to strong to guard the write"],"answer":[2],"explanation":"Passing the item _etag in the If-Match header lets the server reject a conditional write with HTTP 412 Precondition Failed when the value is stale. If-None-Match decides whether to refetch a resource, not to guard a conditional write. A stale ETag returns 412, not 409 (409 signals an id or unique-key conflict). Strong consistency governs read recency, not lost-update protection.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-112","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Northwind runs a Cosmos DB container whose normalized utilization is about 85 percent of provisioned RU/s in nearly every hour of the month. Which throughput option minimizes cost?","choices":["Standard (manual) provisioned throughput","Autoscale provisioned throughput","Serverless","Autoscale configured with a higher maximum RU/s"],"answer":[0],"explanation":"When average utilization exceeds 66 percent of the hours, standard (manual) throughput is cheaper because the autoscale rate is 1.5 times the manual rate. Autoscale saves money only when you use the max for 66 percent of hours or fewer, which does not hold at 85 percent steady use. Serverless suits intermittent spiky traffic. Raising the autoscale max does not change that steady high utilization favors manual pricing.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-113","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Proseware configures a Cosmos DB container with autoscale and sets the maximum to 20,000 RU/s. What is the RU/s range the container scales within?","choices":["It scales between 400 and 20,000 RU/s","It stays fixed at 20,000 RU/s","It scales between 2,000 and 20,000 RU/s","It scales between 100 and 20,000 RU/s"],"answer":[2],"explanation":"Autoscale scales between 10 percent of the configured maximum and the maximum, so 20,000 max scales between 2,000 and 20,000 RU/s. The floor is 10 percent of the max (2,000 here), not a fixed 400. Autoscale does not stay pinned at the max. 100 RU/s is the lowest possible autoscale entry point, not the floor for a 20,000 max.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-114","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Relecloud issues millions of high-volume lookups that already know each item's id and partition key. Which read pattern consumes the fewest RUs in Cosmos DB for NoSQL?","choices":["A query that filters on the item id","A point read by id and partition key","A cross-partition query","A query with no filter that takes the first result"],"answer":[1],"explanation":"A point read (key/value lookup by id and partition key) of a 1 KB item costs 1 RU and is the most efficient read. A query filtering on id is not a point read and costs more RUs. Cross-partition queries are the most expensive read pattern. An unfiltered query scans broadly and consumes far more RUs than a point read.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-115","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank changes a Cosmos DB account from session consistency to strong consistency. What is the effect on the RU cost of read operations?","choices":["Read RU cost is unchanged by the consistency level","Read RU cost is halved","Write RU cost doubles while reads stay the same","Read operations consume roughly twice the RUs"],"answer":[3],"explanation":"Strong and bounded staleness consistency roughly double the RU cost of read operations compared with relaxed levels. Consistency level does affect read cost. Stronger consistency increases, not decreases, read cost. It is reads, not writes, whose cost about doubles under strong or bounded staleness.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-116","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Fourth Coffee needs an audit pipeline that captures every create, update, delete, and intermediate change to items in a Cosmos DB for NoSQL container. Which change feed configuration meets this need?","choices":["Use latest version change feed mode","Use all versions and deletes mode, which requires continuous backups","Use latest version mode with soft-delete marker properties","Enable TTL so deletions are recorded in the feed"],"answer":[1],"explanation":"All versions and deletes mode records creates, updates, deletes, and intermediate versions, and it requires continuous backups to be enabled on the account. Latest version mode captures neither deletes nor intermediate updates. A soft-delete marker is an app-side workaround that still misses intermediate updates. TTL removes items but does not create a delete record in latest version mode.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-117","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Lamna Healthcare uses the Cosmos DB integrated cache through a dedicated gateway. A specific read request sets MaxIntegratedCacheStaleness to 0. What is the effect?","choices":["The request always serves from cache with zero staleness","The request uses the default 5-minute staleness","The request never uses the integrated cache","The request caches its result for up to 10 years"],"answer":[2],"explanation":"A MaxIntegratedCacheStaleness of 0 means the read never serves from the integrated cache, regardless of consistency level. A 0 value disables cache reads rather than forcing a fresh hit. The 5-minute default applies only when the property is not set. 10 years is the maximum staleness value, not the behavior of a 0 setting.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-118","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard must ingest millions of items into Cosmos DB for NoSQL with the .NET v3 SDK at maximum write throughput. Which approach is designed for this?","choices":["Set AllowBulkExecution to true on the CosmosClient options","Wrap all inserts in a single transactional batch","Increase MaxItemCount on the query options","Loop the inserts inside a stored procedure"],"answer":[0],"explanation":"Enabling AllowBulkExecution on the CosmosClient groups concurrent operations into optimized batches for high-throughput ingestion. A transactional batch is capped at 100 operations within one partition key, so it cannot ingest millions of cross-partition items. MaxItemCount tunes query page size, not writes. Stored procedures run within a single partition and are not the scalable bulk path.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-119","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel wants to generate vector embeddings directly from SQL inside Azure Database for PostgreSQL flexible server, calling an Azure OpenAI deployment. Which approach is correct?","choices":["Install pgvector and call its built-in embedding generator","Enable the azure_ai extension and call azure_openai.create_embeddings","Use the azure_ai.translate function to produce vectors","Write a trigger that shells out to curl for each row"],"answer":[1],"explanation":"The azure_ai extension's azure_openai schema exposes create_embeddings, which invokes an Azure OpenAI deployment to produce vectors from within the database. pgvector stores and indexes vectors but has no embedding-generation function. azure_ai.translate calls Azure AI Translator for text translation, not embeddings. Shell-out triggers are not the supported mechanism.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-120","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Alpine Ski House uses a DiskANN vector index in Azure Database for PostgreSQL flexible server and needs higher recall at query time without rebuilding the index. What should they adjust?","choices":["Increase max_neighbors on the index","Raise hnsw.ef_search for the query","Raise the probes setting for the query","Set diskann.l_value_is higher for the query"],"answer":[3],"explanation":"l_value_is is the DiskANN query-time search list size and can be set per connection or transaction to trade latency for recall without a rebuild. max_neighbors is a build-time parameter that requires rebuilding the index. ef_search applies only to HNSW indexes. probes applies only to IVFFlat indexes.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-121","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder finds that an HNSW pgvector index in Azure Database for PostgreSQL is returning lower recall than required. Which query-time change improves accuracy?","choices":["Increase hnsw.ef_search before running the query","Increase the lists value on the index","Lower ef_construction on the index","Increase the probes setting"],"answer":[0],"explanation":"A larger hnsw.ef_search enlarges the dynamic candidate list during search, improving recall at the cost of speed, and can be set per connection or transaction. lists is an IVFFlat build parameter, not an HNSW setting. Lowering ef_construction reduces index quality. probes tunes IVFFlat search, not HNSW.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-122","obj":"2.1.1","difficulty":"medium","type":"single","stem":"City Power uses an IVFFlat pgvector index in Azure Database for PostgreSQL and wants more accurate nearest-neighbor results, accepting slower queries. What should they do?","choices":["Raise probes so more lists are searched per query","Lower probes so fewer lists are searched","Increase the lists build parameter at query time","Set probes equal to the number of lists for best speed"],"answer":[0],"explanation":"Raising probes searches more of the inverted lists, improving accuracy while reducing search speed. Lowering probes reduces accuracy. lists is fixed at index build time and cannot change per query. Setting probes equal to lists becomes an exhaustive scan, so the planner stops using the index and the query is slower, not faster.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-123","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Litware runs a web tier that opens many s
