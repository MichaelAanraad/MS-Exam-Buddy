hort-lived connections, causing connection churn against Azure Database for PostgreSQL flexible server. The application does not use prepared transactions. Which built-in PgBouncer mode maximizes connection scalability?","choices":["Session pooling","Transaction pooling","Statement pooling","Disable pooling and raise max_connections"],"answer":[1],"explanation":"Transaction pooling returns the server connection after each transaction and is the default recommended mode for the built-in PgBouncer, scaling best for short-lived connection churn. Session pooling holds a server connection for the entire client session, scaling worst for churn. Statement pooling releases the connection after each statement and cannot run multi-statement transactions. Raising max_connections increases per-connection process overhead, the very problem PgBouncer solves.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-124","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Graphic Design Institute needs its Azure Database for PostgreSQL flexible server to survive an entire availability zone outage with automatic failover and zero data loss. Which configuration meets the requirement?","choices":["Add read replicas in the same region","Enable same-zone (zonal) high availability","Rely on automated backups and point-in-time restore","Enable zone-redundant high availability"],"answer":[3],"explanation":"Zone-redundant high availability places the synchronously committed standby in a different zone with automatic 60 to 120 second failover and zero data loss. Read replicas replicate asynchronously and are for read scale-out, not zero-loss failover. Same-zone HA keeps both servers in one zone, so a zone outage takes down both. Point-in-time restore is manual recovery with potential data loss and downtime.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/service-overview"},{"id":"2.1.1-125","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Munson's Pickles plans to use Azure Managed Redis as a vector database with the RediSearch module. Which instance configuration does RediSearch require?","choices":["The Enterprise clustering policy with the NoEviction eviction policy","The OSS clustering policy for higher throughput","The allkeys-lru eviction policy","The Flash Optimized tier"],"answer":[0],"explanation":"RediSearch requires the Enterprise clustering policy and the NoEviction eviction policy. RediSearch cannot run under the OSS clustering policy. allkeys-lru would evict indexed data, so NoEviction is required. RediSearch is not supported on Flash Optimized; use Memory Optimized, Balanced, or Compute Optimized.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-126","obj":"2.1.1","difficulty":"hard","type":"single","stem":"VanArsdel stores a small set of vectors in Azure Managed Redis and needs exact, exhaustive nearest-neighbor results rather than approximate matches. Which RediSearch index type fits?","choices":["HNSW index","IVFFlat index","FLAT index","DiskANN index"],"answer":[2],"explanation":"The FLAT index performs an exact brute-force KNN search, which suits smaller datasets that require exhaustive precision. HNSW is approximate, trading exactness for lower latency on large datasets. IVFFlat is a pgvector index type not offered by Azure Managed Redis. DiskANN is also not offered by Azure Managed Redis.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-127","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Trey Research wants to minimize the data-loss window for an Azure Managed Redis instance and accepts a throughput impact. Which persistence choice best meets this goal?","choices":["RDB snapshots taken every 60 minutes","AOF persistence","Periodic export to an Azure Storage account","Active geo-replication"],"answer":[1],"explanation":"AOF persistence logs every write with only a few seconds of delay, giving the smallest data-loss window at higher CPU cost. RDB takes periodic snapshots, so up to an hour of writes can be lost. Export is a manual point-in-time backup, not a low-loss durability mechanism. Active geo-replication is for cross-region resiliency and is not compatible with data persistence.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-128","obj":"2.1.1","difficulty":"medium","type":"single","stem":"The Phone Company wants to cut repeated Azure OpenAI calls by reusing cached answers when a new prompt is semantically similar to an earlier one, using Azure Managed Redis. Which technique fits?","choices":["Standard key-value GET and SET caching on the raw prompt string","Enable RDB persistence on the instance","Semantic caching using vector similarity search","Set an allkeys-lru eviction policy"],"answer":[2],"explanation":"Semantic caching embeds prompts and uses vector similarity search to match semantically similar prompts so cached responses can be reused. Exact key-value caching on the raw string misses similar but non-identical prompts. RDB persistence is about durability, not prompt matching. Eviction policy manages memory pressure, not semantic matching, and RediSearch requires NoEviction.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-129","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys has a Cosmos DB query that filters by a non-partition-key property, fans out across partitions, and costs high RUs. The partition key cannot change. What should you do?","choices":["Add an index for the filtered property","Increase provisioned RUs to absorb the fan-out","Switch consistency to eventual","Add more regions"],"answer":[0],"explanation":"Indexing the filtered property lowers the RU each partition spends on the query. Raising RUs just pays more, consistency does not change query cost, and regions add cost without helping.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-130","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Lamna Healthcare Company runs a multi-region app where a client must never read data older than it already read, at the lowest cost, without needing the latest global write. Which consistency level?","choices":["Session","Strong","Bounded staleness","Eventual"],"answer":[0],"explanation":"Session gives monotonic read-your-own-writes per client at low cost. Strong is costlier and needs the latest write, bounded staleness over-guarantees, and eventual gives no such guarantee.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-131","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Trey Research runs a vector search over all items in Cosmos DB for NoSQL. Which argument must be set?\n\n```\nresults = container.query_items(\n  query='SELECT TOP 5 c.id FROM c\n    ORDER BY VectorDistance(c.vec,@q)',\n  parameters=[{'name':'@q','value':qv}],\n  ________=True)\n```","choices":["enable_cross_partition_query","populate_query_metrics","enable_scan_in_query","disable_automatic_id_generation"],"answer":[0],"explanation":"A vector search over all items spans partitions, so cross-partition query is required. Query metrics only measure, scan-in-query forces scans, and id generation is unrelated.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-132","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. accesses Cosmos DB data by tenant then user, must avoid hot tenant partitions, and keep per-user reads single-partition. Which partition key?","choices":["A hierarchical key of tenantId then userId","A single key of tenantId","A random GUID per item","A constant value"],"answer":[0],"explanation":"Hierarchical keys subpartition by tenant then user, avoiding hot tenants while keeping user reads local. tenantId alone can hot-spot a big tenant, a GUID scatters reads, and a constant is one hot partition.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-133","obj":"2.1.1","difficulty":"easy","type":"multi","stem":"Fabrikam Residences runs tenant-scoped RAG on PostgreSQL. Select two techniques for fast, scoped retrieval. (Select two.)","choices":["Use pgvector with an HNSW index","Filter with a WHERE clause on metadata","Store embeddings as text and compare strings","Use a B-tree index on the embedding column","Run a full-table scan per query"],"answer":[0,1],"explanation":"pgvector with HNSW plus a metadata WHERE filter gives fast, scoped retrieval. Text comparison is not semantic, a B-tree cannot index vectors for ANN, and full scans are slow.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/service-overview"},{"id":"2.1.1-134","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank needs the best recall and lowest latency for vector search in PostgreSQL, and can accept slower index build and more memory. Which index?","choices":["HNSW","IVFFlat with few lists","No index","A GIN index"],"answer":[0],"explanation":"HNSW gives the best recall and latency, accepting higher build time and memory. IVFFlat with few lists loses recall, no index scans, and GIN does not do vector ANN.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-135","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Southridge Video sees many short-lived PostgreSQL connections from Functions exhaust the connection limit. Fix with the least change?","choices":["Route connections through PgBouncer pooling","Raise max_connections to the maximum","Scale up to more vCores","Add a read replica"],"answer":[0],"explanation":"Pooling multiplexes many short-lived connections onto a few. Raising limits or scaling only delays exhaustion, and a replica does not accept writes.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/service-overview"},{"id":"2.1.1-136","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Margie's Travel has a cache-aside app that suffers a thundering herd when a hot Redis key expires. What reduces the stampede?","choices":["Add a short lock or early recompute around the miss","Remove the TTL so it never expires","Lower the TTL to expire more often","Disable the cache under load"],"answer":[0],"explanation":"A lock or early recompute lets one caller refill while others wait. Removing the TTL serves stale data, a shorter TTL churns more, and disabling the cache defeats it.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-137","obj":"2.1.1","difficulty":"medium","type":"multi","stem":"A. Datum Corporation builds an AI app on Cosmos DB. Select two features central to it. (Select two.)","choices":["Vector search over embeddings","Change feed for reactive processing","Locking throughput at 1 RU","Disabling all indexes","Restricting to a single region"],"answer":[0,1],"explanation":"Vector search and the change feed are core to reactive AI apps on Cosmos DB. 1 RU throttles everything, no indexes break queries, and one region removes global reach.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-138","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Contoso configures an Azure Cosmos DB for NoSQL account with write regions in East US and West Europe so that application servers in both regions can accept writes locally. The architect wants the strongest consistency level the account can still be configured with. Which consistency level should the architect select?","choices":["Strong","Session","Bounded staleness","Eventual"],"answer":[2],"explanation":"Accounts with multiple write regions cannot use strong consistency, because a distributed system cannot provide an RPO and RTO of zero. Bounded staleness is the strongest of the four levels that remain available with multiple write regions. Strong is unavailable once multiple write regions are enabled; Session provides read-your-writes within a session but is weaker than bounded staleness; Eventual is the weakest of all five levels.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-139","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Fabrikam has an Azure Cosmos DB for NoSQL container with the hierarchical partition key /TenantId then /UserId then /SessionId. The team must identify the query pattern that produces a full fan-out across every physical partition, because that pattern drives up request unit cost. Which WHERE filter results in a full fan-out cross-partition query?","choices":["WHERE c.TenantId = 'Fabrikam'","WHERE c.TenantId = 'Fabrikam' AND c.UserId = 'u1'","WHERE c.SessionId = 's1'","WHERE c.TenantId = 'Fabrikam' AND c.UserId = 'u1' AND c.SessionId = 's1'"],"answer":[2],"explanation":"Filtering on only a lower level of the hierarchy (SessionId) without the leading TenantId cannot prune partitions, so the query fans out to all physical partitions. Filtering on TenantId alone is a targeted cross-partition query pruned to that tenant; TenantId plus UserId is a targeted query to a smaller partition subset; supplying all three levels routes to a single physical partition.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-140","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Northwind reads from an Azure Cosmos DB for NoSQL account through the dedicated gateway, but repeated point reads still charge request units. Diagnostics confirm the client uses gateway mode and the dedicated gateway endpoint. The default consistency is bounded staleness. What must the team change so reads can be served from the integrated cache?","choices":["Raise the dedicated gateway node count","Set the read consistency to session or eventual","Enable multiple write regions","Increase MaxIntegratedCacheStaleness above 5 minutes"],"answer":[1],"explanation":"A read is served from the integrated cache only when its consistency is session or eventual. Bounded staleness, consistent prefix, and strong always bypass the cache. Adding nodes helps availability and cache capacity but does not change the consistency bypass; multiple write regions is unrelated to caching eligibility; raising MaxIntegratedCacheStaleness only helps after the consistency requirement is already met.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-141","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Adventure Works must trigger downstream logic on deletes and must not miss intermediate updates that happen between change feed reads in an Azure Cosmos DB for NoSQL container. Which change feed configuration meets both requirements?","choices":["Latest version mode with a soft-delete marker property","All versions and deletes mode with continuous backups enabled","Latest version mode reading from the beginning of the container","Analytical store with Azure Synapse Link"],"answer":[1],"explanation":"All versions and deletes mode captures create, update, and delete operations plus every intermediate version, and it requires continuous backups to be enabled on the account. Latest version mode with a soft-delete marker captures the marker update but still misses intermediate updates and needs manual modeling; latest version from the beginning replays creates and updates only, never deletes; analytical store serves analytics, not an operation-level change log.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-142","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Tailwind Traders wants an Azure Cosmos DB for NoSQL vector search over roughly 2 million embeddings per physical partition, prioritizing the lowest query latency and lowest request unit cost at that scale. Which vector index type should the team choose?","choices":["flat","quantizedFlat","DiskANN","No vector index (exact search)"],"answer":[2],"explanation":"DiskANN is the most performant index type when a search is scoped to more than about 50,000 vectors, offering the lowest latency and request unit cost while keeping high accuracy. flat performs an exhaustive brute-force scan best for tiny sets; quantizedFlat suits partitions of about 50,000 vectors or fewer; omitting the index forces full exact search with the highest cost at this scale.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-143","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Relecloud loads a large batch of embeddings into pgvector on Azure Database for PostgreSQL and wants the fastest index build with the smallest memory footprint, accepting a lower speed-recall tradeoff at query time. Which index type fits these constraints?","choices":["HNSW","DiskANN","No index (exact search)","IVFFlat"],"answer":[3],"explanation":"IVFFlat has faster build times and uses less memory than HNSW, at the cost of lower query performance in the speed-recall tradeoff. HNSW gives a better speed-recall tradeoff but has higher build time and memory use; DiskANN balances accuracy and build speed but is not the lowest-memory option; no index gives perfect recall but the slowest queries.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-144","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Proseware runs pgvector on Azure Database for PostgreSQL with continuous inserts to the embeddings table. The team needs an index whose recall does not degrade as new rows arrive and that never requires a periodic rebuild to stay balanced. Which index type meets both needs with the least operational overhead?","choices":["IVFFlat with a fixed lists value","HNSW","A partial B-tree on the vector column","No index (exact search)"],"answer":[1],"explanation":"HNSW applies inserts to its graph in place, so recall does not degrade and no periodic rebuild is required, unlike IVFFlat. IVFFlat recall degrades as partitions become unbalanced and needs periodic rebuilds; a B-tree cannot serve approximate nearest neighbor search; no index avoids rebuilds but forces slow exact scans.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-145","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Litware enables the built-in PgBouncer on Azure Database for PostgreSQL flexible server in transaction pooling mode. After the switch, session-level SET search_path issued in one transaction no longer applies to later queries. The team needs a schema search path that persists reliably through the pooler. What should they do?","choices":["Run SET search_path at the start of every transaction","Use ALTER ROLE ... SET search_path for the role","Switch PgBouncer to statement pooling mode","Enable prepared transactions in PgBouncer"],"answer":[1],"explanation":"In transaction pooling a server connection is returned to the pool after each transaction, so session-level SET does not persist. ALTER ROLE stores the setting so every connection for that role applies it. Running SET each transaction is fragile and defeats pooling reuse; statement pooling is even more restrictive and breaks multi-statement transactions; PgBouncer transaction pooling does not support prepared transactions.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-146","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Coho Vineyard plans to use Azure Managed Redis as a vector database for a Retrieval-Augmented Generation workload with K-nearest neighbor search. Which two provisioning-time settings are required, given that modules cannot be added after creation? Choose the setting combination that is required.","choices":["Enable RediSearch with the Enterprise clustering policy and NoEviction eviction policy","Enable RedisJSON with the OSS clustering policy and volatile-lru eviction policy","Enable RedisBloom with the Enterprise clustering policy and allkeys-lru eviction policy","Enable RediSearch with the OSS clustering policy and allkeys-lru eviction policy"],"answer":[0],"explanation":"Vector search uses the RediSearch module, which requires the Enterprise clustering policy and the NoEviction eviction policy, and modules must be enabled at creation time. RedisJSON stores documents but does not provide the search engine; RedisBloom provides probabilistic structures, not vector KNN; RediSearch with OSS clustering and an lru eviction policy violates the module requirements.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-147","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Wide World Importers implements the cache-aside pattern with Azure Managed Redis in front of Azure SQL Database. On an update, the application must keep the cache from serving a stale value as long as possible without adopting write-through. What should the write path do?","choices":["Write to Redis first, then to SQL Database","Write to SQL Database, then delete the cached entry","Write to SQL Database only and rely on TTL expiry","Write to both stores inside one distributed transaction"],"answer":[1],"explanation":"In cache-aside, the write path updates the data store and then removes the cached entry so the next read repopulates it from the source of truth. Writing Redis first risks caching a value that never commits to SQL; relying only on TTL leaves a stale entry until it expires; a distributed transaction across both stores is write-through-like coupling that cache-aside deliberately avoids.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-148","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Munson's Pickles runs an Azure Cosmos DB for NoSQL vector query that projects VectorDistance as a score. Query costs are unexpectedly high and latency is poor. The team must reduce request units without changing the embedding model. Which change addresses the root cause?","choices":["Remove the vector path from the excludedPaths section","Switch the account to strong consistency","Add a TOP N clause to the SELECT and ORDER BY VectorDistance","Add a second vector embedding policy to the container"],"answer":[2],"explanation":"Without a TOP N clause the vector search attempts to return far more results, driving up request units and latency; always bound the result set with TOP N. Removing the vector path from excludedPaths raises insert cost and latency, the opposite of the goal; strong consistency does not lower query cost; a container cannot have multiple vector embedding policies changed in place.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-149","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Trey Research wants each tenant document in Azure Cosmos DB for NoSQL to map to its own logical partition while allowing a single large tenant to exceed 20 GB total, and it wants tenant-scoped queries to avoid a full fan-out. Which design meets all three goals?","choices":["A single partition key on /TenantId","A synthetic partition key concatenating TenantId and UserId","A hierarchical partition key of /TenantId then /UserId","Enabling multiple write regions"],"answer":[2],"explanation":"A hierarchical partition key lets a single TenantId span multiple physical partitions (so it can exceed 20 GB) while queries that specify the TenantId prefix are pruned to the relevant partitions. A single /TenantId key caps each tenant at the 20 GB logical partition limit; a synthetic key adds complexity and its tenant queries remain cross-partition unless every user is known; multiple write regions addresses geo-writes, not partition scale.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-150","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Bellows College configured MaxIntegratedCacheStaleness on Azure Cosmos DB for NoSQL reads, but every read still charges request units even with session consistency and the dedicated gateway. The value was set to 0. What is the effect of MaxIntegratedCacheStaleness = 0?","choices":["The cache serves data with unlimited staleness","The read never uses the integrated cache","The cache uses the default 5-minute staleness","The read is forced to strong consistency"],"answer":[1],"explanation":"Setting MaxIntegratedCacheStaleness to 0 means the read never uses the integrated cache, regardless of consistency level. Unlimited staleness would require a very high value, not 0; the default 5 minutes applies only when the value is unset; the setting does not change the request consistency level.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-151","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Alpine Ski House migrates an Azure Cosmos DB for NoSQL client from direct mode to use the integrated cache. After pointing to the dedicated gateway connection string, the .NET SDK still shows zero DedicatedGatewayRequests. Which SDK change is required so requests route through the integrated cache?","choices":["Increase MaxConcurrency on the query","Enable the all versions and deletes change feed","Set the partition key on every request","Set the connection mode to gateway mode"],"answer":[3],"explanation":"The latest .NET and Java SDKs default to direct mode, which bypasses the integrated cache. The client must override the default and use gateway mode to route through the dedicated gateway. MaxConcurrency tunes cross-partition parallelism, not cache routing; the change feed is unrelated to caching; supplying the partition key optimizes routing but does not switch connection mode.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-152","obj":"2.1.1","difficulty":"medium","type":"single","stem":"VanArsdel needs to add subpartitioning to an existing Azure Cosmos DB for NoSQL container that is already in production. What is the supported path to introduce hierarchical partition keys?","choices":["Run an ALTER CONTAINER command to add key levels","Add the extra key paths through the Azure portal Scale settings","Enable the feature flag on the existing container","Create a new container with the hierarchical key and run a container copy job"],"answer":[3],"explanation":"Adding hierarchical partition keys to an existing container is not supported; you create a new container with the desired hierarchical key and copy the data with a container copy job. There is no ALTER CONTAINER to change the key; the Scale blade adjusts throughput, not the partition key; no feature flag converts an existing container in place.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-153","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Fourth Coffee uses hierarchical partition keys in Azure Cosmos DB for NoSQL and expects a single tenant to grow beyond 20 GB. Which statement about the storage limits is correct for the design?","choices":["The 20 GB limit applies to each full logical partition key path, and a tenant can span multiple physical partitions","Hierarchical keys raise the logical partition limit to 50 GB","A physical partition can now hold 100 GB and 20,000 RU/s","The 20 GB limit is removed entirely for hierarchical containers"],"answer":[0],"explanation":"The 20 GB logical partition limit still applies, but with hierarchical keys the logical partition is the full key path, so a single first-level value such as a tenant can span multiple physical partitions and exceed 20 GB in total. The logical partition limit stays at 20 GB, not 50 GB; a physical partition still holds 50 GB and serves up to 10,000 RU/s; the limit is not removed, only distributed across the hierarchy.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-154","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A team benchmarks Azure Database for PostgreSQL flexible server with PgBouncer and needs pub/sub notifications using LISTEN and NOTIFY alongside pooled application traffic. The built-in PgBouncer runs in transaction pooling mode. What is the correct guidance for the LISTEN and NOTIFY workload?","choices":["Use transaction pooling because it fully supports LISTEN and NOTIFY","Use a direct (non-pooled) connection for the pub/sub workload","Switch the whole server to session pooling permanently","Enable statement pooling for the pub/sub connections"],"answer":[1],"explanation":"LISTEN and NOTIFY require a persistent server connection, which transaction pooling does not provide, so the pub/sub workload should use a direct non-pooled connection. Transaction pooling does not support LISTEN and NOTIFY; forcing session pooling for the whole server sacrifices the idle-connection scaling benefit for all traffic; statement pooling is even more restrictive.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-155","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Litware sizes an IVFFlat index in pgvector for a table with roughly 500,000 rows. Following pgvector guidance, the team must pick the number of lists to create. Which value follows the recommendation for a dataset of up to 1 million rows?","choices":["lists = 5000","lists = 707","lists = 500","lists = 50000"],"answer":[2],"explanation":"For datasets up to 1 million rows, pgvector recommends lists = rows / 1000, which is 500 for 500,000 rows. 707 is roughly sqrt(rows), the guidance for datasets larger than 1 million rows; 5000 and 50000 far exceed the recommended list count and would fragment the index.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-156","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A pgvector team on Azure Database for PostgreSQL tries to build an index on a column defined as embedding vector(3072). The CREATE INDEX fails. What is the cause, given the pgvector indexing limits?","choices":["The vector column must be NOT NULL to be indexed","Only DiskANN can index any column, and it is disabled","Cosine distance is not supported above 1536 dimensions","IVFFlat and HNSW indexes support at most 2000 dimensions"],"answer":[3],"explanation":"pgvector can index a vector column of up to 2000 dimensions; a 3072-dimension column exceeds that limit and must use dimensionality reduction or remain unindexed for exact search. Nullability does not block indexing; DiskANN is not the only indexable type and is not the issue here; cosine distance itself has no 1536-dimension cap, the limit is the index dimension count.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-157","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Adventure Works reads the Azure Cosmos DB for NoSQL change feed in latest version mode and later wants to reprocess a specific window by setting a custom start time. A second processor uses all versions and deletes mode. Which statement about starting time is correct?","choices":["Both modes allow customizing the start time to any past point","Only latest version mode allows customizing the start time","Only all versions and deletes mode allows an arbitrary custom start time","Neither mode can start from a past point"],"answer":[1],"explanation":"Customizing the starting point is available only in latest version mode. All versions and deletes mode must start from when the processor starts or resume from a lease within the continuous backup retention period. All versions and deletes mode cannot pick an arbitrary past start time; both statements that grant all-versions arbitrary start times are incorrect; latest version mode can read from any point back to the container origin.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-158","obj":"2.1.1","difficulty":"medium","type":"single","stem":"A team must serve a RAG retrieval query in pgvector that returns only documents a user is authorized to see and orders them by cosine similarity in a single round trip. Which approach meets both the filter and the similarity ranking?","choices":["A WHERE clause on the metadata plus ORDER BY embedding <=> $1","Two separate queries joined in the application layer","ORDER BY embedding <-> $1 with no filter","A GROUP BY on the metadata column"],"answer":[0],"explanation":"A metadata-filtered RAG query combines a WHERE clause on the metadata (for authorization) with ORDER BY on the cosine distance operator to rank by similarity in one query. Splitting into two queries adds round trips and application merge logic; <-> ranks by L2 distance and drops the filter; GROUP BY aggregates rather than ranking nearest neighbors.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-159","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Relecloud sees a cache stampede on Azure Managed Redis: when a popular key expires, hundreds of concurrent requests miss the cache and hammer the backend database at once. The team wants to reduce the simultaneous backend load without abandoning cache-aside. Which mitigation directly addresses the stampede?","choices":["Set the same fixed TTL on every key","Disable TTL so keys never expire","Switch every read to strong consistency in the backend","Serialize repopulation with a short-lived lock so one request refreshes the key"],"answer":[3],"explanation":"A lock (or single-flight) around repopulation lets one request rebuild the expired key while others wait or serve stale data, preventing the concurrent backend pile-on. A single fixed TTL synchronizes expirations and can worsen stampedes; disabling TTL causes unbounded staleness; backend consistency levels do not reduce the concurrent miss count.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-160","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An Azure Cosmos DB for NoSQL account has multiple write regions, and two clients in different regions write the same item concurrently. The team wants a built-in, automatic conflict resolution policy without writing server-side merge code. Which policy meets this?","choices":["Last Writer Wins using a timestamp property","A custom stored-procedure merge policy","Strong consistency to block the second write","Bounded staleness to serialize the writes"],"answer":[0],"explanation":"Last Writer Wins is the default automatic conflict resolution policy for multiple write regions and uses a system or custom numeric property, requiring no merge code. A custom merge policy requires writing a merge procedure; strong consistency is not available with multiple write regions; bounded staleness is a consistency level, not a conflict resolution policy.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-161","obj":"2.1.1","difficulty":"medium","type":"single","stem":"A team tuning Azure Cosmos DB for NoSQL vector search wants the cheapest, lowest-latency path for a multitenant query and can scope each search to one tenant. Which scoping choice minimizes request units the most?","choices":["Scope the query to the full hierarchical partition key value","Run a cross-partition query across all physical partitions","Remove the TOP N clause to widen recall","Raise MaxConcurrency to fan out faster"],"answer":[0],"explanation":"Scoping a vector search to the full hierarchical partition key value usually targets a single logical partition, the cheapest and lowest-latency search path. A full cross-partition query hits every physical partition and is the most expensive; removing TOP N increases cost; raising MaxConcurrency speeds a fan-out but still charges request units per partition.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-162","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A pgvector team wants higher recall from an existing HNSW index at query time without rebuilding the index, accepting some added query latency. Which parameter should they raise?","choices":["ef_search","m","ef_construction","lists"],"answer":[0],"explanation":"ef_search controls the size of the candidate list during query execution; raising it improves recall at the cost of query latency and does not require a rebuild. m and ef_construction are build-time parameters that require rebuilding the index to change; lists applies only to IVFFlat, not HNSW.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-163","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An Azure Cosmos DB for NoSQL container uses session consistency with the integrated cache. After the client application restarts, the first read of a given item still charges request units even though the item is cached on the dedicated gateway. Why?","choices":["A restarted client has no matching session token, so the first read behaves like eventual consistency and can incur a charge","The integrated cache only caches queries, never point reads","Session consistency always bypasses the integrated cache","The dedicated gateway evicts all data on client restart"],"answer":[0],"explanation":"With session consistency, a read without a matching session token (such as the first read after a client restart) incurs a request unit charge; subsequent matching reads can hit the cache. The integrated cache has both an item cache and a query cache; session consistency does not bypass the cache; a client restart does not evict data from the gateway node.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-164","obj":"2.1.1","difficulty":"medium","type":"single","stem":"A team compares vector indexes in Azure Managed Redis RediSearch. They need an exact, exhaustive nearest-neighbor search for a small dataset where perfect precision matters more than latency. Which index type fits?","choices":["HNSW","IVFFlat","DiskANN","FLAT"],"answer":[3],"explanation":"FLAT is an exact brute-force index in RediSearch, useful for smaller datasets or workloads that require exhaustive search. HNSW is an approximate graph index trading precision for latency; IVFFlat and DiskANN are pgvector or Cosmos DB index types, not RediSearch options.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-165","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A pgvector team on Azure Database for PostgreSQL bulk-loads 10 million embeddings and then plans to build an approximate index. What ordering gives both a faster build and a more optimal index layout?","choices":["Create the index first, then load the data","Create the index concurrently during the load","Load half the data, index, then load the rest","Load all data first, then create the index"],"answer":[3],"explanation":"pgvector guidance is to load data before indexing; it is both faster to build and produces a more optimal layout than indexing incrementally during inserts. Indexing before loading forces expensive per-row index maintenance; concurrent build during load and split load-index-load both incur more maintenance overhead and a less optimal layout.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-166","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An Azure Cosmos DB for NoSQL team defines a vector embedding policy and wants to keep insert request-unit cost and latency low. Which indexing-policy step is required for the vector path?","choices":["Add the vector path to excludedPaths in the indexing policy","Add the vector path to includedPaths with a range index","Set the vector path as the partition key","Add a composite index on the vector path"],"answer":[0],"explanation":"The vector path must be added to excludedPaths so it is not covered by the standard index; otherwise vector insertions incur higher request-unit charge and latency. The specialized vectorIndexes configuration handles vector search. Including the vector path with a range index causes the exact cost problem being avoided; a vector cannot serve as a partition key; composite indexes do not apply to vector arrays.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-167","obj":"2.1.1","difficulty":"medium","type":"single","stem":"A team enables the built-in PgBouncer on Azure Database for PostgreSQL flexible server and connects on the standard port with no change. Connections are not being pooled. Which detail explains the miss, given the Azure defaults?","choices":["PgBouncer requires session pooling to be enabled first","PgBouncer only works on the Burstable compute tier","PgBouncer requires strong consistency on the server","PgBouncer listens on port 6432, not the default 5432"],"answer":[3],"explanation":"The built-in PgBouncer listens on port 6432; the application must connect on 6432 (same host name) to use the pooler. Transaction pooling is already the Azure default, no session mode toggle is needed; PgBouncer is supported on General Purpose and Memory Optimized tiers, not Burstable; consistency levels are not a PostgreSQL concept here.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-168","obj":"2.1.1","difficulty":"hard","type":"single","stem":"For a globally distributed Azure Cosmos DB for NoSQL account with a single write region, the business requires a recovery point objective of zero during a region outage. Which consistency level delivers RPO = 0?","choices":["Strong","Bounded staleness","Session","Eventual"],"answer":[0],"explanation":"With more than one region and a single write region, strong consistency provides an RPO of 0 because writes commit synchronously across regions. Bounded staleness bounds loss by K versions and T time but is not zero; session, consistent prefix, and eventual allow up to about 15 minutes of loss during a region-wide outage.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-169","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Complete the Azure Cosmos DB Python SDK call that creates a container with a three-level hierarchical partition key. Which value fills the blank?\n\n```\ncontainer = database.create_container(\n    id=container_name,\n    partition_key=PartitionKey(\n        path=[\"/tenantId\", \"/userId\", \"/sessionId\"],\n        kind=\"________\"\n    )\n)\n```","choices":["MultiHash","Hash","Range","MultiRange"],"answer":[0],"explanation":"Hierarchical (subpartitioned) containers use kind MultiHash with a list of up to three key paths. Hash is the single-path partition kind; Range and MultiRange are not valid partition key kinds for Cosmos DB for NoSQL.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-170","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Complete the Azure Cosmos DB for NoSQL vector query so it returns the top 10 most similar items and projects a similarity score. Which function fills the blank?\n\n```\nSELECT TOP 10 c.title, ________(c.contentVector, @queryVector) AS score\nFROM c\nORDER BY ________(c.contentVector, @queryVector)\n```","choices":["VectorDistance","COSINE_SIMILARITY","VECTOR_SEARCH","EmbeddingDistance"],"answer":[0],"explanation":"VectorDistance is the built-in system function for vector similarity in Azure Cosmos DB for NoSQL queries, used in both the projection and the ORDER BY. COSINE_SIMILARITY, VECTOR_SEARCH, and EmbeddingDistance are not valid Cosmos DB for NoSQL query functions.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-171","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Complete the pgvector statement that creates an HNSW index for cosine similarity on Azure Database for PostgreSQL. Which operator class fills the blank?\n\n```\nCREATE INDEX ON bill_summaries\nUSING hnsw (bill_vector ________);\n```","choices":["vector_l2_ops","vector_cosine_ops","vector_ip_ops","cosine_ops"],"answer":[1],"explanation":"vector_cosine_ops is the operator class for cosine distance and must match the <=> operator used in queries. vector_l2_ops is for L2 distance (<->); vector_ip_ops is for negative inner product (<#>); cosine_ops is not a valid pgvector operator class name.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-172","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Complete the pgvector IVFFlat index definition on Azure Database for PostgreSQL that partitions the data into 100 clusters for cosine search. Which option fills the blank?\n\n```\nCREATE INDEX t_test_cos_idx ON t_test\nUSING ivfflat (embedding vector_cosine_ops)\nWITH (________ = 100);\n```","choices":["probes","m","ef_construction","lists"],"answer":[3],"explanation":"The lists option sets the number of IVFFlat clusters at index creation and applies only to ivfflat indexes. probes is a query-time search setting, not a build option; m and ef_construction are HNSW build parameters, not IVFFlat options.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-173","obj":"2.1.1","difficulty":"medium","type":"multi","stem":"An Azure Cosmos DB for NoSQL account has multiple write regions. The team wants reads that are both allowed with multiple write regions and eligible to be served from the integrated cache. Which two consistency levels satisfy both conditions? (Select two.)","choices":["Strong","Bounded staleness","Session","Consistent prefix","Eventual"],"answer":[2,4],"explanation":"Session and eventual are both supported with multiple write regions and are the only levels the integrated cache serves; the cache bypasses the others. Strong is not available with multiple write regions at all; bounded staleness and consistent prefix are available with multiple write regions but always bypass the integrated cache.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-174","obj":"2.1.1","difficulty":"hard","type":"multi","stem":"A team plans to consume the Azure Cosmos DB for NoSQL change feed in all versions and deletes mode. Which two statements are true of that mode? (Select two.)","choices":["It requires continuous backups to be enabled on the account","It is available for API for NoSQL accounts","It captures deletes only if a soft-delete marker is set","It has unlimited retention independent of backup settings","It cannot capture intermediate updates between reads"],"answer":[0,1],"explanation":"All versions and deletes mode requires continuous backups and is compatible only with Azure Cosmos DB for NoSQL accounts. It captures deletes natively without a soft-delete marker; its retention is bounded by the continuous backup period, not unlimited; it does capture intermediate updates, which is a key reason to use it.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-175","obj":"2.1.1","difficulty":"easy","type":"multi","stem":"A team chooses between HNSW and IVFFlat in pgvector on Azure Database for PostgreSQL. Which two statements correctly describe the tradeoffs? (Select two.)","choices":["HNSW generally uses more memory and has higher build time than IVFFlat","IVFFlat recall can degrade as new rows are inserted, so it benefits from periodic rebuilds","IVFFlat provides a better speed-recall tradeoff than HNSW","HNSW requires a full rebuild after every insert","IVFFlat can index vectors with more than 2000 dimensions"],"answer":[0,1],"explanation":"HNSW costs more memory and build time but gives better query quality; IVFFlat is trained on a sample so recall degrades with inserts and it should be rebuilt periodically. HNSW, not IVFFlat, gives the better speed-recall tradeoff; HNSW applies inserts in place without a full rebuild; neither index type can exceed the 2000-dimension index limit.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-176","obj":"2.1.1","difficulty":"medium","type":"multi","stem":"A team provisions Azure Managed Redis for vector similarity search with KNN. Which two configuration requirements must be met at creation time? (Select two.)","choices":["Enable the RediSearch module during provisioning","Use the Enterprise clustering policy","Use the volatile-lru eviction policy","Choose the Flash Optimized tier","Add the RediSearch module after the cache is created"],"answer":[0,1],"explanation":"RediSearch must be enabled at creation and requires the Enterprise clustering policy for vector search. RediSearch requires the NoEviction policy, not volatile-lru; the Flash Optimized tier does not support RediSearch vector search; modules cannot be added after the cache is created.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-177","obj":"2.1.1","difficulty":"hard","type":"multi","stem":"An Azure Cosmos DB for NoSQL container uses the hierarchical partition key /TenantId then /UserId. Which two WHERE filters are routed efficiently rather than fanning out to all physical partitions? (Select two.)","choices":["WHERE c.TenantId = 'Coho'","WHERE c.TenantId = 'Coho' AND c.UserId = 'u9'","WHERE c.UserId = 'u9'","WHERE c.SessionId = 's3'","WHERE c.status = 'active'"],"answer":[0,1],"explanation":"Filtering on the TenantId prefix, or on TenantId plus UserId, lets the engine prune to the relevant partitions; the full or prefix key avoids a full fan-out. Filtering on UserId alone skips the leading TenantId and fans out; SessionId is not part of this two-level key; a non-key property like status also fans out.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-178","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Fabrikam repeatedly runs SELECT AVG(c.latencyMs) FROM c WHERE c.region = 'eastus' on an Azure Cosmos DB for NoSQL container and must make the query use a composite index. The property inside an aggregate must be positioned correctly and any equality filter must precede it. Which composite index supports the query?","choices":["(latencyMs ASC, region ASC)","(latencyMs ASC)","(region ASC, latencyMs ASC)","(region ASC, latencyMs ASC) with a /* wildcard on latencyMs"],"answer":[2],"explanation":"The property used in the aggregate function must be defined last in the composite index and the equality-filter property must come before it, so (region ASC, latencyMs ASC) is required. (latencyMs ASC, region ASC) places the aggregate property first, which is not supported; a single-path composite on latencyMs omits the region equality filter; the /* wildcard is not allowed in composite paths, which carry an implicit /?.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-179","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders defined one composite index on (lastName ASC, hireDate DESC) for an Azure Cosmos DB for NoSQL container. Without adding a second composite index, which additional ORDER BY clause is also served by this same index?","choices":["ORDER BY c.lastName ASC, c.hireDate ASC","ORDER BY c.lastName DESC, c.hireDate ASC","ORDER BY c.hireDate DESC, c.lastName ASC","ORDER BY c.lastName DESC, c.hireDate DESC"],"answer":[1],"explanation":"A composite index also supports the ORDER BY clause with the opposite order on every path, so (lastName ASC, hireDate DESC) also serves (lastName DESC, hireDate ASC). Flipping only lastName to ASC/ASC or DESC/DESC changes just one path relative direction; reversing the path sequence to (hireDate, lastName) is a different composite index entirely.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-180","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Litware sets an Azure Cosmos DB for NoSQL indexing policy with an included path of /food/ingredients/nutrition/* and an excluded path of /food/ingredients/*. Given include and exclude precedence, which data ends up indexed?","choices":["All data under /food/ingredients","No data under /food/ingredients","Only the scalar at /food/ingredients","Only data under /food/ingredients/nutrition/*"],"answer":[3],"explanation":"When included and excluded paths conflict, the more precise path wins. The deeper included path /food/ingredients/nutrition/* takes precedence, so only the nutrition subtree is indexed while the rest of ingredients is excluded. The excluded path removes the broader ingredients subtree, so all of ingredients is not indexed and nothing being indexed ignores the precise included path; the scalar-only option confuses /? with the wildcard used here.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-181","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Adventure Works uses the exclude-root indexing strategy (the /* path is excluded) and explicitly includes only a few property paths in an Azure Cosmos DB for NoSQL container. Queries that filter on the partition key now scan instead of using the index. What is the cause?","choices":["The partition key property path is not indexed by default under the exclude-root strategy and must be explicitly included","The _etag path must be explicitly included for partition key filters to work","A composite index is required for any equality filter","The indexing mode was set to none"],"answer":[0],"explanation":"Under the exclude-root strategy the partition key property path is not indexed by default and must be added to the included paths if queries filter on it. The _etag exclusion is unrelated to partition key filtering; equality filters use range indexes, not composite indexes; indexing mode none would disable all indexing, not selectively affect the partition key.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-182","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Coho Winery wants to use an Azure Cosmos DB for NoSQL container purely as a key-value store served by point reads, with time-to-live enabled and the lowest possible write request-unit charge. Which indexing policy meets all three constraints?","choices":["Indexing mode set to none","Included paths set to /* with no exclusions","Included paths empty with excluded paths set to /*","A composite index on /id"],"answer":[2],"explanation":"Emptying included paths and excluding /* keeps indexing active (required for TTL) while indexing no property paths, which minimizes write request-unit cost for a key-value store. Indexing mode none disables indexing and forbids TTL; including /* indexes every property, the maximum write cost; a composite index on /id does not help point reads and adds write cost.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-183","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Trey Research adopted a hierarchical partition key ending in /id (a unique last level) so first-level and second-level values can grow beyond 20 GB. A nightly job that atomically writes several related items in one transactional batch now fails. What explains the failure?","choices":["Transactional batches are capped at 50 operations","A transactional batch requires all items to share one partition key value, which a unique /id last level prevents","Continuous backups must be enabled before a transactional batch can run","MultiHash containers do not support point reads"],"answer":[1],"explanation":"A transactional batch operates on items that share a single partition key value. When the last level is a unique /id, no two items share the full partition key path, so a multi-item batch cannot be formed. The batch operation limit is 100, not 50; continuous backups are for the all-versions change feed, not batches; MultiHash containers do support point reads when the full key is supplied.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-184","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Wide World Importers assembles an Azure Cosmos DB for NoSQL transactional batch containing 100 create operations whose serialized payload totals 2.4 MB. The request is rejected before execution. Which per-request limit does the batch violate?","choices":["The 100-operation limit","The 5-second execution limit","The 20 GB logical partition limit","The 2 MB request size limit"],"answer":[3],"explanation":"A transactional batch payload must not exceed the 2 MB request size limit. At 2.4 MB the batch is rejected even though 100 operations is exactly at, not over, the operation cap. Exactly 100 operations is the maximum allowed, so that limit is not exceeded; the 5-second limit applies to execution time, not a pre-execution size check; 20 GB is a storage limit, not a request limit.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-185","obj":"2.1.1","difficulty":"medium","type":"single","stem":"In a Fourth Coffee transactional batch of five operations against one partition key, the third operation attempts to create an item whose id already exists. Which status codes does the response carry?","choices":["409 on the third operation and 424 on the others","412 on every operation","400 on the third operation and 200 on the others","404 on the third operation and 424 on the others"],"answer":[0],"explanation":"A create that collides with an existing id returns 409 (conflict) on the failing operation; because the whole batch rolls back, every other operation returns 424 (failed dependency). 412 is an optimistic-concurrency failure, not an id conflict; the surviving operations never return 200 because the batch is atomic; 404 indicates a missing resource, not a create conflict.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-186","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Bellows College updates items in Azure Cosmos DB for NoSQL by sending If-Match set to each item's _etag. A concurrent writer changed one item first, so the update returns HTTP 412. What is the correct way to handle the 412?","choices":["Let the SDK retry the 412 transparently","Retry immediately with the same _etag value","Refetch the item to obtain the current _etag, then retry the update","Switch the account to strong consistency to prevent 412"],"answer":[2],"explanation":"A 412 precondition failure is an optimistic-concurrency conflict that the SDK does not auto-retry. The client must refetch the item to acquire the current _etag and then retry the conditional update. SDKs deliberately do not auto-retry 412 because it is a logic conflict; retrying with the stale _etag fails again; consistency level does not change optimistic concurrency behavior.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-187","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Proseware wants optimistic concurrency on ReplaceItem calls in the Azure Cosmos DB .NET SDK, but lost updates still occur even though every item exposes an ETag. What is missing from the replace request?","choices":["Session consistency must be enabled on the client","IfMatchEtag must be set explicitly in the replace request options","AllowBulkExecution must be set to true","The partition key must be set equal to the id"],"answer":[1],"explanation":"For replace operations the If-Match (IfMatchEtag) value must be expressed explicitly in the request options; it is not applied implicitly, so without it concurrent writes overwrite each other. Session consistency does not enforce optimistic concurrency; bulk execution is a throughput feature unrelated to concurrency; making the partition key equal to id does not add an ETag check.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-188","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Munson's Pickles and Preserves wants a read that returns the item body only when the item changed since the client last read it, to avoid transferring unchanged content from Azure Cosmos DB for NoSQL. Which conditional header achieves this?","choices":["If-Match with the last-known _etag","A strong-consistency read","A point read with a max item count of 1","If-None-Match with the last-known _etag"],"answer":[3],"explanation":"If-None-Match with the previously seen _etag lets the server return a not-modified response when the item is unchanged, avoiding a full refetch. If-Match is used to conditionally write, not to detect change on read; consistency level does not implement conditional reads; max item count controls page size, not conditional fetching.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-189","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Relecloud must ingest 5 million items into Azure Cosmos DB for NoSQL as fast as possible and is willing to trade higher per-operation latency for higher aggregate throughput. Which .NET client configuration lets the SDK group concurrent point operations into server-side batches per physical partition?","choices":["Set AllowBulkExecution = true in CosmosClientOptions","Wrap all writes in a single transactional batch","Enable the integrated cache","Raise MaxIntegratedCacheStaleness"],"answer":[0],"explanation":"Setting AllowBulkExecution = true puts the client in bulk mode, which groups many concurrent operations into optimized batches per physical partition, maximizing throughput at the cost of individual-operation latency. A single transactional batch is capped at 100 operations within one partition; the integrated cache and its staleness setting affect reads, not write ingestion throughput.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-190","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Contoso needs to explain the difference between bulk execution and transactional batch in Azure Cosmos DB for NoSQL to a new engineer. Which statement is accurate?","choices":["Both features are atomic across all partitions","Bulk execution is atomic while transactional batch is best-effort","Bulk execution optimizes many independent operations across partitions without atomicity, while a transactional batch is atomic within a single partition key","Transactional batch has no operation-count limit"],"answer":[2],"explanation":"Bulk execution maximizes throughput for many independent operations across partitions and does not provide atomicity, whereas a transactional batch commits all-or-nothing within one partition key value. Bulk execution provides no atomicity, and it is the batch (not bulk) that is atomic; a transactional batch is limited to 100 operations.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-191","obj":"2.1.1","difficulty":"medium","type":"single","stem":"City Power and Light runs an Azure Cosmos DB for NoSQL container at manual 30,000 RU/s in a single-write-region account. Over a full month the average normalized utilization is 45 percent. Which throughput offer is cheaper and why?","choices":["Manual, because average utilization is below 66 percent","Autoscale, because average utilization is below 66 percent","Autoscale, because it is always cheaper regardless of utilization","Manual, because autoscale caps consumption at 10 percent of max"],"answer":[1],"explanation":"When average utilization is below about 66 percent, autoscale is cheaper because it scales down during low hours despite its 1.5x per-RU rate; above 66 percent manual wins. Manual is cheaper only above 66 percent utilization; autoscale is not always cheaper; the 10 percent value is the autoscale floor, not a hard cap on consumption.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-192","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines configures autoscale on an Azure Cosmos DB for NoSQL container with a maximum of 20,000 RU/s. During one hour the container receives no requests at all. What RU/s is billed for that hour?","choices":["0 RU/s","20,000 RU/s","200 RU/s","2,000 RU/s, which is 10 percent of the maximum"],"answer":[3],"explanation":"Autoscale bills the highest RU/s the system scaled to in the hour, with a floor of 0.1 times the maximum. With no traffic the container is billed the minimum of 2,000 RU/s. Autoscale never bills 0 because of the 10 percent floor; 20,000 is the maximum, reached only under load; 200 is 10 percent of 2,000, not of 20,000.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-193","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Tailwind Traders runs an Azure Cosmos DB for NoSQL account with multiple write regions spanning three regions and highly variable traffic. Which throughput choice does Microsoft recommend and why?","choices":["Autoscale, because with multiple write regions the autoscale rate equals the manual rate, so there is no extra cost","Manual, because autoscale always costs 1.5x the manual rate","Serverless, because multiple write regions require serverless","Manual, because autoscale is unavailable with multiple write regions"],"answer":[0],"explanation":"In accounts with multiple write regions and more than one region, the autoscale per-RU rate equals the manual rate, so autoscale carries no cost premium and you pay only for what the system scales to. It is always recommended there. The 1.5x premium applies only to single-write-region accounts; multiple write regions do not require serverless; autoscale is fully available with multiple write regions.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-194","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Wingtip Toys provisions 4,000 RU/s on an Azure Cosmos DB for NoSQL container in an account associated with three regions. What total RU/s is available globally, and can RUs be assigned to just one region?","choices":["4,000 RU/s total, shared across the regions","12,000 RU/s total, and RUs can be assigned per region","12,000 RU/s total, and RUs cannot be assigned to a single region","4,000 RU/s available only in the write region"],"answer":[2],"explanation":"Provisioned RU/s are guaranteed in each region, so total globally equals R times N, which is 4,000 times 3, or 12,000 RU/s. RUs cannot be selectively assigned to one region. The 4,000 value is per region, not the shared global total; RUs cannot be assigned per region; throughput is provisioned in every associated region, not only the write region.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-195","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Humongous Insurance reads a 1 KB item by its id and partition key from an Azure Cosmos DB for NoSQL container configured with strong consistency. What is the request-unit charge, and how does an equivalent SELECT that filters on id and partition key compare?","choices":["1 RU, and the SELECT is identical in cost","2 RU for the point read, and the equivalent SELECT costs more and is not a point read","2 RU for both the point read and the SELECT","1 RU, because strong consistency does not affect reads"],"answer":[1],"explanation":"A 1 KB point read is normally 1 RU, but strong or bounded staleness consistency doubles read cost to 2 RU. A SELECT filtering on id and partition key is a query, not a point read, so it costs more. Strong consistency doubles the point-read cost, so 1 RU is wrong; a filtered SELECT is not the same as a point read and is not identically priced.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-196","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Lucerne Publishing wants the cheapest possible fetch of a single 1 KB item from Azure Cosmos DB for NoSQL. Which access pattern is a true point read?","choices":["SELECT * FROM c WHERE c.id = @id AND c.pk = @pk","SELECT VALUE c FROM c WHERE c.id = @id","A change feed read filtered to one id","ReadItem by id and partition key through the SDK"],"answer":[3],"explanation":"A point read is a key/value lookup by id and partition key issued through the SDK or REST API. It costs 1 RU for a 1 KB item and is the most efficient read. A SELECT that filters on id and partition key is a query, not a point read, even though it targets one item; a change feed read is a feed operation, not a point read.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-197","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Southridge Video chose a hierarchical partition key whose first level is /deviceType, which has only four distinct values, in Azure Cosmos DB for NoSQL. Write throughput bottlenecks badly at ingestion. What is the root cause?","choices":["Low first-level cardinality collocates all writes for a value onto one physical partition until it reaches 50 GB and splits","The 20 GB logical partition limit is exceeded immediately at creation","MultiHash keys require exactly three levels to distribute writes","Point reads are disabled for low-cardinality partition keys"],"answer":[0],"explanation":"Hierarchical keys collocate all items with the same first-level value on one physical partition, so a low-cardinality first level funnels all writes for a value to a single physical partition until it reaches 50 GB and splits, throttling throughput. The 20 GB limit applies to a logical partition path, not immediately at creation; MultiHash allows two or three levels; point reads are not disabled by cardinality.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-198","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A Woodgrove Bank container uses the hierarchical partition key /TenantId then /UserId in Azure Cosmos DB for NoSQL. A query filters only on UserId. How is the query routed and why?","choices":["Single physical partition, because UserId is unique","Pruned to one tenant, because the hierarchy indexes UserId first","Full fan-out to all physical partitions, because the leading TenantId is absent","Rejected, because filtering on a middle-only level is invalid"],"answer":[2],"explanation":"Efficient routing requires the leading key of the hierarchy. Filtering only on UserId without TenantId cannot prune partitions, so the query fans out to every physical partition. UserId is not the leading key and is not guaranteed unique; the hierarchy prunes on the prefix TenantId, not UserId; a middle-only filter is valid but simply results in a full fan-out.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-199","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Nod Publishers adds /id as the third level of a hierarchical partition key in Azure Cosmos DB for NoSQL so the first and second levels can each exceed 20 GB. Which capability does this unique-last-level design give up?","choices":["Point reads by id","Transactional batch and stored procedures that need multiple items under one partition key value","Vector search on the container","Change feed consumption"],"answer":[1],"explanation":"A unique /id last level means no two items share the full partition key path, which breaks transactional batch and stored procedures that require multiple items grouped under one partition key value. Point reads still work when the full key is supplied; vector search and change feed do not depend on multiple items sharing a partition key value.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-200","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Graphic Design Institute stores 3,072-dimension embeddings in Azure Cosmos DB for NoSQL and wants a brute-force index guaranteeing 100 percent recall. Creating a flat vector index fails. What is the cause and the fix?","choices":["flat requires at least 1,000 vectors, so more must be inserted first","Vectors cannot exceed 505 array elements, so the array must be truncated","flat works only on shared throughput, so the tier must change","flat supports at most 505 dimensions, so use quantizedFlat or DiskANN (up to 4,096) or reduce dimensionality"],"answer":[3],"explanation":"The flat index type is limited to 505 dimensions. A 3,072-dimension vector exceeds that, so quantizedFlat or DiskANN (up to 4,096 dimensions) is required, or the dimensions must be reduced. The 1,000-vector minimum applies to quantizedFlat and DiskANN, not flat; the array itself is not capped at 505 elements arbitrarily; vector search is not supported on shared throughput at all, which is the opposite of the stated fix.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-201","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys scopes every Azure Cosmos DB for NoSQL vector search to a partition holding roughly 30,000 vectors and wants brute-force accuracy at the lowest request-unit cost. Which vector index type is recommended?","choices":["quantizedFlat","DiskANN","flat","No vector index"],"answer":[0],"explanation":"quantizedFlat is recommended when the scoped set is about 50,000 vectors or fewer. It performs a brute-force search over compressed vectors, giving lower latency and RU cost than flat while keeping high accuracy. DiskANN is aimed at larger scoped sets; flat is limited to 505 dimensions and costs more RU; omitting the index forces a full scan with the highest cost.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-202","obj":"2.1.1","difficulty":"easy","type":"single","stem":"First Up Consultants creates a quantizedFlat vector index in Azure Cosmos DB for NoSQL but only 400 vectors are inserted. Searches are slower and cost more request units than expected. Why?","choices":["quantizedFlat requires strong consistency to function","The index is automatically disabled below 505 vectors","Below 1,000 indexed vectors a full scan is used instead of the quantized index","Vector search requires a shared-throughput account"],"answer":[2],"explanation":"quantizedFlat and DiskANN require at least 1,000 indexed vectors so the quantization is accurate. With fewer than 1,000 vectors the engine performs a full scan, which raises latency and RU charges. Consistency level does not gate the index; there is no 505-vector disable threshold; vector search is not supported on shared-throughput accounts.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-203","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Consolidated Messenger must change an Azure Cosmos DB for NoSQL container's vector index from quantizedFlat to DiskANN. What does the change require?","choices":["Run an ALTER command to change the vector index in place","Create a new container with the new vector policy and migrate the data","Toggle a portal setting on the existing container","Add a second vectorIndexes entry to the existing policy"],"answer":[1],"explanation":"Vector policies and vector indexes are immutable after container creation. Switching index types requires creating a new container with the desired vector policy and migrating the data. There is no in-place ALTER for a vector index; no portal toggle converts the index; a container cannot hold two vector indexes for the same path swapped in place.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-204","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Margie's Travel sees high insert request-unit charges on an Azure Cosmos DB for NoSQL container that stores a 1,536-dimension vector property and already has a vectorIndexes entry. Which indexing-policy change reduces the insert cost?","choices":["Remove the vectorIndexes entry entirely","Add the vector path to a composite index","Enable strong consistency on the account","Add the vector path to excludedPaths so the standard index does not also index it"],"answer":[3],"explanation":"Adding the vector path to excludedPaths stops the standard index from also indexing the large vector array, which lowers insert request-unit cost while the dedicated vectorIndexes configuration still serves vector search. Removing vectorIndexes disables efficient vector search; composite indexes do not apply to vector arrays; consistency level does not change insert indexing cost.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-205","obj":"2.1.1","difficulty":"easy","type":"single","stem":"School of Fine Art must replay Azure Cosmos DB for NoSQL changes starting from an arbitrary point three days ago and does not need delete events. Which change feed mode and start option fits?","choices":["Latest version mode with a custom start time","All versions and deletes mode starting from Now()","All versions and deletes mode with an arbitrary past start time","Latest version mode starting from Now() only"],"answer":[0],"explanation":"Only latest version mode supports customizing the start time to any point back to the container origin, and it captures creates and updates, which is sufficient because deletes are not needed. All versions and deletes mode can only start from Now() or a continuation token within the retention window, not an arbitrary past time; restricting latest version mode to Now() would miss the three-day-old changes.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-206","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Adatum Corporation must enable bulk execution on the Azure Cosmos DB .NET SDK client so many concurrent writes are grouped into per-partition batches. Complete the client options. Which property fills the blank?\n\n```\nCosmosClientOptions options = new CosmosClientOptions\n{\n    ________ = true\n};\nCosmosClient client = new CosmosClient(endpoint, credential, options);\n```","choices":["EnableBulkOperations","UseBulkExecutor","AllowBulkExecution","BulkMode"],"answer":[2],"explanation":"AllowBulkExecution is the CosmosClientOptions property that turns on bulk mode in the .NET v3 SDK. EnableBulkOperations, UseBulkExecutor, and BulkMode are not valid CosmosClientOptions members; the legacy bulk executor library used a separate class, not this option.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-207","obj":"2.1.1","difficulty":"hard","type":"single","stem":"VanArsdel applies optimistic concurrency to a ReplaceItemAsync call in the Azure Cosmos DB .NET SDK so the write only succeeds if the item is unchanged. Complete the request options. Which property fills the blank?\n\n```\nItemRequestOptions options = new ItemRequestOptions\n{\n    ________ = item.ETag\n};\nawait container.ReplaceItemAsync(item, item.Id,\n    new PartitionKey(item.Pk), options);\n```","choices":["IfNoneMatchEtag","IfMatchEtag","SessionToken","ConsistencyLevel"],"answer":[1],"explanation":"IfMatchEtag maps to the If-Match header and enforces the optimistic-concurrency check: the replace succeeds only when the server _etag matches the supplied value. IfNoneMatchEtag is used for conditional reads to detect change; SessionToken governs session consistency; ConsistencyLevel sets read consistency, none of
