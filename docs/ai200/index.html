p without seeing the secret value. A plaintext app setting is visible to anyone who can manage the app; granting all operators Secrets Officer exposes the value broadly; pipeline variables spread the secret and are visible to pipeline editors.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-96","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Contoso runs a workload that signs documents with keys stored in an Azure Key Vault Managed HSM. For disaster recovery, an administrator creates a single-key backup and must restore it into a second Managed HSM in another region. What must be true of the target Managed HSM for the restore to succeed?","choices":["The target Managed HSM must share the same security domain as the source Managed HSM.","The target Managed HSM must be in the same Azure region as the source Managed HSM.","The target Managed HSM must use the same user-assigned managed identity as the source Managed HSM.","The target Managed HSM must have purge protection disabled before the restore."],"answer":[0],"explanation":"A key backup is an encrypted blob cryptographically tied to the source HSM security domain, so it can be restored only into an HSM that shares that same security domain. Same region is wrong because cross-region recovery is the whole point of the security-domain design. Same user-assigned managed identity is wrong because a UAMI is used for storage-account access during full backup and restore, not as a single-key restore prerequisite. Purge protection is wrong because a single-key restore fails only if a key with the same name already exists, not due to purge protection.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-97","obj":"4.1.1","difficulty":"easy","type":"single","stem":"An operator at Fabrikam needs a least-privilege built-in role that can run a full backup of a Managed HSM, including all keys, versions, and role assignments, but must not be able to perform cryptographic operations or manage role assignments. Which role should you assign?","choices":["Managed HSM Administrator","Managed HSM Backup","Managed HSM Crypto Officer","Managed HSM Crypto User"],"answer":[1],"explanation":"Only Managed HSM Administrator and Managed HSM Backup can run a full backup, and Managed HSM Backup grants the backup data action without any cryptographic or administrative permissions, which meets least privilege. Managed HSM Administrator can run a full backup but also has full control, so it is not least privilege. Crypto Officer manages keys and cryptographic operations but cannot run a full backup. Crypto User only performs cryptographic operations with existing keys and cannot run a full backup.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-98","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Tailwind Traders application must wrap and unwrap data encryption keys by calling a key in Azure Key Vault, but the key material must never leave the vault. Using the Azure RBAC permission model, which built-in role grants exactly the data-plane permission to perform these cryptographic operations without allowing the application to create or delete keys?","choices":["Key Vault Crypto User","Key Vault Crypto Officer","Key Vault Secrets User","Key Vault Administrator"],"answer":[0],"explanation":"Key Vault Crypto User grants use of an existing key for cryptographic operations such as wrap and unwrap without key management, and the key material stays inside the vault. Key Vault Crypto Officer also allows creating and deleting keys, which is broader than required. Key Vault Secrets User reads secret values, not keys, so it cannot perform key cryptographic operations. Key Vault Administrator has full data-plane control, which violates least privilege.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-99","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders locked down a key vault by enabling the firewall and selecting the option to allow trusted Microsoft services to bypass the firewall. An Azure DevOps pipeline that reads a secret now fails, although Azure Backup continues to work. What is the correct explanation and fix?","choices":["The bypass setting applies only to control-plane calls, so switch the pipeline to the management API.","Trusted-services bypass requires the vault to use the access policy permission model, so disable Azure RBAC.","Azure DevOps is not on the trusted services list, so add a firewall IP rule, a virtual network rule, or a private endpoint for it.","Azure Backup and Azure DevOps cannot both bypass the firewall, so create a separate vault for the pipeline."],"answer":[2],"explanation":"The trusted-services bypass admits only services on the documented list; Azure Backup qualifies, but Azure DevOps runs customer-authored code and is not trusted, so it needs an explicit IP rule, virtual network rule, or private endpoint. Firewall rules apply to data-plane operations, and switching to the management API does not grant secret access. The bypass is independent of the permission model, so disabling Azure RBAC does nothing. There is no one-service cap that forces a separate vault.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-100","obj":"4.1.1","difficulty":"easy","type":"single","stem":"After migrating a key vault from access policies to the Azure RBAC permission model, Adventure Works accidentally deletes the vault and then recovers it from soft-delete. Applications immediately return authorization failures even though the vault and its secrets are back. What is the most likely cause?","choices":["Recovering a vault reverts it to the access policy permission model, removing all role assignments.","Soft-delete recovery regenerates the vault URI, so the applications point to the wrong endpoint.","Recovered vaults require purge protection to be enabled before role assignments take effect.","Azure RBAC role assignments are not preserved when a vault is recovered from soft-delete and must be recreated."],"answer":[3],"explanation":"Documented behavior states that role assignments are not preserved when a vault is recovered after soft-delete, so all role assignments must be recreated after recovery. Recovery keeps the RBAC permission model, so it does not revert to access policies. The vault URI is unchanged after recovery. Purge protection is unrelated to whether RBAC assignments are evaluated.","ref":"https://learn.microsoft.com/azure/key-vault/general/soft-delete-overview"},{"id":"4.1.1-101","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Wingtip Toys stores a single key named AppConfig:MaxItems in Azure App Configuration but needs different values for the Development, Staging, and Production environments without duplicating the key name. Which App Configuration feature should you use to distinguish the values?","choices":["Snapshots","Labels","Feature flags","Geo-replication replicas"],"answer":[1],"explanation":"Labels let a single key hold multiple values that are differentiated per environment, and configuration providers select the correct value by using a label filter. Snapshots are immutable point-in-time subsets, not per-environment value variants. Feature flags toggle feature availability, not configuration values. Geo-replication replicas provide availability and lower latency, not per-environment value variation.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-102","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Relecloud wants to guarantee that a specific, unchangeable set of configuration key-values is used during a phased production rollout and can serve as a last known good configuration for rollback. Which App Configuration capability meets this requirement?","choices":["Enable geo-replication to a second region.","Add a private endpoint to the store.","Create an immutable snapshot from key and label filters.","Configure a time-based access token on the key-values."],"answer":[2],"explanation":"A snapshot is a named, immutable subset of key-values composed through key and label filters, which is designed for controlled rollout and last known good rollback. Geo-replication addresses availability, not immutability. A private endpoint provides network isolation, not a frozen configuration set. There is no time-based access token feature that makes key-values immutable.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-103","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Proseware enabled geo-replication on an App Configuration store and connects through a single private endpoint in the origin region. During a regional outage in the origin region, clients lose connectivity even though a healthy replica exists elsewhere. What change ensures connectivity during a regional outage?","choices":["Increase the startup retry timeout in the configuration provider.","Switch the store from the Standard tier to the Premium tier.","Replace the private endpoint with a service endpoint.","Create a separate private endpoint for each replica, in each replica region, with matching DNS records."],"answer":[3],"explanation":"Private endpoints are regional resources, so a single private endpoint does not survive its own region outage; provisioning a private endpoint per replica region with the matching DNS records preserves connectivity. A longer retry timeout cannot reach an endpoint whose region is down. The pricing tier does not change endpoint regionality. App Configuration does not support service endpoints, so that is not a valid replacement.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-104","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Tailspin configures a user-assigned managed identity with a federated identity credential so a GitHub Actions workflow can obtain Microsoft Entra ID tokens without a secret. The token exchange silently fails and returns no error. Which configuration detail most likely does not match the incoming external token?","choices":["The managed identity was created in the wrong Azure region.","The subject and issuer values do not exactly match the sub and issuer claims in the external token.","The federated credential description field was left empty.","The audience value is set to api://AzureADTokenExchange."],"answer":[1],"explanation":"The issuer and subject on the federated identity credential are validated against the issuer and sub claims in the external token, and a mismatch causes the exchange to fail without an explicit error. The identity region does not affect claim matching aside from unsupported-region creation limits. The description field is optional and is not validated. The value api://AzureADTokenExchange is the recommended and correct audience, so it would not cause the failure.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-105","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank uses one user-assigned managed identity to federate with many GitHub environments and hits a limit when adding another federated identity credential. Which statement correctly describes the constraint?","choices":["A maximum of 20 federated identity credentials can be added per identity, and each must have a unique issuer and subject combination.","Federated identity credentials support wildcards in the subject, so one credential can cover all environments.","Each federated identity credential consumes one service principal quota unit in the tenant.","Federated identity credentials support multiple audiences per credential to cover many environments."],"answer":[0],"explanation":"A user-assigned managed identity (or app) is limited to 20 federated identity credentials, and the issuer and subject combination must be unique on each one. Wildcards are not supported in standard federated identity credential values. Federated identity credentials do not consume service principal quota. Each credential supports only a single audience value, not multiple.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-106","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Python application at Lucerne Publishing uses DefaultAzureCredential. It runs on an Azure host that has a system-assigned managed identity, but the deployment pipeline also sets the AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_CLIENT_SECRET environment variables for a service principal. Which identity does DefaultAzureCredential attempt first?","choices":["The managed identity, because managed identity always takes precedence on an Azure host.","Neither; DefaultAzureCredential requires you to specify the credential explicitly.","The environment-variable service principal, because EnvironmentCredential precedes ManagedIdentityCredential in the chain.","The Azure CLI credential, because developer-tool credentials are attempted first."],"answer":[2],"explanation":"The DefaultAzureCredential chain is ordered Environment, then Workload Identity, then Managed Identity, then developer tools, and the first credential that succeeds is used, so the environment service principal wins. Managed identity is third in the chain, not first. DefaultAzureCredential is a preconfigured chain and does not require explicit selection. The Azure CLI credential is a developer-tool credential attempted after managed identity, not first.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-107","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Fourth Coffee ingests verbose application logs into a Log Analytics workspace and wants to drop records below Warning severity before they are stored, to reduce ingestion cost. Where should this filtering be defined?","choices":["In a KQL transformation (transformKql) in the data collection rule, applied at ingestion time.","In a Log Analytics saved query that runs on a schedule.","In the table total retention setting.","In an action group attached to a metric alert."],"answer":[0],"explanation":"Data collection rule transformations are KQL queries that filter and modify records before they are stored, which reduces ingestion cost. A scheduled saved query runs after data is already ingested and billed. Total retention governs how long data is kept, not what is ingested. Action groups define notifications and cannot filter ingested data.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-108","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Alpine Ski House sends logs with Azure Monitor Agent on virtual machines to a Log Analytics workspace that is configured for Azure Private Link. Which component must be created and associated so the agent can retrieve its configuration and ingest data over the private link?","choices":["A second Log Analytics workspace as a failover target.","A dynamic threshold alert rule.","A data collection endpoint (DCE).","An Application Insights availability test."],"answer":[2],"explanation":"A data collection endpoint is required when sending data to a workspace configured for private link, because it provides the ingestion and configuration-access endpoints that Azure Monitor Agent uses. A failover workspace does not enable private-link ingestion. A dynamic threshold rule is for alerting, not data collection. An availability test is synthetic monitoring and is unrelated to agent ingestion.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-109","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard must keep high-volume, rarely queried audit logs cheaply for compliance and needs only occasional single-table queries across the entire retention period. Which Log Analytics table plan best fits, at the lowest ingestion cost?","choices":["Analytics","Auxiliary","Basic","Search job results"],"answer":[1],"explanation":"The Auxiliary plan offers the lowest-cost ingestion for low-touch audit and compliance data and allows unoptimized single-table queries for the entire retention period. Analytics is for continuous monitoring at a higher ingestion cost. Basic is for troubleshooting and limits interactive queries to a fixed 30-day window. Search job results is a query mechanism, not a table plan.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-110","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel keeps a table on the Analytics plan with 30 days of interactive retention but must retain the data for seven years for audits, retrieving specific records only occasionally. What is the correct configuration and access method?","choices":["Raise the interactive analytics retention to seven years so the data stays continuously queryable.","Switch the table to the Basic plan, which supports seven-year interactive queries.","Export the data to an action group for archival.","Set the table total retention to seven years and run a search job to retrieve records from long-term retention."],"answer":[3],"explanation":"Total retention can extend up to 12 years for low-cost long-term retention, and data in long-term retention is accessed on demand by running a search job. Analytics interactive retention maxes at 730 days and is costly for seven years. The Basic plan has a fixed 30-day query window, not seven years. Action groups are notification objects and cannot archive data.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-111","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Trey Research wants an interactive, shareable report that combines Log Analytics query results, metrics charts, and parameter controls into a single visual document for on-call engineers. Which Azure Monitor feature should you use?","choices":["An action group","A data collection rule","A dynamic threshold metric alert","Azure Monitor workbooks"],"answer":[3],"explanation":"Azure Monitor workbooks provide interactive reports that combine logs, metrics, text, and parameters in a single shareable document. An action group defines notifications and actions. A data collection rule governs ingestion. A dynamic threshold metric alert evaluates a signal against a learned threshold and does not produce reports.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-112","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines defines email, SMS, and webhook notifications once and wants to reuse the same set of recipients and actions across dozens of metric and log alert rules. Which Azure Monitor object encapsulates these notification and action preferences for reuse?","choices":["A data collection endpoint","A Log Analytics table plan","An action group","A workbook template"],"answer":[2],"explanation":"An action group is a reusable collection of notification preferences and actions that can be attached to many alert rules. A data collection endpoint is an ingestion and configuration endpoint. A table plan governs a table cost and retention. A workbook template defines a report layout, not alert notifications.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-113","obj":"4.1.1","difficulty":"medium","type":"single","stem":"VanArsdel needs a metric alert on request latency across hundreds of resources but cannot pick a fixed threshold because normal latency varies by time of day. Which alerting approach requires the least manual tuning and adapts to historical patterns?","choices":["A static threshold metric alert set to the 95th percentile.","A log search alert that runs every five minutes with a fixed count.","A metric alert with dynamic thresholds, which uses machine learning to learn patterns and set thresholds automatically.","An availability test with a fixed timeout."],"answer":[2],"explanation":"Dynamic thresholds apply machine learning to a signal historical behavior, scale to hundreds of series with a single rule, and adapt over time to reduce noisy or overly wide thresholds. A static threshold requires a preset value and does not adapt to daily patterns. A fixed-count log search alert is still a static threshold. An availability test measures endpoint reachability, not latency thresholds.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-114","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Litware must monitor availability of an internal web service that runs behind a corporate firewall and is not reachable from the Microsoft public test agents. Which Application Insights approach lets them report availability results?","choices":["Create a standard availability test that sends a single public request to the service.","Enable live metrics and read availability from the stream.","Configure the Snapshot Debugger to capture availability snapshots.","Write custom code that runs behind the firewall and reports results by using the TrackAvailability API."],"answer":[3],"explanation":"For endpoints that public test agents cannot reach, you run your own test process behind the firewall and push results to Application Insights by using the TrackAvailability API, and the results appear as availability telemetry. A standard availability test originates from public agents and cannot reach the internal endpoint. Live metrics show real-time telemetry, not synthetic availability results. The Snapshot Debugger captures exception state, not availability.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-115","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Contoso Pharmaceuticals wants to automatically capture the call stack and local variable values at the moment an unhandled exception occurs in a live .NET application on Azure App Service, without redeploying or attaching a debugger. Which Application Insights capability provides this?","choices":["Live Metrics","Snapshot Debugger","Profiler","Standard availability test"],"answer":[1],"explanation":"The Snapshot Debugger automatically collects a debug snapshot, including the call stack and variable values, on top-throwing exceptions in a live application, and viewing it requires the Application Insights Snapshot Debugger role. Live Metrics streams real-time telemetry with one-second latency but does not capture exception snapshots. Profiler captures performance traces of request execution, not exception state. A standard availability test is a synthetic uptime check.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-116","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Humongous Insurance must reach Key Vault only from the app's VNet, and the app must authenticate without secrets. What should you do?","choices":["A private endpoint plus a managed identity with an RBAC role","A public vault with an access key","A firewall allowing all Azure services","A SAS token in code"],"answer":[0],"explanation":"A private endpoint restricts the network and a managed identity with RBAC removes stored secrets. A public vault, an all-Azure firewall, and a SAS token in code expose or store credentials.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-117","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"Wingtip Toys needs secretless authentication to Azure services. Select two approaches. (Select two.)","choices":["Managed identity with RBAC","Workload identity federation","A client secret in code","A SAS token in config","Basic authentication"],"answer":[0,1],"explanation":"Managed identity and workload identity federation authenticate without stored secrets. Client secrets, SAS tokens, and basic auth all store credentials.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-118","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Trey Research needs one identity reused across five apps that survives any single app's deletion. What should you use?","choices":["A user-assigned managed identity","A system-assigned managed identity per app","A shared client secret","A shared connection string"],"answer":[0],"explanation":"A user-assigned identity is shared across apps and survives any single app's deletion. A system-assigned identity dies with its app, and shared secrets or strings store credentials.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-119","obj":"4.1.1","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. must rank the slowest dependencies by p95 duration in Azure Monitor. Which operator replaces the blank?\n\n```\ndependencies\n| where timestamp > ago(1h)\n| summarize p95=percentile(duration,95) by target\n| ________ p95 desc\n```","choices":["order by","where","project","render"],"answer":[0],"explanation":"order by p95 desc ranks the slowest dependencies. where filters, project selects columns, and render draws a chart without ranking.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-120","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank finds traces disconnect where a request crosses from an HTTP call into a Service Bus message. What fixes the correlation?","choices":["Propagate trace context in the message application properties","Rely on matching timestamps","Use a new trace id after the queue","Increase sampling"],"answer":[0],"explanation":"Carrying the W3C trace context in message properties links spans across the async hop. Timestamps do not correlate, a new trace id breaks the chain, and sampling only changes volume.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-121","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Contoso stores database encryption keys in an Azure Key Vault. Security requires that a deleted vault stay recoverable for a fixed window AND that no administrator, not even Microsoft, can permanently remove it during that window. Which single configuration satisfies both requirements?","choices":["Enable soft delete only, with a 90-day retention period","Enable soft delete and enable purge protection","Enable purge protection only and leave soft delete off","Assign the Key Vault Purge Operator role to no principals"],"answer":[1],"explanation":"Soft delete makes deleted objects recoverable for the retention window; purge protection layers on a mandatory retention that cannot be overridden by anyone, including Microsoft, so both requirements are met only when both are enabled. Soft delete alone leaves the vault purgeable during retention, meeting recoverability but not the no-override rule. Purge protection cannot be enabled without soft delete first, so that option is invalid. Removing the Purge Operator role reduces who can purge but does not enforce a mandatory retention the way purge protection does.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-122","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Fabrikam web app authenticates to Key Vault with a managed identity and must read secret values at runtime but must never create, update, or delete secrets, and must not manage vault networking. Under the Azure RBAC permission model, which built-in role follows least privilege?","choices":["Key Vault Administrator","Key Vault Secrets Officer","Key Vault Reader","Key Vault Secrets User"],"answer":[3],"explanation":"Key Vault Secrets User grants data-plane read of secret values only, which is exactly what a consuming app needs under least privilege. Secrets Officer also allows set and delete of secrets, exceeding the requirement. Administrator grants full data-plane management. Key Vault Reader lets the identity read vault and object metadata but not the secret values the app must retrieve.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-123","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Tailwind Traders enables the Key Vault firewall to deny public traffic, yet a pipeline that only runs az keyvault update to change vault tags keeps working from the public internet. Why is the tag change unaffected by the firewall?","choices":["Tag changes are treated as a trusted-service operation that always bypasses the firewall","Control-plane calls are automatically routed through a private endpoint","Key Vault firewall and virtual network rules apply only to data-plane operations, not control-plane operations","The pipeline identity holds the Key Vault Administrator role, which bypasses the firewall"],"answer":[2],"explanation":"Firewall and virtual network rules restrict only the data plane (keys, secrets, certificates). Control-plane operations through Azure Resource Manager, such as editing tags, are not affected. An RBAC data-plane role does not exempt a caller from the firewall. Trusted-service bypass applies to specific Azure services performing data-plane operations, not to tag edits. A private endpoint is not created automatically and would still be a data-plane path.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-124","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Northwind must ensure a Key Vault key is replaced on a schedule without any application downtime or code change, and must keep prior encrypted data readable. Which Key Vault capability meets all three needs?","choices":["Export and re-import the key manually each quarter","Configure a key rotation policy for automatic rotation, relying on key versioning","Switch the vault to the access policy permission model","Enable purge protection so old key versions are retained"],"answer":[1],"explanation":"An automatic key rotation policy rotates the key on schedule with no downtime, and Key Vault versioning keeps prior versions so previously encrypted data stays readable. Manual export/import requires effort and risks downtime, failing the no-code-change goal. Purge protection prevents deletion but does not rotate keys. The permission model choice is unrelated to rotation.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-125","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank wants a permission model for Key Vault where the right to grant data-plane access is limited to Owner and User Access Administrator, and where privileged access can be made just-in-time through Privileged Identity Management. Which model should they choose?","choices":["Managed HSM local RBAC only","A shared access signature per secret","Azure RBAC","Legacy vault access policies"],"answer":[2],"explanation":"Azure RBAC restricts the ability to grant access to the Owner and User Access Administrator roles and integrates with Privileged Identity Management for eligible just-in-time assignments. Access policies let anyone with vaults/write grant themselves access and do not integrate with PIM. Key Vault does not use per-secret SAS tokens. Managed HSM local RBAC is a separate isolated system, not the standard vault authorization model in question.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-126","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Relecloud updates five related App Configuration key-values during a deployment and wants the application to reload the whole set exactly once, only after all five are changed, to avoid reading a half-updated configuration. Which refresh strategy achieves this?","choices":["Register a sentinel key and update it last after the five values change","Disable refresh and restart the application after each change","Set a 30-second refresh interval on each of the five keys","Monitor all selected keys so any change triggers a reload"],"answer":[0],"explanation":"A sentinel key is monitored instead of every key; updating it only after all other changes complete triggers a single consistent reload. Monitoring all selected keys could reload mid-change, exposing a partial update. Per-key intervals still reload on each individual change. Restarting defeats the goal of dynamic refresh without downtime.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-127","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Proseware team ports a configuration loader to the Azure App Configuration provider for Python and finds they cannot register every selected key for change monitoring the way the .NET provider does with RegisterAll. What is the correct explanation and fix?","choices":["The Python provider does not support monitoring all selected keys; monitor an individual sentinel key instead","The Python provider requires a connection string rather than a managed identity for refresh","Refresh is unavailable in Python; the app must poll the store manually","The Python provider only refreshes Key Vault references, not plain key-values"],"answer":[0],"explanation":"The Azure App Configuration Python provider does not support monitoring all selected keys; it monitors individual keys, so you use a sentinel key with refresh_on. Refresh works with a managed identity credential, so auth is not the issue. Python does support refresh, just not RegisterAll semantics. The provider refreshes plain key-values, not only Key Vault references.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-128","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Litware keeps a connection string in Azure Key Vault and exposes it to apps through an App Configuration Key Vault reference. A security review asks where the secret value actually lives and how apps get it. Which statement is correct?","choices":["The reference caches the plaintext secret in App Configuration after first use","App Configuration copies the secret value into the key-value and serves it directly","Apps must call Key Vault before App Configuration to prime the reference","App Configuration stores only a reference (URI) to the secret; the app resolves the actual value from Key Vault at load time"],"answer":[3],"explanation":"A Key Vault reference stores only the reference to the secret in Key Vault; the configuration provider resolves the actual secret from Key Vault at load time, so the secret remains in Key Vault. App Configuration does not copy or cache the plaintext value; that would defeat keeping secrets in Key Vault. The provider resolves the reference itself, so the app does not need to call Key Vault first.","ref":"https://learn.microsoft.com/azure/app-service/app-service-key-vault-references"},{"id":"4.1.1-129","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Fourth Coffee wants nonsecret feature flags and endpoints centrally managed with dynamic refresh, but API keys must remain in a dedicated secret store with its own access control and rotation. Which design correctly separates settings from secrets?","choices":["Put both the flags and the API keys as plain key-values in App Configuration","Put flags in App Configuration and store API keys in Key Vault, referenced from App Configuration","Store flags and keys together in Key Vault and skip App Configuration","Put the API keys in App Configuration and the flags in Key Vault"],"answer":[1],"explanation":"App Configuration is designed for nonsecret settings; secrets belong in Key Vault, which App Configuration can reference. This keeps rotation and access control on the secret store. Plain key-values in App Configuration are not a secret store and lack Key Vault rotation and access control. Swapping the two misuses each service. Putting flags in Key Vault loses App Configuration dynamic refresh for settings.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-130","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Adventure Works runs three virtual machines that each need the same identity to pull secrets from one Key Vault, and the identity must survive if any single VM is deleted. Which managed identity type fits, and why?","choices":["A system-assigned managed identity on each VM, because it is tied to that VM lifecycle","Three system-assigned managed identities with identical role assignments","A single user-assigned managed identity shared by all three VMs, because it exists independently","A service principal with a client secret shared across the VMs"],"answer":[2],"explanation":"A user-assigned managed identity is a standalone resource that can be assigned to multiple resources and persists independently of any single VM. A system-assigned identity is bound to one resource lifecycle and is deleted with that resource, so it cannot be shared or survive deletion. Three separate system-assigned identities are not the same identity. A shared client secret reintroduces the credential management the team is trying to avoid.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-131","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Coho Vineyard GitHub Actions workflow must deploy to Azure without any stored client secret, by exchanging a GitHub OIDC token for a Microsoft Entra access token. Which configuration is required?","choices":["Configure a federated identity credential on a system-assigned managed identity","Grant the workflow the Owner role on the subscription with a certificate credential","Store the GitHub token as a secret in Key Vault and read it at deploy time","Configure a federated identity credential on a user-assigned managed identity or an app registration"],"answer":[3],"explanation":"Workload identity federation is configured on a user-assigned managed identity or an app registration to trust an external identity provider such as GitHub, allowing token exchange without stored secrets. Federated identity credentials are not supported on system-assigned managed identities. Storing the token in Key Vault still manages a credential and is not the federation flow. An RBAC role plus certificate does not remove the stored credential the requirement forbids.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-132","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Trey Research configures workload identity federation and the token exchange fails silently with no error. The external token is valid at the provider. Which mismatch most likely blocks the exchange?","choices":["The federated credential issuer, subject, and audience values do not exactly match the incoming token claims","The vault firewall is blocking the token endpoint","The identity was granted Reader instead of Contributor","The user-assigned managed identity was created in the wrong Azure region"],"answer":[0],"explanation":"Microsoft Entra ID validates the federated credential issuer, subject, and audience case-sensitively against the incoming token claims; a mismatch causes the exchange to fail, sometimes without an explicit error. Region does not affect token validation for user-assigned identities. The Key Vault firewall is unrelated to the Microsoft Entra token endpoint. An RBAC role controls what the identity can do after authentication, not whether the token exchange succeeds.","ref":"https://learn.microsoft.com/entra/workload-id/workload-identity-federation"},{"id":"4.1.1-133","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A VanArsdel .NET service sets its Application Insights connection string in code, in an environment variable, and in appsettings.json at the same time. Which value does the Azure Monitor OpenTelemetry Distro use?","choices":["The value in the environment variable","The first one found alphabetically","The value set in code","The value in the configuration file"],"answer":[2],"explanation":"The Distro resolves the connection string with precedence code, then environment variable, then configuration file, so the code value wins. The environment variable and configuration file are lower precedence than code. There is no alphabetical resolution; the order is a defined precedence.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-134","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel wants each microservice to appear under a distinct name (cart, checkout, catalog) in Application Insights while all send to one resource with the Azure Monitor OpenTelemetry Distro. Which setting controls the reported service name?","choices":["OTEL_SERVICE_NAME","APPLICATIONINSIGHTS_STATSBEAT_DISABLED","OTEL_EXPORTER_OTLP_ENDPOINT","APPLICATIONINSIGHTS_CONNECTION_STRING"],"answer":[0],"explanation":"OTEL_SERVICE_NAME sets the service.name resource attribute, which is how each component is labeled in Application Insights. The connection string sets the destination resource, not the component name. The statsbeat variable toggles internal metrics. The OTLP endpoint sets an exporter target, not the service name in Application Insights.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-135","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A Best For You Organics order service enqueues a message and a separate worker processes it later on another host. Traces from the two show up as unrelated operations in Application Insights. Which mechanism correctly links them into one distributed trace across the async boundary?","choices":["Enable ingestion sampling on the destination resource","Propagate W3C trace context (traceparent) with the message and continue the trace on the worker","Give both services the same Application Insights instrumentation key","Increase the adaptive sampling rate on both services"],"answer":[1],"explanation":"Distributed tracing correlates operations by propagating W3C trace context (the traceparent header carrying trace-id and parent span-id) across the boundary, so the worker continues the same trace. Sampling rate changes affect volume, not correlation, and inconsistent sampling can even break traces. A shared instrumentation key routes telemetry to one resource but does not link spans. Ingestion sampling drops data at the endpoint and does not create correlation.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-136","obj":"4.1.1","difficulty":"easy","type":"single","stem":"With adaptive sampling enabled on an Alpine Ski House ASP.NET Core app, an operator worries that failed requests will be sampled out and lost during investigations. What does the sampling algorithm actually guarantee for a failed request?","choices":["Failures are always sent at 100 percent regardless of the sampling rate","Exceptions are kept but the parent request is dropped to save volume","All telemetry sharing the failed request operation ID is kept or dropped together, keeping related items intact","Failed requests are retained only if custom events are disabled"],"answer":[2],"explanation":"The sampling decision is made per operation ID, so a request and its related exceptions and traces are retained or dropped as a unit, preserving an actionable diagnostic view of failures that are kept. Sampling does not force all failures to 100 percent; it makes a per-operation decision. It never keeps a child exception while dropping its parent request. Custom event settings do not gate failure retention.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-137","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Graphic Design Institute ASP.NET Core app runs the Application Insights SDK with adaptive sampling active. An operator sets an ingestion sampling percentage in the portal and it appears to have no effect. Why?","choices":["Ingestion sampling requires purge protection to be enabled first","The portal value only affects browser telemetry","Adaptive sampling and ingestion sampling multiply, so the effect is hidden","Ingestion sampling only applies when no SDK-level sampling is in effect"],"answer":[3],"explanation":"Ingestion sampling operates at the service endpoint and is disabled for telemetry that the SDK is already sampling, so it is ignored when adaptive sampling is active. Purge protection is a Key Vault feature and unrelated. Ingestion sampling is not limited to browser telemetry. The two do not multiply; the SDK sampling suppresses ingestion sampling for those types.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-138","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A First Up Consultants engineer writes a KQL query to count requests but the totals look low because sampling is enabled. Which change yields the statistically correct request count?","choices":["Add | order by timestamp desc","Replace count() with sum(itemCount)","Filter with | where itemCount == 1","Use dcount(operation_Id) instead of count()"],"answer":[1],"explanation":"Under sampling each retained record carries an itemCount representing the items it stands for, so sum(itemCount) reconstructs the true count while count() only counts retained rows. Ordering does not change totals. Filtering to itemCount == 1 discards sampled rows and undercounts further. dcount of operation IDs counts distinct operations, not total requests, and is still affected by sampling.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-139","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Lucerne Publishing needs near real-time notification when a virtual machine stops sending its per-minute heartbeat, and false positives from log ingestion latency are unacceptable. Which alert type is the better fit and why?","choices":["A metric alert on the converted Heartbeat metric, because it is near real-time and better at detecting absence of data","An activity log alert, because it audits resource operations","A simple log search alert, because it evaluates each row individually","A log search alert, because KQL can detect missing rows precisely"],"answer":[0],"explanation":"Metric alerts use precomputed metric data, are near real-time, and are recommended for detecting the absence of a signal such as a missing heartbeat, avoiding log-ingestion latency misfires. Log search alerts are inherently more latent and work best detecting presence of specific data, not lack of data. Activity log alerts track control-plane events, not heartbeat gaps. Simple log search alerts still depend on log ingestion latency.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-140","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Wide World Importers must alert when a custom KQL expression joins two log tables and applies conditional logic that platform metrics cannot express. Which alert type supports this?","choices":["Smart detection alert","Resource Health alert","Metric alert","Log search alert"],"answer":[3],"explanation":"Log search alerts run a Log Analytics KQL query at a set frequency, so they support advanced logic such as joins and conditions that precomputed metrics cannot express. Metric alerts evaluate precomputed metrics and cannot run arbitrary KQL joins. Resource Health alerts report platform-signaled resource health. Smart detection surfaces anomalies automatically and is not a custom-query mechanism.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-141","obj":"4.1.1","difficulty":"hard","type":"single","stem":"An operator at Contoso needs a single view that shows every component of a distributed application, the calls between them, and their health, to decide where to start a triage. Which Application Insights experience should they open?","choices":["Usage funnels","Transaction search","Application Map","Live Metrics"],"answer":[2],"explanation":"Application Map gives a visual topology of components and their dependencies with health signals, which is the triage starting point for distributed apps. Live Metrics shows real-time streaming counters, not topology. Transaction search finds individual telemetry items. Usage funnels analyze user behavior, not component health.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-142","obj":"4.1.1","difficulty":"easy","type":"single","stem":"After finding a slow operation on the map, a Fabrikam engineer wants a Gantt-style, end-to-end view that correlates server-side telemetry across all monitored components for one operation to find the offending dependency. Which experience provides this?","choices":["Transaction diagnostics (end-to-end transaction details)","Workbooks gallery","Application Map","Metrics explorer"],"answer":[0],"explanation":"The transaction diagnostics, or end-to-end transaction details, view renders a Gantt chart correlating telemetry across components so you can pinpoint the dependency that caused the slowdown. Application Map shows topology but not the per-operation timeline. Metrics explorer charts aggregated metrics. Workbooks are custom reports, not the built-in correlated transaction timeline.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-143","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Tailwind Traders operator wants alerts that notify once when a threshold is breached and again when it clears, with native support for dimensions like instance name and no query to author. Which alert type provides stateful fire-and-resolve with dimensions out of the box?","choices":["Log search alert","Simple log search alert","Activity log alert","Metric alert"],"answer":[3],"explanation":"Metric alerts are stateful, notifying once on fire and once on resolve, and natively support dimensions without authoring a query. Log search alerts require a KQL query and are more latent. Activity log alerts track discrete events, not threshold state on a metric. Simple log search alerts evaluate rows individually and are stateless per row.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-144","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A Northwind vault has purge protection enabled and a secret was soft-deleted yesterday. An operator with subscription Owner rights tries to purge it immediately to reuse the name. What happens?","choices":["The purge succeeds because Owner overrides purge protection","The purge is blocked; the object cannot be purged until the retention period elapses","The purge succeeds only if the operator also holds Key Vault Purge Operator","Purge protection is automatically disabled after 24 hours"],"answer":[1],"explanation":"With purge protection enabled, a soft-deleted object cannot be purged by anyone, including Owners and Microsoft, until the mandatory retention period elapses. No role, including Owner or Purge Operator, can override purge protection. Purge protection cannot be disabled once enabled, so it does not lapse after a day.","ref":"https://learn.microsoft.com/azure/key-vault/general/soft-delete-overview"},{"id":"4.1.1-145","obj":"4.1.1","difficulty":"easy","type":"single","stem":"During a review, a Woodgrove Bank engineer proposes turning off purge protection on a production vault to speed up name reuse after deletions. What is the correct constraint to cite?","choices":["Once purge protection is enabled it cannot be disabled or overridden by anyone, including Microsoft","Purge protection can be disabled only within the first 7 days","Purge protection can be toggled off by a Key Vault Administrator at any time","Disabling purge protection requires the access policy model"],"answer":[0],"explanation":"Purge protection, once enabled, cannot be disabled or circumvented by any role or by Microsoft; the vault name cannot be reused until deletion recovery or retention expiry. No administrator role can disable it. There is no 7-day grace window to turn it off. The permission model does not provide a way to disable purge protection.","ref":"https://learn.microsoft.com/azure/key-vault/general/soft-delete-overview"},{"id":"4.1.1-146","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Relecloud rotates a secret in Key Vault automatically every 30 days. Their app loads it through an App Configuration Key Vault reference and must pick up new secret versions without changing the sentinel key or redeploying. Which App Configuration setting accomplishes this?","choices":["Disable soft delete on the vault so new versions replace old ones","Reference a specific secret version in the Key Vault reference","Lower the configuration refresh interval to one second","Set a Key Vault secret refresh interval independent of the configuration refresh cycle"],"answer":[3],"explanation":"App Configuration lets you configure a Key Vault secret refresh interval independent of the config refresh, so the provider periodically reloads rotated secrets even though the reference URI is unchanged. Referencing a specific version pins the value so rotation is never picked up. Lowering the config refresh interval does not reload Key Vault secrets whose reference did not change. Soft delete is unrelated to reloading versions.","ref":"https://learn.microsoft.com/azure/app-service/app-service-key-vault-references"},{"id":"4.1.1-147","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A Proseware architect debates whether the Azure Monitor OpenTelemetry Distro or Kusto queries should be described as the tool that collects telemetry versus the tool that analyzes it. Which pairing is correct?","choices":["Both instrument the app; neither analyzes","The Distro instruments and exports telemetry; KQL in Log Analytics analyzes the stored telemetry","Both analyze; instrumentation is done by metric alerts","The Distro analyzes telemetry; KQL in Log Analytics instruments the app"],"answer":[1],"explanation":"The Azure Monitor OpenTelemetry Distro instruments the application and exports traces, metrics, and logs; KQL queries analyze that data after it is stored in Log Analytics. The roles are not reversed; KQL does not instrument. The Distro does not analyze, and metric alerts do not instrument code.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-148","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Litware finance team must forecast alert cost. They will run one KQL query every 5 minutes as a log search alert and separately monitor a platform metric across 200 resource instances with one metric alert rule. Which cost driver pairing is correct?","choices":["Log search alert is billed per query evaluation interval; metric alert is billed per monitored time series","Both are billed as a flat monthly fee regardless of scope","Log search alert is billed per evaluated time series; metric alert is billed per query evaluation","Both are billed per gigabyte of ingested logs"],"answer":[0],"explanation":"Log search alert rules are billed based on how often the query is evaluated (more frequent evaluation costs more), while metric alert rules are billed based on the number of time series monitored. The two drivers are reversed in the first option. Neither alert type is billed purely by log ingestion volume, nor as a flat fee independent of frequency or time series.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-149","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Fourth Coffee low-traffic Node.js function app rarely hits its telemetry quota. The team wants sampling that does not reduce traffic until a minimum rate is reached, so low-use periods keep full telemetry. Which sampling type matches, noting its platform support?","choices":["Adaptive sampling, which is the default for ASP.NET, ASP.NET Core, and Azure Functions server-side telemetry","Browser sampling, which only applies to page views","Fixed-rate sampling, which discards a constant percentage regardless of load","Ingestion sampling, which runs at the service endpoint for all sources"],"answer":[0],"explanation":"Adaptive sampling adjusts volume based on load and does not reduce traffic below a minimum rate, so low-use apps are effectively not sampled; it is the default for ASP.NET/ASP.NET Core and Azure Functions. Ingestion sampling drops a set percentage at the endpoint regardless of load. Fixed-rate sampling always discards a constant percentage, sampling even low-traffic periods. Browser sampling is not a low-load-aware server option.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-150","obj":"4.1.1","difficulty":"hard","type":"single","stem":"An Adventure Works Python service should authenticate to Key Vault with no secrets in code, using the local developer sign-in during development and a managed identity in production without code changes. Which credential type meets this?","choices":["DefaultAzureCredential","An account key stored in appsettings.json","ManagedIdentityCredential hardcoded to a client ID for all environments","A client secret loaded from an environment variable"],"answer":[0],"explanation":"DefaultAzureCredential tries multiple methods at runtime, using the developer sign-in locally and a managed identity in Azure, so the same code works across environments without stored secrets. A client secret reintroduces a stored credential. Hardcoding ManagedIdentityCredential to a client ID does not work for local development. An account key in config is a stored secret and is not how Key Vault authenticates.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-151","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Coho Vineyard workload runs on an on-premises Kubernetes cluster outside Azure and must reach Microsoft Entra protected resources without storing certificates that expire. Which approach removes the expiring credential?","choices":["Assign a system-assigned managed identity to the cluster node pool","Store a rotating certificate in Key Vault and mount it into the pod","Use workload identity federation so the cluster token is exchanged for a Microsoft Entra token","Embed an app registration client secret as a Kubernetes secret"],"answer":[2],"explanation":"Workload identity federation lets the external Kubernetes token be exchanged for a Microsoft Entra access token via a federated credential on a user-assigned identity or app registration, eliminating stored certificates or secrets. Mounting a certificate or embedding a client secret still manages an expiring credential. A system-assigned managed identity is not available to workloads running outside Azure and does not support federated credentials.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-152","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Complete the KQL so it reports the 95th percentile request duration per one-hour bucket. Which token fills the blank?\n\n```\nrequests\n| where timestamp > ago(24h)\n| summarize percentile(duration, 95) by ________(timestamp, 1h)\n```","choices":["truncate","bin","range","floor"],"answer":[1],"explanation":"bin() reduces a numeric or datetime column to discrete buckets, so bin(timestamp, 1h) groups rows into one-hour intervals for the per-bucket percentile. floor rounds a number but does not create datetime buckets for grouping. range generates a series, it is not a grouping function inside summarize. truncate is not the KQL bucketing operator here.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-153","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Complete the KQL join so every request row is kept even when it has no matching dependency row, to find requests with zero downstream calls. Which join kind fills the blank?\n\n```\nrequests\n| join kind=________ (\n    dependencies\n    | project operation_Id, target\n) on operation_Id\n```","choices":["rightsemi","inner","leftouter","leftanti"],"answer":[2],"explanation":"leftouter returns all rows from the left (requests) plus matching right rows, leaving unmatched right columns null, so requests with no dependency are kept. inner drops requests without a match. rightsemi returns only right-table rows that match. leftanti returns only left rows with no match, discarding the ones that do have dependencies.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-154","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Complete the KQL that validates whether sampling is active by computing the retained percentage per telemetry type. Which expression fills the blank?\n\n```\nunion requests, dependencies, exceptions, traces\n| where timestamp > ago(1d)\n| summarize RetainedPercentage = ________ by bin(timestamp, 1h), itemType\n```","choices":["avg(itemCount)*100","100/avg(itemCount)","sum(itemCount)","count()/100"],"answer":[1],"explanation":"Each retained record carries an itemCount equal to the number of items it represents, so 100/avg(itemCount) yields the retained percentage; values below 100 indicate sampling. avg(itemCount)*100 inflates the value rather than inverting it. count()/100 counts rows, not a percentage. sum(itemCount) gives the true item total, not a retained percentage.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-155","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Complete the KQL so it returns the true request count per bin under sampling, then orders newest first. Which pair of tokens fills the blanks in order?\n\n```\nrequests\n| where timestamp > ago(6h)\n| summarize TrueCount = ________ by bin(timestamp, 30m)\n| ________ by timestamp desc\n```","choices":["avg(itemCount) ... top","dcount(itemCount) ... sort asc","sum(itemCount) ... order","count() ... order"],"answer":[2],"explanation":"sum(itemCount) reconstructs the sampling-corrected total, and order by timestamp desc sorts newest first (order and sort are synonyms in KQL). count() undercounts under sampling. dcount with sort asc gives distinct counts ordered oldest first. avg(itemCount) with top does not produce a full ordered total count.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-156","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Complete the Python Azure App Configuration load call so the provider triggers a full refresh only when a sentinel key named AppSentinel changes. Which argument fills the blank?\n\n```\nconfig = load(\n    endpoint,\n    credential,\n    ________=[WatchedKey(key=\"AppSentinel\")]\n)\n```","choices":["selectors","feature_flag_enabled","key_vault_options","refresh_on"],"answer":[3],"explanation":"The Python provider uses refresh_on with a WatchedKey to monitor the sentinel key and refresh the whole configuration when it changes. selectors chooses which keys to load, not which to watch. key_vault_options configures Key Vault reference resolution. feature_flag_enabled toggles feature flags, not refresh watching.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-157","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Complete the .NET App Configuration setup so that changing any single loaded key triggers a full refresh (no sentinel key). Which method fills the blank?\n\n```\noptions.Connect(endpoint, credential)\n    .Select(\"App:*\")\n    .ConfigureRefresh(refresh =>\n    {\n        refresh.________();\n    });\n```","choices":["EnableFeatureFlags","SetDirty","Register","RegisterAll"],"answer":[3],"explanation":"RegisterAll monitors all loaded keys so any change triggers a full refresh, which is the no-sentinel approach in the .NET provider. Register(key) monitors a single key such as a sentinel, not all keys. SetDirty forces a refresh check but does not register monitoring. EnableFeatureFlags is unrelated to key refresh registration.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-158","obj":"4.1.1","difficulty":"medium","type":"multi","stem":"A Contoso security baseline must both make deleted Key Vault objects recoverable AND enforce a retention that no administrator can override during the window. Which two Key Vault settings, together, achieve this? (Select two.)","choices":["Enable soft delete","Enable purge protection","Switch to the access policy permission model","Assign the Key Vault Reader role broadly","Disable public network access"],"answer":[0,1],"explanation":"Soft delete provides recoverability of deleted objects, and purge protection enforces a mandatory retention that cannot be overridden, so both together satisfy the baseline. The access policy model is a legacy authorization choice, not a deletion protection. Key Vault Reader controls read access, not deletion recovery. Disabling public network access is a network control unrelated to purge and recovery behavior.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-159","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"Fabrikam wants to configure workload identity federation. On which two Microsoft Entra identity objects can a federated identity credential be configured? (Select two.)","choices":["A user-assigned managed identity","An app registration","A system-assigned managed identity","An Azure RBAC role definition","A Key Vault access policy"],"answer":[0,1],"explanation":"Federated identity credentials can be configured on a user-assigned managed identity or on an app registration to trust an external identity provider. System-assigned managed identities do not support federated identity credentials. An RBAC role definition and a Key Vault access policy are authorization constructs, not identities that hold federated credentials.","ref":"https://learn.microsoft.com/entra/workload-id/workload-identity-federation"},{"id":"4.1.1-160","obj":"4.1.1","difficulty":"easy","type":"multi","stem":"An Adventure Works team evaluates ingestion sampling in Application Insights. Which two statements about ingestion sampling are correct? (Select two.)","choices":["It runs at the Application Insights service endpoint","It is ignored when SDK adaptive or fixed-rate sampling is already in effect","It reduces the telemetry traffic sent from the application","It requires redeploying the app to change the rate","It only applies to custom metrics"],"answer":[0,1],"explanation":"Ingestion sampling operates at the service endpoint and is disabled when the SDK is already sampling a telemetry type. It does not reduce traffic sent from the app; it drops data after arrival. Its rate is set in the portal without redeploying. It is not limited to custom metrics, and preaggregated metrics are always kept regardless.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-161","obj":"4.1.1","difficulty":"medium","type":"multi","stem":"Under Azure RBAC for Key Vault, which two built-in roles carry the right to grant others data-plane access, making them the roles to tightly control? (Select two.)","choices":["Owner","User Access Administrator","Key Vault Secrets User","Key Vault Reader","Key Vault Crypto Service Encryption User"],"answer":[0,1],"explanation":"Azure RBAC restricts the ability to grant access to the Owner and User Access Administrator roles, which is a security advantage over access policies. Key Vault Secrets User only reads secret values. Key Vault Reader reads metadata. Crypto Service Encryption User is a scoped crypto role. None of those three can grant access to others.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-162","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"A Litware app has adaptive sampling enabled. Which two telemetry categories are always retained and remain accurate regardless of the sampling rate? (Select two.)","choices":["Performance counter metrics","Custom (preaggregated) metrics","Dependency telemetry","Request telemetry","Trace telemetry"],"answer":[0,1],"explanation":"Performance metrics and custom preaggregated metrics are always kept regardless of sampling, which is why metrics stay accurate even when log-based counts are affected. Dependency, request, and trace telemetry are event telemetry subject to sampling, so their retained rows must be corrected with sum(itemCount) for accurate counts.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-163","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Northwind Traders wants a new Azure Key Vault where deleted secrets stay recoverable for exactly 30 days, and they want that window to be immutable once the vault is running. Which statement about configuring this is correct?","choices":["The retention period must be set to 30 days at vault creation and cannot be changed afterward","The soft-delete retention period can be lowered from 90 to 30 days at any time after creation","Retention is fixed at 90 days and cannot be customized","Retention is configured on each secret individually rather than on the vault"],"answer":[0],"explanation":"The soft-delete retention interval is configurable from 7 to 90 days but can only be set when the vault is created; once set and saved it cannot be changed for that vault, which matches the immutable 30-day requirement. You cannot lower the interval after creation, so the first option is wrong. Retention is customizable, not fixed at 90, so the third is wrong. Retention is a vault-level property, not per-secret, so the fourth is wrong.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-164","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank enabled purge protection on a production key vault to satisfy an insider-threat control. A subscription owner now files a ticket asking to turn purge protection off for one vault. What is the correct response?","choices":["An owner can disable purge protection through Azure Resource Manager","Once enabled, purge protection cannot be disabled or overridden by anyone, including Microsoft","Purge protection can be disabled only by Microsoft support","Purge protection is disabled automatically when the vault is switched to the RBAC model"],"answer":[1],"explanation":"Purge protection is designed so that no administrator role or permission can override it; once enabled it cannot be disabled or overridden by anyone, including Microsoft, until the resource is deleted. No owner role can turn it off, so option one is wrong. Microsoft explicitly cannot override it, so option two is wrong. The permission model is unrelated to purge protection, so option four is wrong.","ref":"https://learn.microsoft.com/azure/key-vault/general/soft-delete-overview"},{"id":"4.1.1-165","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Litware, Inc. runs one shared key vault. Application A must read only the single secret named db-conn, while other apps must not gain access to it. The team uses the RBAC permission model. What is the least-privilege way to grant this?","choices":["Assign Key Vault Secrets User at the vault scope","Add an access policy granting Get on all secrets","Assign Key Vault Secrets User scoped to the individual secret db-conn","Assign Key Vault Administrator scoped to the resource group"],"answer":[2],"explanation":"Azure RBAC for Key Vault supports assigning a role at the individual key, secret, or certificate scope, so Key Vault Secrets User scoped to db-conn grants read of only that one secret. Vault-scope Secrets User exposes every secret. Access policies apply only at vault scope and cannot target one secret. Key Vault Administrator is far broader than a single-secret read.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-166","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Fabrikam microservice running on Azure needs to read secret values from a vault that uses Azure RBAC, but it must never be able to create, update, or delete secrets. Which built-in role fits?","choices":["Key Vault Secrets Officer","Key Vault Administrator","Key Vault Reader","Key Vault Secrets User"],"answer":[3],"explanation":"Key Vault Secrets User grants read of secret contents only, which is the minimum needed to fetch values without any write or delete rights. Secrets Officer can perform any action on secrets including set and delete. Administrator grants full data-plane control. Reader sees metadata only and cannot read secret values.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-167","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Contoso Energy delegates key lifecycle work to a platform team. The team must configure key rotation policies and rotate keys on demand in an RBAC-enabled vault, but must not read or export secret values. Which role assignment is correct?","choices":["Key Vault Crypto Officer","Key Vault Secrets Officer","Key Vault Crypto User","Key Vault Administrator"],"answer":[0],"explanation":"The Key Vault key rotation feature requires key management permissions; Microsoft documents assigning Key Vault Crypto Officer to manage the rotation policy and perform on-demand rotation. Secrets Officer governs secrets, not keys. Crypto User can perform cryptographic operations but cannot manage rotation policy. Administrator is broader than least privilege and also covers secrets.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-168","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Adventure Works must store cryptographic keys where the customer solely controls the root of trust, the instance is dedicated to only their tenant, and the keys are protected by FIPS 140-3 Level 3 validated hardware. Which option meets all three requirements?","choices":["Azure Key Vault Standard tier","Azure Key Vault Managed HSM","Azure Key Vault Premium tier","Azure App Configuration with customer-managed keys"],"answer":[1],"explanation":"Managed HSM is single-tenant, uses FIPS 140-3 Level 3 validated HSMs, and gives the customer a customer-controlled security domain, so it is the only option meeting all three constraints. Standard is multitenant and FIPS 140-2 Level 1 software-backed. Premium is FIPS 140-3 Level 3 but multitenant with a Microsoft-controlled root of trust. App Configuration stores configuration, not HSM-backed keys.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-169","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Tailwind Traders uses a customer-managed key in Azure Key Vault to encrypt a storage account, and enables automatic key rotation. They must ensure the storage service picks up each new key version without manual reconfiguration. How should the key be referenced?","choices":["By a versioned key identifier that includes the specific key version","By the key vault resource ID rather than a key URI","By a versionless key identifier that omits the version","By a secret reference instead of a key reference"],"answer":[2],"explanation":"A versionless key URI lets the service automatically move to the latest key version after rotation, enabling zero-touch customer-managed key rotation. A versioned URI pins one version and will not follow rotation. A resource ID does not identify a specific key for cryptographic use. A key is not a secret, so a secret reference is inappropriate.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-170","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Relecloud enabled the Key Vault firewall with the option to allow trusted Microsoft services to bypass it. A security reviewer asks whether a bypassing trusted service can therefore read any secret. What is accurate?","choices":["Trusted-service bypass grants data access without any authentication","The bypass automatically assigns the service the Key Vault Secrets User role","The bypass applies to control-plane operations only","A bypassing service still must present a valid Microsoft Entra token and hold permissions for the operation"],"answer":[3],"explanation":"The firewall bypass only lets the network request reach the vault; the service still must present a valid Microsoft Entra token and have RBAC or access-policy permissions to perform the operation. Bypass never removes authentication. It grants no roles automatically. Firewall rules govern the data plane, not the control plane, so the last option is wrong.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-171","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Proseware updates several related keys in Azure App Configuration and wants dependent applications to reload the whole set only once, after all edits are complete, to avoid reading a half-updated configuration. Which approach achieves this?","choices":["Monitor a single sentinel key and update it last, after all other keys change","Register every key individually so each change triggers a refresh","Disable the refresh interval so changes apply instantly","Store all keys under one label and refresh on label change"],"answer":[0],"explanation":"A sentinel key is monitored instead of every key; by updating it only after all other changes are complete, the app reloads the full configuration exactly once, preserving consistency. Registering every key can trigger multiple partial reloads. Disabling the interval does not coordinate a single consistent reload. Labels select variants but do not provide the update-last consistency signal.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-172","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Alpine Ski House stores a database password in Key Vault and references it from Azure App Configuration. The password is rotated in Key Vault every 12 hours, but the App Configuration key-value that references it never changes. How should the app pick up the rotated secret?","choices":["Shorten the App Configuration configuration refresh interval only","Configure an independent Key Vault secret refresh interval on the provider","Recreate the Key Vault reference each time the secret rotates","Switch the reference to store the secret value directly in App Configuration"],"answer":[1],"explanation":"App Configuration lets you set a secret refresh interval independent of the configuration refresh cycle; because the reference URI is unchanged while the underlying secret rotates, only a secret refresh interval forces the provider to re-fetch the current value. A shorter configuration refresh does not help because the reference key-value never changes. Recreating the reference is unnecessary manual work. Storing the value directly defeats the purpose of keeping the secret in Key Vault.","ref":"https://learn.microsoft.com/azure/key-vault/general
