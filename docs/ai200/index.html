teristic, not an inherent property of events.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-64","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard must process high-value order messages with transactions, sessions for ordering, and duplicate detection. Which Azure service is designed for these enterprise messaging features?","choices":["Azure Event Grid","Azure Service Bus","Azure Event Hubs","Azure Storage queues"],"answer":[1],"explanation":"Azure Service Bus is the enterprise transactional messaging broker and is the only one of these that supports transactions, sessions for FIFO ordering, and duplicate detection. Event Grid is for reactive event routing and supports none of transactions, sessions, or duplicate detection. Event Hubs is for high-throughput streaming and lacks transactions and duplicate detection. Storage queues are simple queues without sessions, transactions, or duplicate detection.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-65","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Relecloud needs to react to blob-created notifications from Azure Storage and route them to serverless handlers with near-real-time push delivery and per-subscription filtering, without polling. Which service best fits?","choices":["Azure Event Grid","Azure Service Bus","Azure Event Hubs","Azure API Management"],"answer":[0],"explanation":"Event Grid is a reactive event-routing service with a push model that delivers discrete events such as blob-created to handlers in near real time, with subject and advanced filtering per subscription. Service Bus uses a pull model with polling latency and is oriented to brokered messaging. Event Hubs is for high-volume telemetry streams, not discrete reactive notifications. API Management is an API gateway, not an eventing service.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-66","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank ingests millions of telemetry events per second from IoT devices and needs multiple analytics consumers to read the same time-ordered stream independently and replay older events. Which service is designed for this?","choices":["Azure Service Bus topics","Azure Queue Storage","Azure Event Grid system topics","Azure Event Hubs"],"answer":[3],"explanation":"Event Hubs is a high-throughput streaming platform that ingests millions of events per second, lets multiple consumer groups read the same partitioned stream independently, and supports replay by moving to an earlier offset. Service Bus topics are brokered messaging, not high-volume stream ingestion or replay. Event Grid system topics route discrete Azure service events and do not stream or replay. Queue Storage is a basic queue without streaming or replay.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-67","obj":"3.1.1","difficulty":"easy","type":"single","stem":"In Azure Event Hubs, how do two separate consumer applications each read the entire event stream independently, each keeping its own position?","choices":["By sharing a single consumer group and coordinating offsets manually","By enabling duplicate detection","By each using its own consumer group","By creating a Service Bus subscription per application"],"answer":[2],"explanation":"A consumer group is an independent view of the event hub; each consumer group maintains its own cursor, so two applications using separate consumer groups read the whole stream independently. Sharing one consumer group makes readers coordinate ownership of partitions rather than each reading the whole stream independently. Duplicate detection is a Service Bus feature, not an Event Hubs one. Service Bus subscriptions belong to topics, not Event Hubs.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-68","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A data engineer at Fourth Coffee needs an Event Hubs consumer to reprocess events it already marked complete after fixing a bug. Which Event Hubs mechanism makes this replay possible?","choices":["Dead-lettering the processed events","Specifying an earlier offset from the checkpoint to resume reading","Increasing the number of throughput units","Enabling sessions on the event hub"],"answer":[1],"explanation":"Checkpointing records a consumer's offset per partition per consumer group; because Event Hubs retains events, a consumer can specify a lower or earlier offset to return to older data and replay it. Event Hubs does not have dead-lettering. Adding throughput units increases capacity but does not rewind position. Event Hubs does not support sessions; that is a Service Bus feature.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-69","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which ordering guarantee does Azure Event Hubs provide for the events it stores?","choices":["Ordering per partition","Global ordering across the entire event hub","FIFO ordering only when sessions are enabled","No ordering under any circumstances"],"answer":[0],"explanation":"Event Hubs preserves ordering within each partition; events sent to the same partition are read by a consumer in the order they were appended. There is no global ordering across all partitions. Sessions are a Service Bus feature, not Event Hubs. Event Hubs does provide per-partition ordering, so 'no ordering' is incorrect.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-70","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Graphic Design Institute subscribes to an Event Grid custom topic and wants events delivered only when the subject string begins with /images/ and ends with .png. Which Event Grid filtering capability handles this directly?","choices":["Advanced filters on the event data body only","Consumer group selection","A Service Bus SQL filter","Subject filtering with subjectBeginsWith and subjectEndsWith"],"answer":[3],"explanation":"Event Grid subscriptions support subject filtering using subjectBeginsWith and subjectEndsWith to match the event subject prefix and suffix. Advanced filters operate on event data fields and operators, but the prefix/suffix of the subject is exactly what subject filtering targets. A Service Bus SQL filter is a different service's feature. Consumer groups belong to Event Hubs, not Event Grid filtering.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-71","obj":"3.1.1","difficulty":"medium","type":"single","stem":"An Event Grid subscription at Alpine Ski House must capture events that its webhook fails to receive so they are not lost. What must be configured for dead-lettering?","choices":["A Service Bus dead-letter queue on the subscription","A second consumer group","A storage account container as the dead-letter destination","A correlation filter"],"answer":[2],"explanation":"Event Grid dead-lettering sends undelivered events to a storage account container that you specify when creating the event subscription; dead-lettering is off by default. Event Grid dead-letters to blob storage, not to a Service Bus dead-letter queue. Consumer groups are an Event Hubs concept. A correlation filter is a Service Bus filter and does not capture undelivered events.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-72","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A team configures an Event Grid subscription with both an event time-to-live of 30 minutes and a maximum of 10 delivery attempts. When is an undeliverable event dead-lettered?","choices":["Only after all 10 attempts are exhausted, regardless of time","Whichever condition is met first, the TTL or the max delivery attempts","Only after 30 minutes, regardless of attempts","Never, because both conditions must be false"],"answer":[1],"explanation":"Event Grid uses whichever limit expires first: if an event is not delivered after the TTL or after the maximum delivery attempts, whichever happens first, the event is dead-lettered. It is not solely attempt-based, nor solely time-based. The first-to-expire rule governs, so requiring both to be false is incorrect.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-73","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Contoso wants Event Grid to deliver events that Azure Storage itself publishes about a specific storage account, such as blob-created events. Which kind of Event Grid topic represents events published by Azure services?","choices":["A system topic","A custom topic","An event domain","A partner topic"],"answer":[0],"explanation":"A system topic represents events published by Azure services such as Azure Storage and Event Hubs; only Azure services publish to it, so it exposes no endpoint or access keys. A custom topic is for application and third-party events and exposes its own publishing endpoint. An event domain is a management construct for thousands of topics. A partner topic is for events from a partner (SaaS) system.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-74","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Fabrikam builds a custom application that must publish its own events to Event Grid through a dedicated endpoint with access keys. Which Event Grid topic type should it create?","choices":["A system topic","A Service Bus topic","A consumer group","A custom topic"],"answer":[3],"explanation":"Custom topics are application and third-party topics that expose their own publishing endpoint and keys, which is what a custom application needs to publish its events. System topics are published only by Azure services and provide no publishing endpoint or keys. A consumer group is an Event Hubs read view. A Service Bus topic is a different service for brokered pub/sub messaging.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-75","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Contoso Construction Machinery must publish customer events to a single endpoint while giving each of thousands of customers an isolated topic with its own authorization, all managed as one Event Grid entity. Which feature fits?","choices":["A single custom topic with many subscriptions","An Event Hubs namespace","An Event Grid event domain","A Service Bus topic with correlation filters"],"answer":[2],"explanation":"An event domain provides one publishing endpoint for thousands of individual topics related to the same application, with per-topic authentication and authorization for multitenant scenarios. A single custom topic does not give each tenant an isolated, individually authorized topic at that scale. An Event Hubs namespace is for streaming, not per-tenant event routing. A Service Bus topic is brokered messaging and does not model thousands of authorized tenant topics behind one endpoint.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-76","obj":"3.1.1","difficulty":"easy","type":"single","stem":"An Azure Functions developer at Tailwind Traders needs a function that runs when a new message lands in a Storage queue. How many triggers can that function have?","choices":["Zero or one trigger","Exactly one trigger","Exactly two triggers","Unlimited triggers"],"answer":[1],"explanation":"A trigger defines how a function is invoked, and a function must have exactly one trigger. A function cannot have zero triggers because something must invoke it, and it cannot have two or unlimited triggers; only input and output bindings can be multiple.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-77","obj":"3.1.1","difficulty":"medium","type":"single","stem":"In Azure Functions, a scheduled job must read a blob and then write a new Azure Cosmos DB document. Which combination of trigger and bindings is correct?","choices":["Timer trigger, Blob Storage input binding, Cosmos DB output binding","Blob trigger, Timer input binding, Cosmos DB output binding","Cosmos DB trigger, Blob output binding, Timer input binding","HTTP trigger, Cosmos DB input binding, Blob output binding"],"answer":[0],"explanation":"A scheduled job is invoked by a Timer trigger, reads the blob through a Blob Storage input binding, and writes the document through a Cosmos DB output binding. The other options misassign the roles: a timer is a trigger, not an input binding; the blob here is read as input, not written as output; and an HTTP trigger is not a schedule.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-78","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A developer at Wide World Importers wants a function to write data out to another Storage queue when it finishes. Which binding direction should be used for that outbound queue?","choices":["An input binding","A dead-letter binding","A second trigger","An output binding"],"answer":[3],"explanation":"An output binding lets a function write data out to a resource, such as creating a message in another queue, typically via the function's return value or an output parameter. An input binding passes data into the function, not out. A function can have only one trigger, so a second trigger is invalid. There is no 'dead-letter binding' binding type in Azure Functions.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-79","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which statement about triggers and input bindings in Azure Functions is accurate?","choices":["A function can have many triggers but no input bindings","Input and output bindings are mandatory for every function","The trigger is essentially a special type of input binding, and a function can have multiple input and output bindings","Bindings can only be used with the HTTP trigger"],"answer":[2],"explanation":"The function trigger is essentially a special type of input binding, and a function can mix and match multiple input and output bindings, which are optional. A function has exactly one trigger, not many. Bindings are optional, not mandatory. Bindings are not restricted to the HTTP trigger; they work across trigger types.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-80","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel runs a latency-sensitive HTTP API on Azure Functions and must eliminate cold starts by keeping instances perpetually warm, while also needing virtual network connectivity. Which hosting plan should the team choose?","choices":["Consumption plan","Premium plan with always ready instances","A single Dedicated instance with Always on disabled","Basic Storage queue triggers"],"answer":[1],"explanation":"The Premium plan provides always ready and prewarmed instances that eliminate cold starts and supports virtual network connectivity, which fits a latency-sensitive HTTP API. The Consumption plan can scale to zero and incur cold starts. A Dedicated plan with Always on disabled does not keep the host warm. Storage queue triggers are a trigger type, not a hosting plan.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-81","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which characteristic best describes the Azure Functions Consumption plan compared with the Premium plan?","choices":["It can scale to zero when idle, so the next request may incur a cold start","It keeps at least one instance perpetually warm at all times","It guarantees virtual network integration by default with no configuration","It bills a fixed monthly charge whether or not functions execute"],"answer":[0],"explanation":"The Consumption plan can scale to zero instances when idle, so the first request after idling incurs the added latency of a cold start. Keeping an instance perpetually warm describes Premium always ready instances. The Consumption plan does not provide default VNet integration. A fixed monthly charge regardless of execution describes Premium billing, not Consumption pay-per-execution.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-82","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fabrikam must implement a stateful serverless workflow that calls three activity functions in sequence, passing each result to the next, with automatic checkpointing so progress survives a crash. Which Azure Functions capability fits?","choices":["A single HTTP-triggered function with retries","A Consumption plan timer trigger","An Event Grid subscription per activity","Durable Functions using the function chaining pattern"],"answer":[3],"explanation":"Durable Functions provide stateful orchestration; the function chaining pattern runs activity functions in sequence and checkpoints state so the orchestration can resume after a failure. A single HTTP function with retries has no durable state or checkpointing across steps. Chaining Event Grid subscriptions adds infrastructure without orchestration state. A timer trigger only schedules invocations and does not orchestrate stateful chaining.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-83","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A workflow at Lucerne Publishing must run many activity functions in parallel and then aggregate all their results once every branch completes. Which Durable Functions pattern is this?","choices":["Function chaining","Async HTTP API polling","Fan-out/fan-in","Single-instance monitor"],"answer":[2],"explanation":"The fan-out/fan-in pattern runs multiple activity functions in parallel and then fans in by waiting for all of them and aggregating the results. Function chaining runs activities sequentially, not in parallel. The async HTTP API pattern exposes status endpoints for a long-running operation. A monitor watches a condition over time; neither aggregates parallel branches.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-84","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which set of function types makes up a Durable Functions application?","choices":["Trigger functions, filter functions, and gateway functions","Orchestrator, activity, entity, and client functions","System topics, custom topics, and partner topics","Producers, consumer groups, and checkpoints"],"answer":[1],"explanation":"Durable Functions applications are composed of client functions that start orchestrations, orchestrator functions that coordinate the workflow, activity functions that do the work, and entity functions for stateful entities. Filter and gateway functions are not Durable Functions roles. System, custom, and partner topics are Event Grid concepts. Producers, consumer groups, and checkpoints are Event Hubs concepts.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-85","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Consolidated Messenger exposes several backend APIs and needs a single facade that verifies subscription keys, enforces rate limits, and routes calls to the right backend service. Which Azure service provides this?","choices":["Azure API Management","Azure Event Grid","Azure Service Bus","Azure Event Hubs"],"answer":[0],"explanation":"Azure API Management provides an API gateway that acts as a facade to backend services, verifies API keys, enforces rate limits and quotas, and routes requests to the appropriate backend. Event Grid routes events, not API calls with key verification and throttling. Service Bus is a message broker, not an API gateway. Event Hubs ingests event streams and does not front APIs with policies.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-86","obj":"3.1.1","difficulty":"medium","type":"single","stem":"An API Management team at Fabrikam applies a rate-limit policy of 1000 calls per minute per subscription. What does a caller receive when it exceeds the limit?","choices":["A 200 OK with an empty body","A 401 Unauthorized response","A 500 Internal Server Error","A 429 Too Many Requests response with a retry-after header"],"answer":[3],"explanation":"When the configured call rate is exceeded, API Management returns HTTP 429 Too Many Requests along with a retry-after header indicating when the caller can try again. A 200 OK would mean the call succeeded. A 500 indicates a server fault, not throttling. A 401 indicates failed authentication, not rate limiting.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-87","obj":"3.1.1","difficulty":"hard","type":"single","stem":"In which section of an Azure API Management policy definition should a team place a rate-limit policy so that requests are throttled before they reach the backend?","choices":["The outbound section","The on-error section","The inbound section","The backend section"],"answer":[2],"explanation":"The rate-limit policy is applied in the inbound section, which processes the request before it is forwarded to the backend, so excess calls are rejected early. The outbound section runs on the response after the backend returns. The on-error section runs only when an error occurs. The backend section governs how the request is sent to the backend, after inbound throttling has already been evaluated.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-88","obj":"3.1.1","difficulty":"easy","type":"single","stem":"VanArsdel needs strictly ordered processing with sessions, transactions, and duplicate detection, and concludes that Event Grid pull delivery cannot meet the requirement. Which service does Microsoft recommend instead for these enterprise messaging features?","choices":["Azure Event Hubs","Azure Service Bus","Azure API Management","Azure Event Grid system topics"],"answer":[1],"explanation":"Microsoft guidance states that if a workload requires enterprise messaging features like strictly ordered processing (sessions), transactions, or duplicate detection, use Service Bus. Event Hubs is for high-throughput streaming and lacks transactions and duplicate detection. API Management is an API gateway. Event Grid system topics route Azure service events and do not provide sessions, transactions, or duplicate detection.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-89","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A retail solution at Contoso uses three messaging services together: one processes orders reliably, one captures site clickstream telemetry at scale, and one reacts when an item is shipped. Which mapping is correct?","choices":["Service Bus for orders, Event Hubs for telemetry, Event Grid for shipped reactions","Event Grid for orders, Service Bus for telemetry, Event Hubs for shipped reactions","Event Hubs for orders, Event Grid for telemetry, Service Bus for shipped reactions","API Management for orders, Service Bus for telemetry, Event Hubs for shipped reactions"],"answer":[0],"explanation":"Microsoft's example uses Service Bus to process orders, Event Hubs to capture high-volume site telemetry, and Event Grid to respond to discrete events such as an item being shipped. The other mappings misassign services: Event Grid is not for reliable order processing, Service Bus is not for high-volume telemetry ingestion, and API Management is an API gateway, not an order broker.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-90","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A Service Bus subscription at Trey Research has dead-lettering on message expiration enabled. Where does a message go when its time-to-live elapses before it is received?","choices":["It is silently deleted with no trace","It is forwarded to an Event Grid topic","It is rescheduled with a new TTL","It is moved to the dead-letter queue with a reason recorded"],"answer":[3],"explanation":"When dead-lettering on expiration is enabled, a message whose TTL elapses is moved to the dead-letter queue and annotated with the reason it was placed there. With dead-lettering on expiration enabled it is not silently dropped. Service Bus does not automatically reschedule an expired message with a new TTL. It is not forwarded to Event Grid by default.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-91","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which comparison of delivery models between Azure Service Bus and Azure Event Grid is correct?","choices":["Service Bus uses a push model; Event Grid uses a pull model with polling","Both use a pull model exclusively","Service Bus uses a pull model where subscribers poll; Event Grid uses a push model delivering events as they arrive","Both use a push model exclusively"],"answer":[2],"explanation":"Service Bus implements a pull model in which the subscriber polls the subscription for messages, while Event Grid implements a push model that sends events to handlers as they are received for near-real-time delivery. The first choice reverses the two models. Neither statement that both use only pull, nor that both use only push, matches the documented difference between the services.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-92","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A developer at Fabrikam wants an Azure Functions app to run code whenever a message arrives on a Service Bus queue, without writing polling or connection code. What is the simplest approach?","choices":["Use a timer trigger that polls the queue every minute","Use the Service Bus trigger binding","Use an HTTP trigger and call the Service Bus REST API in a loop","Use an Event Hubs trigger"],"answer":[1],"explanation":"The Service Bus trigger binding invokes the function automatically when a message arrives on the queue or subscription, so no polling or manual connection code is needed. A timer trigger polling the queue adds latency and custom code. An HTTP trigger looping over the REST API is manual and inefficient. An Event Hubs trigger listens to Event Hubs, not Service Bus.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-93","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Meridian Freight processes booking messages. A worker must receive a message from an intake queue and, in the same atomic transaction, send a message to a downstream dispatch queue and complete the intake message, so that both actions settle together or neither does. Which Service Bus capability makes this single cross-entity transaction possible?","choices":["Enable autoforwarding from the intake queue to the dispatch queue","Enable duplicate detection on both queues","Enable cross-entity transactions and use a via (transfer) sender that targets the dispatch queue","Raise the transaction timeout above two minutes"],"answer":[2],"explanation":"The send-via (transfer) feature lets Service Bus route a message to the destination through a transfer entity while completing, deferring, or dead-lettering the input message in one atomic operation. For a transaction that spans more than one entity, the client must set EnableCrossEntityTransactions to true. Autoforwarding moves messages automatically but is not a transaction scope the application controls per operation, so it cannot atomically complete the intake message alongside a send the worker authors. Duplicate detection only discards repeat messages by message ID. Raising the transaction timeout does not group operations across entities; it only extends how long a scope may run.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-94","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Northwind Traders defers an out-of-order message so it can process a prerequisite message first. Later the application must retrieve that specific deferred message from the main queue. What must the application retain and supply to receive it?","choices":["The service-assigned message sequence number","The message lock token from the original receive operation","The partition key of the message","The session ID of the message"],"answer":[0],"explanation":"Deferred messages remain in the main queue but can no longer be received by regular receive operations. The owner must remember the service-assigned sequence number and later call a receive method that takes that sequence number to retrieve the deferred message. A lock token applies only to the current lock and expires, so it cannot locate a message later. A partition key controls storage placement, not retrieval of a deferred message. A session ID groups related messages but does not by itself identify a single deferred message, which is retrieved by sequence number.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-95","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Fabrikam wants a session-enabled queue to auto-forward its messages to a second queue in the same namespace. When they set ForwardTo on the session-enabled source queue, the configuration fails. What is the reason?","choices":["Autoforwarding requires the Basic tier, which this queue does not use","The destination queue cannot have sessions enabled","Autoforwarding is limited to topic subscriptions and cannot apply to queues","A single entity cannot have both session support and autoforwarding enabled as a source"],"answer":[3],"explanation":"A session-enabled queue or subscription cannot be the source of autoforwarding. A single entity cannot have both session support and autoforwarding enabled, so setting ForwardTo on a session-enabled source fails. Autoforwarding into a session-enabled destination is supported because the forwarded message keeps its session ID. The Basic tier does not support autoforwarding at all, so it is not a prerequisite. A session-enabled destination is actually allowed as a forwarding target. Queues can be autoforwarding sources when they are not session-enabled, so the restriction is about combining sessions with forwarding on the same source, not about queues in general.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-96","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Contoso Logistics uses a session-enabled queue with an active listener. One message inside an active session passes its time-to-live while other messages in the same session are still unprocessed. What happens to the session?","choices":["Only the expired message is dropped or dead-lettered; the rest of the session continues","All messages in that session are dropped or dead-lettered together","The session lock is renewed automatically so no message expires","The expired message is redelivered with a new sequence number"],"answer":[1],"explanation":"For session-enabled entities, messages are locked at the session level. If the time-to-live of any single message in the session expires, the system drops or dead-letters all messages related to that session, based on the dead-lettering-on-message-expiration setting, and only when there is an active listener. Expiry for sessions is not scoped to the single message. Lock renewal keeps a session locked but does not stop time-to-live from expiring. Expired messages are not silently redelivered with a new sequence number in this scenario; the whole session is expired.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-97","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Tailwind Traders enables a high prefetch count on a peek-lock receiver whose message processing is slow and expensive. Consumers begin receiving lock-expired messages, and some messages land in the dead-letter queue even though processing raised no errors. What is the root cause?","choices":["Prefetch disables peek-lock mode and switches the receiver to receive-and-delete","Prefetch shares one cache across all receivers, causing lock contention","The lock timer starts when a message enters the prefetch buffer, so locks expire before slow processing completes","Prefetch counts as extra billable operations that trigger throttling"],"answer":[2],"explanation":"In peek-lock mode, prefetched messages are locked the moment they enter the buffer, and the lock timer starts then. With a large buffer and slow processing, locks expire while messages sit in the buffer or during processing, so messages are treated as abandoned, redelivered, and eventually dead-lettered after the maximum delivery count. Prefetch should be used conservatively for slow, high-reliability processing. Prefetch does not change the receive mode from peek-lock to receive-and-delete. Each client keeps its own local cache; caches are not shared across clients. Prefetching does not add billable messaging operations and does not itself trigger throttling.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-98","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Adventure Works runs a high-availability handler that must resume a partially processed message session on a different worker after a crash, with the progress checkpoint instantly available to whichever worker next acquires the session. Which Service Bus feature stores that checkpoint?","choices":["The application properties carried on the current message","The duplicate detection history window on the queue","The dead-letter subqueue of the queue","Session state set and retrieved on the session receiver"],"answer":[3],"explanation":"Session state is an opaque binary object that the broker holds per session. The session receiver methods SetState and GetState let a new processor recover recorded progress the moment it acquires the session, which is exactly what is needed to resume work on a different worker. Application properties travel with an individual message, not with the session as a whole. The duplicate detection window only tracks message IDs to discard repeats. The dead-letter subqueue holds undeliverable or rejected messages, not in-progress session state.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-99","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A smart-building startup routes MQTT messages through an Azure Event Grid namespace. The routed messages must be available for pull delivery with high throughput of up to 40 MB/s ingress, and the team wants to avoid adding a separate role assignment just for routing. Which routing target should they choose?","choices":["A namespace topic in the same namespace","A custom topic configured to use the Event Grid schema","A custom topic with the Event Grid Data Sender role assigned","A system topic on the storage account"],"answer":[0],"explanation":"Routing MQTT messages to a namespace topic supports pull delivery, high throughput up to 40 MB/s ingress and 80 MB/s egress, and needs no role assignment because the MQTT broker and the namespace topic live under the same namespace. A custom topic caps throughput at roughly 5 MB/s and must use the CloudEvents schema, not the Event Grid schema, so that option is wrong on the schema requirement. A custom topic with the Event Grid Data Sender role does support routing but reintroduces the very role assignment the team wants to avoid and still caps throughput. A system topic on a storage account is unrelated to MQTT routing.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-100","obj":"3.1.1","difficulty":"easy","type":"single","stem":"A consumer application connects to an Azure Event Grid namespace topic using pull delivery. After reading an event, it determines it cannot process the event yet and wants the broker to make that event available again for later delivery. Which pull-delivery operation should the application call?","choices":["Acknowledge","Release","Reject","Renew lock"],"answer":[1],"explanation":"Pull delivery supports receive, acknowledge, release, reject, and renew lock. The release operation returns an already-read event back to the broker so that it can be delivered again later, which matches the requirement to retry the event. Acknowledge marks the event as successfully handled and removes it. Reject discards the event rather than making it available for a later retry. Renew lock only extends the current lock so processing can continue; it does not return the event to the broker for later delivery.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-101","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A payments team publishes CloudEvents over HTTP to an Event Grid namespace topic. They need the event context attributes carried as HTTP headers and the event data carried as the HTTP body, typed by the Content-Type header. Which CloudEvents content mode is this?","choices":["Structured content mode","Batched content mode","Binary content mode","Base64 content mode"],"answer":[2],"explanation":"In binary content mode the context attributes are mapped to HTTP headers and the event data is the HTTP payload, encoded according to the media type in Content-Type. Binary content mode is about how metadata and data are separated, not about whether the payload is binary, so it can still carry JSON or text. Structured content mode places both context attributes and event data together in a single payload such as one JSON object. Batched content mode sends an array of events in one request. Base64 content mode is not a defined CloudEvents content mode.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-102","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Blue Yonder enables Event Hubs Capture to archive a stream to Azure Blob Storage while Azure Stream Analytics reads the same stream in real time. The team worries that Capture will consume egress capacity and starve the Stream Analytics reader. Which statement about Capture is correct?","choices":["Capture copies data directly from internal storage and bypasses throughput unit and processing unit egress quotas","Capture shares the same egress quota as Stream Analytics and reduces available egress","Capture requires disabling all other consumers while it runs","Capture writes to storage only when a consumer explicitly flushes the buffer"],"answer":[0],"explanation":"Event Hubs Capture copies data directly from the internal Event Hubs storage, which bypasses throughput unit and processing unit egress quotas. This preserves egress capacity for other readers such as Stream Analytics or Apache Spark. Capture writes in Apache Avro format on a size-or-time first-wins window. Capture does not draw down the egress quota shared with other readers, which is the whole point of copying from internal storage. It does not require disabling other consumers. It writes automatically on the configured window rather than waiting for a consumer to flush a buffer.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-103","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Wingtip Toys has existing Apache Kafka producers and wants to keep publishing through the Kafka protocol to Event Hubs while a new consumer reads the same data through the native AMQP interface used by Azure Functions. Which statement about the Event Hubs Kafka endpoint is correct?","choices":["Kafka producers must be rewritten to AMQP before Event Hubs can accept them","Reading with AMQP requires a separate copy of the event hub","Previously generated shared access signature tokens are the recommended Kafka authentication method","You can write with one protocol and read with another because Kafka, AMQP, and HTTPS run concurrently on the same event hub"],"answer":[3],"explanation":"Event Hubs exposes the Kafka protocol alongside AMQP and HTTPS concurrently on the same event hub. You can write with any one of them and read with another, so existing Kafka producers keep publishing while an AMQP-native reader such as Azure Functions consumes the same stream. Producers do not need rewriting; that is the reason for the Kafka-compatible endpoint. No separate copy of the event hub is needed for AMQP reads. Previously generated shared access signature tokens are explicitly not supported on the Kafka endpoint; clients pass the connection string as the SASL password instead.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-104","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A telemetry team runs a Standard-tier Event Hubs namespace with a single throughput unit. During traffic spikes, producers begin receiving ServiceBusy throttling errors. Which statement about throughput units best explains the limit and an appropriate fix?","choices":["One throughput unit allows unlimited ingress but caps egress at 1 MB/s","Throughput units are set per partition, so adding partitions raises capacity","One throughput unit allows up to 1 MB/s or 1,000 events per second of ingress; enable auto-inflate to add units automatically","Throughput units apply only to the Premium tier, where they are called processing units"],"answer":[2],"explanation":"A single throughput unit provides up to 1 MB/s or 1,000 events per second of ingress, whichever comes first, and up to 2 MB/s egress. Exceeding the purchased ingress capacity throttles with a ServiceBusy error. Auto-inflate automatically increases the number of throughput units to meet demand and prevent throttling. Ingress is not unlimited; it is the capped dimension that throttles. Throughput units are shared across the namespace, not set per partition, and adding partitions does not add capacity. Standard tier uses throughput units while Premium uses processing units, so throughput units are not Premium-only.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-105","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Litware streams events where per-key ordering matters. On a Standard-tier event hub they set a very high partition count at creation time, then later want to reduce it. Which constraint should they have planned for?","choices":["Partition count can be increased or decreased freely on any tier at any time","Partition count is fixed after creation on Standard, and changing counts elsewhere remaps keys and disrupts ordering","More partitions always improve ordering guarantees across the entire stream","Partition count determines pricing, so more partitions cost more"],"answer":[1],"explanation":"On tiers other than Premium and Dedicated, the partition count cannot be changed after an event hub is created, and even where you can increase it you cannot decrease it. Changing the count remaps partition keys to partitions, which disrupts relative ordering, so over-provisioning partitions works against strict per-key ordering. You cannot decrease partitions, and on Standard you cannot change them at all after creation. More partitions do not improve global ordering and can make ordering harder to preserve. Pricing depends on throughput units, processing units, or capacity units, not on the partition count.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-106","obj":"3.1.1","difficulty":"easy","type":"single","stem":"A team on the Azure Functions Flex Consumption plan wants to eliminate cold-start latency for all HTTP-triggered functions in an app by keeping a minimum number of instances warm for just that group of functions. Which configuration achieves this?","choices":["Set a single global minimum instance count for the whole function app","Set always ready on each individual HTTP function by name only","Enable auto-inflate on the HTTP trigger group","Set the always-ready count for the built-in http per-function scaling group"],"answer":[3],"explanation":"Flex Consumption always-ready supports three special per-function scaling groups: http, durable, and blob. Setting the always-ready count for the http group keeps a minimum number of instances warm for all HTTP-triggered functions, which reduces cold-start latency for exactly that group. There is no single global app-wide always-ready knob that targets only the HTTP group. Naming each HTTP function individually is unnecessary when the built-in http group already covers them together. Auto-inflate is an Event Hubs scaling feature, not a Functions warm-instance setting.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-107","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A developer adds a function-level retry policy with exponential backoff to an HTTP-triggered Azure Function, but the runtime never applies the retries. What is the correct explanation?","choices":["Retry policies apply only to certain triggers such as Event Hubs, Azure Cosmos DB, Kafka, and Timer; HTTP is not supported","Exponential backoff is valid only for HTTP triggers, so the configured settings were ignored","Retry policies require the Flex Consumption plan to take effect","HTTP triggers support retries only with fixed delay, not exponential backoff"],"answer":[0],"explanation":"Runtime-enforced retry policies are supported only for a specific set of trigger types: Azure Cosmos DB, Event Hubs, Kafka, and Timer. HTTP triggers are not in that set, so a retry policy on an HTTP function has no effect. HTTP retry behavior should be handled by the calling client instead. Exponential backoff is not tied to HTTP triggers; both fixed delay and exponential backoff apply to the supported trigger types. Retry policies are not specific to the Flex Consumption plan. HTTP triggers do not support either retry strategy at the runtime level, so the fixed-delay claim is also wrong.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-108","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Graphite Analytics needs a workflow that polls an external job's status at intervals that change based on each response, waits between iterations without overlapping runs, and stops itself once the job completes or a timeout is reached. Which Durable Functions pattern fits these requirements?","choices":["The fan-out/fan-in pattern","A fixed-schedule timer-triggered function","The monitor pattern using durable timers in an orchestrator","The human interaction pattern driven by an external event"],"answer":[2],"explanation":"The monitor pattern is a recurring orchestration that waits between polls using durable timers, supports dynamic intervals, avoids overlapping runs, and can terminate itself when a condition is met or a timeout expires. That matches polling job status with changing intervals and self-termination. Fan-out/fan-in parallelizes many work items and then aggregates results; it does not poll on intervals. A fixed-schedule timer trigger runs on a set schedule, can overlap on long tasks, and has no dynamic interval or self-termination. The human interaction pattern waits for an external human response, not recurring status polling.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-109","obj":"3.1.1","difficulty":"easy","type":"single","stem":"An approval workflow built with Durable Functions must wait for an approver's response but escalate automatically if no response arrives within 24 hours. How should the orchestrator function implement this?","choices":["Call a blocking sleep for 24 hours, then check whether the event arrived","Start a durable timer and wait on whichever completes first: the external event or the timer","Poll an activity function every minute for the approval record","Apply a fixed-delay retry policy with a 24-hour delay on the notification activity"],"answer":[1],"explanation":"The human interaction pattern races a durable timer against a wait-for-external-event using a when-any construct. If the approval event arrives first, the orchestration processes it and cancels the timer; if the timer fires first, the orchestration escalates or rejects. On Consumption and Flex plans no compute is billed while the orchestration waits. Orchestrator functions must not use language-native sleep APIs, which block and break determinism. Polling an activity every minute wastes executions and is not how external events are delivered to an orchestration. A retry policy on the notification activity does not model an approval-versus-timeout race.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-110","obj":"3.1.1","difficulty":"medium","type":"single","stem":"An API team at Coho Vineyard must rename a required operation parameter, which is a breaking change, while existing clients keep calling the current contract unchanged until they choose to migrate. Which API Management capability should they use?","choices":["Create a new API version and expose it at a distinct path, header, or query identifier","Create a new revision and immediately make it current","Add the change to the current revision and post a change log entry","Increase the subscription count limit on the product"],"answer":[0],"explanation":"Versions are intended for breaking changes. Each version is maintained as its own API and is reached through a distinct version identifier in the path, header, or query string, so existing callers keep using the older version until they explicitly move to the new one. Revisions are intended for non-breaking changes. Making a new revision current would push the breaking change to all existing callers at once, because the current revision serves every request that does not specify a revision. Editing the current revision has the same immediate effect. The subscription count limit controls how many concurrent subscriptions a user may hold and is unrelated to changing an API contract.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-111","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Bellows College must reliably process ordered financial commands with retries and dead-lettering, one consumer per message. What should you use?","choices":["A Service Bus queue with sessions and dead-lettering","An Event Grid subscription with retry","An Event Hubs consumer group","A Storage queue"],"answer":[0],"explanation":"Service Bus queues give ordered sessions, retries, and dead-letter for commands. Event Grid does not guarantee order, Event Hubs is a stream, and Storage queues lack sessions and dead-letter.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-112","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard must send one event to three subscribers, each receiving only the message types it cares about, with reliable back-end processing. What should you use?","choices":["A Service Bus topic with per-subscription filter rules","An Event Grid topic with one subscription","A single shared queue","An Event Hubs instance with one consumer group"],"answer":[0],"explanation":"A topic with per-subscription filters delivers each subscriber only its matching copy reliably. A single subscription or consumer group does not fan out filtered copies, and a shared queue competes.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-113","obj":"3.1.1","difficulty":"medium","type":"multi","stem":"Consolidated Messenger must avoid losing Event Grid events on delivery failure. Select two. (Select two.)","choices":["Configure a dead-letter destination","Set a retry policy with backoff","Increase the event batch size","Move the subscriber to a faster region","Disable delivery for slow subscribers"],"answer":[0,1],"explanation":"Dead-lettering plus a retry policy protect against delivery failures. Batch size, region, and disabling delivery do not prevent event loss.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-114","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Fourth Coffee must process Service Bus queue messages in order per session while scaling out across sessions. What should you use?","choices":["A Service Bus trigger with sessions enabled","A timer trigger polling the queue","An HTTP trigger with a loop","A Blob trigger"],"answer":[0],"explanation":"A session-aware Service Bus trigger preserves per-session order while scaling across sessions. Timer polling and HTTP loops lose ordering, and a Blob trigger reads storage, not the queue.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-115","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Lucerne Publishing must run 100 extraction steps in parallel then aggregate, with checkpointing that survives restarts. What should you use?","choices":["A Durable Functions fan-out/fan-in orchestration","A single queue-triggered function","A timer trigger","A chain of HTTP calls"],"answer":[0],"explanation":"Fan-out/fan-in runs activities in parallel and aggregates with durable checkpoints. A single function is serial, a timer is scheduled, and HTTP chains lose state on restart.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-116","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Nod Publishers needs a Functions app with VNet integration, no cold starts, and event-driven scaling. Which plan?","choices":["The Functions Premium plan","The Consumption plan","A Dedicated plan without scale rules","A static web app"],"answer":[0],"explanation":"Premium gives VNet integration, pre-warmed instances, and event-driven scale. Consumption cold-starts, the Dedicated plan does not event-scale, and a static web app hosts front ends.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-117","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Graphic Design Institute must ingest a high-volume telemetry stream and let multiple consumers replay from arbitrary offsets. What should you use?","choices":["Azure Event Hubs with consumer groups","A Service Bus topic","Azure Event Grid","A Storage queue"],"answer":[0],"explanation":"Event Hubs retains a partitioned log that consumer groups replay by offset. A topic and Storage queue drop consumed messages, and Event Grid does not retain a replayable stream.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-118","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Contoso Bank processes payment messages where each account number must be handled in strict first-in first-out order, and a receiver crash must never lose an in-flight message. Which Azure Service Bus configuration meets both requirements?","choices":["Enable sessions and set the SessionId to the account number, using ReceiveAndDelete receive mode","Enable partitioning with a partition key, using PeekLock receive mode","Enable duplicate detection keyed on MessageId, using PeekLock receive mode","Enable sessions and set the SessionId to the account number, using PeekLock receive mode"],"answer":[3],"explanation":"Sessions provide the FIFO guarantee by locking all messages with a given SessionId to one receiver, and PeekLock keeps the message until it is settled so a crash redelivers it rather than losing it. ReceiveAndDelete satisfies ordering but loses the message if the consumer crashes mid-processing. Duplicate detection only suppresses resent MessageId values and gives no ordering. Partitioning improves throughput but does not guarantee per-key ordering.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-119","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Fabrikam's sender may resend a message after a send timeout and needs the broker to silently drop the resent copy. Which combination correctly enables Service Bus duplicate detection?","choices":["The application sets a stable MessageId, on the Standard or Premium tier","The application sets a PartitionKey, on the Basic tier","The application sets a stable SessionId, on the Standard or Premium tier","The application sets a CorrelationId, on the Basic tier"],"answer":[0],"explanation":"Duplicate detection tracks the application-controlled MessageId within a time window and drops repeats; it is available only on Standard and Premium tiers. SessionId enables FIFO, not deduplication. CorrelationId is used for correlation filters, not dedup, and the Basic tier supports neither duplicate detection nor sessions. PartitionKey affects routing, not deduplication basis.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/duplicate-detection"},{"id":"3.1.1-120","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A Tailwind Traders topic subscription uses a SQL filter whose expression throws an evaluation error for certain messages. Where does Service Bus place a message when the subscription filter evaluation fails?","choices":["The transfer dead-letter queue of the topic","Back onto the topic for re-evaluation","The namespace-level error queue","The subscription's dead-letter queue"],"answer":[3],"explanation":"A subscription filter evaluation failure is one of the documented reasons Service Bus dead-letters a message, and it lands in that subscription's dead-letter queue. The transfer dead-letter queue is used for autoforward delivery failures, not filter errors. There is no namespace-level error queue. Messages are not re-evaluated back on the topic.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-121","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Adventure Works chains a queue to a destination topic with autoforwarding, but the destination is unavailable so the transfer fails. Where is the undeliverable message placed?","choices":["It is dropped immediately with no dead-lettering","The transfer dead-letter queue of the source entity","The dead-letter queue of the destination topic","The active queue of the destination topic"],"answer":[1],"explanation":"When an autoforwarded message cannot be delivered to the destination, Service Bus places it in the transfer dead-letter queue of the source entity. The destination's own dead-letter queue is not used because the message never reached the destination. It is not placed on the destination active queue and it is not silently dropped.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-122","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Northwind needs the highest possible subscription throughput while routing messages that match a single header value exactly. Which Service Bus topic filter should the team choose?","choices":["A false filter","A correlation filter","A SQL filter","A true filter"],"answer":[1],"explanation":"Correlation filters match system and user properties by equality and are far more efficient than SQL-like filters, so Microsoft recommends them where possible for throughput. A SQL filter can do equality but lowers throughput due to expression processing. A true filter matches every message and a false filter matches none, so neither performs targeted routing.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-123","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Wide World Importers wants a subscription to route based on a field inside the JSON message body. What is the correct statement about Service Bus subscription filters?","choices":["Filters evaluate only message properties and cannot read the message body","SQL filters can parse and evaluate any field in the message body","Correlation filters can match values nested in the message body","Boolean filters evaluate the body while SQL filters evaluate properties"],"answer":[0],"explanation":"All Service Bus filters evaluate user-defined and system properties only; they cannot evaluate the message body, so routing data must be promoted to a property. SQL filters test properties, not the body. Correlation filters match properties by equality, not nested body values. Boolean filters (true/false) derive from SQL filters and also never read the body.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-124","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Woodgrove needs to schedule a 3 MB Service Bus message for future delivery. Which approach works given the message size?","choices":["Use the ScheduleMessage API that returns a SequenceNumber","Set a long TimeToLive so delivery is delayed","Send with the ScheduledEnqueueTimeUtc property set on the message","Enable duplicate detection so the message is held until its window"],"answer":[2],"explanation":"Messages larger than 1 MB can only be scheduled using the regular send API with the ScheduledEnqueueTimeUtc property set; the dedicated schedule API is limited to smaller messages. The ScheduleMessage API cannot be used for messages over 1 MB. Duplicate detection does not delay delivery. TimeToLive controls expiration, not scheduled enqueue time.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-125","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Relecloud configures an Event Grid subscription with an event time-to-live of 30 minutes and a maximum of 10 delivery attempts, using the exponential retry schedule that allows about 6 attempts within 30 minutes. When are undelivered events dead-lettered?","choices":["After 30 minutes, because time-to-live expires before 10 attempts are reached","After 10 delivery attempts, regardless of elapsed time","Immediately after the first failed attempt","After both 30 minutes and 10 attempts are exhausted"],"answer":[0],"explanation":"Event Grid stops delivery at whichever limit expires first; with roughly 6 attempts possible in 30 minutes, the TTL is reached first, so the max-attempts setting has no effect here. The event is dead-lettered before 10 attempts occur, so attempts alone do not decide. It is the first limit to expire, not both, and a single failure triggers retries, not immediate dead-lettering (unless a 400/413 is returned).","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-126","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Litware wants Event Grid to preserve events that cannot be delivered after all retries. What must the team provision, and what is the default state of the feature?","choices":["An Azure Storage account container as the dead-letter location; dead-lettering is off by default","A Cosmos DB container as the dead-letter location; dead-lettering is on by default","An Azure Service Bus queue as the retry buffer; dead-lettering is on by default","An Event Hubs namespace as the dead-letter location; dead-lettering is off by default"],"answer":[0],"explanation":"Event Grid dead-letters undelivered events to a Storage account blob container that you specify, and dead-lettering is not enabled by default. The dead-letter destination is Storage, not a Service Bus queue, Event Hubs, or Cosmos DB, and in every case the feature is off until you configure a storage endpoint.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-127","obj":"3.1.1","difficulty":"easy","type":"single","stem":"An Event Grid subscription at VanArsdel receives an HTTP 400 (Bad Request) response from the handler on the first delivery attempt. How does Event Grid respond?","choices":["It drops the event silently with no dead-lettering","It retries the event up to the maximum of 30 attempts","It waits for the time-to-live to expire before retrying","It immediately schedules the event for dead-lettering without further retries"],"answer":[3],"explanation":"A 400 or 413 response indicates delivery will never succeed, so Event Grid immediately schedules the event for dead-lettering instead of retrying. It does not exhaust normal retries or wait for TTL on a 400, and if dead-lettering is configured the event is preserved rather than silently dropped.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-128","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel requires strict per-key ordering of a stream plus at-least-once delivery. Which statement about using Event Grid for this is correct?","choices":["Event Grid guarantees ordering per subscription, so it satisfies the requirement","Event Grid does not guarantee event ordering, so use Event Hubs partitions or Service Bus sessions for ordered delivery","Event Grid guarantees exactly-once ordered delivery to each handler","Event Grid preserves ordering only when dead-lettering is enabled"],"answer":[1],"explanation":"Event Grid delivers at least once but does not guarantee order; ordered per-key processing is achieved with Event Hubs partitions or Service Bus sessions. Event Grid provides neither per-subscription ordering nor exactly-once delivery, and dead-lettering does not add ordering guarantees.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-129","obj":"3.1.1","difficulty":"hard","type":"single","stem":"At Coho Vineyard, an analytics app and an archival app must each read the entire Event Hubs stream independently without affecting each other's position. What should you configure?","choices":["A separate event hub for each application within one consumer group","A shared consumer group with two readers on the same partition","A separate partition for each application","A separate consumer group for each application"],"answer":[3],"explanation":"A consumer group is an independent view of the stream with its own tracked position, so giving each application its own consumer group lets them read the full stream independently. Partitions scale throughput but do not isolate reader positions across apps. Two readers in one consumer group on the same partition conflict. Separate event hubs would duplicate ingestion rather than share one stream.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-130","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Lamna Healthcare runs multiple instances in one Event Hubs consumer group. What is the guideline for active readers per partition within a single consumer group?","choices":["One active reader per partition across all consumer groups combined","Unlimited concurrent readers per partition","One active reader per partition within the consumer group","Exactly two active readers per partition for redundancy"],"answer":[2],"explanation":"Event Hubs recommends one active reader per partition within a consumer group (up to five in special scenarios), which is how partitioned consumption load-balances. The limit is per consumer group, not shared across all groups. Readers are not unlimited, and there is no fixed requirement of exactly two readers per partition.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-131","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Proseware must reprocess yesterday's Event Hubs events after a downstream bug. Which mechanism enables this replay?","choices":["Increase the partition count to expose historical events","Enable duplicate detection to resurface processed events","Start reading from an earlier offset or checkpoint in the partition","Delete and recreate the consumer group to reset delivery"],"answer":[2],"explanation":"Because Event Hubs is a retained append-only log, a consumer can replay by specifying a lower offset (or timestamp) than the last checkpoint to reread historical events. Recreating a consumer group does not restore a specific past position. Partition count does not affect retained history and cannot be changed after creation. Duplicate detection is a Service Bus feature, not Event Hubs replay.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-132","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which statement correctly describes Event Hubs checkpointing for a consumer at Trey Research?","choices":["Checkpoints are stored in the event hub itself and shared by all consumer groups","Checkpointing is the consumer's responsibility and is stored externally, per partition per consumer group","Checkpointing guarantees exactly-once processing of every event","The Event Hubs service automatically stores checkpoints per namespace"],"answer":[1],"explanation":"In AMQP, checkpointing is the consumer's responsibility; offsets are persisted externally (for example in Blob Storage) on a per-partition, per-consumer-group basis. The service provides offsets but does not store checkpoints automatically or per namespace. Checkpoints are not shared across consumer groups, and Event Hubs is at-least-once, so idempotency is still required.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-133","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder ingests millions of telemetry events per second for stream analytics, while a separate workflow needs per-message settlement and a dead-letter queue for poison commands. Which pairing fits each workload?","choices":["Event Hubs for both telemetry ingestion and command settlement","Event Hubs for high-throughput telemetry; Service Bus for command settlement and dead-lettering","Event Grid for high-throughput telemetry; Event Hubs for command settlement","Service Bus for high-throughput telemetry; Event Hubs for command settlement"],"answer":[1],"explanation":"Event Hubs is built for high-scale at-least-once streaming, while Service Bus provides per-message peek-lock settlement and a dead-letter queue suited to commands. Service Bus is not designed for millions/sec streaming, Event Grid is a discrete-event router without per-message settlement, and Event Hubs has no per-message dead-letter queue for commands.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-134","obj":"3.1.1","difficulty":"medium","type":"single","stem":"When authoring a First Up Consultants Azure Function, how many triggers must a single function have?","choices":["One trigger for every output binding","Exactly one trigger","Zero or more triggers","At least one input binding acting as a trigger"],"answer":[1],"explanation":"A function must have exactly one trigger that defines how it is invoked; input and output bindings are optional and separate. A function cannot have zero triggers, an input binding is not itself the trigger, and the number of output bindings is unrelated to the single-trigger rule.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-135","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A Humongous Insurance function is triggered by a queue message and must write a new document to Azure Cosmos DB. What kind of binding writes the Cosmos DB document?","choices":["A custom AMQP binding","An input binding","A second trigger","An output binding"],"answer":[3],"explanation":"Bindings that write data out of a function are output bindings; the Cosmos DB write is declared as an output binding. An input binding reads data in, a function can have only one trigger, and no custom AMQP binding is required to write to Cosmos DB.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-136","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Consolidated Messenger wants a reusable custom input binding for the Azure Functions runtime. In which language must custom bindings be authored, even if consumed elsewhere?","choices":["Python",".NET","JavaScript","PowerShell"],"answer":[1],"explanation":"Custom input and output bindings must be authored in .NET, though they can then be consumed from any supported language. Python, JavaScript, and PowerShell can consume custom bindings but cannot be used to author them.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-137","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Fourth Coffee needs a serverless Functions plan that scales to zero, bills per execution, and also provides virtual network integration. Which hosting plan meets all three?","choices":["Premium plan","Dedicated (App Service) plan","Consumption plan","Flex Consumption plan"],"answer":[3],"explanation":"Flex Consumption scales to zero with execution-based billing and adds virtual network integration, satisfying all three requirements. The Consumption plan scales to zero and bills per execution but does not support virtual networks. Dedicated does not scale to zero. Premium supports VNet but keeps at least one billed instance and does not scale to zero.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-138","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Alpine Ski House needs to eliminate cold starts with perpetually warm instances and run functions longer than the Consumption maximum, while keeping event-driven scaling. Which plan is the best fit?","choices":["Dedicated plan with Always On","Consumption plan","Premium plan","Flex Consumption plan without always-ready instances"],"answer":[2],"explanation":"The Premium plan uses always-ready plus prewarmed instances to remove cold starts, allows longer runtimes than Consumption, and still scales dynamically on events. Consumption suffers cold starts and caps runtime. Dedicated with Always On avoids cold start but does not scale dynamically on events. Flex Consumption without always-ready instances still incurs cold starts when scaled to zero.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-139","obj":"3.1.1","difficulty":"easy","type":"single","stem":"A Graphic Design Institute engineer must create an Elastic Premium plan for a function app. Which App Service plan SKU is correct?","choices":["P1V2","S1","B1","EP1"],"answer":[3],"explanation":"Elastic Premium plans that dynamically host functions use SKU names starting with E, such as EP1. P1V2 is a Dedicated Premium V2 plan that does not scale elastically. S1 (Standard) and B1 (Basic) are Dedicated App Service SKUs, not Elastic Premium.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-140","obj":"3.1.1","difficulty":"medium","type":"single","stem":"The Phone Company runs a Durable Functions orchestrator that must upload many files in parallel and then sum the total bytes uploaded. Which pattern applies?","choices":["Human interaction, waiting for an external approval per file","Function chaining, awaiting each activity sequentially","Monitor pattern, polling each upload on a timer","Fan-out/fan-in, awaiting all activity tasks together before aggregating"],"answer":[3],"explanation":"Fan-out/fan-in schedules the activities in parallel and then joins on all tasks (for example Task.WhenAll) to aggregate the results. Chaining runs activities one at a time, defeating parallelism. The monitor pattern polls a condition, and the human-interaction pattern waits on external events; neither describes parallel fan-out with aggregation.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-141","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A Litware Durable Functions app uses fan-out/fan-in and the team is concerned about aggregation performance. What is the documented limitation of the fan-in stage?","choices":["Fan-in cannot return values to the client","Fan-in scales across all available VMs just like fan-out","Fan-in runs in a single orchestrator instance on one VM, unlike the parallel fan-out","Fan-in requires an entity function to aggregate results"],"answer":[2],"explanation":"The second half of the pattern, fan-in, runs in one orchestrator function instance on a single VM, so heavy aggregation can be subdivided across sub-orchestrations. Fan-in does not scale across VMs the way fan-out does. It does not require an entity, and orchestrations can return their output to the client.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-142","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which statement correctly describes how a Woodgrove durable entity processes operations?","choices":["Operations for a given entity run serially, one at a time, on a single dispatcher thread","Operations run in parallel but share a lock only for state writes","Each operation spawns a new entity instance to run in parallel","Operations for a given entity run concurrently across multiple threads"],"answer":[0],"explanation":"A durable entity is single-threaded per instance: operations for one entity are processed one at a time, which prevents concurrency conflicts without explicit locking. Entity operations do not run concurrently, do not spawn new instances per operation, and do not use partial per-write locking; the whole operation is serialized.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-143","obj":"3.1.1","difficulty":"medium","type":"single","stem":"In an Adventure Works Durable Functions solution, a client function needs to interact with a Counter entity. Which interactions can a client perform?","choices":["Call the entity and await a return value","Neither signal nor read entity state","Both signal and call the entity with return values","Signal the entity (one-way) and read its state, but not call it and await a result"],"answer":[3],"explanation":"Clients can only signal entities (one-way, fire-and-forget) and read entity state; calling an entity and awaiting a result is available only from orchestrators. Only orchestrators can call and await a result, so clients cannot receive return values, and clients can indeed both signal and read state.","ref":"https://learn.micros
