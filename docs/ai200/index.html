.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-221","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Northwind deploys API Management across two regions and applies both a rate-limit-by-key policy and a quota-by-key policy. How are the two counters scoped?","choices":["Both counters are global across the whole instance.","rate-limit counters are per gateway (each regional gateway counts separately), while quota-by-key uses a single global counter at the instance level.","Both counters are per gateway, so each region counts separately for both policies.","rate-limit is global, while quota-by-key is per gateway."],"answer":[1],"explanation":"Rate-limit-style policies use per-gateway counters, so each regional gateway enforces separately. Quota policies are global, using a single counter at the instance level. Rate-limit counters are per gateway, not global. Quota-by-key is global at the instance level, not per gateway. Reversed: rate-limit is per gateway and quota is global.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-222","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Relecloud attaches a rate-limit-by-key policy at the product scope, but it is not enforced for callers that send no subscription key. Why does the product policy not run for those callers?","choices":["Product-scope policies apply only when API Management can resolve a subscription context for the request.","Product-scope policies never support rate limiting of any kind.","The <base /> tag must be removed from every API before product policies will run.","rate-limit-by-key is valid only at the global scope, never at product scope."],"answer":[0],"explanation":"Product policies are entered only when API Management resolves a subscription for the request. Without a subscription key (or an equivalent mapping), no product is resolved, so product-scope policies are skipped. Product-scope rate limiting is supported; the issue is subscription resolution, not policy support. Removing <base /> changes inheritance behavior but is not why product policies are skipped without a subscription. rate-limit-by-key is valid at global, workspace, product, API, and operation scopes.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-223","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Proseware must ship a breaking change to an API while existing clients keep using the old contract, and separately wants to test a minor non-breaking fix before it goes live. Which mapping is correct?","choices":["Use a revision for the breaking change and a version for the non-breaking fix.","Use two separate products, one per change.","Use a version for the breaking change (clients opt in via a version identifier) and a revision for the non-breaking fix (test via ;rev=N, then make it current).","Use one version set and never use revisions for either change."],"answer":[2],"explanation":"Versions are used to separate breaking changes, with clients selecting a version identifier. Revisions are for minor, non-breaking changes that you test with the ;rev=N URL and then set as current. Reversed: versions handle breaking changes, revisions handle non-breaking changes. Products group and secure APIs; they do not model breaking-versus-non-breaking change flow. Revisions are exactly the right tool for testing the non-breaking fix safely.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-224","obj":"3.1.1","difficulty":"medium","type":"multi","stem":"Woodgrove Bank is evaluating the Flex Consumption plan and must record two accurate statements in an architecture decision record. Select the two correct statements.","choices":["It supports scale-to-zero when the app is idle.","It supports outbound virtual network integration.","It supports Windows and Linux equally.","It never scales to zero and always bills at least one instance.","It caps scale-out at 200 instances."],"answer":[0,1],"explanation":"Flex Consumption both scales to zero and supports virtual network integration, unlike the classic Consumption plan. Flex Consumption is Linux only; it does not support Windows. That describes the Premium plan; Flex Consumption does scale to zero. Flex Consumption scales out to a maximum of 1,000 instances, not 200.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-225","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"First Up Consultants must select the two statements that correctly describe Durable Functions patterns. Select two.","choices":["task_all runs activities in parallel and completes only when all tasks finish.","The human-interaction pattern races a durable timer against an external event.","Fan-in scales linearly across many VMs as you add workers.","Function chaining runs its activities concurrently by default.","A durable entity processes its operations concurrently to avoid queuing."],"answer":[0,1],"explanation":"Passing an array of unyielded tasks to task_all runs them in parallel and completes when all finish. The human-interaction pattern races a durable timer against an external event. Fan-in runs in a single orchestrator instance on one VM; it does not scale across many VMs. Function chaining runs activities sequentially, one after another. Durable entities process operations serially (single-threaded), not concurrently.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-226","obj":"3.1.1","difficulty":"easy","type":"multi","stem":"Litware's platform team must confirm two accurate Event Hubs consumer facts. Select two.","choices":["Checkpointing is the consumer's responsibility and is stored externally per consumer group and partition.","Up to five concurrent readers are allowed per partition per consumer group, though one active reader is recommended.","The Event Hubs service persists consumer offsets server-side automatically.","Multiple active readers on the same partition prevent duplicate delivery.","The number of consumer groups equals the maximum consumer parallelism."],"answer":[0,1],"explanation":"Checkpointing is a per-partition, per-consumer-group responsibility of the consumer, stored externally. Up to five concurrent readers per partition per group are allowed, but one active reader is recommended. The service provides offsets but does not persist the consumer's committed position. Multiple active readers on a partition each receive all events, causing duplicate delivery. Maximum parallelism equals the number of partitions, not the number of consumer groups.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-227","obj":"3.1.1","difficulty":"medium","type":"multi","stem":"Contoso's API team must select the two correct API Management statements. Select two.","choices":["rate-limit-by-key and quota-by-key are not available in the Consumption tier.","Quota policies use a single global counter at the instance level.","The subscription-scoped rate-limit policy works without any subscription key.","Versions are for non-breaking changes and revisions are for breaking changes.","A self-hosted gateway refuses to start when a configured policy is unsupported."],"answer":[0,1],"explanation":"rate-limit-by-key and quota-by-key are unavailable in the Consumption tier. Quota policies are global, using a single instance-level counter. The subscription-scoped rate-limit policy is applied only when the API is accessed with a subscription key. Reversed: versions handle breaking changes and revisions handle non-breaking changes. A self-hosted gateway skips unsupported policies at runtime rather than refusing to start.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-228","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Fabrikam is documenting Event Hubs Capture. Select the two accurate statements.","choices":["The default output format written by Capture is Apache Avro.","Capture uses a first-wins policy between the size window and the time window.","Parquet is written directly by Capture with no additional tooling.","Capture is available in the Basic tier.","Capture always consumes the namespace egress quota."],"answer":[0,1],"explanation":"Capture writes Apache Avro by default and applies a first-wins policy between the configured size and time windows. Parquet is available only through the no-code editor in the portal, not written directly by Capture. The Basic tier does not support Capture. Capture copies data from internal storage and bypasses egress quota.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-229","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Adventure Works needs an Event Hubs-triggered Python (v2 model) function to retry a fixed number of times with a constant 10-second gap between attempts. Complete the retry decorator with the correct strategy value.\n\n```\n@app.event_hub_message_trigger(arg_name=\"events\", event_hub_name=\"orders\", connection=\"EhConn\")\n@app.retry(strategy=\"________\", max_retry_count=\"4\", delay_interval=\"00:00:10\")\ndef process(events):\n    ...\n```","choices":["fixed_delay","exponential_backoff","linear_backoff","constant"],"answer":[0],"explanation":"A constant gap between retries is the fixed_delay strategy, which pairs with the delay_interval argument. exponential_backoff increases the delay each attempt and uses minimum_interval and maximum_interval, not a single delay_interval. linear_backoff is not a valid Functions retry strategy value. constant is not a valid Functions retry strategy value; the fixed strategy is named fixed_delay.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-230","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Northwind wants a newly deployed Event Hubs-triggered function to begin at the end of the stream (only new events) when no checkpoint exists yet. Complete host.json with the correct offset type.\n\n```\n{\n  \"extensions\": {\n    \"eventHubs\": {\n      \"initialOffsetOptions\": {\n        \"type\": \"________\"\n      }\n    }\n  }\n}\n```","choices":["fromStart","fromEnd","fromEnqueuedTime","fromCheckpoint"],"answer":[1],"explanation":"fromEnd starts processing at the end of the stream, so only events arriving after deployment are read when no checkpoint exists. fromStart begins at the earliest available event, which processes historical events rather than only new ones. fromEnqueuedTime starts at a specific timestamp and requires the enqueuedTimeUtc setting; it does not simply mean 'only new events'. fromCheckpoint is not a valid initialOffsetOptions/type value; valid values are fromStart, fromEnd, and fromEnqueuedTime.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-231","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Relecloud wants host-to-Event Hubs operations (such as fetching and sending events) to retry at fixed intervals of consistent duration rather than growing delays. Complete host.json with the correct clientRetryOptions mode.\n\n```\n{\n  \"extensions\": {\n    \"eventHubs\": {\n      \"clientRetryOptions\": {\n        \"mode\": \"________\",\n        \"maximumRetries\": 3\n      }\n    }\n  }\n}\n```","choices":["fixed","exponential","linear","incremental"],"answer":[0],"explanation":"The fixed mode retries at consistent-duration intervals, which matches the requirement for a constant delay between attempts. exponential is the default and increases the delay each attempt, not a consistent fixed interval. linear is not a valid clientRetryOptions mode; the valid values are exponential and fixed. incremental is not a valid clientRetryOptions mode.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-232","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines must bind an Event Hubs trigger to a dedicated consumer group named \"scoring\" so the scoring function does not compete with the archival application for partition leases. Complete the decorator with the correct parameter name.\n\n```\n@app.event_hub_message_trigger(\n    arg_name=\"events\",\n    event_hub_name=\"telemetry\",\n    connection=\"EhConn\",\n    ________=\"scoring\")\ndef score(events):\n    ...\n```","choices":["consumer_group","cardinality","partition_key","checkpoint_strategy"],"answer":[0],"explanation":"The consumer_group parameter binds the trigger to a named consumer group, giving the scoring function its own independent view separate from the archival application. cardinality controls whether the function receives one event or a batch, not which consumer group it reads. partition_key is a producer-side concept and is not a trigger parameter for selecting a consumer group. checkpoint_strategy is not a valid event_hub_message_trigger parameter.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-233","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Graphic Design Institute fans out a resize activity over a list of images and then aggregates the byte counts, requiring all branches to run concurrently and the orchestrator to wait for every result. Complete the Python orchestrator with the correct context method.\n\n```\ndef orchestrator(context):\n    tasks = [context.call_activity(\"Resize\", img) for img in images]\n    results = yield context.________(tasks)\n    return sum(results)\n```","choices":["task_all","task_any","call_activity","wait_for_external_event"],"answer":[0],"explanation":"task_all takes the array of unyielded tasks, runs them in parallel, and completes only when every task finishes, so the orchestrator can sum all results. task_any completes as soon as the first task finishes, so it would not wait for every resize result. call_activity invokes a single activity and does not aggregate a list of parallel tasks. wait_for_external_event waits for an external signal, which is the human-interaction pattern, not fan-in aggregation.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"4.1.1-01","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Which service securely stores secrets such as API keys?","choices":["Azure Key Vault","Azure App Service","Azure Monitor","Azure CDN"],"answer":[0],"explanation":"Key Vault stores and manages secrets. App Service hosts apps, Monitor observes them, and the CDN caches content.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-02","obj":"4.1.1","difficulty":"medium","type":"single","stem":"What lets an app authenticate to Azure services without stored credentials?","choices":["A managed identity","A hardcoded password","A public endpoint","A local text file"],"answer":[0],"explanation":"A managed identity provides credential-free authentication. Passwords, public endpoints, and text files store or expose credentials.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-03","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Which service collects logs and metrics you query with KQL?","choices":["Azure Monitor","Azure Key Vault","Azure CDN","Azure DNS"],"answer":[0],"explanation":"Azure Monitor stores telemetry queried with KQL. Key Vault holds secrets, the CDN caches content, and DNS resolves names.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-04","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Where should non-secret feature flags and settings live for central management?","choices":["Azure App Configuration","Azure Key Vault","The container image","A local file"],"answer":[0],"explanation":"App Configuration centralizes non-secret settings and flags. Key Vault is for secrets, and images or local files need a redeploy to change.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-05","obj":"4.1.1","difficulty":"medium","type":"single","stem":"What does OpenTelemetry help you do?","choices":["Trace a request across multiple services","Encrypt secrets at rest","Cache database rows","Resolve domain names"],"answer":[0],"explanation":"OpenTelemetry produces distributed traces across services. Encryption, caching, and DNS are unrelated to tracing.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-06","obj":"4.1.1","difficulty":"hard","type":"single","stem":"How should an app read a secret from Key Vault at runtime?","choices":["Through a managed identity granted access to the vault","By embedding the secret in code","By committing it to source control","By printing it to logs"],"answer":[0],"explanation":"A managed identity retrieves the secret without storing it. Embedding, committing, or logging a secret exposes it.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-07","obj":"4.1.1","difficulty":"easy","type":"single","stem":"What does a KQL query run against?","choices":["Logs and metrics in Azure Monitor","Container image layers","DNS zone files","Key Vault secrets"],"answer":[0],"explanation":"KQL queries telemetry in Azure Monitor. Image layers, DNS files, and secrets are not KQL data sources.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-08","obj":"4.1.1","difficulty":"medium","type":"single","stem":"What is the primary purpose of Azure Key Vault?","choices":["Securely store and control access to secrets, keys, and certificates","Centrally store application feature flags","Collect application logs and traces","Assign identities to Azure resources"],"answer":[0],"explanation":"Key Vault is a cloud service for securely storing and controlling access to secrets, keys, and certificates. Feature flags belong in App Configuration, telemetry belongs in Azure Monitor, and identities come from Microsoft Entra ID.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-09","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Which Azure service is designed to centrally manage application settings and feature flags?","choices":["Azure Key Vault","Azure App Configuration","Application Insights","Azure Monitor Logs"],"answer":[1],"explanation":"Azure App Configuration provides a central service to manage application settings and feature flags. Key Vault stores secrets, while Application Insights and Azure Monitor Logs are observability services.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/concept-feature-management"},{"id":"4.1.1-10","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Where should you store sensitive values such as passwords and connection strings rather than in Azure App Configuration?","choices":["Application Insights","A Log Analytics workspace","Azure Key Vault","A feature flag"],"answer":[2],"explanation":"App Configuration complements Key Vault; secrets such as passwords and connection strings belong in Azure Key Vault. Log Analytics and Application Insights hold telemetry, and a feature flag only stores an on or off state.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-11","obj":"4.1.1","difficulty":"medium","type":"single","stem":"What happens to a system-assigned managed identity when its Azure resource is deleted?","choices":["It is moved to Microsoft Entra ID as a user account","It remains and must be deleted manually","It is converted to a user-assigned identity","It is automatically deleted with the resource"],"answer":[3],"explanation":"A system-assigned managed identity shares the resource lifecycle and is automatically deleted when the resource is deleted. Only user-assigned identities have an independent lifecycle; identities are never converted or turned into user accounts.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-12","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Which type of managed identity can be shared across multiple Azure resources?","choices":["User-assigned managed identity","System-assigned managed identity","Local managed identity","Certificate-assigned managed identity"],"answer":[0],"explanation":"A user-assigned managed identity is a standalone resource that can be associated with more than one Azure resource. System-assigned identities are tied to one resource; the other two options are not managed identity types.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-13","obj":"4.1.1","difficulty":"easy","type":"single","stem":"What key benefit does a managed identity provide to an application?","choices":["It encrypts data at rest on the host","It removes the need to store credentials in application code","It centralizes feature flag management","It stores application log queries"],"answer":[1],"explanation":"Managed identities let an app authenticate without any credentials stored in code. Host encryption, feature flags, and log queries are unrelated services and capabilities.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-14","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Against which identity provider does a managed identity authenticate to obtain tokens?","choices":["Azure App Configuration","Azure Key Vault","Microsoft Entra ID","Log Analytics workspace"],"answer":[2],"explanation":"Managed identities are backed by service principals in Microsoft Entra ID and request tokens from it. Key Vault, App Configuration, and Log Analytics are resource services, not identity providers.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-15","obj":"4.1.1","difficulty":"hard","type":"single","stem":"What is a feature flag in Azure App Configuration?","choices":["A managed identity assigned to an app","An encryption key used to protect secrets","A KQL query that returns log results","A variable with a binary on or off state that controls a code block"],"answer":[3],"explanation":"A feature flag is a variable with a binary state of on or off that gates an associated block of code. Encryption keys, KQL queries, and managed identities are unrelated constructs.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/concept-feature-management"},{"id":"4.1.1-16","obj":"4.1.1","difficulty":"easy","type":"single","stem":"What does the abbreviation KQL stand for in Azure Monitor?","choices":["Kusto Query Language","Key Query Layer","Kubernetes Query Language","Kernel Query Logic"],"answer":[0],"explanation":"KQL is the Kusto Query Language used to query Azure Monitor Logs. The other expansions are not real Azure query languages.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-17","obj":"4.1.1","difficulty":"medium","type":"single","stem":"KQL queries run in Log Analytics are best described as which kind of operation?","choices":["Write operations that update log tables","Read-only requests that process data and return results","Commands that delete telemetry","Configuration changes to the workspace"],"answer":[1],"explanation":"KQL queries in Log Analytics are read-only requests that process data and return results. KQL does not write, delete, or reconfigure the workspace; it only reads.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-18","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Where is the log data stored that you query with KQL in Azure Monitor?","choices":["An App Configuration store","An Azure Key Vault","A Log Analytics workspace","A managed identity"],"answer":[2],"explanation":"Azure Monitor Logs are stored in a Log Analytics workspace, which KQL queries retrieve data from. Key Vault, App Configuration, and managed identities do not store queryable log data.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-19","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Which Azure Monitor feature is used to monitor a live application's performance and detect failures?","choices":["Managed identity","Azure Key Vault","Azure App Configuration","Application Insights"],"answer":[3],"explanation":"Application Insights is the Azure Monitor application performance monitoring feature that detects failures and performance issues. Key Vault, App Configuration, and managed identities are security and configuration services, not monitoring tools.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-20","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Application Insights is a feature of which broader Azure service?","choices":["Azure Monitor","Azure Key Vault","Microsoft Entra ID","Azure App Configuration"],"answer":[0],"explanation":"Application Insights is part of Azure Monitor. Key Vault, Microsoft Entra ID, and App Configuration are separate services.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-21","obj":"4.1.1","difficulty":"hard","type":"single","stem":"What is OpenTelemetry in the context of Azure Monitor?","choices":["A managed identity type","A vendor-neutral standard for collecting logs, metrics, and traces","A Key Vault secret format","A KQL keyword for filtering rows"],"answer":[1],"explanation":"OpenTelemetry is a vendor-neutral observability standard for emitting logs, metrics, and traces that Azure Monitor supports. It is not an identity type, a secret format, or a KQL keyword.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-22","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Which value tells an application which Application Insights instance should receive its telemetry?","choices":["A feature flag label","A user-assigned managed identity","The connection string","A Log Analytics KQL query"],"answer":[2],"explanation":"Application Insights identifies the target instance through its connection string. Managed identities, feature flags, and KQL queries do not route telemetry to an instance.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-23","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Which Application Insights capability visually shows how the components of a distributed application interact?","choices":["App Configuration snapshot","Key Vault access policy","Feature manager","Application map"],"answer":[3],"explanation":"The application map in Application Insights shows how systems and components interact. Access policies, feature managers, and snapshots belong to Key Vault and App Configuration.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-24","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Which credential class automatically works both locally during development and with a managed identity when deployed to Azure?","choices":["DefaultAzureCredential","KeyVaultSecretClient","FeatureFlagCredential","KustoQueryCredential"],"answer":[0],"explanation":"DefaultAzureCredential tries several credential types and uses a managed identity when the app runs in Azure. The other names are not real Azure credential classes.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-25","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Which Azure RBAC role grants a managed identity permission to read secrets from a key vault?","choices":["App Configuration Data Reader","Key Vault Secrets User","Log Analytics Reader","Monitoring Contributor"],"answer":[1],"explanation":"The Key Vault Secrets User role grants read access to secrets in a key vault. The other roles apply to App Configuration and Azure Monitor, not Key Vault secret access.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-26","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Which Azure RBAC role lets an app read data from an Azure App Configuration store?","choices":["Log Analytics Contributor","Key Vault Secrets User","App Configuration Data Reader","Managed Identity Operator"],"answer":[2],"explanation":"The App Configuration Data Reader role grants read access to configuration data in an App Configuration store. The other roles apply to Key Vault, Azure Monitor, or identity management.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-27","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Only which object type can be stored in an Azure Key Vault Managed HSM pool?","choices":["Feature flags","Secrets","Certificates","HSM-backed keys"],"answer":[3],"explanation":"A Managed HSM pool supports only HSM-backed keys; it does not store secrets or certificates. Secrets and certificates live in standard vaults, and feature flags live in App Configuration.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-28","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Which context field correlates all telemetry items that belong to the same logical operation in Application Insights?","choices":["operation_Id","secret_Id","feature_flag","workspace_key"],"answer":[0],"explanation":"Every telemetry item shares an operation_Id so items across components can be correlated to one operation. The other names are not Application Insights correlation fields.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-29","obj":"4.1.1","difficulty":"medium","type":"single","stem":"In Azure App Configuration, what is stored so it can be changed without redeploying the application?","choices":["HSM-protected cryptographic keys","Application settings and feature flag states","Distributed trace spans","Managed identity tokens"],"answer":[1],"explanation":"App Configuration externalizes application settings and feature flag states so you can change them without redeploying. Keys belong to Key Vault, and traces and tokens are handled by Azure Monitor and Microsoft Entra ID.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-30","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Which types of telemetry does Application Insights collect for an instrumented application?","choices":["Feature flags and labels","Secrets, keys, and certificates","Logs, metrics, and distributed traces","Role assignments and policies"],"answer":[2],"explanation":"Application Insights collects logs, metrics, and distributed traces. Secrets and keys belong to Key Vault, flags to App Configuration, and role assignments to access control.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-31","obj":"4.1.1","difficulty":"easy","type":"single","stem":"In the Azure Key Vault standard tier, keys are protected in what way?","choices":["Protected by a managed identity","Single-tenant HSM-protected","Stored as plaintext files","Software-protected"],"answer":[3],"explanation":"Standard tier vaults use software-protected keys; HSM-backed keys require the premium tier or Managed HSM. Single-tenant HSM applies to Managed HSM, keys are never plaintext, and managed identities do not protect keys.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-32","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Which Application Insights experience lets you search for and inspect an individual request or transaction end to end?","choices":["Transaction search","Feature manager","Vault access policy","App Configuration replica"],"answer":[0],"explanation":"Transaction search in Application Insights finds a request and shows its complete trace timeline. Feature managers, access policies, and replicas belong to App Configuration and Key Vault.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-33","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Azure Monitor Logs and its KQL engine are built on which underlying technology?","choices":["Azure Key Vault","Azure Data Explorer","Microsoft Entra ID","Azure App Configuration"],"answer":[1],"explanation":"Azure Monitor Logs is based on Azure Data Explorer and uses the same Kusto Query Language. Key Vault, Microsoft Entra ID, and App Configuration are unrelated to the log query engine.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-34","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Key Vault certificate object is built on top of which two other Key Vault objects?","choices":["A feature flag and a key","Two secrets","A key and a secret","A managed identity and a key"],"answer":[2],"explanation":"Creating a certificate in Key Vault also creates an addressable key and secret with the same name. Certificates are not built from two secrets, feature flags, or managed identities.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-35","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Which Azure App Configuration authentication approach is recommended so no credentials are stored in code?","choices":["An anonymous public endpoint","A hard-coded connection string in source","A shared secret in a text file","DefaultAzureCredential with a managed identity"],"answer":[3],"explanation":"Using DefaultAzureCredential with a managed identity avoids storing any credentials in code. Hard-coded strings, secrets in files, and anonymous access all expose or bypass credentials insecurely.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-36","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Which tool in the Azure portal do you use to write and interactively run KQL log queries?","choices":["Log Analytics","Key Vault Explorer","Configuration Explorer","Identity blade"],"answer":[0],"explanation":"Log Analytics is the Azure portal tool for editing and running KQL log queries and analyzing results. The other blades manage Key Vault objects, App Configuration keys, and identities, not log queries.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-37","obj":"4.1.1","difficulty":"easy","type":"single","stem":"With a Key Vault vault access policy, which permission lets a managed identity retrieve a secret value?","choices":["Purge","Get","Encrypt","Backup"],"answer":[1],"explanation":"The Get secret permission allows reading a secret value under the vault access policy model. Purge, Encrypt, and Backup are different operations and do not grant read of a secret value.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-38","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Which environment variable commonly supplies the Application Insights connection string to an app?","choices":["APP_CONFIG_FEATURE_FLAG","AZURE_KEYVAULT_SECRET","APPLICATIONINSIGHTS_CONNECTION_STRING","LOG_ANALYTICS_QUERY"],"answer":[2],"explanation":"Apps read the Application Insights connection string from the APPLICATIONINSIGHTS_CONNECTION_STRING environment variable. The other names are not the standard Application Insights connection variable.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-39","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. calls a third-party API with a sensitive key that must be stored outside the app, rotated on a schedule, and read via a managed identity. Which service?","choices":["Azure App Configuration","Azure Key Vault","Container app environment variables","A Kubernetes ConfigMap"],"answer":[1],"explanation":"Key Vault stores, rotates, and serves secrets via managed identity. App Configuration is for non-secret settings, and env vars or ConfigMaps store the key in plaintext.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-40","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Relecloud runs several services that share feature flags and non-secret settings, changed centrally without a redeploy. Which service?","choices":["Azure App Configuration","Azure Key Vault","Environment variables per service","An appsettings.json file in the image"],"answer":[0],"explanation":"App Configuration centralizes non-secret settings and flags with dynamic refresh. Key Vault is for secrets, and env vars or baked files need a redeploy.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-41","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Southridge Video must surface a secret to an app through its settings without changing code. What should you do?","choices":["Hardcode the secret in the app","Use a Key Vault reference in the app settings","Read it from a committed config file","Embed it in the container image"],"answer":[1],"explanation":"A Key Vault reference in app settings surfaces the secret without code changes. Hardcoding, a committed file, or a baked image all expose the secret.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-42","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys needs an app to authenticate to Key Vault without storing any credentials. What should you use?","choices":["A client secret stored in code","A managed identity","A connection string in the repository","Basic authentication"],"answer":[1],"explanation":"A managed identity authenticates without any stored credential. A code secret, a repo connection string, and basic auth all store credentials.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-43","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Trey Research must turn a feature on and off in production without a redeployment. What should you use?","choices":["A Key Vault secret","A redeploy with the feature enabled","An App Configuration feature flag","A rebuilt image"],"answer":[2],"explanation":"An App Configuration feature flag toggles behavior without redeploying. A Key Vault secret, a redeploy, and a rebuilt image all require a deployment.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-44","obj":"4.1.1","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. must follow a single request end to end across three services to locate added latency. What should you do?","choices":["Read each service's separate logs","Instrument with OpenTelemetry and export traces to Azure Monitor","Enable resource-level metrics on each service","Add console logging to each service"],"answer":[1],"explanation":"OpenTelemetry correlates a single request end-to-end across services. Separate logs, per-resource metrics, and console logging cannot correlate one request.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-45","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Wide World Importers has telemetry already in Application Insights and must find which dependency call is slow. What should you do?","choices":["Re-instrument the app and redeploy","Increase the sampling rate","Write a KQL query against the dependencies table","Add a response-time alert rule"],"answer":[2],"explanation":"A KQL query over the dependencies table finds the slow call from existing telemetry. Re-instrumenting, more sampling, and an alert do not analyze the existing telemetry.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-46","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Wingtip Toys must aggregate request durations over time from logs already in Azure Monitor. What should you do?","choices":["Export the logs to CSV","Read the raw log stream manually","Increase the log retention period","Write a KQL query that uses summarize over time"],"answer":[3],"explanation":"A KQL query with summarize aggregates durations over time. CSV export, manual reading, and longer retention do not aggregate over time.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-47","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank needs to visualize the call topology between components of a distributed app in Application Insights. What should you use?","choices":["The Live Metrics stream","An availability test","The Profiler","The application map"],"answer":[3],"explanation":"The application map visualizes the call topology. Live Metrics, availability tests, and the Profiler do not map the call topology.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-48","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A. Datum Corporation must restrict network access to a key vault so only its virtual network can reach it. What should you do?","choices":["Enable soft delete","Rotate the keys","Add an access policy","Configure a private endpoint and firewall"],"answer":[3],"explanation":"A private endpoint plus firewall restricts network access to the vault. Soft delete, key rotation, and access policies do not restrict the network.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-49","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Alpine Ski House must locate a failing request and its exception across a distributed app in Application Insights. What should you do?","choices":["Restart all services","Enable autoscale","Use transaction search to find the failed request and its exception","Add verbose logging everywhere"],"answer":[2],"explanation":"Transaction search locates the failed request and its exception across services. Restarting, autoscaling, and blind verbose logging do not locate the failed request.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-50","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Bellows College stores a sensitive database connection string that an app must retrieve securely at runtime. Which service?","choices":["Azure App Configuration","Azure Key Vault","An environment variable","A committed config file"],"answer":[1],"explanation":"Key Vault securely stores and serves the sensitive connection string. App Configuration is for non-secret values, and an env var or committed file expose the string.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-51","obj":"4.1.1","difficulty":"hard","type":"single","stem":"At Northwind Traders, a web app running on Azure App Service must read database passwords from an Azure Key Vault that uses Azure RBAC. Following least privilege, which built-in role should you assign to the app's managed identity?","choices":["Key Vault Secrets User","Key Vault Administrator","Key Vault Reader","Key Vault Secrets Officer"],"answer":[0],"explanation":"Key Vault Secrets User grants get and list on secret values, which is exactly what an app needs to read secrets and nothing more. Secrets Officer allows create, update, and delete of secret values (too broad for a reader); Key Vault Reader can read object metadata but not secret values, so the app cannot retrieve the password; Key Vault Administrator manages all objects including purge and is far beyond least privilege.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-52","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A platform engineer at Contoso Pharma must be able to create, update, and delete secrets in a Key Vault that uses Azure RBAC. Which role grants exactly this data-plane capability?","choices":["Key Vault Secrets Officer","Key Vault Secrets User","Key Vault Reader","Key Vault Crypto Officer"],"answer":[0],"explanation":"Key Vault Secrets Officer provides full management of secret values, including create, update, and delete. Secrets User only reads secret values and cannot write them; Key Vault Reader reads metadata only; Crypto Officer manages keys, not secrets.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-53","obj":"4.1.1","difficulty":"medium","type":"single","stem":"An auditor at Fabrikam needs to list secret names and view their properties, such as expiry dates, but must never see secret values. Which Key Vault RBAC role fits?","choices":["Key Vault Reader","Key Vault Secrets Officer","Key Vault Secrets User","Contributor"],"answer":[0],"explanation":"Key Vault Reader grants read access to metadata and properties of vault objects without exposing secret values. Secrets User exposes the actual secret values; Secrets Officer can read and modify values; Contributor is a control-plane role for managing the vault resource and, by default, does not grant data-plane access to secret values.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-54","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Adventure Works configured a Key Vault reference in an App Service app setting. The vault uses Azure RBAC. Which role must the app's managed identity hold so the reference resolves?","choices":["Key Vault Reader","Key Vault Secrets Officer","App Configuration Data Reader","Key Vault Secrets User"],"answer":[3],"explanation":"Key Vault references read secret values, so the identity needs the Key Vault Secrets User role on the vault. Key Vault Reader returns only metadata, so the value cannot be read; App Configuration Data Reader applies to App Configuration, not Key Vault; Secrets Officer works but exceeds least privilege for a read-only reference.","ref":"https://learn.microsoft.com/azure/app-service/app-service-key-vault-references"},{"id":"4.1.1-55","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Tailwind team needs an App Service app to resolve Key Vault references at creation time, before any system-assigned identity exists. What is the recommended approach?","choices":["Store the secret directly in an app setting","Rely on the system-assigned managed identity","Embed a service principal client secret in configuration","Assign a user-assigned managed identity and set keyVaultReferenceIdentity"],"answer":[3],"explanation":"A user-assigned managed identity can be created and granted vault access in advance, then referenced through keyVaultReferenceIdentity so references resolve at creation time. Storing the secret in an app setting defeats the purpose of a reference; the system-assigned identity does not exist yet at creation time; a service principal secret is another credential to store and rotate, which the design aims to avoid.","ref":"https://learn.microsoft.com/azure/app-service/app-service-key-vault-references"},{"id":"4.1.1-56","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Litware uses App Configuration references from an App Service app. Which role should the app's managed identity have on the App Configuration store?","choices":["Key Vault Secrets User","Contributor","App Configuration Data Reader","Reader"],"answer":[2],"explanation":"App Configuration Data Reader grants read access to key-values in the store, which is what an App Configuration reference requires. Key Vault Secrets User targets Key Vault, not App Configuration; Reader is a control-plane role that does not grant data-plane access to key-values; Contributor is broad and control-plane oriented.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-57","obj":"4.1.1","difficulty":"hard","type":"single","stem":"An architect asks how a Key Vault reference stored in Azure App Configuration is resolved at runtime. Which statement is correct?","choices":["App Service decrypts the secret on the platform","Microsoft Entra ID caches and returns the secret","App Configuration retrieves the secret and returns its value","The application reads the secret from Key Vault directly using its own credential"],"answer":[3],"explanation":"App Configuration stores only a reference; the application (via its provider and credential) reads the actual secret from Key Vault directly, so secrets stay with the app. App Configuration never accesses the vault on the app's behalf; App Service does not decrypt vault secrets; Entra ID issues tokens but does not cache and return secret values.","ref":"https://learn.microsoft.com/azure/app-service/app-service-key-vault-references"},{"id":"4.1.1-58","obj":"4.1.1","difficulty":"easy","type":"single","stem":"At Wide World Importers a secret is rotated automatically in Key Vault while its App Configuration reference URI stays unchanged. The app must pick up the new value without restart and independently of the configuration refresh cycle. What should you configure?","choices":["A shorter polling interval on the whole app","A new App Configuration store","An immediate application restart on every rotation","A secret refresh interval on the Key Vault reference"],"answer":[3],"explanation":"App Configuration providers let you set a secret refresh interval (for example SetSecretRefreshInterval) so rotated secrets are reloaded from Key Vault independently of the configuration refresh, without a restart. A shorter app polling interval does not target secret rotation and adds load; restarting on every rotation is disruptive and fragile with automatic rotation; a new store does nothing for rotation.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-59","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A developer at Proseware updates several related key-values in Azure App Configuration and wants the app to reload the whole set exactly once, only after all edits are complete, to avoid reading a half-updated configuration. Which technique achieves this?","choices":["Set the secret refresh interval to one minute","Restart the application after each edit","Monitor every selected key individually for changes","Update a sentinel key after all other changes are done"],"answer":[3],"explanation":"A sentinel key is updated last; the provider watches only that key and reloads all configuration once when it changes, ensuring consistency. Monitoring every key can trigger a reload on each individual edit, risking an inconsistent read; a secret refresh interval targets Key Vault secrets, not this batch-update consistency; restarting is heavy and unnecessary.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-60","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Security at Coho Vineyard requires that a Key Vault be reachable only from an internal virtual network with no exposure to the public internet. Which configuration is the most restrictive and correct?","choices":["Turn on the trusted Microsoft services bypass","Create a private endpoint and disable public network access","Enable a virtual network service endpoint","Add a firewall IP allowlist for the office public IP"],"answer":[1],"explanation":"A private endpoint plus disabling public network access confines data-plane access to the virtual network and blocks all public connections. An IP allowlist still uses the public endpoint; a service endpoint keeps the public endpoint reachable; the trusted services bypass is only an exception for certain Azure services, not a lockdown.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-61","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Margie's Travel enabled the Key Vault firewall and turned on Allow trusted Microsoft services. An Azure DevOps pipeline, which is not on the trusted services list, now fails to reach the vault. What is the correct fix?","choices":["Add a virtual network rule or private endpoint the pipeline agent can use","Rely on the trusted services bypass to cover it","No action is needed because it works automatically","Assign the agent the Key Vault Secrets User role"],"answer":[0],"explanation":"Services not on the trusted list must reach the vault through an allowed network path, such as a self-hosted agent in a virtual network rule or a private endpoint. The trusted services bypass covers only listed services, and Azure DevOps is not one; access is not automatic behind a firewall; assigning an RBAC role addresses authorization, not the network firewall block.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-62","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A workload inside a virtual network gets 403 errors calling Key Vault through a private endpoint, even though RBAC and the private endpoint look correct. What is the most common root cause?","choices":["The secret has expired","The managed identity lacks the Reader role","The FQDN resolves to the public IP instead of the private endpoint IP","Sampling dropped the request telemetry"],"answer":[2],"explanation":"Most 403 errors through a private endpoint are DNS problems: the vault FQDN resolves to the public IP, so traffic hits the public endpoint and the firewall rejects it. An expired secret returns a not-found or specific error, not a firewall 403; the Reader role is unrelated to network access; sampling affects telemetry, not vault connectivity.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-63","obj":"4.1.1","difficulty":"hard","type":"single","stem":"An engineer tries to add the on-premises private range 10.20.0.0/16 to a Key Vault firewall IP rule, but the portal rejects it. Why?","choices":["The Key Vault Secrets Officer role is required first","Only IPv6 ranges are supported","RFC 1918 private address ranges are not allowed in Key Vault IP rules","A vault allows a maximum of 10 IP rules"],"answer":[2],"explanation":"Key Vault IP network rules only accept public IP addresses; private ranges defined in RFC 1918 (10.x, 172.16-31, 192.168.x) are not permitted. No RBAC role changes IP-rule validation; only IPv4 is supported, not IPv6-only; the limit is 1000 IPv4 rules, not 10.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-64","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A single virtual machine app at Blue Yonder must access Key Vault without stored credentials, and the identity should be created and deleted together with the VM. Which identity type fits best?","choices":["Service principal with a certificate","App registration with a client secret","User-assigned managed identity","System-assigned managed identity"],"answer":[3],"explanation":"A system-assigned managed identity is tied to the resource lifecycle and is automatically removed when the VM is deleted, with no credentials to manage. A user-assigned identity has an independent lifecycle and is not deleted with the VM; a service principal certificate and an app registration secret are credentials you must store and rotate.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-65","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Fourth Coffee runs five apps that should all share one identity and one set of RBAC assignments, and the identity must persist even if any single app is deleted. Which identity type should you use?","choices":["A Microsoft Entra security group","User-assigned managed identity","A separate service principal per app","System-assigned managed identity"],"answer":[1],"explanation":"A user-assigned managed identity exists independently, can be attached to many resources, and survives deletion of any individual app, so one role assignment covers all. A system-assigned identity is unique per resource and dies with it; per-app service principals mean credentials to manage and no sharing; a security group does not authenticate a workload to Azure resources.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-66","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A GitHub Actions workflow at Graphic Design Institute must deploy to Azure without storing any client secret in the repository. What should you configure?","choices":["A certificate uploaded to Key Vault","A service principal client secret saved as a GitHub secret","Workload identity federation on a user-assigned managed identity or app registration","A system-assigned managed identity on the GitHub runner"],"answer":[2],"explanation":"Workload identity federation lets a user-assigned managed identity or app registration trust GitHub-issued tokens, so the workflow exchanges them for Azure tokens with no stored secret. A GitHub-hosted runner is outside Azure, so it cannot have an Azure managed identity; a stored client secret is exactly what the requirement forbids; a certificate is still a credential to manage.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-67","obj":"4.1.1","difficulty":"easy","type":"single","stem":"An engineer wants to add a federated identity credential for workload identity federation. On which Azure identity can a federated credential be configured?","choices":["Only identities used inside Azure","A system-assigned managed identity","Any managed identity, system- or user-assigned","A user-assigned managed identity or an app registration"],"answer":[3],"explanation":"Federated identity credentials are supported only on user-assigned managed identities and on app registrations; configuring one on a system-assigned managed identity is not supported. System-assigned identities do not support federated credentials; not every managed identity qualifies; workload identity federation is specifically for workloads outside Azure exchanging external tokens.","ref":"https://learn.microsoft.com/entra/workload-id/workload-identity-federation"},{"id":"4.1.1-68","obj":"4.1.1","difficulty":"medium","type":"single","stem":"When configuring a federated identity credential, which values must match the incoming external token for the trust to work?","choices":["The issuer and subject (plus a configured audience)","A client secret and thumbprint","A resource group and region","A source IP range and port"],"answer":[0],"explanation":"Microsoft Entra ID validates the federated credential's issuer and subject against the external token's iss and sub claims, and the audience is also verified during exchange. Federated credentials avoid client secrets and thumbprints entirely; IP range and port are not part of the trust; resource group and region are unrelated to token validation.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-69","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Code at Humongous Insurance uses DefaultAzureCredential to reach Key Vault. When the app runs in Azure App Service with a managed identity enabled, which credential does the chain use?","choices":["EnvironmentCredential","VisualStudioCredential","ManagedIdentityCredential","InteractiveBrowserCredential"],"answer":[2],"explanation":"In Azure with a managed identity present, DefaultAzureCredential resolves to ManagedIdentityCredential. EnvironmentCredential requires AZURE_CLIENT_ID and related variables; VisualStudioCredential is for local development; InteractiveBrowserCredential requires a user sign-in and is not used server-side.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-70","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Alpine Ski House wants traces, metrics, and logs sent to Application Insights with minimal manual instrumentation, using Microsoft's supported OpenTelemetry distribution. What should you adopt?","choices":["The Log Analytics agent","The Azure Monitor OpenTelemetry Distro","A raw OpenTelemetry SDK with a hand-written exporter","A metric alert rule"],"answer":[1],"explanation":"The Azure Monitor OpenTelemetry Distro is Microsoft's distribution that bundles instrumentation libraries and the Azure Monitor exporter for traces, metrics, and logs with minimal setup. A raw SDK with a custom exporter is more work and not the supported package; the Log Analytics agent collects infrastructure logs, not application traces; a metric alert analyzes data rather than collecting telemetry.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-71","obj":"4.1.1","difficulty":"medium","type":"single","stem":"After adding the Azure Monitor OpenTelemetry Distro, which setting connects the application's telemetry to the correct Application Insights resource?","choices":["A storage account connection string","The subscription ID","The APPLICATIONINSIGHTS_CONNECTION_STRING","The Log Analytics workspace ID"],"answer":[2],"explanation":"The Distro is bound to an Application Insights resource through the APPLICATIONINSIGHTS_CONNECTION_STRING, typically supplied as an environment variable. A subscription ID does not target a specific resource; a workspace ID does not route telemetry through the Distro; a storage connection string is unrelated to Application Insights ingestion.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-72","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A request at Relecloud flows through two microservices, and you must correlate the telemetry end to end in Application Insights. Which standard makes this possible?","choices":["A correlation cookie","The X-Forwarded-For header","W3C Trace Context using the traceparent header","A shared API key header"],"answer":[2],"explanation":"W3C Trace Context propagates a traceparent header carrying the trace and span identifiers, letting Application Insights stitch spans across services. An API key authenticates but does not correlate spans; a cookie is browser session state, not cross-service trace context; X-Forwarded-For records client IPs, not trace context.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-73","obj":"4.1.1","difficulty":"easy","type":"single","stem":"When Application Insights ingests W3C Trace Context, the trace-id from traceparent maps to which Application Insights field?","choices":["Operation_Id","Client_IP","Operation_ParentId","Session_Id"],"answer":[0],"explanation":"The W3C trace-id maps to Operation_Id, which groups all telemetry belonging to the same end-to-end operation. Operation_ParentId maps to the parent span's id, not the trace-id; Session_Id tracks user sessions; Client_IP records the caller address.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-74","obj":"4.1.1","difficulty":"medium","type":"single","stem":"An analyst needs the KQL query language and advanced multi-step logic to raise an alert only when a specific application error pattern appears in logs. Which alert type should be used?","choices":["Log search alert","Activity log alert","Availability test","Metric alert"],"answer":[0],"explanation":"Log search alerts evaluate a KQL query against log data at a set frequency, supporting advanced logic on the returned rows. Metric alerts work on precomputed numeric metrics without KQL; an availability test is synthetic uptime probing, not log evaluation; an activity log alert reacts to resource operations, not application log patterns.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-75","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Southridge Video must be alerted quickly and reliably when a virtual machine stops sending its heartbeat, that is, when data is absent. Which alert type is best suited?","choices":["Metric alert","Prometheus alert","Smart detection alert","Log search alert"],"answer":[0],"explanation":"Metric data is precomputed and near real-time, making metric alerts the best choice for detecting the absence of a signal like a missing heartbeat with fewer misfires. Log search alerts are more latent and are less effective at detecting a lack of data; smart detection targets application anomalies; Prometheus alerts apply to Prometheus metrics stores.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-76","obj":"4.1.1","difficulty":"easy","type":"single","stem":"An operations team at Trey Research must be notified when someone deletes a resource, an auditable control-plane operation. Which alert type should they configure?","choices":["Availability test","Activity log alert","Metric alert","Log search alert"],"answer":[1],"explanation":"Activity log alerts fire on Azure Resource Manager operations such as create, delete, and restart, which is exactly resource auditing. Metric alerts watch numeric metrics, not management operations; a log search alert would require ingesting activity data and KQL and is not the native fit; an availability test probes endpoints.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-77","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A team asks why a metric alert is preferred over a log search alert for near real-time detection of missing telemetry. What is the correct reason?","choices":["Metric data is precomputed and has lower latency than semi-structured logs","Metric alerts support KQL for complex logic","Log search alerts are always stateless","Log queries are always cheaper to run"],"answer":[0],"explanation":"Metrics are stored precomputed, so metric alerts evaluate with low latency and are less prone to the ingestion delay that makes log alerts misfire on absent data. Cost varies and is not the reason; log search alerts can be stateful or stateless; KQL is a strength of log alerts, not metric alerts.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-78","obj":"4.1.1","difficulty":"hard","type":"single","stem":"In Log Analytics, you must count the number of requests grouped into one-hour buckets across a day. Which KQL fragment is correct?","choices":["order by timestamp desc","summarize count() by bin(timestamp, 1h)","join requests on timestamp","where count > 0"],"answer":[1],"explanation":"summarize with an aggregate and bin(timestamp, 1h) groups rows into fixed one-hour time buckets and counts them. join combines two tables and does not aggregate one; order by only sorts rows; where filters rows and does not group or count.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-79","obj":"4.1.1","difficulty":"easy","type":"single","stem":"An engineer must correlate the requests table with the exceptions table on operation_Id in KQL. Which operator does this?","choices":["union","mv-expand","join","summarize"],"answer":[2],"explanation":"join combines rows from two tables based on matching values in a key column such as operation_Id. union stacks rows from tables without matching keys; summarize aggregates a single table; mv-expand expands a dynamic array into rows and does not correlate tables.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-80","obj":"4.1.1","difficulty":"medium","type":"single","stem":"You want to visualize average request duration over time as a line chart directly from a KQL query. Which fragment completes the query?","choices":["distinct duration","summarize avg(duration) by bin(timestamp, 5m) | render timechart","take 100","project duration, timestamp"],"answer":[1],"explanation":"Aggregating by a time bin and piping to render timechart produces the time series line chart. project only selects columns; take returns an arbitrary sample of rows; distinct returns unique values and does not chart a series over time.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-81","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A KQL query must return the 10 slowest requests by duration. Which fragment is correct?","choices":["order by duration desc | take 10","summarize max(duration)","distinct duration","where duration > 10"],"answer":[0],"explanation":"Sorting descending by duration and taking 10 returns the ten slowest rows with their full detail. summarize max returns only a single aggregate value; where duration > 10 filters by a threshold, not a top-N ranking; distinct returns unique values, losing the row detail.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-82","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Which KQL operator groups rows and computes aggregate values such as counts and averages per group?","choices":["where","summarize","extend","project"],"answer":[1],"explanation":"summarize aggregates rows into groups and computes aggregate functions like count() and avg(). project selects or renames columns; extend adds a calculated column to each row; where filters rows by a predicate.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-83","obj":"4.1.1","difficulty":"medium","type":"single","stem":"In a KQL time series query, what does bin(timestamp, 1h) accomplish?","choices":["It sorts results by time","It joins two tables on time","It renders a chart","It rounds each timestamp down into fixed one-hour intervals for grouping"],"answer":[3],"explanation":"bin() rounds values down to a multiple of the given size, creating fixed time buckets that summarize can group by. Joining is done by join; sorting is done by order by; charting is done by render, not by bin.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-84","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A team must see a topology view of application components, their dependencies, and failure rates in Application Insights. Which feature should they open?","choices":["Metrics explorer","Application map","Transaction search","Availability tests"],"answer":[1],"explanation":"The application map visualizes components and their dependencies with health, call volumes, and failure rates. Transaction search inspects individual telemetry items; availability tests probe uptime; metrics explorer charts numeric metrics but does not draw the dependency topology.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-85","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A developer needs to locate one failed request and inspect its end-to-end transaction, including correlated dependencies and exceptions. Which Application Insights feature is designed for this?","choices":["Application map","Live Metrics","Transaction search and end-to-end transaction details","Availability tests"],"answer":[2],"explanation":"Transaction search finds individual operations and opens the end-to-end transaction details view showing correlated telemetry. The application map shows aggregate topology, not a single transaction; availability tests are synthetic probes; Live Metrics streams near-real-time counters but is not for searching a specific past transaction.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-86","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank wants to monitor whether a public endpoint responds correctly from several worldwide locations, without modifying the application. Which Application Insights capability fits?","choices":["A metric alert on CPU","Adaptive sampling","The application map","A standard availability test"],"answer":[3],"explanation":"Standard availability tests send recurring synthetic web requests from multiple global locations to any public HTTP or HTTPS endpoint, with no app changes required. The application map visualizes topology, not uptime probing; sampling reduces telemetry volume; a CPU metric alert monitors a resource metric, not external endpoint availability.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-87","obj":"4.1.1","difficulty":"hard","type":"single","stem":"An Application Insights resource at VanArsdel is generating far more telemetry than needed, driving up cost. Which feature reduces volume while preserving statistically valid analysis and keeping related items together?","choices":["Adding more availability tests","Disabling Application Insights","Sampling","Increasing data retention"],"answer":[2],"explanation":"Sampling is the recommended way to reduce telemetry traffic and cost while retaining related items and statistically correct metrics. Disabling Application Insights loses all telemetry; increasing retention raises cost and stores more, not less; more availability tests add telemetry rather than reducing it.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-88","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A legacy app uses an SDK version that does not support sampling, yet its Application Insights resource keeps exceeding the monthly quota. Which sampling type can be applied without redeploying the app?","choices":["Client-side sampling","Adaptive sampling","Fixed-rate sampling","Ingestion sampling"],"answer":[3],"explanation":"Ingestion sampling happens at the Application Insights service endpoint, so you set the rate in the portal without changing or redeploying the app. Adaptive and fixed-rate sampling operate in the SDK and require a supported SDK and redeploy; client-side sampling still depends on SDK support and a code change.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-89","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A team needs synchronized client and server sampling so they can navigate between related page views and their server requests during diagnostics. Which sampling type should they choose?","choices":["Fixed-rate sampling","No sampling","Adaptive sampling","Ingestion sampling"],"answer":[0],"explanation":"Fixed-rate sampling synchronizes the client and server on the same rate so related page views and requests are retained together for navigation. Adaptive sampling adjusts server volume automatically and is not synchronized with the browser; ingestion sampling occurs at the endpoint after collection and does not coordinate client and server; no sampling defeats the cost goal.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-90","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Which sampling method is enabled by default in the ASP.NET Core Application Insights SDK?","choices":["Tail-based sampling","Adaptive sampling","Fixed-rate sampling","Ingestion sampling"],"answer":[1],"explanation":"Adaptive sampling is the default in the ASP.NET and ASP.NET Core SDKs, automatically adjusting server-side telemetry volume. Fixed-rate sampling must be configured explicitly; ingestion sampling is set in the portal and only applies when SDK sampling is not active; tail-based sampling is not the SDK default.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-91","obj":"4.1.1","difficulty":"easy","type":"single","stem":"An application at Fabrikam must store a database connection string securely and retrieve it at runtime, never keeping it in source or plaintext configuration. Which service is designed for this?","choices":["Azure Key Vault","Azure App Configuration","An environment variable baked into the container image","A plaintext app setting"],"answer":[0],"explanation":"Azure Key Vault is the secret store for sensitive values like connection strings, retrieved securely at runtime by a managed identity. App Configuration is for non-secret settings, so it is the wrong store for a secret; a plaintext app setting exposes the value; baking the secret into an image is insecure and hard to rotate.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-92","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Contoso wants to turn a new checkout feature on or off in production without redeploying the app. Which service provides this natively?","choices":["Azure Monitor alerts","Azure App Configuration feature flags","Azure Key Vault","Application Insights"],"answer":[1],"explanation":"Azure App Configuration provides feature flags (feature management) that toggle features at runtime without redeploying. Key Vault stores secrets, not feature toggles; Application Insights observes telemetry; Azure Monitor alerts notify on conditions and do not gate features.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-93","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A microservices platform at Lucerne Publishing needs centralized, non-secret application settings shared across many services, with dynamic refresh at runtime. Which store is the right fit?","choices":["An Azure Storage table","Azure App Configuration","Azure Key Vault","Local appsettings.json in each service"],"answer":[1],"explanation":"Azure App Configuration centralizes non-secret settings for many apps and supports dynamic refresh without redeploy. Key Vault is optimized for secrets, not general settings, and is costlier and slower for that use; local appsettings.json is not centralized or dynamically refreshed; a storage table is not a configuration provider with refresh semantics.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-94","obj":"4.1.1","difficulty":"easy","type":"single","stem":"You must store a TLS certificate together with its private key so applications can retrieve it securely at runtime. Which service should hold it?","choices":["A plaintext App Service app setting","Azure App Configuration","Azure Key Vault","Azure Blob Storage"],"answer":[2],"explanation":"Azure Key Vault manages certificates, including their private keys, and supports secure retrieval and rotation. App Configuration stores non-secret settings and references, not certificate private keys; Blob Storage does not provide secret-grade key protection or rotation; a plaintext app setting exposes the private key.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-95","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Only the App Service app, and no human administrator, should be able to read a secret's value, while operators still manage the app. Which pattern enforces this separation?","choices":["Grant all operators Key Vault Secrets Officer","Store the secret in Key Vault and grant only the app's managed identity Key Vault Secrets User","Embed the secret in the deployment pipeline variables","Store the secret as a plaintext app setting"],"answer":[1],"explanation":"Moving the secret into Key Vault and granting only the app's managed identity Key Vault Secrets User lets operators manage the ap
