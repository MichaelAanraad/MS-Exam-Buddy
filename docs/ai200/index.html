<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-200 Exam Buddy</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6573; --line: #dde1e6;
  --accent: #0b63ce; --accent-text: #ffffff; --ok: #1a7f37; --ok-bg: #e6f4ea; --bad: #c62828; --bad-bg: #fdecea;
  --code-bg: #f0f2f5; --chip: #eef2f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
    --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
    --code-bg: #0c0f13; --chip: #242a32;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
  --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
  --code-bg: #0c0f13; --chip: #242a32;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; overflow-wrap: anywhere; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.muted { color: var(--muted); font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
label.opt { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
legend { font-weight: 600; margin-bottom: 8px; }
button, select { font: inherit; }
button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button.sm { padding: 2px 9px; font-weight: 500; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, .choice:focus-within, select:focus-visible, .tile:focus-visible, .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); max-width: 100%; }
pre select { font: inherit; padding: 0 4px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
.chip.easy { color: var(--ok); } .chip.hard { color: var(--bad); } .chip.clock { color: var(--text); font-weight: 600; }
.stem p { margin: 0 0 10px; }
pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; overflow-wrap: normal; font-size: .85rem; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0; cursor: pointer; }
.choice input { margin-top: 4px; }
.correct { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
.wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.why { font-size: .9rem; color: var(--muted); margin-top: 4px; }
.verdict { font-weight: 700; margin: 12px 0 4px; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.bar > div { height: 100%; background: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { min-width: 64px; }
table.yn td:not(:first-child), table.yn th:not(:first-child) { text-align: center; width: 56px; }
.big { font-size: 2.2rem; font-weight: 700; }
a { color: var(--accent); }
.lbl { font-weight: 600; margin: 14px 0 6px; }
.dd { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .dd { grid-template-columns: 1fr; } }
.zone { min-height: 60px; border: 1px dashed var(--line); border-radius: 10px; padding: 6px; background: var(--bg); }
.pool.flat { display: flex; flex-wrap: wrap; gap: 6px; }
.pool.flat .tile { margin: 0; }
.tile { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--card); cursor: grab; }
.tile.sel { outline: 2px solid var(--accent); }
.tile .num { font-weight: 600; flex: none; }
.tile .txt { flex: 1; }
.tools { display: flex; gap: 4px; flex: none; }
.slot { min-height: 40px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px; cursor: pointer; background: var(--bg); }
.case { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; background: var(--bg); }
.case summary { cursor: pointer; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.case-body { max-height: 55vh; overflow: auto; }
.case-body p { margin: 0 0 10px; }
.note { border-left: 4px solid var(--accent); padding: 8px 12px; background: var(--chip); border-radius: 6px; margin-bottom: 12px; font-size: .9rem; }
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.rv button { text-align: left; font-weight: 500; }

</style>
</head>
<body>
<main>
  <header>
    <h1>AI-200 Exam Buddy</h1>
    <button class="ghost" id="theme" type="button" aria-label="Toggle light/dark theme">Theme</button>
  </header>
  <div id="banner"></div>
  <div id="app"></div>
  <p class="muted">Questions based on the official AI-200 study guide (Developing AI Cloud Solutions on Azure). Not real exam questions.</p>
</main>
<script>
const DATA = {"exam":{"id":"AI-200","title":"Developing AI Cloud Solutions on Azure","notice":"","contentDate":"2026-11"},"domains":{"1":{"title":"Containerized solutions","weight":"20-25%"},"2":{"title":"Data services for AI","weight":"25-30%"},"3":{"title":"Connect & consume services","weight":"20-25%"},"4":{"title":"Secure, monitor & troubleshoot","weight":"20-25%"}},"objectives":{"1.1.1":"Containerized solutions","2.1.1":"Data services for AI","3.1.1":"Connect & consume services","4.1.1":"Secure, monitor & troubleshoot"},"questions":[{"id":"1.1.1-01","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which Azure service runs containers as a fully managed, serverless platform with no cluster to manage?","choices":["Azure Container Apps","Azure Virtual Machines","Azure Blob Storage","Azure DNS"],"answer":[0],"explanation":"Container Apps is the managed serverless container platform. Virtual Machines make you manage the OS, Blob Storage holds files, and DNS resolves names.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-02","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which service stores and versions private container images?","choices":["Azure Container Registry","Azure Key Vault","Azure Monitor","Azure CDN"],"answer":[0],"explanation":"Container Registry is the managed private image registry. Key Vault holds secrets, Monitor collects telemetry, and the CDN caches content.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-03","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Which service runs small pieces of code on a trigger without managing servers?","choices":["Azure Functions","Azure Virtual Machines","Azure Blob Storage","Azure DNS"],"answer":[0],"explanation":"Functions runs event-triggered code serverlessly. VMs are servers you manage, Blob Storage stores data, and DNS resolves names.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-04","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which service gives you full control of a Kubernetes cluster and its API?","choices":["Azure Kubernetes Service","Azure Container Apps","Azure App Service","Azure Functions"],"answer":[0],"explanation":"AKS exposes the full Kubernetes API and control plane. Container Apps and App Service abstract the cluster, and Functions runs code, not clusters.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-05","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which registry feature serves images with low latency in multiple regions?","choices":["Geo-replication","The admin user","A webhook","A retention policy"],"answer":[0],"explanation":"Geo-replication places the registry in multiple regions. The admin user is a login, webhooks notify, and retention deletes old images.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-06","obj":"1.1.1","difficulty":"hard","type":"single","stem":"How does a container app scale to zero when idle?","choices":["A scale rule that allows a minimum of zero replicas","Deleting the app nightly","Pausing the subscription","Lowering the DNS TTL"],"answer":[0],"explanation":"A scale rule with a zero minimum lets the app scale to zero. Deleting, pausing billing, and DNS changes are not scaling mechanisms.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-07","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which option deploys an app to AKS declaratively?","choices":["Applying a manifest file with kubectl","Copying files over FTP","Emailing a ZIP to the cluster","Editing the DNS zone"],"answer":[0],"explanation":"kubectl apply of a manifest is the declarative deploy. FTP, email, and DNS edits do not deploy Kubernetes workloads.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-08","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Contoso Ltd. needs a managed Azure service to store and manage its private container images and related artifacts. Which service provides this?","choices":["Azure Container Apps","Azure Kubernetes Service","Azure Container Registry","Azure App Service"],"answer":[2],"explanation":"Azure Container Registry is the managed registry service for storing and managing private container images and artifacts. Container Apps, Azure Kubernetes Service, and App Service run containers but do not act as an image registry.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-09","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Fabrikam Inc. wants a fully managed, serverless platform for running microservices and containerized jobs without managing orchestration. Which service fits?","choices":["Azure Kubernetes Service","Azure Container Apps","Azure App Service","Azure Container Registry"],"answer":[1],"explanation":"Azure Container Apps is a fully managed serverless container service for microservices and jobs without managing infrastructure. Azure Kubernetes Service requires cluster management, App Service targets web apps, and Container Registry only stores images.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-10","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which Azure service provides fully managed Kubernetes with direct access to the Kubernetes API?","choices":["Azure Kubernetes Service","Azure Container Apps","Azure App Service","Azure Container Instances"],"answer":[0],"explanation":"Azure Kubernetes Service provides a managed Kubernetes platform with direct access to the Kubernetes API and control plane. Container Apps hides the Kubernetes API, and App Service and Container Instances are not Kubernetes platforms.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-11","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Adventure Works Cycles wants a fully managed service optimized for hosting HTTP-based web apps and APIs as containers. Which service is the best fit?","choices":["Azure Container Registry","Azure Kubernetes Service","Azure Container Instances","Azure App Service"],"answer":[3],"explanation":"Azure App Service (Web App for Containers) is optimized for hosting HTTP-based web apps and APIs, including containerized ones. Container Registry only stores images, and AKS and Container Instances are not optimized specifically for web app hosting.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-12","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Which open-source technology powers event-driven autoscaling in Azure Container Apps?","choices":["Dapr","Envoy","KEDA","Helm"],"answer":[2],"explanation":"Azure Container Apps uses KEDA (Kubernetes Event-driven Autoscaling) for scaling based on events and metrics. Dapr provides microservice APIs, Envoy is the ingress proxy, and Helm packages Kubernetes applications.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-13","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which Azure CLI command uses ACR Tasks to build a container image in the cloud?","choices":["az acr login","az acr create","az acr build","az acr import"],"answer":[2],"explanation":"The az acr build command runs an ACR Tasks quick task that builds the image natively in the cloud. az acr login authenticates, az acr create makes a registry, and az acr import copies existing images.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-14","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which service lets you build Kubernetes-style apps but does NOT expose direct access to the underlying Kubernetes APIs?","choices":["Azure Container Apps","Azure Kubernetes Service","Azure Container Instances","Azure App Service"],"answer":[0],"explanation":"Container Apps is powered by Kubernetes but does not provide direct access to the Kubernetes APIs or control plane. AKS exposes the Kubernetes API directly, while Container Instances and App Service are not Kubernetes-style platforms.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-15","obj":"1.1.1","difficulty":"hard","type":"single","stem":"In Azure Kubernetes Service, which component does Azure fully manage and provide at no cost in the Free tier?","choices":["Agent nodes","Control plane","User node pool","System node pool"],"answer":[1],"explanation":"Azure provides and manages the AKS control plane as a managed resource at no cost in the Free tier. Agent nodes, user node pools, and system node pools are customer-managed VMs that incur compute charges.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-16","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Northwind Traders wants built-in revisions and traffic splitting to run blue/green and A/B deployments without extra tooling. Which service provides this natively?","choices":["Azure Container Registry","Azure Container Apps","Azure Container Instances","Azure Kubernetes Service"],"answer":[1],"explanation":"Azure Container Apps natively supports multiple revisions and traffic splitting for blue/green and A/B scenarios. Container Registry only stores images, Container Instances lacks these app concepts, and AKS needs added tooling.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-17","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which service can run containerized jobs on demand, on a schedule, or based on events in a serverless way?","choices":["Azure App Service","Azure Kubernetes Service","Azure Container Registry","Azure Container Apps"],"answer":[3],"explanation":"Azure Container Apps supports jobs that run on demand, on a schedule, or based on events. App Service hosts web apps, AKS requires cluster management, and Container Registry only stores images.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-18","obj":"1.1.1","difficulty":"hard","type":"single","stem":"What is the login server domain suffix for an Azure Container Registry named myregistry?","choices":["azurecr.io","azurewebsites.net","azurecontainer.io","cloudapp.azure.com"],"answer":[0],"explanation":"An Azure Container Registry uses a login server of the form myregistry.azurecr.io. azurewebsites.net is App Service, azurecontainer.io is Container Instances, and cloudapp.azure.com is other Azure endpoints.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-19","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which Azure service offers native, managed integration with Dapr for building microservices?","choices":["Azure Container Apps","Azure App Service","Azure Container Registry","Azure Container Instances"],"answer":[0],"explanation":"Azure Container Apps provides a managed version of Dapr for microservice patterns such as state and service invocation. App Service, Container Registry, and Container Instances do not provide built-in managed Dapr integration.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-20","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which service provides a single pod of containers on demand as a lower-level building block, without built-in scaling, load balancing, or certificates?","choices":["Azure Container Apps","Azure Kubernetes Service","Azure Container Instances","Azure App Service"],"answer":[2],"explanation":"Azure Container Instances provides a single pod of containers on demand and does not include scaling, load balancing, or certificates. Container Apps, AKS, and App Service all add higher-level application features on top of containers.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-21","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Trey Research wants to run event-driven, ephemeral functions using a Functions-as-a-Service programming model. Which service is the ideal option?","choices":["Azure Container Apps","Azure Functions","Azure Kubernetes Service","Azure App Service"],"answer":[1],"explanation":"Azure Functions is a serverless Functions-as-a-Service option optimized for event-driven, ephemeral functions. Container Apps, AKS, and App Service are container or web hosting platforms, not FaaS-first services.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-22","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which authentication method lets an Azure resource access Azure Container Registry without storing any credentials in code?","choices":["Admin account","Managed identity","Docker login with a password","Repository-scoped token"],"answer":[1],"explanation":"A Microsoft Entra managed identity authenticates to the registry without needing credentials stored in code. The admin account, docker password login, and repository-scoped tokens all rely on stored credentials.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-23","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which Azure Container Registry feature can automatically rebuild an application image when its base image is patched?","choices":["ACR Tasks","Geo-replication","Webhooks","Content trust"],"answer":[0],"explanation":"ACR Tasks supports automated builds triggered by base image updates, such as OS or framework patches. Geo-replication copies images, webhooks send notifications, and content trust signs image tags.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-24","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines needs direct kubectl access and full control over cluster configuration and operations. Which service should the team choose?","choices":["Azure Container Apps","Azure Kubernetes Service","Azure App Service","Azure Container Registry"],"answer":[1],"explanation":"AKS gives direct access to the Kubernetes API and full control over cluster configuration and operations. Container Apps hides the Kubernetes API, App Service targets web apps, and Container Registry only stores images.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-25","obj":"1.1.1","difficulty":"easy","type":"single","stem":"An existing Azure App Service team wants the simplest way to host a single containerized website. Which service should they choose?","choices":["Azure App Service","Azure Kubernetes Service","Azure Container Instances","Azure Container Registry"],"answer":[0],"explanation":"App Service (Web App for Containers) is the simplest managed option for hosting containerized web apps. AKS adds cluster overhead, Container Instances lacks web app features, and Container Registry only stores images.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-26","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Azure Container Registry is a managed registry service based on which open-source platform?","choices":["Kubernetes","Podman","containerd","Docker"],"answer":[3],"explanation":"Azure Container Registry is a managed registry service based on the open-source Docker platform. Kubernetes orchestrates containers, and Podman and containerd are container runtimes, not the registry basis.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-27","obj":"1.1.1","difficulty":"hard","type":"single","stem":"In Azure App Service, containerized web apps are grouped into which logical compute boundary?","choices":["Node pool","Container Apps environment","App Service plan","Resource group"],"answer":[2],"explanation":"App Service groups applications into an App Service plan, which defines the allocated compute for those apps. Node pools belong to AKS, the Container Apps environment belongs to Container Apps, and a resource group is generic.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-28","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which service uses immutable revisions as snapshots of a container app for lifecycle management?","choices":["Azure App Service","Azure Kubernetes Service","Azure Container Instances","Azure Container Apps"],"answer":[3],"explanation":"Azure Container Apps uses revisions, which are immutable snapshots of a container app. App Service, AKS, and Container Instances do not use the Container Apps revision concept.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-29","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which service can automatically scale container replicas to zero when the application is idle to avoid usage charges?","choices":["Azure Kubernetes Service","Azure Container Apps","Azure App Service","Azure Container Registry"],"answer":[1],"explanation":"Azure Container Apps can scale most applications to zero replicas when idle, and you incur no usage charges at zero. AKS and App Service keep compute running by default, and Container Registry only stores images.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-30","obj":"1.1.1","difficulty":"hard","type":"single","stem":"In an Azure Kubernetes Service cluster, which node pool hosts critical system pods such as CoreDNS?","choices":["System node pool","User node pool","Control plane","Virtual node"],"answer":[0],"explanation":"Every AKS cluster needs at least one system node pool, which hosts critical system pods such as CoreDNS. User node pools host workloads, the control plane is managed by Azure, and virtual nodes are an ACI-backed add-on.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-31","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which Azure service is described as powered by Kubernetes and open-source technologies including Dapr, KEDA, and Envoy?","choices":["Azure Kubernetes Service","Azure App Service","Azure Container Instances","Azure Container Apps"],"answer":[3],"explanation":"Azure Container Apps is powered by Kubernetes and open-source technologies such as Dapr, KEDA, and Envoy. AKS is Kubernetes itself, and App Service and Container Instances are not built on that specific stack.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-32","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which Azure CLI command signs the Docker client in to an Azure Container Registry?","choices":["az acr build","az acr repository list","az acr create","az acr login"],"answer":[3],"explanation":"The az acr login command authenticates the Docker client to the container registry. az acr build builds images, az acr repository list lists repositories, and az acr create creates a registry.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-33","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Which service lets Wide World Importers store both Windows and Linux container images in a single private registry?","choices":["Azure Container Apps","Azure App Service","Azure Functions","Azure Container Registry"],"answer":[3],"explanation":"Azure Container Registry can hold both Windows and Linux images in a private registry. Container Apps, App Service, and Functions run containers but are not image registries.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-34","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Which capability is available only in the Azure Container Registry Premium tier?","choices":["Webhooks","Private link with private endpoints","Image deletion","Microsoft Entra authentication"],"answer":[1],"explanation":"Private link with private endpoints to restrict registry access is a Premium-tier feature. Webhooks, image deletion, and Microsoft Entra authentication are available in Basic and Standard tiers too.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-35","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Which service provides built-in HTTPS ingress through an Envoy proxy without requiring you to manage other Azure networking resources?","choices":["Azure Container Registry","Azure Container Instances","Azure Kubernetes Service","Azure Container Apps"],"answer":[3],"explanation":"Azure Container Apps provides built-in HTTPS ingress using an Envoy proxy without extra networking resources. Container Registry stores images, Container Instances lacks built-in ingress, and AKS requires configuring ingress.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-36","obj":"1.1.1","difficulty":"hard","type":"single","stem":"City Power & Light needs to run any Kubernetes workload and manage its own node pools and cluster operations. Which service should it use?","choices":["Azure Container Apps","Azure Container Instances","Azure Kubernetes Service","Azure App Service"],"answer":[2],"explanation":"AKS runs any Kubernetes workload and lets you manage your own node pools and cluster operations. Container Apps and App Service abstract orchestration, and Container Instances is a single-pod building block.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-37","obj":"1.1.1","difficulty":"easy","type":"single","stem":"In a standard Azure Kubernetes Service cluster, which resources does the customer fully manage and pay for?","choices":["Control plane","etcd","API server","Agent nodes"],"answer":[3],"explanation":"Customers fully manage and pay for the agent (worker) nodes attached to the AKS cluster. The control plane, etcd, and API server are Azure-managed control plane components.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-38","obj":"1.1.1","difficulty":"medium","type":"single","stem":"An ACR Tasks quick task started with az acr build builds container images where?","choices":["On your local Docker daemon","On an AKS node pool","In the cloud within Azure","In Azure Container Instances"],"answer":[2],"explanation":"ACR Tasks builds images natively in the cloud close to the registry, with no local Docker required. It does not use your local daemon, an AKS node pool, or Container Instances to perform the build.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-39","obj":"1.1.1","difficulty":"hard","type":"single","stem":"A. Datum Corporation needs a fully managed platform for an AI microservices app, with built-in revision traffic splitting and scale-to-zero, without managing the Kubernetes control plane. Which service should you use?","choices":["Azure Kubernetes Service (AKS)","Azure App Service","Azure Container Apps","Azure Container Instances"],"answer":[2],"explanation":"Container Apps is fully managed and serverless with revisions and scale-to-zero. AKS makes you run the control plane, and App Service and Container Instances lack revision traffic-splitting with scale-to-zero.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-40","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines needs a managed private registry to store, tag, and version its container images. Which service should you use?","choices":["Azure Container Registry","Azure Blob Storage","An Azure Artifacts feed","The Docker Hub public registry"],"answer":[0],"explanation":"Container Registry is the managed private registry with tagging and versioning. Blob Storage holds files, an Artifacts feed is for packages, and Docker Hub is public.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-41","obj":"1.1.1","difficulty":"medium","type":"single","stem":"City Power & Light needs a container image to rebuild automatically whenever its base image is updated. What should you use?","choices":["An ACR task with a source-commit trigger","An ACR task with a base-image-update trigger","A manual az acr build run","A scheduled timer task"],"answer":[1],"explanation":"A base-image-update trigger rebuilds when the base image changes. A source-commit trigger fires on code changes, and manual builds or timers do not react to the base image.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-42","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Coho Winery deploys a container to Azure App Service and must supply a sensitive value without baking it into the image. What should you use?","choices":["An App Service setting with a Key Vault reference","An ENV line in the Dockerfile","A value read from a committed config file","A value hardcoded in the application"],"answer":[0],"explanation":"A Key Vault reference in app settings injects the secret without baking it in. A Dockerfile ENV, a committed file, and hardcoding all place the secret in the image or source.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-43","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. needs to release a new revision of a container app, send 10 percent of traffic to it, and roll back instantly. What should you use?","choices":["Container Apps revisions with traffic splitting","A KEDA scale rule","A Dapr sidecar","An external ingress change"],"answer":[0],"explanation":"Revisions with traffic splitting give canary rollout and instant rollback. Scale rules, Dapr, and ingress changes do not version or weight traffic.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-44","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. must scale a Container Apps job on the number of messages in a Service Bus queue and scale to zero when idle. What should you use?","choices":["A CPU-based autoscale rule","A fixed replica count","A scheduled autoscale rule","A KEDA scale rule on the queue length"],"answer":[3],"explanation":"KEDA scales on queue length and to zero. CPU rules, fixed counts, and schedules cannot react to queue depth.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-45","obj":"1.1.1","difficulty":"hard","type":"single","stem":"First Up Consultants needs to deploy an application to AKS declaratively. What should you use?","choices":["A kubectl apply of a manifest file","An az acr build command","A local docker run command","An az container create command"],"answer":[0],"explanation":"kubectl apply of a manifest is the declarative AKS deploy. az acr build makes an image, docker run is local, and az container create targets Container Instances.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-46","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee finds AKS pods that cannot reach a dependent service. What should you do first?","choices":["Increase the node count","Run kubectl describe on the pod to view events","Restart the cluster","Raise the pod CPU limit"],"answer":[1],"explanation":"kubectl describe surfaces the events needed to diagnose first. Adding nodes, restarting, or raising CPU acts before you know the cause.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-47","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Graphic Design Institute needs to find why a Container Apps revision keeps failing to start. What should you do?","choices":["Increase the minimum replica count","Switch ingress to external","Query the Container Apps logs in Log Analytics","Add a new revision"],"answer":[2],"explanation":"The Container Apps logs in Log Analytics reveal the startup failure. More replicas, external ingress, and a new revision do not reveal the startup error.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-48","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Humongous Insurance needs direct Kubernetes API access, custom node pools, and a service mesh. Which service should you use?","choices":["Azure Container Apps","Azure Kubernetes Service (AKS)","Azure App Service","Azure Container Instances"],"answer":[1],"explanation":"Only AKS exposes the Kubernetes API, node pools, and a service mesh. Container Apps, App Service, and Container Instances hide the Kubernetes API.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-49","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Lamna Healthcare Company needs low-latency image pulls for the same registry in three regions. What should you do?","choices":["Geo-replicate the registry across regions","Enable the registry admin user","Configure a registry webhook","Add an image retention policy"],"answer":[0],"explanation":"Geo-replication serves low-latency pulls from each region. The admin user is a login, webhooks notify, and retention deletes images.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-50","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Litware, Inc. must provide a secret to a container app so the container can read it at runtime. What should you use?","choices":["An ENV entry in the Dockerfile","A value committed to the repository","A plain environment variable in the manifest","A Container Apps secret referenced by the container"],"answer":[3],"explanation":"A Container Apps secret stores the value encrypted and is referenced at runtime. A Dockerfile ENV, a committed value, and a plaintext env var expose the secret.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-51","obj":"1.1.1","difficulty":"hard","type":"single","stem":"City Power & Light keeps a base image and an application image in one Premium Azure Container Registry. They create an ACR task so the application image rebuilds automatically whenever the base image is patched with OS updates. For the base image update trigger to fire, what must be true of the base image tag?","choices":["The base image must use a unique version tag for every rebuild","The base image must use a stable tag such as node:15-alpine that is reused across patches","The base image must reside in Docker Hub rather than in the registry","The base image must be signed with content trust"],"answer":[1],"explanation":"ACR Tasks only fires a base image update trigger when the base image is referenced by a stable tag that is reused as it is patched, so the FROM reference resolves to the new content. A unique version tag per rebuild does not trigger the task, because the application Dockerfile still points at the old tag. A Docker Hub location is allowed but is not required and only gets polled every 10 to 60 minutes. Content trust signing is unrelated to base image update triggers.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-52","obj":"1.1.1","difficulty":"easy","type":"single","stem":"A developer at Contoso Ltd. must build a container image from a Dockerfile and push it to Azure Container Registry from a build agent that has no Docker Engine installed. Which command accomplishes this?","choices":["az acr import to copy an existing image into the registry","az acr build --registry <name> --image <image>:<tag> .","docker build followed by docker push from the agent","az acr repository update to publish the image"],"answer":[1],"explanation":"az acr build runs an ACR Tasks quick task that builds the image in the cloud and pushes it, with no local Docker daemon required. az acr import copies an already-built image between registries and does not build from a Dockerfile. docker build requires a local Docker Engine, which the agent lacks. az acr repository update manages repository attributes and does not build images.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-53","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Fabrikam Inc. runs ACR tasks that track base image updates. Some application images use a base image stored in the same Azure Container Registry, and others use a base image in a public Docker Hub repository. Which statement about trigger timing is correct?","choices":["A public Docker Hub base image triggers the dependent build immediately","Base image update triggers only fire on a schedule you configure","A base image in the same Azure Container Registry triggers the dependent build immediately","A base image in the same Azure Container Registry is polled every 10 to 60 minutes"],"answer":[2],"explanation":"When the base image is in an Azure Container Registry, ACR Tasks triggers the dependent run immediately upon the base image update. Public Docker Hub and MCR base images are checked at a random interval of 10 to 60 minutes, not immediately. Base image triggers are event-based and do not require a schedule. The 10 to 60 minute polling applies to public repos, not to base images in an Azure Container Registry.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-54","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Adventure Works Cycles wants to temporarily stop one ACR task from rebuilding its application image on base image updates, while keeping the task definition and its source-commit trigger intact. What should they do?","choices":["Delete the task and recreate it when needed","Remove the AcrPull role from the task identity","Disable geo-replication on the registry","Set base-image-trigger-enabled to False using az acr task update"],"answer":[3],"explanation":"The base-image-trigger-enabled property controls base image update triggering and is True by default; setting it to False disables that trigger while leaving the rest of the task intact. Deleting the task discards its definition and other triggers. AcrPull governs image pull permissions, not base image triggering. Geo-replication is a registry availability feature unrelated to task triggers.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-55","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Northwind Traders builds an application image from a multi-stage Dockerfile with a build-time stage and a runtime stage. Which images does ACR Tasks track for base image updates?","choices":["Only the final runtime application image","Both the intermediate build-time image and the final image","Only the intermediate build-time image","Every referenced image automatically, even before the task has run once"],"answer":[0],"explanation":"ACR Tasks tracks base image updates only for the runtime application image, not for intermediate build-time images in a multi-stage build. Intermediate build-time images are not tracked. Tracking only the intermediate image is the reverse of the actual behavior. Dependencies are discovered only after the task builds the image at least once, so tracking is not automatic before the first run.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-56","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Coho Winery needs its container images automatically replicated to several Azure regions while managing a single registry with one set of credentials and one login server. What is the minimum Azure Container Registry service tier that supports this?","choices":["Basic","Standard","Premium","Geo-replication is not tied to a service tier; use az acr import instead"],"answer":[2],"explanation":"Geo-replication requires the Premium SKU, which provides multi-region replicas managed as a single registry with one global endpoint. Basic and Standard do not support geo-replication. az acr import manually copies images between separate registries and is not the same as automatic geo-replication.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-57","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines runs a geo-replicated Premium registry with replicas in three regions. Clusters in each region pull using the global endpoint myregistry.azurecr.io. How does ACR decide which replica serves each pull?","choices":["It always routes to the home region replica","It round-robins across all replicas equally","It requires the region to be embedded in the image tag","It routes to the geo-replica with the best network performance profile, usually the closest one"],"answer":[3],"explanation":"The global endpoint routes each request to the geo-replica with the best network performance profile for the client, which is usually the closest replica. It does not always use the home region. Routing is performance-based, not round-robin. Region-specific routing through the global endpoint is automatic; embedding a region in the tag is only needed if you deliberately use regional endpoints.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-geo-replication"},{"id":"1.1.1-58","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Relecloud runs a CI pipeline that pushes an image to a geo-replicated registry in one region, and pods in a second region immediately attempt to pull the same tag. The pull intermittently fails with a manifest unknown error. What is the most likely cause?","choices":["Eventual consistency: replication to the second geo-replica has not completed yet","The AcrPull role is missing on the pulling identity","The registry is on the Basic SKU","The base image update trigger has not fired"],"answer":[0],"explanation":"ACR geo-replication is eventually consistent; a push followed by an immediate cross-region pull can fail with manifest unknown until replication catches up. A missing AcrPull role produces an authorization error, not manifest unknown. Geo-replication requires Premium, so the registry cannot be Basic. Base image triggers rebuild images and are unrelated to cross-region pull propagation.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-geo-replication"},{"id":"1.1.1-59","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank runs a geo-replicated registry, and its home region experiences an outage. Which capability becomes unavailable during the home region outage?","choices":["Image pulls served by the other geo-replicas","ACR Tasks runs, which are bound to the home region","Managed identity authentication to the registry","Webhook delivery from the available replicas"],"answer":[1],"explanation":"ACR Tasks are bound to the home region and do not run while it is unavailable; data plane operations continue through the remaining replicas. Image pulls, authentication (including managed identities), and webhook delivery all continue through the available geo-replicas during a home region outage.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-geo-replication"},{"id":"1.1.1-60","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Litware Inc. deploys a container app that must pull an image from a private Azure Container Registry using a user-assigned managed identity, with no admin credentials. Which built-in role should be assigned to the identity on the registry?","choices":["AcrPush","Reader","AcrPull","Contributor"],"answer":[2],"explanation":"AcrPull grants the identity permission to pull images from the registry, which is exactly what image pull requires. AcrPush grants push access, which is broader than needed and the wrong direction. Reader is an Azure Resource Manager management role and does not permit image pull. Contributor is a broad management role that over-privileges the identity.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-61","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Tailspin Toys has an existing AKS cluster (non-ABAC registry) that fails to pull images with ImagePullBackOff. They want the simplest supported, keyless way to grant the cluster pull access to the registry. What should they do?","choices":["Create an imagePullSecret using the registry admin credentials","Assign the cluster the Owner role on the registry","Enable the registry admin user account","Run az aks update --attach-acr, which assigns AcrPull to the kubelet managed identity"],"answer":[3],"explanation":"az aks update --attach-acr assigns the AcrPull role to the cluster kubelet managed identity, giving keyless image pull. An imagePullSecret built from admin credentials is key-based and not the recommended keyless approach. Owner over-privileges the cluster. Enabling the admin user relies on a shared key rather than managed identity.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-62","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Graphic Design Institute migrated its registry to Azure attribute-based access control (ABAC) repository permissions. After migration, az aks update --attach-acr no longer grants image pull and pulls fail. What is the correct explanation and fix?","choices":["ABAC-enabled registries do not honor the classic AcrPull role; manually assign Container Registry Repository Reader to the kubelet identity","The kubelet identity must be converted to a service principal","ABAC requires the registry admin user to be enabled","The registry must be downgraded to the Standard SKU"],"answer":[0],"explanation":"ABAC-enabled registries do not honor the classic AcrPull role and do not support --attach-acr, so you must manually assign the Container Registry Repository Reader role to the kubelet identity. The fix is a role assignment, not converting to a service principal. The admin user is not required and is not the mechanism. ABAC is not related to the service tier, so downgrading does not help.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-63","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Humongous Insurance wants container images assessed for known CVEs automatically as soon as they enter the registry, with findings surfaced as security recommendations. Which service and behavior provides this?","choices":["Azure Policy performs CVE scanning at push time","Microsoft Defender for Cloud scans images on push, on import, and when recently pulled","ACR Tasks scans the image during the build step","Azure Monitor scans images on an hourly schedule"],"answer":[1],"explanation":"Microsoft Defender for Cloud (Defender for Containers) scans images on push, on import, and any image pulled within the last 30 days, and reports findings as recommendations. Azure Policy can enforce governance but does not perform CVE scanning. ACR Tasks builds images and does not scan for vulnerabilities. Azure Monitor collects metrics and logs, not vulnerability scans.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-64","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee disabled public network access on its Azure Container Registry. Microsoft Defender for Cloud image scanning stops producing results. What must they configure so Defender can scan the network-restricted registry?","choices":["Assign the AcrPull role to Defender","Enable the registry admin user","Enable Allow trusted Microsoft services to access the registry","Create a private endpoint dedicated to Defender"],"answer":[2],"explanation":"For a network-restricted registry, the Allow trusted Microsoft services setting lets Defender for Cloud reach the registry to pull and scan images. Defender authenticates using its own trusted-service path, not an AcrPull role you assign. The admin user is not the scanning mechanism. A dedicated private endpoint for Defender is not the supported approach.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-65","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Alpine Ski House pulled an image 20 days ago that was healthy when it was pushed. A new CVE is disclosed that affects a package in that image. With Microsoft Defender for Cloud enabled, will the image be reassessed?","choices":["No, images are scanned only once at push","Only if the image is manually re-pushed","Only if the base image tag changes","Yes, Defender rescans images that were pulled within the last 30 days"],"answer":[3],"explanation":"Defender rescans any image pulled within the last 30 days, so newly disclosed vulnerabilities are caught without a re-push. Scanning is not one-time at push. A manual re-push is not required. A base image tag change is not required to trigger a rescan of a recently pulled image.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-66","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Proseware Inc. runs an App Service web app whose Key Vault uses the Azure role-based access control permission model. Which role should be granted to the app's managed identity so Key Vault references can read secrets?","choices":["Key Vault Administrator","Key Vault Secrets User","Key Vault Contributor","Reader"],"answer":[1],"explanation":"Under the RBAC permission model, Key Vault Secrets User grants the get-secret data action needed to resolve Key Vault references. Key Vault Administrator grants full secret management and over-privileges the app. Key Vault Contributor manages the vault resource but does not grant data plane secret read. Reader is an ARM management role with no secret data access.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-67","obj":"1.1.1","difficulty":"easy","type":"single","stem":"VanArsdel Ltd. needs an App Service app to resolve a Key Vault reference at resource creation time, before a system-assigned identity exists. What configuration supports this?","choices":["Enable a vault admin user for the app","Store the secret value directly in app settings","Create a user-assigned identity, grant it vault access in advance, and set keyVaultReferenceIdentity to it","Pin the reference by adding the SecretVersion field"],"answer":[2],"explanation":"A user-assigned identity can be granted access ahead of time and set as the keyVaultReferenceIdentity, so references resolve at creation before a system identity exists. Key Vault has no per-app admin user. Storing the secret directly defeats the purpose of using Key Vault. SecretVersion pins a specific secret version and does not address creation-time identity availability.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-68","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Southridge Video deploys a custom Linux container to Azure App Service. The container listens on port 5000, and the site returns no response. What is the correct fix?","choices":["Set the PORT environment variable to 5000","Add a load balancer rule for port 5000","Enable HTTP/2 for the app","Set the WEBSITES_PORT app setting to 5000"],"answer":[3],"explanation":"App Service auto-detects only ports 80 and 8080 for custom containers; for any other port you set the WEBSITES_PORT app setting to that port. The PORT variable is used by built-in language containers, not custom containers. App Service handles load balancing; no manual rule is needed. HTTP/2 does not control which container port receives requests.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-69","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Trey Research rotates a secret in Key Vault that an App Service app references without a pinned version. When will the app begin using the new secret value?","choices":["Within 24 hours, or immediately after any configuration change that restarts the app","Never, until the app is redeployed from scratch","Immediately in real time for every reference","Only when the SecretVersion field is specified"],"answer":[0],"explanation":"App Service caches Key Vault references and refetches every 24 hours; any configuration change restarts the app and forces an immediate refetch. The value is not stuck until a full redeploy. Updates are not real time; there is a caching delay. Specifying SecretVersion would pin a version and prevent picking up the rotated value.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-70","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Bellows College wants to route 20 percent of production traffic to a newly deployed revision of a container app for A/B testing while the rest stays on the current revision. What is the prerequisite?","choices":["Enable Dapr on the container app","Set the container app to multiple revision mode","Change the ingress transport to TCP","Create a second, separate container app"],"answer":[1],"explanation":"Traffic splitting between revisions requires the container app to be in multiple revision mode. Dapr provides inter-app communication and is unrelated to traffic splitting. TCP transport does not enable revision weighting. Traffic splitting works across revisions of one app, not separate apps.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-71","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Nod Publishers wants to split traffic 80/20 between two revisions of a container app using the Azure CLI. Which command and constraint apply?","choices":["az containerapp revision copy with a weight flag","az containerapp update --min-replicas to set the split","az containerapp ingress traffic set, where the combined weights must equal 100","az containerapp ingress enable --weight to assign the split"],"answer":[2],"explanation":"az containerapp ingress traffic set configures per-revision weights, and the combined weight of all split rules must equal 100. az containerapp revision copy creates a revision and does not assign traffic weights. --min-replicas controls scaling, not traffic. az containerapp ingress enable --weight is not a real command.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-72","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Lucerne Publishing wants a stable URL to test a specific older revision of a container app directly, without shifting any production traffic to it. Which feature provides this?","choices":["Set the revision weight to 100","Enable session affinity","Switch the app to single revision mode","Assign the revision a label, which gives it a unique FQDN for direct access"],"answer":[3],"explanation":"A revision label gives that revision a unique fully qualified domain name for direct access, independent of the traffic split weights. Setting weight to 100 shifts all production traffic to it. Session affinity keeps a client on one replica and does not expose a per-revision URL. Single revision mode routes all traffic to the latest revision only.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-73","obj":"1.1.1","difficulty":"easy","type":"single","stem":"First Up Consultants runs an HTTP API on Azure Container Apps that should add a replica for roughly every 50 concurrent HTTP requests and scale in to zero when idle. Which scale rule fits?","choices":["An HTTP scale rule with concurrentRequests set to 50 and minReplicas 0","A CPU scale rule set to 50 percent","An Azure Service Bus scale rule with messageCount 50","A TCP scale rule with 50 concurrent connections"],"answer":[0],"explanation":"The HTTP scale rule scales on concurrent HTTP requests, and minReplicas 0 allows the revision to scale in to zero when idle. A CPU scale rule scales on processor use, not request count, and CPU or memory rules cannot scale to zero. A Service Bus rule scales on queue depth, not HTTP requests. A TCP rule scales on connections, not HTTP requests.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-74","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank runs a background worker on Azure Container Apps that consumes an Azure Service Bus queue and must scale in to zero replicas when the queue is empty. Which scaling approach is correct?","choices":["An HTTP scale rule","A custom KEDA scale rule of type azure-servicebus keyed on queue message count","A schedule-based scale rule","Setting minReplicas to 1"],"answer":[1],"explanation":"A custom KEDA azure-servicebus scale rule scales the worker on queue depth and supports scaling to zero when there are no messages. An HTTP rule needs HTTP ingress, which a background worker does not use. Container Apps does not provide a schedule scaler for apps. Setting minReplicas to 1 keeps a replica running and prevents scaling to zero.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-75","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Contoso Ltd. adds a non-HTTP event scale rule (Azure Service Bus) to a container app. The documentation calls out a required revision configuration for non-HTTP event scale rules. Which setting is it?","choices":["Set activeRevisionsMode to multiple","Enable Dapr on the app","Set activeRevisionsMode to single","Disable ingress on the app"],"answer":[2],"explanation":"When using non-HTTP event scale rules, the container app activeRevisionsMode property should be set to single. Multiple revision mode is the opposite of the documented requirement. Dapr is unrelated to the scale rule requirement. Disabling ingress is not what the setting requires.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-76","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Wingtip Toys plans an Azure Container Apps job that must scale executions based on messages in a queue. Which statement about scaling Container Apps jobs is correct?","choices":["Jobs support HTTP concurrentRequests scaling just like apps","Jobs cannot use KEDA scalers at all","Jobs can scale only on CPU utilization","Container Apps jobs use event-driven KEDA scalers; HTTP scaling rules are not supported for jobs"],"answer":[3],"explanation":"Container Apps jobs do not support HTTP scaling rules; event-driven jobs are triggered by KEDA scalers such as a queue scaler. HTTP concurrentRequests scaling is not supported for jobs. Jobs do use KEDA scalers for event-driven execution. Jobs are not limited to CPU-based scaling.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-77","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Consolidated Messenger stores a database password used by a container app. The value must be reusable across multiple revisions, and updating it must not force creation of a new revision. Which mechanism meets these requirements?","choices":["A Container Apps secret referenced by the app's revisions","A distinct environment variable hardcoded in each revision","A Dapr state store component","An @Microsoft.KeyVault app setting reference"],"answer":[0],"explanation":"Container Apps secrets are scoped to the application; adding, changing, or removing a secret does not create a new revision, and multiple revisions can reference the same secret. A hardcoded environment variable per revision is not reusable and changing it creates a new revision. A Dapr state store holds application state, not configuration secrets. The @Microsoft.KeyVault syntax is an App Service reference format, not a Container Apps secret.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-78","obj":"1.1.1","difficulty":"hard","type":"single","stem":"After updating the value of a secret used by a Container Apps app, First Up Consultants notices the running revisions still serve the old value. How do they make the running app use the new secret value?","choices":["Wait 24 hours for an automatic refresh","Restart the existing revision or deploy a new revision","Delete and recreate the container app","Re-run az containerapp ingress traffic set"],"answer":[1],"explanation":"An updated secret does not automatically affect existing revisions; you restart an existing revision or deploy a new revision to pick up the change. There is no 24-hour automatic secret refresh in Container Apps (that behavior belongs to App Service Key Vault references). Recreating the whole app is unnecessarily destructive. Traffic set changes routing, not secret values.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-79","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fabrikam Inc. needs a containerized task on Azure Container Apps to run every night at midnight and then stop. Which configuration is correct?","choices":["A Manual job triggered from the portal","An Event job with an Azure Service Bus scaler","A Schedule job with the cron expression 0 0 * * *, evaluated in UTC","A container app with an HTTP scale rule"],"answer":[2],"explanation":"A Schedule job uses a cron expression; 0 0 * * * runs daily at midnight, and Container Apps cron schedules are evaluated in UTC. A Manual job runs on demand, not on a schedule. An Event job runs in response to queue events, not a clock. A container app runs continuously rather than as a finite scheduled task.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-80","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Alpine Ski House needs a container that starts for each message placed on a queue, processes exactly one message, and then exits. Which Azure Container Apps construct fits best?","choices":["A continuously running container app with a custom scale rule","A manual job","A scheduled job","An event-driven Container Apps job"],"answer":[3],"explanation":"An event-driven job starts a job execution per event (queue message) and exits after processing, matching the finite, one-message-per-execution requirement. A container app runs continuously and each replica processes many messages without exiting. A manual job runs on demand, not per message. A scheduled job runs on a clock, not per queue message.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-81","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank must run a service that continuously processes messages from an Azure Service Bus queue and stays running to handle a steady stream. Should this be an app or a job, and how should it scale?","choices":["A container app with a custom scale rule","An event-driven job","A scheduled job","A manual job"],"answer":[0],"explanation":"A continuously running message processor is a container app; a custom scale rule scales replicas based on queue depth while the service keeps running. Event-driven, scheduled, and manual jobs all run to completion and stop, which does not match a continuously running service.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-82","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Trey Research runs two Dapr-enabled container apps in one environment. The order-processor app must invoke a method on the checkout app through Dapr service invocation. Which endpoint does order-processor call on its own Dapr sidecar?","choices":["https://<app-id>.<region>.azurecontainerapps.io/<method>","http://localhost:3500/v1.0/invoke/<app-id>/method/<method>","http://localhost:50001/invoke/<app-id>","http://<app-id>:80/<method> called directly"],"answer":[1],"explanation":"Dapr service invocation is made to the local sidecar on HTTP port 3500 using the /v1.0/invoke/<app-id>/method/<method> path, and the sidecar handles discovery and routing. Calling the public FQDN or the app directly bypasses Dapr service invocation. Port 50001 is the Dapr gRPC port and does not use this HTTP invoke path.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-83","obj":"1.1.1","difficulty":"medium","type":"single","stem":"City Power & Light deploys a Dapr-enabled container app but does not set an explicit Dapr App ID. What App ID does the Dapr runtime use?","choices":["It is null and Dapr is disabled for the app","It is assigned a random GUID","It defaults to the container app name","It must be set explicitly or the deployment fails"],"answer":[2],"explanation":"When no explicit App ID is configured, the Dapr runtime defaults the App ID to the container app name. Dapr is not disabled when the App ID is unset. It is not a random GUID. Setting the App ID is optional, so deployment does not fail without it.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-84","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Fourth Coffee tries to deploy a second Dapr-enabled container app using a Dapr App ID that is already in use by another app in the same environment. What happens?","choices":["The new deployment silently overwrites the first app","Both apps share one sidecar with no conflict","The entire environment is deleted","The app resource is created but its revision fails to provision because App IDs must be unique per environment"],"answer":[3],"explanation":"Dapr App IDs must be unique within an environment; a duplicate causes the container app resource to be created while its revision fails to provision, and the error identifies the conflicting App ID. The existing app is not overwritten. The apps do not cleanly share a sidecar. The environment is not deleted; only the new revision fails to provision.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-85","obj":"1.1.1","difficulty":"easy","type":"single","stem":"A pod in Lamna Healthcare Company's AKS cluster shows STATUS ImagePullBackOff. What is the correct first diagnostic step to find the specific pull error?","choices":["Run kubectl describe pod and review the Events section","Run kubectl top pod to inspect resource usage","Delete the node pool and recreate it","Increase the maxSurge value on the node pool"],"answer":[0],"explanation":"kubectl describe pod surfaces the Events section, which contains the detailed image pull error; from there you can run az aks check-acr to validate registry access. kubectl top pod shows CPU and memory usage, not pull errors. Deleting the node pool is drastic and does not diagnose the cause. maxSurge controls node pool upgrades, unrelated to image pulls.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-86","obj":"1.1.1","difficulty":"medium","type":"single","stem":"After a configuration change, pods in Adventure Works Cycles' AKS cluster enter CrashLoopBackOff. Which command reveals the logs from the previously crashed container instance to find the root cause?","choices":["kubectl get nodes","kubectl logs <pod> --previous","kubectl top pod","kubectl apply -f deployment.yaml"],"answer":[1],"explanation":"kubectl logs <pod> --previous returns logs from the prior, crashed container instance, which typically shows the exit error such as a missing configuration value. kubectl get nodes shows node status, not container logs. kubectl top pod shows resource usage. kubectl apply redeploys the manifest and does not diagnose the crash.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-87","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders suspects an AKS cluster cannot reach or authenticate to its Azure Container Registry. Which command validates DNS resolution, routing, and authentication between the cluster and the registry?","choices":["az acr build","kubectl rollout status","az aks check-acr","az aks nodepool upgrade"],"answer":[2],"explanation":"az aks check-acr checks DNS resolution, network routing, and authentication between the AKS cluster and the registry, making it the right first diagnostic for pull connectivity. az acr build builds an image and does not test cluster-to-registry connectivity. kubectl rollout status reports deployment progress. az aks nodepool upgrade upgrades nodes.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-88","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines wants faster rolling updates of a Kubernetes Deployment on AKS by allowing extra pods to be created and become ready before old pods are terminated. Which Deployment rolling update field controls this?","choices":["maxUnavailable","minReadySeconds","terminationGracePeriodSeconds","maxSurge"],"answer":[3],"explanation":"maxSurge specifies how many additional pods can be created beyond the desired count during a rolling update, enabling new pods to become ready before old ones are removed. maxUnavailable limits how many pods can be down and does not add extra pods. minReadySeconds delays marking a pod ready. terminationGracePeriodSeconds controls shutdown time, not surge capacity.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-89","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Contoso Ltd. must upgrade an AKS node pool that is capacity constrained, so provisioning additional surge nodes is not possible. Which setting lets the upgrade proceed using existing node capacity?","choices":["Configure maxUnavailable to upgrade in place by cordoning and draining existing nodes","Set a higher maxSurge percentage","Enable Accelerated Networking","Increase the node soak time"],"answer":[0],"explanation":"maxUnavailable performs an in-place upgrade by cordoning and draining existing nodes without provisioning surge nodes, which is recommended when extra capacity is unavailable. A higher maxSurge requires more capacity, which is the constraint. Accelerated Networking improves NIC performance and is unrelated. Node soak time adds waiting between nodes and does not remove the need for surge capacity.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-90","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Wide World Importers wants to run Kubernetes-style microservices with built-in service discovery and traffic splitting, but the team does not need direct access to the Kubernetes API and does not want to manage a cluster. Which Azure container host best fits?","choices":["Azure Kubernetes Service","Azure Container Apps","Azure Container Instances","Web App for Containers"],"answer":[1],"explanation":"Azure Container Apps is a serverless, Kubernetes-based platform that provides service discovery and traffic splitting without exposing the Kubernetes API or requiring cluster management. AKS exposes the Kubernetes API but requires cluster operations. Azure Container Instances is a low-level single-pod building block without service discovery or traffic splitting. Web App for Containers is optimized for web apps, not a microservices mesh.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-91","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fabrikam Inc. requires direct access to the Kubernetes API and deny-by-default network controls between colocated workload components using Kubernetes network policies. Which Azure container host meets these requirements?","choices":["Azure Container Apps","Web App for Containers","Azure Kubernetes Service","Azure Container Instances"],"answer":[2],"explanation":"AKS provides direct Kubernetes API access and supports Kubernetes network policies for deny-by-default segmentation, which is an AKS-only capability among these options. Azure Container Apps has no direct Kubernetes API access and only a single environment security boundary. Web App for Containers is a web hosting PaaS. Azure Container Instances offers no orchestration or network policies.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-92","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel needs to run a single container instance on demand for a short-lived task, with no need for autoscaling, load balancing, or managed certificates. Which option is the simplest lower-level building block?","choices":["Azure Kubernetes Service","Azure Container Apps","Web App for Containers","Azure Container Instances"],"answer":[3],"explanation":"Azure Container Instances provides a single pod of containers on demand as a low-level building block, without scale, load balancing, or certificate features you do not need here. AKS and Azure Container Apps add orchestration and application concepts that are unnecessary for this task. Web App for Containers is optimized for web apps, not one-off container tasks.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-93","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Proseware Inc. is an existing Azure App Service customer that wants to host a containerized web app and needs deployment slots for zero-downtime swaps between staging and production. Which host should they choose?","choices":["Web App for Containers on Azure App Service, which provides deployment slots","Azure Container Apps","Azure Kubernetes Service","Azure Container Instances"],"answer":[0],"explanation":"Web App for Containers (Azure App Service) supports deployment slots for zero-downtime swaps and is optimized for web applications, fitting an existing App Service customer. Azure Container Apps achieves zero downtime through revisions and rolling updates, not deployment slots. AKS uses Kubernetes deployment strategies with more operational overhead. Azure Container Instances has no slots or built-in scaling.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-94","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Coho Winery hosts a custom container on Azure App Service and wants it to pull images from Azure Container Registry without any stored keys. Which configuration achieves keyless pull?","choices":["Enable the ACR admin user and store its password in app settings","Enable a managed identity, assign it AcrPull on the registry, and configure the app to use managed identity credentials for the registry","Assign the app the Owner role on the subscription","Use a Key Vault reference as the image name"],"answer":[1],"explanation":"Keyless pull uses a managed identity granted AcrPull on the registry, with the app configured to use managed identity credentials for the registry (acrUseManagedIdentityCreds). The ACR admin user relies on a stored key, which is not keyless. Owner on the subscription over-privileges the app and is not the pull mechanism. Key Vault references supply secret values, not container image pulls.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-95","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Northwind Foods enabled RBAC Registry + ABAC Repository Permissions on its Azure Container Registry. A deployment service principal must pull images only from the repository named backend/api and from no other repository. Which role, assigned with an ABAC condition on the repository name, grants exactly this access?","choices":["AcrPull","Container Registry Repository Contributor","Container Registry Repository Reader","Container Registry Repository Catalog Lister"],"answer":[2],"explanation":"Container Registry
