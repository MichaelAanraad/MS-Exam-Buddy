oft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-144","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A Relecloud team asks why entity functions may run nondeterministic code while orchestrator functions may not. Which statement is correct?","choices":["Both entities and orchestrators forbid I/O of any kind","Entities manage state through discrete operations and are not replayed, so they can run nondeterministic or long-running code","Orchestrators can run any code, but entities are restricted to deterministic code","Entities are replayed like orchestrators, so nondeterministic code is also forbidden"],"answer":[1],"explanation":"Entity operations run any code, including nondeterministic or long-running work, whereas orchestrators are replayed and must be deterministic. Entities are not subject to the orchestrator replay constraint, the restriction applies to orchestrators not entities, and entities are not barred from I/O.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-145","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder must run the API Management gateway on-premises next to backend APIs for compliance. Which statement about the self-hosted gateway is correct?","choices":["It runs only inside Azure regions, not on-premises","It replaces the managed gateway and requires no Azure connectivity","It is a Linux-based Docker container, available in Developer and Premium tiers, commonly run on Kubernetes","It is a Windows service available in every tier including Consumption"],"answer":[2],"explanation":"The self-hosted gateway is a Linux Docker container offered in the Developer and Premium tiers and is commonly deployed to Kubernetes for hybrid and multicloud scenarios. It is not a Windows service, is not in every tier (for example not Consumption for self-hosting), still needs outbound 443 connectivity to Azure for configuration, and its whole purpose is running outside Azure.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-146","obj":"3.1.1","difficulty":"medium","type":"single","stem":"An API in a Fabrikam API Management instance is included in an open product that does not require a subscription. How does the gateway handle a request that arrives without a subscription key?","choices":["It always returns 401 Access denied because no key is present","It routes the request to the dead-letter gateway","It forwards the request only after generating a temporary key","It processes the request in the context of the open product's policies and access rules"],"answer":[3],"explanation":"If an open product includes the API, API Management ignores the missing key and handles the request under that open product's policies; an API can be associated with at most one open product. A 401 is returned only when no open product or subscription-free API matches. API Management does not generate temporary keys, and there is no dead-letter gateway concept.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-147","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Northwind plans to use the rate-limit-by-key policy in API Management. In which tier is this policy NOT available?","choices":["Consumption tier","Standard tier","Premium tier","Developer tier"],"answer":[0],"explanation":"The rate-limit-by-key, quota-by-key, and LLM token-limit policies are not available in the Consumption tier. Premium, Developer, and Standard tiers support rate-limit-by-key; only the Consumption tier excludes it.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-148","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which of the following is NOT a responsibility of the Azure API Management gateway (data plane)?","choices":["Optionally caching responses and emitting telemetry","Verifying API keys, JWTs, and client certificates","Executing the backend service's business logic and data access","Enforcing usage quotas and rate limits"],"answer":[2],"explanation":"The gateway proxies requests and applies cross-cutting concerns; it does not execute backend business logic, which remains in the backend services it fronts. Verifying credentials, enforcing quotas and rate limits, and optional caching plus telemetry are all core gateway responsibilities.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-149","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Fill in the trigger attribute so this .NET isolated-worker function runs when a message arrives on the orders Service Bus queue.\n\n```\n[Function(\"ProcessOrder\")]\npublic void Run(\n    [________(\"orders\", Connection = \"SbConn\")] string message,\n    FunctionContext ctx)\n{\n    // process the order\n}\n```","choices":["QueueTrigger","ServiceBusTrigger","EventHubTrigger","ServiceBusOutput"],"answer":[1],"explanation":"ServiceBusTrigger binds the function to a Service Bus queue or topic subscription so it runs on each incoming message. ServiceBusOutput sends messages rather than triggering. QueueTrigger targets Azure Storage queues, not Service Bus. EventHubTrigger targets Event Hubs partitions.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-150","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Complete the blob input binding so the function reads the named blob as a read-only stream.\n\n```\n[FunctionName(\"BlobInput\")]\npublic static void Run(\n    [QueueTrigger(\"myqueue-items\")] string myQueueItem,\n    [Blob(\"samples-workitems/{queueTrigger}\", ________)] Stream myBlob,\n    ILogger log)\n{\n    log.LogInformation($\"Size: {myBlob.Length} bytes\");\n}\n```","choices":["BlobAccess.Read","AccessMode.ReadOnly","FileAccess.Write","FileAccess.Read"],"answer":[3],"explanation":"The blob input binding uses FileAccess.Read to open the referenced blob as a read-only stream. FileAccess.Write would make it an output binding. BlobAccess.Read and AccessMode.ReadOnly are not valid types for this binding.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-151","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Complete the Python Durable Functions orchestrator so the copy activities run in parallel and the orchestrator waits for all of them.\n\n```\ndef orchestrator(context):\n    files = yield context.call_activity(\"GetFileList\", root)\n    tasks = [context.call_activity(\"CopyFileToBlob\", f) for f in files]\n    results = yield context.________(tasks)\n    return sum(results)\n```","choices":["task_all","task_any","call_activity","wait_all"],"answer":[0],"explanation":"context.task_all returns a task that completes only when every task in the list finishes, implementing the fan-in join for parallel activities. task_any completes when the first task finishes, breaking the aggregation. call_activity schedules a single activity, and wait_all is not a Durable Functions API.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-152","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Complete the Event Grid advanced filter so the subscription only receives events whose data.amount is greater than 500.\n\n```\n\"advancedFilters\": [{\n    \"operatorType\": \"________\",\n    \"key\": \"data.amount\",\n    \"value\": 500\n}]\n```","choices":["GreaterThan","StringContains","NumberGreaterThan","NumberGreaterThanOrEquals"],"answer":[2],"explanation":"NumberGreaterThan evaluates to true when the numeric key value is strictly greater than the filter value. StringContains does substring matching on strings, not numeric comparison. NumberGreaterThanOrEquals would also match exactly 500. GreaterThan is not a valid operatorType.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-153","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Complete the C# call that cancels a previously scheduled Service Bus message using its sequence number.\n\n```\nlong seq = await sender.ScheduleMessageAsync(message, enqueueTime);\n// later, cancel it\nawait sender.________(seq);\n```","choices":["CancelMessageAsync","CancelScheduledMessageAsync","AbandonMessageAsync","DeleteMessageAsync"],"answer":[1],"explanation":"CancelScheduledMessageAsync takes the SequenceNumber returned by ScheduleMessageAsync and cancels the pending scheduled message. There is no CancelMessageAsync or DeleteMessageAsync on the sender. AbandonMessageAsync is a receiver settlement operation, not a way to cancel a scheduled send.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-154","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Complete the JavaScript Durable Functions client so it sends a one-way increment to the Counter entity.\n\n```\nconst df = require(\"durable-functions\");\nmodule.exports = async function (context) {\n    const client = df.getClient(context);\n    const entityId = new df.EntityId(\"Counter\", \"myCounter\");\n    await client.________(entityId, \"add\", 1);\n};\n```","choices":["signalEntity","raiseEvent","callEntity","startNew"],"answer":[0],"explanation":"Clients use signalEntity to send a one-way (fire-and-forget) operation to an entity; clients cannot call an entity and await a result. callEntity is available from orchestrators, not clients. startNew starts an orchestration, and raiseEvent sends an external event to an orchestration, not an entity operation.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-155","obj":"3.1.1","difficulty":"medium","type":"multi","stem":"Which two conditions cause Azure Service Bus to automatically move a message to the dead-letter queue? (Select two.)","choices":["The session lock expires while messages remain unsettled","The message exceeds the maximum delivery count","The message time-to-live expires and dead-lettering on expiration is enabled","The message is scheduled for future enqueue","A duplicate MessageId is detected within the dedup window"],"answer":[1,2],"explanation":"Exceeding MaxDeliveryCount and TTL expiration (when dead-lettering on expiration is enabled) are two documented automatic dead-letter triggers. Scheduling only delays enqueue; it does not dead-letter. A session lock expiring makes messages available again rather than dead-lettering them. A detected duplicate is silently dropped by duplicate detection, not dead-lettered.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-156","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Which two Azure Functions hosting plans can scale to zero instances when idle? (Select two.)","choices":["Flex Consumption plan","App Service Environment","Dedicated (App Service) plan","Consumption plan","Premium plan"],"answer":[0,3],"explanation":"Both the Consumption and Flex Consumption plans scale to zero when there is no activity. The Premium plan keeps at least one always-billed instance. The Dedicated plan and App Service Environment run continuously and do not scale to zero.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-157","obj":"3.1.1","difficulty":"easy","type":"multi","stem":"Which two statements about Azure Event Hubs checkpointing are correct? (Select two.)","choices":["Checkpointing prevents any event from being replayed","Event Hubs stores a single checkpoint per namespace automatically","Checkpointing is the consumer's responsibility","Checkpoints are stored externally, such as in Azure Blob Storage","Checkpointing guarantees exactly-once delivery"],"answer":[2,3],"explanation":"Consumers are responsible for checkpointing, and offsets are persisted externally (commonly Blob Storage) per partition per consumer group. Event Hubs does not auto-store one checkpoint per namespace. It provides at-least-once, not exactly-once, delivery, and a lower offset can still be used to replay events.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-158","obj":"3.1.1","difficulty":"medium","type":"multi","stem":"Which two are core responsibilities of the Azure API Management gateway? (Select two.)","choices":["Verifying API keys, JWTs, and certificates on requests","Creating Event Hubs partitions for consumers","Enforcing usage quotas and rate limits","Compiling and hosting Azure Functions code","Persisting the backend service's relational database"],"answer":[0,2],"explanation":"The gateway verifies credentials and enforces quotas and rate limits as part of proxying API traffic. The gateway does not host backend databases, compile or host Functions code, or manage Event Hubs partitions; those belong to other services.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-159","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Which two methods can a sender use to schedule a Service Bus message for future delivery? (Select two.)","choices":["Set the ScheduledEnqueueTimeUtc property on the message before sending","Set a long TimeToLive on the message","Set the SessionId to a future timestamp","Enable duplicate detection on the queue","Call the ScheduleMessage API, which returns a SequenceNumber"],"answer":[0,4],"explanation":"You can schedule by setting ScheduledEnqueueTimeUtc on a normal send, or by calling the schedule API which returns the SequenceNumber used to cancel it later. TimeToLive controls expiration, not scheduling. SessionId groups messages and is not a time value. Duplicate detection suppresses repeats and does not schedule delivery.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-160","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Contoso Logistics processes parcel-tracking events on a session-enabled Service Bus queue. The design must guarantee first-in, first-out handling of all messages that share a tracking number, allow a session to move between handler instances without losing its checkpoint, and keep that checkpoint durable even after every message in the session has been consumed. Which single approach meets all three requirements?","choices":["Group related messages by SessionId and persist progress by calling SetState on the session receiver, clearing it only when the workflow completes.","Group related messages by CorrelationId and rely on PeekLock redelivery to preserve ordering across handlers.","Enable duplicate detection with a seven-day window so repeated tracking numbers are collapsed into one ordered stream.","Set ScheduledEnqueueTimeUtc on each message so the broker releases them to handlers in submission order."],"answer":[0],"explanation":"Sessions provide the FIFO guarantee for messages sharing a SessionId. SetState/GetState on the session receiver stores an opaque checkpoint that lets a session move between handlers, and session state remains until it is explicitly cleared by passing null, even after all messages are consumed.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-161","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Fabrikam Payments requires that a payment message is never lost if a consumer crashes mid-processing, that a slow consumer can extend its hold on a message beyond the default lock, and that competing receivers cannot see a message while one worker owns it. Which receive mode and technique satisfy every requirement?","choices":["ReceiveAndDelete mode, relying on client-side retries to resend on crash.","PeekLock mode, extending the hold with RenewMessageLockAsync before the lock expires.","ReceiveAndDelete mode with a large prefetch buffer to absorb slow processing.","PeekLock mode with duplicate detection enabled to recover lost messages."],"answer":[1],"explanation":"PeekLock holds an exclusive lock so competing receivers cannot see the message, redelivers it if the consumer crashes before settling, and lets the owner extend the lock with RenewMessageLockAsync.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-162","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders defers an out-of-order order-line message so it can be processed after its parent order arrives. The deferred message must remain retrievable, must not sit in a subqueue, and the application must be able to fetch it later even from a different receiver instance. What must the application retain, and where does the deferred message live?","choices":["Retain the LockToken; the deferred message moves to the transfer dead-letter queue.","Retain the SequenceNumber; the deferred message stays in the main queue and is fetched with ReceiveDeferredMessagesAsync.","Retain the MessageId; the deferred message moves to the dead-letter subqueue until reactivated.","Retain the EnqueuedTimeUtc; the deferred message stays in a hidden scheduled subqueue."],"answer":[1],"explanation":"Deferral requires saving the service-assigned SequenceNumber. Deferred messages remain in the main queue (not a subqueue) and any receiver that knows the sequence number can retrieve them with ReceiveDeferredMessagesAsync.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-163","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Adventure Works chains a source queue to a destination queue with auto-forwarding. The destination is temporarily disabled, so forwarded messages cannot be delivered. An operator must locate these stranded messages. On which entity and subqueue do they land?","choices":["The destination queue's dead-letter subqueue.","The source entity's transfer dead-letter queue.","The namespace-level global dead-letter queue.","The destination queue's transfer dead-letter queue."],"answer":[1],"explanation":"When an auto-forwarded or send-via message cannot reach its destination, it is placed in the transfer dead-letter queue of the source entity that did the forwarding, addressable as <path>/$Transfer/$DeadLetterQueue.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-164","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Tailwind Traders must receive a message from a topic subscription and, in the same atomic transaction, send a resulting message to a destination queue in the same namespace. The team also needs to know how long the transaction may stay open before it times out. Which combination is correct?","choices":["Use a queue as the transfer entity for the send-via, and expect a 5-minute transaction timeout.","Use a topic as the transfer entity for the send-via, and expect a 2-minute transaction timeout.","Span the transaction across two namespaces, and expect a 2-minute transaction timeout.","Use a topic as the transfer entity, and expect no timeout as long as locks are renewed."],"answer":[1],"explanation":"To receive from a subscription and send in one transaction, the transfer entity must be a topic (send-via the transfer topic). A Service Bus transaction times out after 2 minutes, measured from the first operation.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-165","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Wingtip Toys builds a composite topology by chaining topics with auto-forwarding. The team needs a design that avoids messages being dead-lettered for excessive hops, understands that a receiver cannot be attached to a forwarding source, and accounts for how forwarded messages are billed. Which statement set is entirely correct?","choices":["Chains may exceed four hops safely; receivers can read from a forwarding source; each forward is free.","Chains must not exceed four hops; a receiver cannot be created on a forwarding source; each forwarded message is billed as an operation.","Chains must not exceed ten hops; receivers can read from a forwarding source; forwarding is billed once per chain.","Chains may span namespaces; a receiver cannot be created on a forwarding source; forwarding is not billed."],"answer":[1],"explanation":"Messages that exceed four hops are dead-lettered, Service Bus does not allow creating a receiver on a source that has auto-forwarding enabled, and one operation is billed for each forwarded message.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-166","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank enables duplicate detection on a high-throughput queue. Producers may resend the same message after a transient failure. The team wants to know which property drives dedup, how the window size affects throughput, and the maximum window they can configure. Which option is correct on all three?","choices":["Dedup keys on MessageId; a larger window lowers throughput; the maximum window is seven days.","Dedup keys on SequenceNumber; a larger window raises throughput; the maximum window is one day.","Dedup keys on CorrelationId; window size has no throughput impact; the maximum window is thirty days.","Dedup keys on MessageId; a smaller window lowers throughput; the maximum window is 24 hours."],"answer":[0],"explanation":"Duplicate detection dedupes on the MessageId. A larger window means more IDs must be retained and matched, which lowers throughput, so keeping it small is recommended. The maximum window is seven days.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/duplicate-detection"},{"id":"3.1.1-167","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Proseware schedules a reminder message for a future time using the schedule-message API and later needs to cancel it before it appears. The team must know what the schedule call returns for cancellation, and whether that identifier stays valid after the message activates. Which statement is correct?","choices":["The API returns a LockToken used to cancel; it remains valid after activation.","The API returns a SequenceNumber used to cancel; it is only valid while the message is in the scheduled state.","The API returns a MessageId used to cancel; it is valid for the message's entire lifetime.","Scheduled messages cannot be canceled once submitted."],"answer":[1],"explanation":"The schedule-message API returns the message's SequenceNumber, which is used to cancel the scheduled message. That sequence number is only valid while the message is in the scheduled state; when it activates it is appended to the queue and assigned a new SequenceNumber.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-168","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Relecloud runs a busy topic with many subscriptions. A subscription must match on the CorrelationId and one custom property equalling fixed values, with the least impact on namespace throughput. The team also confirms that no filter may inspect the serialized message body. Which choice satisfies all constraints?","choices":["A SQL filter with a LIKE expression against the body payload.","A correlation filter matching CorrelationId and the custom property, because it is more efficient than SQL filters.","A SQL filter referencing sys.Body to read the payload directly.","A correlation filter that performs a substring match on the body for the custom property."],"answer":[1],"explanation":"Correlation filters test equality on system and user-defined properties and are recommended over SQL filters on busy namespaces because they are more efficient and have less throughput impact. No filter type can evaluate the message body.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-169","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee turns on a large prefetch buffer in PeekLock mode to boost throughput, but processing per message is long. The team must understand the lock behavior and the ordering side effect this creates. Which two consequences are correct?","choices":["The lock timer starts when the application calls receive, and ordering is always strictly preserved.","The lock timer starts when the message is prefetched into the buffer, and abandoned messages can be re-fetched to the end of the buffer, producing out-of-order delivery.","Locks never expire while a message sits in the prefetch buffer, and ordering is preserved.","Prefetch is the default receive behavior, and it eliminates lock expiration risk entirely."],"answer":[1],"explanation":"In PeekLock, the lock timer starts the moment a message is prefetched into the buffer, so long processing can let locks expire while messages wait. Abandoned messages are re-fetched and placed at the end of the buffer, so the application can receive messages out of order.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-170","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Wide World Importers must ensure messages that exceed the maximum delivery count and messages whose time to live expires are both isolated for later inspection rather than silently dropped. The team also confirms that TTL expiration only moves a message to the DLQ when a specific setting is on. Which configuration meets these needs?","choices":["Rely on the default behavior; expired messages always go to the dead-letter queue automatically.","Keep the default max delivery count and enable dead-lettering on message expiration, so both max-delivery and TTL cases land in the DLQ.","Disable the dead-letter queue and increase TTL so messages are never lost.","Set the max delivery count to 1 so no message is ever redelivered or dead-lettered."],"answer":[1],"explanation":"Exceeding the maximum delivery count moves a message to the DLQ automatically. TTL expiry only dead-letters a message when dead-lettering on expiration is enabled for the entity; otherwise the message is dropped.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-171","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Lucerne Publishing builds an Event Grid consumer for blob-created events. Architecture review flags that the same event may arrive more than once and that events may not arrive in the order they were produced. Which design correctly reflects Event Grid delivery semantics?","choices":["Assume exactly-once, ordered delivery and process events without deduplication.","Assume at-least-once delivery with no ordering guarantee, and make the handler idempotent.","Assume at-most-once delivery, so a missed event never repeats and ordering is preserved.","Assume ordered delivery per subject and skip idempotency checks."],"answer":[1],"explanation":"Event Grid provides at-least-once delivery and does not guarantee ordering, so consumers should be designed to be idempotent and to tolerate duplicate and out-of-order events.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-172","obj":"3.1.1","difficulty":"easy","type":"single","stem":"VanArsdel sets an Event Grid event subscription retry policy with a time to live of 30 minutes and a maximum of 10 delivery attempts. Given exponential backoff, roughly 6 attempts occur within 30 minutes. When does Event Grid stop retrying and dead-letter the event?","choices":["After exactly 10 attempts, ignoring the TTL.","After 30 minutes, because the TTL expires first, so the max-attempts value has no effect here.","After 60 minutes, because Event Grid sums the two limits.","Never, because both limits must be exceeded simultaneously."],"answer":[1],"explanation":"Event Grid uses whichever limit expires first. With a 30-minute TTL and backoff allowing only about 6 attempts in that window, the TTL is reached before 10 attempts, so the max-attempts setting has no effect and the event is dead-lettered at 30 minutes.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-173","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Coho Vineyard needs undelivered Event Grid events preserved for reconciliation. During review the team notes that dead-lettering is not active out of the box, that some responses trigger dead-lettering immediately, and that there is a delay before an event appears in storage. Which statement set is correct?","choices":["Dead-lettering is on by default; a 429 response dead-letters immediately; events appear instantly.","Dead-lettering is off by default and requires a storage account; a 400 or 413 response schedules dead-lettering immediately; there is a five-minute delay before the event is written to the dead-letter location.","Dead-lettering is off by default and writes to a Service Bus queue only; a 500 response dead-letters immediately; there is no delay.","Dead-lettering is on by default and writes to Event Hubs; only TTL expiry triggers it; there is a one-hour delay."],"answer":[1],"explanation":"Event Grid does not enable dead-lettering by default; you must specify a storage account with a container. A 400 (Bad Request) or 413 (Request Entity Too Large) response immediately schedules the event for dead-lettering, and there is a five-minute delay between the last delivery attempt and writing to the dead-letter location.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-174","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Margie's Travel operates an Event Grid webhook. During an incident the endpoint returns different status codes. The team must know which responses cause Event Grid to stop retrying versus keep retrying. Which grouping is correct?","choices":["400 and 413 are not retried; 503 is retried after a delay.","400 is retried; 503 is not retried; 200 is treated as a failure.","413 is retried after 5 minutes; 403 is retried after 30 seconds.","All 4xx codes are retried; all 5xx codes are dead-lettered immediately."],"answer":[0],"explanation":"Event Grid does not retry 400 (Bad Request) or 413 (Request Entity Too Large); these are dead-lettered immediately. 503 (Service Unavailable) is retried after 30 seconds or more.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-175","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Litware wants events emitted directly by Azure Storage to flow into Event Grid, and separately wants its own application to publish custom business events. The team needs the correct topic type for each and understands that one type exposes no publishing endpoint or keys. Which mapping is correct?","choices":["Use a custom topic for Azure Storage events and a system topic for application events; system topics expose keys.","Use a system topic for Azure Storage events and a custom topic for application events; system topics expose no endpoint or access keys.","Use an event domain for Azure Storage events and a partner topic for application events.","Use a system topic for both, because only system topics support advanced filtering."],"answer":[1],"explanation":"System topics represent events published by Azure services such as Storage, and only Azure services can publish to them, so they expose no endpoint or access keys. Custom topics are for application and third-party events.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-176","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Alpine Ski House is a multitenant SaaS that must publish to thousands of per-customer topics through a single endpoint, apply distinct authorization per customer topic, and avoid managing each topic individually. It also hit the 500-subscription ceiling of a single system topic. Which Event Grid feature is designed for this?","choices":["A single custom topic with advanced filters per subscriber.","An event domain, which offers one publishing endpoint for up to 100,000 topics with per-topic authorization.","A partner topic per customer, published to individually.","A namespace topic with pull delivery for every customer."],"answer":[1],"explanation":"Event domains provide a single publishing endpoint for thousands of individual topics (up to 100,000), with authentication and authorization control per topic, which suits multitenant partitioning and exceeds the single-topic subscription limits.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-177","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Trey Research runs a consumer that is not always online, must control exactly when it reads events, needs the ability to return an already-read event to the broker for later delivery, and must connect over a private endpoint. Which Event Grid delivery model and topic type meet all four needs?","choices":["Push delivery from a custom topic to a webhook.","Pull delivery from a namespace topic, using receive, acknowledge, release, reject, and renew-lock operations.","Push delivery from a system topic to an Azure function.","Pull delivery from a custom topic over a public endpoint."],"answer":[1],"explanation":"Pull delivery, supported on Event Grid namespace topics, lets the consumer control timing, release an already-read event back to the broker for later delivery, and connect using private endpoints. Its operations include receive, acknowledge, release, reject, and renew lock.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-178","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines connects IoT sensors that speak MQTT and must also route selected MQTT messages to Azure Event Hubs for analytics. The team needs the correct Event Grid resource for MQTT ingestion and the mechanism to forward messages onward. Which combination is correct?","choices":["Use a custom topic for MQTT clients and forward with a correlation filter.","Use an Event Grid namespace with topic spaces for MQTT, and route messages to a namespace or custom topic that has an event subscription to Event Hubs.","Use a system topic for MQTT clients and forward with auto-forwarding.","Use an event domain for MQTT clients and forward with a SQL filter."],"answer":[1],"explanation":"MQTT messaging is provided by an Event Grid namespace using topic spaces and clients. MQTT messages can be routed to a namespace topic or a custom topic, from which an event subscription delivers them to destinations such as Event Hubs.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-179","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Consolidated Messenger applies an advanced filter on data.region. Some events omit the key entirely. The team must predict evaluation when the key is absent for a StringIn operator versus a StringNotIn operator. Which behavior is correct?","choices":["Both StringIn and StringNotIn evaluate as matched when the key is missing.","StringIn evaluates as not matched when the key is missing, while StringNotIn evaluates as matched.","Both StringIn and StringNotIn evaluate as not matched when the key is missing.","StringIn evaluates as matched when the key is missing, while StringNotIn evaluates as not matched."],"answer":[1],"explanation":"When the event JSON does not contain the advanced filter key, most operators including StringIn evaluate as not matched, while the negative operators NumberNotIn and StringNotIn evaluate as matched.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-180","obj":"3.1.1","difficulty":"hard","type":"single","stem":"First Up Consultants wants advanced filtering to compare against values held in an array field of the event data, and to confirm which value types Event Grid can filter on. Which configuration and constraint pair is correct?","choices":["Set enableAdvancedFilteringOnArrays to true; Event Grid can filter on strings, booleans, numbers, and arrays of the same type, but not arrays of objects.","Set enableAdvancedFilteringOnArrays to true; Event Grid can filter on arrays of objects as well as primitives.","No setting is needed; array filtering is always enabled by default and supports mixed-type arrays.","Set enableAdvancedFilteringOnArrays to false; Event Grid can filter only on single scalar values, never arrays."],"answer":[0],"explanation":"To filter against array-valued keys you must set enableAdvancedFilteringOnArrays to true. Event Grid supports filtering on String, Boolean, Number, and arrays of the same type, but does not support filtering on an array of objects.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-181","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Munson's Pickles publishes events in the CloudEvents 1.0 schema and wants an advanced filter keyed on the event's category attribute and, separately, on the producer identity attribute. Which CloudEvents key names should the filters reference?","choices":["eventType for category and topic for producer identity.","type for category and source for producer identity.","subject for category and id for producer identity.","dataVersion for category and eventTime for producer identity."],"answer":[1],"explanation":"For events in the CloudEvents schema, advanced filter keys include id, source, type, and dataschema. The event category maps to type, and the producer identity maps to source.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-182","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Best For You Organics stores workflow progress in Service Bus session state. The operations team asks how long the state survives and what to do when a workflow ends. Which pair of statements is correct?","choices":["Session state is discarded automatically once all messages in the session are consumed; no cleanup is needed.","Session state persists until explicitly cleared by setting it to null, and it counts toward the entity's storage quota, so it should be cleaned up when the workflow finishes.","Session state expires after the session lock duration and must be renewed constantly.","Session state is stored per message and is removed when each message is completed."],"answer":[1],"explanation":"Session state remains as long as it is not cleared (by setting it to null), even after all messages in a session are consumed. It counts toward the entity's storage quota, so applications should clean up retained state when finished to avoid management cost.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-183","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Coho Winery writes a Service Bus SQL filter that must test a system property together with a custom application property. The team must reference the system property correctly in the SQL-like expression. Which expression is valid?","choices":["Label = 'urgent' AND StoreName = 'east' (system property with no prefix).","sys.Label = 'urgent' AND StoreName = 'east' (system property prefixed with sys.).","body.Label = 'urgent' AND StoreName = 'east' (reading the message body).","$Label = 'urgent' AND $StoreName = 'east' (both prefixed with a dollar sign)."],"answer":[1],"explanation":"In a Service Bus SQL filter, system properties must be prefixed with sys. in the conditional expression, while user-defined properties are referenced by name directly.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-184","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fabrikam Retail defines a correlation filter that sets both CorrelationId and a custom property prop1. The team needs to predict how the two conditions combine and whether string matching is case-sensitive. Which is correct?","choices":["The conditions combine as a logical OR, and string comparison is case-insensitive.","The conditions combine as a logical AND, and string comparison is case-sensitive.","Only the CorrelationId is evaluated; the custom property is ignored.","The conditions combine as a logical AND, and string comparison is case-insensitive."],"answer":[1],"explanation":"A correlation filter with multiple match properties combines them as a logical AND, so all specified conditions must match. For string expressions the comparison is case-sensitive.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-185","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Wingtip Surveys sets a short event time to live on an Event Grid subscription. An event's TTL elapses while it is waiting between backoff attempts. When does Event Grid actually detect the expiry and dead-letter the event?","choices":["The instant the TTL elapses, regardless of the retry schedule.","Only at the next scheduled delivery attempt, when expiry is checked and the event is then dead-lettered.","After a fixed 24-hour grace period following TTL expiry.","Never, because TTL does not apply once delivery has started."],"answer":[1],"explanation":"Event Grid checks the time-to-live expiration only at the next scheduled delivery attempt. Even if TTL expires earlier, expiry is evaluated at that next attempt and the event is then dead-lettered.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-186","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Analytics consumes events with Event Grid pull delivery from a namespace topic. To acknowledge or release a received event, the consumer must send back a specific token, and each event is delivered in a specific CloudEvents content mode. Which pair is correct?","choices":["A brokerProperties lock token; the CloudEvent is delivered in structured content mode.","A LockToken GUID from Service Bus; the CloudEvent is delivered in binary content mode.","A SequenceNumber; the CloudEvent is delivered as an Event Grid schema payload.","A subscription key; the CloudEvent is delivered as a custom schema payload."],"answer":[0],"explanation":"In pull delivery, Event Grid returns an array where each entry includes the event and a brokerProperties object containing the lock token used to acknowledge, release, or reject. The event value is the CloudEvent delivered in structured content mode.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-187","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Adventure Cycles processes messages in Python and defers one for later handling, saving the value it needs to retrieve it afterward. Complete the code so the correct value is stored for later retrieval by sequence number.\n\n```\nreceived = await receiver.receive_messages(max_message_count=1)\nmsg = received[0]\nawait receiver.defer_message(msg)\n# Save this value to fetch the deferred message later:\ndeferred_key = msg.________\n```","choices":["lock_token","sequence_number","message_id","delivery_count"],"answer":[1],"explanation":"To retrieve a deferred message you must save its service-assigned sequence_number, which is later passed to receive_deferred_messages. The other members do not identify a deferred message for retrieval.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-188","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Tailwind Bank must guarantee that a message is redelivered if the worker crashes before settling it, so the consumer settles messages explicitly. Complete the receiver creation to select the mode that supports explicit settlement.\n\n```\nreceiver = client.get_queue_receiver(\n    queue_name=\"payments\",\n    receive_mode=ServiceBusReceiveMode.________\n)\n```","choices":["RECEIVE_AND_DELETE","PEEK_LOCK","DELETE_ON_RECEIVE","AT_MOST_ONCE"],"answer":[1],"explanation":"PEEK_LOCK locks the message and requires explicit settlement, so an unsettled message is redelivered if the worker crashes. This is the at-least-once mode.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-189","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Fourth Coffee schedules a message and later cancels it before its enqueue time. Complete the code so cancellation targets the correct value returned by the schedule call.\n\n```\nseq = await sender.schedule_messages(message, enqueue_time_utc)\n# Later, cancel the scheduled message:\nawait sender.cancel_scheduled_messages(________)\n```","choices":["message.message_id","seq","message.lock_token","enqueue_time_utc"],"answer":[1],"explanation":"The schedule call returns the scheduled message's sequence number, which is passed to cancel_scheduled_messages to cancel it while it is still in the scheduled state.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-190","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Blue Yonder wants an Event Grid advanced filter that matches only when data.temperature is strictly greater than 100. Complete the operatorType so the filter compares numerically as greater-than.\n\n```\n{\n  \"advancedFilters\": [{\n    \"operatorType\": \"________\",\n    \"key\": \"data.temperature\",\n    \"value\": 100\n  }]\n}\n```","choices":["NumberGreaterThanOrEquals","NumberGreaterThan","NumberIn","StringContains"],"answer":[1],"explanation":"NumberGreaterThan performs a strict greater-than numeric comparison against a single value, matching only when data.temperature exceeds 100.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-191","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Northwind IoT publishes CloudEvents and wants an advanced filter that matches when the event's producer identity attribute begins with a fixed prefix. Complete the key so it references the correct CloudEvents attribute for producer identity.\n\n```\n{\n  \"advancedFilters\": [{\n    \"operatorType\": \"StringBeginsWith\",\n    \"key\": \"________\",\n    \"values\": [ \"/factory/line-3\" ]\n  }]\n}\n```","choices":["subject","source","topic","id"],"answer":[1],"explanation":"In the CloudEvents schema the producer identity is carried in the source attribute, so the filter key should be source. Valid CloudEvents filter keys include id, source, type, and dataschema.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-192","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Wide World Importers designs a Service Bus solution with these separate requirements: (1) guarantee strict FIFO for related messages, and (2) collapse duplicate sends from a retrying producer. Which TWO features address these two requirements, one each?","choices":["Enable message sessions and group related messages by SessionId.","Enable duplicate detection with an appropriate history window.","Enable auto-forwarding to a second queue.","Increase the prefetch count on the receiver.","Enable dead-lettering on message expiration."],"answer":[0,1],"explanation":"Message sessions provide the FIFO guarantee for messages sharing a SessionId, satisfying requirement 1. Duplicate detection collapses repeated sends of the same MessageId within a window, satisfying requirement 2.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-193","obj":"3.1.1","difficulty":"easy","type":"multi","stem":"Contoso Freight investigates why messages appear on a subscription's dead-letter queue. Which TWO of the following are genuine system triggers that move a message to the dead-letter queue?","choices":["The message exceeds the maximum delivery count.","A subscription filter evaluation fails for the message.","The receiver completes the message successfully.","The producer sets a high CorrelationId value.","The message is deferred by sequence number."],"answer":[0,1],"explanation":"Messages move to the dead-letter queue when they exceed the maximum delivery count and when a subscription filter evaluation fails (in addition to TTL expiry with dead-lettering enabled).","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-194","obj":"3.1.1","difficulty":"medium","type":"multi","stem":"Fabrikam Events reviews how its Event Grid webhook responses affect delivery. Which TWO HTTP status codes cause Event Grid to stop retrying and schedule the event for dead-lettering immediately?","choices":["400 Bad Request","413 Request Entity Too Large","408 Request Timeout","503 Service Unavailable","200 OK"],"answer":[0,1],"explanation":"Event Grid immediately schedules an event for dead-lettering on 400 (Bad Request) and 413 (Request Entity Too Large), because these indicate delivery will never succeed.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-195","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Relecloud evaluates Event Grid namespace topics. Which TWO statements about namespace topics are correct?","choices":["Namespace topics support pull delivery, letting consumers receive, acknowledge, release, and reject events.","Namespace topics support push delivery to destinations such as Azure Event Hubs.","Namespace topics can be published to only by Azure services, never by applications.","Namespace topics deliver events using the Event Grid schema exclusively, not CloudEvents.","Namespace topics require an event domain to exist first."],"answer":[0,1],"explanation":"Namespace topics support both pull delivery (with receive, acknowledge, release, reject, and renew-lock operations) and push delivery to destinations such as Event Hubs.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-196","obj":"3.1.1","difficulty":"easy","type":"multi","stem":"Woodgrove Markets wants an atomic operation that receives an input message and sends a result via a transfer entity in the same namespace. Which TWO statements about Service Bus transactions and send-via are correct?","choices":["A Service Bus transaction times out after 2 minutes from its first operation.","When the input is a topic subscription, the transfer entity used for send-via must be a topic.","Transactions can span entities in two different namespaces if cross-entity transactions are enabled.","The transferred message is committed to and visible in the transfer entity before moving to the destination.","Duplicate detection is required for any send-via transaction."],"answer":[0,1],"explanation":"A Service Bus transaction times out after 2 minutes measured from the first operation, and when receiving from a subscription the transfer entity for send-via must be a topic.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-197","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Contoso streams IoT telemetry to an event hub that has 8 partitions. A real-time scoring service and a nightly archival service must each read the full stream independently, and within each service no partition may deliver duplicate events to two active receivers. What must Contoso do?","choices":["Create two consumer groups, one per service, and keep only one active reader per partition within each group.","Create a single consumer group and run two EventProcessorClient instances that both read every partition.","Create two consumer groups but run five concurrent readers per partition in each group to guarantee no duplicates.","Use the $Default consumer group for both services and raise the partition count to 16."],"answer":[0],"explanation":"A consumer group is an independent view of the stream, so each service needs its own group to read the full stream at its own pace. Within a group, one active reader per partition avoids duplicate delivery. A single shared group makes the two services compete for the same partition leases; they do not each get an independent full view, and two active readers on a partition receive duplicate events. Up to five concurrent readers per partition per group is allowed, but every active reader receives all events for that partition, so five readers guarantee duplicates rather than prevent them. Sharing $Default still gives both services one combined view, and partition count does not create independent stream views.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-198","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Fabrikam runs a standalone AMQP consumer built on EventProcessorClient. After a host crash, a replacement instance must resume exactly where the previous reader stopped, and the position must survive process restarts across machines. Which statement is correct?","choices":["The Event Hubs service persists each consumer's position server-side per consumer group automatically.","The producer stamps a durable checkpoint offset onto every event it sends.","Checkpointing is the consumer's responsibility; the offset must be persisted to an external store such as Azure Blob Storage.","Checkpoints are embedded in the event payload and replayed by the service on reconnect."],"answer":[2],"explanation":"In AMQP, checkpointing is the consumer's responsibility. The service supplies offsets, but consumers must store checkpoints externally (commonly Azure Blob Storage) so a new reader can resume from the last committed position. The service provides offsets but does not persist the consumer's committed position; consumers store their own checkpoints. Producers do not write checkpoints; the position is a consumer-side cursor. Checkpoints are not carried in the payload; they are stored in an external checkpoint store.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-199","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Northwind must reprocess about two hours of events that were already checkpointed as complete, after fixing a downstream bug, without dropping newly arriving events and without changing the producer. What is the supported approach?","choices":["Delete the affected events from the partition and ask the producer to resend them.","Start a reader at an earlier offset (or enqueued time) so it re-reads events previously marked complete.","Reduce the retention period to force the stream to replay from the beginning.","Copy the checkpoint blob to a premium storage account to reset the cursor."],"answer":[1],"explanation":"Checkpointing enables replay: a consumer can return to older data by specifying a lower offset (or an enqueued timestamp), re-reading events previously marked complete while the live stream continues. Events cannot be explicitly deleted from an event hub; they age out only by retention policy. Lowering retention removes data rather than replaying it, and does not reprocess a specific two-hour window. Event Hubs Capture and checkpoints do not support premium storage accounts, and moving a blob does not perform a controlled replay.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-200","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Tailwind Traders runs three consumer-group applications that all checkpoint to one storage account. To avoid lease contention and corrupted checkpoints, which configuration is recommended?","choices":["Share one container across all three consumer groups and enable blob versioning.","Enable hierarchical namespace on the container so leases resolve faster.","Store checkpoints and application data together in one container to reduce cost.","Use a separate container per consumer group and disable hierarchical namespace, blob soft delete, and versioning."],"answer":[3],"explanation":"The guidance is one container per consumer group, dedicated to checkpoints, with hierarchical namespace, soft delete, and versioning disabled to prevent lease and checkpoint issues. A shared container across groups invites lease contention, and versioning is explicitly recommended to be disabled. Hierarchical namespace (Data Lake Gen2) is recommended to be disabled for a checkpoint store. The container should not be used for anything other than checkpoints for that consumer group.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-201","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Relecloud enables Event Hubs Capture to archive a stream for batch analytics and requires the default format that Capture writes directly, with no additional tooling. Which format is produced?","choices":["Apache Avro, the default compact binary format with inline schema.","Parquet, written directly by Capture with no extra tooling.","JSON Lines, one event per line.","CSV with a header row per blob."],"answer":[0],"explanation":"Event Hubs Capture writes Apache Avro by default, a compact binary format with inline schema. Parquet output is available only through the no-code editor in the portal, not written directly by Capture itself. JSON Lines is not a Capture output format. CSV is not a Capture output format.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-202","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank configures an Event Hubs Capture window of 15 minutes and 100 MB and ingests roughly 1 MB per second. Which condition triggers each capture, and how are blobs written?","choices":["The time window always wins, so a single blob is written every 15 minutes for all partitions.","Both the size and time conditions must be met before any blob is written.","The first condition met wins; at about 1 MB/second the 100 MB size window fires before 15 minutes, and each partition writes its own block blob.","Capture waits for the size window only and ignores the time window entirely."],"answer":[2],"explanation":"Capture uses a first-wins policy between size and time. At ~1 MB/sec, 100 MB is reached in under 15 minutes, so size triggers first, and each partition captures independently into its own block blob. Time does not always win; whichever limit is reached first triggers capture, and capture is per partition, not a single combined blob. It is first-wins (either condition), not both-required. Both windows are active; the time window still applies as a ceiling.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-203","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Proseware needs Event Hubs Capture included at no separate charge and wants Capture traffic to not consume the namespace egress quota that Stream Analytics relies on. Which statement is accurate?","choices":["Capture is included in the Standard tier and draws from the same egress quota as readers.","Capture is included in the Premium and Dedicated tiers and copies data internally, bypassing egress quota.","Capture requires the Basic tier and shares egress quota with consumers.","Capture is billed only in Dedicated and always doubles egress usage."],"answer":[1],"explanation":"Capture is included in Premium and Dedicated (priced separately in Standard). It copies data directly from internal Event Hubs storage, bypassing throughput/processing unit egress quotas. In Standard, Capture is priced separately (not included), and it does not consume egress quota. The Basic tier does not support Capture at all. Capture is included in both Premium and Dedicated and does not consume egress quota.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-204","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Litware wants to move existing Apache Kafka producer and consumer apps to Event Hubs with the least effort while preserving partitioned-consumer semantics. Which statement about the Event Hubs Kafka endpoint is true?","choices":["Kafka clients must be rewritten to the AMQP SDK because Kafka clients are unsupported.","Every broker in the cluster must be added to the firewall individually for the Kafka clients to connect.","The Kafka endpoint disables consumer groups and offset management.","Kafka clients connect with configuration changes only, and each partition is owned by exactly one consumer member per group at a time."],"answer":[3],"explanation":"Event Hubs exposes a Kafka-compatible endpoint, so existing Kafka clients connect with configuration changes only. Partition ownership is equivalent to Kafka: one member per partition per group, with extra members idle until a rebalance. No code changes are required; Kafka clients are supported natively. Event Hubs uses a single stable virtual IP endpoint, so per-broker firewall rules are unnecessary. Consumer groups and offset management are supported over the Kafka endpoint.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-205","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee runs a Standard-tier namespace with Auto-Inflate enabled, while a partner team runs a Premium namespace. How is scale controlled in each namespace?","choices":["Standard scales by throughput units (Auto-Inflate can raise them automatically); Premium scales by processing units.","Both tiers scale by throughput units, and Auto-Inflate applies to both.","Standard scales by capacity units; Premium scales by throughput units.","Premium scales by throughput units; Standard scales by processing units."],"answer":[0],"explanation":"Standard scale is controlled by throughput units, which Auto-Inflate can raise automatically. Premium scale is controlled by processing units, which you can increase per namespace. Premium uses processing units, not throughput units, and Auto-Inflate is a Standard-tier feature for throughput units. Capacity units are the unit for Dedicated clusters, not Standard. The units are reversed: Standard uses throughput units and Premium uses processing units.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-206","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Blue Yonder Airlines must guarantee that all events for a given aircraft tail number are processed in arrival order, while events for different aircraft can be processed in parallel. Without sending directly to a specific partition, what should the producer do?","choices":["Omit the partition key so Event Hubs round-robins events for higher availability.","Set the partition key to the tail number so related events hash to the same partition and stay ordered.","Send every event to partition 0 to force a single global order.","Use a fresh random GUID as the partition key for every event."],"answer":[1],"explanation":"A partition key is hashed to a partition, keeping all events with the same key in one partition and in arrival order, while different keys spread across partitions for parallelism. Omitting the key round-robins events, which loses per-tail ordering. Sending everything to one partition is direct-to-partition targeting, which degrades availability to partition level and serializes all aircraft, not just one. A random GUID per event scatters a single aircraft's events across partitions, destroying ordering.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-207","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Coho Vineyard relies on partition-key hashing for per-key ordering and is considering dynamically adding partitions on a Premium namespace to increase throughput. What is the documented caveat?","choices":["Existing data automatically reshuffles to match the new partition count.","You can decrease the partition count afterward to reverse any impact.","Adding partitions breaks key hashing for messages hashed after the change, so ordering by key is no longer guaranteed across the change.","Partition-count changes are silently ignored by all producer and consumer clients."],"answer":[2],"explanation":"Adding partitions changes the hash mapping. Existing data keeps its order, but messages hashed after the change can land differently, so dynamically adding partitions is not recommended when you depend on key-based ordering. Existing data is not reshuffled; only the mapping for new messages changes. Partition count cannot be decreased once increased. Clients receive a messaging exception and reopen links to pick up the new metadata; the change is not ignored.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-208","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Trey Research plans consumer scale-out for a single consumer group where the degree of parallelism must equal the number of concurrent partition readers. Which factor sets the ceiling on that parallelism?","choices":["The number of throughput units purchased.","The number of consumer groups defined on the event hub.","The event retention period in days.","The number of partitions, which equals the maximum number of parallel consumers per consumer group."],"answer":[3],"explanation":"Parallelism per consumer group is bounded by the partition count: the number of partitions equals the maximum number of concurrent consumers per group. Throughput units govern ingress/egress capacity, not the maximum number of concurrent partition readers. More consumer groups add independent views, not more parallel readers within one group. Retention controls how long data is kept, not consumer parallelism.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-209","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel needs a serverless Functions host that both scales to zero when idle and integrates with a virtual network to reach a resource behind a private endpoint. Which plan is the minimal fit?","choices":["Consumption plan.","Premium plan.","Flex Consumption plan.","Dedicated (App Service) plan."],"answer":[2],"explanation":"Flex Consumption supports both scale-to-zero and virtual network integration, which the classic Consumption plan cannot do. The Consumption plan scales to zero but does not support virtual network integration. The Premium plan supports virtual networks but keeps at least one instance and does not scale to zero. The Dedicated plan does not scale to zero and is not serverless.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-210","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Alpine Ski House needs perpetually warm instances to eliminate cold starts for a latency-sensitive HTTP API and accepts that at least one instance is always billed. Which plan and setting match?","choices":["Premium plan using always-ready and prewarmed instances, with a minimum of one billed instance.","Consumption plan, which prewarms placeholder instances so cold starts never occur.","Flex Consumption with always-ready set to zero.","Flex Consumption on-demand mode with no always-ready instances."],"answer":[0],"explanation":"The Premium plan combines always-ready and prewarmed instances to eliminate cold starts, and it always has at least one active, billed instance. The Consumption plan can still scale to zero and incur cold starts; placeholders reduce but do not eliminate them. Always-ready of zero means the app can scale to zero and experience cold starts. On-demand mode with no always-ready instances allows scale-to-zero and cold starts.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-211","obj":"3.1.1","difficulty":"easy","type":"single","stem":"VanArsdel targets the Flex Consumption plan for a Python function app and must confirm the platform and maximum scale-out before committing. Which pairing is correct?","choices":["Windows and Linux are both supported; scale-out maximum is 200 instances.","Linux only; scale-out maximum is 1,000 instances.","Windows only; scale-out maximum is 100 instances.","Linux only; scale-out maximum is 30 instances."],"answer":[1],"explanation":"Flex Consumption is Linux only and scales out to a maximum of 1,000 instances. Flex Consumption does not support Windows, and its maximum is 1,000, not 200. Flex Consumption is Linux only, not Windows only. A 30-instance ceiling corresponds to a Dedicated plan, not Flex Consumption.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-212","obj":"3.1.1","difficulty":"medium","type":"single","stem":"First Up Consultants wants a Functions runtime-enforced retry policy (not extension-level dead-lettering) applied to a trigger. For which trigger type is a runtime retry policy supported?","choices":["Azure Blob Storage trigger.","Azure Service Bus trigger.","Azure Event Hubs trigger.","Azure Queue Storage trigger."],"answer":[2],"explanation":"Runtime retry policies are supported for Azure Cosmos DB, Event Hubs, Kafka, and Timer triggers. Blob Storage uses binding-extension retry behavior (poison blobs), not a runtime retry policy. Service Bus uses binding-extension behavior configured in host.json, not a runtime retry policy. Queue Storage uses binding-extension poison-message handling, not a runtime retry policy.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-dead-letter-queues"},{"id":"3.1.1-213","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Best For You Organics adds an exponential-backoff retry policy to an Event Hubs-triggered function. What is the documented effect on the affected partition while retries are in progress?","choices":["A checkpoint is written before each retry, so the partition keeps advancing during retries.","Event Hubs checkpoints are not written until the retry policy finishes, so progress on that partition is paused until the batch completes.","The failing batch is immediately moved to a dead-letter queue.","The retry count is persisted durably and is never reset if the instance fails."],"answer":[1],"explanation":"Event Hubs checkpoints are not written until the retry policy for the execution finishes, so processing on the specific partition is paused until the current batch is done. Checkpoints are withheld during retries, not written before each attempt. Event Hubs retry does not move batches to a dead-letter queue; that is a Service Bus concept. The retry count is stored in the instance's memory and is lost (reset to zero) if the instance fails.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-214","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Graphic Design Institute uses fan-out/fan-in to process thousands of images in parallel and then aggregate the results. They find the aggregation (fan-in) step is a bottleneck. Which statement and remedy are correct?","choices":["Fan-in runs across all instances, so adding throughput units speeds it up.","Fan-in is limited by the number of consumer groups; add more groups.","Fan-in runs in a single orchestrator instance on a single VM; subdivide the fan-out across sub-orchestrations.","Fan-in requires switching to the monitor pattern to parallelize aggregation."],"answer":[2],"explanation":"Unlike fan-out, fan-in runs in a single orchestrator instance on one VM. To relieve fan-in pressure, subdivide the activity fan-out across multiple sub-orchestrations. Throughput units are an Event Hubs concept and do not apply to Durable Functions fan-in. Consumer groups are an Event Hubs concept unrelated to Durable fan-in performance. The monitor pattern is for recurring polling, not for parallelizing an aggregation.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-215","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Lamna Healthcare builds an approval workflow that notifies an approver, waits up to 24 hours for a decision, and auto-rejects on timeout. Which Durable Functions construct combination implements this?","choices":["A durable timer raced against an external event: process the event if it arrives first, otherwise handle the timeout.","A monitor pattern that polls a database every minute for the decision.","A fan-out/fan-in that calls task_all across all possible approvers.","An eternal orchestration that only calls continue-as-new."],"answer":[0],"explanation":"The human-interaction pattern starts a durable timer and simultaneously waits for an external event. If the person responds first, the response is processed; if the timer fires first, the timeout path runs. Polling a database is the monitor pattern and does not model an approver responding within a time limit via external events. task_all aggregates parallel activities and does not implement a timer-versus-response race. Continue-as-new keeps memory bounded in eternal orchestrations but does not implement a timed approval wait.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-216","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Wide World Importers uses a durable entity as a per-customer counter that many callers update concurrently. Which guarantee prevents race conditions on the entity's state?","choices":["Entity operations execute serially, one operation at a time per entity.","Operations run in parallel and the runtime merges state with last-writer-wins.","Callers must take an external distributed lock before every update.","The entity replicates its state across partitions to allow concurrent writes."],"answer":[0],"explanation":"Durable entity operations run serially (single-threaded) per entity, so operations queue and execute one at a time, preventing race conditions. Entities do not run operations in parallel with a merge; they serialize operations per entity. Serialization is built in; an external distributed lock is not required for single-entity updates. An entity's state is not replicated across partitions for concurrent writes; operations are serialized.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-217","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Adventure Works has a client function that must increment a durable entity without needing a return value, and an orchestrator that must read the entity's current value within the same workflow. Which access pattern is correct?","choices":["The client calls the entity (two-way) and the orchestrator signals it (one-way).","The client signals the entity (one-way, fire-and-forget); the orchestrator calls the entity (two-way) to obtain the value.","Both the client and the orchestrator must call the entity to change its state.","Both must signal the entity; obtaining a return value is never possible."],"answer":[1],"explanation":"Signaling is one-way (no return), which fits the client's increment. Calling is two-way and returns a value, which only orchestrators can do, so the orchestrator calls to read the value. Reversed: client functions cannot call (two-way) entities, and signaling returns no value for the orchestrator's read. Client functions cannot call entities; they can only signal or read state. Orchestrators can call entities and receive a return value, so it is possible.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-218","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Coho Winery wants a plain client function to obtain, synchronously, the exact in-memory result of a durable entity operation. Why is this not possible?","choices":["Client functions can call entities, but only in the Premium plan.","Client functions can read in-memory state but cannot signal.","Client functions can only signal entities (no return) and read the last committed persisted state; only orchestrations can call entities or read in-memory state.","Client functions must use fan-out/fan-in to retrieve entity results."],"answer":[2],"explanation":"Clients can only signal entities (one-way, no result) and read the last committed persisted state, which can be stale. Only orchestrations can call an entity for a result or read its in-memory state. The plan does not grant clients the ability to call entities; that capability belongs to orchestrations. Clients can signal and read persisted state; they cannot read in-memory state. Fan-out/fan-in aggregates activities and does not let a client read an entity's in-memory result.","ref":"https://learn.microsoft.com/azure/azure-functions/durable/durable-functions-overview"},{"id":"3.1.1-219","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Contoso deploys API Management on the Consumption tier and wants to throttle per calling application using a custom counter-key expression. Which policy is unavailable at that tier, and what is the workaround?","choices":["rate-limit-by-key is unavailable in Consumption; use rate-limit (limit call rate by subscription), which requires a subscription key.","rate-limit (by subscription) is unavailable in Consumption; use rate-limit-by-key instead.","quota-by-key is available in Consumption, so use it in place of rate-limit-by-key.","All rate-limiting policies are unavailable in the Consumption tier."],"answer":[0],"explanation":"rate-limit-by-key and quota-by-key are not available in the Consumption tier. The subscription-scoped rate-limit policy is available there, but it depends on a subscription key. Reversed: the subscription-scoped rate-limit policy is available in Consumption, while rate-limit-by-key is not. quota-by-key is also unavailable in Consumption. The subscription-scoped rate-limit policy is available in Consumption, so not all rate limiting is blocked.","ref":"https://learn.microsoft.com/azure/api-management/api-management-key-concepts"},{"id":"3.1.1-220","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fabrikam runs a self-hosted API Management gateway in Kubernetes, and one configured policy is not supported by the self-hosted gateway. What happens at runtime?","choices":["The gateway refuses to start until the unsupported policy is removed.","The unsupported policy is skipped during policy execution.","The request is forwarded to the managed cloud gateway to run the policy.","The policy runs but returns HTTP 500 for every call."],"answer":[1],"explanation":"Configured policies that are not supported by the self-hosted gateway are skipped during policy execution. The gateway still starts and runs; it simply skips the unsupported policy. Requests are not rerouted to the managed gateway to execute a skipped policy. A skipped policy does not force a 500; execution continues without it.","ref":"https://learn
