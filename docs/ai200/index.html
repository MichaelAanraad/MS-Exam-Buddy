 which enforce conditional replace.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-208","obj":"2.1.1","difficulty":"easy","type":"single","stem":"The Phone Company runs a transactional batch in the Azure Cosmos DB Python SDK and wants the replace operation to apply optimistic concurrency using a stored ETag. Complete the operation keyword argument. Which key fills the blank?\n\n```\nbatch_operations = [\n    (\"replace\", (item_id, item_body), {\"________\": etag}),\n]\ncontainer.execute_item_batch(batch_operations, partition_key=pk)\n```","choices":["filter_predicate","consistency_level","if_none_match_etag","if_match_etag"],"answer":[3],"explanation":"The if_match_etag key applies the If-Match optimistic-concurrency check to the replace operation inside the batch, so it succeeds only when the server ETag matches. filter_predicate is for conditional patch operations; consistency_level is not a valid batch operation kwarg; if_none_match_etag is used to detect change on reads, not to guard a replace.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-209","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Contoso Suites sets a 30-minute integrated cache staleness on an Azure Cosmos DB for NoSQL query in the .NET SDK. Complete the dedicated gateway request options. Which property fills the blank?\n\n```\nQueryRequestOptions options = new QueryRequestOptions\n{\n    DedicatedGatewayRequestOptions = new DedicatedGatewayRequestOptions\n    {\n        ________ = TimeSpan.FromMinutes(30)\n    }\n};\n```","choices":["MaxIntegratedCacheStaleness","BypassIntegratedCache","MaxStaleness","CacheStalenessWindow"],"answer":[0],"explanation":"MaxIntegratedCacheStaleness on DedicatedGatewayRequestOptions sets how stale cached data may be before the integrated cache refreshes it. BypassIntegratedCache is a boolean that skips the cache; MaxStaleness and CacheStalenessWindow are not members of DedicatedGatewayRequestOptions.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-210","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Adatum reads the Azure Cosmos DB for NoSQL change feed with the .NET pull model, using the ChangeFeedItem data model and starting from the current time to capture creates, updates, and deletes. Complete the mode. Which enum value fills the blank?\n\n```\nFeedIterator<ChangeFeedItem<Order>> iterator =\n    container.GetChangeFeedIterator<ChangeFeedItem<Order>>(\n        ChangeFeedStartFrom.Now(),\n        ChangeFeedMode.________);\n```","choices":["Incremental","LatestVersion","AllVersionsAndDeletes","FullFidelity"],"answer":[2],"explanation":"The ChangeFeedItem data model together with ChangeFeedStartFrom.Now() is the all-versions-and-deletes pattern, selected with ChangeFeedMode.AllVersionsAndDeletes, which captures creates, updates, and deletes. Incremental and LatestVersion both mean latest version mode, which returns the plain item model and no deletes; FullFidelity is not the current enum name for this mode.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-211","obj":"2.1.1","difficulty":"easy","type":"multi","stem":"Best For You Organics Company plans to use transactional batches in Azure Cosmos DB for NoSQL. Which two statements are true of a transactional batch? (Select two.)","choices":["Pre-triggers and post-triggers can be included in the same batch","All operations must share one partition key value","The batch can span multiple physical partitions atomically","The batch is limited to a maximum of 100 operations","The batch payload has no size limit"],"answer":[1,3],"explanation":"A transactional batch operates on items that share a single partition key value and is limited to a maximum of 100 operations. Pre-triggers and post-triggers cannot be part of a transactional batch; a batch is scoped to one logical partition and cannot span physical partitions; the payload is limited to 2 MB, not unlimited.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-212","obj":"2.1.1","difficulty":"medium","type":"multi","stem":"Adatum evaluates autoscale versus manual throughput for an Azure Cosmos DB for NoSQL container. Which two statements about autoscale are correct? (Select two.)","choices":["The system scales the throughput between 0.1 times Tmax and Tmax","Billing uses the average RU/s consumed during the hour","In single-write-region accounts the autoscale rate is 1.5 times the manual rate","In multi-region-write accounts the autoscale rate is 2 times the manual rate","Autoscale is available only in serverless accounts"],"answer":[0,2],"explanation":"Autoscale scales instantaneously between 0.1 times the maximum and the maximum, and in single-write-region accounts the autoscale per-RU rate is 1.5 times the manual rate. Billing uses the highest RU/s the system scaled to in the hour, not the average; in multi-region-write accounts the autoscale rate equals the manual rate; autoscale is a provisioned throughput mode, distinct from serverless.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-213","obj":"2.1.1","difficulty":"hard","type":"multi","stem":"Contoso configures vector search on an Azure Cosmos DB for NoSQL container. Which two statements about vector indexes are correct? (Select two.)","choices":["Vector policies can be modified in place after creation","The flat index type supports at most 505 dimensions","The flat index type produces approximate results","Vector search is supported on shared (database) throughput accounts","quantizedFlat and DiskANN support up to 4,096 dimensions"],"answer":[1,4],"explanation":"The flat index type supports at most 505 dimensions, and quantizedFlat and DiskANN support up to 4,096 dimensions. Vector policies and indexes are immutable after creation; the flat index is exact brute-force with 100 percent recall, not approximate; vector search is not supported on shared-throughput accounts.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-214","obj":"2.1.1","difficulty":"easy","type":"multi","stem":"Fabrikam reads from an Azure Cosmos DB for NoSQL account through the dedicated gateway and integrated cache. Which two statements are correct? (Select two.)","choices":["Cache hits charge 0 request units","The client must use direct mode to reach the integrated cache","The integrated cache is available for all Azure Cosmos DB APIs","Only session and eventual consistency reads are served from the cache","Setting MaxIntegratedCacheStaleness to 0 forces unlimited caching"],"answer":[0,3],"explanation":"Point reads and queries that hit the integrated cache charge 0 request units, and only session and eventual consistency reads are eligible to be served from the cache. Reaching the integrated cache requires gateway mode through the dedicated gateway, not direct mode; the integrated cache is API for NoSQL only; a MaxIntegratedCacheStaleness of 0 means the read never uses the cache.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-215","obj":"2.1.1","difficulty":"medium","type":"multi","stem":"Litware reviews consistency behavior for an Azure Cosmos DB for NoSQL account that uses multiple write regions. Which two statements are correct? (Select two.)","choices":["A per-request override can strengthen consistency above the account default","Bounded staleness reads cost the same request units as eventual reads","Strong consistency is not available with multiple write regions","Only strong consistency is available with multiple write regions","Strong and bounded staleness reads cost roughly double the request units of session reads"],"answer":[2,4],"explanation":"Strong consistency is not available with multiple write regions, and strong or bounded staleness reads cost roughly double the request units of the more relaxed levels such as session. A per-request override can only relax consistency below the account default, never strengthen it; bounded staleness reads cost about double, not the same as, eventual reads; four levels remain available with multiple write regions, and strong is the one excluded.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-216","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Contoso Ltd. generates 3072-dimension embeddings with text-embedding-3-large and wants an HNSW index over that column. What is the correct expectation?","choices":["The vectors can be stored but cannot be indexed by ivfflat or hnsw, so dimensionality reduction to 2000 or fewer dimensions is required","Raising maintenance_work_mem lifts the dimension ceiling and allows the index","The vectors cannot even be stored in a vector column at 3072 dimensions","Declaring the column as vector(3072) removes the indexing limit"],"answer":[0],"explanation":"pgvector allows storing high-dimension vectors but ivfflat and hnsw indexes are capped at 2000 dimensions, so you must reduce dimensionality to index them. maintenance_work_mem controls build memory, not the dimension ceiling. Vectors above 2000 dimensions store fine; only indexing is blocked. Declaring vector(3072) is exactly what triggers the index dimension error.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-217","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Tailwind Traders bulk-loads 5 million rows and then creates an IVFFlat index. Why does loading before indexing matter more for IVFFlat than for the graph-based methods?","choices":["IVFFlat trains its list centroids on the existing data, so building on an empty or partial table produces unbalanced lists and poor recall","IVFFlat cannot be created at all on a non-empty table","IVFFlat rebuilds itself automatically on every insert regardless of load order","IVFFlat requires the data to be sorted by primary key before indexing"],"answer":[0],"explanation":"IVFFlat has a training step that partitions vectors into lists based on the data present at build time, so it should be built after the data is loaded. IVFFlat can be built on a populated table, which is the recommendation. It does not auto-rebuild on inserts, which is why recall drifts over time. Primary-key sorting is not a requirement.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-218","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Fabrikam Inc. wants to raise recall for the vector queries in one reporting session without rebuilding the HNSW index and without changing behavior for other connections. What should they do?","choices":["Recreate the index with a larger m value","Increase ef_construction on the existing index","Run SET LOCAL hnsw.ef_search to a higher value inside the query transaction","Run SET ivfflat.probes to a higher value"],"answer":[2],"explanation":"hnsw.ef_search is a query-time parameter; setting it with SET LOCAL raises the candidate list for that transaction only and needs no rebuild. Changing m or ef_construction both require an index rebuild and are build-time settings. ivfflat.probes applies to IVFFlat indexes, not HNSW.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-219","obj":"2.1.1","difficulty":"hard","type":"single","stem":"An engineer at Adventure Works needs DiskANN vector search on Azure Database for PostgreSQL flexible server. Which statement is correct?","choices":["DiskANN builds without a training step and its query-time search list is tuned with diskann.l_value_is","DiskANN is available on every Azure PostgreSQL deployment option","Like IVFFlat, DiskANN must be retrained after every bulk insert","DiskANN supports only L2 distance"],"answer":[0],"explanation":"DiskANN has no training step, can be created on an empty table, and exposes diskann.l_value_is for per-connection or per-transaction query tuning. DiskANN is supported on Flexible Server, not all deployment options. It applies inserts in place rather than needing retraining. It supports cosine, L2, and inner product operator classes, not only L2.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-220","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Wide World Importers reports that recall from an IVFFlat index has slowly degraded after months of continuous inserts. What is the recommended remedy?","choices":["Lower ivfflat.probes to force a broader scan","Rebuild the index periodically because new rows unbalance the lists","Raise hnsw.ef_search on the IVFFlat index","Drop the vector_cosine_ops operator class from the index"],"answer":[1],"explanation":"IVFFlat centroids are fixed at build time, so ongoing inserts unbalance the lists and degrade recall; periodic rebuilds restore balanced partitions. Lowering probes reduces the lists searched and hurts recall further. hnsw.ef_search does not apply to IVFFlat. Removing the operator class disables the index entirely.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-221","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank needs a vector index that offers both fast build times and highly accurate query performance over a very large table. Which pgvector index type best fits both goals?","choices":["IVFFlat, because it uses the least memory","HNSW, because it has the fastest build time","DiskANN, because it balances fast build times with high query accuracy","FLAT, because it guarantees exact recall"],"answer":[2],"explanation":"Microsoft documents DiskANN as offering a strong balance of highly accurate query performance and fast build times at scale. IVFFlat has the lowest memory use but lower query performance. HNSW has better recall than IVFFlat but slower, more memory-intensive builds. FLAT is not a pgvector index type.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-222","obj":"2.1.1","difficulty":"hard","type":"single","stem":"When creating an HNSW index in pgvector, what does the m parameter control?","choices":["The maximum number of connections per layer in the graph","The number of lists the dataset is partitioned into","The number of lists searched at query time","The size of the dynamic candidate list at query time"],"answer":[0],"explanation":"m sets the maximum number of connections each node keeps per layer; higher m yields a denser graph with better recall at higher memory and build cost. List partitioning and the number of lists searched (probes) are IVFFlat concepts. The query-time candidate list is ef_search, not m.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-223","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A team at Proseware sets ef_construction to a high value on their HNSW index. What is the primary tradeoff?","choices":["Query latency rises but recall is unaffected","Index build quality and recall improve, but build time increases","Query-time recall drops in exchange for a smaller index","The dimension limit is raised above 2000"],"answer":[1],"explanation":"ef_construction is the build-time dynamic candidate list; a larger value produces a higher-quality graph and better recall but takes longer to build. ef_construction is a build parameter, not a query parameter, so it does not directly change query latency. It never raises recall by lowering it, and it has no effect on the dimension ceiling.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-224","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Litware enabled the azure_ai integration on Azure Database for PostgreSQL. What does it let their SQL do?","choices":["Call Azure OpenAI from SQL to generate embeddings in-database with azure_openai.create_embeddings","Replace pgvector as the vector storage type","Pool client connections instead of PgBouncer","Automatically rebuild HNSW indexes on a schedule"],"answer":[0],"explanation":"The azure_ai extension exposes azure_openai.create_embeddings so a query can generate embeddings inside the database and cast the result to vector. It does not replace the pgvector vector type, does not pool connections, and does not manage index rebuilds.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/service-overview"},{"id":"2.1.1-225","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Fourth Coffee must restrict a similarity search to rows where category equals 'finance' and return the five closest matches. Which query pattern is correct for metadata-filtered RAG?","choices":["SELECT ... WHERE category = 'finance' ORDER BY embedding <=> $1 LIMIT 5","SELECT ... ORDER BY embedding <=> $1 LIMIT 5 WHERE category = 'finance'","SELECT ... ORDER BY embedding <=> $1 LIMIT 100, then filter category in the application","SELECT ... HAVING category = 'finance' ORDER BY embedding <=> $1"],"answer":[0],"explanation":"The correct pattern filters with WHERE, orders by the distance operator, and caps results with LIMIT so the top five within the filtered set are returned. WHERE cannot follow LIMIT syntactically. Over-fetching then filtering in the app can return fewer than five and wastes work. HAVING applies to grouped results and is wrong here.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-226","obj":"2.1.1","difficulty":"easy","type":"single","stem":"What is the default pool mode of the built-in PgBouncer in Azure Database for PostgreSQL flexible server?","choices":["Session pooling","Transaction pooling","Statement pooling","No pooling until configured"],"answer":[1],"explanation":"Azure's built-in PgBouncer defaults to transaction pooling, releasing the server connection back to the pool at the end of each transaction. Session pooling is the open-source PgBouncer default, not Azure's built-in default. Statement pooling is opt-in and forbids multi-statement transactions. Pooling is active by default once PgBouncer is enabled.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-227","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel wants to keep transaction pooling for efficiency while still letting the driver use protocol-level prepared statements. What must they configure?","choices":["Set pgbouncer.max_prepared_statements to a value above 0","Switch to statement pooling mode","Rewrite the app to use SQL-level PREPARE and DEALLOCATE","Disable PgBouncer and connect on port 5432"],"answer":[0],"explanation":"Setting max_prepared_statements above 0 turns on PgBouncer tracking of protocol-level named prepared statements in transaction mode. Statement pooling forbids multi-statement transactions and does not solve this. SQL-level PREPARE is not intercepted correctly by PgBouncer. Disabling PgBouncer abandons the pooling requirement.","ref":"https://learn.microsoft.com/azure/architecture/guide/technology-choices/vector-search"},{"id":"2.1.1-228","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which statement about the built-in PgBouncer in Azure Database for PostgreSQL flexible server is correct?","choices":["It listens on port 6432 and is not supported on the Burstable compute tier","It listens on port 5432 and replaces the direct database endpoint","It is supported on Burstable but not on General Purpose","It requires a separate virtual machine to run"],"answer":[0],"explanation":"The built-in PgBouncer listens on port 6432 using the same host name, and it is not available on the Burstable compute tier. Port 5432 is the direct PostgreSQL endpoint, not PgBouncer. Burstable is exactly the tier that lacks the feature. The built-in option runs on the server, needing no separate VM.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-229","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An application at Blue Yonder Airlines depends on session-level temporary tables and WITH HOLD cursors that persist across transactions. Which PgBouncer pool mode preserves those features?","choices":["Transaction pooling","Statement pooling","Session pooling","Any mode, since PgBouncer preserves session state"],"answer":[2],"explanation":"Session pooling assigns one server connection to the client for the whole client connection, so session-scoped state such as temporary tables and held cursors survives. Transaction and statement pooling return the connection to the pool between transactions or statements, breaking session state. PgBouncer does not preserve session state in every mode.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-230","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Coho Vineyard must offload heavy read-only similarity queries away from the primary writer while keeping a single write endpoint on Azure Database for PostgreSQL flexible server. What should they use?","choices":["Route the read queries to the high availability standby replica","Create read replicas and route the SELECT vector queries to them","Enable PgBouncer transaction pooling to spread the read load","Scale the primary to a larger SKU only"],"answer":[1],"explanation":"Read replicas are separate read-only servers that offload SELECT traffic while the primary remains the single writer. The HA standby is not open for read queries. PgBouncer pools connections but does not offload reads to another server. Scaling up alone does not separate read from write traffic.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-231","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which statement about the high availability standby replica in Azure Database for PostgreSQL flexible server is correct?","choices":["It receives writes synchronously for zero data loss but is not open for read queries","It replicates asynchronously and can serve read scale-out","It is promoted from the WAL replica server during failover","It can be queried for reporting to reduce primary load"],"answer":[0],"explanation":"The HA standby is kept in synchronous commit for zero data loss and is not available for client read queries; use read replicas for read scale. HA replication is synchronous, not asynchronous. The WAL replica maintains quorum and is not promoted; only the standby is. The standby cannot serve reporting reads.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/service-overview"},{"id":"2.1.1-232","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Humongous Insurance needs the configuration that protects against an entire availability zone failure with automatic zero-data-loss failover. Which option meets that goal?","choices":["Zonal (same-zone) high availability","Zone-redundant high availability","A single asynchronous read replica","Point-in-time restore only"],"answer":[1],"explanation":"Zone-redundant HA places the standby in a different availability zone with synchronous commit and automatic failover, protecting against a full zone outage with zero data loss. Zonal HA keeps both nodes in one zone, so a zone failure takes both down. An asynchronous read replica can lose data on failover. PITR is recovery after an outage, not automatic failover.","ref":"https://learn.microsoft.com/azure/architecture/guide/technology-choices/vector-search"},{"id":"2.1.1-233","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Litware Media stores 40,000 product embeddings in Azure Managed Redis and needs exact nearest-neighbor recall with the simplest index configuration. Which RediSearch vector index type fits both needs?","choices":["FLAT, an exact brute-force index","HNSW with a high EF_RUNTIME","IVFFlat with many probes","DiskANN with a large search list"],"answer":[0],"explanation":"FLAT performs an exhaustive brute-force scan that returns exact nearest neighbors and needs no graph tuning, which suits a small dataset requiring exact recall. HNSW is approximate even with a high EF_RUNTIME. IVFFlat and DiskANN are not RediSearch vector index types.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-234","obj":"2.1.1","difficulty":"hard","type":"single","stem":"In an Azure Managed Redis RediSearch HNSW vector field, what does EF_RUNTIME control?","choices":["The build-time candidate list size","The query-time candidate list size, trading recall against latency","The maximum number of results returned","The maximum number of outgoing edges per node"],"answer":[1],"explanation":"EF_RUNTIME is the size of the query-time candidate list; raising it improves recall at the cost of higher query latency. The build-time candidate list is EF_CONSTRUCTION. Result count is set by the KNN K value. Edges per node is the M parameter.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-235","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A developer at Trey Research is defining an Azure Managed Redis HNSW vector field. Which two parameters are set at index creation time rather than at query time?","choices":["EF_RUNTIME and K","M and EF_CONSTRUCTION","K and DISTANCE_METRIC only","EF_RUNTIME and M"],"answer":[1],"explanation":"M (edges per node) and EF_CONSTRUCTION (build candidate list) are HNSW build-time parameters set when the index is created. EF_RUNTIME and K are supplied per query. DISTANCE_METRIC is set at creation but K is per query. Pairing EF_RUNTIME with M mixes a query-time and a build-time parameter.","ref":"https://learn.microsoft.com/azure/postgresql/extensions/how-to-use-pgvector"},{"id":"2.1.1-236","obj":"2.1.1","difficulty":"medium","type":"single","stem":"VanArsdel runs a product recommender on Azure Managed Redis that must search only items where category is shoes and then rank those by vector similarity. Which approach uses RediSearch correctly?","choices":["A hybrid query that combines the tag filter with KNN, such as (@category:{shoes})=>[KNN 10 @v $blob AS score]","A pure KNN query, then discard non-shoes results in the client","A FLAT index scan over every vector with no filter","A numeric RANGE query with no vector clause"],"answer":[0],"explanation":"RediSearch hybrid search applies the metadata filter to narrow the candidate set and then runs KNN vector ranking in a single query. Filtering in the client wastes work and can return too few shoes. Scanning all vectors ignores the category constraint. A range query with no vector clause performs no similarity ranking.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-237","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Southridge Video wants to cut LLM cost and latency by reusing prior answers when a new prompt means the same thing as an earlier one, even if the wording differs. Which pattern does this describe?","choices":["Semantic caching keyed by prompt embedding similarity","Exact-key string caching of prompt text","Output caching of static HTTP responses","Write-behind caching of database rows"],"answer":[0],"explanation":"Semantic caching embeds prompts and returns a cached completion when a new prompt is similar enough to a prior one, reducing cost and latency. Exact-key caching only reuses byte-identical prompts. HTTP output caching serves static content, not LLM completions. Write-behind caching defers database writes and is unrelated to prompt reuse.","ref":"https://learn.microsoft.com/azure/architecture/guide/technology-choices/vector-search"},{"id":"2.1.1-238","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An architect at Nod Publishers plans to use vector search on Azure Managed Redis. Which statement about the RediSearch module is correct?","choices":["Modules cannot be added after the cache is created, so RediSearch must be enabled at provisioning","RediSearch can be added to an existing cache at any time","RediSearch is available on the Flash Optimized tier","RediSearch works only with the OSS clustering policy"],"answer":[0],"explanation":"You must enable RediSearch when creating the cache because modules cannot be added afterward. Adding a module to an existing cache is not supported. RediSearch is not available on Flash Optimized. RediSearch requires the Enterprise clustering policy, not OSS.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-239","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Alpine Ski House is enabling RediSearch vector search on Azure Managed Redis. Which clustering and eviction combination does RediSearch require?","choices":["OSS clustering policy with allkeys-lru eviction","Enterprise clustering policy with NoEviction eviction","OSS clustering policy with NoEviction eviction","Enterprise clustering policy with volatile-ttl eviction"],"answer":[1],"explanation":"RediSearch requires the Enterprise clustering policy and the NoEviction eviction policy. The OSS clustering policy is not supported for RediSearch, and any eviction policy other than NoEviction risks evicting indexed data, so allkeys-lru and volatile-ttl are invalid here.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-240","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Best For You Organics uses a cache-aside pattern and needs a read immediately after an application-controlled write to return the fresh value. What write path achieves this?","choices":["Write only to the cache and let it flush to the database later","Write to the database, then invalidate or update the cache entry so the next read repopulates it","Rely on the cache TTL to expire the stale entry eventually","Write to the cache first, then write to the database asynchronously"],"answer":[1],"explanation":"In cache-aside, the system of record is the database; writing there first and then invalidating or updating the cache guarantees the next read reflects the new value. Writing only to the cache risks data loss and diverges from the database. Waiting for TTL leaves a stale window. Cache-first asynchronous writes are write-behind and can serve stale or lost data.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-241","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Complete the statement so the current IVFFlat session searches 20 lists. Which setting fills the blank?\n\n```\nSET ________ = 20;\nSELECT id FROM items ORDER BY embedding <=> $1 LIMIT 5;\n```","choices":["ivfflat.probes","hnsw.ef_search","ivfflat.lists","diskann.l_value_is"],"answer":[0],"explanation":"ivfflat.probes controls how many lists are scanned at query time; raising it improves recall at the cost of speed. hnsw.ef_search and diskann.l_value_is tune different index types. lists is a build-time WITH option, not a runtime SET parameter.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-242","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Complete the CREATE INDEX so the HNSW build considers 200 candidates while constructing the graph. Which option fills the blank?\n\n```\nCREATE INDEX ON items\nUSING hnsw (embedding vector_cosine_ops)\nWITH (m = 32, ________ = 200);\n```","choices":["ef_construction","ef_search","l_value_ib","lists"],"answer":[0],"explanation":"ef_construction is the build-time dynamic candidate list for HNSW graph construction. ef_search is a query-time setting, not a build option. l_value_ib belongs to DiskANN. lists belongs to IVFFlat.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-243","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Complete the pgvector query that generates the query embedding in-database with the azure_ai integration. Which function fills the blank?\n\n```\nSELECT id, title\nFROM knowledge_base\nORDER BY content_vector <=> azure_openai.________('embeddings', $1)::vector\nLIMIT 5;\n```","choices":["create_embeddings","generate_embeddings","embed_text","get_vectors"],"answer":[0],"explanation":"azure_openai.create_embeddings calls the deployed Azure OpenAI embeddings model and returns a result that casts to vector. generate_embeddings, embed_text, and get_vectors are not functions exposed by the azure_ai integration.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-244","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Complete the RediSearch schema so the HNSW vector field uses cosine similarity for text-embedding-3-small vectors. Which value fills the blank?\n\n```\nFT.CREATE idx ON HASH PREFIX 1 doc:\n  SCHEMA v VECTOR HNSW 6\n  TYPE FLOAT32 DIM 1536\n  DISTANCE_METRIC ________\n```","choices":["COSINE","L2","IP","DOT"],"answer":[0],"explanation":"COSINE is the RediSearch distance metric matching cosine-similarity embedding models such as text-embedding-3-small. L2 is Euclidean distance and IP is inner product, which do not match the cosine model here. DOT is not a valid RediSearch DISTANCE_METRIC value.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-245","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Complete the RediSearch query so it returns the 10 nearest vectors with a query-time candidate list override. Which keyword fills the blank?\n\n```\nFT.SEARCH idx \"*=>[________ 10 @v $blob EF_RUNTIME 150 AS score]\"\n  PARAMS 2 blob \"...\" SORTBY score DIALECT 2\n```","choices":["KNN","ANN","TOPK","NN"],"answer":[0],"explanation":"KNN is the RediSearch vector query keyword that returns the top K nearest neighbors. ANN, TOPK, and NN are not RediSearch vector query keywords.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-246","obj":"2.1.1","difficulty":"hard","type":"multi","stem":"A workload at First Up Consultants uses Azure's built-in PgBouncer in its default pool mode. Which two features do not work reliably in that mode? (Select two.)","choices":["Session-level advisory locks","LISTEN and NOTIFY pub-sub messaging","Protocol-level prepared statements when max_prepared_statements is above 0","Single-statement autocommit SELECT queries","Ordinary multi-statement transactions"],"answer":[0,1],"explanation":"Advisory locks and LISTEN/NOTIFY both require a persistent server connection, which transaction pooling does not guarantee because the connection returns to the pool after each transaction. Protocol-level prepared statements work once max_prepared_statements is above 0. Single-statement SELECTs and ordinary transactions are fully supported in transaction pooling.","ref":"https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-pgbouncer"},{"id":"2.1.1-247","obj":"2.1.1","difficulty":"easy","type":"multi","stem":"Graphic Design Institute is provisioning Azure Managed Redis for vector search with RediSearch. Which two configuration choices are required? (Select two.)","choices":["Enterprise clustering policy","NoEviction eviction policy","OSS clustering policy","allkeys-lru eviction policy","Flash Optimized tier"],"answer":[0,1],"explanation":"RediSearch requires the Enterprise clustering policy and the NoEviction eviction policy so indexed data is not evicted. The OSS clustering policy is not supported for RediSearch. allkeys-lru can evict indexed keys. Flash Optimized does not support RediSearch.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-248","obj":"2.1.1","difficulty":"medium","type":"multi","stem":"An engineer at Munson's Pickles wants to create a pgvector index on an empty table and populate it afterward. Which two index types can be built on an empty table because they have no training step? (Select two.)","choices":["IVFFlat","HNSW","DiskANN","A B-tree over the vector column","A BRIN over the vector column"],"answer":[1,2],"explanation":"HNSW and DiskANN build graphs incrementally with no training step, so they can be created on an empty table and populated as data arrives. IVFFlat trains list centroids on existing data, so it needs data first. B-tree and BRIN indexes do not support vector distance operators.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-249","obj":"2.1.1","difficulty":"hard","type":"multi","stem":"On Azure Managed Redis, which two of the following are valid RediSearch vector DISTANCE_METRIC values? (Select two.)","choices":["COSINE","IP","DOT_PRODUCT","MANHATTAN","HAMMING"],"answer":[0,1],"explanation":"RediSearch supports L2, COSINE, and IP as vector distance metrics, so COSINE and IP are both valid. DOT_PRODUCT, MANHATTAN, and HAMMING are not RediSearch vector distance metric values.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-250","obj":"2.1.1","difficulty":"easy","type":"multi","stem":"Lucerne Publishing guards a hot cache key with a single-flight lock to prevent a cache stampede when the entry expires. Which two statements describe correct single-flight behavior? (Select two.)","choices":["Exactly one request recomputes the value while the others wait or serve a stale copy","Every concurrent request recomputes the value independently to maximize freshness","A lock key acquired with SET NX lets only one caller rebuild the entry","The cache is disabled for all keys during the miss window","Using GET then SET as two separate commands guarantees only one caller wins"],"answer":[0,2],"explanation":"Single-flight lets one request rebuild the value while others wait or serve stale, and SET with NX is the atomic primitive that grants the lock to exactly one caller. Independent recomputation by every request is the stampede itself. Disabling the whole cache is overbroad. GET followed by SET is two non-atomic steps, so several callers can pass the check and win the race.","ref":"https://learn.microsoft.com/azure/architecture/guide/technology-choices/vector-search"},{"id":"3.1.1-01","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which service delivers enterprise messages using queues and topics?","choices":["Azure Service Bus","Azure DNS","Azure CDN","Azure Policy"],"answer":[0],"explanation":"Service Bus is the enterprise messaging broker. DNS resolves names, the CDN caches content, and Policy governs resources.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-02","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which service routes events reactively to subscribers?","choices":["Azure Event Grid","Azure Backup","Azure DNS","Azure Policy"],"answer":[0],"explanation":"Event Grid routes events to subscribers. Backup protects data, DNS resolves names, and Policy governs resources.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-03","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which service ingests high-volume event streams for analytics?","choices":["Azure Event Hubs","Azure Key Vault","Azure DNS","Azure Policy"],"answer":[0],"explanation":"Event Hubs ingests high-throughput streams. Key Vault holds secrets, DNS resolves names, and Policy governs resources.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-04","obj":"3.1.1","difficulty":"easy","type":"single","stem":"What triggers an Azure Function to run?","choices":["An event such as an HTTP request or a queue message","A manual server restart","A daily server patch","A DNS lookup"],"answer":[0],"explanation":"Functions run in response to triggers like HTTP or queue messages. Restarts, patches, and DNS lookups are not function triggers.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-05","obj":"3.1.1","difficulty":"medium","type":"single","stem":"What is the least-code way for a Function to write to Cosmos DB?","choices":["An output binding","A raw TCP socket","A hand-written REST call with retries","A scheduled export"],"answer":[0],"explanation":"An output binding persists data declaratively. Sockets, hand-written REST, and exports add code the binding removes.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-06","obj":"3.1.1","difficulty":"hard","type":"single","stem":"In Service Bus, what handles messages that repeatedly fail to process?","choices":["The dead-letter queue","The main queue forever","A DNS record","An access policy"],"answer":[0],"explanation":"The dead-letter queue holds messages that cannot be processed. Reprocessing forever blocks the queue, and DNS and policies are unrelated.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-07","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which Functions plan scales to zero and bills per execution?","choices":["The Consumption plan","A dedicated virtual machine","A reserved cluster","An always-on server"],"answer":[0],"explanation":"The Consumption plan scales to zero and bills per execution. VMs, reserved clusters, and always-on servers bill continuously.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-08","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which Azure service is designed for enterprise transactional messaging such as order processing with reliable delivery?","choices":["Azure Event Grid","Azure Service Bus","Azure Event Hubs","Azure Queue Storage"],"answer":[1],"explanation":"Service Bus is the enterprise message broker built for high-value transactional workloads with reliable delivery. Event Grid routes discrete events, Event Hubs streams telemetry, and Queue Storage is a simple queue without the enterprise messaging features.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-09","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which Azure Service Bus feature provides a first-in, first-out (FIFO) processing guarantee for related messages?","choices":["Sessions","Dead-letter queue","Duplicate detection","Autoforwarding"],"answer":[0],"explanation":"Sessions enable exclusive, ordered handling of related messages, which is how Service Bus provides FIFO. Dead-lettering holds undeliverable messages, duplicate detection removes repeats, and autoforwarding chains entities; none of these order messages.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-10","obj":"3.1.1","difficulty":"easy","type":"single","stem":"In Azure Service Bus, where are messages placed when they cannot be delivered or processed by any receiver?","choices":["Sessions","Scheduled delivery","Dead-letter queue","Message deferral"],"answer":[2],"explanation":"The dead-letter queue is a subqueue that holds messages that cannot be delivered or processed. Sessions order messages, scheduled delivery delays sending, and deferral sets a message aside for later retrieval.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-11","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which Azure Service Bus entity delivers a copy of each message to multiple independent subscribers?","choices":["A queue","A topic","A session","A dead-letter queue"],"answer":[1],"explanation":"A topic with subscriptions implements publish-subscribe, delivering each message to every matching subscription. A queue is point-to-point, a session orders related messages, and a dead-letter queue holds failed messages.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-12","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which Azure messaging service supports transactions and duplicate detection?","choices":["Azure Event Hubs","Azure Event Grid","Azure Service Bus","Azure Queue Storage"],"answer":[2],"explanation":"Service Bus supports transactions and duplicate detection as part of its enterprise messaging features. Event Hubs and Event Grid do not offer transactions or duplicate detection, and Queue Storage lacks these enterprise features.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/duplicate-detection"},{"id":"3.1.1-13","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which Azure service is designed for reactive event routing and serverless triggers?","choices":["Azure Event Grid","Azure Service Bus","Azure Event Hubs","Azure Queue Storage"],"answer":[0],"explanation":"Event Grid is a managed event routing service built to react to state changes and drive serverless architectures. Service Bus is for transactional messages, Event Hubs is for high-throughput streaming, and Queue Storage is a basic queue.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-14","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which Azure service is designed for high-throughput event streaming of millions of events per second?","choices":["Azure Service Bus","Azure Event Grid","Azure Event Hubs","Azure Notification Hubs"],"answer":[2],"explanation":"Event Hubs is a big-data streaming platform that can ingest millions of events per second. Service Bus handles transactional messages, Event Grid routes discrete events, and Notification Hubs sends push notifications.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-15","obj":"3.1.1","difficulty":"hard","type":"single","stem":"In Azure messaging, which term describes a lightweight notification of a condition or state change?","choices":["A message","An event","A session","A binding"],"answer":[1],"explanation":"An event is a lightweight notification of a condition or state change, and the publisher has no expectation about how it is handled. A message carries raw data with a contract, a session orders related messages, and a binding connects a function to a resource.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-16","obj":"3.1.1","difficulty":"easy","type":"single","stem":"In Azure messaging, which term describes raw data produced with a contract that the consumer is expected to process in a specific way?","choices":["An event","A trigger","A message","A partition"],"answer":[2],"explanation":"A message contains raw data, and a contract exists between the publisher and the consumer about how it is processed. An event is a lightweight notification with no such expectation, a trigger invokes a function, and a partition scales an event stream.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-17","obj":"3.1.1","difficulty":"medium","type":"single","stem":"How many triggers must an Azure function have?","choices":["Exactly one","At least two","Zero or one","One per binding"],"answer":[0],"explanation":"A function must have exactly one trigger, which defines how the function is invoked. A function cannot have multiple triggers or zero triggers, and triggers are not tied one-to-one to bindings.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-18","obj":"3.1.1","difficulty":"hard","type":"single","stem":"In Azure Functions, what causes a function to run?","choices":["An input binding","An output binding","A trigger","A connection string"],"answer":[2],"explanation":"A trigger defines how a function is invoked and causes the function to run. Input and output bindings connect a function to data but do not invoke it, and a connection string only stores connection details.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-19","obj":"3.1.1","difficulty":"easy","type":"single","stem":"In Azure Functions, which binding passes data into your function?","choices":["An output binding","An input binding","A timer trigger","A dead-letter binding"],"answer":[1],"explanation":"An input binding declaratively passes data from another resource into your function. An output binding writes data out, a timer trigger only schedules invocation, and there is no dead-letter binding type.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-20","obj":"3.1.1","difficulty":"medium","type":"single","stem":"In Azure Functions, which binding lets you write data out from your function to another resource?","choices":["An input binding","An output binding","A trigger","A queue message"],"answer":[1],"explanation":"An output binding declaratively writes data from your function out to another resource. An input binding reads data in, a trigger invokes the function, and a queue message is data, not a binding type.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-21","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which Azure Functions hosting plan is the recommended serverless plan for new function apps?","choices":["Dedicated (App Service) plan","Premium plan","Flex Consumption plan","Consumption plan (legacy)"],"answer":[2],"explanation":"The Flex Consumption plan is the recommended serverless plan for new function apps. The Dedicated and Premium plans are not the default serverless recommendation, and the Consumption plan is now legacy.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-22","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which Azure Functions hosting plan runs your functions in an App Service plan billed at regular App Service rates?","choices":["Flex Consumption plan","Premium plan","Consumption plan","Dedicated (App Service) plan"],"answer":[3],"explanation":"The Dedicated plan runs functions in an App Service plan and is billed at regular App Service rates regardless of executions. Flex Consumption and Consumption bill per execution, and the Premium plan bills for prewarmed elastic instances.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-scale"},{"id":"3.1.1-23","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which Azure Functions trigger type runs a function on a defined schedule?","choices":["HTTP trigger","Timer trigger","Blob trigger","Queue trigger"],"answer":[1],"explanation":"A Timer trigger runs a function on a schedule that you define. An HTTP trigger responds to requests, a Blob trigger responds to new blobs, and a Queue trigger responds to queue messages.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-24","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which Azure Functions trigger runs a function in response to an HTTP request?","choices":["Queue trigger","Timer trigger","HTTP trigger","Blob trigger"],"answer":[2],"explanation":"An HTTP trigger runs the function when an HTTP request is received. A Queue trigger fires on queue messages, a Timer trigger fires on a schedule, and a Blob trigger fires on new blobs.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-25","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which Azure Functions trigger runs a function when a new message arrives in an Azure Storage queue?","choices":["Blob trigger","Queue trigger","Timer trigger","HTTP trigger"],"answer":[1],"explanation":"A Queue trigger runs the function when a new message arrives in a Storage queue. A Blob trigger fires on new blobs, a Timer trigger fires on a schedule, and an HTTP trigger fires on requests.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-26","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which Azure Functions trigger runs a function when a blob is added to a container?","choices":["Blob trigger","Queue trigger","HTTP trigger","Timer trigger"],"answer":[0],"explanation":"A Blob trigger runs the function when a blob is added or updated in a container. A Queue trigger fires on queue messages, an HTTP trigger fires on requests, and a Timer trigger fires on a schedule.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-27","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which Azure service supports the Apache Kafka protocol for event streaming?","choices":["Azure Service Bus","Azure Event Grid","Azure Event Hubs","Azure Queue Storage"],"answer":[2],"explanation":"Event Hubs supports the Kafka protocol in addition to AMQP and HTTP for streaming. Service Bus and Event Grid do not offer a Kafka endpoint, and Queue Storage does not support Kafka.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-28","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which Azure service supports the MQTT protocol for publishing and subscribing to events?","choices":["Azure Event Grid","Azure Service Bus","Azure Event Hubs","Azure Queue Storage"],"answer":[0],"explanation":"Event Grid supports MQTT and HTTP for publishing and subscribing to events. Service Bus uses AMQP and HTTP, Event Hubs uses AMQP, Kafka, and HTTP, and Queue Storage does not support MQTT.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-29","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which Azure service offers a Capture feature to automatically store streamed events for later processing?","choices":["Azure Service Bus","Azure Event Hubs","Azure Event Grid","Azure Queue Storage"],"answer":[1],"explanation":"Event Hubs Capture automatically stores streamed events to storage for later processing or replay. Service Bus, Event Grid, and Queue Storage do not provide an Event Hubs Capture feature.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-30","obj":"3.1.1","difficulty":"hard","type":"single","stem":"In Azure Event Hubs, what maintains ordering within a stream and enables parallel scale?","choices":["Sessions","Topics","Partitions","Bindings"],"answer":[2],"explanation":"Partitions provide per-partition ordering and let consumers process the stream in parallel. Sessions and topics are Service Bus concepts, and bindings connect Azure Functions to resources.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-31","obj":"3.1.1","difficulty":"easy","type":"single","stem":"In Azure Event Hubs, what allows multiple consuming applications to each read the event stream independently?","choices":["Consumer groups","Subscriptions","Dead-letter queues","Sessions"],"answer":[0],"explanation":"Consumer groups provide each consuming application its own independent view of the event stream. Subscriptions and dead-letter queues are Service Bus concepts, and sessions provide FIFO ordering in Service Bus.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-32","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which Azure service is best suited for ingesting telemetry from millions of IoT devices?","choices":["Azure Service Bus","Azure Event Grid","Azure Event Hubs","Azure Queue Storage"],"answer":[2],"explanation":"Event Hubs is built for high-throughput ingestion such as telemetry from millions of IoT devices. Service Bus targets transactional messages, Event Grid routes discrete events, and Queue Storage is a simple queue.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-33","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which Azure service is best suited for order processing and financial transaction workflows that need reliable delivery?","choices":["Azure Event Grid","Azure Service Bus","Azure Event Hubs","Azure Queue Storage"],"answer":[1],"explanation":"Service Bus is the enterprise broker for transactional workflows such as order processing and financial transactions. Event Grid routes events, Event Hubs streams telemetry, and Queue Storage lacks the enterprise reliability features.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-34","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which Azure service routes events to subscribers and lets each subscription filter for only the events it wants?","choices":["Azure Event Grid","Azure Event Hubs","Azure Queue Storage","Azure Blob Storage"],"answer":[0],"explanation":"Event Grid uses a filtered subscriber model where each subscription sets rules for the events it wants. Event Hubs streams to consumer groups without per-event filtering, and Queue and Blob Storage are not event routers.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-35","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which delivery model does Azure Event Grid use to send events to handlers as they occur?","choices":["Push-based delivery","Pull-based polling","Batch export","Manual retrieval"],"answer":[0],"explanation":"Event Grid uses a push model that sends events to handlers in near real time as they occur. Pull-based polling is the classic Service Bus model, and batch export and manual retrieval are not the Event Grid default.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-36","obj":"3.1.1","difficulty":"hard","type":"single","stem":"In Azure Event Hubs Standard, what is the unit of capacity you provision to control throughput?","choices":["Throughput units","Messaging units","Consumer groups","Partition keys"],"answer":[0],"explanation":"Throughput units are the capacity unit provisioned in Event Hubs Standard to control ingress and egress. Messaging units belong to Service Bus Premium, consumer groups provide independent reader views, and partition keys route events.","ref":"https://learn.microsoft.com/azure/event-hubs/event-hubs-features"},{"id":"3.1.1-37","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Which Azure Service Bus feature lets you submit a message now for delivery at a later specified time?","choices":["Scheduled delivery","Dead-lettering","Sessions","Duplicate detection"],"answer":[0],"explanation":"Scheduled delivery lets you submit a message that becomes available for consumption at a later specified time. Dead-lettering holds failed messages, sessions order related messages, and duplicate detection removes repeats.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-38","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Which Azure Service Bus feature lets a receiver set a message aside and retrieve it later by its sequence number?","choices":["Autoforwarding","Message deferral","Dead-lettering","Sessions"],"answer":[1],"explanation":"Message deferral lets a receiver set a message aside and reactivate it later by its service-assigned sequence number. Autoforwarding chains entities, dead-lettering holds failed messages, and sessions provide FIFO ordering.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-39","obj":"3.1.1","difficulty":"hard","type":"single","stem":"In Azure Functions, what is the purpose of a binding?","choices":["To declaratively connect a function to other resources without hardcoding access","To allocate the compute instances used for scaling","To define the billing tier of the function app","To store the function source code"],"answer":[0],"explanation":"A binding declaratively connects a function to other resources, avoiding hardcoded access in code. Instance allocation is set by the hosting plan, billing is the plan tier, and source code is stored in the app, not a binding.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-40","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Alpine Ski House processes jobs from a Service Bus queue; messages that fail repeatedly must be set aside without blocking the queue. What should you use?","choices":["The dead-letter queue","Auto-forwarding","Duplicate detection","A shorter lock duration"],"answer":[0],"explanation":"The dead-letter queue sets failing messages aside. Forwarding, dedup, and lock duration do not isolate failing messages.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-41","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Bellows College publishes one order message that three independent processors must each receive and process reliably. What should you use?","choices":["A Service Bus topic with three subscriptions","A single shared Service Bus queue","An Event Hubs instance with three consumer groups","An Event Grid topic"],"answer":[0],"explanation":"A topic with subscriptions gives each processor its own reliable copy. A shared queue competes, and Event Hubs or Event Grid are the wrong models for reliable per-consumer copies.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-42","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Best For You Organics Company must process related Service Bus messages strictly in order. What should you enable?","choices":["Message sessions","Duplicate detection","A higher prefetch count","Auto-delete on idle"],"answer":[0],"explanation":"Message sessions enforce ordered processing. Dedup, prefetch, and auto-delete do not order messages.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-43","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard needs point-to-point delivery where each message is handled by exactly one consumer. What should you use?","choices":["A Service Bus queue","A Service Bus topic","An Event Grid topic","An Event Hubs instance"],"answer":[0],"explanation":"A queue is point-to-point: one consumer per message. A topic fans out, and Event Grid and Event Hubs are event and stream models.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-44","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Consolidated Messenger needs a function to run whenever a PDF is uploaded to Blob Storage, with delivery retried on failure. What should you use?","choices":["A Service Bus queue with a message filter","An Event Hubs consumer group","An Event Grid subscription with a subject filter and retry","A Storage queue polled by a function"],"answer":[2],"explanation":"A blob upload is a platform event; Event Grid delivers it with a subject filter and retry. Service Bus needs a producer, Event Hubs is a stream, and a polled Storage queue is not event-driven with retry.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-45","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Fabrikam Residences needs to publish application-defined events for its own subscribers. What should you use?","choices":["A system topic","A partner topic","An event domain","A custom topic for application-defined events"],"answer":[3],"explanation":"A custom topic publishes application-defined events. System, partner, and domain topics are for Azure or multi-tenant sources, not app events.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview"},{"id":"3.1.1-46","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Graphic Design Institute must handle Event Grid events that cannot be delivered after retries. What should you configure?","choices":["A dead-letter location and a retry policy","A larger batch size","An additional subject filter","Pull delivery"],"answer":[0],"explanation":"A dead-letter location plus a retry policy captures undeliverable events. Batch size, a filter, and pull delivery do not capture undeliverable events.","ref":"https://learn.microsoft.com/azure/event-grid/delivery-and-retry"},{"id":"3.1.1-47","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Lamna Healthcare Company needs a function to run each time a message arrives on a Service Bus queue. What should you use?","choices":["A timer trigger","An HTTP trigger","A Blob trigger","A Service Bus trigger"],"answer":[3],"explanation":"A Service Bus trigger runs the function on each queue message. Timer, HTTP, and Blob triggers respond to the wrong source.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-48","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Lucerne Publishing needs to expose a serverless REST API from an Azure Function. What should you use?","choices":["A timer trigger","A queue trigger","An Event Grid trigger","An HTTP trigger"],"answer":[3],"explanation":"An HTTP trigger exposes a serverless REST API. Timer, queue, and Event Grid triggers do not expose an HTTP API.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-49","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Margie's Travel needs a function to write each result to Cosmos DB with the least code. What should you use?","choices":["A Cosmos DB input binding","A Cosmos DB output binding","A Cosmos DB trigger","A CosmosClient create-item call"],"answer":[1],"explanation":"The output binding writes to Cosmos DB with the least code. An input binding reads, a trigger reacts, and a client call adds code.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-50","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Nod Publishers needs a function to read one known document from Cosmos DB with the least code. What should you use?","choices":["A Cosmos DB output binding","A Cosmos DB trigger","A Cosmos DB input binding","A CosmosClient query call"],"answer":[2],"explanation":"The input binding reads a known document with the least code. An output binding writes, a trigger reacts, and a client query adds code.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-51","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders needs a Functions plan that scales to zero and bills per execution for a bursty workload. Which plan?","choices":["The Consumption plan","A Dedicated plan","A Premium always-warm plan","A dedicated virtual machine"],"answer":[0],"explanation":"The Consumption plan scales to zero and bills per execution. Dedicated, always-warm Premium, and a VM all bill continuously.","ref":"https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings"},{"id":"3.1.1-52","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fabrikam Logistics needs point-to-point delivery where each shipment message is processed by exactly one competing consumer, with no other subscriber receiving a copy. Which Azure Service Bus entity fits this requirement?","choices":["A Service Bus topic with multiple subscriptions","A Service Bus queue","An Event Grid custom topic","An Event Hubs consumer group"],"answer":[1],"explanation":"A Service Bus queue delivers each message to a single receiver, and competing consumers on the same queue share the workload so exactly one processes each message. A topic with subscriptions is publish-subscribe and delivers a copy to every matching subscription, not a single consumer. An Event Grid custom topic is for reactive event routing, not brokered point-to-point work queues. An Event Hubs consumer group is a streaming read view, not a competing-consumer work queue.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-53","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Contoso Retail publishes one order-created message and needs three independent downstream systems (billing, shipping, and analytics) to each receive their own copy for separate processing. Which Azure Service Bus construct should the team use?","choices":["A topic with a subscription for each system","A single queue read by all three systems","Duplicate detection on a queue","A session-enabled queue"],"answer":[0],"explanation":"A Service Bus topic delivers a copy of each published message to every subscription whose filter matches, so three subscriptions give billing, shipping, and analytics independent copies. A single queue delivers each message once to one competing consumer, so the three systems would compete instead of each getting a copy. Duplicate detection drops repeated MessageIds and does not fan out. A session-enabled queue enforces FIFO ordering but is still a single-consumer queue, not fan-out.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-54","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Wingtip Payments requires that all messages belonging to the same account number are processed strictly first-in first-out by a single consumer, while different accounts can be processed in parallel. Which Azure Service Bus feature guarantees this?","choices":["Duplicate detection","Scheduled messages","Dead-letter queues","Message sessions with a session ID per account"],"answer":[3],"explanation":"Message sessions group messages that share a session ID, give one consumer an exclusive lock on that session, and guarantee FIFO within the session while other sessions process in parallel. Duplicate detection removes repeated MessageIds but does not order or partition processing. Scheduled messages delay availability, not order. Dead-letter queues hold undeliverable messages and do not provide ordering.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-55","obj":"3.1.1","difficulty":"easy","type":"single","stem":"An engineer at Adventure Works enables message sessions on an existing Service Bus queue and finds that a client sending plain messages without a session ID now fails. What is the correct explanation?","choices":["Sessions require the Premium tier and the queue is Standard","Duplicate detection must be disabled before sessions work","Once sessions are enabled, clients must send and receive as part of a session by setting the session ID","The queue must first be converted into a topic"],"answer":[2],"explanation":"When sessions are enabled on a queue or subscription, clients can no longer send or receive regular messages; every message must carry a session ID and receivers must accept a session. Sessions are supported on Standard and Premium (only Basic lacks them), so tier is not the cause. Duplicate detection and sessions can both be enabled and are unrelated here. Converting to a topic is unnecessary and unrelated to the session-ID requirement.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/message-sessions"},{"id":"3.1.1-56","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders wants Service Bus to automatically move a message aside after it has been delivered and abandoned the default number of times without successful processing, so operators can inspect it later. Which behavior handles this?","choices":["The message is scheduled for redelivery indefinitely","The message is moved to the dead-letter queue after the max delivery count is exceeded","The message is duplicated to a backup topic","The message is deferred until a sequence number is supplied"],"answer":[1],"explanation":"When a message exceeds the maximum delivery count (default 10), Service Bus moves it to the entity's dead-letter queue, where it can be browsed and inspected. Service Bus does not retry indefinitely; it dead-letters after the count is reached. Duplicating to a backup topic is not a built-in behavior. Deferral is an explicit client action that sets a message aside by sequence number, not automatic sidelining on failure.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-57","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A developer at Tailwind Traders must protect against a message being enqueued twice when a transient network error causes the client to resend the same order. Which Service Bus feature removes the duplicate based on a repeated identifier within a time window?","choices":["Duplicate detection using MessageId","Message sessions","Dead-lettering on expiration","Autoforwarding"],"answer":[0],"explanation":"Duplicate detection tracks the application-controlled MessageId within a configured window and silently drops any resend that repeats a MessageId already seen. Sessions provide FIFO ordering, not deduplication. Dead-lettering on expiration handles TTL, not resends. Autoforwarding chains entities together and does not remove duplicates.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-58","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Litware Inc. enables duplicate detection on a high-throughput Service Bus queue and wants to minimize the throughput impact while still catching the most likely resends. What should the team configure?","choices":["Set the duplicate detection window as large as possible, up to 7 days","Switch the queue to receive-and-delete mode","Disable MessageId assignment and rely on the body","Set the duplicate detection window as small as the scenario allows"],"answer":[3],"explanation":"Every recorded MessageId must be matched against each new send, so keeping the duplicate detection history window small reduces the number of retained IDs and limits the throughput impact. A maximum 7-day window retains the most IDs and hurts throughput most. Duplicate detection considers only the MessageId, not the body, so disabling MessageId breaks it. Receive-and-delete mode is a receive setting and does not affect send-side deduplication.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/duplicate-detection"},{"id":"3.1.1-59","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Proseware wants a Service Bus message to remain hidden from receivers until a specific future time so a promotional job runs at midnight, while the send call itself happens now. Which capability provides this?","choices":["Message deferral","Time-to-live expiration","Scheduled messages with ScheduledEnqueueTime","Session state"],"answer":[2],"explanation":"Setting ScheduledEnqueueTime submits the message immediately but instructs Service Bus to hide it from receivers until the requested UTC time, and scheduled messages can also be cancelled. Deferral sets a received message aside for later retrieval by sequence number; it does not schedule future availability. TTL removes messages after a lifetime rather than delaying availability. Session state stores per-session progress data, not timing.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-60","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Contoso wants a Service Bus subscription to receive only messages where the user property color equals blue and quantity equals 10, using a SQL-like conditional expression evaluated by the broker. Which filter type should be applied to the subscription?","choices":["A correlation filter","A SQL filter","A true filter","A false filter"],"answer":[1],"explanation":"A SQL filter holds a SQL-like conditional expression, such as color='blue' AND quantity=10, that the broker evaluates against message properties. A correlation filter matches exact equality on specific system or user properties and cannot express arbitrary relational conditions like this. A true filter selects all messages and a false filter selects none, so neither applies the condition.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-61","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fabrikam needs the highest possible throughput for topic subscription filtering and only ever needs exact-match equality on the CorrelationId and Label properties. Which filter type does Microsoft recommend for efficiency?","choices":["Correlation filter","SQL filter","Regular-expression filter","Body-content filter"],"answer":[0],"explanation":"Correlation filters match exact values on system and user properties and are much more efficient to process than SQL filters, so Microsoft recommends them whenever the scenario allows. SQL filters are more expressive but lower overall throughput at the subscription, topic, and namespace level. Service Bus has no regular-expression filter type, and filters evaluate message properties, not the message body.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-62","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A team at Humongous Insurance wants a subscription filter to inspect a value stored inside the JSON body of each Service Bus message. Why will this approach fail?","choices":["Filters can be applied only to queues, not subscriptions","Correlation filters must be combined with sessions","SQL filters require the Premium tier","Subscription filters evaluate message properties and cannot evaluate the message body"],"answer":[3],"explanation":"All Service Bus filters evaluate a message's system and user properties; they cannot inspect or evaluate the message body. Filters and rules apply to topic subscriptions, so the queue statement is wrong. SQL filters work on Standard and Premium, so tier is not the issue. Correlation filters do not require sessions.","ref":"https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions"},{"id":"3.1.1-63","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Which statement correctly distinguishes an event from a message in Azure messaging services, as described by Microsoft?","choices":["An event is raw data the consumer is contractually required to process; a message is a lightweight state-change notification","Events and messages are identical and the terms are interchangeable","An event is a lightweight notification of a condition or state change with no publisher expectation about handling; a message is raw data with a contract between publisher and consumer","An event always requires ordered, transactional delivery; a message never does"],"answer":[2],"explanation":"Microsoft defines an event as a lightweight notification of a condition or state change where the publisher has no expectation about handling, and a message as raw data with a contract between publisher and consumer. The first choice reverses the two definitions. They are not interchangeable concepts. Events do not always require ordered transactional delivery; that is a Service Bus messaging charac
