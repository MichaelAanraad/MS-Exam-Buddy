/basic-concepts"},{"id":"4.1.1-173","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel attaches a system-assigned managed identity to a virtual machine and grants it Key Vault access. Later the VM is deleted. What happens to the identity and its role assignments?","choices":["The identity persists and can be reattached to another resource","The identity remains but its role assignments are transferred to the resource group","The identity is deleted automatically along with the VM","The identity converts to a user-assigned managed identity"],"answer":[2],"explanation":"A system-assigned managed identity is tied to the lifecycle of its resource; when the resource is deleted, Azure automatically deletes the identity and its role assignments. A system-assigned identity cannot be reattached elsewhere; only user-assigned identities are standalone. Role assignments are not transferred. The identity type does not convert on deletion.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-174","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Lamna Healthcare wants a GitHub Actions workflow to authenticate to Azure and read Key Vault secrets using workload identity federation, with no stored client secret. Which identity target can a federated identity credential be configured on?","choices":["A system-assigned managed identity","A Key Vault access policy principal","A Microsoft Entra security group","A user-assigned managed identity or an app registration"],"answer":[3],"explanation":"Workload identity federation is configured only on a user-assigned managed identity or an app registration; the federated identity credential defines which external token is trusted. System-assigned managed identities do not support federated identity credentials. An access-policy principal and a security group are not valid targets for a federated identity credential.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-175","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Trey Research application uses DefaultAzureCredential from the Azure Identity library. The developers want to know which credential is attempted first in the default chain. Which is it?","choices":["Environment","Managed Identity","Azure CLI","Workload Identity"],"answer":[0],"explanation":"In the DefaultAzureCredential chain, EnvironmentCredential is attempted first, reading environment variables for a configured service principal. Workload Identity is second and Managed Identity third. Azure CLI is a later developer-tool credential in the chain, not first.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-176","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Fourth Coffee has a key vault configured with legacy access policies and plans to switch it to the Azure RBAC permission model. What must the team account for during the change?","choices":["Access policies and RBAC apply simultaneously with no impact","Setting the RBAC permission model invalidates all existing access policy permissions, which can cause outages if equivalent roles are not assigned","RBAC can only be enabled on a brand-new vault, never an existing one","Switching to RBAC also disables soft delete"],"answer":[1],"explanation":"Setting the Azure RBAC permission model invalidates all access-policy permissions, so equivalent Azure roles must be assigned first to avoid an access outage. The two models do not run together on one vault. RBAC can be enabled on existing vaults. Soft delete is independent of the permission model.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-177","obj":"4.1.1","difficulty":"hard","type":"single","stem":"An auditor at Humongous Insurance needs to view the names, properties, and expiration dates of keys and secrets in an RBAC-enabled vault, but must never see any secret value or key material. Which role satisfies least privilege?","choices":["Key Vault Secrets User","Key Vault Administrator","Key Vault Reader","Key Vault Crypto User"],"answer":[2],"explanation":"Key Vault Reader reads metadata of the vault and its keys, secrets, and certificates but cannot read sensitive values such as secret contents or key material. Secrets User can read secret contents. Administrator has full data access. Crypto User can perform key operations, exceeding read-only metadata needs.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-178","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard grants an engineer the subscription Owner role, expecting that this alone will let the engineer perform key operations on a Managed HSM. What is the actual behavior?","choices":["Owner at the subscription automatically grants Managed HSM data-plane key access","Owner grants read but not write access to Managed HSM keys","The engineer receives the Key Vault Administrator role on the Managed HSM","Management-plane access to a Managed HSM does not grant any data-plane access to keys; local RBAC must be assigned separately"],"answer":[3],"explanation":"Unlike key vaults, granting management-plane access to a Managed HSM does not grant any data-plane access; Managed HSM local RBAC role assignments are required and enforced by the HSM itself. Owner grants no data-plane access, so options one and three are wrong. Managed HSM uses its own local roles, not the vault Key Vault Administrator role.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-179","obj":"4.1.1","difficulty":"medium","type":"single","stem":"VanArsdel needs a named, immutable point-in-time set of App Configuration key-values that is guaranteed not to change after creation, so a deployment can pin exactly the configuration it was tested against. Which feature provides this?","choices":["A configuration snapshot","A sentinel key","A Key Vault reference","A configuration label"],"answer":[0],"explanation":"A snapshot is a named, immutable subset of a store's key-values chosen by key and label filters at creation; once created its contents are guaranteed to remain unchanged. A sentinel key is a refresh trigger, not immutable content. A Key Vault reference points to an external secret. A label groups variants but is not immutable.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-180","obj":"4.1.1","difficulty":"hard","type":"single","stem":"First Up Consultants enables geo-replication on an Azure App Configuration store and uses the provider library. How does the client behave during a regional problem with the primary replica?","choices":["The application must be manually reconfigured to point at a replica","The provider automatically discovers replicas and fails over to a healthy one","Geo-replication only copies data for backup and cannot serve reads","The application must restart to pick up a replica"],"answer":[1],"explanation":"The App Configuration provider library automatically discovers the store's replicas and uses them if an issue arises, providing failover without manual intervention or a restart. No manual reconfiguration is needed. Replicas serve live reads, not just backup. No restart is required for failover.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-181","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Best For You Organics configured a federated identity credential for a GitHub workflow, but token exchange fails without any error message. The most likely cause relates to which requirement?","choices":["The audience value must be a random GUID","The subject supports wildcard matching by default","The issuer, subject, and audience must case-sensitively match the claims in the incoming external token","The federated credential name must equal the subject"],"answer":[2],"explanation":"The federated identity credential issuer, subject, and audience must case-sensitively match the corresponding claims in the external token; a mismatch causes the exchange to fail, often silently. The recommended audience is api://AzureADTokenExchange, not a GUID. Wildcards are not supported in standard federated identity credentials. The name is an independent identifier, unrelated to the subject.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-182","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Litware Foods keeps one key named AppConnection in Azure App Configuration but needs distinct values for the dev, test, and prod environments under that same key name. Which App Configuration feature stores these distinct values?","choices":["Sentinel keys","Snapshots","Key Vault references","Labels"],"answer":[3],"explanation":"Labels let a single key hold multiple values distinguished by label, so the same key name can carry dev, test, and prod values selected by a label filter. Sentinel keys trigger refresh, snapshots are immutable subsets, and Key Vault references point to external secrets; none of these differentiate values of one key by environment.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-183","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Munson's Pickles rotates a customer-managed key that wraps data encryption keys for an Azure service. To avoid disrupting decryption of already-encrypted data immediately after rotation, what must the team do with the previous key version?","choices":["Keep both the old and new key versions enabled until re-wrapping is complete","Delete the previous key version right after rotation","Export the previous version and store it outside Key Vault","Disable soft delete so old versions are purged quickly"],"answer":[0],"explanation":"Rotation re-wraps data encryption keys with the new key version rather than re-encrypting the underlying data, so existing data still depends on the old version; both versions must remain enabled until re-wrapping completes. Deleting or disabling the old version too early breaks decryption of existing data. Exporting it is unnecessary and insecure. Purging via disabling soft delete does not help and reduces recoverability.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-184","obj":"4.1.1","difficulty":"easy","type":"single","stem":"The Phone Company adds a Key Vault reference to Azure App Configuration. A developer asks what App Configuration actually stores for that key-value and how the provider resolves it. Which description is correct?","choices":["App Configuration stores the plaintext secret value copied from Key Vault","App Configuration stores a reference marked by a special content type, and the provider retrieves the actual secret from Key Vault at load time","App Configuration stores an encrypted copy of the secret that only the provider can decrypt","App Configuration stores the Key Vault access key so clients can authenticate"],"answer":[1],"explanation":"A Key Vault reference stores a pointer to the secret, identified by a unique content type; the configuration provider recognizes it and connects to Key Vault to retrieve the actual value at load time. App Configuration never copies the plaintext or an encrypted copy of the secret. It does not store Key Vault credentials; the client authenticates with its own identity.","ref":"https://learn.microsoft.com/azure/app-service/app-service-key-vault-references"},{"id":"4.1.1-185","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Consolidated Messenger enables automatic key rotation on several keys in a Managed HSM with a short creation-based interval. Over time an operator worries about hitting a service limit. Which Managed HSM constraint applies to rotation?","choices":["Managed HSM allows unlimited key versions per key","Managed HSM caps automatic rotation at one version per year","Managed HSM has a limit of 100 versions per key, and rotation-created versions count toward it","Managed HSM does not support automatic key rotation"],"answer":[2],"explanation":"Managed HSM has a limit of 100 versions per key, and key versions created by automatic or manual rotation count toward that limit. Versions are not unlimited. Rotation frequency is not capped at once per year, though the automatic minimum is 28 days. Managed HSM does support automatic rotation.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-186","obj":"4.1.1","difficulty":"hard","type":"single","stem":"School of Fine Art wants a governance principal that can grant and revoke Key Vault data-plane roles such as Key Vault Secrets User for other principals, but should not itself be able to read secret values. Which role best fits?","choices":["Key Vault Administrator","Owner","Key Vault Secrets Officer","Key Vault Data Access Administrator"],"answer":[3],"explanation":"Key Vault Data Access Administrator manages access by adding or removing the Key Vault data-plane role assignments, with an ABAC condition constraining which roles, without granting the ability to read secret values. Key Vault Administrator grants full data access including reading secrets. Owner can assign any role and is far broader. Secrets Officer manages secret data, not role assignments.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-187","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Graphic Design Institute disables public network access on a key vault and uses a private endpoint. A monitoring tool reports that the vault's public DNS name still resolves to an IP address. How should this be interpreted?","choices":["Public DNS records remaining resolvable is by design; disabling public access blocks data-plane connections, not DNS resolution","The private endpoint failed and public access is still open","Soft delete must be turned off to hide the DNS record","The vault must be recreated to remove the public record"],"answer":[0],"explanation":"Disabling public access blocks public data-plane connections, but the vault's public DNS records remain resolvable by design; resolution does not mean the data plane is reachable. DNS resolving does not indicate a failed endpoint or open access. Soft delete is unrelated to DNS. Recreating the vault does not change this designed behavior.","ref":"https://learn.microsoft.com/azure/key-vault/general/network-security"},{"id":"4.1.1-188","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Wide World Importers automates many external pipelines and tries to add a large number of federated identity credentials to a single user-assigned managed identity. They hit a ceiling. What is the standard maximum number of federated identity credentials per application or user-assigned managed identity?","choices":["5","20","10","100"],"answer":[1],"explanation":"A maximum of 20 federated identity credentials can be added to a single application or user-assigned managed identity. The documented limit is 20, so 5 and 10 are too low and 100 is too high; the 100-version figure belongs to Managed HSM key versions, not federated credentials.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-189","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Contoso Pharmaceuticals needs an identity that can create and manage certificates in an RBAC-enabled vault, including certificate policies, but must not manage keys or secrets. Which built-in role is the least-privilege fit?","choices":["Key Vault Administrator","Key Vault Crypto Officer","Key Vault Certificates Officer","Key Vault Secrets Officer"],"answer":[2],"explanation":"Key Vault Certificates Officer performs any action on certificates in the vault except manage permissions, scoping the grant to certificates only. Administrator covers keys, secrets, and certificates. Crypto Officer manages keys. Secrets Officer manages secrets. Only Certificates Officer is limited to certificates.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-190","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Northwind Traders enables purge protection on an existing vault so soft-deleted objects cannot be purged before the retention window elapses. Complete the Azure CLI flag.\n\n```\naz keyvault update \\\n  --name nw-prod-kv \\\n  --resource-group nw-rg \\\n  --enable-________ true\n```","choices":["soft-delete","rbac-authorization","public-network-access","purge-protection"],"answer":[3],"explanation":"The --enable-purge-protection flag turns on purge protection, enforcing the mandatory retention period against purging. --enable-soft-delete governs recoverability, not the no-purge enforcement. --enable-rbac-authorization sets the permission model. --public-network-access controls networking, not deletion protection.","ref":"https://learn.microsoft.com/azure/key-vault/general/soft-delete-overview"},{"id":"4.1.1-191","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Fabrikam provisions a new key vault that must use Azure RBAC rather than legacy access policies for data-plane authorization. Complete the Azure CLI flag.\n\n```\naz keyvault create \\\n  --name fab-kv \\\n  --resource-group fab-rg \\\n  --location eastus \\\n  --enable-________ true\n```","choices":["rbac-authorization","purge-protection","soft-delete","managed-hsm"],"answer":[0],"explanation":"--enable-rbac-authorization sets the vault to the Azure RBAC permission model for data-plane operations. --enable-purge-protection and --enable-soft-delete are recovery features, not the authorization model. There is no --enable-managed-hsm flag on az keyvault create.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-192","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank creates a federated identity credential on a user-assigned managed identity so GitHub Actions can exchange its token. Complete the parameter that specifies the accepted token audience.\n\n```\naz identity federated-credential create \\\n  --name gh-deploy \\\n  --identity-name wg-uami \\\n  --resource-group wg-rg \\\n  --issuer \"https://token.actions.githubusercontent.com\" \\\n  --subject \"repo:woodgrove/deploy:ref:refs/heads/main\" \\\n  --________ \"api://AzureADTokenExchange\"\n```","choices":["issuer","audiences","subject","name"],"answer":[1],"explanation":"The --audiences parameter sets the accepted aud claim value; api://AzureADTokenExchange is the recommended value for Microsoft Entra token exchange. --issuer and --subject are already supplied and identify the provider and workload. --name is the credential identifier, not the audience.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-193","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Relecloud loads Azure App Configuration in Python and must force Key Vault-referenced secrets to be re-fetched every two hours, independent of the configuration refresh cycle, so rotated secrets are picked up. Complete the load parameter.\n\n```\nfrom azure.appconfiguration.provider import load\nfrom azure.identity import DefaultAzureCredential\n\nconfig = load(\n    endpoint=endpoint,\n    credential=DefaultAzureCredential(),\n    keyvault_credential=DefaultAzureCredential(),\n    ________=7200\n)\n```","choices":["refresh_interval","startup_timeout","secret_refresh_interval","replica_discovery_enabled"],"answer":[2],"explanation":"secret_refresh_interval sets an independent interval that forces the provider to retrieve fresh Key Vault secret values, decoupled from the configuration refresh cycle. refresh_interval governs configuration key refresh, not secrets. startup_timeout controls initial load time. replica_discovery_enabled toggles geo-replica discovery.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-194","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Adventure Works uses the .NET App Configuration provider and wants a full configuration reload whenever any loaded key-value changes. Complete the refresh registration call.\n\n```\nbuilder.Configuration.AddAzureAppConfiguration(options =>\n{\n    options.Connect(new Uri(endpoint), new DefaultAzureCredential())\n           .Select(\"TestApp:*\", LabelFilter.Null)\n           .ConfigureRefresh(refreshOptions =>\n               refreshOptions.________());\n});\n```","choices":["Register","SetRefreshInterval","SelectSnapshot","RegisterAll"],"answer":[3],"explanation":"RegisterAll instructs the provider to reload the entire configuration whenever any selected key-value changes, without needing a sentinel key. Register monitors a single specified key. SetRefreshInterval sets timing, not what to watch. SelectSnapshot loads a snapshot and is not a refresh registration call.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-195","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"Fabrikam must choose Azure Key Vault Managed HSM specifically because two properties distinguish it from the Premium vault tier. Which two properties are unique to Managed HSM? (Select two.)","choices":["It is a single-tenant service dedicated to one customer","The customer controls the root of trust through a customer-owned security domain","It is multitenant and operated on shared HSMs","Keys are software-protected rather than HSM-backed","It is validated only to FIPS 140-2 Level 1"],"answer":[0,1],"explanation":"Managed HSM is single-tenant and gives the customer control of the root of trust via a customer-owned security domain; both distinguish it from the multitenant, Microsoft-root-of-trust Premium tier. Multitenant shared HSMs describe Premium and Standard, not Managed HSM. Software-protected keys and FIPS 140-2 Level 1 describe the Standard tier.","ref":"https://learn.microsoft.com/azure/key-vault/general/basic-concepts"},{"id":"4.1.1-196","obj":"4.1.1","difficulty":"easy","type":"multi","stem":"A Litware pipeline configures a federated identity credential. Beyond the audience value, which two settings must case-sensitively match the claims in the incoming external token for the exchange to be authorized? (Select two.)","choices":["name","issuer","description","subject","the credential creation timestamp"],"answer":[1,3],"explanation":"The issuer and subject of the federated identity credential must case-sensitively match the issuer and subject claims in the external token, in addition to the audience. name is a local identifier for the credential, description is free text, and the creation timestamp is metadata; none of these are matched against token claims.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-197","obj":"4.1.1","difficulty":"medium","type":"multi","stem":"A Proseware service running on Azure must read secret values from an RBAC-enabled vault and also list the metadata of keys, without any write or delete rights. Which two built-in roles together provide exactly this least-privilege access? (Select two.)","choices":["Key Vault Secrets Officer","Key Vault Administrator","Key Vault Secrets User","Key Vault Crypto Officer","Key Vault Reader"],"answer":[2,4],"explanation":"Key Vault Secrets User grants read of secret contents, and Key Vault Reader grants read of key, secret, and certificate metadata; together they satisfy read-only value plus metadata needs. Secrets Officer and Administrator both add write and delete rights beyond least privilege. Crypto Officer manages key rotation and policy, exceeding read-only metadata.","ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.1-198","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"Tailwind Traders wants an App Configuration deployment that both guarantees a consistent, unchanging set of values for one release AND stays available if the primary region has an outage. Which two features together address these two goals? (Select two.)","choices":["Configuration snapshots","A sentinel key","Labels","Geo-replication","A Key Vault reference"],"answer":[0,3],"explanation":"Snapshots provide an immutable, consistent set of key-values for a release, and geo-replication with automatic provider failover keeps configuration available during a regional outage. A sentinel key coordinates refresh timing, labels select value variants, and a Key Vault reference externalizes secrets; none of these provide immutability plus regional availability together.","ref":"https://learn.microsoft.com/azure/azure-app-configuration/overview"},{"id":"4.1.1-199","obj":"4.1.1","difficulty":"easy","type":"multi","stem":"With AZURE_TOKEN_CREDENTIALS set to prod, a Woodgrove app relies on DefaultAzureCredential in a deployed Azure host. Which two of the following are deployed-service credentials attempted in that chain, rather than developer-tool credentials? (Select two.)","choices":["Azure CLI","Workload Identity","Managed Identity","Azure PowerShell","Visual Studio Code"],"answer":[1,2],"explanation":"Workload Identity and Managed Identity are deployed-service credentials in the DefaultAzureCredential chain, used when the app runs on an Azure host. Azure CLI, Azure PowerShell, and Visual Studio Code are developer-tool credentials excluded when the chain is restricted to production deployed-service credentials.","ref":"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"},{"id":"4.1.1-200","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Contoso ASP.NET Core service sets the Application Insights connection string in three places at once: a value passed to UseAzureMonitor in code, an APPLICATIONINSIGHTS_CONNECTION_STRING environment variable, and an appsettings.json AzureMonitor section. Which source does the Azure Monitor OpenTelemetry Distro actually use?","choices":["The appsettings.json configuration file value","The environment variable value","The Distro fails to start because of the conflict","The value set in code via UseAzureMonitor"],"answer":[3],"explanation":"For the Azure Monitor OpenTelemetry Distro the connection string precedence is code, then environment variable, then configuration file, so the value set in code via UseAzureMonitor wins. The environment variable and appsettings.json values are both overridden by the code value. The Distro does not error on multiple sources; it deterministically applies the documented precedence.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-201","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A Fabrikam Python service running the Azure Monitor OpenTelemetry Distro sets OTEL_RESOURCE_ATTRIBUTES to include service.name=orders-legacy and also sets OTEL_SERVICE_NAME=orders-api. Which value becomes the service.name resource attribute used as the Cloud Role Name?","choices":["orders-legacy, because OTEL_RESOURCE_ATTRIBUTES is more specific","orders-api, because OTEL_SERVICE_NAME takes precedence","Both values are concatenated into one role name","Neither; the conflict clears service.name"],"answer":[1],"explanation":"When service.name is provided in both OTEL_RESOURCE_ATTRIBUTES and OTEL_SERVICE_NAME, OTEL_SERVICE_NAME takes precedence and sets the service.name resource attribute. OTEL_RESOURCE_ATTRIBUTES does not override OTEL_SERVICE_NAME for service.name. The two values are not concatenated, and the attribute is not cleared.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-202","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank runs a Java application with the Application Insights agent. The connection string is present as a -Dapplicationinsights.connection.string system property, as the APPLICATIONINSIGHTS_CONNECTION_STRING environment variable, and inside applicationinsights.json. Which source does the agent use?","choices":["The applicationinsights.json configuration file","The environment variable","The system property","The agent rejects all three and sends nothing"],"answer":[2],"explanation":"For the Java agent the precedence is system property, then environment variable, then configuration file, so the -D system property wins. The environment variable and JSON file are both lower precedence than the system property. The agent does not reject the configuration when multiple sources are set.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-203","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Adventure Works extends distributed tracing so a downstream service continues the same operation, and a developer inspects the W3C traceparent header on the outgoing request. Which segment of traceparent becomes the Application Insights Operation_Id that groups every span of the trace?","choices":["The parent-id (span-id) segment","The trace-id segment","The trace-flags segment","The version segment"],"answer":[1],"explanation":"The W3C trace-id maps to Application Insights Operation_Id, so all telemetry sharing that trace-id is grouped into one end-to-end operation. The parent-id (span-id) maps to the individual Id and Operation_ParentId, not the operation grouping key. Trace-flags carry the sampling decision, and version identifies the header format, neither of which correlate spans.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-204","obj":"4.1.1","difficulty":"hard","type":"single","stem":"In a Relecloud trace, a dependency row and the downstream request row it triggered must be linked as parent and child so the transaction tree renders correctly. Which Application Insights field on the child request holds the id of the calling dependency span?","choices":["Operation_Id","Operation_ParentId","Id","Operation_Name"],"answer":[1],"explanation":"Operation_ParentId holds the parent span's id (the W3C parent-id of the parent span), which links a child request to the dependency that called it. Operation_Id is the shared trace-id for the whole operation, not the parent link. Id is the child's own span id. Operation_Name is the logical name, not a correlation pointer.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-205","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Proseware browser app and its server share one Application Insights resource. The team needs W3C traceparent headers emitted on outgoing AJAX calls while keeping compatibility with an older service that still reads the legacy Request-Id format. Which distributedTracingMode value meets both needs?","choices":["W3C","AI","AI_AND_W3C","Disabled"],"answer":[2],"explanation":"AI_AND_W3C emits W3C trace context (traceparent and tracestate) plus the legacy AI Request-Id headers, preserving back-compatibility with services instrumented only for the older format. W3C emits only the new headers and can break the legacy service. AI emits only the legacy format and omits traceparent. Disabled turns correlation off entirely.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-206","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Fourth Coffee ASP.NET Core app uses the classic Application Insights SDK with no sampling configuration added. During a traffic spike telemetry volume is automatically reduced. Which sampling type is in effect by default, and at roughly what target?","choices":["Ingestion sampling at 100 percent","Fixed-rate sampling at 20 percent","Adaptive sampling at about five telemetry items per second","No sampling until it is explicitly enabled"],"answer":[2],"explanation":"Adaptive sampling is enabled by default in the ASP.NET and ASP.NET Core SDKs, targeting about five telemetry items per second and adjusting to the observed volume. Fixed-rate and ingestion sampling are not the defaults and must be configured. Sampling is not off by default in these SDKs.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-207","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Litware wants to reduce telemetry from both browser and server while still being able to navigate from a page view to its related server request in Transaction Search. Which sampling type is designed to keep those related client and server items together?","choices":["Adaptive sampling","Fixed-rate sampling","Ingestion sampling","No sampling"],"answer":[1],"explanation":"Fixed-rate sampling synchronizes the client and server sampling decisions so related items, such as a page view and its request, are retained together for navigation in Search. Adaptive sampling is server-side only and does not synchronize with the browser. Ingestion sampling happens at the endpoint and does not coordinate client and server SDK decisions. No sampling would not reduce volume.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-208","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Tailwind Traders sets an ingestion sampling rate of 50 percent in the portal, but their ASP.NET Core app already has adaptive sampling active. Support reports the ingestion rate appears to be ignored. Why?","choices":["Ingestion sampling applies only when no SDK-side sampling is in effect","Ingestion sampling requires the Premium tier","The portal value must match the SDK value exactly","Ingestion sampling only samples browser telemetry"],"answer":[0],"explanation":"When the service endpoint detects SDK sampling already active (a rate below 100 percent), it ignores the configured ingestion sampling rate; ingestion sampling applies only when no other sampling is in operation. There is no tier requirement for ingestion sampling. The portal and SDK values do not need to match. Ingestion sampling is not limited to browser telemetry.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-209","obj":"4.1.1","difficulty":"medium","type":"single","stem":"After enabling aggressive sampling, a Northwind team worries their request-rate dashboards are now inaccurate, yet the standard request-count metric in the Metrics pane still reports correct totals. Which mechanism explains the accurate metric despite sampling?","choices":["Log-based queries automatically multiply by itemCount","Preaggregated (standard) metrics are computed before sampling and are not affected by it","Sampling never applies to requests","The metric is estimated from a moving average"],"answer":[1],"explanation":"SDKs compute preaggregated standard metrics before sampling discards items, so those metrics stay accurate even when log-based queries are affected by high sample rates. Log-based queries need manual sum(itemCount) correction and are not automatically exact. Sampling can apply to requests. The metric is a true preaggregate, not a moving-average estimate.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-210","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Wingtip Toys relies on custom metrics and performance counters for alerting and wants certainty that sampling will never drop them. Which statement is correct about these telemetry types?","choices":["Custom and performance metrics are always kept and are not subject to sampling","They are sampled at the same rate as requests","They are kept only if OperationId is set","They are kept only under fixed-rate sampling"],"answer":[0],"explanation":"Some telemetry types, including performance metrics and custom metrics, are always kept regardless of whether sampling is enabled. They are not sampled alongside requests. Retention does not depend on OperationId for metrics. They are preserved under all sampling modes, not only fixed-rate.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-211","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A Coho Vineyard operations team creates a metric alert on CPU and expects one notification when the condition starts and one when it resolves, without a new fire on every evaluation. Which default behavior of metric alerts provides this?","choices":["Metric alerts are stateless by default and fire each evaluation","Metric alerts are stateful by default, notifying on fire and on resolve","Metric alerts never send resolved notifications","Statefulness is available only for log search alerts"],"answer":[1],"explanation":"Metric alerts are stateful by default, so they notify once when fired and once when resolved rather than on every evaluation. Metric alerts are not stateless by default. They do send resolved notifications. Statefulness is configurable on log search alerts too, so it is not exclusive to them.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-212","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Margie's Travel wants to be alerted when a virtual machine stops sending its heartbeat, that is, when log rows are absent. Microsoft guidance warns that log search alerts are weak at detecting a lack of data. Which alert approach is recommended for this absence-of-data scenario?","choices":["A log search alert counting rows equal to zero","A smart detection alert","An activity log alert","A metric alert, such as metric alerts for logs"],"answer":[3],"explanation":"Log data is latent and semi-structured, so detecting absence with log search alerts risks misfires; Microsoft recommends metric alerts, such as metric alerts for logs, for detecting a lack of data like a missing heartbeat. A row-count log alert is exactly the pattern the guidance cautions against for absence. Smart detection targets failure anomalies in web apps, not custom heartbeat absence. Activity log alerts track control-plane events, not VM heartbeat gaps.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-213","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines enables dynamic thresholds on a brand-new metric alert and is surprised it does not fire immediately during an obvious spike. What minimum data condition must be met before dynamic thresholds trigger?","choices":["At least 3 days and 30 samples of historical data","At least 21 days of data","At least 10 samples in the last hour","No history is required"],"answer":[0],"explanation":"Alert rules using dynamic thresholds do not trigger before collecting at least 3 days and 30 samples of data, so new resources wait until enough history exists. Weekly seasonality needs about three weeks, but that is not the minimum to fire. Ten samples in an hour is not the documented threshold. Some history is always required.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-214","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A VanArsdel engineer wants a single metric alert rule that both uses dynamic thresholds and evaluates two separate conditions at once, but the portal will not allow it. Which limitation explains this?","choices":["Dynamic thresholds cannot be used in alert rules that monitor multiple conditions","Dynamic thresholds require a 1-minute frequency","Multiple conditions require log search alerts only","Dynamic thresholds need purge protection enabled"],"answer":[0],"explanation":"You cannot use dynamic thresholds in alert rules that monitor multiple conditions; each dynamic-threshold rule evaluates a single condition. Dynamic thresholds are not tied to a 1-minute frequency (that restriction applies to log search alerts). Multiple static conditions are allowed on metric alerts. Purge protection is a Key Vault feature, unrelated to alerts.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-215","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Trey Research wants an alert rule that, when it fires, sends an email to on-call, posts to a webhook, and triggers an Azure Function, with those actions reusable across many rules. Which Azure Monitor construct defines this reusable set of notifications and actions?","choices":["An alert processing rule","An action group","A diagnostic setting","A data collection rule"],"answer":[1],"explanation":"An action group is the reusable collection of notifications (email, SMS) and actions (webhook, Azure Function, Logic App) that alert rules invoke when they fire. Alert processing rules modify or suppress alerts rather than define the action set. Diagnostic settings route platform logs and metrics. Data collection rules govern log ingestion, not alert actions.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-216","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Lucerne Publishing compares a metric alert with a log search alert for the same underlying signal and finds the metric alert reacts noticeably faster. Which characteristic best explains the difference?","choices":["Log search alerts always run at 1-second frequency","Metric alerts offer near-real-time monitoring, while log data is inherently more latent","Metric alerts skip evaluation windows","Log search alerts cannot be scheduled"],"answer":[1],"explanation":"Metric alerts provide near-real-time monitoring, whereas logs are semi-structured and more latent, so log search alerts react more slowly for the same underlying signal. Log search alerts do not run every second. Metric alerts still use evaluation windows. Log search alerts are scheduled at a chosen frequency, so scheduling is not the difference.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-217","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Graphic Design Institute opens Application Map for a distributed app but sees two microservices collapsed into a single node. Which telemetry property determines how components are drawn as separate nodes on the map?","choices":["Operation_Id","The cloud role name (roleName or name)","The instrumentation key","Session_Id"],"answer":[1],"explanation":"Application Map identifies individual components by their roleName or name property; distinct role names render as separate nodes, so two services sharing a role name collapse into one. Operation_Id groups a single transaction, not component identity. The instrumentation key or connection string identifies the resource, not per-node roles. Session_Id tracks user sessions, not architecture nodes.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-218","obj":"4.1.1","difficulty":"medium","type":"single","stem":"A Humongous Insurance developer searches Transaction Search for HomeController.About by typing the fragment out and gets no results, yet searching about returns the item. Which search behavior explains this?","choices":["Search matches complete words, not substrings","Search is case-sensitive on the operation name","Search ignores custom properties","Search only indexes exceptions"],"answer":[0],"explanation":"Transaction Search matches complete words rather than substrings, so a fragment like out does not match, while the whole word about does. The mismatch is about word boundaries, not case. Search does look at property values including custom properties. It indexes many telemetry types, not only exceptions.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-219","obj":"4.1.1","difficulty":"hard","type":"single","stem":"The Phone Company is rolling out a hotfix and wants to watch request and failure counts update within about a second to validate the fix live, after which the data is not retained. Which Application Insights tool is purpose-built for this sub-second, non-retained view?","choices":["Application Map","Live Metrics","Transaction Search","Profiler"],"answer":[1],"explanation":"Live Metrics streams performance and failure counters with roughly one-second latency for real-time validation, and the stream is not retained. Application Map shows architecture and aggregated health, not a sub-second stream. Transaction Search inspects stored individual items. Profiler captures call-stack traces, not a live counter stream.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-220","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Consolidated Messenger has a slow .NET operation and needs code-level call stacks with hot paths to find the bottleneck method, sampled from production traffic. Which Application Insights feature captures this?","choices":["Live Metrics","Application Insights Profiler","Smart detection","Availability tests"],"answer":[1],"explanation":"Application Insights Profiler captures call stacks and hot paths for .NET operations from real traffic, exposing the methods that dominate response time. Live Metrics shows counters, not call stacks. Smart detection flags failure anomalies but does not produce call-stack traces. Availability tests probe endpoints from outside, not internal code paths.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-221","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Best For You Organics needs a log search alert that evaluates each returned row individually for faster, near-real-time alerting at scale, rather than aggregating a count over a window. Which log alert option fits?","choices":["A stateful aggregated log search alert","A simple log search alert","A metric alert with dynamic thresholds","A smart detection alert"],"answer":[1],"explanation":"Simple log search alerts evaluate each row individually for faster, near-real-time alerting at scale, unlike aggregated log search alerts. A stateful aggregated log alert computes an aggregation over the window rather than per row. A metric alert does not run a Log Analytics query per row. Smart detection is an automatic anomaly feature, not a per-row rule.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-222","obj":"4.1.1","difficulty":"hard","type":"single","stem":"A First Up Consultants analyst joins requests to dependencies in Log Analytics using join without specifying a kind, and notices duplicate left-side rows were collapsed. Which default join flavor produced this, and what does it do?","choices":["inner, which keeps all matching pairs","leftouter, which keeps all left rows","innerunique, which deduplicates keys on the left side","fullouter, which keeps all rows from both tables"],"answer":[2],"explanation":"When kind is omitted, join uses innerunique, which removes duplicate keys from the left table before matching, a behavior tuned for log correlation scenarios. inner is the standard join but is not the default and does not dedupe the left. leftouter keeps unmatched left rows. fullouter keeps unmatched rows from both sides.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-223","obj":"4.1.1","difficulty":"easy","type":"single","stem":"A School of Fine Art report counts requests with summarize count() while SDK sampling is active, and the totals look too low. A reviewer says the query must account for sampling. Which change yields sampling-corrected counts?","choices":["Replace count() with sum(itemCount)","Replace count() with dcount(Id)","Add take 1000 before summarize","Multiply the result by the number of nodes"],"answer":[0],"explanation":"Each retained record carries an itemCount representing the items it stands in for, so summarize sum(itemCount) restores the true count when sampling is active. dcount(Id) counts distinct ids, not sampled volume. take limits rows and worsens accuracy. Node count is unrelated to the per-record itemCount weighting.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-224","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Complete the KQL so the request count is corrected for Application Insights sampling.\n\n```\nrequests\n| where timestamp > ago(1h)\n| summarize corrected = ________(itemCount) by name\n```","choices":["count","sum","avg","dcount"],"answer":[1],"explanation":"sum(itemCount) adds each retained record's itemCount weight, reconstructing the true request count under sampling. count() ignores itemCount and undercounts. avg(itemCount) gives a mean weight, not a total. dcount(itemCount) counts distinct weight values, which is meaningless here.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-225","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Complete the KQL that estimates the effective percentage of request telemetry retained under sampling.\n\n```\nrequests\n| summarize samplingPercent = 100 / ________(itemCount)\n```","choices":["avg","sum","count","max"],"answer":[0],"explanation":"Each record represents on average itemCount items, so 100 divided by avg(itemCount) yields the effective retained sampling percentage. sum(itemCount) is the corrected total, not an average weight. count() is the raw retained row count. max(itemCount) uses a single extreme weight rather than the mean.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-226","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Complete the join so every request row is kept even when it has no matching dependency.\n\n```\nrequests\n| join kind=________ (\n    dependencies\n) on operation_Id\n```","choices":["inner","innerunique","leftouter","leftanti"],"answer":[2],"explanation":"leftouter returns all rows from the left table (requests) plus matching dependency rows, preserving requests that have no dependency. inner and innerunique drop requests without a matching dependency. leftanti returns only requests with no match, discarding the matched ones.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-227","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Complete the join that returns only requests with no matching trace, to find operations missing their logs.\n\n```\nrequests\n| join kind=________ (\n    traces\n) on operation_Id\n```","choices":["leftouter","leftanti","inner","fullouter"],"answer":[1],"explanation":"leftanti returns rows from the left table that have no match in the right table, exactly the requests missing a corresponding trace. leftouter keeps all left rows including matches. inner keeps only matches. fullouter keeps everything from both tables, not just the unmatched left rows.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-228","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Complete the KQL that builds a per-hour time series of request counts, filling empty bins with zero.\n\n```\nrequests\n| ________ total = count() default=0 on timestamp step 1h by name\n```","choices":["summarize","mv-expand","make-series","evaluate"],"answer":[2],"explanation":"make-series builds regularly spaced series along a time axis with a step and a default fill value for empty bins, producing arrays suitable for series analysis. summarize aggregates into rows without generating gap-filled series arrays. mv-expand expands arrays into rows. evaluate invokes plugins, not series construction.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-229","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Complete the KQL that groups average request duration into 5-minute time buckets.\n\n```\nrequests\n| summarize avg(duration) by ________(timestamp, 5m)\n```","choices":["floor","startofday","bin","range"],"answer":[2],"explanation":"bin(timestamp, 5m) rounds each timestamp down to a 5-minute boundary, creating the time buckets that summarize groups by. floor rounds numbers but is not the time-bucket idiom here. startofday truncates to a day, not 5 minutes. range generates a series of values, not a grouping expression.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-230","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Complete the KQL that returns the 95th percentile of request duration per operation.\n\n```\nrequests\n| summarize p95 = ________(duration, 95) by name\n```","choices":["percentile","avg","max","percentiles"],"answer":[0],"explanation":"percentile(duration, 95) estimates the nearest-rank 95th percentile of the column within each group. avg returns the mean, not a percentile. max returns the single highest value. percentiles takes one or more percentile arguments and returns multiple columns, so it does not fit this single-value syntax.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-231","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Complete the KQL that returns only the five operations with the highest average duration.\n\n```\nrequests\n| summarize avgDur = avg(duration) by name\n| ________ 5 by avgDur desc\n```","choices":["take","top","sample","limit"],"answer":[1],"explanation":"top 5 by avgDur desc sorts by average duration and returns the five highest rows in one operator. take and its alias limit return an arbitrary unordered five rows. sample returns a random subset. Neither take nor limit sorts before truncating.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"},{"id":"4.1.1-232","obj":"4.1.1","difficulty":"easy","type":"multi","stem":"A Wide World Importers team enables the Azure Monitor OpenTelemetry Distro on an ASP.NET Core app for production. Which two actions correctly establish where telemetry is sent and the component identity? (Select two.)","choices":["Set APPLICATIONINSIGHTS_CONNECTION_STRING to the resource connection string","Set OTEL_SERVICE_NAME to the component's role name","Set an instrumentation key as a URL query parameter","Set OTEL_TRACES_EXPORTER to None","Enable the Key Vault admin account"],"answer":[0,1],"explanation":"The connection string (via environment variable) tells the Distro which Application Insights resource to send to, and OTEL_SERVICE_NAME sets the service.name resource attribute used as the Cloud Role Name. Instrumentation keys are deprecated in favor of connection strings and never belong in a URL. OTEL_TRACES_EXPORTER=None disables trace export entirely. The Key Vault admin account is unrelated to telemetry configuration.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-enable"},{"id":"4.1.1-233","obj":"4.1.1","difficulty":"medium","type":"multi","stem":"A Southridge Video team is choosing between metric alerts and log search alerts. Which two statements are accurate for their design? (Select two.)","choices":["Metric alerts provide near-real-time evaluation and are stateful by default","Log search alerts can run arbitrary Log Analytics (KQL) queries at a set frequency","Log search alerts are the recommended choice for detecting absence of data","Metric alerts require a KQL query for every condition","Metric alerts cannot send a resolved notification"],"answer":[0,1],"explanation":"Metric alerts evaluate metrics in near real time and are stateful by default; log search alerts run KQL queries against logs at a chosen frequency for advanced logic. For absence of data, metric alerts are recommended over log alerts. Metric alerts evaluate metrics directly and do not need a KQL query per condition. Metric alerts do send resolved notifications.","ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-overview"},{"id":"4.1.1-234","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"A Nod Publishers engineer reviews how adaptive sampling behaves in the classic Application Insights SDKs. Which two statements are correct? (Select two.)","choices":["Adaptive sampling is enabled by default in the ASP.NET and ASP.NET Core SDKs","Adaptive sampling adjusts the sampling percentage automatically as telemetry volume changes","Adaptive sampling is the default sampling mode in the Java agent","Adaptive sampling synchronizes browser and server sampling decisions","Adaptive sampling requires you to set a fixed sampling percentage manually"],"answer":[0,1],"explanation":"Adaptive sampling is on by default in the ASP.NET and ASP.NET Core SDKs and automatically raises or lowers the sampling percentage based on observed telemetry volume. Java does not support adaptive sampling. Synchronizing client and server decisions is a property of fixed-rate sampling. Adaptive sampling sets the rate automatically rather than requiring a manual fixed percentage.","ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview"},{"id":"4.1.1-235","obj":"4.1.1","difficulty":"easy","type":"multi","stem":"An Alpine Ski House team plans to use dynamic thresholds on Azure Monitor alerts. Which two constraints must they account for? (Select two.)","choices":["Dynamic thresholds cannot be used in rules that monitor multiple conditions","Dynamic thresholds cannot be used in log search alert rules with 1-minute frequency","Dynamic thresholds require purge protection on the workspace","Dynamic thresholds work only with fixed static bounds you supply","Dynamic thresholds ignore historical data entirely"],"answer":[0,1],"explanation":"Dynamic thresholds cannot be applied to multi-condition rules, and they cannot be used in log search alert rules that run at 1-minute frequency. Purge protection is a Key Vault feature, not a dynamic-threshold prerequisite. Dynamic thresholds compute bounds from history rather than requiring static bounds, and they rely on about 10 days of historical data rather than ignoring it.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries"}],"cases":{}};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives, CASES = DATA.cases || {};
// per-exam storage prefix ("ai500" for AI-500), so several exams on one site keep separate progress
const KEY = DATA.exam.id.toLowerCase().replace(/[^a-z0-9]/g, "");
const $app = document.getElementById("app");
const $$ = s => [...$app.querySelectorAll(s)];
// notice (set per category in build.py) and content date (CONTENT_DATE in objectives.py); the date ages by itself
(function () {
  const e = DATA.exam, box = document.getElementById("banner"), lines = [];
  if (e.notice) lines.push(e.notice);
  if (e.contentDate) {
    const p = e.contentDate.split("-"), d = new Date(Date.UTC(+p[0], +p[1] - 1, 1)), now = new Date();
    const months = (now.getFullYear() - +p[0]) * 12 + now.getMonth() + 1 - +p[1];
    lines.push("Content as of " + d.toLocaleDateString("en", { month: "long", year: "numeric", timeZone: "UTC" }) + "." +
      (months > 6 ? " That is more than six months ago: the exam or the product may have changed, so check the current official sources." : ""));
  }
  lines.forEach(t => { const p = document.createElement("p"); p.className = "note"; p.textContent = t; box.appendChild(p); });
})();

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get(KEY + ".history", {}); // id -> true/false (last result fully correct)

const theme = store.get(KEY + ".theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set(KEY + ".theme", next);
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => p.split("\n").every(l => l.startsWith("- "))
      ? `<ul>${p.split("\n").map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`
      : "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const why = s => s ? `<div class="why">${inline(s)}</div>` : "";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dom = q => q.obj.split(".")[0];
const isStd = q => !q.case && !q.series;
const SERIES_NOTE = "This question is one of a series that share the same scenario. Each question in the series offers a different solution that might or might not meet the goal. A series can have more than one correct solution, or none. After you answer a question in this series, you cannot return to it, and it does not appear on the review screen.";
const HOW = {
  multi: q => `Choose ${q.answer.length}`, order: q => `Arrange ${q.answer.length} in order`,
  yesno: () => "Yes / No for each statement", dragdrop: () => "Drag and drop", dropdown: () => "Select from each list",
};

// ---------- answers ----------
function blank(q) {
  if (q.type === "yesno") return q.choices.map(() => null);
  if (q.type === "dragdrop" || q.type === "dropdown") return q.targets.map(() => null);
  return [];
}
function complete(q, p) {
  if (q.type === "single") return p.length === 1;
  if (q.type === "multi" || q.type === "order") return p.length === q.answer.length;
  return p.every(v => v !== null);
}
const answered = it => it.picked.some(v => v !== null);
// Partial credit per box/statement/selection, like the real exam; build lists are all-or-nothing.
function grade(q, p) {
  if (q.type === "single") return +(p[0] === q.answer[0]);
  if (q.type === "multi") return p.filter(x => q.answer.includes(x)).length / q.answer.length;
  if (q.type === "order") return +(p.length === q.answer.length && p.every((x, i) => x === q.answer[i]));
  if (q.type === "yesno") return p.filter((v, i) => v === q.answer.includes(i)).length / p.length;
  return p.filter((v, i) => v === q.answer[i]).length / p.length; // dragdrop, dropdown
}
const item = q => ({ q, order: !q.choices ? [] : q.series ? [0, 1] : shuffle(q.choices.map((_, i) => i)), picked: blank(q), checked: false, locked: false, mark: false });

// ---------- home ----------
let S = null, tick = null;
window.onbeforeunload = () => (S && S.mode === "exam" && !S.done ? true : undefined);

function home() {
  clearInterval(tick); S = null;
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all", ...store.get(KEY + ".cfg", {}) };
  const types = Object.entries(Q.reduce((a, q) => (a[q.case ? "case" : q.series ? "series" : q.type] = (a[q.case ? "case" : q.series ? "series" : q.type] || 0) + 1, a), {}));
  $app.innerHTML = `
  <div class="card">
    <h2>New session</h2>
    <fieldset><legend>Mode</legend><select id="mode">
      <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Practice (instant feedback)</option>
      <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Exam (feedback at the end)</option>
      <option value="sim" ${cfg.mode === "sim" ? "selected" : ""}>Exam simulation (50 questions, 100 minutes)</option>
    </select>
    <p class="muted" id="simnote">Exam simulation ignores the filters below: questions are weighted by the study-guide domain percentages and include a problem-solution series and a case study in their own sections. No objective or difficulty hints, a countdown timer, mark for review, and a review screen per section. Once you leave a section you cannot return to it.</p>
    </fieldset>
    <div id="filters">
    <fieldset><legend>Domains</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} questions)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Difficulty</legend><div class="row">
      ${[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Question pool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> All</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Not seen yet</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Previously wrong (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Questions</legend><select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></fieldset>
    </div>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Progress on this device</h2>
    <p>${seen} of ${Q.length} questions answered, ${seen - wrong} last correct, ${wrong} last wrong.</p>
    ${statsTable()}
    <p class="muted">Question types: ${types.map(([t, n]) => `${t} ${n}`).join(", ")}.</p>
    <div class="actions"><button class="ghost" id="reset" type="button">Reset progress</button></div>
  </div>`;
  const mode = document.getElementById("mode"), sync = () => {
    document.getElementById("filters").hidden = mode.value === "sim";
    document.getElementById("simnote").hidden = mode.value !== "sim";
  };
  mode.onchange = sync; sync();
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all progress?")) { history = {}; store.set(KEY + ".history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domain</th><th>Done</th><th>Correct</th></tr>${rows}</table>`;
}

// keep case-study and series questions together, in id order, at the position of their first member
function grouped(qs) {
  const g = new Map();
  qs.forEach(q => { const k = q.case || q.series || q.id; if (!g.has(k)) g.set(k, []); g.get(k).push(q); });
  return [...g.values()].flatMap(xs => xs.sort((a, b) => a.id.localeCompare(b.id)));
}

function simSections() {
  const caseIds = [...new Set(Q.filter(q => q.case).map(q => q.case))];
  const seriesIds = [...new Set(Q.filter(q => q.series).map(q => q.series))];
  const cs = caseIds.length ? grouped(Q.filter(q => q.case === pick(caseIds))) : [];
  const sr = seriesIds.length ? grouped(Q.filter(q => q.series === pick(seriesIds))) : [];
  const n = 50 - cs.length - sr.length;
  // domain share = midpoint of the study-guide weight range, largest remainder rounding
  const w = Object.entries(DOMAINS).map(([k, d]) => { const [a, b] = d.weight.match(/\d+/g).map(Number); return [k, (a + (b ?? a)) / 2]; });
  const tot = w.reduce((s, [, x]) => s + x, 0);
  const cnt = w.map(([k, x]) => ({ k, c: Math.floor(n * x / tot), r: (n * x / tot) % 1 }));
  [...cnt].sort((a, b) => b.r - a.r).slice(0, n - cnt.reduce((s, x) => s + x.c, 0)).forEach(x => x.c++);
  const std = shuffle(cnt.flatMap(({ k, c }) => shuffle(Q.filter(q => isStd(q) && dom(q) === k)).slice(0, c)));
  return [["std", std], ["series", sr], ["case", cs]].filter(([, xs]) => xs.length);
}

function start() {
  const mode = document.getElementById("mode").value;
  let secs;
  if (mode === "sim") {
    store.set(KEY + ".cfg", { ...store.get(KEY + ".cfg", {}), mode });
    secs = simSections();
  } else {
    const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
    const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode };
    store.set(KEY + ".cfg", cfg);
    let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
    if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
    if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
    if (!pool.length) { document.getElementById("msg").textContent = "No questions match this selection."; return; }
    secs = [["std", grouped(shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n))]];
  }
  const items = [], sections = [];
  secs.forEach(([kind, qs]) => { sections.push({ kind, start: items.length, end: items.length + qs.length }); items.push(...qs.map(item)); });
  S = { mode: mode === "practice" ? "practice" : "exam", sim: mode === "sim", items, secs: sections, sec: 0, i: 0, tab: 0, sel: null, t0: Date.now() };
  if (S.sim) {
    S.deadline = Date.now() + 100 * 60000;
    tick = setInterval(() => {
      const left = S.deadline - Date.now(), el = document.getElementById("clock");
      if (left <= 0) { alert("Time is up. Your exam is submitted."); return finish(); }
      if (el) el.textContent = clock(left);
    }, 1000);
    return intro();
  }
  show();
}
const clock = ms => { const s = Math.ceil(ms / 1000); return `Time left ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const clockChip = () => S.deadline ? `<span class="chip clock" id="clock">${clock(S.deadline - Date.now())}</span>` : "";

function intro() {
  const sec = S.secs[S.sec], n = sec.end - sec.start;
  const text = {
    std: `This section contains ${n} questions. You can move back and forth, mark questions for review, and change your answers until you finish the section. When you finish it, you cannot return to it.`,
    series: `This section contains a problem-solution series of ${n} questions. ${SERIES_NOTE}`,
    case: `This section contains a case study with ${n} questions. Each question uses the same scenario; use the tabs to read the parts of the case study. You can move between the questions of this case study until you finish the section.`,
  }[sec.kind];
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Section ${S.sec + 1} of ${S.secs.length}</span>${clockChip()}</div>
    <h2>${{ std: "Questions", series: "Problem-solution series", case: "Case study" }[sec.kind]}</h2>
    <p>${esc(text)}</p>
    ${S.sec === 0 ? `<p class="muted">${S.items.length} questions in total, 100 minutes. Passing score: 700 on a scale of 1 to 1000.</p>` : ""}
    <div class="actions"><button id="go" type="button">Start section</button></div></div>`;
  document.getElementById("go").onclick = () => { S.i = sec.start; S.tab = 0; show(); };
}

// ---------- question ----------
function casePanel(id) {
  const c = CASES[id]; if (!c) return "";
  const t = Math.min(S.tab, c.sections.length - 1);
  return `<details class="case" ${S.caseClosed ? "" : "open"}><summary><strong>Case study: ${esc(c.title)}</strong></summary>
    <div class="tabs">${c.sections.map(([h], k) => `<button type="button" class="ghost sm" data-tab="${k}" aria-pressed="${k === t}">${esc(h)}</button>`).join("")}</div>
    <div class="case-body">${md(c.sections[t][1])}</div></details>`;
}

function sel(it, i, lock, reveal) {
  const q = it.q, t = q.targets[i], p = it.picked;
  const cls = reveal ? (p[i] === q.answer[i] ? "correct" : "wrong") : "";
  return `<select data-t="${i}" class="${cls}" ${lock ? "disabled" : ""} aria-label="Box ${i + 1}"><option value="">Select...</option>${t.options.map((o, k) => `<option value="${k}" ${p[i] === k ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

function stemHTML(it, lock, reveal) {
  const h = md(it.q.stem);
  return it.q.type === "dropdown" ? h.replace(/\[\[(\d+)\]\]/g, (_, n) => sel(it, n - 1, lock, reveal)) : h;
}

function answerHTML(it, lock, reveal) {
  const q = it.q, p = it.picked, dis = lock ? "disabled" : "", drag = !lock;
  switch (q.type) {
    case "single": case "multi": {
      const multi = q.type === "multi";
      return `<div>${it.order.map(ci => {
        const cls = reveal ? (q.answer.includes(ci) ? "correct" : p.includes(ci) ? "wrong" : "") : "";
        return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" data-c="${ci}" ${dis} ${p.includes(ci) ? "checked" : ""}>
          <span>${inline(q.choices[ci])}${reveal ? why(q.rationale[ci]) : ""}</span></label>`;
      }).join("")}</div>`;
    }
    case "yesno":
      return `<table class="yn"><tr><th>Statement</th><th>Yes</th><th>No</th></tr>${q.choices.map((s, i) => {
        const cls = reveal ? (p[i] === q.answer.includes(i) ? "correct" : "wrong") : "";
        return `<tr class="${cls}"><td>${inline(s)}${reveal ? why(q.rationale[i]) : ""}</td>${[1, 0].map(v => `<td><input type="radio" name="yn${i}" data-i="${i}" data-v="${v}" aria-label="${v ? "Yes" : "No"}: statement ${i + 1}" ${dis} ${p[i] === !!v ? "checked" : ""}></td>`).join("")}</tr>`;
      }).join("")}</table>`;
    case "order": {
      const tile = (ci, k) => {
        const cls = reveal ? (q.answer[k] === ci ? "correct" : "wrong") : "";
        return `<div class="tile ${cls}" draggable="${drag}" data-c="${ci}" ${k === undefined && !lock ? `tabindex="0" role="button"` : ""}>
          ${k === undefined ? "" : `<span class="num">${k + 1}.</span>`}<span class="txt">${inline(q.choices[ci])}</span>
          ${k === undefined || lock ? "" : `<span class="tools"><button type="button" class="ghost sm" data-up="${k}" aria-label="Move up">&uarr;</button><button type="button" class="ghost sm" data-down="${k}" aria-label="Move down">&darr;</button><button type="button" class="ghost sm" data-rm="${k}" aria-label="Remove">&times;</button></span>`}</div>`;
      };
      return `<div class="dd">
        <div><div class="lbl">Actions</div><div class="zone pool" data-zone="pool">${it.order.filter(ci => !p.includes(ci)).map(ci => tile(ci)).join("")}</div></div>
        <div><div class="lbl">Answer area</div><div class="zone area" data-zone="area">${p.map((ci, k) => tile(ci, k)).join("")}</div></div></div>
        ${lock ? "" : `<p class="muted">Click or drag an action into the answer area, then use the arrows to put it in order.</p>`}
        ${reveal ? `<div class="lbl">Correct sequence</div><ol>${q.answer.map(ci => `<li>${inline(q.choices[ci])}${why(q.rationale[ci])}</li>`).join("")}</ol>
          <div class="lbl">Not part of the sequence</div><ul>${q.choices.map((c, ci) => q.answer.includes(ci) ? "" : `<li>${inline(c)}${why(q.rationale[ci])}</li>`).join("")}</ul>` : ""}`;
    }
    case "dragdrop":
      return `<div class="lbl">Values</div><div class="zone pool flat">${it.order.map(ci => `<div class="tile ${S.sel === ci ? "sel" : ""}" draggable="${drag}" data-c="${ci}" ${lock ? "" : `tabindex="0" role="button"`}><span class="txt">${inline(q.choices[ci])}</span></div>`).join("")}</div>
        <div class="lbl">Answer area</div><table>${q.targets.map((t, i) => {
          const ok = p[i] === q.answer[i], cls = reveal ? (ok ? "correct" : "wrong") : "";
          return `<tr><td>${inline(t)}</td><td><div class="slot ${cls}" data-t="${i}" ${lock ? "" : `tabindex="0" role="button"`}>${p[i] === null ? `<span class="muted">${lock ? "(empty)" : "Click a value, then click here"}</span>` : inline(q.choices[p[i]])}</div>
            ${reveal ? why((ok ? "" : `Answer: ${q.choices[q.answer[i]]}. `) + q.rationale[i]) : ""}</td></tr>`;
        }).join("")}</table>
        ${lock ? "" : `<p class="muted">Each value may be used once, more than once, or not at all.</p>`}
        ${reveal ? `<div class="lbl">About each value</div><ul>${q.choices.map((c, ci) => `<li><strong>${inline(c)}</strong>${why(q.notes[ci])}</li>`).join("")}</ul>` : ""}`;
    case "dropdown": {
      const inStem = q.stem.includes("[[1]]");
      if (inStem && !reveal) return "";
      return `<table>${q.targets.map((t, i) => {
        const ok = p[i] === q.answer[i];
        return `<tr><td>${inStem ? `Box ${i + 1}` : inline(t.label)}</td><td>${inStem ? "" : sel(it, i, lock, reveal)}
          ${reveal ? `<div class="why"><span class="${ok ? "ok" : "bad"}">${ok ? "Your answer is correct" : p[i] === null ? "No answer" : "Your answer is incorrect"}</span>
            <ul>${t.options.map((o, k) => `<li class="${k === q.answer[i] ? "ok" : k === p[i] ? "bad" : ""}"><code>${esc(o)}</code>: ${inline(t.why[k])}</li>`).join("")}</ul></div>` : ""}</td></tr>`;
      }).join("")}</table>`;
    }
  }
  return "";
}

function bindAnswer(it, lock) {
  if (lock) return;
  const q = it.q, p = it.picked, redraw = () => show(true);
  $$("input[data-c]").forEach(b => b.onchange = () => {
    const ci = +b.dataset.c;
    if (q.type === "single") it.picked = [ci];
    else if (b.checked) { if (p.length < q.answer.length) p.push(ci); } else p.splice(p.indexOf(ci), 1);
    redraw();
  });
  $$("input[data-i]").forEach(b => b.onchange = () => { p[+b.dataset.i] = b.dataset.v === "1"; redraw(); });
  $$("select[data-t]").forEach(s => s.onchange = () => { p[+s.dataset.t] = s.value === "" ? null : +s.value; redraw(); });
  $$(".tile[draggable=true]").forEach(t => t.ondragstart = e => e.dataTransfer.setData("text/plain", t.dataset.c));
  $$("[tabindex][role=button]").forEach(el => el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } });
  const zone = (el, drop) => { el.ondragover = e => e.preventDefault(); el.ondrop = e => { e.preventDefault(); drop(+e.dataTransfer.getData("text/plain"), e); redraw(); }; };
  if (q.type === "order") {
    $$(".pool .tile").forEach(t => t.onclick = () => { if (p.length < q.answer.length) { p.push(+t.dataset.c); redraw(); } });
    $$("[data-up]").forEach(b => b.onclick = () => { const k = +b.dataset.up; if (k > 0) [p[k - 1], p[k]] = [p[k], p[k - 1]]; redraw(); });
    $$("[data-down]").forEach(b => b.onclick = () => { const k = +b.dataset.down; if (k < p.length - 1) [p[k + 1], p[k]] = [p[k], p[k + 1]]; redraw(); });
    $$("[data-rm]").forEach(b => b.onclick = () => { p.splice(+b.dataset.rm, 1); redraw(); });
    $$("[data-zone=area]").forEach(z => zone(z, (ci, e) => {
      const from = p.indexOf(ci);
      if (from >= 0) p.splice(from, 1); else if (p.length >= q.answer.length) return;
      const li = e.target.closest(".tile[data-c]"), at = li ? p.indexOf(+li.dataset.c) : -1;
      p.splice(at < 0 ? p.length : at, 0, ci);
    }));
    $$("[data-zone=pool]").forEach(z => zone(z, ci => { const k = p.indexOf(ci); if (k >= 0) p.splice(k, 1); }));
  }
  if (q.type === "dragdrop") {
