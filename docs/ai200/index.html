de does not select the public container; the isMain flag does.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-179","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Best For You Organics runs a production App Service app in the Standard tier and wants zero-downtime deploys with pre-swap validation on a staging slot. During a swap, which behavior is correct regarding where initialization occurs?","choices":["Initialization of the swapped app happens on the source slot while the target production slot stays online, so no requests are dropped","Initialization happens on the target slot, which briefly goes offline until warm-up completes","The source slot is deleted after the swap and recreated from the target","Both slots go offline simultaneously during the routing switch"],"answer":[0],"explanation":"All initialization work happens on the source slot; the target slot remains online while the source is prepared and warmed up, so traffic redirection is seamless. The target slot does not go offline; that is the point of slot swaps. Both slots are never offline together. The source slot is not deleted; it receives the previous production app after the swap.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-180","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Graphic Design Institute needs a connection string and a database region setting to stay with the production slot and never move during a swap, while application build settings should swap normally. Which mechanism achieves the connection-string requirement?","choices":["Move the connection string into the Dockerfile so it is baked into the image","Rely on the default, because connection strings are always slot specific and never swap","Set WEBSITE_OVERRIDE_STICKY_EXTENSION_VERSIONS to 0 on both slots","Mark the connection string as a deployment slot setting so it becomes sticky and does not swap"],"answer":[3],"explanation":"Connection strings swap by default but can be configured to stick to a slot by marking them as deployment slot settings. Connection strings are NOT slot specific by default; they swap unless marked sticky. WEBSITE_OVERRIDE_STICKY_EXTENSION_VERSIONS governs site extension versions, not connection strings. Baking secrets into the image is a poor practice and removes runtime configurability.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-181","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Margie's Travel runs Web App for Containers on Linux and wants every push of a new image to a staging slot to trigger an automatic swap into production once warmed up. The team finds the feature unavailable. Why?","choices":["Auto swap is disabled whenever a health check path is configured","Auto swap is not supported in web apps on Linux and in Web App for Containers","Auto swap requires the Isolated tier, which the plan does not use","Auto swap requires WEBSITES_PORT to be unset on the staging slot"],"answer":[1],"explanation":"Auto swap is explicitly not supported for web apps on Linux and for Web App for Containers. Auto swap works on Standard and higher tiers, not only Isolated. A configured health check path does not disable auto swap. WEBSITES_PORT is unrelated to auto swap availability.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-182","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove enables swap-with-preview to validate a staging slot before completing a swap into production, but the portal rejects the preview action. The team recently enabled App Service authentication on the production slot. What is the cause?","choices":["Swap with preview requires a warm-up ping path returning status 200 only","Swap with preview cannot be used when site authentication is enabled in one of the slots","Swap with preview requires the source and target to be in different App Service plans","Swap with preview is only available on Windows plans, and the app runs on Linux"],"answer":[1],"explanation":"Swap with preview is not available when site authentication is enabled in one of the slots. Swap requires slots in the same plan, not different plans. Swap with preview is not restricted to Windows. Warm-up ping status configuration does not block preview; enabled authentication does.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-183","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Litware configures App Service Health check with a status path. The team wants unhealthy instances automatically removed and replaced. On which plan does automatic replacement actually occur, and what is the aggregation behavior?","choices":["Free or Shared tier; a single failed ping immediately replaces the instance","Only Isolated tier; the threshold aggregation is disabled so failures show instantly","Any tier; replacement occurs on the first failed ping regardless of scale-out","Basic tier or higher with scale-out to two or more instances; the metric deems an instance unhealthy only after consecutive failed pings reach the configured threshold"],"answer":[3],"explanation":"Health check needs Basic or higher with two or more instances to replace unhealthy instances; an instance is deemed unhealthy only after consecutive failed pings reach the threshold, which defaults to 10 minutes. Free and Shared plans cannot scale out, so unhealthy instances are not automatically replaced there. Replacement is not first-ping and not on any tier. Isolated is not the only qualifying tier, and threshold aggregation is not disabled.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-184","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fabrikam configures Azure Monitor autoscale on an App Service plan with two scale-out rules on CPU and HTTP queue length, plus two matching scale-in rules. During a spike, only one metric crosses its threshold. What does autoscale do?","choices":["Scales in, because unmet rules default to scale-in","Scales out only after both metrics cross their thresholds in the same evaluation","Scales out, because autoscale scales out if any rule is met","Does nothing, because scale-out requires all rules to be met"],"answer":[2],"explanation":"Autoscale scales out if any of the rules are met (OR logic) and scales in only if all rules are met (AND logic). Scale-out uses OR logic, so one rule is sufficient; it does not require all rules. Unmet rules do not trigger scale-in. Both metrics crossing is not required for scale-out.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-185","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Adventure Works sets up an autoscale scale-out rule to add an instance when sessions per instance exceed 70, sourced from an Application Insights metric. The rule fires far too early because it uses the total session count across all instances. Which setting fixes the per-instance calculation?","choices":["Set the default instance count higher so the average is diluted","Lower the scale-out threshold to 70 divided by the maximum instance count","Change the metric source from Application Insights to the App Service plan","Enable the metric divide by instance count option so the threshold is evaluated per instance"],"answer":[3],"explanation":"Enabling metric divide by instance count evaluates the metric per instance, so sessions per instance is measured against the threshold. Manually dividing the threshold is fragile and does not track instance count changes. Changing the metric source does not by itself compute per-instance values. The default instance count is a safety fallback, not a per-instance divisor.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-186","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Northwind uses non-Entra tokens and scope maps for repository access and separately wants a service principal to have write access to only two repositories. Which statement about combining these approaches is correct?","choices":["Repository-scoped permissions from tokens cannot be assigned to a Microsoft Entra identity; use ABAC conditions on Container Registry Repository Writer for the service principal","A service principal must use the admin account password to inherit scope map permissions","Tokens and ABAC conditions are mutually exclusive and cannot both exist on one registry","Scope maps can be attached directly to the service principal to grant the two-repository write access"],"answer":[0],"explanation":"Tokens and scope maps cannot be assigned to Microsoft Entra identities; to scope a service principal to specific repositories, use ABAC conditions on an ABAC-enabled role such as Repository Writer. Scope maps bind to tokens, not directly to Entra service principals. Tokens and ABAC can coexist on a registry. The admin account is a shared registry-wide credential, not a scope map inheritance path.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions"},{"id":"1.1.1-187","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Proseware runs an ACR multi-step task defined in YAML that must build an image, run it in a temporary container to execute integration tests, and push it only if the tests succeed. Which task step type runs the arbitrary container command for the test phase?","choices":["build","cmd","exec","push"],"answer":[1],"explanation":"ACR Tasks YAML defines three step types: build, push, and cmd; the cmd step runs an arbitrary container command, which is used to run and test a container. build builds an image and push pushes it; neither runs an arbitrary test command. exec is not a valid ACR Tasks step type.","ref":"https://learn.microsoft.com/azure/aks/compare-container-options-with-aks"},{"id":"1.1.1-188","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Wide World Importers geo-replicates a Premium registry across four regions and is surprised by the storage bill. A 2 GiB image is pushed once. How is storage billed, and how do API rate limits behave across the geo-replicas?","choices":["Storage is billed per geo-replica, so 2 GiB replicated to four replicas is charged as 8 GiB; API rate limits are per-replica","Storage is billed per geo-replica but API rate limits are shared across all replicas","Storage is billed once and API rate limits are per-replica","Storage is billed once because replicas share the tier storage limit; API rate limits are per-registry"],"answer":[0],"explanation":"Storage is billed per geo-replica (2 GiB times four replicas equals 8 GiB), and API throttling limits are geo-replica-specific. Although the tier storage limit is shared for quota purposes, billing is per replica. API rate limits are per-replica, not per-registry, which is why spreading traffic across regional endpoints helps.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-geo-replication"},{"id":"1.1.1-189","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Relecloud must import a public image into a registry, then block its use until CVE scanning, SBOM evaluation, and image signing complete. The workload team has different risk tolerances across projects and wants to decide promotion themselves. Which Quarantine pattern variant fits best?","choices":["Keep the image in the quarantine registry, publish validation results via an API, and let each workload team pull only if results meet its risk tolerance","Skip the quarantine registry and scan the image directly in the trusted registry after promotion","Have the orchestrator always auto-promote passing images to the trusted registry and delete the quarantine copy","Grant every workload team AcrQuarantineWriter so each can push directly to production"],"answer":[0],"explanation":"The pull variant keeps the image in quarantine, exposes validation results through an API, and lets each team decide based on its own risk tolerance, which suits multiple teams with differing tolerances. Auto-promotion removes the per-team decision the scenario requires. Scanning after promotion defeats the purpose of quarantine isolation. AcrQuarantineWriter governs quarantine status, not direct production push, and does not implement per-team promotion.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-190","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Contoso pins its West Europe AKS cluster to myregistry.westeurope.geo.azurecr.io in the deployment manifest and enables dedicated data endpoints. When pods pull image layers, to which host does the 307 redirect point?","choices":["myregistry.azurecr.io, because layer downloads always route through the global endpoint","myregistry.westeurope.data.azurecr.io, because the layer redirect always stays within the same region as the regional endpoint","myregistry.eastus.data.azurecr.io, because layer downloads always route to the home region data endpoint","A blob.core.windows.net storage account in the home region, regardless of dedicated data endpoints"],"answer":[1],"explanation":"With dedicated data endpoints enabled, a pull from a regional geo endpoint redirects layer blob downloads to the same-region dedicated data endpoint, never cross-region. Layer downloads from a regional endpoint do not route through the global endpoint. With dedicated data endpoints enabled, layers redirect to the data endpoint, not a raw storage account URL. The redirect is same-region, never to the home region's data endpoint by default.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-191","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove creates a Docker Hub artifact cache rule in a Premium registry. Complete the command so the rule references an existing Key Vault-backed credential set for the authenticated Docker Hub upstream.\n\n```\naz acr cache create -r WoodgroveReg -n UbuntuRule \\\n  -s docker.io/library/ubuntu -t ubuntu ________ DockerHubCredSet\n```","choices":["-c","--identity","--sync-token","--scope-map"],"answer":[0],"explanation":"The -c parameter attaches an existing credential set to a cache rule, which Docker Hub requires because it supports authenticated pulls only. --identity is used for ACR-to-ACR caching with a managed identity, not a Key Vault credential set. --scope-map applies to non-Entra tokens. --sync-token is a connected registry parameter, not an artifact cache one.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-192","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Fabrikam migrates a registry to support Microsoft Entra ABAC conditions on role assignments while keeping standard RBAC assignments. Complete the command that sets the role assignment mode.\n\n```\naz acr update --name FabrikamReg \\\n  --role-assignment-mode ________\n```","choices":["rbac-abac","abac-only","rbac-registry","entra-conditions"],"answer":[0],"explanation":"Specifying rbac-abac retains standard Entra RBAC assignments while optionally applying ABAC conditions for repository-level access control. abac-only, rbac-registry, and entra-conditions are not valid values for --role-assignment-mode; rbac-abac is the mode that enables ABAC repository permissions.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions"},{"id":"1.1.1-193","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Alpine Ski House configures an App Service custom container so App Service forwards HTTP requests to the container's listening port of 8000. Complete the app setting name.\n\n```\naz webapp config appsettings set --resource-group rg-alpine \\\n  --name alpine-app --settings ________=8000\n```","choices":["WEBSITES_CONTAINER_PORT","WEBSITE_PORT","HTTP_PLATFORM_PORT","WEBSITES_PORT"],"answer":[3],"explanation":"WEBSITES_PORT tells App Service which container port to forward HTTP requests to when it is not the default port 80. WEBSITE_PORT, WEBSITES_CONTAINER_PORT, and HTTP_PLATFORM_PORT are not the recognized app setting; WEBSITES_PORT is the correct name.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-194","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Trey Research configures an App Service web app to pull its container image from Azure Container Registry using its managed identity. Complete the generic configuration property that turns on managed-identity credentials for the ACR pull.\n\n```\naz webapp config set --resource-group rg-trey --name trey-app \\\n  --generic-configurations '{\"________\": true}'\n```","choices":["useAcrManagedIdentity","acrManagedIdentityEnabled","acrUseManagedIdentityCreds","acrIdentityPullEnabled"],"answer":[2],"explanation":"Setting acrUseManagedIdentityCreds to true configures the app to pull from Azure Container Registry using its managed identity. useAcrManagedIdentity, acrManagedIdentityEnabled, and acrIdentityPullEnabled are not the property name; acrUseManagedIdentityCreds is correct.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-195","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Relecloud creates a connected registry resource whose clients should only be able to pull artifacts, which is also the secure-by-default mode. Complete the mode value.\n\n```\naz acr connected-registry create --registry RelecloudReg \\\n  --name edge-ro --parent edge-rw --repository \"hello-world\" \\\n  --mode ________\n```","choices":["Pull","ReadWrite","Mirror","ReadOnly"],"answer":[3],"explanation":"ReadOnly is the default connected registry mode and allows clients to pull (read) artifacts only. ReadWrite allows push and pull. Mirror and Registry are other valid modes but do not restrict clients to pull-only in the secure-by-default sense; Pull is not a valid mode value.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-intro"},{"id":"1.1.1-196","obj":"1.1.1","difficulty":"easy","type":"multi","stem":"Contoso converts a registry from RBAC-only mode to RBAC Registry + ABAC Repository Permissions and must preserve access for an identity that currently holds AcrPull. Which two role assignments together provide equivalent registry-wide read and catalog-list access after the switch? (Select two.)","choices":["Container Registry Repository Catalog Lister","The legacy AcrPull role reassigned in the ABAC-enabled registry","Container Registry Repository Reader assigned without ABAC conditions","Container Registry Repository Contributor scoped to all repositories","Container Registry Contributor and Data Access Configuration Administrator"],"answer":[0,2],"explanation":"The AcrPull equivalent in an ABAC-enabled registry is Container Registry Repository Reader (assigned without conditions for registry-wide read) plus Container Registry Repository Catalog Lister for catalog listing. Repository Contributor grants delete permissions beyond AcrPull's read scope. Legacy AcrPull is not honored in ABAC-enabled registries. The Contributor and Data Access Configuration Administrator role is a control plane role granting az acr login and configuration, not data plane pull.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-rbac-abac-repository-permissions"},{"id":"1.1.1-197","obj":"1.1.1","difficulty":"medium","type":"multi","stem":"Best For You Organics performs a slot swap between a staging slot and the production slot in App Service. Which two configuration elements are swapped (follow the content) rather than staying with the slot? (Select two.)","choices":["Scale settings","Custom domain names","Managed identities","App settings not marked as deployment slot settings","Language framework settings such as .NET version"],"answer":[3,4],"explanation":"Language framework settings swap with the content, and app settings swap unless they are marked as sticky deployment slot settings. Custom domain names, managed identities, and scale settings are slot-specific and are not swapped.","ref":"https://learn.microsoft.com/azure/app-service/overview"},{"id":"1.1.1-198","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Munson's Pickles hardens a Premium registry. Which two statements about ACR geo-replication during a home region outage are correct? (Select two.)","choices":["ACR Tasks continue to run because they fail over to a healthy region","Image push, pull, and delete continue to work through the remaining geo-replicas","Registry configuration changes such as network rules can still be modified","Regional endpoints for the failed home region remain available","Authentication with managed identities, service principals, and repository-scoped tokens continues to function"],"answer":[1,4],"explanation":"During a home region outage only the control plane is affected; data plane operations (push, pull, delete) continue through remaining geo-replicas, and all authentication methods keep working. Registry configuration changes require the home region control plane and are unavailable during the outage. ACR Tasks are bound to the home region and do not run. The home region's own regional endpoint is unavailable while that region is down.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-geo-replication"},{"id":"1.1.1-199","obj":"1.1.1","difficulty":"easy","type":"multi","stem":"Fourth Coffee designs an ACR Tasks multi-step YAML workflow. Which two are valid top-level constructs of an acr-task.yaml file? (Select two.)","choices":["Task properties such as version, stepTimeout, and workingDirectory","A slots array defining staging and production task targets","A triggers block listing base-image, commit, and schedule as YAML step types","A sitecontainers block declaring the main and sidecar images","Task step types build, push, and cmd"],"answer":[0,4],"explanation":"An acr-task.yaml file is composed of task properties (like version, stepTimeout, workingDirectory), step types (build, push, cmd), and step properties. Triggers such as base-image, commit, and schedule are configured on the task, not as YAML step types. slots and sitecontainers are App Service constructs, not ACR Tasks YAML constructs.","ref":"https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview"},{"id":"1.1.1-200","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Fabrikam converts a KEDA ScaledObject that triggers on Azure Service Bus queue depth into an Azure Container Apps custom scale rule. The app must scale to zero when idle and authenticate to Service Bus without storing any secret. Which single value from the KEDA scaler specification must be supplied as the Container Apps --scale-rule-type parameter?","choices":["The scaler trigger's type value, such as azure-servicebus","The metadata queueName value","The TriggerAuthentication authenticationRef name","The messageCount threshold value"],"answer":[0],"explanation":"When you map a KEDA ScaledObject to a Container Apps custom rule, the trigger's type value (for example azure-servicebus) becomes the --scale-rule-type, and the metadata becomes --scale-rule-metadata. queueName and messageCount belong under --scale-rule-metadata, not the rule type. authenticationRef points to a TriggerAuthentication object that maps to scale-rule auth entries or managed identity, not to the rule type.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-201","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Woodgrove deploys a Container App with ingress disabled because it only runs a background worker. The team defines neither a minReplicas value nor a custom scale rule. After deployment the worker never starts processing. What is the root cause?","choices":["Ingress must be enabled for any Container App to run","Background workers are not supported on Container Apps","With no ingress, no minReplicas, and no scale rule, the app scales to zero and has no trigger to start","The default HTTP scale rule requires TCP ingress to function"],"answer":[2],"explanation":"If ingress is disabled and you define neither minReplicas of one or more nor a custom scale rule, the app scales to zero with no way to start back up. Ingress is optional for background workers. Container Apps fully supports non-HTTP workers. The default HTTP rule is irrelevant here because ingress is disabled, which is exactly why a custom rule or a minimum replica count is needed.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-202","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Relecloud enables Dapr on two container apps: an order publisher and an inventory subscriber. Both must exchange messages over the same Dapr pub/sub topic and be discoverable by a stable identity. Which Dapr setting simultaneously serves service discovery, state encapsulation, and the pub/sub consumer ID for each app?","choices":["--dapr-app-id","--dapr-app-port","--dapr-app-protocol","--dapr-max-request-size"],"answer":[0],"explanation":"The Dapr app ID is a unique identifier used for service discovery, state encapsulation, and as the pub/sub consumer ID. app-port tells Dapr which port your app listens on. app-protocol selects http or grpc. max-request-size sets the maximum request body size. None of these serve as the app identity or consumer ID.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-203","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Litware configures a Dapr state store component in a Container Apps environment so a Node.js app can persist orders in Azure Blob Storage using managed identity. The component YAML must declare the correct component type. Which componentType value is required for an Azure Blob Storage state store?","choices":["pubsub.azure.servicebus.topics","state.azure.blobstorage","bindings.azure.blobstorage","secretstores.azure.keyvault"],"answer":[1],"explanation":"An Azure Blob Storage state store uses the component type state.azure.blobstorage. pubsub.azure.servicebus.topics is a publish and subscribe broker. bindings.azure.blobstorage is an output binding, not a state store. secretstores.azure.keyvault is a secret store. Only the state.* prefix defines a state management component.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-204","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Proseware changes the Dapr sidecar app protocol on a container app that runs in multiple-revision mode, expecting a new revision to be created for rollback. Instead, no new revision appears and every existing revision restarts. Why does this happen?","choices":["Multiple-revision mode disables all revision creation","Dapr is not supported in multiple-revision mode","Dapr configurations are application-scope changes, so they restart existing revisions rather than create a new one","The change failed silently and was never applied"],"answer":[2],"explanation":"Dapr configurations in Container Apps are application-scope changes. In multiple-revision mode they do not create a new revision; instead all existing revisions restart with the updated values. Multiple-revision mode still creates revisions for template changes. Dapr is supported in multiple-revision mode. The restart behavior confirms the change was applied, not that it failed silently.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-205","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Coho Vineyard has two container apps in one environment. App A must call App B, the call must stay inside the environment and never traverse the public internet, and traffic between them must be TLS encrypted without App B exposing a public endpoint. Which combination meets all three requirements?","choices":["Set App B ingress external to true and require a client certificate","Disable ingress on App B and enable session affinity","Set App B ingress to TCP transport with allowInsecure true","Set App B ingress external to false and enable environment peer-to-peer encryption"],"answer":[3],"explanation":"Internal ingress (external set to false) keeps App B reachable only within the environment, and environment peer-to-peer encryption TLS-encrypts traffic between apps using a managed private certificate. External true exposes App B publicly. Disabling ingress removes the endpoint App A needs to call. allowInsecure true permits unencrypted traffic, defeating the encryption requirement.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-206","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Alpine Ski House runs a stateful Container App whose users must keep hitting the same replica across requests. The app uses HTTP ingress. After enabling sticky sessions, requests still spread across replicas. Which requirement was most likely violated?","choices":["Session affinity requires TCP ingress rather than HTTP","Session affinity requires peer-to-peer encryption enabled","Session affinity requires a minimum of three replicas","Session affinity requires the app to run in single revision mode"],"answer":[3],"explanation":"Session affinity is only supported when the app is in single revision mode with HTTP ingress; stickiness is enforced with an HTTP cookie. Session affinity requires HTTP, not TCP, ingress. It does not depend on peer-to-peer encryption or on any minimum replica count. Running in multiple-revision mode would break the affinity guarantee.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-207","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Munson's Pickles needs a sidecar container to process log files that the main app container writes. The two containers run in the same replica and must share a temporary volume that survives a single container restart but need not persist beyond the replica. Which Container Apps storage type fits?","choices":["Container-scoped ephemeral storage","An Azure Files permanent volume","Replica-scoped EmptyDir ephemeral storage","An Azure NetApp Files volume"],"answer":[2],"explanation":"Replica-scoped storage is an EmptyDir volume shared by all containers in the same replica; files persist for the lifetime of the replica, including across a single container restart. Container-scoped storage is visible only to one container and disappears on that container's restart. Azure Files is permanent shared storage, more than required and not scoped to the replica. Azure NetApp Files is not supported for Container Apps mounts.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-208","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Southridge Video wants a Container App to write output files to a share that other external systems can read, and the data must survive replica restarts. The team plans to mount Azure Blob Storage or Azure NetApp Files directly. Which statement is correct about the supported choice?","choices":["Azure Blob Storage can be mounted directly as a Container Apps volume","Azure NetApp Files can be mounted directly as a Container Apps volume","Azure Files is the supported permanent volume; Blob Storage and NetApp Files mounts are not supported","Only replica-scoped EmptyDir volumes persist data across replicas"],"answer":[2],"explanation":"Azure Container Apps supports Azure Files for permanent storage. Mounting file shares from Azure NetApp Files or Azure Blob Storage is not supported. Neither Blob Storage nor NetApp Files can be mounted as a Container Apps volume. EmptyDir is replica-scoped ephemeral storage that does not persist beyond the replica, so it cannot make data durable for external systems.","ref":"https://learn.microsoft.com/azure/container-apps/overview"},{"id":"1.1.1-209","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Nod Publishers wants a production revision and a staging revision of the same container app, each reachable at its own stable URL, with no risk that a new deployment silently reroutes production traffic. Which Container Apps feature provides a persistent per-revision URL that you can move deliberately between revisions?","choices":["Session affinity cookies","Ephemeral storage mounts","Revision labels","Dapr service invocation"],"answer":[2],"explanation":"Revision labels provide a unique, stable URL for a revision. A label can be moved between revisions to reroute its traffic deliberately, and each revision can hold at most one label. Session affinity pins a client to a replica, not a revision URL. Ephemeral storage is unrelated to routing. Dapr service invocation handles internal service-to-service calls, not external labeled endpoints.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-210","obj":"1.1.1","difficulty":"hard","type":"single","stem":"VanArsdel runs a container app in multiple-revision mode and wants to send 80 percent of traffic to a known-good revision and 20 percent to a new revision for canary testing. Which condition must the traffic-splitting configuration satisfy?","choices":["Each revision must run in its own environment","Session affinity must be enabled first","The app must use TCP ingress","The combined weight of all traffic rules must equal 100"],"answer":[3],"explanation":"Traffic splitting is weight based, and the combined weight of all traffic split rules must equal 100 percent. Revisions can be targeted by name or by label. Revisions in a split share one environment and one app. Session affinity is not a prerequisite and only applies in single revision mode. Traffic splitting works with HTTP ingress, not a TCP-only requirement.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-211","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Trey Research needs a Container Apps job that runs one execution for each message arriving in an Azure Service Bus queue and then stops, with several messages processed in parallel. Which job trigger type and scaling concept apply?","choices":["Event trigger type using a KEDA-based scaling rule","Manual trigger type with an HTTP scale rule","Schedule trigger type with a cron expression","Manual trigger type with session affinity"],"answer":[0],"explanation":"Event-driven jobs use the Event trigger type and are started by supported KEDA custom scalers such as a Service Bus queue scaler; each execution typically processes one event. Manual jobs start on demand only. Scheduled jobs run on a cron timetable, not per message. HTTP scale rules and session affinity apply to apps, not to event-driven job execution counts.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-212","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Blue Yonder defines an event-driven Container Apps job. Each triggered batch must run up to four executions concurrently, and the job is considered complete only after three of those executions succeed. Which two eventTriggerConfig properties express these constraints, and what is their required relationship?","choices":["replicaTimeout 4 and replicaRetryLimit 3, where retry must exceed timeout","parallelism 4 and replicaCompletionCount 3, where replicaCompletionCount must be equal to or less than parallelism","minReplicas 4 and maxReplicas 3, where max must exceed min","parallelism 3 and replicaCompletionCount 4, where completion must exceed parallelism"],"answer":[1],"explanation":"parallelism sets how many replicas run at once, and replicaCompletionCount sets the minimum successful completions before the job finishes; replicaCompletionCount must be equal to or less than parallelism. replicaTimeout and replicaRetryLimit govern per-replica runtime and retries, not concurrency and completion counts. minReplicas and maxReplicas are app scaling terms, not job completion terms. Completion count cannot exceed parallelism.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-213","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Consolidated Messenger needs a Container Apps job that generates a financial report every night at midnight without any external event source. Which job trigger type and configuration are correct?","choices":["Schedule trigger type with a cron expression such as 0 0 * * *","Event trigger type with a queue scale rule","Manual trigger type invoked by Azure Resource Manager","Schedule trigger type with a KEDA ScaledObject"],"answer":[0],"explanation":"A recurring time-based job uses the Schedule trigger type configured with a cron expression, for example 0 0 * * * for midnight. Event jobs require an event source such as a queue. Manual jobs require an explicit on-demand start each time. Scheduled jobs use a cron expression, not a KEDA ScaledObject, which applies to event-driven scaling.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-214","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee configures health probes for a Container App. The team wants an exec command probe and a gRPC liveness check like they used on raw Kubernetes. Which statement about Container Apps probe support is correct?","choices":["Container Apps supports exec and gRPC probes identically to Kubernetes","Container Apps supports only TCP or HTTP(S) probes; exec and gRPC are not supported","Container Apps supports gRPC probes but not HTTP probes","Container Apps supports named ports for probes but not integer ports"],"answer":[1],"explanation":"Container Apps health probes support only TCP or HTTP(S). exec probes and gRPC are not supported, and named ports are not supported (ports must be integers). exec and gRPC probes are explicitly unsupported. HTTP probes are supported. Ports must be integers, so named ports are not supported, making the remaining options incorrect.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-215","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Graphic Design Institute has a Java Container App that takes a long time to initialize. During rollout the platform keeps marking the revision unhealthy and restarting the container before the app finishes starting. Which probe adjustment most directly resolves premature restarts for a slow-starting app?","choices":["Lower the liveness probe periodSeconds to 1","Increase the startup and liveness probe initial delay so the app has time to start","Disable the readiness probe entirely","Set the readiness probe failureThreshold to 1"],"answer":[1],"explanation":"For apps with extended startup time, increasing the initial delay (and startup or liveness thresholds) gives the app enough time to start before probes can trigger a restart. Lowering periodSeconds probes more aggressively and worsens premature restarts. Disabling the readiness probe risks routing traffic to a not-ready replica. Setting readiness failureThreshold to 1 makes the check less tolerant, increasing false unhealthy states.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-216","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Adventure Works dedicates an AKS node pool to GPU workloads and must ensure that pods already running on those nodes without a matching toleration are evicted immediately when the taint is applied. Which taint effect achieves immediate eviction of non-tolerating pods?","choices":["NoSchedule","PreferNoSchedule","PreferNoExecute","NoExecute"],"answer":[3],"explanation":"NoExecute immediately evicts pods already running on the node if they do not have a matching toleration; a matching toleration can keep them, optionally bounded by tolerationSeconds. NoSchedule blocks new non-tolerating pods but does not evict existing ones. PreferNoSchedule is a soft preference only. PreferNoExecute is not a valid taint effect.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-217","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Wingtip Toys adds an Azure Spot node pool to an AKS cluster to run interruptible batch jobs cheaply. The team wants only batch pods to land on Spot nodes and needs those pods to schedule there successfully. Which pod-side configuration is required?","choices":["Only a nodeSelector for the region label","A toleration for kubernetes.azure.com/scalesetpriority=spot:NoSchedule plus node affinity for the spot label","A privileged securityContext","A PodDisruptionBudget with maxUnavailable zero"],"answer":[1],"explanation":"A Spot node pool carries the taint kubernetes.azure.com/scalesetpriority=spot:NoSchedule and the label kubernetes.azure.com/scalesetpriority=spot, so pods need a matching toleration and node affinity to be scheduled there. A region nodeSelector does not tolerate the spot taint. A privileged securityContext is unrelated to scheduling. A PodDisruptionBudget governs voluntary disruptions, not initial scheduling onto tainted spot nodes.","ref":"https://learn.microsoft.com/azure/aks/spot-node-pool"},{"id":"1.1.1-218","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Lamna Healthcare tries to make a Spot node pool the cluster's default (system) node pool and later change its SpotMaxPrice. Both operations fail. Which pair of Spot node pool constraints explains the failures?","choices":["A Spot pool can be default, but SpotMaxPrice is immutable","A Spot pool cannot use Virtual Machine Scale Sets, and SpotMaxPrice must be zero","A Spot pool cannot be the default node pool, and ScaleSetPriority and SpotMaxPrice cannot be changed after creation","A Spot pool must be default, and SpotMaxPrice can only decrease"],"answer":[2],"explanation":"A Spot node pool can only be a secondary pool, not the default. You cannot change ScaleSetPriority or SpotMaxPrice after creation. A Spot pool cannot be the default pool. Spot pools must use Virtual Machine Scale Sets, not avoid them. SpotMaxPrice must be minus one or a positive value with up to five decimals, and it is immutable, so it cannot simply decrease.","ref":"https://learn.microsoft.com/azure/aks/spot-node-pool"},{"id":"1.1.1-219","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Margie's Travel must scale an AKS workload on the number of messages in an Azure Service Bus queue, not on CPU or memory. A teammate proposes attaching both a Horizontal Pod Autoscaler and a KEDA ScaledObject to the same Deployment. Which statement is correct?","choices":["HPA scales on event counts, so KEDA is redundant","KEDA is event-driven and uses HPA internally; combining a separate HPA with a ScaledObject on the same workload causes conflicting scaling","KEDA cannot scale on Azure Service Bus queues","HPA and KEDA must both be attached for queue scaling to work"],"answer":[1],"explanation":"HPA is metrics-driven (CPU and memory), while KEDA is event-driven and creates an HPA in the background. Combining a manual HPA with a KEDA ScaledObject on the same workload makes them compete, causing odd scaling. HPA scales on resource metrics, not event counts. KEDA supports the Azure Service Bus scaler. Only the KEDA ScaledObject is needed for queue scaling; adding a separate HPA is the source of the conflict.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-220","obj":"1.1.1","difficulty":"easy","type":"single","stem":"School of Fine Art enables the AKS KEDA add-on and then tries to install a second external metrics adapter for a custom scaler. The custom adapter fails to function. Which KEDA add-on limitation explains this?","choices":["KEDA requires the cluster autoscaler to be disabled","KEDA cannot coexist with any Deployment","KEDA disables the Horizontal Pod Autoscaler API","Only one external metrics server is allowed in the cluster, so the KEDA add-on must be the only external metrics adapter"],"answer":[3],"explanation":"Due to an upstream limitation, only one external metric server can run in a Kubernetes cluster, so the KEDA add-on must be the only installed external metrics adapter. KEDA works alongside the cluster autoscaler. KEDA scales Deployments rather than blocking them. KEDA relies on the HPA API internally rather than disabling it.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-221","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove updates an AKS Deployment and wants the rollout to bring up extra pods above the desired count so new pods become ready before old ones are terminated, minimizing downtime. Which Deployment rolling-update field controls the extra pods created during the update?","choices":["maxUnavailable","minReadySeconds","maxSurge","progressDeadlineSeconds"],"answer":[2],"explanation":"maxSurge specifies the maximum number of pods that can be created beyond the desired count during a rolling update, letting new pods become ready before old ones are removed. maxUnavailable limits how many pods can be unavailable, not how many extra are created. minReadySeconds delays marking a pod available. progressDeadlineSeconds bounds how long a rollout may stall before it is considered failed.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-222","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Contoso upgrades an AKS node pool in a region with tight quota, so surging extra nodes is not possible. The team must upgrade using existing capacity even though it accepts brief workload disruption. Which node-pool upgrade setting performs an in-place upgrade by cordoning and draining existing nodes without adding surge nodes?","choices":["--max-unavailable","--max-surge","--node-osdisk-size","--node-count"],"answer":[0],"explanation":"max unavailable does not create surge nodes; AKS cordons and drains the specified number of existing nodes at a time, enabling an in-place upgrade when surge capacity is unavailable. max surge requires additional node capacity, which is exactly what is unavailable. node-osdisk-size sets disk size, and node-count changes pool size; neither controls upgrade unavailability behavior.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-223","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Litware sees an AKS container repeatedly terminated and restarted while the rest of its pod keeps running. kubectl describe pod shows reason OOMKilled and exit code 137. Which interpretation is correct?","choices":["The whole pod was evicted by the kubelet for node memory pressure","A single container exceeded its memory limit and was terminated by the Linux OOM killer, then restarted","The node ran out of disk and the pod was rescheduled","The readiness probe failed and cordoned the node"],"answer":[1],"explanation":"OOMKilled with exit code 137 is a container-level event: the container exceeded its memory limit and was terminated by the kernel OOM killer, then typically restarted, while other containers in the pod can keep running. Eviction is a pod-level event that reports status Failed and reason Evicted, not OOMKilled. The symptom is memory, not disk, and no rescheduling to a new node occurred. A readiness probe failure does not cordon a node or produce OOMKilled.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-224","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Relecloud runs az aks check-acr for a pod stuck in ImagePullBackOff and receives exec /canipull: exec format error, while az acr check-health passes. The image and node pool are on different CPU architectures. What is the most likely cause?","choices":["The AcrPull role assignment is missing","The registry sign-in server is misspelled as azureacr.io","The kubelet exceeded the image pull QPS limit","The container image architecture does not match the node architecture, for example ARM64 image on an AMD64 node"],"answer":[3],"explanation":"An exec format error during check-acr, combined with a healthy registry, points to an image and node architecture mismatch, such as deploying an ARM64 image onto AMD64 nodes; the fix is matching or multi-architecture images. A missing AcrPull assignment produces an authorization failure, not an exec format error. A misspelled sign-in server yields a not found or 401 error. Exceeding pull QPS produces a pull QPS exceeded message, not an architecture mismatch.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-225","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Trey Research finds an AKS pod cycling through CrashLoopBackOff with a nonzero exit code shortly after each start. Which set of causes is consistent with CrashLoopBackOff rather than with a registry pull failure?","choices":["Wrong registry sign-in server and expired pull token","Node memory pressure eviction only","Application crash on startup, missing ConfigMap or Secret, or a misconfigured liveness probe","A missing AcrPull role assignment"],"answer":[2],"explanation":"CrashLoopBackOff means the container starts then exits or is killed repeatedly, commonly from application startup failures, missing or misconfigured ConfigMaps or Secrets, failing init containers, or misconfigured liveness or readiness probes. A wrong sign-in server, expired pull token, or missing AcrPull role produce image pull errors (ImagePullBackOff or ErrImagePull), not CrashLoopBackOff. Node memory pressure alone triggers pod eviction, a distinct condition.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-226","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Complete the Azure CLI command that creates an event-driven Container Apps job triggered by messages in a queue. Fill in the value for the trigger type.\n\n```\naz containerapp job create \\\n  --name orders-job \\\n  --resource-group rg-jobs \\\n  --environment my-env \\\n  --trigger-type ________ \\\n  --scale-rule-name queue-rule \\\n  --scale-rule-type azure-servicebus\n```","choices":["Event","Schedule","Manual","Cron"],"answer":[0],"explanation":"An event-driven job that starts executions from a queue scaler uses the Event trigger type. Schedule runs on a cron timetable, not per message. Manual runs only on demand. Cron is not a valid Container Apps job trigger type; the valid values are Event, Manual, and Schedule.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-227","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Complete the Azure CLI command that adds an interruptible Azure Spot node pool to an AKS cluster. Fill in the parameter value that designates the pool as Spot.\n\n```\naz aks nodepool add \\\n  --resource-group myResourceGroup \\\n  --cluster-name myAKSCluster \\\n  --name spotpool \\\n  --priority ________ \\\n  --eviction-policy Delete \\\n  --spot-max-price -1 \\\n  --enable-cluster-autoscaler --min-count 1 --max-count 5\n```","choices":["Spot","Regular","LowPriority","Preemptible"],"answer":[0],"explanation":"The --priority value Spot creates a Spot node pool, which applies the scalesetpriority spot label and taint. Regular creates a standard (non-Spot) pool. LowPriority and Preemptible are not valid --priority values for AKS node pools; the accepted values are Regular and Spot.","ref":"https://learn.microsoft.com/azure/aks/spot-node-pool"},{"id":"1.1.1-228","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Complete the Azure CLI command that shifts Container Apps production traffic between a blue and a green revision by their revision labels during a blue-green cutover. Fill in the parameter that targets revisions by label.\n\n```\naz containerapp ingress traffic set \\\n  --name store-app \\\n  --resource-group rg-store \\\n  --________ blue=0 green=100\n```","choices":["label-weight","revision-weight","traffic-weight","set-weight"],"answer":[0],"explanation":"--label-weight sets traffic weights by revision label, which is what a blue-green cutover addressed by label requires; the combined weight must equal 100. --revision-weight targets revisions by name, not label. --traffic-weight is deprecated. --set-weight is not a valid parameter for this command.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-229","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Complete the kubectl command that inspects a pod to read its Events, container statuses, exit code, and the OOMKilled reason while diagnosing a memory-terminated container. Fill in the verb.\n\n```\nkubectl ________ pod payment-api-7f9c -n payments\n```","choices":["get","logs","top","describe"],"answer":[3],"explanation":"kubectl describe pod shows the Events and container statuses, including exit code 137 and the reason OOMKilled needed to confirm a container-level memory kill. kubectl get pod shows only status and restart counts, not the detailed reason. kubectl logs shows application output, not the termination reason. kubectl top shows live resource usage, not the OOMKilled event.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-230","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Complete the Azure CLI command that registers a Dapr state store component in a Container Apps environment from a YAML file so scoped apps can use it. Fill in the subcommand group.\n\n```\naz containerapp env ________ set \\\n  --name my-env \\\n  --resource-group rg-dapr \\\n  --dapr-component-name statestore \\\n  --yaml statestore.yaml\n```","choices":["dapr","dapr-component","component","dapr-components"],"answer":[1],"explanation":"az containerapp env dapr-component set configures a Dapr component in the Container Apps environment from a YAML definition. dapr, component, and dapr-components are not the correct subcommand group; the environment-level Dapr component command group is dapr-component.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-231","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Adventure Works must run a batch Deployment only on a dedicated AKS node pool tainted with workload=batch:NoSchedule, while keeping every other workload off those nodes. Which two pod specification elements together guarantee the batch pods land on the tainted nodes and non-batch pods stay off? (Select two.)","choices":["A toleration matching workload=batch with effect NoSchedule","Node affinity (or a nodeSelector) that requires the batch node pool label","A PodDisruptionBudget with minAvailable set to 100 percent","A privileged securityContext on the batch containers","An imagePullPolicy of Always on the batch containers"],"answer":[0,1],"explanation":"The toleration lets the batch pods be scheduled onto the tainted nodes, and node affinity or a nodeSelector for the pool label forces those pods specifically onto that pool; the taint alone keeps non-tolerating pods off. A PodDisruptionBudget governs voluntary disruptions, not scheduling. A privileged securityContext concerns permissions, not placement. imagePullPolicy controls image caching, not node targeting.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-232","obj":"1.1.1","difficulty":"easy","type":"multi","stem":"Coho Vineyard needs an AKS pod to obtain Azure Key Vault secrets with Microsoft Entra Workload ID and no stored credentials. Which two configuration steps are required to complete the trust chain between the pod and a user-assigned managed identity? (Select two.)","choices":["Enable the Azure Container Registry admin account","Annotate the Kubernetes service account with azure.workload.identity/client-id set to the identity client ID","Assign the Owner role on the subscription to the service account","Create a federated identity credential whose subject is system:serviceaccount:namespace:serviceaccount and whose issuer is the cluster OIDC issuer URL","Add an imagePullSecret referencing the managed identity"],"answer":[1,3],"explanation":"The service account annotation links it to the managed identity client ID, and the federated identity credential establishes trust by mapping the cluster OIDC issuer and the service account subject with audience api://AzureADTokenExchange. The ACR admin account and imagePullSecret concern registry image pulls, not Entra token exchange. Owner on the subscription is excessive and unrelated to the federation trust; the identity needs a scoped data-plane role such as Key Vault access.","ref":"https://learn.microsoft.com/azure/aks/what-is-aks"},{"id":"1.1.1-233","obj":"1.1.1","difficulty":"medium","type":"multi","stem":"Fourth Coffee configures a Container App for zero-downtime canary testing in multiple-revision mode. Requirements: a known-good revision must keep serving most traffic, a new revision must receive a small share, and each revision must also be independently reachable for direct testing. Which two configurations satisfy these requirements? (Select two.)","choices":["Enable session affinity so all users pin to the new revision","Switch the app to single revision mode","Set traffic weights so the known-good and new revisions sum to 100, for example 90 and 10","Set allowInsecure to true to expose both revisions over HTTP","Assign a revision label to give each revision its own stable direct URL"],"answer":[2,4],"explanation":"Weight-based traffic splitting that sums to 100 sends most traffic to the good revision and a small share to the canary, and revision labels give each revision a stable URL for direct testing without disturbing the split. Session affinity pins clients to a replica and does not implement a canary split, and it is only supported in single revision mode. Single revision mode would prevent splitting traffic between revisions. allowInsecure weakens transport security and does not enable canary routing.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"1.1.1-234","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Humongous Insurance must reliably pull a private ACR image into AKS using the cluster's kubelet managed identity, and a pod is failing with ImagePullBackOff. Which two actions address authorization and verify pull access for a non-ABAC registry? (Select two.)","choices":["Attach the registry with az aks update --attach-acr to assign the AcrPull role to the kubelet identity","Enable the ACR admin account and store the password in the Deployment","Assign the Contributor role on the registry to the kubelet identity","Run az aks check-acr to validate that the registry is reachable and the identity can pull","Set imagePullPolicy to Never on the Deployment"],"answer":[0,3],"explanation":"Attaching the registry assigns the AcrPull role (for non-ABAC registries) to the kubelet identity, and az aks check-acr confirms the registry is accessible and the identity is authorized to pull. The admin account contradicts keyless managed-identity pulls. Contributor is a broad control-plane role, not the data-plane pull role. imagePullPolicy Never prevents pulling the image at all, guaranteeing failure.","ref":"https://learn.microsoft.com/azure/aks/concepts-clusters-workloads"},{"id":"1.1.1-235","obj":"1.1.1","difficulty":"easy","type":"multi","stem":"Proseware secures two Dapr-enabled container apps in one environment and secures an external client that calls one of the apps. Which two statements about encryption and authentication in Azure Container Apps are correct? (Select two.)","choices":["Environment peer-to-peer encryption provides authorization-based access control between apps","Dapr service invocation automatically secures sidecar-to-sidecar calls with mutual TLS","Setting allowInsecure to true is required for peer-to-peer encryption","mTLS with external clients requires the app to run in single revision mode","For external clients, two-way authentication uses mTLS by setting clientCertificateMode to Require"],"answer":[1,4],"explanation":"Dapr sidecars automatically secure service invocation with mutual TLS, and external client two-way authentication is achieved with mTLS by requiring a client certificate (clientCertificateMode Require). Peer-to-peer encryption authenticates apps but does not provide authorization-based access control between them. allowInsecure true permits unencrypted traffic and is not needed for peer-to-peer encryption. External mTLS does not require single revision mode; that constraint belongs to session affinity.","ref":"https://learn.microsoft.com/azure/container-apps/scale-app"},{"id":"2.1.1-01","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Which Azure database is a globally distributed NoSQL service?","choices":["Azure Cosmos DB","Azure SQL Managed Instance","Azure Files","Azure DNS"],"answer":[0],"explanation":"Cosmos DB is the globally distributed NoSQL database. SQL Managed Instance is relational, Files is file shares, and DNS resolves names.","ref":"https://learn.microsoft.com/azure/architecture/guide/technology-choices/vector-search"},{"id":"2.1.1-02","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Which in-memory service caches data for fast reads?","choices":["Azure Managed Redis","Azure Blob Storage","Azure DNS","Azure Policy"],"answer":[0],"explanation":"Redis is the in-memory cache. Blob Storage is durable object storage, DNS resolves names, and Policy governs resources.","ref":"https://learn.microsoft.com/azure/architecture/guide/technology-choices/vector-search"},{"id":"2.1.1-03","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which managed relational database supports the pgvector extension for embeddings?","choices":["Azure Database for PostgreSQL","Azure Files","Azure DNS","Azure CDN"],"answer":[0],"explanation":"PostgreSQL supports pgvector for vector search. Files stores file shares, DNS resolves names, and the CDN caches content.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-04","obj":"2.1.1","difficulty":"easy","type":"single","stem":"What does a vector search find?","choices":["Items most similar in meaning to a query","Items with an exact matching id","The newest item by timestamp","The largest item by size"],"answer":[0],"explanation":"Vector search ranks items by semantic similarity. Exact id, newest, and largest are lookups that ignore meaning.","ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/vector-search-overview"},{"id":"2.1.1-05","obj":"2.1.1","difficulty":"medium","type":"single","stem":"In Cosmos DB, what does the partition key control?","choices":["How data is distributed across partitions","The encryption algorithm","The backup schedule","The firewall rules"],"answer":[0],"explanation":"The partition key determines how items spread across physical partitions. Encryption, backups, and firewall are configured separately.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-06","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which Cosmos DB consistency level gives the lowest latency and cost?","choices":["Eventual","Strong","Bounded staleness","Session"],"answer":[0],"explanation":"Eventual is the cheapest and fastest, with the weakest guarantee. Strong and bounded staleness cost more, and session sits in between.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-07","obj":"2.1.1","difficulty":"easy","type":"single","stem":"What is stored in Azure Managed Redis to speed up repeated reads?","choices":["Cached copies of frequently read values","The only copy of the system of record","Long-term audit logs","Container images"],"answer":[0],"explanation":"Redis caches frequently read values in memory. Redis is a cache, not the system of record, an audit store, or an image registry.","ref":"https://learn.microsoft.com/azure/redis/overview-vector-similarity"},{"id":"2.1.1-08","obj":"2.1.1","difficulty":"medium","type":"single","stem":"In Azure Cosmos DB for NoSQL, which value determines the logical partition where an item is placed?","choices":["The item ID","The _etag value","The partition key value","The _ts timestamp"],"answer":[2],"explanation":"The partition key value assigned to each item determines which logical partition the item belongs to; all items with the same partition key value live in the same logical partition. The item ID uniquely identifies an item within a partition but does not determine the partition; _etag is a concurrency token and _ts is a system timestamp, neither of which controls partitioning.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-09","obj":"2.1.1","difficulty":"hard","type":"single","stem":"What is the maximum storage size of a single logical partition in Azure Cosmos DB for NoSQL?","choices":["5 GB","20 GB","50 GB","100 GB"],"answer":[1],"explanation":"Each logical partition can store up to 20 GB of data, which is why a partition key with a wide range of values is important. 5 GB, 50 GB, and 100 GB are not the logical partition limit; 50 GB is the storage limit of a physical partition, not a logical one.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-10","obj":"2.1.1","difficulty":"easy","type":"single","stem":"In Azure Cosmos DB, a \"hot partition\" occurs when which of the following happens?","choices":["Requests are spread evenly across all logical partitions","Each logical partition stays under 20 GB","The container has only one physical partition","A few logical partitions receive a disproportionate share of the requests"],"answer":[3],"explanation":"A hot partition arises when one or a few logical partition keys consume a disproportionate amount of the total throughput, causing uneven load and possible rate limiting. Even request distribution is the opposite of a hot partition; staying under 20 GB and having one physical partition are unrelated to whether a partition becomes hot.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-11","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Adventure Works Cycles wants to choose an effective partition key in Azure Cosmos DB for NoSQL. Which property makes the best partition key?","choices":["A property that is the same for every item","A property with a wide range of possible values","A property with only two possible values","A property that is null for most items"],"answer":[1],"explanation":"A partition key with a wide range of possible values distributes data and throughput evenly across partitions, which supports horizontal scaling. A value that is identical for every item, has only two values, or is null for most items concentrates data into few partitions and creates hot partitions.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-12","obj":"2.1.1","difficulty":"hard","type":"single","stem":"In Azure Cosmos DB for NoSQL, all items in the same logical partition share which characteristic?","choices":["The same partition key value","The same item ID","The same consistency level","The same Request Unit charge"],"answer":[0],"explanation":"A logical partition is the set of items that share the same partition key value. Item IDs must be unique within a partition, not shared; consistency level is an account setting and Request Unit charge varies per operation, so neither defines a logical partition.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-13","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A Fabrikam Inc. container uses UserID as its partition key and has 1,000 unique UserID values. How many logical partitions does the container have?","choices":["1","10","100","1,000"],"answer":[3],"explanation":"Each distinct partition key value maps to one logical partition, so 1,000 unique UserID values produce 1,000 logical partitions. 1, 10, and 100 undercount the logical partitions; the number of logical partitions equals the number of unique partition key values.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-14","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Hierarchical partition keys in Azure Cosmos DB for NoSQL support up to how many levels?","choices":["One level","Two levels","Three levels","Four levels"],"answer":[2],"explanation":"Hierarchical partition keys (subpartitioning) allow you to configure up to a three-level hierarchy for finer data distribution. One and two levels are below the supported maximum, and four levels exceeds the three-level limit.","ref":"https://learn.microsoft.com/azure/cosmos-db/hierarchical-partition-keys"},{"id":"2.1.1-15","obj":"2.1.1","difficulty":"hard","type":"single","stem":"In Azure Cosmos DB for NoSQL, what combination uniquely identifies an item within a container?","choices":["The consistency level and the item ID","The partition key value and the item ID","The Request Unit charge and the item ID","The change feed mode and the item ID"],"answer":[1],"explanation":"Combining the partition key value with the item ID creates the item's index, which uniquely identifies it. Consistency level, Request Unit charge, and change feed mode are account or operation settings, not part of an item's unique identity.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-16","obj":"2.1.1","difficulty":"easy","type":"single","stem":"In Azure Cosmos DB, a Request Unit (RU) is best described as which of the following?","choices":["A measure of the storage used by a container","A measure of the number of regions in an account","A measure of the number of indexes on a container","A measure of the resources consumed by a database operation"],"answer":[3],"explanation":"A Request Unit is a performance currency that abstracts the CPU, memory, and IOPS resources required to perform a database operation. RUs do not measure storage, region count, or index count; those are separate concepts unrelated to the cost currency for operations.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-17","obj":"2.1.1","difficulty":"medium","type":"single","stem":"In Azure Cosmos DB, approximately how many Request Units does a point read of a 1-KB item consume?","choices":["1 RU","10 RUs","100 RUs","1,000 RUs"],"answer":[0],"explanation":"A point read that fetches a single 1-KB item by its ID and partition key consumes about 1 Request Unit. 10, 100, and 1,000 RUs overstate the cost; a simple 1-KB point read is the baseline of roughly one RU.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-18","obj":"2.1.1","difficulty":"hard","type":"single","stem":"In Azure Cosmos DB, throughput is provisioned and measured in which unit?","choices":["Gigabytes per second","Transactions per hour","Request Units per second (RU/s)","Queries per minute"],"answer":[2],"explanation":"Azure Cosmos DB measures throughput in Request Units per second (RU/s). Gigabytes per second measures data transfer, and transactions per hour and queries per minute are not the throughput unit Azure Cosmos DB uses.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-19","obj":"2.1.1","difficulty":"easy","type":"single","stem":"In Azure Cosmos DB, which operation typically consumes the most Request Units?","choices":["A point read of a single item","A complex query over many items","Reading the account endpoint","Listing the databases in the account"],"answer":[1],"explanation":"A complex query that scans and processes many items consumes a variable and potentially much larger number of RUs than a point operation. A point read of a single item is the cheapest operation, and reading the endpoint or listing databases are lightweight control-plane actions.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-20","obj":"2.1.1","difficulty":"medium","type":"single","stem":"How can a developer find the number of Request Units consumed by a specific Azure Cosmos DB operation?","choices":["By counting the items returned","By checking the partition key value","By reading the request charge in the response header","By reading the item ID"],"answer":[2],"explanation":"Every operation returns the RUs it consumed in the request charge response header (for example, x-ms-request-charge). Counting returned items, checking the partition key, or reading the item ID does not report the actual RU cost of the operation.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-21","obj":"2.1.1","difficulty":"hard","type":"single","stem":"The Normalized RU Consumption metric in Azure Cosmos DB is expressed as a value in which range?","choices":["0% to 100%","0 to 1,000","1 to 10","-100% to 100%"],"answer":[0],"explanation":"Normalized RU Consumption is a metric between 0% and 100% that measures utilization of provisioned throughput. The metric is a percentage, so 0 to 1,000, 1 to 10, and negative percentages are not valid ranges.","ref":"https://learn.microsoft.com/azure/cosmos-db/nosql/overview"},{"id":"2.1.1-22","obj":"2.1.1","difficulty":"easy","type":"single","stem":"What happens when requests to an Azure Cosmos DB container exceed the provisioned Request Units per second?","choices":["The container is automatically deleted","The consistency level is downgraded","The partition key is changed","The requests are rate-limited with an HTTP 429 response"],"answer":[3],"explanation":"When requests exceed the provisioned RU/s, Azure Cosmos DB rate-limits them and returns an HTTP 429 (request rate too large) response. Exceeding throughput never deletes the container, changes the consistency level, or alters the partition key; it only throttles the excess requests.","ref":"https://learn.microsoft.com/azure/cosmos-db/optimize-cost-reads-writes"},{"id":"2.1.1-23","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Which Azure Cosmos DB consistency level guarantees that a read always returns the most recently committed write?","choices":["Strong","Session","Eventual","Consistent prefix"],"answer":[0],"explanation":"Strong consistency guarantees that read operations always return the value that was last written and committed. Session, Eventual, and Consistent prefix are weaker levels that can return older values and do not guarantee the latest committed write globally.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-24","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which list shows Azure Cosmos DB consistency levels ordered from strongest to weakest?","choices":["Strong, Bounded staleness, Session, Consistent prefix, Eventual","Eventual, Session, Bounded staleness, Consistent prefix, Strong","Session, Strong, Eventual, Bounded staleness, Consistent prefix","Bounded staleness, Strong, Eventual, Session, Consistent prefix"],"answer":[0],"explanation":"By order of strength the five levels are Strong, Bounded staleness, Session, Consistent prefix, and Eventual. The other orderings misplace the levels; Strong is always strongest and Eventual is always weakest.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-25","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Which Azure Cosmos DB consistency level guarantees read-your-own-writes within a single session?","choices":["Eventual","Session","Consistent prefix","Bounded staleness"],"answer":[1],"explanation":"Session consistency guarantees monotonic reads, monotonic writes, and read-your-own-writes within a single client session. Eventual and Consistent prefix do not guarantee read-your-own-writes, and Bounded staleness bounds lag by version or time rather than scoping to a session.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-26","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Which Azure Cosmos DB consistency level is the weakest, offering the lowest latency?","choices":["Strong","Bounded staleness","Session","Eventual"],"answer":[3],"explanation":"Eventual consistency is the weakest level; reads may return a subset of writes but offer the lowest latency and highest availability. Strong, Bounded staleness, and Session are all stronger than Eventual and provide more ordering or freshness guarantees at higher cost.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-27","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Which Azure Cosmos DB consistency level guarantees that reads lag writes by no more than a configured number of versions or time interval?","choices":["Eventual","Strong","Bounded staleness","Consistent prefix"],"answer":[2],"explanation":"Bounded staleness guarantees that reads are not too out of date, bounded by a configured number of operations (versions) or a time interval. Eventual has no staleness bound, Strong always returns the latest write, and Consistent prefix only guarantees ordering, not a staleness window.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-28","obj":"2.1.1","difficulty":"easy","type":"single","stem":"What is the default consistency level for a new Azure Cosmos DB account?","choices":["Strong","Bounded staleness","Session","Eventual"],"answer":[2],"explanation":"Session is the default consistency level for a new Azure Cosmos DB account, balancing strong guarantees within a session with good performance. Strong, Bounded staleness, and Eventual can be selected but are not the default level for a new account.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-29","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Which Azure Cosmos DB consistency level guarantees that reads never see writes out of order, returning some prefix of all writes with no gaps?","choices":["Strong","Session","Eventual","Consistent prefix"],"answer":[3],"explanation":"Consistent prefix guarantees that reads return some prefix of all writes with no gaps, so updates are never seen out of order. Strong returns the latest write, Session scopes guarantees to a session, and Eventual can return writes with no ordering guarantee.","ref":"https://learn.microsoft.com/azure/cosmos-db/consistency-levels"},{"id":"2.1.1-30","obj":"2.1.1","difficulty":"hard","type":"single","stem":"What is the change feed in Azure Cosmos DB?","choices":["A backup of the entire container taken nightly","A persistent record of changes to a container in the order they occur","A list of indexes defined on a container","A cache of frequently read items"],"answer":[1],"explanation":"The change feed is a persistent record of changes to a container in the order the changes occur, which consumers can process incrementally. It is not a nightly backup, an index list, or a read cache; it is an ordered log of item changes.","ref":"https://learn.microsoft.com/azure/cosmos-db/change-feed"},{"id":"2.1.1-31","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Which Azure Cosmos DB change feed mode captures delete operations?","choices":["Latest version mode","All versions and deletes mode","Incremental snapshot mode","Point-in-time mode"],"answer":[1],"explanation":"All versions and deletes mode records creates, updates, and deletes, including intermediate changes, in the order they occur. Latest version mode does not
