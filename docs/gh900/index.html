<!doctype html>

<head>

<title>GH-900 Exam Buddy</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6573; --line: #dde1e6;
  --accent: #0b63ce; --accent-text: #ffffff; --ok: #1a7f37; --ok-bg: #e6f4ea; --bad: #c62828; --bad-bg: #fdecea;
  --code-bg: #f0f2f5; --chip: #eef2f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
    --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
    --code-bg: #0c0f13; --chip: #242a32;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
  --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
  --code-bg: #0c0f13; --chip: #242a32;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; overflow-wrap: anywhere; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.muted { color: var(--muted); font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
label.opt { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
legend { font-weight: 600; margin-bottom: 8px; }
button, select { font: inherit; }
button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button.sm { padding: 2px 9px; font-weight: 500; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, .choice:focus-within, select:focus-visible, .tile:focus-visible, .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); max-width: 100%; }
pre select { font: inherit; padding: 0 4px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
.chip.easy { color: var(--ok); } .chip.hard { color: var(--bad); } .chip.clock { color: var(--text); font-weight: 600; }
.stem p { margin: 0 0 10px; }
pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; overflow-wrap: normal; font-size: .85rem; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0; cursor: pointer; }
.choice input { margin-top: 4px; }
.correct { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
.wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.why { font-size: .9rem; color: var(--muted); margin-top: 4px; }
.verdict { font-weight: 700; margin: 12px 0 4px; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.bar > div { height: 100%; background: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { min-width: 64px; }
table.yn td:not(:first-child), table.yn th:not(:first-child) { text-align: center; width: 56px; }
.big { font-size: 2.2rem; font-weight: 700; }
a { color: var(--accent); }
.lbl { font-weight: 600; margin: 14px 0 6px; }
.dd { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .dd { grid-template-columns: 1fr; } }
.zone { min-height: 60px; border: 1px dashed var(--line); border-radius: 10px; padding: 6px; background: var(--bg); }
.pool.flat { display: flex; flex-wrap: wrap; gap: 6px; }
.pool.flat .tile { margin: 0; }
.tile { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--card); cursor: grab; }
.tile.sel { outline: 2px solid var(--accent); }
.tile .num { font-weight: 600; flex: none; }
.tile .txt { flex: 1; }
.tools { display: flex; gap: 4px; flex: none; }
.slot { min-height: 40px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px; cursor: pointer; background: var(--bg); }
.case { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; background: var(--bg); }
.case summary { cursor: pointer; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.case-body { max-height: 55vh; overflow: auto; }
.case-body p { margin: 0 0 10px; }
.note { border-left: 4px solid var(--accent); padding: 8px 12px; background: var(--chip); border-radius: 6px; margin-bottom: 12px; font-size: .9rem; }
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.rv button { text-align: left; font-weight: 500; }
</style>
</head>

    <h1>GH-900 Exam Buddy</h1>
    <button class="ghost" id="theme" type="button" aria-label="Toggle light/dark theme">Theme</button>

<script>
const DATA = {"exam":{"id":"GH-900","title":"GitHub Foundations"},"domains":{"1":{"title":"Understand Git and GitHub basics","weight":"25-30%"},"2":{"title":"Work with GitHub repositories","weight":"10-15%"},"3":{"title":"Collaborate using GitHub","weight":"10-15%"},"4":{"title":"Apply modern development practices","weight":"10-15%"},"5":{"title":"Manage projects with GitHub","weight":"5-10%"},"6":{"title":"Understand privacy, security, and administration","weight":"10-15%"},"7":{"title":"Explore the GitHub community","weight":"5-10%"}},"objectives":{"1.1.1":"Describe the purpose and benefits of version control","1.1.2":"Explain the difference between Git and GitHub","1.1.3":"Identify key Git concepts such as repositories, commits, and branches","1.2.1":"Describe GitHub accounts, organizations, and enterprise options","1.2.2":"Explain the GitHub Flow for collaboration","1.2.3":"Identify uses of Markdown for clear communication in issues and pull requests","1.2.4":"Recognize when to use GitHub Desktop and GitHub Mobile","2.1.1":"Describe the structure and key files of a GitHub repository (README, LICENSE, CONTRIBUTING, CODEOWNERS, SECURITY)","2.1.2":"Identify how to create, organize, and maintain repositories using templates and branches","2.1.3":"Explain how to add and manage files within a repository","2.1.4":"Describe repository insights, stars, feature previews, repository metrics dashboards, and dependency insights for improved visibility","2.1.5":"Recognize best practices for repository maintenance and collaboration","3.1.1":"Describe how to use issues, pull requests, and discussions for collaboration","3.1.2":"Explain how to link pull requests to issues and manage templates, filters, and assignments","3.1.3":"Identify the purpose of notifications and how to configure them for workflow management","3.1.4":"Describe how to use Gists, Wikis, and GitHub Pages to document and share information","4.1.1":"Describe the purpose and capabilities of GitHub Actions","4.1.2":"Identify how GitHub Copilot assists with AI-powered code suggestions, including Copilot agents, Agent Mode, and multi-model support","4.1.3":"Explain the differences between GitHub Copilot for Individuals, Business, and Enterprise","4.1.4":"Describe GitHub Codespaces and how to set up, customize, and use dev containers","4.1.5":"Explain when to use the github.dev editor and how it differs from Codespaces","5.1.1":"Describe GitHub Projects and layout options","5.1.2":"Explain how to configure projects, labels, milestones, and workflows","5.1.3":"Identify how to use saved replies and assignees to streamline communication","5.1.4":"Describe how project insights can be used to track progress and productivity","6.1.1":"Describe how to secure accounts with two-factor authentication (2FA) and passkeys","6.1.2":"Identify access permissions and roles for repositories and organizations","6.1.3":"Explain the purpose of Enterprise Managed Users (EMUs) and organization-wide Copilot policy management","6.1.4":"Describe repository privacy options, visibility settings, and branch protection rules","6.1.5":"Recognize how to manage organization settings, teams, and roles","7.1.1":"Describe the benefits of open source and GitHub Sponsors","7.1.2":"Explain how GitHub supports and advances open-source projects","7.1.3":"Identify how to follow users and organizations to stay informed about activity","7.1.4":"Describe the GitHub Marketplace and its purpose","7.1.5":"Explain how InnerSource applies open-source principles within organizations","7.1.6":"Recognize when to use forks, templates, and discoverable repositories to promote collaboration"},"questions":[{"id":"1.1.1-01","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. stores its configuration files in a Git repository. During an audit, the team must determine who changed a specific file last month, when the change was made, and why.\n\nWhich benefit of version control should the team use?","choices":["The ability to restore the project to an earlier version","A recorded history of each change with author, date, and message","Branches that isolate work in progress from the default branch","A shared view of the work that teammates have in progress"],"answer":[1],"explanation":"Version control records what changed, who changed it, when, and why, so the history answers every audit question in the stem. Restoring an earlier version would be right if the team needed to roll back, and branches or a shared view of work in progress address isolation and coordination, not accountability.","ref":"https://docs.github.com/en/get-started/using-git/about-git"},{"id":"1.1.1-02","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank has developers in three time zones who change the same application. The team wants every developer to work in parallel and to propose changes without disrupting the version that runs in production.\n\nWhich benefit of version control should the team rely on?","choices":["Recovery of any earlier version of the project","A history that shows what changed and who changed it","Lines of development that run in parallel and merge later","A consistent view of the work that is in progress"],"answer":[2],"explanation":"Branches let developers work independently and propose changes without disrupting production code, which matches both constraints in the stem. Recovery and history help after the fact, and a consistent view of work in progress improves alignment but does not isolate anyone's changes from production.","ref":"https://docs.github.com/en/get-started/using-git/about-git"},{"id":"1.1.1-03","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Northwind Traders developers often work on trains and in remote locations with no network connection. The team is replacing a centralized version control system with a distributed version control system.\n\nWhich two capabilities should the developers expect from a distributed version control system? Each correct answer presents part of the solution.","choices":["Locking a file on the server while it is edited","Committing changes to a local repository without a network connection","Checking out each file from a central server before editing it","Browsing project history from a complete local copy","Depending on a central server as the sole location of the project history"],"answer":[1,3],"explanation":"In a distributed version control system such as Git, each local clone is a complete repository, so developers can commit and view history offline and sync with the server later. File locking, mandatory check-out, and server-only history describe centralized systems, which are the model the team is leaving.","ref":"https://learn.microsoft.com/devops/develop/git/what-is-git"},{"id":"1.1.1-04","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Lucerne Publishing is choosing a version control system for a team that works offline for weeks at a time. Each developer must be able to commit changes, browse the full project history, and compare versions on a laptop without contacting a server.\n\nWhich type of version control system should the team choose?","choices":["Distributed, with a full repository on each laptop","Centralized, with server workspaces and file check-out","Centralized, with local workspaces that check in to the server","Centralized, with a separate history stored for each file"],"answer":[0],"explanation":"A distributed system gives each developer a complete local repository, so commits, history, and comparisons work with no network. Centralized systems keep the history on the server, even when local workspaces allow offline edits, so browsing history and committing still depend on the server.","ref":"https://learn.microsoft.com/azure/devops/repos/tfvc/comparison-git-tfvc?view=azure-devops"},{"id":"1.1.2-01","obj":"1.1.2","difficulty":"easy","type":"single","stem":"Proseware, Inc. wants a version control tool that tracks file changes on a laptop and also works with repositories that are hosted on servers other than GitHub.\n\nWhich tool should the team use?","choices":["GitHub CLI","GitHub Mobile","Git","GitHub Codespaces"],"answer":[2],"explanation":"Git is the distributed version control system that works with any local or remote repository, including ones not hosted on GitHub. GitHub CLI is specifically for working with GitHub, and GitHub Mobile and GitHub Codespaces are GitHub products that do not replace the version control tool itself.","ref":"https://docs.github.com/en/get-started/using-github/github-cli"},{"id":"1.1.2-02","obj":"1.1.2","difficulty":"medium","type":"single","stem":"Tailspin Toys developers use Git to commit and branch on their own computers. The team now wants to review and discuss proposed changes in a browser before the changes are merged into the default branch.\n\nWhich capability that GitHub adds to Git should the team use?","choices":["Branches that hold parallel lines of development","Commits that record snapshots of the project files","Local repositories that contain the full history","Pull requests that display differences for review"],"answer":[3],"explanation":"Pull requests are a GitHub feature built on top of Git that show the differences between branches and let collaborators comment and review before merging. Branches, commits, and local repositories already come from Git itself, so they are not what GitHub adds.","ref":"https://docs.github.com/en/get-started/start-your-journey/about-github-and-git"},{"id":"1.1.2-03","obj":"1.1.2","difficulty":"hard","type":"single","stem":"User1 at Relecloud cloned a repository from GitHub, created a branch, and ran git commit twice. User2 opens the repository on github.com and does not see the new commits or the branch. User1 is not ready to open a pull request.\n\nWhich action should User1 perform?","choices":["Fetch the latest changes from the remote repository","Push the branch to the remote repository on GitHub","Clone the repository again into a new folder","Pull the default branch into the local repository"],"answer":[1],"explanation":"Commits are saved in the local repository, and git push publishes them to the remote repository on GitHub so that others can see them. Fetch and pull bring remote changes down to the local copy, which is the opposite direction, and a new clone would not contain the unpublished commits.","ref":"https://docs.github.com/en/get-started/git-basics/about-remote-repositories"},{"id":"1.1.2-04","obj":"1.1.2","difficulty":"medium","type":"multi","stem":"Adventure Works Cycles uses Git on developer laptops. Management wants to know which capabilities come from the GitHub platform instead of from Git itself.\n\nWhich two capabilities should you identify? Each correct answer presents a complete solution.","choices":["Creating commits in a local repository","Hosting repositories in the cloud for sharing with a team","Creating branches from the default branch","Staging files by running git add","Tracking planned work by using issues"],"answer":[1,4],"explanation":"GitHub hosts Git repositories in the cloud and adds planning and collaboration tools such as issues. Creating commits, creating branches, and staging files are Git operations that work in a local repository without GitHub.","ref":"https://docs.github.com/en/get-started/start-your-journey/about-github-and-git"},{"id":"1.1.3-01","obj":"1.1.3","difficulty":"easy","type":"single","stem":"A developer at Wingtip Toys finished editing two files and wants to record a permanent snapshot of the staged changes together with a short message that explains why.\n\nWhat should the developer create?","choices":["A branch","A pull request","A commit","A fork"],"answer":[2],"explanation":"A commit saves a snapshot of the staged files at a point in time with a message. A branch is a line of development that holds commits, a pull request proposes merging a branch, and a fork is a copy of a repository in another account.","ref":"https://docs.github.com/en/get-started/using-git/about-git"},{"id":"1.1.3-02","obj":"1.1.3","difficulty":"medium","type":"single","stem":"Margie's Travel developers want to try a new feature in the same repository. The work must stay separate from the default branch until it is reviewed, and the team does not want a copy of the repository in another account.\n\nWhat should the developers create?","choices":["A fork","A branch","A clone","A remote"],"answer":[1],"explanation":"A branch is a separate line of development inside the same repository, so changes stay off the default branch until they are merged. A fork would copy the repository to another account, a clone is a local copy, and a remote is a named link to a hosted repository.","ref":"https://docs.github.com/en/get-started/using-git/about-git"},{"id":"1.1.3-03","obj":"1.1.3","difficulty":"hard","type":"single","stem":"A developer at Trey Research edits File1 and File2, stages only File1 by running git add File1, and then runs git commit with a message.\n\nWhich changes should the developer expect the new commit to contain?","choices":["The changes to File1 and File2","The changes to File2 that were edited most recently","The staged changes to File1","No changes, because the files must be pushed first"],"answer":[2],"explanation":"Changes are first staged with git add and then saved with git commit, so the commit contains what was staged: the changes to File1. File2 was edited but never staged, and pushing happens after the commit to share it, not before.","ref":"https://docs.github.com/en/get-started/using-git/about-git"},{"id":"1.1.3-04","obj":"1.1.3","difficulty":"hard","type":"single","stem":"User1 at Fabrikam, Inc. has write access to a repository on GitHub and has no local copy of it. User1 must work offline on a train, switch between existing branches, and browse every earlier commit. Later, User1 will push changes to the same repository.\n\nWhich action should User1 perform first?","choices":["Fork the repository to a personal account","Download the repository as a ZIP archive","Run git fetch in an empty folder","Clone the repository to the laptop"],"answer":[3],"explanation":"Cloning copies the remote repository, with its branches and complete history, to the computer so the work can continue offline and be pushed back later. A fork creates another repository that is not needed with write access, a ZIP archive has no history, and git fetch needs an existing local repository.","ref":"https://docs.github.com/en/get-started/git-basics/about-remote-repositories"},{"id":"1.2.1-01","obj":"1.2.1","difficulty":"easy","type":"single","stem":"Litware, Inc. owns five GitHub organizations. The IT department wants to manage policies and billing for all of them from one place.\n\nWhich type of account should Litware use?","choices":["An organization account","A personal account","A machine user account","An enterprise account"],"answer":[3],"explanation":"An enterprise account lets administrators centrally manage policies and billing for multiple organizations. An organization account groups people and repositories but does not span organizations, a personal account is an individual identity, and a machine user account supports automation.","ref":"https://learn.microsoft.com/training/modules/github-introduction-products/2-what-are-github-products"},{"id":"1.2.1-02","obj":"1.2.1","difficulty":"easy","type":"single","stem":"User1 is a member of two GitHub organizations at Northwind Traders and must access repositories in both.\n\nHow should User1 sign in?","choices":["Sign in to each organization by using its own credentials","Sign in to a personal account that belongs to both organizations","Create a second personal account for each organization membership","Sign in to the enterprise account that owns both organizations"],"answer":[1],"explanation":"People sign in to their personal account, and one personal account can be a member of multiple organizations. You cannot sign in to an organization, and enterprise accounts do not replace the personal account, so creating more accounts or signing in elsewhere is unnecessary.","ref":"https://docs.github.com/en/get-started/learning-about-github/types-of-github-accounts"},{"id":"1.2.1-03","obj":"1.2.1","difficulty":"medium","type":"single","stem":"Tailspin Toys has an organization of 20 developers with private repositories. The team needs team pull request reviewers, protected branches, and email support. The company does not need SAML single sign-on, an enterprise account, or a self-hosted option.\n\nWhich GitHub plan should Tailspin Toys choose?","choices":["GitHub Free","GitHub Pro","GitHub Team","GitHub Enterprise Cloud"],"answer":[2],"explanation":"GitHub Team is designed for organizations and adds email support and advanced private repository tools such as team pull request reviewers and protected branches. GitHub Free lacks those tools, GitHub Pro is for personal accounts, and GitHub Enterprise Cloud adds capabilities the company explicitly does not need.","ref":"https://docs.github.com/en/get-started/learning-about-github/githubs-plans"},{"id":"1.2.1-04","obj":"1.2.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank must provision employee accounts from its identity provider, which also controls usernames and organization membership. Compliance also requires that these accounts cannot create public content or collaborate outside the company.\n\nWhich approach should Woodgrove Bank use?","choices":["Personal accounts that use SAML single sign-on with an organization","Enterprise Managed Users in GitHub Enterprise Cloud","Machine user accounts that are owned by the organization","Personal accounts that are invited as outside collaborators"],"answer":[1],"explanation":"Enterprise Managed Users are created and controlled through the identity provider, and managed users cannot create public content or collaborate outside the enterprise. Personal accounts with SAML single sign-on stay under the control of the individual, so they cannot enforce those restrictions.","ref":"https://docs.github.com/en/enterprise-cloud@latest/admin/identity-and-access-management/using-enterprise-managed-users-for-iam/about-enterprise-managed-users"},{"id":"1.2.1-05","obj":"1.2.1","difficulty":"medium","type":"single","stem":"Adventure Works Cycles has two existing organizations and has just purchased GitHub Enterprise Cloud. The company wants central policies to apply to the existing organizations.\n\nWhich action should the enterprise owner perform?","choices":["Transfer the repositories into one new organization","Assign the enterprise owner role to each organization owner","Invite the existing organizations to join the enterprise account","Upgrade each organization to GitHub Team to inherit policies"],"answer":[2],"explanation":"Enterprise owners can invite existing organizations to join the enterprise account, and enterprise policies then apply to the organizations it owns. Moving repositories, granting roles, or changing plans does not bring the organizations under enterprise policy.","ref":"https://learn.microsoft.com/training/modules/github-introduction-products/2-what-are-github-products"},{"id":"1.2.2-01","obj":"1.2.2","difficulty":"easy","type":"single","stem":"A developer at Litware, Inc. is about to start a new feature in a repository that uses GitHub flow. The changes must not affect the default branch until they are reviewed.\n\nWhat should the developer do first?","choices":["Open a draft pull request for the feature","Create a branch from the default branch","Commit the changes to the default branch","Fork the repository to a personal account"],"answer":[1],"explanation":"GitHub flow starts by creating a branch, which keeps work separate from the default branch until it is merged. A pull request needs a branch with commits, committing to the default branch skips review, and a fork is not needed when the developer can already work in the repository.","ref":"https://docs.github.com/en/get-started/using-github/github-flow"},{"id":"1.2.2-02","obj":"1.2.2","difficulty":"easy","type":"single","stem":"Reviewers at Fabrikam, Inc. need to see the differences between a feature branch and the default branch, comment on specific lines, and approve the changes before they are merged.\n\nWhich GitHub feature should the team use?","choices":["An issue","A pull request","A discussion","A commit comment"],"answer":[1],"explanation":"A pull request proposes merging one branch into another, displays the differences, and supports line comments and approvals before the merge. An issue tracks work, a discussion supports open conversation, and a commit comment does not provide a review and approval process.","ref":"https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests"},{"id":"1.2.2-03","obj":"1.2.2","difficulty":"medium","type":"single","stem":"A pull request for a bug fix at Trey Research was approved and merged into the default branch. The developer will now start an unrelated change.\n\nWhich action should the developer perform?","choices":["Reopen the pull request for the unrelated change","Add the unrelated change to the merged branch","Delete the merged branch and start a new branch","Merge the default branch into the merged branch"],"answer":[2],"explanation":"In GitHub flow, the branch is deleted after the merge to show the work is complete, and each set of unrelated changes uses its own branch. Deleting does not remove the pull request or commit history, and the branch can be restored if needed.","ref":"https://docs.github.com/en/get-started/using-github/github-flow"},{"id":"1.2.2-04","obj":"1.2.2","difficulty":"medium","type":"single","stem":"A developer at Proseware, Inc. wants teammates to give early feedback on unfinished work through a pull request. The pull request must not be mergeable until the developer marks it ready for review.\n\nWhich type of pull request should the developer open?","choices":["A pull request from a fork","A pull request with no assigned reviewers","A draft pull request","A pull request that targets a different branch"],"answer":[2],"explanation":"A draft pull request supports early feedback and cannot be merged until it is marked ready for review. A pull request without reviewers, from a fork, or aimed at another branch is still a normal pull request, which can be merged when checks and rules allow it.","ref":"https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests"},{"id":"1.2.2-05","obj":"1.2.2","difficulty":"hard","type":"multi","stem":"Wingtip Toys is adopting GitHub flow for its web application. The team lead wants two working practices added to the contributor guidelines.\n\nWhich two practices should the team lead include? Each correct answer presents part of the solution.","choices":["Commit small fixes directly to the default branch to save time","Use a separate branch for each set of unrelated changes","Wait to push the branch until the entire feature is complete","Open a pull request to request feedback before merging","Keep the branch open after the merge so that history is preserved"],"answer":[1,3],"explanation":"GitHub flow uses a separate branch for each set of unrelated changes and a pull request to gather review feedback before merging. Pushing early backs up work and lets collaborators see it, and deleting the branch after the merge does not lose history because the commits and pull request remain.","ref":"https://docs.github.com/en/get-started/using-github/github-flow"},{"id":"1.2.3-01","obj":"1.2.3","difficulty":"easy","type":"single","stem":"A developer at Contoso, Ltd. is writing a pull request comment and wants to notify a teammate named User2.\n\nWhich Markdown syntax should the developer type?","choices":["#User2","@User2","[User2](User2)",":User2:"],"answer":[1],"explanation":"An at sign followed by a username mentions that person, who is then notified if they have read access to the repository. A number sign references an issue or pull request, a link points to a path, and colons around a name produce an emoji.","ref":"https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax"},{"id":"1.2.3-02","obj":"1.2.3","difficulty":"medium","type":"single","stem":"A maintainer at Relecloud creates an issue to track a release. The issue needs a checklist whose first item refers to the open issue number 42. The item must show the title and state of issue 42 and be checked off automatically when issue 42 closes.\n\nWhich Markdown should the maintainer enter?","choices":["- [x] #42","* #42","- [ ] #42","- [ ] issue 42"],"answer":[2],"explanation":"A task list item uses a hyphen and an empty checkbox followed by an issue reference, and the reference shows the issue title and state and is checked when the issue closes. A checked box would mean the task is already complete, a plain bullet is not a task, and plain text is not a reference.","ref":"https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/about-task-lists"},{"id":"1.2.3-03","obj":"1.2.3","difficulty":"medium","type":"single","stem":"User1 at Tailspin Toys wants to paste five lines of terminal output into an issue comment. The whitespace must be preserved and no Markdown inside the output may be interpreted.\n\nWhich Markdown should User1 use?","choices":["A fenced code block that uses triple backticks","A block quote that starts each line with >","Inline code that is wrapped in single backticks","Bold text that is wrapped in double asterisks"],"answer":[0],"explanation":"A fenced code block that is delimited by triple backticks renders multiple lines as code and preserves them. Inline code is meant for short spans within a sentence, a block quote still interprets Markdown, and bold text only changes emphasis.","ref":"https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax"},{"id":"1.2.3-04","obj":"1.2.3","difficulty":"hard","type":"single","stem":"Maintainers at Northwind Traders want a pull request description to include a callout that renders as a highlighted box and warns reviewers about a breaking change.\n\nWhich Markdown should the maintainers use?","choices":["A block quote that begins with [!WARNING] on its first line","A block quote in which the word Warning is bold","A level-two heading that contains the word Warning","A task list item that is labeled Warning"],"answer":[0],"explanation":"GitHub alerts use a block quote whose first line is a type such as [!WARNING], which renders as a highlighted callout. A bold quote, a heading, or a task item only formats text and does not produce the styled alert box.","ref":"https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax"},{"id":"1.2.4-01","obj":"1.2.4","difficulty":"easy","type":"single","stem":"Designers at Wingtip Toys prefer a graphical interface. On Windows laptops, they must clone repositories, review changes, commit, and push without using the command line.\n\nWhich tool should the designers use?","choices":["GitHub Mobile","GitHub Desktop","GitHub CLI","GitHub Codespaces"],"answer":[1],"explanation":"GitHub Desktop is an application for Windows and macOS that provides a graphical interface for cloning, committing, and pushing. GitHub CLI is a command-line tool, GitHub Mobile targets phones, and GitHub Codespaces runs a development environment in the cloud.","ref":"https://learn.microsoft.com/training/modules/github-introduction-products/3-mobile-versus-desktop"},{"id":"1.2.4-02","obj":"1.2.4","difficulty":"medium","type":"single","stem":"An on-call engineer at Fabrikam, Inc. is traveling with only an iPhone. The engineer must triage notifications and review a pull request that blocks a release.\n\nWhich tool should the engineer use?","choices":["GitHub Desktop","GitHub CLI","Git command line","GitHub Mobile"],"answer":[3],"explanation":"GitHub Mobile is available for iOS and Android and supports managing notifications and reviewing pull requests on a phone. GitHub Desktop runs on Windows and macOS, and GitHub CLI and the Git command line need a terminal.","ref":"https://learn.microsoft.com/training/modules/github-introduction-products/3-mobile-versus-desktop"},{"id":"1.2.4-03","obj":"1.2.4","difficulty":"hard","type":"single","stem":"A designer at Lucerne Publishing works on macOS and edits image files in a repository. Before committing, the designer must visually compare the changed images and add a colleague as coauthor of the commit. The designer wants a locally installed graphical application.\n\nWhich tool should the designer use?","choices":["GitHub Mobile","Git command line","GitHub Codespaces","GitHub Desktop"],"answer":[3],"explanation":"GitHub Desktop is installed locally on Windows or macOS and supports comparing changed images and adding coauthors to a commit. GitHub Mobile does not offer these commit features, the Git command line is not graphical, and GitHub Codespaces is hosted in the cloud rather than installed locally.","ref":"https://learn.microsoft.com/training/modules/github-introduction-products/3-mobile-versus-desktop"},{"id":"1.2.4-04","obj":"1.2.4","difficulty":"hard","type":"multi","stem":"User1 at Margie's Travel uses GitHub Mobile on an Android phone while traveling.\n\nWhich two tasks should User1 expect to perform in GitHub Mobile? Each correct answer presents a complete solution.","choices":["Clone a repository to a local folder and start working","Verify a sign-in attempt from an unrecognized device","Add a coauthor to a commit before committing","Triage and clear notifications by marking threads as read","Compare changed images before committing"],"answer":[1,3],"explanation":"GitHub Mobile supports managing and clearing notifications and verifying sign-in attempts on unrecognized devices. Cloning repositories, adding coauthors to commits, and comparing changed images are GitHub Desktop capabilities for local Git workflows.","ref":"https://learn.microsoft.com/training/modules/github-introduction-products/3-mobile-versus-desktop"},{"id":"2.1.1-01","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. keeps product documentation in the /docs folder of Repo1. The documentation team has write access to the repository. Litware wants the documentation team to be requested for review automatically whenever a pull request changes files in /docs.\n\nWhich file should you add to Repo1?","choices":["CONTRIBUTING.md","SUPPORT.md","CODEOWNERS","CITATION.cff"],"answer":[2],"explanation":"A CODEOWNERS file maps file paths to users or teams, and GitHub requests those owners for review when a pull request changes matching files. The owners need write access, which the documentation team has. CONTRIBUTING.md only shows contribution guidelines, SUPPORT.md points people to help resources, and CITATION.cff describes how to cite the project, so none of them requests reviewers.","ref":"https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners"},{"id":"2.1.1-02","obj":"2.1.1","difficulty":"medium","type":"multi","stem":"Fabrikam, Inc. publishes Repo1 as a public repository. Maintainers want GitHub to show a link to contribution guidelines when someone opens an issue or a pull request. Maintainers also want security researchers to find the supported versions and the steps for reporting a vulnerability in the repository's security policy.\n\nWhich two files should you add to Repo1? Each correct answer presents part of the solution.","choices":["CODE_OF_CONDUCT.md","CONTRIBUTING.md","CODEOWNERS","SECURITY.md","SUPPORT.md"],"answer":[1,3],"explanation":"CONTRIBUTING.md holds the guidelines that GitHub links to when someone opens an issue or pull request, and SECURITY.md holds the security policy with supported versions and reporting steps. CODE_OF_CONDUCT.md describes expected behavior, CODEOWNERS assigns reviewers, and SUPPORT.md explains where to get help. They would be right for different requirements than the two in this scenario.","ref":"https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/setting-guidelines-for-repository-contributors"},{"id":"2.1.1-03","obj":"2.1.1","difficulty":"hard","type":"multi","stem":"Tailspin Toys is preparing Repo1 to become a public open-source repository. Visitors who land on the repository home page must see what the project does and how to get started. Other developers must also be told under which terms they may reuse and modify the code, because default copyright law restricts reuse when no terms are stated. Contribution rules and citation details are handled later.\n\nWhich two files should you add to Repo1? Each correct answer presents part of the solution.","choices":["CITATION.cff","README.md","CONTRIBUTING.md","CODE_OF_CONDUCT.md","LICENSE"],"answer":[1,4],"explanation":"A README is displayed automatically on the repository home page and explains what the project does and how to start. A LICENSE file states the reuse terms, which GitHub can detect and display. CONTRIBUTING.md, CODE_OF_CONDUCT.md, and CITATION.cff are valid community files, but the stem defers contribution rules and citation details and does not ask for conduct rules.","ref":"https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes"},{"id":"2.1.2-01","obj":"2.1.2","difficulty":"easy","type":"single","stem":"Woodgrove Bank wants every new service team to start from the same folder structure, workflow files, and issue templates. Each new repository must be independent and must not keep a link to the starting repository as an upstream.\n\nWhich GitHub feature should you configure for the starting repository?","choices":["Fork","Git submodule","Template repository","Repository transfer"],"answer":[2],"explanation":"Marking the starting repository as a template lets anyone with access create new repositories that receive its directory structure and files without being linked as an upstream. A fork keeps a connection to the original repository, a submodule embeds one repository inside another, and a transfer moves ownership rather than creating copies.","ref":"https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-template-repository"},{"id":"2.1.2-02","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Litware, Inc. has Repo1 with the branches main and release. User1 has admin access to Repo1. New pull requests and commits must use release as the base branch unless someone selects another branch.\n\nWhich repository change should User1 make?","choices":["Add a branch protection rule that targets release","Change the default branch to release in the repository settings","Set release as the publishing source for GitHub Pages","Add a CODEOWNERS entry for the release branch"],"answer":[1],"explanation":"The default branch is the base branch for pull requests and code commits, and an admin can change it in the repository settings when more than one branch exists. A branch protection rule restricts how a branch is changed but does not make it the base branch. The GitHub Pages source and CODEOWNERS control publishing and review requests.","ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-branches-in-your-repository/changing-the-default-branch"},{"id":"2.1.2-03","obj":"2.1.2","difficulty":"hard","type":"single","stem":"Contoso, Ltd. maintains Repo1 as a template repository. Its default branch main holds starter code, and a branch named samples holds optional sample content. User1 created Repo2 from the template and found that only the starter code is present. User1 needs both branches in Repo2 and does not want Repo2 to be a fork of Repo1.\n\nWhat should User1 do?","choices":["Open a pull request from the samples branch in Repo1 to Repo2","Make samples the default branch of Repo1 and create Repo2 again","Create Repo2 again from the template and choose to include all branches","Fork Repo1 and delete the branches that are not needed in the fork"],"answer":[2],"explanation":"When a repository is created from a template, GitHub copies the default branch, and the creator can choose to include the template's other branches as well. Branches created from a template have unrelated histories, so a pull request between the repositories is not possible. Changing the default branch would swap the content rather than add it, and a fork is excluded by the stem.","ref":"https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-template-repository"},{"id":"2.1.3-01","obj":"2.1.3","difficulty":"easy","type":"single","stem":"A contributor at Tailspin Toys has write access to Repo1 and works only in a web browser. The contributor must add a new text file named setup.md in a new folder named docs and type the content directly in the browser.\n\nWhich action should the contributor use?","choices":["Select Add file, then Upload files, and drop the docs folder on the page","Create a gist named setup.md and link it from the repository","Select Add file, then Create new file, and type docs/setup.md as the name","Create a wiki page named setup in the repository wiki"],"answer":[2],"explanation":"In the browser, Add file > Create new file lets you type the content, and a slash in the file name creates the folder. Uploading requires the file to exist locally, and a gist or a wiki page lives outside the repository file tree, so neither adds docs/setup.md to Repo1.","ref":"https://docs.github.com/en/repositories/working-with-files/managing-files/creating-new-files"},{"id":"2.1.3-02","obj":"2.1.3","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. needs to store a 150 MiB machine learning model file in Repo1 so that the file is versioned together with the code. User1 tried to upload the file by using the browser and the upload failed.\n\nWhat should User1 do?","choices":["Push the file with Git from a local clone without Git LFS","Upload the file in the browser to a new branch","Paste the file content into Create new file in the browser","Track the file with Git LFS and push it from a local clone"],"answer":[3],"explanation":"Browser uploads are limited to 25 MiB per file and the command line accepts files up to 100 MiB, so a 150 MiB file must be stored with Git Large File Storage. Plain Git from a clone fails above 100 MiB, and uploading to a new branch does not change the browser limit.","ref":"https://docs.github.com/en/repositories/working-with-files/managing-files/adding-a-file-to-a-repository"},{"id":"2.1.3-03","obj":"2.1.3","difficulty":"medium","type":"single","stem":"Relecloud requires that every change to the default branch of Repo1 is reviewed through a pull request in Repo1 itself. User1 has write access and edits README.md in the browser.\n\nWhich commit option should User1 select?","choices":["Commit directly to the default branch","Commit to a fork of Repo1 and open a pull request from the fork","Create a new branch for the commit and start a pull request","Commit directly to the default branch and revert the commit if it is rejected"],"answer":[2],"explanation":"When editing on the default branch, the recommended option is to create a new branch for the commit and open a pull request, which keeps the review inside Repo1. Direct commits bypass the review, and a fork is not needed because User1 has write access and the review must stay in Repo1.","ref":"https://docs.github.com/en/repositories/working-with-files/managing-files/creating-new-files"},{"id":"2.1.4-01","obj":"2.1.4","difficulty":"easy","type":"single","stem":"User1 finds a useful open-source repository named Repo1. User1 wants to find it again easily later and show appreciation to its maintainers, without receiving notifications about its activity.\n\nWhich action should User1 take?","choices":["Watch the repository","Star the repository","Fork the repository","Follow the repository owner"],"answer":[1],"explanation":"Starring a repository bookmarks it on your stars page and shows appreciation to the maintainer, and it does not subscribe you to notifications. Watching sends notifications, forking creates a copy for your own changes, and following a user tracks that user's activity rather than bookmarking a repository.","ref":"https://docs.github.com/en/get-started/exploring-projects-on-github/saving-repositories-with-stars"},{"id":"2.1.4-02","obj":"2.1.4","difficulty":"medium","type":"single","stem":"Woodgrove Bank maintains Lib1 as a public repository. The team wants to see which other public repositories and packages depend on Lib1, and also wants to see the dependencies of Lib1 that have known vulnerabilities.\n\nWhich feature should the team use?","choices":["Traffic","Network graph","Dependency graph","Pulse"],"answer":[2],"explanation":"The dependency graph lists the dependencies of a repository, flags known vulnerabilities, and shows dependents, which are other repositories and packages that use it. Traffic shows visitors and clones, the network graph shows forks, and Pulse summarizes recent issue, pull request, and commit activity.","ref":"https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-the-dependency-graph"},{"id":"2.1.5-01","obj":"2.1.5","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has ten developers who all have write access to Repo1. The developers want a simple way to work on changes in parallel and review them through pull requests.\n\nWhat should the developers do?","choices":["Fork Repo1 into the account of each developer","Clone Repo1 and push to a new repository for each developer","Create a template repository from Repo1 for each change","Create a branch in Repo1 for each change and open a pull request"],"answer":[3],"explanation":"For regular collaborators with write access, creating branches in the same repository is the recommended practice, and forks are reserved for unaffiliated contributors such as open-source contributors. Forks, separate repositories, and templates add copies that must be kept in sync and are not needed when everyone can push branches.","ref":"https://docs.github.com/en/repositories/creating-and-managing-repositories/best-practices-for-repositories"},{"id":"2.1.5-02","obj":"2.1.5","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. owns 30 public repositories. The company wants one CODE_OF_CONDUCT.md and one SECURITY.md, maintained in one place, to apply to every repository that does not have its own copy, including existing repositories. Repo5 already has its own SECURITY.md that must keep applying.\n\nWhat should you do?","choices":["Create a public repository named community-health in the organization and add the files","Create a template repository that contains the files and apply it to the existing repositories","Create a public repository named .github in the organization and add the files","Add the files to the docs folder of every repository, including Repo5"],"answer":[2],"explanation":"A public repository named .github in the organization provides default community health files for every repository that lacks its own copy, and a repository's own file takes precedence, so Repo5 keeps its SECURITY.md. A repository with another name is not read for defaults, a template only applies to new repositories, and copying files into each repository is not maintained in one place.","ref":"https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file"},{"id":"3.1.1-01","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Adatum Corporation maintainers want a place where community members can ask open-ended questions, share ideas, and read announcements. The conversations are not tied to a specific bug or code change and do not need an owner.\n\nWhich GitHub feature should you use?","choices":["Issues","Pull requests","Discussions","Wikis"],"answer":[2],"explanation":"Discussions work like a forum for open-ended conversation, announcements, and questions that are not tied to specific files or tasks. Issues track actionable work with an owner, pull requests propose code changes, and a wiki holds long-form documentation rather than conversation.","ref":"https://docs.github.com/en/get-started/using-github/communicating-on-github"},{"id":"3.1.1-02","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A customer of Litware, Inc. reports a reproducible bug in an open-source tool hosted in Repo1. A maintainer must track the bug, assign it to a developer, and add it to a milestone.\n\nWhich feature should the maintainer use?","choices":["A discussion in the Q&A category","An issue","A pull request","A wiki page"],"answer":[1],"explanation":"Issues track bugs, tasks, and feedback in a repository and support assignees, labels, and milestones. A discussion is meant for open-ended conversation without an owner, a pull request proposes a change to the code, and a wiki page documents the project.","ref":"https://docs.github.com/en/issues/tracking-your-work-with-issues/learning-about-issues/about-issues"},{"id":"3.1.1-03","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A developer at Tailspin Toys started a feature in the branch feature1 and wants teammates to review the approach early. The work is not finished, so the change must not be merged by accident, and code owners must not be asked to review it yet.\n\nWhat should the developer do?","choices":["Open a pull request that has a work in progress label","Open a draft pull request","Open an issue that links to the branch","Start a discussion that links to the branch"],"answer":[1],"explanation":"A draft pull request shares work in progress, cannot be merged until it is marked ready for review, and does not automatically request code owners. A label on a regular pull request does not block merging or the review requests. An issue or a discussion cannot hold the branch changes for review.","ref":"https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests"},{"id":"3.1.1-04","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Relecloud maintainers use the issues of Repo1 to track bugs. Many issues now contain open-ended debate without actionable work, and Discussions is not enabled for Repo1. The maintainers want to move these conversations out of the issue tracker without losing the existing comments.\n\nWhich two actions should the maintainers perform? Each correct answer presents part of the solution.","choices":["Lock each of the issues","Enable GitHub Discussions for Repo1","Close each of the issues as not planned","Convert each of the issues to a discussion","Pin each of the issues"],"answer":[1,3],"explanation":"An administrator must first enable Discussions, and then open-ended issues can be converted to discussions, which moves the conversation and keeps the comments. Locking, closing, or pinning an issue leaves the conversation in the tracker, so none of them moves it out.","ref":"https://docs.github.com/en/discussions/collaborating-with-your-community-using-discussions/about-discussions"},{"id":"3.1.2-01","obj":"3.1.2","difficulty":"easy","type":"single","stem":"A developer at Fabrikam, Inc. opens a pull request that fixes issue 42 in the same repository. Issue 42 must close automatically when the pull request is merged into the default branch.\n\nWhat should the developer add to the pull request description?","choices":["The text See #42","An @mention of the author of issue 42","The text Fixes #42","The same label as issue 42"],"answer":[2],"explanation":"A closing keyword such as Fixes, Closes, or Resolves followed by the issue number links the pull request to the issue and closes it when the pull request merges into the default branch. A reference without a keyword only creates a link, and mentions and labels do not link the two.","ref":"https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue"},{"id":"3.1.2-02","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. wants every new bug report in Repo1 to include steps to reproduce and an operating system, and submitters must not be able to submit the report without filling in those fields.\n\nWhich approach should you use?","choices":["Create a Markdown issue template in the .github/ISSUE_TEMPLATE folder on the default branch","Create an issue form as a YAML file in a feature branch","Create a pull request template on the default branch","Create an issue form as a YAML file in the .github/ISSUE_TEMPLATE folder on the default branch"],"answer":[3],"explanation":"Issue forms are defined in YAML, are stored in .github/ISSUE_TEMPLATE on the default branch, and let you mark inputs as required. A Markdown template only prefills text and cannot enforce fields, a template in a feature branch is not available to collaborators, and a pull request template applies to pull requests rather than issues.","ref":"https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/about-issue-and-pull-request-templates"},{"id":"3.1.2-03","obj":"3.1.2","difficulty":"hard","type":"single","stem":"The Repo1 repository of Woodgrove Bank has hundreds of open pull requests. User1 needs a list of the open pull requests for which User2 has been asked to review the changes, and not the ones that User2 owns as assignee or author.\n\nWhich search query should User1 enter on the pull requests page?","choices":["is:pr is:open assignee:User2","is:pr is:open author:User2","is:issue is:open review-requested:User2","is:pr is:open review-requested:User2"],"answer":[3],"explanation":"The review-requested qualifier combined with is:pr and is:open lists open pull requests where User2 has a pending review request. The assignee and author qualifiers match different relationships, and is:issue would search issues instead of pull requests.","ref":"https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/filtering-and-searching-issues-and-pull-requests"},{"id":"3.1.3-01","obj":"3.1.3","difficulty":"easy","type":"single","stem":"User1 watches Repo1 but receives too many emails. User1 wants notifications from Repo1 only for conversations in which User1 participates or is @mentioned.\n\nWhich watch setting should User1 select?","choices":["All Activity","Participating and @mentions","Ignore","Custom with every event type selected"],"answer":[1],"explanation":"Participating and @mentions limits notifications to conversations the user joins or is mentioned in. All Activity and a Custom setting with every event type produce notifications for all conversations, and Ignore silences notifications from the repository entirely.","ref":"https://docs.github.com/en/subscriptions-and-notifications/get-started/configuring-notifications"},{"id":"3.1.3-02","obj":"3.1.3","difficulty":"medium","type":"single","stem":"User1 depends on a library in Repo1 and wants to be notified when new releases are published and when security alerts are raised for Repo1. User1 does not want notifications about ordinary issues or pull requests in Repo1.\n\nWhich watch setting should User1 select?","choices":["Participating and @mentions","All Activity","Custom with Releases and Security alerts selected","Ignore"],"answer":[2],"explanation":"The Custom watch setting lets you choose event types such as releases and security alerts. Participating and @mentions would not report releases or alerts, All Activity would also send every issue and pull request conversation, and Ignore would silence the repository.","ref":"https://docs.github.com/en/subscriptions-and-notifications/get-started/configuring-notifications"},{"id":"3.1.3-03","obj":"3.1.3","difficulty":"hard","type":"single","stem":"User1 has many notifications in the GitHub inbox. Inbox notifications are removed after about three months. One notification covers a decision that User1 must be able to find again after more than three months, and User1 wants to keep receiving updates on that conversation.\n\nWhich action should User1 apply to that notification?","choices":["Done","Unsubscribe","Save","Mark as read"],"answer":[2],"explanation":"Saving a notification keeps it in the inbox indefinitely for later review. Done removes it from the inbox and keeps it only for three months, Unsubscribe also stops updates from the conversation, and marking as read leaves it subject to the normal three-month cleanup.","ref":"https://docs.github.com/en/account-and-profile/managing-subscriptions-and-notifications-on-github/viewing-and-triaging-notifications/managing-notifications-from-your-inbox"},{"id":"3.1.4-01","obj":"3.1.4","difficulty":"easy","type":"single","stem":"Tailspin Toys has HTML, CSS, and JavaScript files for a product landing page in Repo1. The company wants to publish them as a website directly from the repository without running its own server.\n\nWhich GitHub feature should you use?","choices":["A wiki","GitHub Pages","A gist","GitHub Projects"],"answer":[1],"explanation":"GitHub Pages is a static site hosting service that publishes a website from HTML, CSS, and JavaScript files in a repository. A wiki and a gist share written content or snippets, and GitHub Projects plans and tracks work, so none of them hosts a website.","ref":"https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages"},{"id":"3.1.4-02","obj":"3.1.4","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. wants long-form documentation for Repo1, such as design notes and usage guides across several pages, kept in the documentation area of the repository. By default only users with write access should edit the pages, and the team does not want to run a site build or choose a publishing source.\n\nWhich feature should the team use?","choices":["GitHub Pages","A gist","The repository wiki","The README file"],"answer":[2],"explanation":"A wiki is the documentation area of a repository for long-form content, with several pages edited on GitHub and write access required by default. GitHub Pages needs a publishing source and can involve a build, a gist is not tied to a repository, and a README gives only a short project overview.","ref":"https://docs.github.com/en/communities/documenting-your-project-with-wikis/about-wikis"},{"id":"3.1.4-03","obj":"3.1.4","difficulty":"hard","type":"single","stem":"Litware, Inc. wants to share a 30-line configuration example with a partner who has no access to the Litware organization. The example contains no credentials. It must not appear in public listings or search results, must be viewable by anyone who receives the link, and must keep a revision history.\n\nWhat should you create?","choices":["A public gist","A page in the wiki of a private repository","A secret gist","A file in a private repository"],"answer":[2],"explanation":"A secret gist is a Git repository with revision history that is hidden from Discover and search but viewable by anyone who has the URL. A public gist would be listed and searchable, and the wiki page or file in a private repository would not be viewable by a partner without access.","ref":"https://docs.github.com/en/get-started/writing-on-github/editing-and-sharing-content-with-gists/creating-gists"},{"id":"4.1.1-01","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. maintains a repository on GitHub. The team wants a GitHub Actions workflow to start automatically whenever a pull request is opened against the main branch.\n\nWhich workflow component should you configure to define this trigger?","choices":["Job","Event","Step","Runner"],"answer":[1],"explanation":"An event is the repository activity, such as a pull request being opened, that triggers a workflow run. A job is a set of steps that runs on the same runner, a step is a single script or action inside a job, and a runner is the server that executes a job. None of those three decides when a workflow starts.","ref":"https://docs.github.com/en/actions/get-started/understand-github-actions"},{"id":"4.1.1-02","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Adatum Corporation builds firmware for a test device that needs an operating system and hardware that GitHub-hosted runners do not provide. The build must still run as a job in a GitHub Actions workflow in the Adatum repository.\n\nWhich runner type should you use?","choices":["GitHub-hosted Ubuntu runner","Larger GitHub-hosted runner","GitHub-hosted macOS runner","Self-hosted runner"],"answer":[3],"explanation":"Self-hosted runners are the option for operating systems or specific hardware that GitHub-hosted runners do not offer. GitHub-hosted Ubuntu, Windows and macOS runners, and larger runners with bigger configurations, are all provisioned by GitHub and would be right only when the standard images and hardware meet the need.","ref":"https://docs.github.com/en/actions/get-started/understand-github-actions"},{"id":"4.1.1-03","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"Fabrikam, Inc. has a GitHub Actions workflow with a test job. The team must run that job against three runtime versions on both Linux and Windows without copying the job definition six times. A separate publish job must start only after the test runs succeed.\n\nWhich two features should you use? Each correct answer presents part of the solution.","choices":["A matrix on the test job","A dependency of the publish job on the test job","A schedule event on the workflow","A self-hosted runner for the publish job","A reusable action from GitHub Marketplace for the publish job"],"answer":[0,1],"explanation":"A matrix runs one job definition multiple times with different variable combinations, which removes the duplication. Jobs run in parallel by default, so the publish job needs a dependency on the test job to wait for it. A schedule event, a self-hosted runner and a Marketplace action do not address either the duplication or the ordering stated in the scenario.","ref":"https://docs.github.com/en/actions/get-started/understand-github-actions"},{"id":"4.1.2-01","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Woodgrove Bank developers use GitHub Copilot in their IDE. A developer wants to describe a high-level goal in natural language and have Copilot choose the files to change, edit them, run terminal commands and keep iterating on build or test failures until the goal is met.\n\nWhich Copilot capability should the developer use?","choices":["Inline suggestions","Agent mode","Ask mode in Copilot Chat","Copilot code review"],"answer":[1],"explanation":"Agent mode in a supported IDE takes a high-level task, decides which files to change, makes the edits, runs commands and iterates until the goal is reached. Ask mode answers a question and stops after a single response, inline suggestions only propose code as you type, and code review evaluates pull requests rather than carrying out a task.","ref":"https://learn.microsoft.com/visualstudio/ide/copilot-agent-mode?view=visualstudio"},{"id":"4.1.2-02","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Tailspin Toys developers use Copilot Chat in their IDE. A developer finds that the current model gives shallow answers to architecture questions and wants to try a different available model in the same conversation. Inline suggestions must keep using their current model.\n\nWhat should the developer do?","choices":["Select another model in the model dropdown of the chat view","Change the model setting for inline suggestions","Add repository custom instructions for Copilot","Delegate the question to the Copilot cloud agent"],"answer":[0],"explanation":"Copilot supports multiple models, and you switch the chat model from the model dropdown in the chat view; later prompts in the chat use the new model. The chat model is separate from the inline suggestions model, so changing it leaves inline suggestions alone. Custom instructions shape responses but do not change the model, and the cloud agent is for delegated tasks.","ref":"https://docs.github.com/en/copilot/how-tos/use-ai-models/change-the-chat-model"},{"id":"4.1.2-03","obj":"4.1.2","difficulty":"hard","type":"single","stem":"Northwind Traders wants Copilot to handle small, well-scoped tasks. A developer must delegate a task, then continue other work without keeping a local session running, and review the result later as a branch with a pull request.\n\nWhich Copilot capability should the developer use?","choices":["Agent mode in the IDE","Copilot CLI in the terminal","Copilot cloud agent","Copilot code review"],"answer":[2],"explanation":"The Copilot cloud agent works asynchronously in a cloud environment after you delegate a task, then delivers its changes on a branch and opens a pull request. Agent mode in the IDE and Copilot CLI are interactive tools that run in your local or sandboxed environment while you guide them, and code review comments on existing pull requests.","ref":"https://docs.github.com/en/copilot/concepts/agent-capabilities/about-agents/about-github-copilot-agents"},{"id":"4.1.3-01","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Lucerne Publishing is an organization on the GitHub Team plan. Organization owners want to assign Copilot seats to members and manage Copilot policies for them centrally.\n\nWhich Copilot plan should Lucerne Publishing choose?","choices":["Copilot Pro","Copilot Free","Copilot Business","Copilot Enterprise"],"answer":[2],"explanation":"Copilot Business is for organizations that want centralized management and policy control over their members, and owners of organizations on GitHub Free or Team can set it up. Copilot Pro and Free are individual plans, and Copilot Enterprise is for enterprises that use GitHub Enterprise Cloud.","ref":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"4.1.3-02","obj":"4.1.3","difficulty":"medium","type":"single","stem":"A freelance developer has a personal GitHub account and does not belong to any organization or enterprise. The developer wants a paid Copilot subscription with access to a selection of models and a monthly allowance of AI credits.\n\nWhich Copilot plan should the developer choose?","choices":["Copilot Business","Copilot Pro","Copilot Enterprise","Copilot Free"],"answer":[1],"explanation":"Copilot Pro is an individual plan for developers who want more flexibility with models and a monthly allowance of AI credits. Business and Enterprise are assigned through an organization or enterprise, which this developer does not have, and Copilot Free offers only limited access to features.","ref":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"4.1.3-03","obj":"4.1.3","difficulty":"hard","type":"single","stem":"Proseware, Inc. uses GitHub Enterprise Cloud with several organizations. Most developers have Copilot Business seats. A group of platform engineers needs a plan that is assigned and managed through the company account, includes everything in the plan the other developers have, and adds a larger monthly AI credit pool and further advanced capabilities.\n\nWhich Copilot plan should you assign to the platform engineers?","choices":["Copilot Pro+","Copilot Business","Copilot Pro","Copilot Enterprise"],"answer":[3],"explanation":"Copilot Enterprise is for enterprises on GitHub Enterprise Cloud and includes all Business features plus a larger AI credit pool and additional enterprise-grade capabilities. Copilot Business is the plan the other developers already have, and Pro and Pro+ are individual plans that are not managed centrally by the company.","ref":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"4.1.4-01","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Relecloud wants every contributor who creates a codespace for the Relecloud web app repository to get the same runtime, tools and VS Code extensions automatically. The configuration must be stored in the repository and apply to everyone.\n\nWhat should you add to the repository?","choices":["A devcontainer.json file in the .devcontainer folder","A dotfiles repository for each contributor","A Codespaces prebuild configuration","A Settings Sync profile for the team"],"answer":[0],"explanation":"A dev container configuration, usually .devcontainer/devcontainer.json, defines the image, features, extensions and settings that every codespace for the repository uses. Dotfiles and Settings Sync personalize individual accounts, and a prebuild only speeds up creating codespaces from an existing dev container configuration.","ref":"https://docs.github.com/en/codespaces/setting-up-your-project-for-codespaces/adding-a-dev-container-configuration/introduction-to-dev-containers"},{"id":"4.1.4-02","obj":"4.1.4","difficulty":"hard","type":"multi","stem":"Litware, Inc. developers create codespaces for a large repository. Creating a new codespace takes about six minutes because dependencies are installed each time. Individual developers also want their own shell aliases available in every codespace they create, without affecting teammates.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Configure a prebuild for the branch and dev container configuration","Have each developer select a dotfiles repository in personal Codespaces settings","Add the shell aliases to the devcontainer.json file in the repository","Increase the default idle timeout in each developer's personal settings","Move the team to the github.dev editor"],"answer":[0,1],"explanation":"A prebuild assembles the code, extensions and dependencies ahead of time for a branch and dev container configuration, so new codespaces start faster. A personal dotfiles repository applies each developer's shell setup to the codespaces they create. Putting aliases in devcontainer.json would affect every teammate, and neither the idle timeout nor github.dev, which has no compute, reduces creation time.","ref":"https://docs.github.com/en/codespaces/prebuilding-your-codespaces/about-github-codespaces-prebuilds"},{"id":"4.1.5-01","obj":"4.1.5","difficulty":"easy","type":"single","stem":"A contributor at Adatum Corporation wants to fix a typo in a README file from a browser on a shared computer. No code must be built or run. The editor should open immediately, without cloning the repository or provisioning a virtual machine.\n\nWhich tool should the contributor use?","choices":["GitHub Codespaces","GitHub Desktop","The github.dev editor","GitHub CLI"],"answer":[2],"explanation":"The github.dev editor is a lightweight, browser-based VS Code that opens immediately, lets you edit files and commit changes without cloning, and has no compute behind it. Codespaces provisions a virtual machine, and GitHub Desktop and GitHub CLI are local tools that need a clone.","ref":"https://docs.github.com/en/codespaces/the-githubdev-web-based-editor"},{"id":"4.1.5-02","obj":"4.1.5","difficulty":"hard","type":"single","stem":"A reviewer at Fabrikam, Inc. starts by browsing a pull request in the github.dev editor. The reviewer then needs to run the project integration tests from an integrated terminal against that branch, without installing any local tooling.\n\nWhat should the reviewer do?","choices":["Install a web extension in github.dev to add a terminal","Open the pull request branch in a codespace","Turn on Settings Sync in github.dev to enable a terminal","Open the pull request branch in GitHub Desktop"],"answer":[1],"explanation":"github.dev has no associated compute, so it cannot build, run or debug code or offer an integrated terminal, and its web extensions or Settings Sync do not change that. A codespace is a cloud-hosted development environment with a terminal for running and debugging. GitHub Desktop would need local tooling, which the scenario rules out.","ref":"https://docs.github.com/en/codespaces/the-githubdev-web-based-editor"},{"id":"5.1.1-01","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Margie's Travel tracks work in a GitHub project. The team wants to see items arranged in columns by their Status value and move an item to another column by dragging it.\n\nWhich project feature should the team use?","choices":["Table layout","Roadmap layout","Board layout","Insights chart"],"answer":[2],"explanation":"The Board layout is a kanban-style view whose columns come from a Status or other single select field, and dragging an item to another column updates its field value. The Table layout is a dense spreadsheet-like view, the Roadmap layout is a timeline, and an Insights chart only reports on items.","ref":"https://docs.github.com/en/issues/planning-and-tracking-with-projects/customizing-views-in-your-project/changing-the-layout-of-a-view"},{"id":"5.1.1-02","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Coho Winery created a GitHub project with a view that uses the Roadmap layout. The project contains many issues, but none of them appear on the timeline. The project has no date or iteration fields.\n\nWhat should you do first so the issues appear on the roadmap?","choices":["Group the items by Status in the Roadmap layout","Switch the view to the Board layout","Enable the auto-add workflow for the repository","Add a date or iteration field and set values on the items"],"answer":[3],"explanation":"The Roadmap layout places items on a timeline by their date or iteration fields, so items without those values do not appear. Grouping or switching layouts does not give items a position in time, and auto-add only brings more items into the project.","ref":"https://docs.github.com/en/issues/planning-and-tracking-with-projects/customizing-views-in-your-project/changing-the-layout-of-a-view"},{"id":"5.1.2-01","obj":"5.1.2","difficulty":"medium","type":"single","stem":"Trey Research uses a GitHub project for planning. The team wants every new issue labeled bug in one repository to be added to the project automatically, without anyone adding it by hand.\n\nWhat should you configure?","choices":["The Item added to project workflow","The Auto-archive workflow","The Auto-add to project workflow","The Item closed workflow"],"answer":[2],"explanation":"The Auto-add to project workflow adds items from a repository that match a filter, such as a label, so no manual step is needed. Item added to project sets a field after an item is already in the project, Auto-archive removes items that meet criteria from view, and Item closed updates Status when an issue is closed.","ref":"https://docs.github.com/en/issues/planning-and-tracking-with-projects/automating-your-project/using-the-built-in-automations"},{"id":"5.1.2-02","obj":"5.1.2","difficulty":"hard","type":"multi","stem":"Wingtip Toys is preparing release 2.0 of a product. The team must group the related issues and pull requests in one repository, show a due date and the percentage of completed work for that release, and mark certain issues as suitable for first-time contributors.\n\nWhich two features should you use? Each correct answer presents part of the solution.","choices":["A milestone for the release","A label such as good first issue","An assignee on each issue","A saved reply for contributors","An issue template for bug reports"],"answer":[0,1],"explanation":"A milestone tracks progress on a group of issues and pull requests in a repository and shows a due date and completion percentage. A label such as good first issue marks suitable issues for new contributors. Assignees, saved replies and issue templates are useful in other ways but do not provide release progress or the first-time contributor marker.","ref":"https://docs.github.com/en/issues/using-labels-and-milestones-to-track-work/about-milestones"},{"id":"5.1.3-01","obj":"5.1.3","difficulty":"easy","type":"single","stem":"A maintainer at Fabrikam, Inc. keeps typing the same response to contributors who report duplicate issues across several repositories. The maintainer wants to insert that text with a few clicks when commenting.\n\nWhat should the maintainer use?","choices":["Issue templates","Saved replies","Labels","Assignees"],"answer":[1],"explanation":"Saved replies are reusable responses tied to your personal account that you can insert into comments in issues, pull requests and discussions, across repositories and organizations. Issue templates are defined per repository to structure new reports, labels categorize items, and assignees identify who is responsible.","ref":"https://docs.github.com/en/get-started/writing-on-github/working-with-saved-replies/about-saved-replies"},{"id":"5.1.3-02","obj":"5.1.3","difficulty":"medium","type":"single","stem":"Woodgrove Bank tracks a production incident as a GitHub issue. Two engineers with write access share responsibility for fixing it, and both must be clearly identified as owners of the issue.\n\nWhat should you do?","choices":["Add both engineers as pull request reviewers","Apply a label named after each engineer","Set the milestone to the incident","Add both engineers as assignees"],"answer":[3],"explanation":"Assignees show who is responsible for an issue, and an issue can have more than one assignee, including anyone with write access. Reviewers apply to pull requests, labels only categorize, and a milestone groups work toward a goal rather than naming owners.","ref":"h
