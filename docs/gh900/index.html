ttps://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/assigning-issues-and-pull-requests-to-other-github-users"},{"id":"5.1.4-01","obj":"5.1.4","difficulty":"easy","type":"single","stem":"Northwind Traders manages a GitHub project and wants a chart that shows how many items are currently assigned to each person. The chart must be visible to anyone who can view the project.\n\nWhich project feature should the team use?","choices":["Roadmap layout","Draft issues","Project insights","Built-in workflows"],"answer":[2],"explanation":"Insights for projects lets you build charts from project items, and a current chart can show how many items are assigned to each person; anyone who can view the project can see them. The Roadmap layout shows a timeline, draft issues are items, and built-in workflows automate field changes.","ref":"https://docs.github.com/en/issues/planning-and-tracking-with-projects/viewing-insights-from-your-project/about-insights-for-projects"},{"id":"5.1.4-02","obj":"5.1.4","difficulty":"hard","type":"single","stem":"Contoso, Ltd. leaders ask whether a team is finishing work at a healthy pace. They need to see, over several weeks, how many issues were opened, completed or not planned, so the team can spot bottlenecks.\n\nWhat should the team use in the project?","choices":["A current chart that groups items by assignee","The milestone completion percentage","A Roadmap layout with iteration markers","A historical chart with the X-axis set to Time"],"answer":[3],"explanation":"A historical chart in project insights, created by setting the X-axis to Time, shows how item states change over time; the default burn up chart tracks open, completed and not planned issues. A current chart is a snapshot of today, a milestone percentage is a single number, and the Roadmap layout plans future dates instead of reporting progress.","ref":"https://docs.github.com/en/issues/planning-and-tracking-with-projects/viewing-insights-from-your-project/about-insights-for-projects"},{"id":"6.1.1-01","obj":"6.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. employees protect their GitHub accounts with two-factor authentication (2FA). User1 wants to use a mobile app that shows a code that changes every 30 seconds and that is typed in after the password.\n\nWhich second factor should User1 set up?","choices":["SMS text message","Security key","Authenticator app (TOTP)","GitHub Mobile push approval"],"answer":[2],"explanation":"An authenticator app generates time-based one-time passwords (TOTP) that rotate every 30 seconds and are typed in after the password. SMS delivers a code by text message instead of from an app, a security key is a hardware device that is tapped rather than typed, and GitHub Mobile approves a sign-in with a push notification. Each of those would be right if the stem asked for a text message, a hardware token or a push approval.","ref":"https://docs.github.com/en/authentication/securing-your-account-with-two-factor-authentication-2fa/configuring-two-factor-authentication"},{"id":"6.1.1-02","obj":"6.1.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. requires 2FA for all developers. User2 configured only an authenticator app on a phone and downloaded the recovery codes during setup. The phone is now lost. User2 has no security key, no passkey and never enabled SMS.\n\nWhich method should User2 use to sign in to GitHub?","choices":["A security key","An SMS text message code","GitHub Mobile push approval","A saved recovery code"],"answer":[3],"explanation":"Recovery codes exist for exactly this case: they let a user back into the account when the authenticator app or phone is lost. A security key and SMS were never set up, and GitHub Mobile would run on the lost phone, so none of those can complete the sign-in. They would help only if they had been registered beforehand and were still available.","ref":"https://docs.github.com/en/authentication/securing-your-account-with-two-factor-authentication-2fa/configuring-two-factor-authentication"},{"id":"6.1.1-03","obj":"6.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank wants developers to sign in to github.com without typing a password. The sign-in must satisfy both the password and the second factor in one step, must resist phishing sites that imitate github.com, and must use the face or fingerprint recognition already available on company laptops.\n\nWhich sign-in method should the developers register?","choices":["A passkey","An authenticator app","SMS text message codes","GitHub Mobile approvals"],"answer":[0],"explanation":"A passkey is a public and private key pair bound to the github.com domain, confirmed with a biometric or PIN, so it works without a password, covers password and 2FA in one step, and is highly phishing-resistant. An authenticator app and SMS still need a password and a typed code that can be captured by a lookalike site, and GitHub Mobile is a second factor that is added to the password rather than replacing it.","ref":"https://docs.github.com/en/authentication/authenticating-with-a-passkey/about-passkeys"},{"id":"6.1.2-01","obj":"6.1.2","difficulty":"easy","type":"single","stem":"Tailspin Toys uses a GitHub organization. User1 is a community volunteer who must label, assign and close issues and pull requests, and moderate discussions, but must not push code to the repository.\n\nWhich repository role should you assign to User1?","choices":["Read","Triage","Write","Maintain"],"answer":[1],"explanation":"Triage is intended for contributors who proactively manage issues, discussions and pull requests without write access. Read only allows viewing and discussing, Write allows pushing code, which the stem rules out, and Maintain adds repository management that the volunteer does not need.","ref":"https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/repository-roles-for-an-organization"},{"id":"6.1.2-02","obj":"6.1.2","difficulty":"medium","type":"single","stem":"Relecloud has a GitHub organization. A consultant from an external agency must push to one private repository for three months, must not see the other private repositories, and must not become an organization member.\n\nWhich access type should you use for the consultant?","choices":["Organization member added to a team with the Write role","Organization member with the Maintain role on the repository","Outside collaborator with the Write role on the repository","Security manager for the organization"],"answer":[2],"explanation":"An outside collaborator is a person who is not an organization member but has access to one or more specific repositories, which matches a temporary consultant limited to a single repository. The two member options make the consultant an organization member, which the stem forbids, and the Security manager role is an organization role that grants read access to all repositories.","ref":"https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-outside-collaborators/adding-outside-collaborators-to-repositories-in-your-organization"},{"id":"6.1.2-03","obj":"6.1.2","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. assigns a repository role to User3, a project manager. User3 must run the repository day to day, including managing issues, pull requests and general repository settings, but must not have access to sensitive or destructive actions such as deleting the repository or managing security settings.\n\nWhich repository role should you assign to User3?","choices":["Write","Admin","Triage","Maintain"],"answer":[3],"explanation":"Maintain is recommended for project managers who need to manage the repository without access to sensitive or destructive actions. Admin gives full access, including security settings and deletion, so it breaks the constraint. Write fits contributors who push code, and Triage covers issues and pull requests only, so neither lets User3 manage the repository.","ref":"https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/repository-roles-for-an-organization"},{"id":"6.1.3-01","obj":"6.1.3","difficulty":"easy","type":"single","stem":"Litware, Inc. uses an external identity provider (IdP). Litware wants the IdP to create, update and remove every developer account on GitHub and to control the usernames and profile data of those accounts.\n\nWhich account model should Litware choose for its GitHub enterprise?","choices":["Personal accounts with SAML single sign-on","Machine user accounts","Outside collaborator invitations","Enterprise Managed Users"],"answer":[3],"explanation":"With Enterprise Managed Users (EMUs), the IdP provisions and deprovisions the accounts and controls usernames and profile data. Personal accounts with SAML single sign-on are created and owned by the developers themselves, so the company controls only authentication. Machine user accounts and outside collaborator invitations are not enterprise-wide account models.","ref":"https://docs.github.com/en/enterprise-cloud@latest/admin/managing-iam/understanding-iam-for-enterprises/about-enterprise-managed-users"},{"id":"6.1.3-02","obj":"6.1.3","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. uses an identity provider for single sign-on to its GitHub enterprise. Developers must keep one personal GitHub identity that they also use to contribute to public open-source repositories and that they keep after leaving the company.\n\nWhich option should Fabrikam choose?","choices":["Enterprise Managed Users with SCIM provisioning","Personal accounts with SAML single sign-on for the organizations","Machine user accounts owned by the organization","Enterprise Managed Users with a guest collaborator role"],"answer":[1],"explanation":"Personal accounts remain owned by the developers, so the same identity can contribute to public repositories and outlive employment, while SAML single sign-on still controls access to the organizations. Managed user accounts are controlled by the IdP and cannot create public content or collaborate outside the enterprise, so both EMU options fail the constraint. Machine user accounts are not personal identities.","ref":"https://docs.github.com/en/enterprise-cloud@latest/admin/managing-iam/understanding-iam-for-enterprises/about-enterprise-managed-users"},{"id":"6.1.3-03","obj":"6.1.3","difficulty":"hard","type":"single","stem":"An enterprise owner at Tailspin Toys enforced a Copilot policy that disables models beyond the basic set for every organization in the enterprise. User1 is an owner of one organization and wants the Copilot users in that organization to use the additional models.\n\nWhich action should User1 take?","choices":["Ask an enterprise owner to change the enterprise policy","Enable the Models policy in the organization Copilot settings","Switch the organization to a different Copilot plan","Assign Copilot seats to every organization member"],"answer":[0],"explanation":"When an enterprise owner enforces a Copilot policy, organization owners cannot override it, so the enterprise policy itself must be changed. Setting the Models policy at the organization level has no effect against an enforced enterprise policy. A different plan or more seats change who is licensed, not which policies apply.","ref":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-policies"},{"id":"6.1.4-01","obj":"6.1.4","difficulty":"easy","type":"single","stem":"Northwind Traders wants to make sure that no change reaches the main branch without approval from at least one other developer. Developers must still be able to merge their work after it is approved.\n\nWhich branch protection setting should the repository administrator enable?","choices":["Require signed commits on the branch","Lock the branch to make it read-only","Require a linear history of commits","Require a pull request with approvals"],"answer":[3],"explanation":"Requiring a pull request with approvals means changes reach the protected branch only after the required number of reviewers approve them, and they can be merged afterwards. Signed commits prove commit authorship but do not require review, a locked branch blocks all new commits including approved merges, and linear history only restricts the merge method.","ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"},{"id":"6.1.4-02","obj":"6.1.4","difficulty":"medium","type":"single","stem":"Adatum Corporation owns a GitHub Enterprise Cloud enterprise that contains several organizations. A repository holds shared source code that every employee in the enterprise must be able to read, without adding people one by one, and that must not be visible outside the enterprise.\n\nWhich visibility should the repository administrator choose?","choices":["Public","Private","Private with every employee added as a collaborator","Internal"],"answer":[3],"explanation":"Internal repositories are visible to members of the enterprise that owns them and are available with GitHub Enterprise Cloud. Public exposes the code to everyone on the internet, and Private limits access to people and teams who are explicitly added. Adding every employee as a collaborator would give access, but it conflicts with the requirement not to add people one by one.","ref":"https://docs.github.com/en/repositories/creating-and-managing-repositories/about-repositories"},{"id":"6.1.4-03","obj":"6.1.4","difficulty":"hard","type":"multi","stem":"Wide World Importers protects the main branch of a repository. Every pull request must pass the automated build and test workflow before it can be merged, and the developers who own the changed files, as listed in the CODEOWNERS file, must approve the changes.\n\nWhich two branch protection settings should the administrator enable? Each correct answer presents part of the solution.","choices":["Require status checks to pass before merging","Require signed commits","Require conversation resolution before merging","Require linear history","Require review from Code Owners"],"answer":[0,4],"explanation":"Required status checks make the build and test workflow a gate for merging, and requiring review from Code Owners makes the owners listed in CODEOWNERS approve the pull request. Signed commits, conversation resolution and linear history are valid protections, but none of them enforces passing tests or approval by file owners.","ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"},{"id":"6.1.5-01","obj":"6.1.5","difficulty":"easy","type":"single","stem":"Fourth Coffee has an organization with 25 developers who all need Write access to eight repositories. Managers also want to notify all 25 developers with a single @mention.\n\nWhat should the organization owner create?","choices":["A custom repository role","A GitHub Project","A repository ruleset","A team in the organization"],"answer":[3],"explanation":"A team groups organization members, can be granted access to repositories in one step and can be notified with one @mention. A custom repository role defines permissions but not a group of people, a GitHub Project tracks work, and a ruleset enforces rules on branches or tags.","ref":"https://docs.github.com/en/organizations/organizing-members-into-teams/about-teams"},{"id":"6.1.5-02","obj":"6.1.5","difficulty":"hard","type":"multi","stem":"Wingtip Toys has a GitHub organization. User1 must manage the billing details and payment method of the organization. User2 must manage the registrations of the GitHub Apps that the organization owns. Neither user should receive organization owner permissions.\n\nWhich two organization roles should you assign? Each correct answer presents part of the solution.","choices":["Security manager","Billing manager","Moderator","Owner","GitHub App manager"],"answer":[1,4],"explanation":"The billing manager role manages payment information without broader administrative access, and the GitHub App manager role manages the registrations of GitHub Apps owned by the organization. Owner would exceed the stated limit, the Security manager role handles security alerts and settings, and the Moderator role handles blocking users and hiding comments.","ref":"https://docs.github.com/en/organizations/managing-peoples-access-to-your-organization-with-roles/roles-in-an-organization"},{"id":"7.1.1-01","obj":"7.1.1","difficulty":"easy","type":"single","stem":"Lucerne Publishing relies on an open-source library that is maintained by an individual developer. Lucerne wants to send the maintainer recurring monthly funding directly on GitHub.\n\nWhich GitHub feature should Lucerne use?","choices":["GitHub Discussions","GitHub Sponsors","GitHub Marketplace","GitHub Projects"],"answer":[1],"explanation":"GitHub Sponsors lets people and organizations financially support the developers who build and maintain open-source projects, with one-time or monthly payments. GitHub Marketplace sells tools such as apps and actions, Discussions is a community conversation space, and Projects tracks work.","ref":"https://docs.github.com/en/sponsors/getting-started-with-github-sponsors/about-github-sponsors"},{"id":"7.1.1-02","obj":"7.1.1","difficulty":"medium","type":"single","stem":"Coho Winery plans to publish an internal library as an open-source project. The library will have no commercial support or SLA, and the company does not want its upkeep to depend on one developer.\n\nWhich action should Coho Winery take to benefit from the open-source community?","choices":["Restrict write access to the original author alone","Keep roadmap and discussions in a private repository","Document how to contribute in README and CONTRIBUTING files","Switch the repository to private after the first release"],"answer":[2],"explanation":"A README and a CONTRIBUTING file explain the project and how to contribute, which helps users become contributors and maintainers so that a team of people can sustain the project. Limiting write access, hiding the roadmap and going private all cut off the community that the company wants to rely on.","ref":"https://learn.microsoft.com/training/modules/create-open-source-program-github/4-describe-benefits-open-source-community"},{"id":"7.1.2-01","obj":"7.1.2","difficulty":"medium","type":"single","stem":"Trey Research maintains a public open-source repository. The maintainers want an automated build and test run on every pull request without paying for compute minutes.\n\nWhich option should Trey Research use?","choices":["A paid continuous integration app from GitHub Marketplace","GitHub Actions workflows on larger GitHub-hosted runners","A GitHub Codespaces prebuild for each pull request","GitHub Actions workflows on standard GitHub-hosted runners"],"answer":[3],"explanation":"GitHub supports open source by making standard GitHub-hosted runners free for public repositories, so GitHub Actions workflows on them cost nothing. Larger runners are billed even for public repositories, a paid Marketplace app is an extra cost, and a Codespaces prebuild is not a pull request test pipeline.","ref":"https://docs.github.com/en/billing/concepts/product-billing/github-actions"},{"id":"7.1.2-02","obj":"7.1.2","difficulty":"hard","type":"single","stem":"VanArsdel, Ltd. maintains a public open-source library. The maintainers want GitHub to open pull requests automatically that raise a dependency to a patched version, and only when a security advisory affects that dependency.\n\nWhich feature should the maintainers enable?","choices":["The dependency graph","Dependabot alerts","Dependabot version updates","Dependabot security updates"],"answer":[3],"explanation":"Dependabot security updates act on Dependabot alerts and automatically raise a pull request that updates a vulnerable dependency to the minimum patched version. Alerts only notify about vulnerable dependencies, version updates open pull requests for any outdated dependency on a schedule, and the dependency graph only lists dependencies.","ref":"https://docs.github.com/en/code-security/concepts/supply-chain-security/dependabot-security-updates"},{"id":"7.1.3-01","obj":"7.1.3","difficulty":"easy","type":"single","stem":"A developer at Proseware, Inc. wants the public activity of a respected open-source maintainer, such as new repositories and sponsorships, to appear on the personal dashboard. The developer does not want notifications for every repository that the maintainer works on.\n\nWhich action should the developer take?","choices":["Follow the maintainer","Watch every repository of the maintainer","Star every repository of the maintainer","Sponsor the maintainer"],"answer":[0],"explanation":"Following a user shows that person's public activity on your personal dashboard. Watching repositories sends notifications for each repository, starring only bookmarks a repository, and sponsoring funds the maintainer without providing an activity feed.","ref":"https://docs.github.com/en/get-started/exploring-projects-on-github/following-people"},{"id":"7.1.4-01","obj":"7.1.4","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines wants to find a third-party code quality tool, try it free for 14 days, install it on selected organization repositories, and pay through the existing GitHub billing of the organization if the team keeps it.\n\nWhich GitHub offering should the organization owner use?","choices":["GitHub Sponsors","GitHub Enterprise Cloud","GitHub Actions workflow templates","GitHub Marketplace"],"answer":[3],"explanation":"GitHub Marketplace lists apps and actions that extend GitHub workflows, can offer free trials and paid plans, and bills paid plans to the account that installs them. Sponsors funds people and organizations that maintain open source, Enterprise Cloud is a plan rather than a tool catalog, and workflow templates give starting files without purchasing a product.","ref":"https://docs.github.com/en/apps/github-marketplace/github-marketplace-overview/about-github-marketplace-for-apps"},{"id":"7.1.5-01","obj":"7.1.5","difficulty":"easy","type":"single","stem":"Litware, Inc. has many internal teams that build proprietary services. Leaders want the teams to discover each other's code, reuse it and send pull requests to other teams, while the source stays visible only to company employees.\n\nWhich approach should Litware adopt?","choices":["A public open-source program","An InnerSource program","Closed-source development with isolated teams","Outsourced development with outside collaborators"],"answer":[1],"explanation":"InnerSource applies open-source patterns, such as visible code and contributions by pull request, to projects with a limited audience like a single company. A public open-source program would expose the code outside the company, and the other two approaches keep teams separate instead of encouraging cross-team contribution.","ref":"https://learn.microsoft.com/en-us/training/modules/manage-innersource-program-github/2-manage-innersource-program"},{"id":"7.1.5-02","obj":"7.1.5","difficulty":"hard","type":"multi","stem":"Fabrikam, Inc. runs an InnerSource program. A platform team owns a repository that other teams have never worked with. Consumer teams must be able to understand what the repository does and how to propose changes, and the code must remain visible only to Fabrikam employees.\n\nWhich two actions should the platform team take? Each correct answer presents part of the solution.","choices":["Add a README that explains the purpose and usage","Change the repository visibility to public","Grant every employee the Admin role on the repository","Create a private copy of the repository for each consumer team","Add a CONTRIBUTING file that explains how to propose changes"],"answer":[0,4],"explanation":"A README tells consumers what the project is for and how to use it, and a CONTRIBUTING file explains how to propose changes, which are the discoverability and guidance practices of a healthy InnerSource program. Public visibility breaks the employees-only rule, Admin for everyone removes the owning team control, and separate copies fragment the project instead of enabling contributions.","ref":"https://learn.microsoft.com/en-us/training/modules/manage-innersource-program-github/2-manage-innersource-program"},{"id":"7.1.6-01","obj":"7.1.6","difficulty":"medium","type":"single","stem":"Alpine Ski House wants a standard starting point for new microservice repositories, with the same folders, workflow files and issue templates. Each new repository must begin with a single commit and must not carry the commit history of the starting repository.\n\nWhich feature should the team use?","choices":["A fork of the repository","A template repository","A new branch in the repository","A repository topic"],"answer":[1],"explanation":"A repository created from a template copies the structure and files and starts with a single commit, which suits new projects. A fork keeps the full history and stays linked to the upstream repository for contributing changes back, a branch stays inside the same repository, and a topic only makes a repository easier to find.","ref":"https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-repository-from-a-template"}],"cases":{}};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives, CASES = DATA.cases || {};
// per-exam storage prefix ("ai500" for AI-500), so several exams on one site keep separate progress
const KEY = DATA.exam.id.toLowerCase().replace(/[^a-z0-9]/g, "");
const $app = document.getElementById("app");
const $$ = s => [...$app.querySelectorAll(s)];

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get(KEY + ".history", {}); // id -> true/false (last result fully correct)

const theme = store.get(KEY + ".theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set(KEY + ".theme", next);
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => p.split("\n").every(l => l.startsWith("- "))
      ? `<ul>${p.split("\n").map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`
      : "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const why = s => s ? `<div class="why">${inline(s)}</div>` : "";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dom = q => q.obj.split(".")[0];
const isStd = q => !q.case && !q.series;
const SERIES_NOTE = "This question is one of a series that share the same scenario. Each question in the series offers a different solution that might or might not meet the goal. A series can have more than one correct solution, or none. After you answer a question in this series, you cannot return to it, and it does not appear on the review screen.";
const HOW = {
  multi: q => `Choose ${q.answer.length}`, order: q => `Arrange ${q.answer.length} in order`,
  yesno: () => "Yes / No for each statement", dragdrop: () => "Drag and drop", dropdown: () => "Select from each list",
};

// ---------- answers ----------
function blank(q) {
  if (q.type === "yesno") return q.choices.map(() => null);
  if (q.type === "dragdrop" || q.type === "dropdown") return q.targets.map(() => null);
  return [];
}
function complete(q, p) {
  if (q.type === "single") return p.length === 1;
  if (q.type === "multi" || q.type === "order") return p.length === q.answer.length;
  return p.every(v => v !== null);
}
const answered = it => it.picked.some(v => v !== null);
// Partial credit per box/statement/selection, like the real exam; build lists are all-or-nothing.
function grade(q, p) {
  if (q.type === "single") return +(p[0] === q.answer[0]);
  if (q.type === "multi") return p.filter(x => q.answer.includes(x)).length / q.answer.length;
  if (q.type === "order") return +(p.length === q.answer.length && p.every((x, i) => x === q.answer[i]));
  if (q.type === "yesno") return p.filter((v, i) => v === q.answer.includes(i)).length / p.length;
  return p.filter((v, i) => v === q.answer[i]).length / p.length; // dragdrop, dropdown
}
const item = q => ({ q, order: !q.choices ? [] : q.series ? [0, 1] : shuffle(q.choices.map((_, i) => i)), picked: blank(q), checked: false, locked: false, mark: false });

// ---------- home ----------
let S = null, tick = null;
window.onbeforeunload = () => (S && S.mode === "exam" && !S.done ? true : undefined);

function home() {
  clearInterval(tick); S = null;
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all", ...store.get(KEY + ".cfg", {}) };
  const types = Object.entries(Q.reduce((a, q) => (a[q.case ? "case" : q.series ? "series" : q.type] = (a[q.case ? "case" : q.series ? "series" : q.type] || 0) + 1, a), {}));
  $app.innerHTML = `
  <div class="card">
    <h2>New session</h2>
    <fieldset><legend>Mode</legend><select id="mode">
      <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Practice (instant feedback)</option>
      <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Exam (feedback at the end)</option>
      <option value="sim" ${cfg.mode === "sim" ? "selected" : ""}>Exam simulation (50 questions, 100 minutes)</option>
    </select>
    <p class="muted" id="simnote">Exam simulation ignores the filters below: questions are weighted by the study-guide domain percentages and include a problem-solution series and a case study in their own sections. No objective or difficulty hints, a countdown timer, mark for review, and a review screen per section. Once you leave a section you cannot return to it.</p>
    </fieldset>
    <div id="filters">
    <fieldset><legend>Domains</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} questions)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Difficulty</legend><div class="row">
      ${[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Question pool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> All</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Not seen yet</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Previously wrong (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Questions</legend><select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></fieldset>
    </div>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Progress on this device</h2>
    <p>${seen} of ${Q.length} questions answered, ${seen - wrong} last correct, ${wrong} last wrong.</p>
    ${statsTable()}
    <p class="muted">Question types: ${types.map(([t, n]) => `${t} ${n}`).join(", ")}.</p>
    <div class="actions"><button class="ghost" id="reset" type="button">Reset progress</button></div>
  </div>`;
  const mode = document.getElementById("mode"), sync = () => {
    document.getElementById("filters").hidden = mode.value === "sim";
    document.getElementById("simnote").hidden = mode.value !== "sim";
  };
  mode.onchange = sync; sync();
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all progress?")) { history = {}; store.set(KEY + ".history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domain</th><th>Done</th><th>Correct</th></tr>${rows}</table>`;
}

// keep case-study and series questions together, in id order, at the position of their first member
function grouped(qs) {
  const g = new Map();
  qs.forEach(q => { const k = q.case || q.series || q.id; if (!g.has(k)) g.set(k, []); g.get(k).push(q); });
  return [...g.values()].flatMap(xs => xs.sort((a, b) => a.id.localeCompare(b.id)));
}

function simSections() {
  const caseIds = [...new Set(Q.filter(q => q.case).map(q => q.case))];
  const seriesIds = [...new Set(Q.filter(q => q.series).map(q => q.series))];
  const cs = caseIds.length ? grouped(Q.filter(q => q.case === pick(caseIds))) : [];
  const sr = seriesIds.length ? grouped(Q.filter(q => q.series === pick(seriesIds))) : [];
  const n = 50 - cs.length - sr.length;
  // domain share = midpoint of the study-guide weight range, largest remainder rounding
  const w = Object.entries(DOMAINS).map(([k, d]) => { const [a, b] = d.weight.match(/\d+/g).map(Number); return [k, (a + (b ?? a)) / 2]; });
  const tot = w.reduce((s, [, x]) => s + x, 0);
  const cnt = w.map(([k, x]) => ({ k, c: Math.floor(n * x / tot), r: (n * x / tot) % 1 }));
  [...cnt].sort((a, b) => b.r - a.r).slice(0, n - cnt.reduce((s, x) => s + x.c, 0)).forEach(x => x.c++);
  const std = shuffle(cnt.flatMap(({ k, c }) => shuffle(Q.filter(q => isStd(q) && dom(q) === k)).slice(0, c)));
  return [["std", std], ["series", sr], ["case", cs]].filter(([, xs]) => xs.length);
}

function start() {
  const mode = document.getElementById("mode").value;
  let secs;
  if (mode === "sim") {
    store.set(KEY + ".cfg", { ...store.get(KEY + ".cfg", {}), mode });
    secs = simSections();
  } else {
    const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
    const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode };
    store.set(KEY + ".cfg", cfg);
    let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
    if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
    if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
    if (!pool.length) { document.getElementById("msg").textContent = "No questions match this selection."; return; }
    secs = [["std", grouped(shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n))]];
  }
  const items = [], sections = [];
  secs.forEach(([kind, qs]) => { sections.push({ kind, start: items.length, end: items.length + qs.length }); items.push(...qs.map(item)); });
  S = { mode: mode === "practice" ? "practice" : "exam", sim: mode === "sim", items, secs: sections, sec: 0, i: 0, tab: 0, sel: null, t0: Date.now() };
  if (S.sim) {
    S.deadline = Date.now() + 100 * 60000;
    tick = setInterval(() => {
      const left = S.deadline - Date.now(), el = document.getElementById("clock");
      if (left <= 0) { alert("Time is up. Your exam is submitted."); return finish(); }
      if (el) el.textContent = clock(left);
    }, 1000);
    return intro();
  }
  show();
}
const clock = ms => { const s = Math.ceil(ms / 1000); return `Time left ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const clockChip = () => S.deadline ? `<span class="chip clock" id="clock">${clock(S.deadline - Date.now())}</span>` : "";

function intro() {
  const sec = S.secs[S.sec], n = sec.end - sec.start;
  const text = {
    std: `This section contains ${n} questions. You can move back and forth, mark questions for review, and change your answers until you finish the section. When you finish it, you cannot return to it.`,
    series: `This section contains a problem-solution series of ${n} questions. ${SERIES_NOTE}`,
    case: `This section contains a case study with ${n} questions. Each question uses the same scenario; use the tabs to read the parts of the case study. You can move between the questions of this case study until you finish the section.`,
  }[sec.kind];
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Section ${S.sec + 1} of ${S.secs.length}</span>${clockChip()}</div>
    <h2>${{ std: "Questions", series: "Problem-solution series", case: "Case study" }[sec.kind]}</h2>
    <p>${esc(text)}</p>
    ${S.sec === 0 ? `<p class="muted">${S.items.length} questions in total, 100 minutes. Passing score: 700 on a scale of 1 to 1000.</p>` : ""}
    <div class="actions"><button id="go" type="button">Start section</button></div></div>`;
  document.getElementById("go").onclick = () => { S.i = sec.start; S.tab = 0; show(); };
}

// ---------- question ----------
function casePanel(id) {
  const c = CASES[id]; if (!c) return "";
  const t = Math.min(S.tab, c.sections.length - 1);
  return `<details class="case" ${S.caseClosed ? "" : "open"}><summary><strong>Case study: ${esc(c.title)}</strong></summary>
    <div class="tabs">${c.sections.map(([h], k) => `<button type="button" class="ghost sm" data-tab="${k}" aria-pressed="${k === t}">${esc(h)}</button>`).join("")}</div>
    <div class="case-body">${md(c.sections[t][1])}</div></details>`;
}

function sel(it, i, lock, reveal) {
  const q = it.q, t = q.targets[i], p = it.picked;
  const cls = reveal ? (p[i] === q.answer[i] ? "correct" : "wrong") : "";
  return `<select data-t="${i}" class="${cls}" ${lock ? "disabled" : ""} aria-label="Box ${i + 1}"><option value="">Select...</option>${t.options.map((o, k) => `<option value="${k}" ${p[i] === k ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

function stemHTML(it, lock, reveal) {
  const h = md(it.q.stem);
  return it.q.type === "dropdown" ? h.replace(/\[\[(\d+)\]\]/g, (_, n) => sel(it, n - 1, lock, reveal)) : h;
}

function answerHTML(it, lock, reveal) {
  const q = it.q, p = it.picked, dis = lock ? "disabled" : "", drag = !lock;
  switch (q.type) {
    case "single": case "multi": {
      const multi = q.type === "multi";
      return `<div>${it.order.map(ci => {
        const cls = reveal ? (q.answer.includes(ci) ? "correct" : p.includes(ci) ? "wrong" : "") : "";
        return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" data-c="${ci}" ${dis} ${p.includes(ci) ? "checked" : ""}>
          <span>${inline(q.choices[ci])}${reveal ? why(q.rationale[ci]) : ""}</span></label>`;
      }).join("")}</div>`;
    }
    case "yesno":
      return `<table class="yn"><tr><th>Statement</th><th>Yes</th><th>No</th></tr>${q.choices.map((s, i) => {
        const cls = reveal ? (p[i] === q.answer.includes(i) ? "correct" : "wrong") : "";
        return `<tr class="${cls}"><td>${inline(s)}${reveal ? why(q.rationale[i]) : ""}</td>${[1, 0].map(v => `<td><input type="radio" name="yn${i}" data-i="${i}" data-v="${v}" aria-label="${v ? "Yes" : "No"}: statement ${i + 1}" ${dis} ${p[i] === !!v ? "checked" : ""}></td>`).join("")}</tr>`;
      }).join("")}</table>`;
    case "order": {
      const tile = (ci, k) => {
        const cls = reveal ? (q.answer[k] === ci ? "correct" : "wrong") : "";
        return `<div class="tile ${cls}" draggable="${drag}" data-c="${ci}" ${k === undefined && !lock ? `tabindex="0" role="button"` : ""}>
          ${k === undefined ? "" : `<span class="num">${k + 1}.</span>`}<span class="txt">${inline(q.choices[ci])}</span>
          ${k === undefined || lock ? "" : `<span class="tools"><button type="button" class="ghost sm" data-up="${k}" aria-label="Move up">&uarr;</button><button type="button" class="ghost sm" data-down="${k}" aria-label="Move down">&darr;</button><button type="button" class="ghost sm" data-rm="${k}" aria-label="Remove">&times;</button></span>`}</div>`;
      };
      return `<div class="dd">
        <div><div class="lbl">Actions</div><div class="zone pool" data-zone="pool">${it.order.filter(ci => !p.includes(ci)).map(ci => tile(ci)).join("")}</div></div>
        <div><div class="lbl">Answer area</div><div class="zone area" data-zone="area">${p.map((ci, k) => tile(ci, k)).join("")}</div></div></div>
        ${lock ? "" : `<p class="muted">Click or drag an action into the answer area, then use the arrows to put it in order.</p>`}
        ${reveal ? `<div class="lbl">Correct sequence</div><ol>${q.answer.map(ci => `<li>${inline(q.choices[ci])}${why(q.rationale[ci])}</li>`).join("")}</ol>
          <div class="lbl">Not part of the sequence</div><ul>${q.choices.map((c, ci) => q.answer.includes(ci) ? "" : `<li>${inline(c)}${why(q.rationale[ci])}</li>`).join("")}</ul>` : ""}`;
    }
    case "dragdrop":
      return `<div class="lbl">Values</div><div class="zone pool flat">${it.order.map(ci => `<div class="tile ${S.sel === ci ? "sel" : ""}" draggable="${drag}" data-c="${ci}" ${lock ? "" : `tabindex="0" role="button"`}><span class="txt">${inline(q.choices[ci])}</span></div>`).join("")}</div>
        <div class="lbl">Answer area</div><table>${q.targets.map((t, i) => {
          const ok = p[i] === q.answer[i], cls = reveal ? (ok ? "correct" : "wrong") : "";
          return `<tr><td>${inline(t)}</td><td><div class="slot ${cls}" data-t="${i}" ${lock ? "" : `tabindex="0" role="button"`}>${p[i] === null ? `<span class="muted">${lock ? "(empty)" : "Click a value, then click here"}</span>` : inline(q.choices[p[i]])}</div>
            ${reveal ? why((ok ? "" : `Answer: ${q.choices[q.answer[i]]}. `) + q.rationale[i]) : ""}</td></tr>`;
        }).join("")}</table>
        ${lock ? "" : `<p class="muted">Each value may be used once, more than once, or not at all.</p>`}
        ${reveal ? `<div class="lbl">About each value</div><ul>${q.choices.map((c, ci) => `<li><strong>${inline(c)}</strong>${why(q.notes[ci])}</li>`).join("")}</ul>` : ""}`;
    case "dropdown": {
      const inStem = q.stem.includes("[[1]]");
      if (inStem && !reveal) return "";
      return `<table>${q.targets.map((t, i) => {
        const ok = p[i] === q.answer[i];
        return `<tr><td>${inStem ? `Box ${i + 1}` : inline(t.label)}</td><td>${inStem ? "" : sel(it, i, lock, reveal)}
          ${reveal ? `<div class="why"><span class="${ok ? "ok" : "bad"}">${ok ? "Your answer is correct" : p[i] === null ? "No answer" : "Your answer is incorrect"}</span>
            <ul>${t.options.map((o, k) => `<li class="${k === q.answer[i] ? "ok" : k === p[i] ? "bad" : ""}"><code>${esc(o)}</code>: ${inline(t.why[k])}</li>`).join("")}</ul></div>` : ""}</td></tr>`;
      }).join("")}</table>`;
    }
  }
  return "";
}

function bindAnswer(it, lock) {
  if (lock) return;
  const q = it.q, p = it.picked, redraw = () => show(true);
  $$("input[data-c]").forEach(b => b.onchange = () => {
    const ci = +b.dataset.c;
    if (q.type === "single") it.picked = [ci];
    else if (b.checked) { if (p.length < q.answer.length) p.push(ci); } else p.splice(p.indexOf(ci), 1);
    redraw();
  });
  $$("input[data-i]").forEach(b => b.onchange = () => { p[+b.dataset.i] = b.dataset.v === "1"; redraw(); });
  $$("select[data-t]").forEach(s => s.onchange = () => { p[+s.dataset.t] = s.value === "" ? null : +s.value; redraw(); });
  $$(".tile[draggable=true]").forEach(t => t.ondragstart = e => e.dataTransfer.setData("text/plain", t.dataset.c));
  $$("[tabindex][role=button]").forEach(el => el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } });
  const zone = (el, drop) => { el.ondragover = e => e.preventDefault(); el.ondrop = e => { e.preventDefault(); drop(+e.dataTransfer.getData("text/plain"), e); redraw(); }; };
  if (q.type === "order") {
    $$(".pool .tile").forEach(t => t.onclick = () => { if (p.length < q.answer.length) { p.push(+t.dataset.c); redraw(); } });
    $$("[data-up]").forEach(b => b.onclick = () => { const k = +b.dataset.up; if (k > 0) [p[k - 1], p[k]] = [p[k], p[k - 1]]; redraw(); });
    $$("[data-down]").forEach(b => b.onclick = () => { const k = +b.dataset.down; if (k < p.length - 1) [p[k + 1], p[k]] = [p[k], p[k + 1]]; redraw(); });
    $$("[data-rm]").forEach(b => b.onclick = () => { p.splice(+b.dataset.rm, 1); redraw(); });
    $$("[data-zone=area]").forEach(z => zone(z, (ci, e) => {
      const from = p.indexOf(ci);
      if (from >= 0) p.splice(from, 1); else if (p.length >= q.answer.length) return;
      const li = e.target.closest(".tile[data-c]"), at = li ? p.indexOf(+li.dataset.c) : -1;
      p.splice(at < 0 ? p.length : at, 0, ci);
    }));
    $$("[data-zone=pool]").forEach(z => zone(z, ci => { const k = p.indexOf(ci); if (k >= 0) p.splice(k, 1); }));
  }
  if (q.type === "dragdrop") {
    $$(".pool .tile").forEach(t => t.onclick = () => { S.sel = S.sel === +t.dataset.c ? null : +t.dataset.c; redraw(); });
    $$(".slot").forEach(s => {
      s.onclick = () => { p[+s.dataset.t] = S.sel ?? null; S.sel = null; redraw(); };
      zone(s, ci => { p[+s.dataset.t] = ci; S.sel = null; });
    });
  }
}

function show(keep) {
  const it = S.items[S.i], q = it.q, sec = S.secs[S.sec], practice = S.mode === "practice";
  const lock = practice ? it.checked : it.locked, reveal = practice && it.checked;
  const levels = { easy: "Easy", medium: "Medium", hard: "Hard" };
  const prog = practice ? S.i / S.items.length : S.items.filter(answered).length / S.items.length;
  $app.innerHTML = `
  <div class="bar"><div style="width:${100 * prog}%"></div></div>
  <div class="card">
    <div class="chips">
      <span class="chip">Question ${S.i + 1} of ${S.items.length}</span>
      ${S.sim ? "" : `<span class="chip">${q.obj} ${esc(OBJ[q.obj])}</span><span class="chip ${q.difficulty}">${levels[q.difficulty]}</span>`}
      ${HOW[q.type] && !q.series ? `<span class="chip">${HOW[q.type](q)}</span>` : ""}
      ${it.mark ? `<span class="chip">Marked for review</span>` : ""}
      ${clockChip()}
    </div>
    ${q.case ? casePanel(q.case) : ""}
    ${q.series ? `<div class="note">${esc(SERIES_NOTE)}</div>` : ""}
    <div class="stem">${stemHTML(it, lock, reveal)}</div>
    ${answerHTML(it, lock, reveal)}
    ${reveal ? feedback(it) : ""}
    <div class="actions">${practice ? navPractice(it) : navExam(it, sec)}</div>
  </div>`;
  bindAnswer(it, lock);
  $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = +b.dataset.tab; show(true); });
  $$("details.case").forEach(d => d.ontoggle = () => { S.caseClosed = !d.open; });
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  on("prev", () => { S.i--; S.sel = null; show(); });
  on("check", () => {
    it.score = grade(q, it.picked); it.checked = true;
    history[q.id] = it.score === 1; store.set(KEY + ".history", history);
    show(true);
  });
  on("next", () => {
    if (q.series && !practice) it.locked = true;
    S.sel = null;
    if (S.i + 1 < sec.end) { S.i++; return show(); }
    if (practice) return result();
    sec.kind === "series" ? endSection() : review();
  });
  on("mark", () => { it.mark = !it.mark; show(true); });
  on("review", review);
  on("quit", () => {
    if (practice) return S.review || !S.items.some(x => x.checked) ? home() : result();
    if (confirm("End the exam now? Unanswered questions count as incorrect.")) finish();
  });
  if (!keep) window.scrollTo(0, 0);
}

function navPractice(it) {
  const last = S.i + 1 === S.items.length;
  return `${S.i > 0 ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    ${it.checked ? `<button id="next" type="button">${last ? (S.review ? "Done" : "Results") : "Next"}</button>`
      : `<button id="check" type="button" ${complete(it.q, it.picked) ? "" : "disabled"}>Check</button><button class="ghost" id="next" type="button">Skip</button>`}
    <button class="ghost" id="quit" type="button">${S.review ? "Close review" : "Stop"}</button>`;
}

function navExam(it, sec) {
  const series = sec.kind === "series" || it.q.series, last = S.i + 1 === sec.end;
  const prevOk = S.i > sec.start && !series && !S.items[S.i - 1].locked;
  return `${prevOk ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    <button id="next" type="button">${!last ? "Next" : series ? (S.sec + 1 < S.secs.length ? "Next section" : "Finish exam") : "Review"}</button>
    ${series ? "" : `<button class="ghost" id="mark" type="button" aria-pressed="${it.mark}">Mark for review</button><button class="ghost" id="review" type="button">Review screen</button>`}
    <button class="ghost" id="quit" type="button">End exam</button>`;
}

function review() {
  const sec = S.secs[S.sec], idx = [];
  for (let i = sec.start; i < sec.end; i++) if (!S.items[i].q.series) idx.push(i);
  const open = idx.filter(i => !answered(S.items[i])).length, marked = idx.filter(i => S.items[i].mark).length;
  const lastSec = S.sec + 1 === S.secs.length;
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Review screen${S.secs.length > 1 ? ` -- section ${S.sec + 1} of ${S.secs.length}` : ""}</span>${clockChip()}</div>
    <p>${idx.length - open} answered, ${open} unanswered, ${marked} marked for review. Select a question to return to it.</p>
    <div class="rv">${idx.map(i => { const x = S.items[i]; return `<button class="ghost" type="button" data-go="${i}">Question ${i + 1}<br><span class="muted">${answered(x) ? "Answered" : "Unanswered"}${x.mark ? ", marked" : ""}</span></button>`; }).join("")}</div>
    <div class="actions">
      <button id="endsec" type="button">${lastSec ? "Submit exam" : "Finish section"}</button>
      <button class="ghost" id="back" type="button">Return to question ${S.i + 1}</button>
    </div></div>`;
  $$("[data-go]").forEach(b => b.onclick = () => { S.i = +b.dataset.go; S.tab = 0; show(); });
  document.getElementById("back").onclick = () => show();
  document.getElementById("endsec").onclick = () => {
    const msg = (open ? `${open} question(s) are unanswered. ` : "") + (lastSec ? "Submit the exam?" : "After you finish this section, you cannot return to it. Continue?");
    if (confirm(msg)) endSection();
  };
  window.scrollTo(0, 0);
}

function endSection() {
  const sec = S.secs[S.sec];
  for (let i = sec.start; i < sec.end; i++) S.items[i].locked = true;
  if (++S.sec >= S.secs.length) return finish();
  S.sim ? intro() : (S.i = S.secs[S.sec].start, show());
}

function finish() {
  clearInterval(tick); S.done = true;
  S.items.forEach(it => {
    it.score = grade(it.q, it.picked); it.checked = true;
    if (answered(it)) history[it.q.id] = it.score === 1;
  });
  store.set(KEY + ".history", history);
  result();
}

function feedback(it) {
  const q = it.q, s = it.score;
  return `<p class="verdict ${s === 1 ? "ok" : "bad"}">${s === 1 ? "Correct!" : s > 0 ? `Partially correct (${Math.round(100 * s)}%).` : "Incorrect."}</p>
    <div>${md(q.explanation)}</div>
    <p class="muted">Source: <a href="${esc(q.ref)}" target="_blank" rel="noopener">${esc(q.ref.replace("https://", ""))}</a></p>`;
}

function result() {
  clearInterval(tick);
  const xs = S.mode === "practice" ? S.items.filter(x => x.checked) : S.items;
  const pts = xs.reduce((s, x) => s + x.score, 0), pct = xs.length ? Math.round(100 * pts / xs.length) : 0;
  const per = Object.entries(DOMAINS).map(([k, d]) => {
    const ds = xs.filter(x => dom(x.q) === k); if (!ds.length) return "";
    const g = ds.reduce((s, x) => s + x.score, 0);
    return `<tr><td>${esc(d.title)}</td><td>${+g.toFixed(1)}/${ds.length}</td><td>${Math.round(100 * g / ds.length)}%</td></tr>`;
  }).join("");
  const wrong = xs.filter(x => x.score < 1), mins = Math.round((Date.now() - S.t0) / 60000);
  $app.innerHTML = `
  <div class="card">
    <h2>Results</h2>
    <div class="big">${pct}%</div>
    <p>${+pts.toFixed(1)} of ${xs.length} points${S.sim ? `, ${mins} minutes used` : ""}. Multi-part questions earn partial credit.
      ${pct >= 70 ? "Around passing level." : "Below passing level."} <span class="muted">The real exam reports a scaled score where 700 of 1000 passes; that is not exactly 70% correct.</span></p>
    <table><tr><th>Domain</th><th>Points</th><th>%</th></tr>${per}</table>
    <div class="actions">
      ${wrong.length ? `<button id="rwrong" type="button">Review ${wrong.length} mistakes</button>` : ""}
      <button class="ghost" id="rall" type="button">Review all</button>
      <button class="ghost" id="home" type="button">New session</button>
    </div>
  </div>`;
  const rev = list => { S = { mode: "practice", review: true, items: list, secs: [{ kind: "std", start: 0, end: list.length }], sec: 0, i: 0, tab: 0, sel: null }; show(); };
  document.getElementById("home").onclick = home;
  document.getElementById("rall").onclick = () => rev(xs);
  const rw = document.getElementById("rwrong"); if (rw) rw.onclick = () => rev(wrong);
}

home();
</script>
</body>
</html>
