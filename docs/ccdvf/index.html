an to use gives a reliable figure; the endpoint returns an estimate that is close to the billed value. A character-based rule of thumb or an older tokenizer is not reliable enough for a budget.","ref":"https://platform.claude.com/docs/en/build-with-claude/token-counting"},{"id":"5.1.2-01","obj":"5.1.2","difficulty":"easy","type":"single","stem":"Woodgrove Bank routes about two million short customer messages each day into one of eight intent categories. The output is a single label that the application can check against a fixed list. Cost per request and response time matter more than deep reasoning.\n\nWhich model tier should you use?","choices":["Sonnet","Opus","Haiku","Sonnet with extended thinking"],"answer":[2],"explanation":"Haiku is the smallest and fastest tier, suited to high-volume, latency-sensitive work such as classification where the output can be checked. Sonnet and Opus cost more per request and add capability that a single-label task does not need. Sonnet with extended thinking adds cost and latency for reasoning that the task does not require.","ref":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence"},{"id":"5.1.2-02","obj":"5.1.2","difficulty":"medium","type":"single","stem":"Adatum Corporation runs an interactive support assistant on Opus for every request. About 80 percent of requests are short FAQ lookups, and the rest need multi-step reasoning. Message length does not predict difficulty. Users wait for each reply, and no automatic check can tell whether an answer is correct. The team wants to reduce cost without lowering quality on the hard requests.\n\nWhich design should you choose?","choices":["Classify each request with a Haiku call, then send easy requests to Haiku or Sonnet and hard requests to Opus","Send every request to Haiku first, and rerun on Opus any reply that a user rates poorly after reading it","Route requests to Sonnet or Opus based on the length of the user message, because length tracks difficulty","Fine-tune Haiku on the hard requests through the Claude API so that it can replace Opus for all traffic"],"answer":[0],"explanation":"A small, fast Haiku call can act as the router, so most requests move to cheaper tiers while hard ones still reach Opus. Rerunning after poor ratings exposes users to bad answers and doubles latency, and no automatic failure signal exists. Message length is stated not to predict difficulty, and the Claude API does not currently offer fine-tuning.","ref":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence"},{"id":"5.1.2-03","obj":"5.1.2","difficulty":"hard","type":"single","stem":"Tailspin Toys needs an agent to review 600 source files for one class of defect. Each file check is independent and routine, the total work is far larger than one context window, and a final step must reason across all findings to produce a prioritized report.\n\nWhich design should you use?","choices":["A single Opus session that reads every file in sequence and keeps all findings in its context","A Haiku orchestrator that delegates the per-file checks to Opus subagents and writes the final report","A single Haiku session that works through the files in turn and writes the final report","An Opus orchestrator that delegates the per-file checks to Sonnet subagents and synthesizes their findings"],"answer":[3],"explanation":"Delegating routine, independent work to a cheaper tier pays off when the work exceeds one context window or has a long tail of routine tasks, while a stronger model handles the synthesis. A single Opus session cannot hold the work in one window and pays the top-tier price for routine checks. The Haiku orchestrator pays for Opus on routine work, and a single Haiku session is weak for the cross-file reasoning.","ref":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence"},{"id":"5.1.2-04","obj":"5.1.2","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. is considering a pairing of a small executor model with an Opus advisor for a 12-step refactoring task. The task is one dependent chain and fits comfortably in one context window. Nobody has measured how a single model performs on this task at different effort levels.\n\nWhat should you do first?","choices":["Build an orchestrator in which Sonnet subagents each handle one step of the refactoring","Measure one model at several effort levels on a sample of real tasks, and compare the cost per solved task","Add a Haiku router in front of the pipeline so that a tier is chosen for each request","Move the task to Opus at the highest effort setting and skip any measurement"],"answer":[1],"explanation":"Anthropic's guidance is to tune one model before adding a second, and to compare configurations on cost per solved task. A dependent chain that fits in one context does not benefit from delegation, so subagents and a router add cost without a clear gain. Choosing the top tier and effort without measuring may pay for capability the task does not need.","ref":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence"},{"id":"5.1.3-01","obj":"5.1.3","difficulty":"easy","type":"single","stem":"Litware, Inc. runs a Python assistant that sends the same 20,000-token policy handbook plus a short new question in every request. Requests arrive every few seconds during business hours, and users wait for each reply. Input cost is high because the handbook is processed again each time.\n\nWhich feature should you use to lower the input cost?","choices":["The Message Batches API","The token counting endpoint","Streaming responses","Prompt caching, with cache_control on the handbook"],"answer":[3],"explanation":"Prompt caching stores the repeated prefix, and later requests read it at a fraction of the normal input price. The Batches API is asynchronous and cannot serve users who wait for a reply. Token counting only measures a request and does not cache anything, and streaming changes how output is delivered, not what the input costs.","ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching"},{"id":"5.1.3-02","obj":"5.1.3","difficulty":"medium","type":"single","stem":"Relecloud's support agent sends a large system prompt that is marked with cache_control on the Claude API, and it uses the default cache settings. Customers submit requests about every 8 minutes. Usage data shows cache_creation_input_tokens on nearly every request and almost no cache reads.\n\nWhich change should you make to increase cache hits?","choices":["Set the ttl value of the cache_control block to 1h","Keep the default lifetime, because each cache read refreshes the entry","Move the cache_control marker from the system prompt to the user message","Increase the max_tokens value so that cache entries are retained longer"],"answer":[0],"explanation":"The default cache lifetime is 5 minutes, and a read refreshes it only when it happens before the entry expires. With a gap of about 8 minutes, each entry expires and is written again. A 1-hour lifetime keeps the entry alive between requests, at a higher write price than the default. Moving the marker or changing max_tokens does not change the lifetime.","ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching"},{"id":"5.1.3-03","obj":"5.1.3","difficulty":"medium","type":"single","stem":"Adatum Corporation adds cache_control to a short system prompt of about 300 tokens in a Python assistant that calls the Claude API. Every response reports cache_creation_input_tokens and cache_read_input_tokens as 0, and no error is returned.\n\nWhat should you do first to explain this behavior?","choices":["Check whether the cache lifetime expired before the first request finished","Change the cache_control type to a persistent type so that the entry is written","Compare the length of the cached prefix with the minimum cacheable prompt length for the model in use","Check whether tool_choice changed between requests, which blocks cache writes"],"answer":[2],"explanation":"A prefix that is shorter than the minimum cacheable length for the model is processed without caching, and the API returns no error, so both cache counters stay at 0. Compare the prefix size with the minimum for your model. Expiry could only matter after a write, ephemeral is the only supported cache type, and a tool_choice change affects message blocks but does not block writes.","ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching"},{"id":"5.1.3-04","obj":"5.1.3","difficulty":"hard","type":"multi","stem":"Woodgrove Bank's agent sends a tool list, a long system prompt and reference documents, followed by the customer question. The code builds the tool list for each request from the tools that the customer is likely to need, and it places the customer name at the top of the system prompt. The cache hit rate is low even though requests arrive seconds apart and the prefix is well above the minimum cacheable size.\n\nWhich two changes should you make? Each correct answer presents part of the solution.","choices":["Send the same complete tool list in every request","Raise the cache lifetime to 1 hour","Send requests concurrently so that each one reuses an entry that another request wrote","Move the customer-specific text after the cache breakpoint","Increase the size of the reference documents so that the prefix is cacheable"],"answer":[0,3],"explanation":"A cache hit needs an identical prefix in the order tools, system and messages, and changing tool definitions invalidates the whole cache. Keeping the tool list fixed and moving the per-customer text behind the breakpoint restores a stable prefix. A longer lifetime does not help when requests are seconds apart, an entry is available only after the first response starts, and the prefix is already large enough.","ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching"},{"id":"5.1.4-01","obj":"5.1.4","difficulty":"easy","type":"single","stem":"Tailspin Toys must classify 200,000 archived support documents with Claude. Nobody is waiting on the individual results, the results are needed the next morning, and the team wants the lowest cost.\n\nWhich option should you use?","choices":["Synchronous Messages API requests with streaming","The Message Batches API","Synchronous Messages API requests with prompt caching","The token counting endpoint"],"answer":[1],"explanation":"The Message Batches API processes large volumes of requests asynchronously at a 50 percent discount, which fits work that does not need an immediate response. Synchronous requests, with or without streaming or caching, are priced at the standard rate and suit interactive use. Token counting only measures prompts and does not produce responses.","ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"id":"5.1.4-02","obj":"5.1.4","difficulty":"medium","type":"single","stem":"Relecloud runs a live chat assistant in which customers wait for each reply, and the finance team asks to move it to the Message Batches API to get the 50 percent discount.\n\nWhat should you recommend?","choices":["Move the traffic to batches and poll each batch every second until it finishes","Move the traffic to batches and add a 1-hour cache so that replies arrive faster","Move the traffic to batches only during business hours, when processing is fastest","Keep synchronous requests and lower cost with a smaller tier and prompt caching"],"answer":[3],"explanation":"Batches are asynchronous: most finish within an hour, but results can take up to 24 hours and no completion time is guaranteed, so they do not suit users who wait for a reply. Polling, caching and scheduling do not make a batch interactive. Cost for live traffic is better reduced with a smaller model tier and prompt caching on synchronous calls.","ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"id":"5.1.4-03","obj":"5.1.4","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. must score 60,000 product reviews every night. Each request starts with the same 15,000-token rubric. The results are needed by morning, and the team wants the lowest cost.\n\nWhich approach should you use?","choices":["Submit a Message Batch with identical cache_control blocks on the rubric and a 1-hour cache duration","Submit a Message Batch with the default 5-minute cache duration, because batches finish in minutes","Send synchronous requests with prompt caching and the default 5-minute lifetime","Send synchronous requests in parallel so that every request shares one cache entry"],"answer":[0],"explanation":"Batch and caching discounts can stack, but batch requests run asynchronously and concurrently, so cache hits are best effort. Identical cache_control blocks and the 1-hour duration improve the chance of hits, because a batch can take longer than 5 minutes. Synchronous requests miss the batch discount that the overnight deadline allows, and parallel requests cannot share an entry before the first response starts.","ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"id":"5.1.4-04","obj":"5.1.4","difficulty":"medium","type":"single","stem":"Tailspin Toys submits a Message Batch of 5,000 requests and downloads the results. The application assumes that the result lines are in the same order as the submitted requests, and some summaries are saved against the wrong product. The team must keep the batch discount.\n\nWhat should you do?","choices":["Split the work into batches of 100 requests so that the order is preserved","Sort the downloaded results by the time that each one completed","Give each request a unique custom_id and match each result to its request by that value","Cancel the batch and resend the same requests as synchronous calls"],"answer":[2],"explanation":"Batch results can be returned in any order, so the order of the results file does not match the order of the requests. Each request carries a unique custom_id, and matching on it is the reliable approach. Smaller batches do not guarantee order, completion time is not a stable key, and resending synchronously gives up the discount.","ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"id":"6.1.1-01","obj":"6.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. sends Claude a single user message that contains task instructions, a policy excerpt and a customer email pasted one after another as plain text. Claude occasionally treats sentences from the customer email as instructions.\n\nWhich change should you make to the prompt?","choices":["Assign Claude the role of a senior support agent in the system prompt and describe its tone","Wrap the instructions, policy excerpt and email in separate descriptively named XML tags","Add three diverse examples of finished replies inside example tags in the prompt","Ask Claude to reason step by step before it writes the final reply to the customer"],"answer":[1],"explanation":"XML tags separate instructions, background and variable input so Claude does not mix them up, which is the symptom described. A role changes tone and focus, examples steer output format and style, and step-by-step reasoning helps with logic problems; none of them separates instructions from pasted data.","ref":"https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/use-xml-tags"},{"id":"6.1.1-02","obj":"6.1.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. uses Claude to classify support tickets. The output is sometimes a full sentence, sometimes a bare label and sometimes a label followed by an explanation. The ticket text is already wrapped in ticket tags, the system prompt already defines the analyst role, and the labels are clearly defined.\n\nWhich change should you make to get a consistent output format?","choices":["Wrap each label definition in additional nested XML tags inside the system prompt","Ask Claude to reason step by step in thinking tags before it gives the final label","Add three to five diverse examples that each pair a ticket with the exact label-only output","Expand the role description in the system prompt with more detail about the analyst's seniority"],"answer":[2],"explanation":"Few-shot (multishot) examples are the most reliable way to enforce a uniform output structure, and the stem has already used tags and a role. Extra tags only separate content, step-by-step reasoning helps with logic rather than format, and a longer role changes tone and focus rather than the shape of the answer.","ref":"https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting"},{"id":"6.1.1-03","obj":"6.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys builds a chat assistant that must keep the same persona and tone rules on every call. To save tokens, the application trims older turns from the conversation history, and each user turn contains a different request. The team also wants the persona text to be identical across calls.\n\nWhich design should you use?","choices":["Set the persona and tone rules in the system parameter and send each request as a user message","State the persona in the first user message and rely on the conversation history to carry it forward","Write the persona into the system parameter together with the current request and rebuild it each turn","Prefill each assistant turn with a bracketed persona name and keep the tone rules in the first user message"],"answer":[0],"explanation":"The system parameter is the place for the role and persistent behavior, while the task-specific request belongs in the user turn; the system prompt is not affected when older turns are trimmed. A persona in the first user message is lost when that turn is trimmed, rebuilding the system prompt every turn defeats the identical-text goal, and the prefill option still leaves the tone rules in a turn that is trimmed.","ref":"https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/system-prompts"},{"id":"6.1.1-04","obj":"6.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank gives Claude three few-shot examples to extract fields from loan decision emails. All three examples use the same phrasing and all show an approved outcome. Claude now reports an approved outcome for almost every email, and the output must still match a fixed template.\n\nWhat should you do to the examples?","choices":["Add ten more examples that follow the same wording and approved outcome to reinforce the template","Remove the examples and describe the decision rules in a longer paragraph of instructions","Move the three examples from the user message into the system parameter without changing them","Replace them with diverse examples covering approved and declined outcomes and varied wording, inside example tags"],"answer":[3],"explanation":"Examples must be relevant and diverse so Claude does not pick up unintended patterns such as always answering approved; they also keep the template exact. More near-identical examples strengthen the bias, a paragraph of rules loses the exact template that examples demonstrate, and moving the same examples to the system parameter does not change their content.","ref":"https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting"},{"id":"6.1.2-01","obj":"6.1.2","difficulty":"easy","type":"single","stem":"A code-analysis agent at Relecloud calls a tool that returns large file listings. After 40 turns the context window is nearly full. The earlier raw tool outputs are no longer needed, but the user messages and Claude's own reasoning must stay verbatim.\n\nWhich technique should you use?","choices":["Compaction that replaces the whole conversation with a short summary","Delegation of the remaining work to a subagent that starts with a fresh context","Context editing that clears the oldest tool results and leaves a placeholder","A memory file that stores the history before a new conversation is started"],"answer":[2],"explanation":"Tool result clearing removes only stale tool outputs and leaves the user messages and reasoning untouched. Compaction summarizes everything, so verbatim content is lost; a subagent or a new conversation would drop the existing history instead of pruning it.","ref":"https://platform.claude.com/docs/en/build-with-claude/context-editing"},{"id":"6.1.2-02","obj":"6.1.2","difficulty":"medium","type":"single","stem":"The orchestrating agent at Fabrikam, Inc. is asked which module defines retry behavior. Answering means reading about 60 source files, and only the final conclusion matters. The main conversation must not hold the file contents at any point.\n\nWhich technique should you use?","choices":["Clear old tool results from the main conversation after each search step","Delegate the exploration to a subagent that returns only its final summary to the main agent","Enable compaction so the main conversation is summarized when it grows","Save the file contents to a memory file and read them back when they are needed"],"answer":[1],"explanation":"A subagent works in its own fresh context window and only its final message returns to the parent, so the file contents never enter the main conversation. Clearing and compaction run after the contents have already entered the main context, and a memory file still loads the contents back into the main context when read.","ref":"https://code.claude.com/docs/en/agent-sdk/subagents"},{"id":"6.1.2-03","obj":"6.1.2","difficulty":"hard","type":"multi","stem":"Litware, Inc. runs a multi-day refactoring agent. The work is one sequential task in which each step depends on design decisions made in earlier steps, so it cannot be split among parallel workers. Progress must survive when the context window fills.\n\nWhich two techniques should you use? Each correct answer presents part of the solution.","choices":["Write progress notes and design decisions to a file or memory store outside the context window and reload them after a reset","Truncate the history to the most recent five messages whenever the window fills","Split every step into parallel subagents so that the parent context never grows","Enable compaction so the conversation is summarized as it approaches the context limit","Raise max_tokens so the response budget can hold the earlier history"],"answer":[0,3],"explanation":"Structured note-taking keeps decisions outside the window and compaction summarizes the conversation near the limit; Anthropic describes both as techniques for long-running agents. Truncating to five messages discards earlier decisions, parallel subagents do not fit a tightly coupled sequential task, and max_tokens limits the output length rather than the history.","ref":"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents"},{"id":"6.1.2-04","obj":"6.1.2","difficulty":"medium","type":"single","stem":"Tailspin Toys runs a trip-planning assistant in one continuous 300-turn conversation with a single user. There are very few tool calls. The context window is nearly full, and the assistant must continue the same conversation while keeping the gist of the user's preferences and decisions.\n\nWhich technique should you use?","choices":["Compaction, which summarizes earlier turns and continues from the summary","Tool result clearing, which removes the oldest tool outputs from the history","Subagent isolation, which moves each topic into its own subagent","Pruning of the oldest turns until the history fits, without keeping a summary"],"answer":[0],"explanation":"Compaction summarizes the earlier conversation near the limit and continues from the summary, keeping the gist of preferences and decisions. Clearing tool results frees little space when there are few tool calls, a single continuous dialogue cannot be split into subagents, and plain pruning loses the early preferences.","ref":"https://platform.claude.com/docs/en/build-with-claude/context-windows"},{"id":"6.1.3-01","obj":"6.1.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. parses invoices with Claude. A downstream service must receive JSON that conforms to a fixed schema, and a malformed payload breaks the pipeline.\n\nWhich approach should you use to get schema-conforming output?","choices":["State in the system prompt that the reply must be valid JSON without commentary","Include several examples of valid JSON replies inside example tags","Ask Claude to place the JSON inside answer tags and extract it with a regular expression","Use the structured outputs feature with a JSON schema so the response is constrained to it"],"answer":[3],"explanation":"Structured outputs constrain the response to the supplied JSON schema, which is stronger than any prompt-only technique. Instructions, examples and tag extraction make valid JSON likely but give no guarantee, so they are right only when a best-effort format is acceptable.","ref":"https://platform.claude.com/docs/en/build-with-claude/structured-outputs"},{"id":"6.1.3-02","obj":"6.1.3","difficulty":"medium","type":"single","stem":"Woodgrove Bank calls Claude with structured outputs. For long documents the JSON parser intermittently fails with an unexpected end of input. The logs show that every failing call has a stop_reason of max_tokens.\n\nWhat should you do in the application?","choices":["Set temperature to 0 so the output is deterministic","Check stop_reason before parsing and retry with a higher max_tokens limit when the response was cut off","Retry the request whenever the API returns an HTTP 5xx status code","Strip trailing characters from the reply with a regular expression and parse the remainder"],"answer":[1],"explanation":"A max_tokens stop means the output was truncated, so the JSON is incomplete and may not comply with the schema; the fix is to check stop_reason and retry with a higher limit. Temperature does not change the output length, the calls succeed at the HTTP level so a 5xx retry never triggers, and trimming characters cannot restore missing content.","ref":"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"},{"id":"6.1.3-03","obj":"6.1.3","difficulty":"hard","type":"single","stem":"Litware, Inc. extracts invoice data with structured outputs. Every response is schema-valid and stop_reason is end_turn on every affected call. Some objects still break business rules: the invoice total does not equal the sum of the line items, or the supplier ID does not exist in the supplier table.\n\nWhich change should you make?","choices":["Mark every property in the JSON schema as required and disallow additional properties","Switch to prompt-only JSON, which offers stronger value checking than a schema does","Validate the parsed object against the business rules in code and send failures back to Claude","Raise max_tokens so that the object is not cut off before it is complete"],"answer":[2],"explanation":"A schema guarantees structure and types, not whether values are correct, and cross-field or database checks cannot be expressed in it, so the application must validate and retry with the error as feedback. Required properties do not check values, prompt-only JSON has weaker guarantees than a schema, and truncation is ruled out by the end_turn stop reason.","ref":"https://platform.claude.com/docs/en/build-with-claude/structured-outputs"},{"id":"7.1.1-01","obj":"7.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. builds a Python agent that summarizes inbound customer emails for support staff. An email body might contain text that tries to redirect the agent.\n\nWhich message structure should you use to pass the email body to Claude?","choices":["Append the body to the system prompt inside XML tags that mark it as data","Send the body as a plain user text block with a note that it is untrusted","Return the body in a tool_result block, and describe it as an inbound email from an unknown sender","Place the body in the description field of a summarize_email tool definition"],"answer":[2],"explanation":"Third-party content belongs in tool_result blocks, where Claude is trained to treat embedded instructions with skepticism, and describing the source helps Claude calibrate trust. Content in the system prompt gains operator-level authority, and plain user text blocks are treated as the user's own words. A tool description is part of your trusted configuration, not a channel for untrusted data.","ref":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"},{"id":"7.1.1-02","obj":"7.1.1","difficulty":"medium","type":"single","stem":"Relecloud's research agent fetches third-party web pages through a fetch_page tool and summarizes them for the user. The user is trusted, but pages can contain hidden text that tries to redirect the agent. The team wants a check that inspects each tool output before Claude acts on it, with low added latency and cost.\n\nWhich control should you add?","choices":["A Haiku classification call with structured output that flags injection attempts in each tool output","Input validation that rejects known jailbreak phrases in the user's chat message","An Opus call with extended thinking that rewrites every page into a clean summary","A system prompt statement that retrieved content is untrusted, as the sole control"],"answer":[0],"explanation":"A lightweight model such as Haiku can screen each tool output and return a parseable verdict before the content is passed on as a tool_result. Validating the user's message addresses direct injection, but here the user is trusted and the attack is in the pages. An Opus rewrite is slow and costly, and a system prompt statement is a useful policy but does not inspect the output.","ref":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"},{"id":"7.1.1-03","obj":"7.1.1","difficulty":"hard","type":"multi","stem":"Fabrikam, Inc. built a document agent that reads vendor contracts through a tool. The code returns one tool_result string that starts with the task instructions and is followed by the raw contract text. Contracts come from outside parties, and the user of the agent is trusted. A test contract that contains hidden instructions sometimes changes the agent's behavior.\n\nWhich two changes should you make? Each correct answer presents part of the solution.","choices":["Screen the user's chat messages for known jailbreak phrases","Return the contract text as a JSON-encoded field with a source label inside the tool_result","Throttle users who repeatedly trigger refusals from the application","Copy the contract text into the system prompt so that Claude gives it more weight","Send the task instructions in a user turn that follows the tool_result block"],"answer":[1,4],"explanation":"JSON encoding gives the untrusted text unambiguous delimiters so that it cannot close a quote or tag to break out, and a source label tells Claude what it is reading. Instructions placed inside a tool_result may be ignored or flagged, so they belong in a user turn after it. Screening users and throttling repeat offenders address direct attacks, and the system prompt would give the contract text operator-level authority.","ref":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"},{"id":"7.1.2-01","obj":"7.1.2","difficulty":"easy","type":"single","stem":"Woodgrove Bank is building a Claude agent that answers customers' balance questions through tool use. A prompt injection in a customer message must not be able to expose other customers' data or move money.\n\nWhich tool design should you use?","choices":["One read-only get_balance tool whose account ID is set by the server from the authenticated session","A run_sql tool that connects to the database through a read-only role","The full banking API as a tool, plus a system prompt rule that forbids transfers","A get_balance tool that accepts any account ID and asks Claude to confirm ownership"],"answer":[0],"explanation":"Least privilege means that the agent can reach only the narrow action and data it needs, and the account scope is enforced by code that the model cannot override. A read-only SQL tool can still read other customers' rows, and a prompt rule is not an enforcement boundary. Asking Claude to confirm ownership leaves the scope decision to the model, which an injection can influence.","ref":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"},{"id":"7.1.2-02","obj":"7.1.2","difficulty":"medium","type":"single","stem":"Adatum Corporation uses Claude Code on a shared repository. The security team requires that a script check every Bash command against a policy service and stop disallowed commands before they run, in every permission mode.\n\nWhich Claude Code feature should you configure?","choices":["A PostToolUse hook that runs the script after each Bash command","A PreToolUse hook that blocks the call when the script exits with code 2","A UserPromptSubmit hook that runs the script when a prompt is sent","Allow rules in settings.json for the commands that the policy approves"],"answer":[1],"explanation":"A PreToolUse hook runs before a tool call executes and can block it, for example with exit code 2, and it fires in every permission mode. A PostToolUse hook runs after the tool has already run, so it cannot stop the command. A UserPromptSubmit hook sees the prompt, not the Bash command, and allow rules do not call a policy service.","ref":"https://code.claude.com/docs/en/hooks"},{"id":"7.1.2-03","obj":"7.1.2","difficulty":"hard","type":"single","stem":"Tailspin Toys blocks downloads in Claude Code with the permission rule Bash(curl *) in permissions.deny. A security review shows that Claude can still reach the internet by running the same program through its full path and by running it inside sh -c. The team needs a restriction that holds regardless of how a command is written.\n\nWhat should you add?","choices":["More deny rules for wget, nc and python network calls","A PostToolUse hook that logs the destination of each request","Sandboxing with network isolation and an allowlist of permitted domains","Accept Edits permission mode for the repository"],"answer":[2],"explanation":"A deny rule matches the command as written, so it can be bypassed by a full path or a wrapper such as sh -c. For a restriction that must hold, pair it with the sandbox network allowlist, which is enforced at the network level. More deny rules repeat the same weakness, a PostToolUse hook only records after the fact, and Accept Edits mode controls file edits, not network access.","ref":"https://code.claude.com/docs/en/permissions"},{"id":"7.1.3-01","obj":"7.1.3","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. runs a Python service that calls the Claude API in development, test and production. A developer committed the single shared key to a repository. The team wants to contain future leaks and to limit how long a leaked key stays useful.\n\nWhich approach should you use?","choices":["Use one shared key from an environment variable and add the .env file to the gitignore file","Use one shared key in a .env file that is committed to a private repository and rotated each year","Give each developer a personal key and share the production key in the team chat","Use a separate key for each environment, keep the keys in a secrets manager and rotate them on a schedule"],"answer":[3],"explanation":"Separate keys let you disable one use case without affecting the others, a secrets manager keeps keys out of source control, and regular rotation limits the lifetime of any leaked key. A single shared key keeps the same blast radius even if it is in an environment variable. Committing the key to a repository or sharing it in chat spreads it further.","ref":"https://platform.claude.com/docs/en/manage-claude/authentication"},{"id":"7.1.3-02","obj":"7.1.3","difficulty":"hard","type":"single","stem":"Litware, Inc. runs a Python health-coaching chatbot. Users type names, phone numbers and addresses into the chat. Compliance requires that this personal data is not written to the application's own analytics logs and that Claude receives only the personal data that it needs.\n\nWhich approach should you use?","choices":["Add a system prompt instruction that tells Claude not to repeat personal data in replies","Detect personal data in application code and replace it with placeholders before sending and before logging","Request a zero data retention arrangement and keep logging the raw text in the analytics store","Rely on the Claude API to redact personal data from inputs before the model processes them"],"answer":[1],"explanation":"Data minimization happens in your own code: replacing personal data with placeholders before the request and before logging keeps it out of both the model input and your logs. A system prompt instruction only shapes replies, and the input and logs already contain the data. Zero data retention is an organization-level arrangement for Anthropic's retention, not your logs, and the API does not redact inputs for you.","ref":"https://platform.claude.com/docs/en/manage-claude/api-and-data-retention"},{"id":"8.1.1-01","obj":"8.1.1","difficulty":"easy","type":"single","stem":"Relecloud defines two tools for a support agent: get_customer with the description \"Gets customer data\" and get_order with the description \"Gets order data\". The tool names are already distinct and clear, but Claude frequently calls the wrong tool or skips tools it should use.\n\nWhat should you change?","choices":["Add an input example to each tool definition and keep the one-line descriptions as they are","Rename the tools with a shared service prefix and keep the one-line descriptions","Expand each description to cover what the tool does, when to use it and what each parameter means","Set tool_choice to a specific tool name on every request so that selection is deterministic"],"answer":[2],"explanation":"Detailed descriptions are the most important factor in tool performance: what the tool does, when to use it and when not to, and what each parameter means. Examples are secondary to a clear description, the names are already distinct, and forcing one tool name on every request would block the other tool entirely.","ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"id":"8.1.1-02","obj":"8.1.1","difficulty":"medium","type":"single","stem":"The assistant at Tailspin Toys must answer questions that need current web information and must look up stock levels in an internal inventory system. The team does not want to build or host a search integration.\n\nWhich approach should you use?","choices":["Define both capabilities as client tools and run both of them in the application","Use the web search server tool that Anthropic runs and define the inventory lookup as a client tool that the application executes","Use server tools for both capabilities so that Anthropic runs the inventory lookup against the internal system","Define web search as a client tool backed by a third-party API and run the inventory lookup as a server tool"],"answer":[1],"explanation":"Server tools such as web search run on Anthropic infrastructure, so no integration is needed, while tools that reach your own systems are client tools that your code executes and answers with a tool_result. Making both client tools would require building search, and Anthropic cannot run a lookup against an internal system.","ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/server-tools"},{"id":"8.1.1-03","obj":"8.1.1","difficulty":"medium","type":"single","stem":"A routing service at Woodgrove Bank sends Claude a request that defines three tools: lookup_account, create_case and escalate. Every turn must end in a tool call and plain-text replies are not allowed, but Claude should decide which of the three tools fits the request.\n\nWhich tool_choice setting should you use?","choices":["A tool_choice of type auto","A tool_choice of type none","A tool_choice of type tool that names lookup_account","A tool_choice of type any"],"answer":[3],"explanation":"The any setting requires Claude to call one of the provided tools without forcing a specific one. Auto lets Claude answer in plain text, none prevents tool use completely, and naming a tool forces that single tool on every turn.","ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/how-tool-use-works"},{"id":"8.1.1-04","obj":"8.1.1","difficulty":"hard","type":"single","stem":"Litware, Inc. connects tools from billing, CRM and ticketing services to one agent. Each service exposes tools with generic names such as search, get and update, and Claude often picks the tool of the wrong service. The descriptions are already detailed and strict mode is already enabled on every tool.\n\nWhich change should you make?","choices":["Namespace the tool names by service and resource, such as billing_invoices_search and crm_contacts_search","Set tool_choice to any so that Claude must pick one of the available tools","Shorten each description so that Claude spends fewer tokens when comparing the tools","Add input examples to every tool so that the input fields are validated against the schema"],"answer":[0],"explanation":"Prefixing tool names by service and resource makes selection unambiguous as the tool library grows, which fits generic overlapping names. The descriptions are already good, so shortening them removes useful signal; tool_choice any does not help Claude choose better, and input validation does not affect which tool is selected.","ref":"https://www.anthropic.com/engineering/writing-tools-for-agents"},{"id":"8.1.2-01","obj":"8.1.2","difficulty":"easy","type":"single","stem":"A client tool named query_inventory at Fabrikam, Inc. times out when it calls its backend. Claude must be told explicitly that the call failed so that it can try something else.\n\nWhat should the application send back for this tool call?","choices":["A tool_result with is_error set to true that says what failed and what to try next","An empty tool_result so that Claude assumes the backend has no matching records for the query","A message that ends the conversation and shows the user the raw exception text","A normal tool_result that contains the exception text but carries no error flag at all"],"answer":[0],"explanation":"A tool_result with is_error set to true tells Claude the call did not succeed, and a specific message lets it recover or choose another approach. An empty result looks like a successful lookup with no records, and a result without the error flag hides the failure that the stem says Claude must know about.","ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"},{"id":"8.1.2-02","obj":"8.1.2","difficulty":"medium","type":"single","stem":"An MCP server built by Contoso, Ltd. exposes a create_refund tool. The upstream payments API rejects a call because of a rate limit and asks the caller to retry after 30 seconds. The model should be able to see the failure and decide what to do.\n\nWhat should the server return?","choices":["A JSON-RPC protocol error response with a standard error code","A successful result whose text says the call failed and that has no isError flag","A tool result with isError set to true and a message that includes the retry delay","A closed transport connection so that the client reconnects and repeats the call"],"answer":[2],"explanation":"API failures are tool execution errors: they are returned in the tool result with isError true so the model gets feedback it can act on. A JSON-RPC protocol error fits problems such as an unknown tool or a malformed request and is less likely to help the model recover, and the other two hide the failure or drop the session.","ref":"https://modelcontextprotocol.io/specification/2025-11-25/server/tools"},{"id":"8.1.2-03","obj":"8.1.2","difficulty":"hard","type":"multi","stem":"An agent loop at Litware, Inc. calls a flaky tool. The tool returns the text Error with the error flag set, and Claude retries the same call dozens of times, wasting tokens. Some failures are transient, such as rate limits, and the agent should still recover from those.\n\nWhich two changes should you make? Each correct answer presents part of the solution.","choices":["Include in each error result what failed and what to try next, such as the wait time for a rate limit","Remove the error flag from failed results so that Claude stops treating them as failures","Add a retry limit to the agent loop so that a repeating failure ends or is escalated","Let the exception propagate so that the agent loop ends on the first tool failure","Set tool_choice to none after the first failure for the rest of the session"],"answer":[0,2],"explanation":"Specific error messages let Claude recover without guessing, and a retry limit in the loop bounds the cost when the same call keeps failing. Removing the flag hides real failures, ending the loop on the first error prevents recovery from transient problems, and tool_choice none blocks tool use for the rest of the session.","ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"},{"id":"8.1.3-01","obj":"8.1.3","difficulty":"easy","type":"single","stem":"An MCP server at Relecloud exposes company policy documents. The data is read-only, every document is identified by a URI, and the host application decides which documents to attach as context.\n\nWhich MCP feature should you use to expose the documents?","choices":["An MCP tool that the model calls to run a policy search","MCP resources, each identified by a URI","An MCP prompt template that users trigger from a menu","An Agent Skill that bundles the documents with a SKILL.md file"],"answer":[1],"explanation":"Resources are read-only context data identified by URIs and loaded by the host application, which matches the stem. Tools are model-invoked actions, prompts are reusable templates that users trigger, and a Skill packages procedural instructions rather than serving live data from a server.","ref":"https://modelcontextprotocol.io/docs/learn/architecture"},{"id":"8.1.3-02","obj":"8.1.3","difficulty":"medium","type":"single","stem":"Woodgrove Bank hosts one MCP server centrally for employees whose clients run on many different machines. Requests must carry a bearer token, the server must not be started once per client, and the team must use a currently supported transport.\n\nWhich transport should you use?","choices":["The stdio transport, with a server process launched on each employee machine","The legacy HTTP with SSE transport from the earlier protocol revision","The Streamable HTTP transport bound only to localhost on the server","The Streamable HTTP transport exposed over HTTPS with token authentication"],"answer":[3],"explanation":"Streamable HTTP is the transport for remote servers that serve many clients and it supports standard HTTP authentication such as bearer tokens. Stdio launches one local process per client, the HTTP with SSE transport was superseded by Streamable HTTP, and a localhost binding is meant for local servers and would be unreachable for remote clients.","ref":"https://modelcontextprotocol.io/specification/draft/basic/transports/streamable-http"},{"id":"8.1.3-03","obj":"8.1.3","difficulty":"medium","type":"single","stem":"A developer at Fabrikam, Inc. builds a local MCP server in Python that must stay on the stdio transport. When the host connects, it reports JSON parse errors. The server code uses print() to write debug messages.\n\nWhat should the developer do?","choices":["Switch the server to the Streamable HTTP transport so that printed text is allowed","Write the debug messages to stdout as JSON objects","Send diagnostics to stderr with the logging module and keep stdout for protocol messages","Call flush after each print so that the debug text is not interleaved with responses"],"answer":[2],"explanation":"A stdio server uses stdout for JSON-RPC messages, so stray printed text corrupts the stream; diagnostics belong on stderr or in a file. Switching transports would drop the stdio requirement, JSON objects on stdout are still not valid protocol messages, and flushing does not stop the text from sharing the protocol channel.","ref":"https://modelcontextprotocol.io/docs/2026-07-28/develop/build-server"},{"id":"8.1.3-04","obj":"8.1.3","difficulty":"hard","type":"multi","stem":"Litware, Inc. wants Claude to query an internal inventory database and to follow a 12-step release-notes procedure. Several AI applications must reuse the database access. The procedure is needed only when release notes are written, and the team wants to avoid spending context on it for other requests.\n\nWhich two actions should you take? Each correct answer presents part of the solution.","choices":["Define a custom client tool for the database inside one application's code","Build an MCP server that exposes the inventory database through a tool","Add the full procedure to the system prompt of every request","Package the release-notes procedure as an Agent Skill","Enable a built-in server tool such as web search to reach the inventory data"],"answer":[1,3],"explanation":"MCP provides reusable connectivity to external systems, and a Skill carries procedural knowledge that loads only when it is relevant. A custom tool in one application is not reusable across applications, a system prompt procedure consumes context on every request, and web search cannot reach an internal database.","ref":"https://claude.com/resources/articles/skills-explained"}],"cases":{}};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives, CASES = DATA.cases || {};
// per-exam storage prefix ("ai500" for AI-500), so several exams on one site keep separate progress
const KEY = DATA.exam.id.toLowerCase().replace(/[^a-z0-9]/g, "");
const $app = document.getElementById("app");
const $$ = s => [...$app.querySelectorAll(s)];
// notice (set per category in build.py) and content date (CONTENT_DATE in objectives.py); the date ages by itself
(function () {
  const e = DATA.exam, box = document.getElementById("banner"), lines = [];
  if (e.notice) lines.push(e.notice);
  if (e.contentDate) {
    const p = e.contentDate.split("-"), d = new Date(Date.UTC(+p[0], +p[1] - 1, 1)), now = new Date();
    const months = (now.getFullYear() - +p[0]) * 12 + now.getMonth() + 1 - +p[1];
    lines.push("Content as of " + d.toLocaleDateString("en", { month: "long", year: "numeric", timeZone: "UTC" }) + "." +
      (months > 6 ? " That is more than six months ago: the exam or the product may have changed, so check the current official sources." : ""));
  }
  lines.forEach(t => { const p = document.createElement("p"); p.className = "note"; p.textContent = t; box.appendChild(p); });
})();

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get(KEY + ".history", {}); // id -> true/false (last result fully correct)

const theme = store.get(KEY + ".theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set(KEY + ".theme", next);
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => p.split("\n").every(l => l.startsWith("- "))
      ? `<ul>${p.split("\n").map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`
      : "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const why = s => s ? `<div class="why">${inline(s)}</div>` : "";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dom = q => q.obj.split(".")[0];
const isStd = q => !q.case && !q.series;
const SERIES_NOTE = "This question is one of a series that share the same scenario. Each question in the series offers a different solution that might or might not meet the goal. A series can have more than one correct solution, or none. After you answer a question in this series, you cannot return to it, and it does not appear on the review screen.";
const HOW = {
  multi: q => `Choose ${q.answer.length}`, order: q => `Arrange ${q.answer.length} in order`,
  yesno: () => "Yes / No for each statement", dragdrop: () => "Drag and drop", dropdown: () => "Select from each list",
};

// ---------- answers ----------
function blank(q) {
  if (q.type === "yesno") return q.choices.map(() => null);
  if (q.type === "dragdrop" || q.type === "dropdown") return q.targets.map(() => null);
  return [];
}
function complete(q, p) {
  if (q.type === "single") return p.length === 1;
  if (q.type === "multi" || q.type === "order") return p.length === q.answer.length;
  return p.every(v => v !== null);
}
const answered = it => it.picked.some(v => v !== null);
// Partial credit per box/statement/selection, like the real exam; build lists are all-or-nothing.
function grade(q, p) {
  if (q.type === "single") return +(p[0] === q.answer[0]);
  if (q.type === "multi") return p.filter(x => q.answer.includes(x)).length / q.answer.length;
  if (q.type === "order") return +(p.length === q.answer.length && p.every((x, i) => x === q.answer[i]));
  if (q.type === "yesno") return p.filter((v, i) => v === q.answer.includes(i)).length / p.length;
  return p.filter((v, i) => v === q.answer[i]).length / p.length; // dragdrop, dropdown
}
const item = q => ({ q, order: !q.choices ? [] : q.series ? [0, 1] : shuffle(q.choices.map((_, i) => i)), picked: blank(q), checked: false, locked: false, mark: false });

// ---------- home ----------
let S = null, tick = null;
window.onbeforeunload = () => (S && S.mode === "exam" && !S.done ? true : undefined);

function home() {
  clearInterval(tick); S = null;
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all", ...store.get(KEY + ".cfg", {}) };
  const types = Object.entries(Q.reduce((a, q) => (a[q.case ? "case" : q.series ? "series" : q.type] = (a[q.case ? "case" : q.series ? "series" : q.type] || 0) + 1, a), {}));
  $app.innerHTML = `
  <div class="card">
    <h2>New session</h2>
    <fieldset><legend>Mode</legend><select id="mode">
      <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Practice (instant feedback)</option>
      <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Exam (feedback at the end)</option>
      <option value="sim" ${cfg.mode === "sim" ? "selected" : ""}>Exam simulation (50 questions, 100 minutes)</option>
    </select>
    <p class="muted" id="simnote">Exam simulation ignores the filters below: questions are weighted by the study-guide domain percentages and include a problem-solution series and a case study in their own sections. No objective or difficulty hints, a countdown timer, mark for review, and a review screen per section. Once you leave a section you cannot return to it.</p>
    </fieldset>
    <div id="filters">
    <fieldset><legend>Domains</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} questions)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Difficulty</legend><div class="row">
      ${[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Question pool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> All</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Not seen yet</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Previously wrong (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Questions</legend><select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></fieldset>
    </div>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Progress on this device</h2>
    <p>${seen} of ${Q.length} questions answered, ${seen - wrong} last correct, ${wrong} last wrong.</p>
    ${statsTable()}
    <p class="muted">Question types: ${types.map(([t, n]) => `${t} ${n}`).join(", ")}.</p>
    <div class="actions"><button class="ghost" id="reset" type="button">Reset progress</button></div>
  </div>`;
  const mode = document.getElementById("mode"), sync = () => {
    document.getElementById("filters").hidden = mode.value === "sim";
    document.getElementById("simnote").hidden = mode.value !== "sim";
  };
  mode.onchange = sync; sync();
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all progress?")) { history = {}; store.set(KEY + ".history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domain</th><th>Done</th><th>Correct</th></tr>${rows}</table>`;
}

// keep case-study and series questions together, in id order, at the position of their first member
function grouped(qs) {
  const g = new Map();
  qs.forEach(q => { const k = q.case || q.series || q.id; if (!g.has(k)) g.set(k, []); g.get(k).push(q); });
  return [...g.values()].flatMap(xs => xs.sort((a, b) => a.id.localeCompare(b.id)));
}

function simSections() {
  const caseIds = [...new Set(Q.filter(q => q.case).map(q => q.case))];
  const seriesIds = [...new Set(Q.filter(q => q.series).map(q => q.series))];
  const cs = caseIds.length ? grouped(Q.filter(q => q.case === pick(caseIds))) : [];
  const sr = seriesIds.length ? grouped(Q.filter(q => q.series === pick(seriesIds))) : [];
  const n = 50 - cs.length - sr.length;
  // domain share = midpoint of the study-guide weight range, largest remainder rounding
  const w = Object.entries(DOMAINS).map(([k, d]) => { const [a, b] = d.weight.match(/\d+/g).map(Number); return [k, (a + (b ?? a)) / 2]; });
  const tot = w.reduce((s, [, x]) => s + x, 0);
  const cnt = w.map(([k, x]) => ({ k, c: Math.floor(n * x / tot), r: (n * x / tot) % 1 }));
  [...cnt].sort((a, b) => b.r - a.r).slice(0, n - cnt.reduce((s, x) => s + x.c, 0)).forEach(x => x.c++);
  const std = shuffle(cnt.flatMap(({ k, c }) => shuffle(Q.filter(q => isStd(q) && dom(q) === k)).slice(0, c)));
  return [["std", std], ["series", sr], ["case", cs]].filter(([, xs]) => xs.length);
}

function start() {
  const mode = document.getElementById("mode").value;
  let secs;
  if (mode === "sim") {
    store.set(KEY + ".cfg", { ...store.get(KEY + ".cfg", {}), mode });
    secs = simSections();
  } else {
    const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
    const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode };
    store.set(KEY + ".cfg", cfg);
    let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
    if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
    if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
    if (!pool.length) { document.getElementById("msg").textContent = "No questions match this selection."; return; }
    secs = [["std", grouped(shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n))]];
  }
  const items = [], sections = [];
  secs.forEach(([kind, qs]) => { sections.push({ kind, start: items.length, end: items.length + qs.length }); items.push(...qs.map(item)); });
  S = { mode: mode === "practice" ? "practice" : "exam", sim: mode === "sim", items, secs: sections, sec: 0, i: 0, tab: 0, sel: null, t0: Date.now() };
  if (S.sim) {
    S.deadline = Date.now() + 100 * 60000;
    tick = setInterval(() => {
      const left = S.deadline - Date.now(), el = document.getElementById("clock");
      if (left <= 0) { alert("Time is up. Your exam is submitted."); return finish(); }
      if (el) el.textContent = clock(left);
    }, 1000);
    return intro();
  }
  show();
}
const clock = ms => { const s = Math.ceil(ms / 1000); return `Time left ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const clockChip = () => S.deadline ? `<span class="chip clock" id="clock">${clock(S.deadline - Date.now())}</span>` : "";

function intro() {
  const sec = S.secs[S.sec], n = sec.end - sec.start;
  const text = {
    std: `This section contains ${n} questions. You can move back and forth, mark questions for review, and change your answers until you finish the section. When you finish it, you cannot return to it.`,
    series: `This section contains a problem-solution series of ${n} questions. ${SERIES_NOTE}`,
    case: `This section contains a case study with ${n} questions. Each question uses the same scenario; use the tabs to read the parts of the case study. You can move between the questions of this case study until you finish the section.`,
  }[sec.kind];
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Section ${S.sec + 1} of ${S.secs.length}</span>${clockChip()}</div>
    <h2>${{ std: "Questions", series: "Problem-solution series", case: "Case study" }[sec.kind]}</h2>
    <p>${esc(text)}</p>
    ${S.sec === 0 ? `<p class="muted">${S.items.length} questions in total, 100 minutes. Passing score: 700 on a scale of 1 to 1000.</p>` : ""}
    <div class="actions"><button id="go" type="button">Start section</button></div></div>`;
  document.getElementById("go").onclick = () => { S.i = sec.start; S.tab = 0; show(); };
}

// ---------- question ----------
function casePanel(id) {
  const c = CASES[id]; if (!c) return "";
  const t = Math.min(S.tab, c.sections.length - 1);
  return `<details class="case" ${S.caseClosed ? "" : "open"}><summary><strong>Case study: ${esc(c.title)}</strong></summary>
    <div class="tabs">${c.sections.map(([h], k) => `<button type="button" class="ghost sm" data-tab="${k}" aria-pressed="${k === t}">${esc(h)}</button>`).join("")}</div>
    <div class="case-body">${md(c.sections[t][1])}</div></details>`;
}

function sel(it, i, lock, reveal) {
  const q = it.q, t = q.targets[i], p = it.picked;
  const cls = reveal ? (p[i] === q.answer[i] ? "correct" : "wrong") : "";
  return `<select data-t="${i}" class="${cls}" ${lock ? "disabled" : ""} aria-label="Box ${i + 1}"><option value="">Select...</option>${t.options.map((o, k) => `<option value="${k}" ${p[i] === k ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

function stemHTML(it, lock, reveal) {
  const h = md(it.q.stem);
  return it.q.type === "dropdown" ? h.replace(/\[\[(\d+)\]\]/g, (_, n) => sel(it, n - 1, lock, reveal)) : h;
}

function answerHTML(it, lock, reveal) {
  const q = it.q, p = it.picked, dis = lock ? "disabled" : "", drag = !lock;
  switch (q.type) {
    case "single": case "multi": {
      const multi = q.type === "multi";
      return `<div>${it.order.map(ci => {
        const cls = reveal ? (q.answer.includes(ci) ? "correct" : p.includes(ci) ? "wrong" : "") : "";
        return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" data-c="${ci}" ${dis} ${p.includes(ci) ? "checked" : ""}>
          <span>${inline(q.choices[ci])}${reveal ? why(q.rationale[ci]) : ""}</span></label>`;
      }).join("")}</div>`;
    }
    case "yesno":
      return `<table class="yn"><tr><th>Statement</th><th>Yes</th><th>No</th></tr>${q.choices.map((s, i) => {
        const cls = reveal ? (p[i] === q.answer.includes(i) ? "correct" : "wrong") : "";
        return `<tr class="${cls}"><td>${inline(s)}${reveal ? why(q.rationale[i]) : ""}</td>${[1, 0].map(v => `<td><input type="radio" name="yn${i}" data-i="${i}" data-v="${v}" aria-label="${v ? "Yes" : "No"}: statement ${i + 1}" ${dis} ${p[i] === !!v ? "checked" : ""}></td>`).join("")}</tr>`;
      }).join("")}</table>`;
    case "order": {
      const tile = (ci, k) => {
        const cls = reveal ? (q.answer[k] === ci ? "correct" : "wrong") : "";
        return `<div class="tile ${cls}" draggable="${drag}" data-c="${ci}" ${k === undefined && !lock ? `tabindex="0" role="button"` : ""}>
          ${k === undefined ? "" : `<span class="num">${k + 1}.</span>`}<span class="txt">${inline(q.choices[ci])}</span>
          ${k === undefined || lock ? "" : `<span class="tools"><button type="button" class="ghost sm" data-up="${k}" aria-label="Move up">&uarr;</button><button type="button" class="ghost sm" data-down="${k}" aria-label="Move down">&darr;</button><button type="button" class="ghost sm" data-rm="${k}" aria-label="Remove">&times;</button></span>`}</div>`;
      };
      return `<div class="dd">
        <div><div class="lbl">Actions</div><div class="zone pool" data-zone="pool">${it.order.filter(ci => !p.includes(ci)).map(ci => tile(ci)).join("")}</div></div>
        <div><div class="lbl">Answer area</div><div class="zone area" data-zone="area">${p.map((ci, k) => tile(ci, k)).join("")}</div></div></div>
        ${lock ? "" : `<p class="muted">Click or drag an action into the answer area, then use the arrows to put it in order.</p>`}
        ${reveal ? `<div class="lbl">Correct sequence</div><ol>${q.answer.map(ci => `<li>${inline(q.choices[ci])}${why(q.rationale[ci])}</li>`).join("")}</ol>
          <div class="lbl">Not part of the sequence</div><ul>${q.choices.map((c, ci) => q.answer.includes(ci) ? "" : `<li>${inline(c)}${why(q.rationale[ci])}</li>`).join("")}</ul>` : ""}`;
    }
    case "dragdrop":
      return `<div class="lbl">Values</div><div class="zone pool flat">${it.order.map(ci => `<div class="tile ${S.sel === ci ? "sel" : ""}" draggable="${drag}" data-c="${ci}" ${lock ? "" : `tabindex="0" role="button"`}><span class="txt">${inline(q.choices[ci])}</span></div>`).join("")}</div>
        <div class="lbl">Answer area</div><table>${q.targets.map((t, i) => {
          const ok = p[i] === q.answer[i], cls = reveal ? (ok ? "correct" : "wrong") : "";
          return `<tr><td>${inline(t)}</td><td><div class="slot ${cls}" data-t="${i}" ${lock ? "" : `tabindex="0" role="button"`}>${p[i] === null ? `<span class="muted">${lock ? "(empty)" : "Click a value, then click here"}</span>` : inline(q.choices[p[i]])}</div>
            ${reveal ? why((ok ? "" : `Answer: ${q.choices[q.answer[i]]}. `) + q.rationale[i]) : ""}</td></tr>`;
        }).join("")}</table>
        ${lock ? "" : `<p class="muted">Each value may be used once, more than once, or not at all.</p>`}
        ${reveal ? `<div class="lbl">About each value</div><ul>${q.choices.map((c, ci) => `<li><strong>${inline(c)}</strong>${why(q.notes[ci])}</li>`).join("")}</ul>` : ""}`;
    case "dropdown": {
      const inStem = q.stem.includes("[[1]]");
      if (inStem && !reveal) return "";
      return `<table>${q.targets.map((t, i) => {
        const ok = p[i] === q.answer[i];
        return `<tr><td>${inStem ? `Box ${i + 1}` : inline(t.label)}</td><td>${inStem ? "" : sel(it, i, lock, reveal)}
          ${reveal ? `<div class="why"><span class="${ok ? "ok" : "bad"}">${ok ? "Your answer is correct" : p[i] === null ? "No answer" : "Your answer is incorrect"}</span>
            <ul>${t.options.map((o, k) => `<li class="${k === q.answer[i] ? "ok" : k === p[i] ? "bad" : ""}"><code>${esc(o)}</code>: ${inline(t.why[k])}</li>`).join("")}</ul></div>` : ""}</td></tr>`;
      }).join("")}</table>`;
    }
  }
  return "";
}

function bindAnswer(it, lock) {
  if (lock) return;
  const q = it.q, p = it.picked, redraw = () => show(true);
  $$("input[data-c]").forEach(b => b.onchange = () => {
    const ci = +b.dataset.c;
    if (q.type === "single") it.picked = [ci];
    else if (b.checked) { if (p.length < q.answer.length) p.push(ci); } else p.splice(p.indexOf(ci), 1);
    redraw();
  });
  $$("input[data-i]").forEach(b => b.onchange = () => { p[+b.dataset.i] = b.dataset.v === "1"; redraw(); });
  $$("select[data-t]").forEach(s => s.onchange = () => { p[+s.dataset.t] = s.value === "" ? null : +s.value; redraw(); });
  $$(".tile[draggable=true]").forEach(t => t.ondragstart = e => e.dataTransfer.setData("text/plain", t.dataset.c));
  $$("[tabindex][role=button]").forEach(el => el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } });
  const zone = (el, drop) => { el.ondragover = e => e.preventDefault(); el.ondrop = e => { e.preventDefault(); drop(+e.dataTransfer.getData("text/plain"), e); redraw(); }; };
  if (q.type === "order") {
    $$(".pool .tile").forEach(t => t.onclick = () => { if (p.length < q.answer.length) { p.push(+t.dataset.c); redraw(); } });
    $$("[data-up]").forEach(b => b.onclick = () => { const k = +b.dataset.up; if (k > 0) [p[k - 1], p[k]] = [p[k], p[k - 1]]; redraw(); });
    $$("[data-down]").forEach(b => b.onclick = () => { const k = +b.dataset.down; if (k < p.length - 1) [p[k + 1], p[k]] = [p[k], p[k + 1]]; redraw(); });
    $$("[data-rm]").forEach(b => b.onclick = () => { p.splice(+b.dataset.rm, 1); redraw(); });
    $$("[data-zone=area]").forEach(z => zone(z, (ci, e) => {
      const from = p.indexOf(ci);
      if (from >= 0) p.splice(from, 1); else if (p.length >= q.answer.length) return;
      const li = e.target.closest(".tile[data-c]"), at = li ? p.indexOf(+li.dataset.c) : -1;
      p.splice(at < 0 ? p.length : at, 0, ci);
    }));
    $$("[data-zone=pool]").forEach(z => zone(z, ci => { const k = p.indexOf(ci); if (k >= 0) p.splice(k, 1); }));
  }
  if (q.type === "dragdrop") {
    $$(".pool .tile").forEach(t => t.onclick = () => { S.sel = S.sel === +t.dataset.c ? null : +t.dataset.c; redraw(); });
    $$(".slot").forEach(s => {
      s.onclick = () => { p[+s.dataset.t] = S.sel ?? null; S.sel = null; redraw(); };
      zone(s, ci => { p[+s.dataset.t] = ci; S.sel = null; });
    });
  }
}

function show(keep) {
  const it = S.items[S.i], q = it.q, sec = S.secs[S.sec], practice = S.mode === "practice";
  const lock = practice ? it.checked : it.locked, reveal = practice && it.checked;
  const levels = { easy: "Easy", medium: "Medium", hard: "Hard" };
  const prog = practice ? S.i / S.items.length : S.items.filter(answered).length / S.items.length;
  $app.innerHTML = `
  <div class="bar"><div style="width:${100 * prog}%"></div></div>
  <div class="card">
    <div class="chips">
      <span class="chip">Question ${S.i + 1} of ${S.items.length}</span>
      ${S.sim ? "" : `<span class="chip">${q.obj} ${esc(OBJ[q.obj])}</span><span class="chip ${q.difficulty}">${levels[q.difficulty]}</span>`}
      ${HOW[q.type] && !q.series ? `<span class="chip">${HOW[q.type](q)}</span>` : ""}
      ${it.mark ? `<span class="chip">Marked for review</span>` : ""}
      ${clockChip()}
    </div>
    ${q.case ? casePanel(q.case) : ""}
    ${q.series ? `<div class="note">${esc(SERIES_NOTE)}</div>` : ""}
    <div class="stem">${stemHTML(it, lock, reveal)}</div>
    ${answerHTML(it, lock, reveal)}
    ${reveal ? feedback(it) : ""}
    <div class="actions">${practice ? navPractice(it) : navExam(it, sec)}</div>
  </div>`;
  bindAnswer(it, lock);
  $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = +b.dataset.tab; show(true); });
  $$("details.case").forEach(d => d.ontoggle = () => { S.caseClosed = !d.open; });
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  on("prev", () => { S.i--; S.sel = null; show(); });
  on("check", () => {
    it.score = grade(q, it.picked); it.checked = true;
    history[q.id] = it.score === 1; store.set(KEY + ".history", history);
    show(true);
  });
  on("next", () => {
    if (q.series && !practice) it.locked = true;
    S.sel = null;
    if (S.i + 1 < sec.end) { S.i++; return show(); }
    if (practice) return result();
    sec.kind === "series" ? endSection() : review();
  });
  on("mark", () => { it.mark = !it.mark; show(true); });
  on("review", review);
  on("quit", () => {
    if (practice) return S.review || !S.items.some(x => x.checked) ? home() : result();
    if (confirm("End the exam now? Unanswered questions count as incorrect.")) finish();
  });
  if (!keep) window.scrollTo(0, 0);
}

function navPractice(it) {
  const last = S.i + 1 === S.items.length;
  return `${S.i > 0 ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    ${it.checked ? `<button id="next" type="button">${last ? (S.review ? "Done" : "Results") : "Next"}</button>`
      : `<button id="check" type="button" ${complete(it.q, it.picked) ? "" : "disabled"}>Check</button><button class="ghost" id="next" type="button">Skip</button>`}
    <button class="ghost" id="quit" type="button">${S.review ? "Close review" : "Stop"}</button>`;
}

function navExam(it, sec) {
  const series = sec.kind === "series" || it.q.series, last = S.i + 1 === sec.end;
  const prevOk = S.i > sec.start && !series && !S.items[S.i - 1].locked;
  return `${prevOk ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    <button id="next" type="button">${!last ? "Next" : series ? (S.sec + 1 < S.secs.length ? "Next section" : "Finish exam") : "Review"}</button>
    ${series ? "" : `<button class="ghost" id="mark" type="button" aria-pressed="${it.mark}">Mark for review</button><button class="ghost" id="review" type="button">Review screen</button>`}
    <button class="ghost" id="quit" type="button">End exam</button>`;
}

function review() {
  const sec = S.secs[S.sec], idx = [];
  for (let i = sec.start; i < sec.end; i++) if (!S.items[i].q.series) idx.push(i);
  const open = idx.filter(i => !answered(S.items[i])).length, marked = idx.filter(i => S.items[i].mark).length;
  const lastSec = S.sec + 1 === S.secs.length;
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Review screen${S.secs.length > 1 ? ` -- section ${S.sec + 1} of ${S.secs.length}` : ""}</span>${clockChip()}</div>
    <p>${idx.length - open} answered, ${open} unanswered, ${marked} marked for review. Select a question to return to it.</p>
    <div class="rv">${idx.map(i => { const x = S.items[i]; return `<button class="ghost" type="button" data-go="${i}">Question ${i + 1}<br><span class="muted">${answered(x) ? "Answered" : "Unanswered"}${x.mark ? ", marked" : ""}</span></button>`; }).join("")}</div>
    <div class="actions">
      <button id="endsec" type="button">${lastSec ? "Submit exam" : "Finish section"}</button>
      <button class="ghost" id="back" type="button">Return to question ${S.i + 1}</button>
    </div></div>`;
  $$("[data-go]").forEach(b => b.onclick = () => { S.i = +b.dataset.go; S.tab = 0; show(); });
  document.getElementById("back").onclick = () => show();
  document.getElementById("endsec").onclick = () => {
    const msg = (open ? `${open} question(s) are unanswered. ` : "") + (lastSec ? "Submit the exam?" : "After you finish this section, you cannot return to it. Continue?");
    if (confirm(msg)) endSection();
  };
  window.scrollTo(0, 0);
}

function endSection() {
  const sec = S.secs[S.sec];
  for (let i = sec.start; i < sec.end; i++) S.items[i].locked = true;
  if (++S.sec >= S.secs.length) return finish();
  S.sim ? intro() : (S.i = S.secs[S.sec].start, show());
}

function finish() {
  clearInterval(tick); S.done = true;
  S.items.forEach(it => {
    it.score = grade(it.q, it.picked); it.checked = true;
    if (answered(it)) history[it.q.id] = it.score === 1;
  });
  store.set(KEY + ".history", history);
  result();
}

function feedback(it) {
  const q = it.q, s = it.score;
  return `<p class="verdict ${s === 1 ? "ok" : "bad"}">${s === 1 ? "Correct!" : s > 0 ? `Partially correct (${Math.round(100 * s)}%).` : "Incorrect."}</p>
    <div>${md(q.explanation)}</div>
    <p class="muted">Source: <a href="${esc(q.ref)}" target="_blank" rel="noopener">${esc(q.ref.replace("https://", ""))}</a></p>`;
}

function result() {
  clearInterval(tick);
  const xs = S.mode === "practice" ? S.items.filter(x => x.checked) : S.items;
  const pts = xs.reduce((s, x) => s + x.score, 0), pct = xs.length ? Math.round(100 * pts / xs.length) : 0;
  const per = Object.entries(DOMAINS).map(([k, d]) => {
    const ds = xs.filter(x => dom(x.q) === k); if (!ds.length) return "";
    const g = ds.reduce((s, x) => s + x.score, 0);
    return `<tr><td>${esc(d.title)}</td><td>${+g.toFixed(1)}/${ds.length}</td><td>${Math.round(100 * g / ds.length)}%</td></tr>`;
  }).join("");
  const wrong = xs.filter(x => x.score < 1), mins = Math.round((Date.now() - S.t0) / 60000);
  $app.innerHTML = `
  <div class="card">
    <h2>Results</h2>
    <div class="big">${pct}%</div>
    <p>${+pts.toFixed(1)} of ${xs.length} points${S.sim ? `, ${mins} minutes used` : ""}. Multi-part questions earn partial credit.
      ${pct >= 70 ? "Around passing level." : "Below passing level."} <span class="muted">The real exam reports a scaled score where 700 of 1000 passes; that is not exactly 70% correct.</span></p>
    <table><tr><th>Domain</th><th>Points</th><th>%</th></tr>${per}</table>
    <div class="actions">
      ${wrong.length ? `<button id="rwrong" type="button">Review ${wrong.length} mistakes</button>` : ""}
      <button class="ghost" id="rall" type="button">Review all</button>
      <button class="ghost" id="home" type="button">New session</button>
    </div>
  </div>`;
  const rev = list => { S = { mode: "practice", review: true, items: list, secs: [{ kind: "std", start: 0, end: list.length }], sec: 0, i: 0, tab: 0, sel: null }; show(); };
  document.getElementById("home").onclick = home;
  document.getElementById("rall").onclick = () => rev(xs);
  const rw = document.getElementById("rwrong"); if (rw) rw.onclick = () => rev(wrong);
}

home();
</script>
</body>
</html>
