<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCDV-F Exam Buddy</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6573; --line: #dde1e6;
  --accent: #0b63ce; --accent-text: #ffffff; --ok: #1a7f37; --ok-bg: #e6f4ea; --bad: #c62828; --bad-bg: #fdecea;
  --code-bg: #f0f2f5; --chip: #eef2f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
    --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
    --code-bg: #0c0f13; --chip: #242a32;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
  --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
  --code-bg: #0c0f13; --chip: #242a32;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; overflow-wrap: anywhere; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.muted { color: var(--muted); font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
label.opt { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
legend { font-weight: 600; margin-bottom: 8px; }
button, select { font: inherit; }
button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button.sm { padding: 2px 9px; font-weight: 500; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, .choice:focus-within, select:focus-visible, .tile:focus-visible, .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); max-width: 100%; }
pre select { font: inherit; padding: 0 4px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
.chip.easy { color: var(--ok); } .chip.hard { color: var(--bad); } .chip.clock { color: var(--text); font-weight: 600; }
.stem p { margin: 0 0 10px; }
pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; overflow-wrap: normal; font-size: .85rem; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0; cursor: pointer; }
.choice input { margin-top: 4px; }
.correct { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
.wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.why { font-size: .9rem; color: var(--muted); margin-top: 4px; }
.verdict { font-weight: 700; margin: 12px 0 4px; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.bar > div { height: 100%; background: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { min-width: 64px; }
table.yn td:not(:first-child), table.yn th:not(:first-child) { text-align: center; width: 56px; }
.big { font-size: 2.2rem; font-weight: 700; }
a { color: var(--accent); }
.lbl { font-weight: 600; margin: 14px 0 6px; }
.dd { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .dd { grid-template-columns: 1fr; } }
.zone { min-height: 60px; border: 1px dashed var(--line); border-radius: 10px; padding: 6px; background: var(--bg); }
.pool.flat { display: flex; flex-wrap: wrap; gap: 6px; }
.pool.flat .tile { margin: 0; }
.tile { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--card); cursor: grab; }
.tile.sel { outline: 2px solid var(--accent); }
.tile .num { font-weight: 600; flex: none; }
.tile .txt { flex: 1; }
.tools { display: flex; gap: 4px; flex: none; }
.slot { min-height: 40px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px; cursor: pointer; background: var(--bg); }
.case { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; background: var(--bg); }
.case summary { cursor: pointer; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.case-body { max-height: 55vh; overflow: auto; }
.case-body p { margin: 0 0 10px; }
.note { border-left: 4px solid var(--accent); padding: 8px 12px; background: var(--chip); border-radius: 6px; margin-bottom: 12px; font-size: .9rem; }
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.rv button { text-align: left; font-weight: 500; }
:root { --accent: #c2410c; --accent-text: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #f59e6c; --accent-text: #0b0d10; } }
:root[data-theme="dark"] { --accent: #f59e6c; --accent-text: #0b0d10; }
</style>
</head>
<body>
<main>
  <header>
    <h1>CCDV-F Exam Buddy</h1>
    <button class="ghost" id="theme" type="button" aria-label="Toggle light/dark theme">Theme</button>
  </header>
  <div id="banner"></div>
  <div id="app"></div>
  <p class="muted">Questions based on the official CCDV-F study guide (Claude Certified Developer - Foundations). Not real exam questions.</p>
</main>
<script>
const DATA = {"exam":{"id":"CCDV-F","title":"Claude Certified Developer - Foundations","notice":"Unofficial practice questions. Anthropic's certification exams are built differently from the Microsoft exams (their own scenario formats, and Anthropic does not publish a free study guide), so these questions are less realistic than the Microsoft ones. Use them to learn the concepts, not to predict the exam.","contentDate":"2026-11"},"domains":{"1":{"title":"Agents & Workflows","weight":"14.7%"},"2":{"title":"Applications & Integration","weight":"33.1%"},"3":{"title":"Claude Code","weight":"3.1%"},"4":{"title":"Evaluation, Testing & Debugging","weight":"2.6%"},"5":{"title":"Model Selection & Optimization","weight":"16.8%"},"6":{"title":"Prompt & Context Engineering","weight":"11%"},"7":{"title":"Security & Safety","weight":"8.1%"},"8":{"title":"Tools & MCPs","weight":"10.6%"}},"objectives":{"1.1.1":"Choose between a workflow and an agent","1.1.2":"Build agents with multi-turn tool loops, the Claude Agent SDK and custom harnesses","1.1.3":"Orchestrate subagents and decompose tasks programmatically or with model-driven decomposition","1.1.4":"Enforce irreversible actions deterministically and choose between self-hosted and Anthropic-hosted deployment","2.1.1":"Use the Claude API: messages, streaming, vision and extended thinking","2.1.2":"Invoke Claude through the Anthropic API, Amazon Bedrock and Google Vertex AI, including authentication and model identifiers","2.1.3":"Apply software-engineering basics: REST, JSON, async code, version control and code review","2.1.4":"Manage configuration: CLAUDE.md, settings.json, model version pinning and plugin dependencies","3.1.1":"Describe Claude Code components (rules, skills, commands, agents, memory) and the CLAUDE.md hierarchy","3.1.2":"Use sessions, slash commands and headless mode, including in CI pipelines","4.1.1":"Classify error types and choose a recovery strategy","4.1.2":"Trace failures to the integration layer or to the model output","4.1.3":"Build representative evaluation sets and read per-category versus aggregate accuracy","5.1.1":"Explain LLM fundamentals: tokens, context windows, sampling and non-determinism","5.1.2":"Choose between Opus, Sonnet and Haiku and route requests between models","5.1.3":"Manage token budgets and cost, including prompt caching with its time to live and minimum size","5.1.4":"Choose between the Batches API and synchronous requests","6.1.1":"Structure system prompts using clear instructions, XML tags and few-shot examples","6.1.2":"Manage the context window with pruning, compaction and subagent isolation","6.1.3":"Produce and validate structured output and parse responses defensively","7.1.1":"Mitigate prompt injection and handle untrusted input","7.1.2":"Limit the blast radius with least-privilege tool scope, hooks and guardrails","7.1.3":"Protect secrets and API keys and prevent leakage of personal data","8.1.1":"Write tool definitions and descriptions, distinguish client and server tools, and use tool_choice","8.1.2":"Handle tool errors, including the MCP isError flag","8.1.3":"Build and scope MCP servers (resources, prompts, stdio and remote transports) and choose between built-in tools, custom tools, Skills and MCP"},"questions":[{"id":"1.1.1-01","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. builds an application that processes supplier contracts. Every contract goes through the same three steps in the same order: extract the clauses, check each clause against a policy checklist, and write a summary for the legal team. The steps are known in advance and the output of each step feeds the next.\n\nWhich design should you use?","choices":["An autonomous agent that decides its own steps in a tool loop","A prompt chaining workflow in which application code makes one Claude call per step","An orchestrator-workers workflow in which a lead model creates subtasks at runtime","A routing workflow that classifies each contract and sends it to a specialized prompt"],"answer":[1],"explanation":"Prompt chaining fits a task that decomposes into fixed, sequential steps, where each call processes the output of the previous one and the code controls the path. An autonomous agent or orchestrator-workers would add cost and latency for flexibility that is not needed here. Routing is right when inputs fall into distinct categories that need different handling, not when every input follows the same steps.","ref":"https://www.anthropic.com/research/building-effective-agents"},{"id":"1.1.1-02","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank wants an assistant that investigates failed payment reports. Each report needs a different investigation: the assistant may query several internal systems, read logs, and follow up on what it finds, so the number of steps cannot be known in advance. A human reviews the final report, and the team accepts higher latency and cost in return for better results.\n\nWhich approach should you use?","choices":["A prompt chain with a fixed sequence of prompts","A parallelization workflow that runs the same prompt several times and votes","An agent in which the model directs its own tool use in a loop","A routing workflow that sends each report to one of several fixed prompts"],"answer":[2],"explanation":"Workflows follow predefined code paths, while an agent lets the model decide its own steps and tool use, which suits open-ended problems where the number of steps cannot be predicted. The stem states both conditions for choosing an agent: unpredictable steps and acceptance of higher cost and latency. A fixed chain, voting, or routing would hard-code a path that these investigations do not follow.","ref":"https://www.anthropic.com/research/building-effective-agents"},{"id":"1.1.1-03","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Litware, Inc. runs a customer-issue process as a fixed workflow and is considering replacing it with an autonomous agent. Leadership asks you to confirm that the task really calls for an agent.\n\nWhich two conditions should you confirm before choosing an agent over a workflow? Each correct answer presents part of the solution.","choices":["The number of steps needed cannot be predicted from the input","The same ordered steps apply to every input","A single call with retrieval and examples already meets the accuracy target","Responses must return within a fixed, low latency budget","The value of a better result justifies higher cost and latency"],"answer":[0,4],"explanation":"An agent suits open-ended problems where the path cannot be hard-coded, and its autonomy trades higher cost and latency for better task performance, so both conditions must hold. Identical steps for every input, a tight latency budget, or a single call that already meets the target all point to a workflow or an optimized single call instead.","ref":"https://www.anthropic.com/research/building-effective-agents"},{"id":"1.1.1-04","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Tailspin Toys has a support assistant that answers product questions from a 40-page manual. Each question is answered in one step from passages of the manual, latency must stay low, and a pilot that uses retrieval and a few examples in a single call already meets the accuracy target.\n\nWhich design should you use?","choices":["An autonomous agent with search tools that loops until it is satisfied","An orchestrator-workers workflow that splits each question into subtasks","A prompt chain with a draft step and a separate review step","A single call to Claude with retrieved passages and in-context examples"],"answer":[3],"explanation":"Anthropic advises to start with the simplest solution and add complexity only when it measurably helps; optimizing a single call with retrieval and examples is often enough. The pilot already meets the accuracy target and latency must stay low, so an agent, orchestrator-workers, or an extra chained step would add cost and delay with no benefit. A chain would become right if a measured accuracy gap needed a review step.","ref":"https://www.anthropic.com/research/building-effective-agents"},{"id":"1.1.2-01","obj":"1.1.2","difficulty":"easy","type":"single","stem":"Northwind Traders writes its own agent loop on the Messages API in Python. The loop sends the conversation to Claude and, in testing, stops after the first response even when Claude asks to run a tool. The loop must keep running tools until Claude has finished its work.\n\nWhich condition should the loop use to decide to continue?","choices":["The response stop_reason is \"end_turn\"","The response stop_reason is \"tool_use\"","The response content contains a text block","The response stop_reason is \"max_tokens\""],"answer":[1],"explanation":"When stop_reason is tool_use, Claude has requested a tool: the harness runs it, returns a tool_result, and calls the API again. The loop exits on end_turn, which means Claude completed its response. A text block is not a reliable signal because Claude often writes text next to a tool_use block, and max_tokens means the output was truncated rather than that a tool is requested.","ref":"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"},{"id":"1.1.2-02","obj":"1.1.2","difficulty":"medium","type":"single","stem":"Adventure Works Cycles runs a custom tool loop on the Messages API. When a database tool raises an exception because Claude supplied an invalid date format, the harness catches the exception and sends the next request without a tool_result for that tool_use block, and the API returns a 400 error. The team wants Claude to see why the call failed so that it can correct its arguments.\n\nWhich action should you take in the harness?","choices":["Return a tool_result for that tool_use id with is_error set to true and the error text","Send a plain user message that describes the exception instead of a tool_result","Delete the failed tool_use block from the history and resend the request","Rerun the tool with default arguments and return that result as a success"],"answer":[0],"explanation":"Every tool_use block needs a matching tool_result, and setting is_error to true tells Claude the call failed so it can try again with corrected arguments; the loop should also cap the number of retries. A plain message leaves the tool_use unanswered and triggers the 400 error. Deleting the block or silently substituting default arguments hides the failure from Claude, so it cannot correct the date format.","ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"},{"id":"1.1.2-03","obj":"1.1.2","difficulty":"medium","type":"single","stem":"Proseware, Inc. wants a Python service that fixes failing unit tests. The agent must read and edit files, run shell commands, and resume earlier sessions, and the team does not want to implement tool execution or the agent loop itself.\n\nWhich option should you use?","choices":["The Messages API with a hand-written tool loop","The Batches API with one request per failing test","The Claude Agent SDK, which ships with file and shell tools","The Messages API with a tool runner that wraps your own Python functions"],"answer":[2],"explanation":"The Claude Agent SDK exposes Claude Code's agent loop, built-in tools such as Read, Edit and Bash, and session handling as a library, so the team writes neither the loop nor the tools. A hand-written loop and the tool runner both still require the team to implement the file and shell tools, and the Batches API is an asynchronous bulk interface that does not run a tool loop.","ref":"https://code.claude.com/docs/en/agent-sdk/overview"},{"id":"1.1.2-04","obj":"1.1.2","difficulty":"hard","type":"single","stem":"Wingtip Toys runs a Claude Agent SDK agent in Python to refactor a large module. A run ends with a result message whose subtype is error_max_turns after the max_turns limit is reached. The agent has already read dozens of files and made partial edits, and the team wants to continue the same work with that gathered context preserved.\n\nWhich action should you take?","choices":["Start a new query with the original prompt and no options so that the agent begins again","Raise max_tokens and rerun the same query from the beginning","Switch the permission mode to bypassPermissions and rerun the query","Resume the session by passing its session_id as the resume option with a higher max_turns"],"answer":[3],"explanation":"The result message carries the session_id even for error results, and passing it as the resume option continues the same conversation with its history, so a higher max_turns lets the agent finish. A fresh query or a rerun from the start discards the context the agent built up. max_tokens limits output length per response, not the number of turns, and the permission mode does not affect the turn limit.","ref":"https://code.claude.com/docs/en/agent-sdk/sessions"},{"id":"1.1.3-01","obj":"1.1.3","difficulty":"easy","type":"single","stem":"Lamna Healthcare Company uses a Claude Agent SDK agent to answer questions about a large repository. The main conversation fills with the contents of dozens of files that the agent reads while searching, and later answers become less focused. The lead agent needs only a short summary of each search.\n\nWhich feature should you use?","choices":["A PostToolUse hook that logs each file the agent reads","The acceptEdits permission mode","Subagents that search in their own context and return a final summary","Session resume with the resume option"],"answer":[2],"explanation":"Each subagent runs in its own fresh context window, and only its final message returns to the parent, so the intermediate file reads never enter the lead agent's context. A logging hook, a permission mode, and session resume do not reduce what the main conversation accumulates; resuming even reloads the full history.","ref":"https://code.claude.com/docs/en/agent-sdk/subagents"},{"id":"1.1.3-02","obj":"1.1.3","difficulty":"medium","type":"single","stem":"Relecloud generates a weekly operations report with exactly four sections. Each section comes from a different data source and does not depend on the other sections. The list of sections does not change, and the team wants the report finished as fast as possible.\n\nWhich decomposition should you use?","choices":["The application code defines the four tasks and runs four Claude calls in parallel","A lead model decides at runtime which subtasks to create and delegates them to workers","A single agent that writes the four sections one after another in one conversation","A prompt chain in which each section is written from the output of the previous section"],"answer":[0],"explanation":"When the subtasks are known in advance and independent, programmatic decomposition in code is simpler, cheaper and more predictable, and running the calls in parallel minimizes latency. Model-driven decomposition is meant for subtasks that cannot be listed ahead of time. Sequential writing in one conversation or a chain adds delay and unneeded coupling between sections that do not depend on each other.","ref":"https://www.anthropic.com/research/building-effective-agents"},{"id":"1.1.3-03","obj":"1.1.3","difficulty":"medium","type":"single","stem":"Alpine Ski House builds a research assistant. Users ask open-ended questions such as \"Compare the safety records of eight resort operators.\" The number of sources and the angles to research depend on the question and cannot be listed ahead of time, and the sources can be searched independently.\n\nWhich decomposition should you use?","choices":["Application code that splits every question into the same three subtasks","A lead agent that decides the subtasks at runtime and delegates them to parallel subagents","A routing workflow that picks one of several prewritten prompts","A single long prompt that lists every possible research angle"],"answer":[1],"explanation":"Orchestrator-workers with model-driven decomposition fits tasks where the subtasks depend on the input and cannot be predicted, and independent searches can run in parallel. Fixed code-defined subtasks or prewritten prompts would not adapt to a question that needs eight sources or a different set of angles, and a single prompt listing every angle cannot cover open-ended questions.","ref":"https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":"1.1.3-04","obj":"1.1.3","difficulty":"hard","type":"multi","stem":"Fabrikam, Inc. defines a read-only code-reviewer subagent for a Claude Agent SDK application in Python. The lead agent must delegate to it automatically when a user asks for a review, and the reviewer must not be able to edit files or run shell commands.\n\nWhich two actions should you take? Each correct answer presents part of the solution.","choices":["Rely on the subagent starting with a copy of the lead agent's conversation","Write a description that states when the lead agent should delegate to the reviewer","Omit the tools field so that the subagent inherits only the tools that it needs","Name the subagent code-reviewer and leave the description empty","Set the tools field of the definition to read-only tools such as Read, Grep and Glob"],"answer":[1,4],"explanation":"The lead agent chooses a subagent by matching the task against its description, so the description must say when to delegate. The tools field restricts what the subagent can use; omitting it makes the subagent inherit all available tools, which would allow edits and shell commands. A standard subagent starts with a fresh context rather than a copy of the parent conversation, so the lead must pass what it needs in the delegation prompt.","ref":"https://code.claude.com/docs/en/sub-agents"},{"id":"1.1.4-01","obj":"1.1.4","difficulty":"hard","type":"single","stem":"Woodgrove Bank runs a Claude Agent SDK agent in Python that can call a refund tool. In unattended runs the refund tool is pre-approved in allowed_tools so that no prompts appear. Policy states that any refund above a set amount must be blocked and routed to a human, and compliance requires that the block cannot be skipped through model behavior.\n\nWhich mechanism should you use?","choices":["A PreToolUse hook that returns a deny decision when the amount exceeds the limit","A canUseTool callback that rejects refunds above the limit","A system prompt rule that forbids refunds above the limit","A PostToolUse hook that reverses refunds above the limit after they run"],"answer":[0],"explanation":"A PreToolUse hook runs before every tool call, including pre-approved ones, and a deny decision blocks the call deterministically regardless of what the model decides. A canUseTool callback runs only when the permission flow reaches a prompt, so it is skipped for calls pre-approved in allowed_tools. A prompt rule is only guidance, and reversing a refund after it ran does not prevent an irreversible action.","ref":"https://code.claude.com/docs/en/agent-sdk/permissions"},{"id":"1.1.4-02","obj":"1.1.4","difficulty":"easy","type":"single","stem":"Trey Research wants a long-running, asynchronous research agent that needs bash, file, and web tools. The team has no capacity to build an agent loop, a tool execution layer, or a sandbox.\n\nWhich option should you use?","choices":["The Claude Agent SDK in containers that the team operates","Claude Managed Agents, which provides a hosted harness and sandbox","A custom harness on the Messages API with a self-managed sandbox","The Batches API with a prompt that describes each step"],"answer":[1],"explanation":"Claude Managed Agents is an Anthropic-hosted harness: Anthropic runs the agent loop, tool execution, and the sandbox, with built-in bash, file, and web tools. The Agent SDK and a custom harness are self-hosted, so the team would operate the loop and sandbox itself. The Batches API is asynchronous, but it does not run a tool loop.","ref":"https://platform.claude.com/docs/en/managed-agents/overview"},{"id":"1.1.4-03","obj":"1.1.4","difficulty":"medium","type":"single","stem":"Litware, Inc. must run its coding agent inside its own virtual network, with custom hooks and a sandbox that the security team controls. The team needs full control of the agent loop and of where it runs, and it is willing to operate the deployment itself.\n\nWhich option should you use?","choices":["Claude Managed Agents with the default cloud environment","A one-shot Messages API call per task with no tools","The Claude Agent SDK run on infrastructure that Litware operates","The Batches API with scheduled jobs"],"answer":[2],"explanation":"The Agent SDK is a library that runs in a process you operate, so you control the loop, hooks, sandbox, and network placement. Claude Managed Agents runs the harness on Anthropic-managed infrastructure, which trades control for convenience. A one-shot call without tools or scheduled batch jobs do not provide an agent loop at all.","ref":"https://code.claude.com/docs/en/agent-sdk/overview"},{"id":"2.1.1-01","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. builds a support chatbot in Python that calls the Messages API. When a user asks a follow-up question, Claude answers as if the conversation had just started. The application currently sends only the newest user message in each request.\n\nWhat should the developer change?","choices":["Add a cache_control marker to the newest user message so that the API remembers the earlier turns","Set stream to true so that the connection keeps the conversation state open between questions","Send the earlier user and assistant turns together with the new message in the messages array of every request","Increase max_tokens so that the response has room to refer back to the earlier turns"],"answer":[2],"explanation":"The Messages API is stateless, so the application must send the full conversation history, including earlier assistant turns, with each request. Prompt caching only lowers the cost of a repeated prefix; the prefix still has to be sent. Streaming changes how a response is delivered and max_tokens only caps its length, so neither gives the model any memory of earlier turns.","ref":"https://platform.claude.com/docs/en/build-with-claude/working-with-messages"},{"id":"2.1.1-02","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Adatum Corporation extracts invoice fields with the Messages API. The code ends the messages array with a prefilled assistant turn that contains an opening brace so that Claude starts a JSON object. After the team moves to a newer Claude model that no longer accepts prefilled assistant turns, requests return HTTP 400. The downstream parser requires output that is guaranteed to follow a fixed schema.\n\nWhat should the developer do?","choices":["Remove the prefill and use structured outputs to constrain the response to the JSON schema","Remove the trailing whitespace from the prefilled assistant text and resend the request","Remove the prefill and ask in the system prompt for a reply that contains just the JSON object","Keep the prefill and add a stop sequence that matches the closing brace of the object"],"answer":[0],"explanation":"Models that do not accept a prefill return a 400 error, so the prefill must be removed. Because the output must follow a schema, structured outputs are the documented replacement, since they constrain the response to the schema. A system prompt instruction does not guarantee how the response starts or that it matches a schema, the whitespace rule applies only to models that still accept a prefill, and a stop sequence does not remove the rejected turn.","ref":"https://platform.claude.com/docs/en/build-with-claude/working-with-messages"},{"id":"2.1.1-03","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Wingtip Toys adds a chat assistant to its web store. The assistant calls the Messages API without streaming, so shoppers see a blank panel until the whole answer is ready. The team wants the answer to appear word by word while Claude generates it.\n\nWhich change should the developer make?","choices":["Move the requests to the Message Batches API and poll for the finished answer","Set stream to true and render the text of each text_delta event as it arrives","Add cache_control to the system prompt so that the answer is returned from the cache","Lower max_tokens so that each request returns before the shopper notices a delay"],"answer":[1],"explanation":"Setting stream to true returns server-sent events, and the generated text arrives in content_block_delta events whose delta type is text_delta, which the UI can render immediately. The Message Batches API processes requests asynchronously and returns results later, so it does not suit an interactive chat. Prompt caching reduces the cost of repeated input and a lower max_tokens only truncates the answer; neither makes partial text available early.","ref":"https://platform.claude.com/docs/en/build-with-claude/streaming"},{"id":"2.1.1-04","obj":"2.1.1","difficulty":"medium","type":"multi","stem":"Fabrikam, Inc. streams Claude responses to a web client. During a busy period, some streams end with an overloaded_error event even though the API had already returned HTTP 200. The current code checks only the HTTP status when the stream opens, so users see half-finished answers and no error.\n\nWhich two actions should the developer take? Each correct answer presents part of the solution.","choices":["Treat the 200 status returned when the stream opened as proof that the whole response succeeded","Handle errors that surface while the stream is being read, because an error can arrive after a 200 status","Discard the partial text, because content received before an error cannot be reused in a later request","Capture the partial response received before the failure and use it to build a continuation request","Send the same request again with stream set to false, because a non-streaming request cannot return an overloaded_error"],"answer":[1,3],"explanation":"An error can occur after the API returns 200, and the SDK surfaces it as an exception to the code that reads the stream, so that code must handle it. Keeping the partial response lets the application send a continuation request instead of reprocessing everything; tool_use and thinking blocks cannot be partially recovered. Trusting the initial status misses mid-stream errors, discarding partial text wastes recoverable work, and non-streaming requests can also return an overloaded error as HTTP 529.","ref":"https://platform.claude.com/docs/en/build-with-claude/streaming"},{"id":"2.1.1-05","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders sends scanned receipts, stored as JPEG files on a private file server, to Claude through the Messages API on the Claude API. Each request must be self-contained: the team wants neither a separate upload call nor a tool round trip before Claude can see an image, and the files are not reachable from the internet.\n\nWhich approach should the developer use?","choices":["Image content blocks with a url source that points to the file server","Image content blocks with a file source that references a file_id from the Files API","A client tool that reads the file and returns it in a tool_result block","Image content blocks with a base64 source and the image/jpeg media type"],"answer":[3],"explanation":"A base64 image source embeds the image bytes in the request, so it works for private files in a single self-contained call. A url source needs an image the API can reach, a file source needs an earlier Files API upload, and a client tool adds an extra round trip before Claude can see the image.","ref":"https://platform.claude.com/docs/en/build-with-claude/vision"},{"id":"2.1.1-06","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. runs an agent on the Claude API that works through many screenshots in one long conversation. Each request resends the full history and the screenshots are base64 encoded, so request size and latency grow with every turn. The screenshots are generated at run time and must not be exposed on a public URL.\n\nWhat should the developer do?","choices":["Upload each screenshot once through the Files API and reference it by file_id in later requests","Switch the image blocks to url sources that point to a public storage location","Set stream to true so that the screenshots are sent to the API in smaller chunks","Move the conversation to the Message Batches API so that the batch stores the history"],"answer":[0],"explanation":"Each request resends the history, so base64 images are included in the payload on every turn; uploading once and referencing a file_id keeps payloads small however many images accumulate. A url source would also shrink the payload, but it needs a publicly reachable image, which the screenshots must not have. Streaming changes response delivery, not request size, and the Batches API is for asynchronous bulk work rather than an interactive agent.","ref":"https://platform.claude.com/docs/en/build-with-claude/vision"},{"id":"2.1.1-07","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Relecloud's research assistant uses extended thinking in manual mode on a model that supports it. The request sets budget_tokens to 10000 and max_tokens to 8000, and the request fails validation. The team still wants a large thinking budget.\n\nWhat should the developer change?","choices":["Lower budget_tokens to 512 so that it fits inside max_tokens","Set display to omitted so that thinking tokens stop counting toward max_tokens","Raise max_tokens above budget_tokens so that the final answer still has room after thinking","Switch the request to streaming so that the budget is no longer limited by max_tokens"],"answer":[2],"explanation":"In manual mode thinking tokens count toward max_tokens, so budget_tokens must be less than max_tokens; raising max_tokens leaves room for the answer. A budget below the 1,024-token minimum is rejected, display only controls whether thinking text is returned (billing and limits are unchanged), and streaming does not change the rule.","ref":"https://platform.claude.com/docs/en/build-with-claude/extended-thinking"},{"id":"2.1.1-08","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys runs an agent loop on the Messages API with extended thinking enabled. When Claude returns a tool_use block, the code copies only the text and tool_use blocks of the assistant message into the next request, appends the tool_result, and drops the thinking blocks to reduce request size. The team wants Claude's reasoning to stay intact across the tool call.\n\nHow should the developer build the follow-up request?","choices":["Include a summary of the dropped thinking in the system prompt of the follow-up request","Keep the thinking text but remove the signature field to reduce the request size","Pass every thinking block back unmodified with its tool_use block, followed by the tool_result","Drop the thinking blocks and rely on the model to regenerate its reasoning from the tool_result"],"answer":[2],"explanation":"When tool results are returned, the thinking blocks of the assistant message must be passed back complete and unmodified, because the server uses the signature to reconstruct the original thinking and the tool result continues one reasoning flow. A summary in the system prompt, a block without its signature, or no thinking block at all each break that continuity.","ref":"https://platform.claude.com/docs/en/build-with-claude/thinking"},{"id":"2.1.2-01","obj":"2.1.2","difficulty":"easy","type":"single","stem":"Contoso, Ltd. writes a Python service that calls Claude directly on the Claude API with the Anthropic SDK. The company does not use Amazon Bedrock or Google Cloud for this workload.\n\nWhich credential should the service use to authenticate?","choices":["A Claude API key from the Claude Console, sent in the x-api-key header","Temporary AWS credentials that sign each request with SigV4","Google Cloud Application Default Credentials for an identity that can call Vertex AI","An Amazon Bedrock API key passed as a bearer token"],"answer":[0],"explanation":"The Claude API authenticates with an API key; the SDK reads it from ANTHROPIC_API_KEY and sends it in the x-api-key header together with the anthropic-version header. SigV4 signing and Bedrock bearer tokens belong to Amazon Bedrock, and Application Default Credentials belong to Google Cloud.","ref":"https://platform.claude.com/docs/en/build-with-claude/working-with-messages"},{"id":"2.1.2-02","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Litware, Inc. hosts its workloads on AWS. A Python service must call Claude through the InvokeModel API on the bedrock-runtime endpoint by using Anthropic's SDK with AWS credentials from the default credential chain.\n\nWhich client class should the developer instantiate?","choices":["AnthropicBedrockMantle","AnthropicAWS","AnthropicBedrock","AnthropicVertex"],"answer":[2],"explanation":"AnthropicBedrock is the client for InvokeModel on the bedrock-runtime endpoint and resolves AWS credentials through the default chain. AnthropicBedrockMantle targets the separate bedrock-mantle endpoint, AnthropicAWS is for Claude Platform on AWS, which Anthropic operates, and AnthropicVertex is for Google Cloud.","ref":"https://platform.claude.com/docs/en/cli-sdks-libraries/sdks/python"},{"id":"2.1.2-03","obj":"2.1.2","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. develops on laptops and calls Claude through Google Vertex AI by using the AnthropicVertex client in Python. The client is created with a project ID and a region, but requests fail with an authentication error.\n\nWhich credentials should the developer configure?","choices":["A Claude Console API key in the ANTHROPIC_API_KEY environment variable","AWS access keys in the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY variables","A Bedrock API key in the AWS_BEARER_TOKEN_BEDROCK environment variable","Google Cloud Application Default Credentials for an identity that has permission to call Vertex AI"],"answer":[3],"explanation":"The AnthropicVertex client authenticates with Google Cloud credentials, for example Application Default Credentials created with gcloud auth application-default login, for an identity whose role includes the aiplatform.endpoints.predict permission. A Console API key is for the Claude API, and the AWS keys and the Bedrock key are credentials for Amazon Bedrock.","ref":"https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/google-managed"},{"id":"2.1.2-04","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank runs the same Python code against several platforms. For a Haiku-tier model released before the 4.6 generation, the model ID on the Claude API is claude-haiku-4-5-20251001. The code now targets Google Vertex AI through the AnthropicVertex client.\n\nWhich model ID should the developer pass?","choices":["claude-haiku-4-5-20251001","claude-haiku-4-5@20251001","anthropic.claude-haiku-4-5-20251001-v1:0","us.anthropic.claude-haiku-4-5-20251001-v1:0"],"answer":[1],"explanation":"On Vertex AI, models earlier than the 4.6 generation use the Claude API ID with an at sign in place of the hyphen before the snapshot date. The unchanged Claude API ID is the form for the Claude API, and the last two choices are the Amazon Bedrock base model ID and its US inference profile ID.","ref":"https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions"},{"id":"2.1.2-05","obj":"2.1.2","difficulty":"hard","type":"single","stem":"Tailspin Toys calls an older Claude model on Amazon Bedrock through InvokeModel. A request that passes the base model ID anthropic.claude-sonnet-4-5-20250929-v1:0 fails with HTTP 400 and a message that on-demand throughput is not supported and an inference profile is required. Company policy requires that inference traffic stays inside the United States geography.\n\nWhich model ID should the application pass?","choices":["global.anthropic.claude-sonnet-4-5-20250929-v1:0","eu.anthropic.claude-sonnet-4-5-20250929-v1:0","us.anthropic.claude-sonnet-4-5-20250929-v1:0","claude-sonnet-4-5@20250929"],"answer":[2],"explanation":"Models that AWS serves through cross-region inference need an inference profile ID, which is the base model ID with a prefix. The us. prefix keeps routing inside the United States geography. The global. prefix routes dynamically across regions, the eu. prefix routes inside Europe, and claude-sonnet-4-5@20250929 is the Vertex AI form of the ID.","ref":"https://platform.claude.com/docs/en/build-with-claude/claude-on-amazon-bedrock-legacy"},{"id":"2.1.2-06","obj":"2.1.2","difficulty":"medium","type":"multi","stem":"Alpine Ski House calls Claude on Google Vertex AI with plain HTTPS requests instead of the Anthropic SDK. The team adapts a working Claude API request.\n\nWhich two changes should the team make to the request? Each correct answer presents part of the solution.","choices":["Name the model in the endpoint URL and leave the model field out of the request body","Keep sending the Claude Console API key in the x-api-key header","Keep sending the anthropic-version header with the latest API version","Set anthropic_version in the request body","Request streaming by adding stream set to true to the body of the same endpoint"],"answer":[0,3],"explanation":"A Vertex AI request differs from a Claude API request in two main ways: the endpoint URL names the model, so the body omits it, and anthropic_version goes in the body rather than in a header. The request authenticates with Google Cloud credentials rather than a Console API key, and streaming uses the separate :streamRawPredict endpoint instead of a stream field.","ref":"https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/google-managed"},{"id":"2.1.2-07","obj":"2.1.2","difficulty":"hard","type":"single","stem":"Lucerne Publishing has a Python service that sends product photos to Claude on the Claude API by using url image sources. The service must now call Claude on Amazon Bedrock, and requests that contain url image sources fail. The photos stay in a private Amazon S3 bucket.\n\nWhat should the developer change to keep vision working?","choices":["Replace the S3 object URL with a pre-signed URL in the url image source","Read each photo, base64 encode it, and send it as a base64 image source","Upload the photos with the Files API and reference each file_id","Submit the image requests through the Message Batches API instead"],"answer":[1],"explanation":"Amazon Bedrock accepts only base64 image sources, so the application must encode the images itself and stay within the per-image and request size limits. URL image sources, including pre-signed URLs, the Files API, and the Message Batches API are listed as not supported on Bedrock.","ref":"https://platform.claude.com/docs/en/build-with-claude/vision"},{"id":"2.1.2-08","obj":"2.1.2","difficulty":"easy","type":"single","stem":"Margie's Travel runs a Python service on AWS compute that has an IAM role attached, and the service can sign requests with AWS credentials. Security guidance asks for the most preferred authentication method for calling Claude on Amazon Bedrock.\n\nWhich method should the service use?","choices":["A long-term Amazon Bedrock API key stored in the AWS_BEARER_TOKEN_BEDROCK variable","A short-term Amazon Bedrock API key generated in the console and copied into configuration","A Claude Console API key sent in the x-api-key header","Temporary credentials from the IAM role, used to sign requests through the default AWS credential chain"],"answer":[3],"explanation":"AWS recommends signing requests with temporary AWS credentials whenever possible, so bearer tokens, which AWS calls Amazon Bedrock API keys, are the least preferred path and fit software that cannot sign requests. This service can sign, so the IAM role credentials fit. A Claude Console API key authenticates to the Claude API, not to Amazon Bedrock.","ref":"https://platform.claude.com/docs/en/build-with-claude/claude-in-amazon-bedrock"},{"id":"2.1.3-01","obj":"2.1.3","difficulty":"medium","type":"single","stem":"Relecloud's batch job calls the Claude API over HTTPS from Python. Some requests return HTTP 429 with a rate_limit_error and a retry-after header. The job retries immediately in a tight loop and keeps failing.\n\nWhat should the developer do?","choices":["Wait for the interval in the retry-after header, then retry with exponential backoff and a retry limit","Treat the 429 like a 400 invalid_request_error and correct the request body before retrying","Switch the same requests to streaming so that the rate limit no longer applies","Reduce the request timeout so that failed requests are retried sooner"],"answer":[0],"explanation":"A 429 is a rate limit response, so the client should honor the retry-after header and back off, with a limit on retries because some 429 responses persist until access resumes. A 400 means the request itself is malformed, streaming does not bypass rate limits, and a shorter timeout does not change how often the limit is hit.","ref":"https://platform.claude.com/docs/en/api/errors"},{"id":"2.1.3-02","obj":"2.1.3","difficulty":"medium","type":"single","stem":"Trey Research enables extended thinking and tools on a Messages API call in Python. The code reads the reply with json.loads(message.content[0].text) and raises an AttributeError on some responses, because the first block is sometimes a thinking block.\n\nWhat should the developer do?","choices":["Read message.content[-1].text, because the text block is the last block of a response","Read message.content[1].text, because a thinking block occupies the first position","Loop over message.content, select the block whose type is text, and parse its text value","Parse message.to_json(), which contains just the generated text of the reply"],"answer":[2],"explanation":"The content of a response is a list of typed blocks, so code should select blocks by type instead of by position: a text block can follow a thinking block and can be followed by a tool_use block. Position-based reads break when the block order changes, and to_json() serializes the whole message rather than the text alone.","ref":"https://platform.claude.com/docs/en/build-with-claude/extended-thinking"},{"id":"2.1.3-03","obj":"2.1.3","difficulty":"easy","type":"single","stem":"Wide World Importers exposes an asyncio-based Python web service that calls Claude. The service uses the synchronous Anthropic client, so each call blocks the event loop and concurrent requests queue up.\n\nWhich change should the developer make?","choices":["Set stream to true on the synchronous client so that the call returns immediately","Create an AsyncAnthropic client and await client.messages.create in the request handlers","Submit each prompt through the Message Batches API and poll for the result","Raise max_retries on the synchronous client so that blocked calls are retried"],"answer":[1],"explanation":"The SDK provides AsyncAnthropic with the same interface as the synchronous client, and awaiting its calls lets the event loop serve other requests. Streaming on the synchronous client still blocks the calling thread, the Batches API is for asynchronous bulk work with delayed results, and retries do not make a call non-blocking.","ref":"https://platform.claude.com/docs/en/cli-sdks-libraries/sdks/python"},{"id":"2.1.3-04","obj":"2.1.3","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company generates long reports with the Python SDK. A non-streaming request with a very large max_tokens raises a ValueError because it is expected to take longer than about 10 minutes. Some corporate networks drop idle connections. The downstream code needs the complete Message object and does not display partial text.\n\nHow should the developer call the API?","choices":["Override the timeout option with a larger value so that the check no longer raises","Increase max_retries so that the SDK repeats the slow request until it finishes","Switch to AsyncAnthropic so that the request is no longer subject to the timeout check","Use client.messages.stream and call get_final_message to obtain the complete Message"],"answer":[3],"explanation":"For long-running requests the SDK recommends streaming, and its accumulation helper get_final_message returns the same complete Message that a non-streaming call would, while the open event stream keeps the connection from looking idle. A larger timeout only disables the check and leaves the idle-connection risk, more retries repeat the same slow request, and the async client has the same timeout behavior.","ref":"https://platform.claude.com/docs/en/cli-sdks-libraries/sdks/python"},{"id":"2.1.3-05","obj":"2.1.3","difficulty":"easy","type":"multi","stem":"Coho Winery adds the anthropics/claude-code-action GitHub Action to its repository so that developers can mention @claude in pull requests. The workflow file is committed to the repository.\n\nWhich two actions should the team take? Each correct answer presents part of the solution.","choices":["Store the API key as a GitHub Actions secret and reference it in the workflow as a secrets value","Put the API key in the env block of the committed .claude/settings.json file","Add the API key to the CLAUDE.md file so that Claude can authenticate on each run","Let Claude push its commits directly to the default branch to keep the history linear","Review the changes that Claude proposes in a pull request before they are merged"],"answer":[0,4],"explanation":"Claude Code GitHub Actions guidance is to keep credentials in GitHub secrets, never in committed files, and to review Claude's changes before merging. The settings.json and CLAUDE.md files are committed to version control, so a key placed there is exposed, and pushing directly to the default branch skips the code review that protects it.","ref":"https://code.claude.com/docs/en/github-actions"},{"id":"2.1.3-06","obj":"2.1.3","difficulty":"medium","type":"single","stem":"Southridge Video hosts its code on GitHub and has a Claude Team plan. Leadership wants every pull request reviewed by Claude automatically, with inline comments, and does not want engineers to write or maintain workflow files for it.\n\nWhich option should the team use?","choices":["A GitHub Actions workflow that runs claude-code-action with a review prompt","Code Review, turned on by an organization Owner through the Claude GitHub App","The /code-review command, run by each developer on a local branch","A custom reviewer subagent that developers invoke during a Claude Code session"],"answer":[1],"explanation":"Code Review is a managed service that reviews pull requests on GitHub according to repository settings and posts inline comments, so nobody maintains a workflow. A GitHub Actions review runs in your own CI from a workflow file you maintain, /code-review runs only when a developer invokes it locally, and a custom subagent is invoked by a person or by Claude during a session.","ref":"https://code.claude.com/docs/en/code-review"},{"id":"2.1.3-07","obj":"2.1.3","difficulty":"hard","type":"single","stem":"Fourth Coffee uses Code Review on its GitHub repositories. Reviews report only correctness bugs, but the team also wants missing tests flagged. A developer adds a REVIEW.md file with that guidance to a feature branch and opens a pull request, but the review ignores it.\n\nWhat should the team do?","choices":["Raise the review level to Deep so that the review also covers missing tests","Merge REVIEW.md into the default branch, because the review reads it from the base or default branch","Choose a different review model in the Code Review admin settings","Rename REVIEW.md to CLAUDE.local.md on the feature branch"],"answer":[1],"explanation":"Code Review reads REVIEW.md from the base or default branch and never from the changes of the pull request being reviewed, so the guidance takes effect after it is merged there. The review level sets how thorough a review is rather than what it flags, the admin settings do not offer a model choice, and CLAUDE.local.md is a personal file that is not committed.","ref":"https://code.claude.com/docs/en/code-review"},{"id":"2.1.4-01","obj":"2.1.4","difficulty":"medium","type":"single","stem":"Humongous Insurance keeps a CLAUDE.md at the root of its monorepo that tells Claude Code to indent with tabs. The packages/api folder has its own CLAUDE.md that says to indent with spaces. Developers start Claude Code in packages/api and report that the indentation Claude uses is inconsistent.\n\nWhat should the team do?","choices":["Remove the contradiction so that one indentation rule remains across the CLAUDE.md files that load","Rely on the CLAUDE.md in packages/api, because it replaces the root file for sessions in that folder","Move the root instructions into CLAUDE.local.md so that they rank lower than the nested file","Add an @import of the root file to the nested file so that the nested rule wins"],"answer":[0],"explanation":"Claude Code loads the CLAUDE.md files from the working directory and every directory above it and concatenates them, so a nested file does not replace its parent, and contradictory instructions may be followed arbitrarily. The fix is to review the files and remove the conflict. CLAUDE.local.md is appended after CLAUDE.md and an import only adds more text to the context, so neither settles a conflict.","ref":"https://code.claude.com/docs/en/memory"},{"id":"2.1.4-02","obj":"2.1.4","difficulty":"hard","type":"single","stem":"VanArsdel, Ltd. has a 600-line project CLAUDE.md. Claude Code follows its rules less reliably, and most of the frontend rules are irrelevant when developers work on backend code. The team wants to cut the context cost of the file without losing the frontend rules.\n\nWhat should the team do?","choices":["Split the file into topic files and import each one into CLAUDE.md with @path syntax","Move the frontend rules into CLAUDE.local.md at the project root","Move the frontend rules into files under .claude/rules/ that declare a paths field for the frontend folders","Move the frontend rules into the managed policy CLAUDE.md file"],"answer":[2],"explanation":"Path-scoped rules in .claude/rules/ load only when Claude works with matching files, so backend sessions do not pay for the frontend rules. Imports are expanded and loaded together with the CLAUDE.md that imports them, so they organize a long file without reducing its context cost. CLAUDE.local.md and the managed policy CLAUDE.md both load in every session.","ref":"https://code.claude.com/docs/en/memory"},{"id":"2.1.4-03","obj":"2.1.4","difficulty":"easy","type":"multi","stem":"Graphic Design Institute shares its Claude Code configuration with every developer through the Git repository. Each developer also keeps personal preferences for this project, such as sandbox URLs and a personal model override.\n\nWhich two files should the team keep out of version control? Each correct answer presents part of the solution.","choices":["CLAUDE.md at the project root","CLAUDE.local.md at the project root",".claude/settings.json",".claude/settings.local.json",".claude/rules/testing.md"],"answer":[1,3],"explanation":"CLAUDE.local.md holds personal, project-specific instructions and should be added to .gitignore, and .claude/settings.local.json holds personal project settings and overrides, which Claude Code keeps out of git when it creates the file. CLAUDE.md, .claude/settings.json, and the files under .claude/rules/ are the team-shared project configuration and belong in the repository.","ref":"https://code.claude.com/docs/en/settings"},{"id":"2.1.4-04","obj":"2.1.4","difficulty":"medium","type":"single","stem":"Woodgrove Bank requires that Claude Code does not read .env files on any developer machine. A permissions deny rule for these files must stay in force even if developers edit any settings file in their repository or home folder, or pass --settings at startup.\n\nWhich location should the security team use to define the deny rule?","choices":["In the shared .claude/settings.json file committed to each repository","In the user ~/.claude/settings.json file on each developer machine","In the project CLAUDE.md file as an instruction that forbids reading .env files","In managed settings delivered by the organization"],"answer":[3],"explanation":"Managed settings sit at the top of the precedence order, and nothing in a developer's own settings files or in --settings overrides a managed key. The shared project file and the user file are files that developers can edit, and a CLAUDE.md instruction is guidance for Claude rather than an enforced permission rule.","ref":"https://code.claude.com/docs/en/settings"},{"id":"2.1.4-05","obj":"2.1.4","difficulty":"medium","type":"single","stem":"Proseware, Inc. runs Claude Code against the Claude API. Developers select the opus alias in settings.json. After a Claude Code update, the alias resolves to a newer Opus model and the team sees different behavior in its prompts. The team wants the opus alias to stay on the model it has validated.\n\nWhat should the team do?","choices":["Set ANTHROPIC_BASE_URL to the validated model so that requests are routed to it","Set ANTHROPIC_DEFAULT_OPUS_MODEL to the full name of the validated model","Run /model default so that the session reverts to a fixed runtime model","Keep the model value as opus in settings.json and commit the file to share the alias"],"answer":[1],"explanation":"Aliases point to the recommended version and update over time; to pin one, use the full model name or set the matching environment variable such as ANTHROPIC_DEFAULT_OPUS_MODEL. ANTHROPIC_BASE_URL changes where requests go, not which model answers, the default value only clears an override and returns to the runtime default, and committing the alias still lets it move.","ref":"https://code.claude.com/docs/en/model-config"},{"id":"2.1.4-06","obj":"2.1.4","difficulty":"hard","type":"single","stem":"Munson's Pickles and Preserves Farm will roll out Claude Code to many developers through Amazon Bedrock. Without configuration, Claude Code resolves aliases such as opus and sonnet to built-in defaults for the provider. That default can lag the newest release, and the model it names may not yet be enabled in a developer's AWS account. The administrator wants to control exactly when users move to a new model.\n\nWhat should the administrator do before the rollout?","choices":["Set ANTHROPIC_DEFAULT_OPUS_MODEL and the matching Sonnet and Haiku variables to version-specific Bedrock model IDs","Set availableModels in managed settings to the opus, sonnet, and haiku aliases","Set the model value in managed settings to an alias such as opus so that every user starts on it","Set ANTHROPIC_BASE_URL to the regional Bedrock endpoint for the AWS account"],"answer":[0],"explanation":"On third-party providers the documentation advises pinning model versions before rollout by setting the ANTHROPIC_DEFAULT_*_MODEL variables to version-specific IDs in the provider's format, and then updating them when the organization chooses to move. An allowlist of aliases only restricts selection, an alias in the model setting still resolves to the built-in default, and ANTHROPIC_BASE_URL changes the destination of requests, not the model.","ref":"https://code.claude.com/docs/en/model-config"},{"id":"2.1.4-07","obj":"2.1.4","difficulty":"easy","type":"single","stem":"Northwind Traders publishes a Claude Code plugin named deploy-kit that calls an MCP tool provided by another plugin, audit-logger. A new audit-logger release renamed that tool and broke deploy-kit for everyone who updated. The team wants deploy-kit to receive only compatible 2.1 patch releases of audit-logger.\n\nHow should the team declare the dependency?","choices":["In the dependencies array of plugin.json, as the plain string audit-logger","In enabledPlugins of the committed .claude/settings.json file, with the entry audit-logger set to true","In the dependencies array of plugin.json, as an object with name audit-logger and a version range of ~2.1.0","In the project CLAUDE.md file, with an instruction to use audit-logger version 2.1"],"answer":[2],"explanation":"A plugin declares dependencies in the dependencies array of its plugin.json, and an object entry can carry a semantic-version range such as ~2.1.0 so that only matching releases are installed. A bare string follows whatever version the marketplace provides, enabledPlugins turns plugins on without constraining versions, and CLAUDE.md is instruction text that does not control installation.","ref":"https://code.claude.com/docs/en/plugin-dependencies"},{"id":"2.1.4-08","obj":"2.1.4","difficulty":"hard","type":"single","stem":"Adventure Works Cycles maintains the secrets-vault plugin in its own Git repository. Another team's plugin declares a dependency on secrets-vault with the version range ~2.1.0. Installing that plugin fails with a message that secrets-vault has no git tag satisfying the range, although the plugin.json of secrets-vault shows version 2.1.0.\n\nWhat should the maintainer of secrets-vault do?","choices":["Add allowCrossMarketplaceDependenciesOn to the marketplace.json file of the root marketplace","Create the release tag secrets-vault--v2.1.0 on the commit, for example with claude plugin tag --push","Run claude plugin prune on every machine that installs the dependent plugin","Change the version in plugin.json to 2.1.0-0 so that the range accepts pre-release builds"],"answer":[1],"explanation":"A version constraint resolves against git tags named plugin-name--v-version on the repository that hosts the plugin, so the maintainer must tag each release; the version field in plugin.json alone does not satisfy the range. The cross-marketplace allowlist solves a different problem, claude plugin prune removes auto-installed dependencies that nothing needs, and a pre-release version would not match the range.","ref":"https://code.claude.com/docs/en/plugin-dependencies"},{"id":"3.1.1-01","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A developer at Adatum Corporation wants Claude Code to follow a personal preference, such as using a particular local test database port, in one repository only. The preference must not be committed to version control or shared with teammates.\n\nWhich location should you use for the instruction?","choices":["CLAUDE.md in the project root","~/.claude/CLAUDE.md in the home directory","A managed policy CLAUDE.md deployed by the organization","CLAUDE.local.md in the project root, added to .gitignore"],"answer":[3],"explanation":"CLAUDE.local.md is the project-level personal file: Claude Code loads it with the project files, and it is meant to be listed in .gitignore. The project CLAUDE.md is committed and shared with the team, the user-level file applies to every project rather than one repository, and a managed policy file is deployed organization-wide by administrators.","ref":"https://code.claude.com/docs/en/memory"},{"id":"3.1.1-02","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders has a 300-line release checklist that is relevant only when a developer prepares a release, so Claude Code must not load it into every session. Developers also want to start it by typing a slash command, and it must run in the main conversation so that it can use what has already been discussed.\n\nWhich Claude Code component should you use?","choices":["The project CLAUDE.md file","A skill defined in a SKILL.md file in the project","A custom subagent defined in .claude/agents","A PostToolUse hook that prints the checklist"],"answer":[1],"explanation":"A skill loads its full content only when it is relevant or invoked with /skill-name, and it runs in the main conversation. CLAUDE.md loads at session start and costs context in every request, a subagent works in its own isolated context without the earlier discussion, and a hook runs on lifecycle events rather than as instructions the developer starts on demand.","ref":"https://code.claude.com/docs/en/features-overview"},{"id":"3.1.2-01","obj":"3.1.2","difficulty":"easy","type":"single","stem":"A developer at Wide World Importers finishes a bug fix in a Claude Code session and now starts an unrelated task in the same session. The earlier file contents and discussion are not relevant to the new task.\n\nWhich command should you use?","choices":["/compact, to summarize the conversation so far","/resume, to reopen an earlier session","/clear, to start a new conversation with empty context","/rewind, to restore the conversation to an earlier checkpoint"],"answer":[2],"explanation":"Running /clear between unrelated tasks starts a fresh conversation with empty context, and the previous session stays available through /resume. /compact keeps a summary of the old conversation, which is useful when the same task continues but wastes context here. /resume and /rewind bring back earlier history instead of clearing it.","ref":"https://code.claude.com/docs/en/sessions"},{"id":"3.1.2-02","obj":"3.1.2","difficulty":"hard","type":"multi","stem":"Blue Yonder Airlines runs Claude Code in a CI job with claude -p to review each pull request. No person is present to answer permission prompts, and the job stalls when Claude Code asks to run git diff. The team wants only the Read tool and git diff pre-approved, and every other action that would need approval refused.\n\nWhich two options should you use? Each correct answer presents part of the solution.","choices":["--output-format json","--allowedTools with the tools that the review needs","--permission-mode bypassPermissions","--max-turns with a low limit","--permission-mode dontAsk"],"answer":[1,4],"explanation":"--allowedTools pre-approves the listed tools, and --permission-mode dontAsk refuses anything else that would have prompted, so the job neither stalls nor runs unapproved actions. bypassPermissions would approve every action, which violates the requirement. --output-format json only changes how the result is formatted, and --max-turns caps the length of the run but does not resolve permission prompts.","ref":"https://code.claude.com/docs/en/best-practices"},{"id":"4.1.1-01","obj":"4.1.1","difficulty":"medium","type":"single","stem":"The nightly batch job of Relecloud calls the Messages API and logs several kinds of failures. The 429 responses include a retry-after header. The team is writing a retry policy and wants the job to stop retrying errors that cannot succeed without a change to the request itself.\n\nWhich error type should the policy treat as not retryable?","choices":["rate_limit_error (HTTP 429)","invalid_request_error (HTTP 400)","overloaded_error (HTTP 529)","api_error (HTTP 500)"],"answer":[1],"explanation":"A 400 invalid_request_error means the format or content of the request is wrong, so the request must be fixed rather than retried. Rate limit errors are retried after the wait in retry-after, and overloaded and internal errors are transient, so they are retried with exponential backoff. A 429 caused by a spend cap would also fail on retry, but this stem describes rate limiting with a retry-after header.","ref":"https://platform.claude.com/docs/en/api/errors"},{"id":"4.1.2-01","obj":"4.1.2","difficulty":"hard","type":"single","stem":"Proseware, Inc. runs a customer agent in Python on the Messages API. Intermittently, the API rejects a request with a 400 error stating that tool_use ids were found without tool_result blocks immediately after. It happens only on turns in which Claude requests two tools at once. The team is deciding where to investigate first.\n\nWhich cause should you investigate first?","choices":["The system prompt does not tell Claude to call tools one at a time","The model tier is too small to handle parallel tool calls reliably","The loop returns a tool_result for only one of the tool_use blocks when two are requested","The tool descriptions are ambiguous about which tool to select"],"answer":[2],"explanation":"A 400 error is returned when the API validates the request, before any model output exists, and the message points at the history that the harness built. Each tool_use block needs its own tool_result in the next user message, so the integration layer is the place to look. Prompt wording, model tier, and tool descriptions change what Claude decides to call, not whether the request you send is well formed.","ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"},{"id":"4.1.3-01","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Tailspin Toys is building an evaluation set for a classifier that routes support tickets. The first draft contains 200 clear, well-written tickets that the team wrote by hand. Production tickets include typos, missing details, and tickets that fit two categories.\n\nWhich action should you take to make the evaluation set representative?","choices":["Add real production tickets, including ambiguous and malformed ones, in realistic proportions","Add copies of the few-shot examples that are already in the prompt","Add only the tickets that the model previously misrouted","Add more clear, well-written tickets until the set reaches 1,000 items"],"answer":[0],"explanation":"Evaluation sets should reflect the real task mix and include edge cases such as missing information and ambiguous inputs. Copying few-shot examples leaks prompt content into the test, using only past failures distorts the overall score, and adding more clean tickets enlarges the set without covering the cases that production traffic contains.","ref":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"id":"4.1.3-02","obj":"4.1.3","difficulty":"hard","type":"single","stem":"Relecloud evaluates a ticket-routing prompt. The report shows 93 percent overall accuracy, above the 90 percent target. The per-category breakdown shows that the account_closure category, 6 percent of volume, scores 58 percent, and misrouted closures lead to regulatory complaints.\n\nWhich action should you take before release?","choices":["Release the prompt, because the overall accuracy is above the target","Set a per-category threshold and analyze the account_closure errors","Enlarge the set with more examples from the largest categories","Switch to a volume-weighted average of the category scores"],"answer":[1],"explanation":"An aggregate score can hide a weak category that is rare but costly, so per-category results, and a per-category threshold for high-risk classes, should gate the release; a confusion matrix shows where closures are misrouted. Releasing on the aggregate ignores the risk, more examples from large categories raise the overall estimate without exposing the weakness, and a volume-weighted average gives roughly the same overall number again.","ref":"https://platform.claude.com/docs/en/about-claude/use-case-guides/ticket-routing"},{"id":"5.1.1-01","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Tailspin Toys generates product taglines by calling a Claude model that accepts sampling parameters. The team runs the same prompt several times and finds that the taglines are too similar to one another. The team wants more varied wording without rewriting the prompt.\n\nWhich request change should you make?","choices":["Decrease the temperature value","Increase the temperature value","Increase the max_tokens limit","Add a stop sequence to the request"],"answer":[1],"explanation":"Temperature controls the randomness of token selection: higher values give more diverse wording, and lower values favor the most probable wording. Lowering it would make the taglines even more alike. The max_tokens limit only caps the output length, and a stop sequence only ends generation early, so neither changes the variety.","ref":"https://platform.claude.com/docs/en/about-claude/glossary"},{"id":"5.1.1-02","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Litware, Inc. built a Python service that calls the Messages API to extract invoice totals into JSON. A unit test sends the same invoice twice with temperature set to 0 and asserts that the two response strings are identical. The test fails intermittently, and the team needs a test that is reliable.\n\nWhat should you do?","choices":["Assert on the parsed fields, such as the extracted total, instead of comparing the raw response text","Pin the request to one specific model snapshot so that the response text repeats exactly","Increase max_tokens so that truncation cannot cause two responses to differ","Send the test requests through a cloud provider endpoint, which returns repeatable text"],"answer":[0],"explanation":"Even with temperature set to 0, Claude output is not fully deterministic, and identical inputs can produce different outputs across calls, both on Anthropic's own service and through third-party cloud providers. A test should therefore check the properties that matter, such as the parsed total. Pinning a snapshot, raising max_tokens or changing the provider does not remove the variation.","ref":"https://platform.claude.com/docs/en/about-claude/glossary"},{"id":"5.1.1-03","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. has a Python chat service that sends a long conversation history, a system prompt, 30 tool definitions and several large tool results to Claude, with max_tokens set to 8000. Some requests fail because the prompt is too long. A developer proposes to estimate the size by counting only the latest user message.\n\nWhich approach should you recommend to check whether a request fits the context window?","choices":["Count the system prompt and messages, because tool definitions do not use space in the context window","Count the input messages and ignore max_tokens, because output tokens have a separate window","Count the system prompt, tool definitions and messages with the token counting endpoint, and leave room for the output","Send the request and rely on the API to drop the oldest messages when the prompt is too long"],"answer":[2],"explanation":"The context window holds everything in the request, including the system prompt, tool definitions, tool results and messages, plus the output that Claude generates. The token counting endpoint accepts the same inputs as a message request, so it gives a realistic estimate. The API does not trim old messages for you: an input that exceeds the window is rejected with an error.","ref":"https://platform.claude.com/docs/en/build-with-claude/context-windows"},{"id":"5.1.1-04","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Relecloud plans to move a Python pipeline from an older Claude model to a newer model in the same tier. The newer model uses a newer tokenizer than the older one. The finance team has a cost spreadsheet that is based on token counts that were measured on the older model, and it needs a reliable estimate for the new model.\n\nWhich action should you take?","choices":["Reuse the existing counts, because identical text produces the same number of tokens on every model","Count the prompts with a tokenizer library for the older model and apply the new model prices","Divide the character count of each prompt by four and apply the new model prices","Count the same prompts with the token counting endpoint, and pass the ID of the new model"],"answer":[3],"explanation":"Different tokenizers can produce different token counts for the same text, and later models produce noticeably more tokens, so counts from an older model do not carry over. Counting with the model ID you pl
