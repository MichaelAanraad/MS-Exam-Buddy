correct: Strictness without criteria does not change what the model looks for.","Incorrect: Smaller code may help a little but does not address why the self-review is blind."],"ref":"https://docs.anthropic.com/"},{"id":"4.1.1-25","obj":"4.1.1","difficulty":"easy","type":"multi","stem":"Scenario: multi-type extraction. A service must extract data from invoices, contracts and receipts using separate tools. Which TWO design choices improve reliability? (Select 2)","choices":["Describe each field in the schema, including its format and when it may be null","Use tool_choice of type any so that the model must call one of the extraction tools","Merge all document types into one schema with a hundred optional fields","Allow the model to answer in text when it is unsure","Remove field descriptions so that the schema stays short"],"answer":[0,1],"explanation":"Describe fields precisely and force a structured tool call when output must always be structured.","rationale":["Correct: Descriptions remove ambiguity about what each field holds and when it can be empty.","Correct: Any guarantees a structured result while the model selects the matching schema.","Incorrect: A combined schema makes it hard to know which fields apply and increases confusion.","Incorrect: Text replies break the structured pipeline.","Incorrect: Descriptions are a primary source of guidance for the model, so removing them reduces accuracy."],"ref":"https://docs.anthropic.com/"},{"id":"4.1.1-26","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Scenario: customer assistant. The system prompt says answers must be in formal English, while a user message says 'reply casually'. The product owner wants the formal style to always win. Which design is most reliable?","choices":["Rely on the user message, because the most recent instruction always wins over earlier ones","State in the system prompt that style rules take precedence over style requests in user messages, and test it","Remove the system prompt, so that the user can decide on the style of the replies","Add 'formal English' to the end of each user message in code, and hope that the model complies"],"answer":[1],"explanation":"State precedence explicitly and verify the behaviour with tests.","rationale":["Incorrect: The later instruction does not automatically override operator rules, and the result is unpredictable.","Correct: Stating the precedence explicitly and testing it makes the behaviour defined and verified.","Incorrect: This removes the product's control over its own behaviour.","Incorrect: Appending text to each message is clumsy and still does not state which rule wins."],"ref":"https://docs.anthropic.com/"},{"id":"4.1.1-27","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Scenario: extraction schemas. A schema for a customer record nests objects five levels deep, with many optional arrays. The model often omits fields or misplaces values. What is the best change?","choices":["Flatten and simplify the schema where possible, and add field descriptions and an example","Add more levels, so that every concept in the customer record has its own nested object","Ask the model to fill every field, even when it has to guess at the value in the document","Switch to a free-text format, so that the model is not limited by the structure of the schema"],"answer":[0],"explanation":"Keep schemas as simple as the use case allows and document each field.","rationale":["Correct: Simpler structures and clear descriptions reduce errors in placement and omission.","Incorrect: Deeper nesting increases the chance of misplacement.","Incorrect: Forcing every field invites invented values.","Incorrect: Free text discards the structure the downstream system needs."],"ref":"https://docs.anthropic.com/"},{"id":"4.1.1-28","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Scenario: structured output. A report-generation call sometimes returns JSON that ends abruptly, and the parser fails. The logs show stop_reason max_tokens for those calls. What is the right handling?","choices":["Retry the identical request until the response happens to be shorter and fits in the limit","Check stop_reason before parsing, and on max_tokens raise the limit or continue instead of parsing the partial output","Parse the partial JSON after adding the missing closing brackets automatically, and use what it contains","Lower the temperature to 0, so that the model writes shorter and more regular reports"],"answer":[1],"explanation":"Always check stop_reason; a max_tokens stop means the output is incomplete.","rationale":["Incorrect: The output is long by nature, so the same request will keep being cut off.","Correct: A max_tokens stop means that the output is incomplete, so the system should handle that case explicitly.","Incorrect: Repairing partial JSON may produce a valid-looking but incomplete result.","Incorrect: Temperature does not influence the length limit."],"ref":"https://docs.anthropic.com/"},{"id":"4.1.1-29","obj":"4.1.1","difficulty":"medium","type":"multi","stem":"Scenario: extraction with evidence. A team wants to reduce invented values in extracted contract terms. Which TWO prompt or schema changes are most effective? (Select 2)","choices":["Allow 'not stated' (null) as a valid value for every term","Require a short quotation from the contract for each extracted value","Ask the model to be 100% certain","Raise max_tokens so that the model can write longer answers","Add a friendly tone to the prompt"],"answer":[0,1],"explanation":"Provide a way to say 'not stated' and require evidence for each extracted value.","rationale":["Correct: A valid way to express absence removes the pressure to guess.","Correct: Quotations make unsupported values visible and easy to check.","Incorrect: A request for certainty does not provide a way to express doubt.","Incorrect: More room does not make values more accurate.","Incorrect: Tone does not affect the grounding of values."],"ref":"https://docs.anthropic.com/"},{"id":"4.1.1-30","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Scenario: prompt operations. A prompt is edited by several developers directly in production configuration, and nobody can tell which version produced last week's complaints. Which practice most improves control?","choices":["Keep making edits in production only, and ask developers to leave a comment for each change they make","Store prompts in version control, run the evaluation on every change, and record the prompt version per call","Freeze the prompt forever, so that nobody can change it by accident and cause new complaints from customers","Let the model rewrite the prompt whenever complaints arrive, and deploy its version automatically to production"],"answer":[1],"explanation":"Treat prompts like code: version them, evaluate changes, and trace which version produced which output.","rationale":["Incorrect: Comments do not give history, review or rollback.","Correct: Versioning, evaluation and traceability make changes reviewable and problems attributable.","Incorrect: Freezing avoids change but also prevents improvement and fixes.","Incorrect: Uncontrolled self-modification adds more change without any verification."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-01","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: long-running support agent. A conversation lasts two hours and has grown to 150,000 tokens, mostly old tool output. Response quality is declining and cost is rising. Which strategy is best?","choices":["Delete the oldest 50% of the messages, without analysing which of them contain facts that are still needed","Summarise completed phases, keep decisions, identifiers and open items, drop stale output, and store key facts externally","Switch to a smaller model for the rest of the conversation, which lowers the cost of every further call","Ask the user to start a new conversation and to repeat their situation from the beginning"],"answer":[1],"explanation":"Compact deliberately: keep decisions and open items, drop stale output, and externalise key facts.","rationale":["Incorrect: Blind deletion can remove the facts that the next steps depend on.","Correct: This preserves what matters for the next decision and frees the context from material that no longer helps.","Incorrect: A smaller model does not shorten the context and may reduce quality.","Incorrect: Pushes the cost of the problem onto the customer."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-02","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: contract review. A 300-page contract is supplied in full. The key instruction, 'flag any clause that exceeds a liability cap of 1 million EUR', sits in the middle of the prompt, and the model frequently overlooks it. What helps most?","choices":["Repeat the instruction 30 times throughout the contract, so that the model cannot overlook it","Put the key instruction at the start or end of the prompt, state it clearly, and restate it in the final request","Make the instruction longer and more detailed, so that it stands out from the contract text around it","Lower the temperature to 0, so that the model attends to the whole input in a consistent way"],"answer":[1],"explanation":"In long contexts, place critical instructions at the edges and restate them in the final request.","rationale":["Incorrect: Heavy repetition adds noise and cost without a clear gain.","Correct: Position and clarity matter in long contexts, and the end of the prompt is well attended.","Incorrect: Length does not improve its salience and may bury the point.","Incorrect: Temperature does not affect where the model attends in a long input."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-03","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: production service. During peak hours about 5% of requests fail with rate-limit or overloaded responses. The client currently retries immediately up to ten times. Failures increase during peaks. What is the best change?","choices":["Retry more often with no delay, up to 20 times, so that a request gets through once the load drops","Retry with exponential backoff and jitter, honour any retry-after hint, cap the attempts, then fail gracefully","Stop retrying and show an error immediately, so that users are told quickly when a request fails","Send each request to three models at once and take the answer that arrives first"],"answer":[1],"explanation":"Handle transient errors with bounded exponential backoff and jitter.","rationale":["Incorrect: Immediate retries add load at the worst moment and prolong the overload.","Correct: Spacing out the retries spreads the load and gives the service time to recover, and a cap prevents endless loops.","Incorrect: Gives up on failures that a short wait would have resolved.","Incorrect: Triples the load and cost without addressing the overload."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-04","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: report generator. An agent generates a long weekly report. Sometimes the report ends in the middle of a sentence, and the stop_reason in the response is max_tokens. What should the application do?","choices":["Treat the response as complete, since the model stopped generating text by its own choice at that point","Detect the max_tokens stop, then continue or raise the limit, and never deliver a truncated report","Reduce the number of sections in the report, which hides the cut-off from the readers of the report","Ask the model whether it finished, and rely on its answer to decide if the report is complete"],"answer":[1],"explanation":"Check stop_reason and handle truncation explicitly.","rationale":["Incorrect: The stop reason shows that the limit was reached, not that the report was complete.","Correct: The application knows about the truncation and can fix it instead of delivering a broken report.","Incorrect: Hiding the symptom does not address a limit that is set too low for the task.","Incorrect: The model may not notice its own truncation, and the stop_reason is reliable."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-05","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: multi-hour coding agent. An agent builds a large feature across many sessions. Each new session starts without memory of earlier work and redoes or contradicts earlier decisions. Which design is most effective?","choices":["Paste the entire previous transcript at the start of every session, so that the model has all of the history","Keep a progress file with decisions, completed tasks and next steps, commit regularly, and load it at session start","Rely on the model to infer the earlier decisions from the code that already exists in the repository","Use a larger model, so that it remembers more of the earlier sessions when it starts a new one"],"answer":[1],"explanation":"Persist decisions and progress in a concise file that each new session loads.","rationale":["Incorrect: The transcript is long and mixes useful facts with noise, using up the context.","Correct: A compact structured record of state gives each session what it needs, and commits provide a checkpoint.","Incorrect: Code shows what exists but not why choices were made or what is planned next.","Incorrect: Models do not remember across sessions; size does not change that."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-06","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: customer assistant. After adding the current time to the beginning of the system prompt, cache hit rates dropped from 80% to near zero and costs rose. What explains this?","choices":["The cache only works for prompts shorter than 1,000 tokens, and the timestamp pushed the prompt over that limit","The prefix now changes on every request, so no cached prefix can be reused","The new timestamp format disabled the cache for the whole account until the format is changed back","The model now needs more tokens to read the timestamp, which makes every request more expensive"],"answer":[1],"explanation":"A changing prefix prevents cache reuse; keep stable content at the beginning.","rationale":["Incorrect: Cache applies to long prompts, which is where it saves the most.","Correct: Caching depends on an identical prefix, and a changing first line breaks it for everything that follows.","Incorrect: The timestamp format is not what matters; any change in the prefix has the effect.","Incorrect: The timestamp is only a few tokens and does not explain the cost jump."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-07","obj":"5.1.1","difficulty":"easy","type":"multi","stem":"Scenario: agent platform. The team is trying to understand why cache hits dropped after a release. Which TWO changes in the release would most likely break the reusable prefix? (Select 2)","choices":["The order of tool definitions was changed","A new sentence was added near the top of the system prompt","A new user message was appended at the end of the conversation","The assistant's answer from the previous turn was appended to the history","The application log level was changed"],"answer":[0,1],"explanation":"Changes to tools or the beginning of the system prompt invalidate the cached prefix; appending to the end does not.","rationale":["Correct: Tools are part of the prefix, so a change in their order produces a different prefix.","Correct: A change early in the prefix invalidates the cached content that follows.","Incorrect: Appending at the end leaves the earlier prefix unchanged.","Incorrect: Appending history extends the prefix without altering the existing part.","Incorrect: Logging does not alter the prompt."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-08","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: document processing. A company must classify 200,000 archived documents over a weekend. There is no real-time requirement, and cost matters. Which approach fits best?","choices":["Process the documents one by one with the standard interactive API, in a simple loop over the archive","Use the batch processing API, submit the jobs, collect results when ready, and handle failures of single items","Process the documents in parallel at the highest possible concurrency, with no error handling to keep it simple","Use the largest model for each document without checking cost, to be sure that quality is the highest"],"answer":[1],"explanation":"Use batch processing for large, non-urgent workloads.","rationale":["Incorrect: Slower and more expensive than necessary for work that can wait.","Correct: Batch processing is designed for large asynchronous jobs at lower cost, and individual failures can be retried.","Incorrect: Uncontrolled concurrency causes rate-limit failures and lost work.","Incorrect: Ignores cost, which was a stated constraint."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-09","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: regulated decision support. An auditor asks the team to reproduce why an assistant gave a particular recommendation three months ago. The team has only the final answer stored. Which change would best support such audits?","choices":["Set the temperature to 0, which makes every output reproducible whenever the same input is supplied again","Record inputs, prompt version, model identifier, tool results and output for each decision","Store a screenshot of the final answer that was shown to the user, together with the timestamp","Ask the model to explain its reasoning at the time of the audit, and file that explanation"],"answer":[1],"explanation":"Audit trails record inputs, versions and results; they do not depend on re-running the model.","rationale":["Incorrect: Temperature 0 reduces but does not guarantee identical output, and models change over time.","Correct: A complete record shows what the system saw and did, and it does not depend on reproducing the output.","Incorrect: A screenshot shows the result, not the basis for it.","Incorrect: A later explanation is a new generation and not a record of the original one."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-10","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: inventory assistant. Early in a long conversation the agent looked up stock for an item (12 units). Twenty minutes later, the customer asks whether they can order 10 units, and the agent answers 'yes' from the earlier result. In the meantime another order took 5 units. What should the agent have done?","choices":["Trust the earlier result because it came from a tool, and tools return reliable data for the whole session","Re-check the stock before any decision that depends on it, because earlier results can be stale","Ask the customer to confirm the stock level, since they know what they saw earlier in the conversation","Reduce the quantity automatically by 20%, to allow for orders that may have been placed in the meantime"],"answer":[1],"explanation":"Refresh volatile data before acting on it; earlier tool results age.","rationale":["Incorrect: Tool results describe the state at the time of the call.","Correct: Decisions that rely on changing data need a fresh read.","Incorrect: The customer does not know the current stock.","Incorrect: An arbitrary reduction is not based on the real state."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-11","obj":"5.1.1","difficulty":"medium","type":"multi","stem":"Scenario: customer-support agent. Human agents complain that escalated cases arrive without the information they need. Which TWO items should the escalation summary always contain? (Select 2)","choices":["What the customer wants and the identifiers needed to find the account and the case","What the agent has already tried, with the results, and why it is escalating","The full unedited transcript as the only content","The agent's personal opinion of the customer's tone","A list of all tools available to the agent"],"answer":[0,1],"explanation":"Good escalation summaries state the goal, identifiers, attempts and reason for escalation.","rationale":["Correct: The human can immediately understand and locate the case.","Correct: This prevents repeated work and explains what is needed next.","Incorrect: A transcript alone forces the human to read everything and work out the state.","Incorrect: Opinions about tone are not actionable and may be unfair.","Incorrect: The tool list is irrelevant to the human's task."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-12","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: research assistant. A price-comparison tool is down. The assistant is asked for the best price among four shops. What is the best behaviour?","choices":["Provide prices from memory and present them as current, because the shops rarely change their prices","Report that the tool is unavailable, give what is verifiable (three of four shops), and say what is unchecked","Refuse to answer any question about the shops until the price-comparison tool is working again for everybody","Retry the tool for ten minutes without telling the user, and answer only when it finally succeeds in time"],"answer":[1],"explanation":"Degrade gracefully and state what could not be verified.","rationale":["Incorrect: Outdated or invented prices presented as current are misleading.","Correct: A partial but honest answer is useful and shows the limits.","Incorrect: Refusing everything throws away help that is possible.","Incorrect: A silent wait leaves the user without information."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-13","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: quality evaluation. A team uses a model to grade answers from another model on a 1 to 5 scale. The grader prefers long answers and consistently scores them higher than short correct ones. What is the best next step?","choices":["Accept the grades, since a model is an objective judge that applies the rubric in the same way every time","Compare scores with human-labelled examples, adjust the rubric to penalise padding, and recalibrate","Remove the grader and use answer length as the quality measure, which is simpler and cheaper","Keep the grader but double the scores of short answers to compensate for its preference for long ones"],"answer":[1],"explanation":"Calibrate model-based graders against human labels and refine the rubric.","rationale":["Incorrect: Model graders have biases, such as preferring length.","Correct: Calibration against human judgement shows the bias, and a better rubric reduces it.","Incorrect: Length is the very bias to be avoided.","Incorrect: Arbitrary scaling does not address the cause."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-14","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: overnight agent. An agent processes 5,000 records, and crashes after 3,200. On restart it begins at record one. What would have prevented the repeated work?","choices":["A larger context window, so that the agent can keep all of the 5,000 records in view at once","Checkpointing processed record ids to durable storage and resuming from there, with idempotent writes","Running the job only during the day, when engineers are available to restart it after a crash","A more detailed prompt, which tells the agent exactly how to start again after an interruption"],"answer":[1],"explanation":"Checkpoint progress outside the model and make writes idempotent.","rationale":["Incorrect: Context does not survive a crashed process.","Correct: Durable progress records allow resumption, and idempotency protects against duplicates around the crash.","Incorrect: Time of day does not change what happens on a crash.","Incorrect: Prompt detail does not preserve state across a restart."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-15","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: two agents. A planning agent and an execution agent both append results to the same JSON file. Occasionally the file is corrupted or entries are lost. What is the best fix?","choices":["Ask the agents to coordinate through a prompt instruction that says they must avoid writing at the same time","Use a single writer or a lock, or give each agent its own file and merge the files afterwards","Increase the file size limit, so that the two agents have enough room for all of their results","Let the later write always overwrite the earlier one, so that the file reflects the latest state"],"answer":[1],"explanation":"Prevent concurrent write conflicts structurally, not through instructions.","rationale":["Incorrect: Agents cannot reliably coordinate timing through a prompt.","Correct: Structural coordination prevents concurrent writes from conflicting.","Incorrect: Size is not the problem.","Incorrect: Overwriting loses entries on purpose."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-16","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: customer-support agent. A compliance review finds personal data (e-mail addresses and phone numbers) in debugging logs of agent conversations. Which approach is best?","choices":["Keep the logs as they are but ask staff not to look at the personal data in them","Redact or tokenise personal data before it is written to logs, restrict access, and define a retention period","Turn off logging entirely, including error logs, so that no personal data can be stored anywhere","Move the logs to a public bucket, where they are easier to search and to share with support staff"],"answer":[1],"explanation":"Redact sensitive data before logging and limit access and retention.","rationale":["Incorrect: Instructions do not remove the exposure.","Correct: Protecting the data at the source and limiting its lifetime reduces the risk while keeping useful logs.","Incorrect: Without logs, failures cannot be diagnosed.","Incorrect: A public bucket maximises exposure."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-17","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: data agent. A tool call to an external API occasionally hangs. The agent loop then waits for hours. What is the best fix?","choices":["Wait longer, since the API normally recovers by itself, and keep the agent loop running in the meantime","Set a timeout on each tool call, treat it as a failure with a bounded retry policy, and report the outcome","Kill the process whenever any call takes longer than a second, so that hangs never last for very long","Remove the tool from the agent, so that the hanging call can no longer block the loop of the agent"],"answer":[1],"explanation":"Set timeouts and handle them as failures with a bounded retry policy.","rationale":["Incorrect: An unlimited wait blocks the work for as long as the API hangs.","Correct: Timeouts convert hangs into handled errors with a defined policy.","Incorrect: Too short a timeout will fail healthy calls.","Incorrect: Removing the tool loses the capability."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-18","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: production assistant. A new prompt version improves evaluation scores. The product owner wants to deploy it to all users immediately. What is the most prudent approach?","choices":["Deploy to all users at once and monitor the complaints that come in during the first days after the release","Roll out to a small share of traffic, compare key metrics with the old version, and keep a rollback ready","Deploy only at night, when fewer users are present and any problems affect fewer people at the same time","Skip further testing, since the evaluation scores already show that the new version is better than the old"],"answer":[1],"explanation":"Roll out changes gradually with monitoring and a rollback path.","rationale":["Incorrect: Problems reach every user before they are noticed.","Correct: A gradual rollout limits the impact and allows comparison on real traffic.","Incorrect: Timing does not reduce the number of affected users when a problem exists.","Incorrect: Evaluation sets do not cover everything that real users do."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-19","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: agent harness. The model calls a tool named update_inventory, which does not exist in the request's tool list. What should the harness do?","choices":["Execute a similar existing tool instead, to be helpful and keep the conversation moving for the user","Return an error that says the tool does not exist and lists the available ones, and execute nothing","Terminate the session without a message, because the model has clearly gone wrong in its behaviour","Ignore the call and continue as if nothing happened, so that the conversation is not interrupted"],"answer":[1],"explanation":"Reject undefined tool calls with an informative error and execute nothing.","rationale":["Incorrect: Guessing which tool was meant may perform the wrong action.","Correct: The model gets the information it needs to correct itself on the next turn, and nothing unintended runs.","Incorrect: Ending the session discards work that could be recovered.","Incorrect: Every tool_use needs a result, and silence breaks the conversation structure."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-20","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: long coding session. The developer corrected an assumption about the data model early in the session. After three hours the agent makes the original mistake again. What is the best remedy?","choices":["Raise the temperature to encourage new solutions that differ from the earlier mistaken approach in the session","Compact or restart the context and restate the verified facts near the start, for example in a notes file","Tell the agent to try harder and to double-check its assumptions about the data model before it continues","Add more tools, so that the agent can look up the data model whenever it needs to check a detail"],"answer":[1],"explanation":"Restate corrected facts in a compact, prominent form instead of hoping they survive a crowded context.","rationale":["Incorrect: More randomness does not restore forgotten facts.","Correct: Verified facts placed prominently are less likely to be lost in a crowded context.","Incorrect: Motivation does not restore information.","Incorrect: Tools do not fix lost context."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-21","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: multi-turn assistant. To save tokens, a developer removes old tool_result messages from the history but leaves the corresponding assistant tool_use messages in place. The next request fails with a validation error. Why?","choices":["Tool_use messages must always be at the start of the history, before any other kind of message","Each tool_use must be followed by its matching tool_result, so trimming has to keep or remove both together","The history must be shorter than ten messages, otherwise the request is rejected by the service","Tool results cannot be removed from the history under any circumstances, even if replaced by a summary"],"answer":[1],"explanation":"When trimming history, keep tool_use and tool_result pairs consistent.","rationale":["Incorrect: Tool_use messages appear wherever the model requested them.","Correct: The protocol requires every tool_use to be answered, so trimming must treat the pair as a unit.","Incorrect: There is no such message limit rule.","Incorrect: Pairs can be removed together or replaced by a summary."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-22","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: research agent. Tool results from earlier steps (long web pages) stay in context and crowd out recent reasoning. The facts they contained have already been extracted into notes. Which action is most appropriate?","choices":["Keep everything in context, because deleting information is always risky and cannot be undone later","Remove or replace processed tool results with the extracted notes, keeping references to their sources","Ask the model to ignore the earlier pages, since it then no longer takes them into account","Double the context limit in the request settings, so that there is room for both pages and reasoning"],"answer":[1],"explanation":"Replace processed bulk output with compact notes that keep references to sources.","rationale":["Incorrect: Context is a limited resource and stale bulk reduces focus.","Correct: The useful content is retained in compact form and the source remains traceable.","Incorrect: The material still occupies the context and still influences attention.","Incorrect: A larger window does not remove the dilution."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-23","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: operations. A team wants early warning when an agent in production degrades. Which monitoring set is most useful?","choices":["Only the number of users per day, which shows how much the assistant is being used by customers","Tool error rates, stop_reason mix, escalation and retry rates, latency, cost per task, and sampled quality checks","Only the average length of responses, which changes when the model starts to behave in a different way","Only customer survey results once a quarter, because they measure what customers actually experience"],"answer":[1],"explanation":"Monitor behavioural signals such as errors, stop reasons and escalations, together with sampled quality checks.","rationale":["Incorrect: Usage volume says nothing about quality.","Correct: These signals show behaviour changes quickly, and sampled evaluation tests quality directly.","Incorrect: Length alone does not indicate correctness.","Incorrect: Too infrequent to catch regressions in time."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-24","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: automated approvals. An agent approves or escalates insurance claims. The team wants to decide which claims can be approved automatically. Which method sets a defensible threshold?","choices":["Pick 90% because it sounds like a safe level, and have staff review the decisions that fall below that line","Measure precision at several confidence levels on a labelled set and choose the threshold that meets the target error rate","Let the agent choose its own threshold, since it knows best how certain it is about each individual claim","Approve everything below a certain amount without further checks, since small claims carry little financial risk"],"answer":[1],"explanation":"Set automation thresholds from measured error rates on labelled data.","rationale":["Incorrect: A number chosen without data has no known error rate.","Correct: Data shows the trade-off between automation and errors, and monitoring keeps it valid.","Incorrect: The agent has no reliable knowledge of its own error rate.","Incorrect: Amount alone ignores the likelihood of error."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-25","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: knowledge assistant. A policy document changed last week, but the assistant still quotes the old version. The retrieval index is rebuilt monthly. What is the best fix?","choices":["Fine-tune the model on the new policy immediately, so that it no longer quotes the old version of the policy","Update the index when documents change, and show document date and version in retrieved passages","Add a disclaimer that policies may be outdated, and tell users to check with the HR department themselves","Remove the policy documents from the index until the monthly rebuild has taken place at the end of the month"],"answer":[1],"explanation":"Keep retrieval content current and expose versions and dates in the context.","rationale":["Incorrect: It is slow and unnecessary for a content update that retrieval can handle.","Correct: Fresh content plus visible versions makes answers current and checkable.","Incorrect: A disclaimer leaves the problem unsolved.","Incorrect: Users lose access to the relevant information."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-26","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: customer assistant. During an overload period, API calls return overloaded errors for several minutes. Which response is best for users?","choices":["Show a technical error message with the full response, so that the user can pass it on to support","Retry with backoff for a short time, then show a clear busy message, keep the user's input, and let them retry","Silently drop the request, so that the user does not see an error that they cannot do anything about","Switch the assistant to answering from memory without telling anyone, so that users still get a reply"],"answer":[1],"explanation":"Handle overload with bounded retries and a clear, honest message that preserves the user's work.","rationale":["Incorrect: Technical messages do not help users.","Correct: A short retry handles brief spikes, and a clear message with preserved input handles longer ones.","Incorrect: Users get no response and no explanation.","Incorrect: Answers without proper tools or data and without disclosure risk errors."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-27","obj":"5.1.1","difficulty":"hard","type":"multi","stem":"Scenario: multi-agent synthesis. A synthesis agent combines summaries from subagents. Reviewers cannot trace claims back to sources. Which TWO practices preserve provenance? (Select 2)","choices":["Keep a source reference with each claim through every summarisation step","Store the original source text or a link, so that a claim can be checked later","Merge all summaries into one paragraph, without references, for readability","Replace sources with the name of the subagent that returned them","Drop the dates to keep the summary short"],"answer":[0,1],"explanation":"Carry source references with every claim and keep the originals available.","rationale":["Correct: References that travel with claims make verification possible.","Correct: The original material allows a reviewer to confirm what the source says.","Incorrect: Merging without references destroys traceability.","Incorrect: A subagent name does not identify the evidence.","Incorrect: Dates are often needed to judge whether information is current."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-28","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Scenario: quality monitoring. A support agent handles 20 ticket categories, of which one rare category (fraud reports) accounts for 0.5% of tickets but has high impact. Random sampling of 100 conversations per week almost never includes it. What is the better sampling strategy?","choices":["Keep random sampling and increase the weekly sample from 100 to 120 conversations","Stratify the sample by category, so that rare high-impact categories get enough reviewed cases","Review only the conversations in which the agent rated its own answer as confident","Review only the shortest conversations, because they are quickest to read and check"],"answer":[1],"explanation":"Stratify review samples so that rare, high-impact categories are covered.","rationale":["Incorrect: A slightly larger random sample still misses rare categories.","Correct: Stratification guarantees coverage of the cases that matter most.","Incorrect: Confident cases are not where hidden problems are most likely to be found.","Incorrect: Length is not related to risk."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-29","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Scenario: document analysis. Each of 500 contracts is 80,000 tokens, and the task is to extract the same 15 fields from each. A developer plans to put 20 contracts into one prompt to save calls. Quality drops and fields are mixed up between contracts. What is the better design?","choices":["Process each contract in its own request with a clear schema, and combine the results in code","Put 100 contracts in one prompt, so that the model can compare them and extract the fields at once","Ask the model to remember each contract's fields in the same response, and list them at the end","Summarise each contract to one line before extraction, which keeps the prompts small and cheap"],"answer":[0],"explanation":"Process independent documents separately and aggregate in code.","rationale":["Correct: Isolating each document avoids cross-contamination, and code handles the aggregation.","Incorrect: More contracts increase the mixing problem.","Incorrect: This relies on the model to keep many documents apart in a single output, which is the cause of the errors.","Incorrect: A one-line summary discards the details that extraction needs."],"ref":"https://docs.anthropic.com/"},{"id":"5.1.1-30","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Scenario: agent evaluation. A new release of the agent reduces average cost by 30%, and the team celebrates. A deeper analysis shows that the share of conversations ending in correct resolution fell from 91% to 84%. How should the team interpret this?","choices":["Cost is the primary measure, so the release is a success and should be rolled out to everyone","Weigh the saving against quality: a seven-point drop in resolution is a regression that needs investigation","The evaluation is probably wrong, since the cost went down, and should be repeated with a new sample","Resolution rates do not matter if the cost falls, because the saving can fund more human agents"],"answer":[1],"explanation":"Evaluate cost together with quality; a cheaper but less effective agent is not an improvement.","rationale":["Incorrect: A cheaper agent that resolves fewer cases may increase total cost through escalations and repeat contacts.","Correct: The trade-off needs explicit assessment against targets, and the cause should be found.","Incorrect: A measured drop on a labelled set is evidence to take seriously.","Incorrect: Resolution is the purpose of the agent."],"ref":"https://docs.anthropic.com/"}],"cases":{}};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives, CASES = DATA.cases || {};
// per-exam storage prefix ("ai500" for AI-500), so several exams on one site keep separate progress
const KEY = DATA.exam.id.toLowerCase().replace(/[^a-z0-9]/g, "");
const $app = document.getElementById("app");
const $$ = s => [...$app.querySelectorAll(s)];
// notice (set per category in build.py) and content date (CONTENT_DATE in objectives.py); the date ages by itself
(function () {
  const e = DATA.exam, box = document.getElementById("banner"), lines = [];
  if (e.notice) lines.push(e.notice);
  if (e.contentDate) {
    const p = e.contentDate.split("-"), d = new Date(Date.UTC(+p[0], +p[1] - 1, 1)), now = new Date();
    const months = (now.getFullYear() - +p[0]) * 12 + now.getMonth() + 1 - +p[1];
    lines.push("Content as of " + d.toLocaleDateString("en", { month: "long", year: "numeric", timeZone: "UTC" }) + "." +
      (months > 6 ? " That is more than six months ago: the exam or the product may have changed, so check the current official sources." : ""));
  }
  lines.forEach(t => { const p = document.createElement("p"); p.className = "note"; p.textContent = t; box.appendChild(p); });
})();

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get(KEY + ".history", {}); // id -> true/false (last result fully correct)

const theme = store.get(KEY + ".theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set(KEY + ".theme", next);
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => p.split("\n").every(l => l.startsWith("- "))
      ? `<ul>${p.split("\n").map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`
      : "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const why = s => s ? `<div class="why">${inline(s)}</div>` : "";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dom = q => q.obj.split(".")[0];
const isStd = q => !q.case && !q.series;
const SERIES_NOTE = "This question is one of a series that share the same scenario. Each question in the series offers a different solution that might or might not meet the goal. A series can have more than one correct solution, or none. After you answer a question in this series, you cannot return to it, and it does not appear on the review screen.";
const HOW = {
  multi: q => `Choose ${q.answer.length}`, order: q => `Arrange ${q.answer.length} in order`,
  yesno: () => "Yes / No for each statement", dragdrop: () => "Drag and drop", dropdown: () => "Select from each list",
};

// ---------- answers ----------
function blank(q) {
  if (q.type === "yesno") return q.choices.map(() => null);
  if (q.type === "dragdrop" || q.type === "dropdown") return q.targets.map(() => null);
  return [];
}
function complete(q, p) {
  if (q.type === "single") return p.length === 1;
  if (q.type === "multi" || q.type === "order") return p.length === q.answer.length;
  return p.every(v => v !== null);
}
const answered = it => it.picked.some(v => v !== null);
// Partial credit per box/statement/selection, like the real exam; build lists are all-or-nothing.
function grade(q, p) {
  if (q.type === "single") return +(p[0] === q.answer[0]);
  if (q.type === "multi") return p.filter(x => q.answer.includes(x)).length / q.answer.length;
  if (q.type === "order") return +(p.length === q.answer.length && p.every((x, i) => x === q.answer[i]));
  if (q.type === "yesno") return p.filter((v, i) => v === q.answer.includes(i)).length / p.length;
  return p.filter((v, i) => v === q.answer[i]).length / p.length; // dragdrop, dropdown
}
const item = q => ({ q, order: !q.choices ? [] : q.series ? [0, 1] : shuffle(q.choices.map((_, i) => i)), picked: blank(q), checked: false, locked: false, mark: false });

// ---------- home ----------
let S = null, tick = null;
window.onbeforeunload = () => (S && S.mode === "exam" && !S.done ? true : undefined);

function home() {
  clearInterval(tick); S = null;
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all", ...store.get(KEY + ".cfg", {}) };
  const types = Object.entries(Q.reduce((a, q) => (a[q.case ? "case" : q.series ? "series" : q.type] = (a[q.case ? "case" : q.series ? "series" : q.type] || 0) + 1, a), {}));
  $app.innerHTML = `
  <div class="card">
    <h2>New session</h2>
    <fieldset><legend>Mode</legend><select id="mode">
      <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Practice (instant feedback)</option>
      <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Exam (feedback at the end)</option>
      <option value="sim" ${cfg.mode === "sim" ? "selected" : ""}>Exam simulation (50 questions, 100 minutes)</option>
    </select>
    <p class="muted" id="simnote">Exam simulation ignores the filters below: questions are weighted by the study-guide domain percentages and include a problem-solution series and a case study in their own sections. No objective or difficulty hints, a countdown timer, mark for review, and a review screen per section. Once you leave a section you cannot return to it.</p>
    </fieldset>
    <div id="filters">
    <fieldset><legend>Domains</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} questions)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Difficulty</legend><div class="row">
      ${[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Question pool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> All</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Not seen yet</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Previously wrong (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Questions</legend><select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></fieldset>
    </div>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Progress on this device</h2>
    <p>${seen} of ${Q.length} questions answered, ${seen - wrong} last correct, ${wrong} last wrong.</p>
    ${statsTable()}
    <p class="muted">Question types: ${types.map(([t, n]) => `${t} ${n}`).join(", ")}.</p>
    <div class="actions"><button class="ghost" id="reset" type="button">Reset progress</button></div>
  </div>`;
  const mode = document.getElementById("mode"), sync = () => {
    document.getElementById("filters").hidden = mode.value === "sim";
    document.getElementById("simnote").hidden = mode.value !== "sim";
  };
  mode.onchange = sync; sync();
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all progress?")) { history = {}; store.set(KEY + ".history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domain</th><th>Done</th><th>Correct</th></tr>${rows}</table>`;
}

// keep case-study and series questions together, in id order, at the position of their first member
function grouped(qs) {
  const g = new Map();
  qs.forEach(q => { const k = q.case || q.series || q.id; if (!g.has(k)) g.set(k, []); g.get(k).push(q); });
  return [...g.values()].flatMap(xs => xs.sort((a, b) => a.id.localeCompare(b.id)));
}

function simSections() {
  const caseIds = [...new Set(Q.filter(q => q.case).map(q => q.case))];
  const seriesIds = [...new Set(Q.filter(q => q.series).map(q => q.series))];
  const cs = caseIds.length ? grouped(Q.filter(q => q.case === pick(caseIds))) : [];
  const sr = seriesIds.length ? grouped(Q.filter(q => q.series === pick(seriesIds))) : [];
  const n = 50 - cs.length - sr.length;
  // domain share = midpoint of the study-guide weight range, largest remainder rounding
  const w = Object.entries(DOMAINS).map(([k, d]) => { const [a, b] = d.weight.match(/\d+/g).map(Number); return [k, (a + (b ?? a)) / 2]; });
  const tot = w.reduce((s, [, x]) => s + x, 0);
  const cnt = w.map(([k, x]) => ({ k, c: Math.floor(n * x / tot), r: (n * x / tot) % 1 }));
  [...cnt].sort((a, b) => b.r - a.r).slice(0, n - cnt.reduce((s, x) => s + x.c, 0)).forEach(x => x.c++);
  const std = shuffle(cnt.flatMap(({ k, c }) => shuffle(Q.filter(q => isStd(q) && dom(q) === k)).slice(0, c)));
  return [["std", std], ["series", sr], ["case", cs]].filter(([, xs]) => xs.length);
}

function start() {
  const mode = document.getElementById("mode").value;
  let secs;
  if (mode === "sim") {
    store.set(KEY + ".cfg", { ...store.get(KEY + ".cfg", {}), mode });
    secs = simSections();
  } else {
    const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
    const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode };
    store.set(KEY + ".cfg", cfg);
    let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
    if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
    if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
    if (!pool.length) { document.getElementById("msg").textContent = "No questions match this selection."; return; }
    secs = [["std", grouped(shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n))]];
  }
  const items = [], sections = [];
  secs.forEach(([kind, qs]) => { sections.push({ kind, start: items.length, end: items.length + qs.length }); items.push(...qs.map(item)); });
  S = { mode: mode === "practice" ? "practice" : "exam", sim: mode === "sim", items, secs: sections, sec: 0, i: 0, tab: 0, sel: null, t0: Date.now() };
  if (S.sim) {
    S.deadline = Date.now() + 100 * 60000;
    tick = setInterval(() => {
      const left = S.deadline - Date.now(), el = document.getElementById("clock");
      if (left <= 0) { alert("Time is up. Your exam is submitted."); return finish(); }
      if (el) el.textContent = clock(left);
    }, 1000);
    return intro();
  }
  show();
}
const clock = ms => { const s = Math.ceil(ms / 1000); return `Time left ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const clockChip = () => S.deadline ? `<span class="chip clock" id="clock">${clock(S.deadline - Date.now())}</span>` : "";

function intro() {
  const sec = S.secs[S.sec], n = sec.end - sec.start;
  const text = {
    std: `This section contains ${n} questions. You can move back and forth, mark questions for review, and change your answers until you finish the section. When you finish it, you cannot return to it.`,
    series: `This section contains a problem-solution series of ${n} questions. ${SERIES_NOTE}`,
    case: `This section contains a case study with ${n} questions. Each question uses the same scenario; use the tabs to read the parts of the case study. You can move between the questions of this case study until you finish the section.`,
  }[sec.kind];
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Section ${S.sec + 1} of ${S.secs.length}</span>${clockChip()}</div>
    <h2>${{ std: "Questions", series: "Problem-solution series", case: "Case study" }[sec.kind]}</h2>
    <p>${esc(text)}</p>
    ${S.sec === 0 ? `<p class="muted">${S.items.length} questions in total, 100 minutes. Passing score: 700 on a scale of 1 to 1000.</p>` : ""}
    <div class="actions"><button id="go" type="button">Start section</button></div></div>`;
  document.getElementById("go").onclick = () => { S.i = sec.start; S.tab = 0; show(); };
}

// ---------- question ----------
function casePanel(id) {
  const c = CASES[id]; if (!c) return "";
  const t = Math.min(S.tab, c.sections.length - 1);
  return `<details class="case" ${S.caseClosed ? "" : "open"}><summary><strong>Case study: ${esc(c.title)}</strong></summary>
    <div class="tabs">${c.sections.map(([h], k) => `<button type="button" class="ghost sm" data-tab="${k}" aria-pressed="${k === t}">${esc(h)}</button>`).join("")}</div>
    <div class="case-body">${md(c.sections[t][1])}</div></details>`;
}

function sel(it, i, lock, reveal) {
  const q = it.q, t = q.targets[i], p = it.picked;
  const cls = reveal ? (p[i] === q.answer[i] ? "correct" : "wrong") : "";
  return `<select data-t="${i}" class="${cls}" ${lock ? "disabled" : ""} aria-label="Box ${i + 1}"><option value="">Select...</option>${t.options.map((o, k) => `<option value="${k}" ${p[i] === k ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

function stemHTML(it, lock, reveal) {
  const h = md(it.q.stem);
  return it.q.type === "dropdown" ? h.replace(/\[\[(\d+)\]\]/g, (_, n) => sel(it, n - 1, lock, reveal)) : h;
}

function answerHTML(it, lock, reveal) {
  const q = it.q, p = it.picked, dis = lock ? "disabled" : "", drag = !lock;
  switch (q.type) {
    case "single": case "multi": {
      const multi = q.type === "multi";
      return `<div>${it.order.map(ci => {
        const cls = reveal ? (q.answer.includes(ci) ? "correct" : p.includes(ci) ? "wrong" : "") : "";
        return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" data-c="${ci}" ${dis} ${p.includes(ci) ? "checked" : ""}>
          <span>${inline(q.choices[ci])}${reveal ? why(q.rationale[ci]) : ""}</span></label>`;
      }).join("")}</div>`;
    }
    case "yesno":
      return `<table class="yn"><tr><th>Statement</th><th>Yes</th><th>No</th></tr>${q.choices.map((s, i) => {
        const cls = reveal ? (p[i] === q.answer.includes(i) ? "correct" : "wrong") : "";
        return `<tr class="${cls}"><td>${inline(s)}${reveal ? why(q.rationale[i]) : ""}</td>${[1, 0].map(v => `<td><input type="radio" name="yn${i}" data-i="${i}" data-v="${v}" aria-label="${v ? "Yes" : "No"}: statement ${i + 1}" ${dis} ${p[i] === !!v ? "checked" : ""}></td>`).join("")}</tr>`;
      }).join("")}</table>`;
    case "order": {
      const tile = (ci, k) => {
        const cls = reveal ? (q.answer[k] === ci ? "correct" : "wrong") : "";
        return `<div class="tile ${cls}" draggable="${drag}" data-c="${ci}" ${k === undefined && !lock ? `tabindex="0" role="button"` : ""}>
          ${k === undefined ? "" : `<span class="num">${k + 1}.</span>`}<span class="txt">${inline(q.choices[ci])}</span>
          ${k === undefined || lock ? "" : `<span class="tools"><button type="button" class="ghost sm" data-up="${k}" aria-label="Move up">&uarr;</button><button type="button" class="ghost sm" data-down="${k}" aria-label="Move down">&darr;</button><button type="button" class="ghost sm" data-rm="${k}" aria-label="Remove">&times;</button></span>`}</div>`;
      };
      return `<div class="dd">
        <div><div class="lbl">Actions</div><div class="zone pool" data-zone="pool">${it.order.filter(ci => !p.includes(ci)).map(ci => tile(ci)).join("")}</div></div>
        <div><div class="lbl">Answer area</div><div class="zone area" data-zone="area">${p.map((ci, k) => tile(ci, k)).join("")}</div></div></div>
        ${lock ? "" : `<p class="muted">Click or drag an action into the answer area, then use the arrows to put it in order.</p>`}
        ${reveal ? `<div class="lbl">Correct sequence</div><ol>${q.answer.map(ci => `<li>${inline(q.choices[ci])}${why(q.rationale[ci])}</li>`).join("")}</ol>
          <div class="lbl">Not part of the sequence</div><ul>${q.choices.map((c, ci) => q.answer.includes(ci) ? "" : `<li>${inline(c)}${why(q.rationale[ci])}</li>`).join("")}</ul>` : ""}`;
    }
    case "dragdrop":
      return `<div class="lbl">Values</div><div class="zone pool flat">${it.order.map(ci => `<div class="tile ${S.sel === ci ? "sel" : ""}" draggable="${drag}" data-c="${ci}" ${lock ? "" : `tabindex="0" role="button"`}><span class="txt">${inline(q.choices[ci])}</span></div>`).join("")}</div>
        <div class="lbl">Answer area</div><table>${q.targets.map((t, i) => {
          const ok = p[i] === q.answer[i], cls = reveal ? (ok ? "correct" : "wrong") : "";
          return `<tr><td>${inline(t)}</td><td><div class="slot ${cls}" data-t="${i}" ${lock ? "" : `tabindex="0" role="button"`}>${p[i] === null ? `<span class="muted">${lock ? "(empty)" : "Click a value, then click here"}</span>` : inline(q.choices[p[i]])}</div>
            ${reveal ? why((ok ? "" : `Answer: ${q.choices[q.answer[i]]}. `) + q.rationale[i]) : ""}</td></tr>`;
        }).join("")}</table>
        ${lock ? "" : `<p class="muted">Each value may be used once, more than once, or not at all.</p>`}
        ${reveal ? `<div class="lbl">About each value</div><ul>${q.choices.map((c, ci) => `<li><strong>${inline(c)}</strong>${why(q.notes[ci])}</li>`).join("")}</ul>` : ""}`;
    case "dropdown": {
      const inStem = q.stem.includes("[[1]]");
      if (inStem && !reveal) return "";
      return `<table>${q.targets.map((t, i) => {
        const ok = p[i] === q.answer[i];
        return `<tr><td>${inStem ? `Box ${i + 1}` : inline(t.label)}</td><td>${inStem ? "" : sel(it, i, lock, reveal)}
          ${reveal ? `<div class="why"><span class="${ok ? "ok" : "bad"}">${ok ? "Your answer is correct" : p[i] === null ? "No answer" : "Your answer is incorrect"}</span>
            <ul>${t.options.map((o, k) => `<li class="${k === q.answer[i] ? "ok" : k === p[i] ? "bad" : ""}"><code>${esc(o)}</code>: ${inline(t.why[k])}</li>`).join("")}</ul></div>` : ""}</td></tr>`;
      }).join("")}</table>`;
    }
  }
  return "";
}

function bindAnswer(it, lock) {
  if (lock) return;
  const q = it.q, p = it.picked, redraw = () => show(true);
  $$("input[data-c]").forEach(b => b.onchange = () => {
    const ci = +b.dataset.c;
    if (q.type === "single") it.picked = [ci];
    else if (b.checked) { if (p.length < q.answer.length) p.push(ci); } else p.splice(p.indexOf(ci), 1);
    redraw();
  });
  $$("input[data-i]").forEach(b => b.onchange = () => { p[+b.dataset.i] = b.dataset.v === "1"; redraw(); });
  $$("select[data-t]").forEach(s => s.onchange = () => { p[+s.dataset.t] = s.value === "" ? null : +s.value; redraw(); });
  $$(".tile[draggable=true]").forEach(t => t.ondragstart = e => e.dataTransfer.setData("text/plain", t.dataset.c));
  $$("[tabindex][role=button]").forEach(el => el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } });
  const zone = (el, drop) => { el.ondragover = e => e.preventDefault(); el.ondrop = e => { e.preventDefault(); drop(+e.dataTransfer.getData("text/plain"), e); redraw(); }; };
  if (q.type === "order") {
    $$(".pool .tile").forEach(t => t.onclick = () => { if (p.length < q.answer.length) { p.push(+t.dataset.c); redraw(); } });
    $$("[data-up]").forEach(b => b.onclick = () => { const k = +b.dataset.up; if (k > 0) [p[k - 1], p[k]] = [p[k], p[k - 1]]; redraw(); });
    $$("[data-down]").forEach(b => b.onclick = () => { const k = +b.dataset.down; if (k < p.length - 1) [p[k + 1], p[k]] = [p[k], p[k + 1]]; redraw(); });
    $$("[data-rm]").forEach(b => b.onclick = () => { p.splice(+b.dataset.rm, 1); redraw(); });
    $$("[data-zone=area]").forEach(z => zone(z, (ci, e) => {
      const from = p.indexOf(ci);
      if (from >= 0) p.splice(from, 1); else if (p.length >= q.answer.length) return;
      const li = e.target.closest(".tile[data-c]"), at = li ? p.indexOf(+li.dataset.c) : -1;
      p.splice(at < 0 ? p.length : at, 0, ci);
    }));
    $$("[data-zone=pool]").forEach(z => zone(z, ci => { const k = p.indexOf(ci); if (k >= 0) p.splice(k, 1); }));
  }
  if (q.type === "dragdrop") {
    $$(".pool .tile").forEach(t => t.onclick = () => { S.sel = S.sel === +t.dataset.c ? null : +t.dataset.c; redraw(); });
    $$(".slot").forEach(s => {
      s.onclick = () => { p[+s.dataset.t] = S.sel ?? null; S.sel = null; redraw(); };
      zone(s, ci => { p[+s.dataset.t] = ci; S.sel = null; });
    });
  }
}

function show(keep) {
  const it = S.items[S.i], q = it.q, sec = S.secs[S.sec], practice = S.mode === "practice";
  const lock = practice ? it.checked : it.locked, reveal = practice && it.checked;
  const levels = { easy: "Easy", medium: "Medium", hard: "Hard" };
  const prog = practice ? S.i / S.items.length : S.items.filter(answered).length / S.items.length;
  $app.innerHTML = `
  <div class="bar"><div style="width:${100 * prog}%"></div></div>
  <div class="card">
    <div class="chips">
      <span class="chip">Question ${S.i + 1} of ${S.items.length}</span>
      ${S.sim ? "" : `<span class="chip">${q.obj} ${esc(OBJ[q.obj])}</span><span class="chip ${q.difficulty}">${levels[q.difficulty]}</span>`}
      ${HOW[q.type] && !q.series ? `<span class="chip">${HOW[q.type](q)}</span>` : ""}
      ${it.mark ? `<span class="chip">Marked for review</span>` : ""}
      ${clockChip()}
    </div>
    ${q.case ? casePanel(q.case) : ""}
    ${q.series ? `<div class="note">${esc(SERIES_NOTE)}</div>` : ""}
    <div class="stem">${stemHTML(it, lock, reveal)}</div>
    ${answerHTML(it, lock, reveal)}
    ${reveal ? feedback(it) : ""}
    <div class="actions">${practice ? navPractice(it) : navExam(it, sec)}</div>
  </div>`;
  bindAnswer(it, lock);
  $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = +b.dataset.tab; show(true); });
  $$("details.case").forEach(d => d.ontoggle = () => { S.caseClosed = !d.open; });
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  on("prev", () => { S.i--; S.sel = null; show(); });
  on("check", () => {
    it.score = grade(q, it.picked); it.checked = true;
    history[q.id] = it.score === 1; store.set(KEY + ".history", history);
    show(true);
  });
  on("next", () => {
    if (q.series && !practice) it.locked = true;
    S.sel = null;
    if (S.i + 1 < sec.end) { S.i++; return show(); }
    if (practice) return result();
    sec.kind === "series" ? endSection() : review();
  });
  on("mark", () => { it.mark = !it.mark; show(true); });
  on("review", review);
  on("quit", () => {
    if (practice) return S.review || !S.items.some(x => x.checked) ? home() : result();
    if (confirm("End the exam now? Unanswered questions count as incorrect.")) finish();
  });
  if (!keep) window.scrollTo(0, 0);
}

function navPractice(it) {
  const last = S.i + 1 === S.items.length;
  return `${S.i > 0 ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    ${it.checked ? `<button id="next" type="button">${last ? (S.review ? "Done" : "Results") : "Next"}</button>`
      : `<button id="check" type="button" ${complete(it.q, it.picked) ? "" : "disabled"}>Check</button><button class="ghost" id="next" type="button">Skip</button>`}
    <button class="ghost" id="quit" type="button">${S.review ? "Close review" : "Stop"}</button>`;
}

function navExam(it, sec) {
  const series = sec.kind === "series" || it.q.series, last = S.i + 1 === sec.end;
  const prevOk = S.i > sec.start && !series && !S.items[S.i - 1].locked;
  return `${prevOk ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    <button id="next" type="button">${!last ? "Next" : series ? (S.sec + 1 < S.secs.length ? "Next section" : "Finish exam") : "Review"}</button>
    ${series ? "" : `<button class="ghost" id="mark" type="button" aria-pressed="${it.mark}">Mark for review</button><button class="ghost" id="review" type="button">Review screen</button>`}
    <button class="ghost" id="quit" type="button">End exam</button>`;
}

function review() {
  const sec = S.secs[S.sec], idx = [];
  for (let i = sec.start; i < sec.end; i++) if (!S.items[i].q.series) idx.push(i);
  const open = idx.filter(i => !answered(S.items[i])).length, marked = idx.filter(i => S.items[i].mark).length;
  const lastSec = S.sec + 1 === S.secs.length;
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Review screen${S.secs.length > 1 ? ` -- section ${S.sec + 1} of ${S.secs.length}` : ""}</span>${clockChip()}</div>
    <p>${idx.length - open} answered, ${open} unanswered, ${marked} marked for review. Select a question to return to it.</p>
    <div class="rv">${idx.map(i => { const x = S.items[i]; return `<button class="ghost" type="button" data-go="${i}">Question ${i + 1}<br><span class="muted">${answered(x) ? "Answered" : "Unanswered"}${x.mark ? ", marked" : ""}</span></button>`; }).join("")}</div>
    <div class="actions">
      <button id="endsec" type="button">${lastSec ? "Submit exam" : "Finish section"}</button>
      <button class="ghost" id="back" type="button">Return to question ${S.i + 1}</button>
    </div></div>`;
  $$("[data-go]").forEach(b => b.onclick = () => { S.i = +b.dataset.go; S.tab = 0; show(); });
  document.getElementById("back").onclick = () => show();
  document.getElementById("endsec").onclick = () => {
    const msg = (open ? `${open} question(s) are unanswered. ` : "") + (lastSec ? "Submit the exam?" : "After you finish this section, you cannot return to it. Continue?");
    if (confirm(msg)) endSection();
  };
  window.scrollTo(0, 0);
}

function endSection() {
  const sec = S.secs[S.sec];
  for (let i = sec.start; i < sec.end; i++) S.items[i].locked = true;
  if (++S.sec >= S.secs.length) return finish();
  S.sim ? intro() : (S.i = S.secs[S.sec].start, show());
}

function finish() {
  clearInterval(tick); S.done = true;
  S.items.forEach(it => {
    it.score = grade(it.q, it.picked); it.checked = true;
    if (answered(it)) history[it.q.id] = it.score === 1;
  });
  store.set(KEY + ".history", history);
  result();
}

function feedback(it) {
  const q = it.q, s = it.score;
  return `<p class="verdict ${s === 1 ? "ok" : "bad"}">${s === 1 ? "Correct!" : s > 0 ? `Partially correct (${Math.round(100 * s)}%).` : "Incorrect."}</p>
    <div>${md(q.explanation)}</div>
    <p class="muted">Source: <a href="${esc(q.ref)}" target="_blank" rel="noopener">${esc(q.ref.replace("https://", ""))}</a></p>`;
}

function result() {
  clearInterval(tick);
  const xs = S.mode === "practice" ? S.items.filter(x => x.checked) : S.items;
  const pts = xs.reduce((s, x) => s + x.score, 0), pct = xs.length ? Math.round(100 * pts / xs.length) : 0;
  const per = Object.entries(DOMAINS).map(([k, d]) => {
    const ds = xs.filter(x => dom(x.q) === k); if (!ds.length) return "";
    const g = ds.reduce((s, x) => s + x.score, 0);
    return `<tr><td>${esc(d.title)}</td><td>${+g.toFixed(1)}/${ds.length}</td><td>${Math.round(100 * g / ds.length)}%</td></tr>`;
  }).join("");
  const wrong = xs.filter(x => x.score < 1), mins = Math.round((Date.now() - S.t0) / 60000);
  $app.innerHTML = `
  <div class="card">
    <h2>Results</h2>
    <div class="big">${pct}%</div>
    <p>${+pts.toFixed(1)} of ${xs.length} points${S.sim ? `, ${mins} minutes used` : ""}. Multi-part questions earn partial credit.
      ${pct >= 70 ? "Around passing level." : "Below passing level."} <span class="muted">The real exam reports a scaled score where 700 of 1000 passes; that is not exactly 70% correct.</span></p>
    <table><tr><th>Domain</th><th>Points</th><th>%</th></tr>${per}</table>
    <div class="actions">
      ${wrong.length ? `<button id="rwrong" type="button">Review ${wrong.length} mistakes</button>` : ""}
      <button class="ghost" id="rall" type="button">Review all</button>
      <button class="ghost" id="home" type="button">New session</button>
    </div>
  </div>`;
  const rev = list => { S = { mode: "practice", review: true, items: list, secs: [{ kind: "std", start: 0, end: list.length }], sec: 0, i: 0, tab: 0, sel: null }; show(); };
  document.getElementById("home").onclick = home;
  document.getElementById("rall").onclick = () => rev(xs);
  const rw = document.getElementById("rwrong"); if (rw) rw.onclick = () => rev(wrong);
}

home();
</script>
</body>
</html>
