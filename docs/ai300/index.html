be migrated, so these resources must be deleted, not stopped.","Incorrect: this update command enables the managed network, but Learn requires that you delete all compute instances, compute clusters, and managed online endpoints before you update an existing workspace.","Correct: before you update an existing workspace to use a managed virtual network, you must delete all its managed compute resources. Recreate them after the update so that they run in the managed network.","Incorrect: provision-network provisions a managed network that is already configured on the workspace. Workspace1 has no managed network yet; you configure it with az ml workspace update after deleting the compute."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-managed-network"},{"id":"1.3.4-08","obj":"1.3.4","difficulty":"hard","type":"dropdown","case":"C-a","stem":"You need to complete the network settings of the workspace in the infra/main.bicep file to meet the security requirements.\n\nHow should you complete the Bicep code? To answer, select the appropriate options in the answer area.\n\n```bicep\nresource mlw 'Microsoft.MachineLearningServices/workspaces@2024-04-01' = {\n  name: 'mlw-noshow-prod'\n  location: location\n  identity: {\n    type: 'SystemAssigned'\n  }\n  properties: {\n    storageAccount: storage.id\n    keyVault: vault.id\n    applicationInsights: appInsights.id\n    containerRegistry: registry.id\n    publicNetworkAccess: '[[1]]'\n    managedNetwork: {\n      isolationMode: '[[2]]'\n      outboundRules: {\n        pypi: {\n          type: '[[3]]'\n          destination: 'pypi.org'\n        }\n        claims: {\n          type: '[[4]]'\n          destination: {\n            serviceResourceId: claimsStorage.id\n            subresourceTarget: 'blob'\n          }\n        }\n      }\n    }\n  }\n}\n```","targets":[{"label":"Box 1","options":["Disabled","Enabled"],"why":["Correct: the workspace must not accept requests from the public internet. Disabled rejects public requests, and users connect from VNet-Hub through the private endpoint.","Incorrect: Enabled accepts requests from the public network, optionally limited by IP network rules. Users connect through VNet-Hub, so the workspace needs no public access."]},{"label":"Box 2","options":["AllowOnlyApprovedOutbound","AllowInternetOutbound","Disabled"],"why":["Correct: compute must reach only pypi.org and stclaimsdata, and exfiltration risk must be minimized. AllowOnlyApprovedOutbound blocks other destinations and enables data exfiltration protection.","Incorrect: AllowInternetOutbound lets compute reach any internet destination. It suits teams that need unrestricted downloads, not a requirement to reach only approved destinations.","Incorrect: Disabled turns off the managed network, which you choose when your own virtual network isolates compute or no isolation is needed. The outbound rules would then have no effect."]},{"label":"Box 3","options":["FQDN","ServiceTag","PrivateEndpoint"],"why":["Correct: pypi.org is a public internet host, and an FQDN rule allows outbound traffic to a named host on ports 80 and 443. The first FQDN rule deploys an Azure Firewall.","Incorrect: ServiceTag rules allow traffic to Azure services by service tag, such as Azure Data Factory, and need a serviceTag destination. pypi.org is not an Azure service.","Incorrect: PrivateEndpoint rules connect to Azure resources by their resource ID. pypi.org is not an Azure resource, so a private endpoint cannot be created for it."]},{"label":"Box 4","options":["PrivateEndpoint","FQDN","ServiceTag"],"why":["Correct: stclaimsdata is an Azure Storage account, and a PrivateEndpoint rule with the subresourceTarget blob connects the managed network privately to its blob service.","Incorrect: in the allow only approved outbound mode, an FQDN rule cannot be used to access an Azure Storage account. You must use a private endpoint rule instead.","Incorrect: a ServiceTag rule needs a serviceTag destination instead of a resource ID, and a service tag covers a whole Azure service rather than the single storage account that the requirement allows."]}],"answer":[0,0,0,0],"explanation":"In Bicep, publicNetworkAccess controls inbound access, and the managedNetwork block controls outbound access from managed compute. Each outbound rule has a type that matches its destination: FQDN with a host name, PrivateEndpoint with an Azure resource ID and subresource, and ServiceTag with a service tag destination.","ref":"https://learn.microsoft.com/azure/templates/microsoft.machinelearningservices/workspaces?pivots=deployment-language-bicep"},{"id":"1.3.5-01","obj":"1.3.5","difficulty":"medium","type":"order","stem":"Bellows College stores training code for Azure Machine Learning in a GitHub repository. You cloned the repository to a compute instance and have the main branch checked out. Team policy requires that the feature branch exists before any file is changed, and that changes reach main only through a reviewed pull request. You must change the src/train.py file and publish the work so that a pull request can be opened.\n\nWhich five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run `git checkout -b feature/drift-check`.","Edit the src/train.py file.","Run `git add src/train.py`.","Run `git commit -m \"Add drift check\"`.","Run `git push --set-upstream origin feature/drift-check`.","Run `git stash`.","Run `git merge feature/drift-check` on the main branch."],"answer":[0,1,2,3,4],"explanation":"The basic Git workflow is branch, change, stage, commit, push, and then open a pull request for review. For machine learning projects this keeps changes to training code isolated until reviewers approve them, and each job that you submit from the branch records the commit it ran.","rationale":["Step 1: git checkout -b creates the feature branch and switches to it in one step. The policy requires the branch before any file changes, so it comes first.","Step 2: you change src/train.py while the feature branch is checked out, so the work stays isolated from main until it is reviewed.","Step 3: git add stages the changed file. Only staged changes are included in the next commit, so staging comes before the commit.","Step 4: git commit saves the staged change as a commit on the current branch, feature/drift-check, with a short message that describes the change.","Step 5: git push --set-upstream origin creates the same-named remote branch, sets it as the tracked branch, and publishes the commit so that a pull request into main can be opened.","Incorrect: git stash saves uncommitted changes and reverts the working tree to the last commit. Use it to put work aside before you switch branches, not to publish changes.","Incorrect: merging the feature branch into main locally bypasses the reviewed pull request that the policy requires. The merge happens when the pull request is completed after approval."],"ref":"https://learn.microsoft.com/azure/devops/user-guide/code-with-git?view=azure-devops#2-work-in-a-branch"},{"id":"1.3.5-02","obj":"1.3.5","difficulty":"medium","type":"yesno","stem":"Contoso Pharmaceuticals has a GitHub repository that User1 cloned to a compute instance. Git is installed on the compute instance. User1 submits a command job by running az ml job create --file job.yml from the directory of the cloned repository.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The commit hash of the submitted code is stored in the mlflow.source.git.commit property of the job.","The azureml.git.repository_uri property of the job contains the URL that the repository was cloned from.","If Git is not installed in the environment that submits a job, Azure Machine Learning rejects the job."],"answer":[0,1],"explanation":"Azure Machine Learning captures Git metadata automatically when you submit a job from a Git working directory by using the Python SDK or the CLI. It records the repository URI, branch, commit, and a dirty flag in the job properties, which links each model back to the exact code that trained it.","rationale":["Yes: when the source files are in a Git repository, the upload records the commit hash from git rev-parse HEAD in the job properties azureml.git.commit and mlflow.source.git.commit.","Yes: azureml.git.repository_uri, and also mlflow.source.git.repoURL, holds the result of git ls-remote --get-url, which is the URI that the repository was cloned from.","No: if the git command is not available, or the files are not in a Git repository, the job still runs, but no Git information is tracked. Run git --version to check that Git is available."],"ref":"https://learn.microsoft.com/azure/machine-learning/concept-train-model-git-integration"},{"id":"1.3.5-03","obj":"1.3.5","difficulty":"easy","type":"dragdrop","stem":"A. Datum Corporation has three Git repositories that contain Azure Machine Learning training code. You submit jobs from each repository by using the CLI v2.\n\nWhich file or command should you use for each repository? To answer, drag the appropriate files or commands to the correct repositories. Each file or command may be used once, more than once, or not at all.","choices":[".amlignore",".gitignore","git rm --cached","git update-index --skip-worktree","git stash"],"targets":["Repo1: exclude the data/ folder from the snapshot that each job uploads, while Git keeps tracking data/","Repo2: stop tracking the model.pkl file, which is already committed, without deleting the local file","Repo3: keep notebook checkpoint files out of both the repository and the job snapshots; Repo3 has no .amlignore file"],"answer":[0,2,1],"rationale":["Repo1 needs a rule that affects only the job snapshot. Entries in .amlignore exclude files from the snapshot, and because .gitignore is not changed, Git keeps tracking data/.","Repo2 has a file that Git already tracks, and .gitignore entries do not affect tracked files. git rm --cached removes model.pkl from the index but keeps it on disk; you then commit the change.","Repo3 needs one rule for both Git and the snapshots. Without an .amlignore file, Azure Machine Learning uses .gitignore for the snapshot, so a single .gitignore entry covers both."],"notes":[".amlignore uses the .gitignore syntax and excludes files only from the job snapshot. If both files exist, .amlignore is used and .gitignore is ignored for the snapshot.",".gitignore tells Git not to track matching untracked files. Azure Machine Learning also uses it to exclude files from the job snapshot when no .amlignore file exists.","git rm --cached stops Git from tracking a committed file without deleting it from the file system. Add a .gitignore entry afterwards so that Git also ignores later changes.","git update-index --skip-worktree temporarily ignores local changes to a tracked file, such as a personal settings file, while the file stays in the repository.","git stash saves uncommitted changes and reverts the working tree to the last commit, so that you can switch branches and apply the changes later."],"explanation":"Use .gitignore for files that must never enter the repository and .amlignore for files that stay in Git but must not be uploaded with each job. Ignore files have no effect on files that Git already tracks; remove those from the index with git rm --cached.","ref":"https://learn.microsoft.com/azure/machine-learning/concept-train-machine-learning-model?view=azureml-api-2#python-sdk"},{"id":"1.3.5-04","obj":"1.3.5","difficulty":"hard","type":"multi","stem":"Fabrikam Residences has data scientists who submit training jobs by using the CLI v2. The properties of recent jobs contain no repository, branch, or commit information. You need to ensure that future jobs record this Git information.\n\nWhich two conditions should you verify? Each correct answer presents part of the solution.","choices":["The git --version command succeeds in the environment from which the jobs are submitted.","The training source files are inside the directory of a cloned Git repository.","The repository is hosted on GitHub instead of another Git service.","The jobs run on a compute instance instead of a compute cluster.","The repository was cloned by using SSH instead of HTTPS."],"answer":[0,1],"explanation":"Git tracking in Azure Machine Learning happens on the client: when you submit a job, the SDK or CLI runs git commands in the source directory and stores the results as job properties. It needs a working git command and source files inside a Git working tree; the hosting service and the compute target do not matter.","rationale":["Correct: the upload process uses the git command to read the repository, branch, and commit. If git is not available in the environment that submits the job, no Git information is tracked.","Correct: the upload process checks whether the source files are stored in a Git repository. Files outside the cloned repository directory are uploaded without any Git properties.","Incorrect: the information comes from the local repository, so it is not tied to a central service. Repositories cloned from GitHub, GitLab, Bitbucket, or Azure DevOps all work.","Incorrect: Git information is collected in the environment that submits the job, not where the job runs. Jobs that run on compute clusters or serverless compute record it too.","Incorrect: SSH and HTTPS are two ways to authenticate when you clone. The protocol does not decide whether a job records Git information; the recorded repository URI reflects the clone URL."],"ref":"https://learn.microsoft.com/azure/machine-learning/concept-train-model-git-integration"},{"id":"1.3.5-05","obj":"1.3.5","difficulty":"medium","type":"single","stem":"Best For You Organics Company has two data scientists, User1 and User2, who each work on their own compute instance in the same workspace. They often delete and recreate their compute instances. Each user needs a working copy of a shared Git repository that survives when a compute instance is recreated, without sharing a checkout and its working branch with the other user.\n\nWhich location should each user use to clone the repository?","choices":["In the home directory on the local disk of their compute instance","In their own user folder under ~/cloudfiles/code on the workspace file share","In one shared folder under ~/cloudfiles/code that both users open","In the /tmp directory of their compute instance, linked from the file share"],"answer":[1],"explanation":"A compute instance offers two places for a Git clone: the local disk, which is faster but lost when the instance is deleted and recreated, and the mounted workspace file share at ~/cloudfiles/code, which persists. Clone into your own user directory so that other users do not collide on your working branch.","rationale":["Incorrect: the local file system of a compute instance gives better Git performance, but it is lost when the compute instance is deleted and recreated, so the working copy would not survive.","Correct: ~/cloudfiles/code is the mounted shared file system of the workspace, which is kept when a compute instance is recreated. Cloning into each user's own directory prevents collisions on the working branch.","Incorrect: a single shared clone survives recreation, but both users would work in the same checkout and collide on its branch. Learn recommends that you clone into your user directory.","Incorrect: /tmp is on the local disk, so the clone is lost when the compute instance is recreated. Learn suggests /tmp only as a workaround for slow clones in workspaces with identity-based storage access."],"ref":"https://learn.microsoft.com/azure/machine-learning/concept-train-model-git-integration"},{"id":"1.3.5-06","obj":"1.3.5","difficulty":"hard","type":"single","stem":"Contoso Suites requires every production model to be traceable to committed code. User1 changed the src/train.py file in a cloned repository and submitted a job that uses the changed script. The job properties show azureml.git.dirty set to True. The next job must use the same changes and record a clean state.\n\nWhat should User1 do before submitting the next job?","choices":["Commit the changes to src/train.py","Run git stash in the repository directory","Add src/train.py to an .amlignore file","Push the current branch to origin"],"answer":[0],"explanation":"The dirty flag records whether the working tree had uncommitted changes when the job was submitted. A clean flag together with the recorded commit hash means that the exact code can be recovered from the repository, which is what traceability needs. Commit first, and push so that others can retrieve the commit.","rationale":["Correct: azureml.git.dirty is True when git status --porcelain reports uncommitted changes. After the commit, the job records a clean state and the commit hash that contains the changed script.","Incorrect: git stash removes the uncommitted changes from the working tree, so the flag clears but the next job runs the old version of src/train.py. Stash when you need to put work aside.","Incorrect: .amlignore removes src/train.py from the job snapshot, so the job would not even get the training script. It also does not change what git status reports for the repository.","Incorrect: pushing publishes commits that already exist. The changes are still uncommitted, so the working tree stays dirty and the flag stays True."],"ref":"https://learn.microsoft.com/azure/machine-learning/concept-train-model-git-integration"},{"id":"1.3.5-07","obj":"1.3.5","difficulty":"easy","type":"single","stem":"Coho Vineyard has a private GitHub repository. User1 must clone the repository from the terminal of an Azure Machine Learning compute instance. Company policy does not allow SSH keys on compute instances, so User1 must clone over HTTPS.\n\nWhich credential should User1 provide to the Git CLI?","choices":["An SSH private key from the ~/.ssh directory","The client ID of a user-assigned managed identity","The access key of the workspace default storage account","A personal access token for the GitHub account"],"answer":[3],"explanation":"A compute instance has a full Git client in its terminal. You can clone any repository that you can authenticate to: over SSH with a key pair whose public key is registered with the Git service, or over HTTPS with a personal access token.","rationale":["Incorrect: an SSH key pair is how you clone over the SSH protocol, which the policy rules out. With SSH you register the public key, not the private key, with the Git account.","Incorrect: a managed identity client ID identifies an Azure identity for sign-in to Azure, for example from GitHub Actions with a federated credential. GitHub does not accept it for Git operations.","Incorrect: the storage account key authorizes access to Azure Storage, such as the workspace file share. It is not a credential that GitHub accepts for cloning.","Correct: to clone over HTTPS from a compute instance terminal, you use the Git CLI with a personal access token, which GitHub accepts in place of a password."],"ref":"https://learn.microsoft.com/azure/machine-learning/concept-train-model-git-integration"}],"cases":{"C-a":{"id":"C-a","title":"Lamna Healthcare Company","sections":[["Overview","Lamna Healthcare Company is a healthcare provider that runs clinics in Amsterdam, Brussels, and Copenhagen. A data science team of six people builds a machine learning model that predicts which patients might miss an appointment. A platform team owns the Azure subscription, the network, and the deployment pipelines.\n\nLamna Healthcare Company plans to manage all its machine learning infrastructure as code and to tighten the security of the environment before the model goes into production."],["Existing environment","**Azure environment**\n\n- The company has a Microsoft Entra ID tenant and an Azure subscription named Sub1.\n- A resource group named rg-noshow-prod in the West Europe region contains an Azure Machine Learning workspace named mlw-noshow-prod and its dependent resources: a storage account, a key vault, an Application Insights resource, and a container registry.\n- A separate storage account named stclaimsdata stores 2 TB of historical claims data in a blob container. Training jobs read this data.\n- A virtual network named VNet-Hub connects to the clinics by using a site-to-site VPN.\n- Data scientists use compute instances in mlw-noshow-prod and install Python packages from pypi.org.\n\n**GitHub environment**\n\n- A GitHub organization named lamna contains a repository named mlops-infra.\n- The infra/main.bicep file in the repository defines the workspace, its dependent resources, and its network settings. The file declares the key vault with an empty accessPolicies list.\n- A workflow file named deploy-infra.yml runs on every push to the main branch. The workflow has one job named deploy that runs az deployment group create for the infra/main.bicep file.\n- The deploy job signs in by using a service principal. The client secret of the service principal is stored in a repository secret named AZURE_CREDENTIALS.\n\n**Problem statements**\n\nSince deploy-infra.yml started to run on every merge, User1 and User2 report that compute instance start and stop operations fail intermittently after a deployment completes."],["Planned changes","Lamna Healthcare Company plans to implement the following changes:\n\n- Create a user-assigned managed identity named id-mlops-gh. All GitHub workflows will sign in to Azure as id-mlops-gh.\n- Add a workflow named validate-infra.yml that runs on every pull request that targets the main branch. The workflow will have one job that previews the changes in the infra/main.bicep file and posts the result to the pull request.\n- Create a GitHub environment named production that requires approval by a member of the platform team. The deploy job in deploy-infra.yml will run in the production environment.\n- Move the clinic reporting dashboards from an on-premises Power BI Report Server to the Power BI service."],["Requirements","**Security requirements**\n\n- No client secret, password, or other long-lived Azure credential can be stored in GitHub.\n- The workspace must not accept requests from the public internet. Users must connect from VNet-Hub through a private endpoint.\n- Managed compute in the workspace must reach only two destinations: the pypi.org package index and the blob service of stclaimsdata. The risk of data exfiltration must be minimized.\n\n**Deployment requirements**\n\n- deploy-infra.yml must continue to deploy the complete infra/main.bicep file on every merge to the main branch.\n- Every deployment to production must be approved by a member of the platform team before it runs.\n- Infrastructure changes must be previewed in each pull request before the change is merged.\n\n**Business requirements**\n\n- The model must score the appointments of the next day every night by 05:00.\n- Clinic managers must see the predictions in their existing Power BI reports."]]}}};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives, CASES = DATA.cases || {};
// per-exam storage prefix ("ai500" for AI-500), so several exams on one site keep separate progress
const KEY = DATA.exam.id.toLowerCase().replace(/[^a-z0-9]/g, "");
const $app = document.getElementById("app");
const $$ = s => [...$app.querySelectorAll(s)];

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get(KEY + ".history", {}); // id -> true/false (last result fully correct)

const theme = store.get(KEY + ".theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set(KEY + ".theme", next);
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => p.split("\n").every(l => l.startsWith("- "))
      ? `<ul>${p.split("\n").map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`
      : "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const why = s => `<div class="why">${inline(s)}</div>`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dom = q => q.obj.split(".")[0];
const isStd = q => !q.case && !q.series;
const SERIES_NOTE = "This question is one of a series that share the same scenario. Each question in the series offers a different solution that might or might not meet the goal. A series can have more than one correct solution, or none. After you answer a question in this series, you cannot return to it, and it does not appear on the review screen.";
const HOW = {
  multi: q => `Choose ${q.answer.length}`, order: q => `Arrange ${q.answer.length} in order`,
  yesno: () => "Yes / No for each statement", dragdrop: () => "Drag and drop", dropdown: () => "Select from each list",
};

// ---------- answers ----------
function blank(q) {
  if (q.type === "yesno") return q.choices.map(() => null);
  if (q.type === "dragdrop" || q.type === "dropdown") return q.targets.map(() => null);
  return [];
}
function complete(q, p) {
  if (q.type === "single") return p.length === 1;
  if (q.type === "multi" || q.type === "order") return p.length === q.answer.length;
  return p.every(v => v !== null);
}
const answered = it => it.picked.some(v => v !== null);
// Partial credit per box/statement/selection, like the real exam; build lists are all-or-nothing.
function grade(q, p) {
  if (q.type === "single") return +(p[0] === q.answer[0]);
  if (q.type === "multi") return p.filter(x => q.answer.includes(x)).length / q.answer.length;
  if (q.type === "order") return +(p.length === q.answer.length && p.every((x, i) => x === q.answer[i]));
  if (q.type === "yesno") return p.filter((v, i) => v === q.answer.includes(i)).length / p.length;
  return p.filter((v, i) => v === q.answer[i]).length / p.length; // dragdrop, dropdown
}
const item = q => ({ q, order: !q.choices ? [] : q.series ? [0, 1] : shuffle(q.choices.map((_, i) => i)), picked: blank(q), checked: false, locked: false, mark: false });

// ---------- home ----------
let S = null, tick = null;
window.onbeforeunload = () => (S && S.mode === "exam" && !S.done ? true : undefined);

function home() {
  clearInterval(tick); S = null;
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all", ...store.get(KEY + ".cfg", {}) };
  const types = Object.entries(Q.reduce((a, q) => (a[q.case ? "case" : q.series ? "series" : q.type] = (a[q.case ? "case" : q.series ? "series" : q.type] || 0) + 1, a), {}));
  $app.innerHTML = `
  <div class="card">
    <h2>New session</h2>
    <fieldset><legend>Mode</legend><select id="mode">
      <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Practice (instant feedback)</option>
      <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Exam (feedback at the end)</option>
      <option value="sim" ${cfg.mode === "sim" ? "selected" : ""}>Exam simulation (50 questions, 100 minutes)</option>
    </select>
    <p class="muted" id="simnote">Exam simulation ignores the filters below: questions are weighted by the study-guide domain percentages and include a problem-solution series and a case study in their own sections. No objective or difficulty hints, a countdown timer, mark for review, and a review screen per section. Once you leave a section you cannot return to it.</p>
    </fieldset>
    <div id="filters">
    <fieldset><legend>Domains</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} questions)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Difficulty</legend><div class="row">
      ${[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Question pool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> All</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Not seen yet</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Previously wrong (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Questions</legend><select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></fieldset>
    </div>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Progress on this device</h2>
    <p>${seen} of ${Q.length} questions answered, ${seen - wrong} last correct, ${wrong} last wrong.</p>
    ${statsTable()}
    <p class="muted">Question types: ${types.map(([t, n]) => `${t} ${n}`).join(", ")}.</p>
    <div class="actions"><button class="ghost" id="reset" type="button">Reset progress</button></div>
  </div>`;
  const mode = document.getElementById("mode"), sync = () => {
    document.getElementById("filters").hidden = mode.value === "sim";
    document.getElementById("simnote").hidden = mode.value !== "sim";
  };
  mode.onchange = sync; sync();
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all progress?")) { history = {}; store.set(KEY + ".history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domain</th><th>Done</th><th>Correct</th></tr>${rows}</table>`;
}

// keep case-study and series questions together, in id order, at the position of their first member
function grouped(qs) {
  const g = new Map();
  qs.forEach(q => { const k = q.case || q.series || q.id; if (!g.has(k)) g.set(k, []); g.get(k).push(q); });
  return [...g.values()].flatMap(xs => xs.sort((a, b) => a.id.localeCompare(b.id)));
}

function simSections() {
  const caseIds = [...new Set(Q.filter(q => q.case).map(q => q.case))];
  const seriesIds = [...new Set(Q.filter(q => q.series).map(q => q.series))];
  const cs = caseIds.length ? grouped(Q.filter(q => q.case === pick(caseIds))) : [];
  const sr = seriesIds.length ? grouped(Q.filter(q => q.series === pick(seriesIds))) : [];
  const n = 50 - cs.length - sr.length;
  // domain share = midpoint of the study-guide weight range, largest remainder rounding
  const w = Object.entries(DOMAINS).map(([k, d]) => { const [a, b] = d.weight.match(/\d+/g).map(Number); return [k, (a + (b ?? a)) / 2]; });
  const tot = w.reduce((s, [, x]) => s + x, 0);
  const cnt = w.map(([k, x]) => ({ k, c: Math.floor(n * x / tot), r: (n * x / tot) % 1 }));
  [...cnt].sort((a, b) => b.r - a.r).slice(0, n - cnt.reduce((s, x) => s + x.c, 0)).forEach(x => x.c++);
  const std = shuffle(cnt.flatMap(({ k, c }) => shuffle(Q.filter(q => isStd(q) && dom(q) === k)).slice(0, c)));
  return [["std", std], ["series", sr], ["case", cs]].filter(([, xs]) => xs.length);
}

function start() {
  const mode = document.getElementById("mode").value;
  let secs;
  if (mode === "sim") {
    store.set(KEY + ".cfg", { ...store.get(KEY + ".cfg", {}), mode });
    secs = simSections();
  } else {
    const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
    const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode };
    store.set(KEY + ".cfg", cfg);
    let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
    if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
    if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
    if (!pool.length) { document.getElementById("msg").textContent = "No questions match this selection."; return; }
    secs = [["std", grouped(shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n))]];
  }
  const items = [], sections = [];
  secs.forEach(([kind, qs]) => { sections.push({ kind, start: items.length, end: items.length + qs.length }); items.push(...qs.map(item)); });
  S = { mode: mode === "practice" ? "practice" : "exam", sim: mode === "sim", items, secs: sections, sec: 0, i: 0, tab: 0, sel: null, t0: Date.now() };
  if (S.sim) {
    S.deadline = Date.now() + 100 * 60000;
    tick = setInterval(() => {
      const left = S.deadline - Date.now(), el = document.getElementById("clock");
      if (left <= 0) { alert("Time is up. Your exam is submitted."); return finish(); }
      if (el) el.textContent = clock(left);
    }, 1000);
    return intro();
  }
  show();
}
const clock = ms => { const s = Math.ceil(ms / 1000); return `Time left ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const clockChip = () => S.deadline ? `<span class="chip clock" id="clock">${clock(S.deadline - Date.now())}</span>` : "";

function intro() {
  const sec = S.secs[S.sec], n = sec.end - sec.start;
  const text = {
    std: `This section contains ${n} questions. You can move back and forth, mark questions for review, and change your answers until you finish the section. When you finish it, you cannot return to it.`,
    series: `This section contains a problem-solution series of ${n} questions. ${SERIES_NOTE}`,
    case: `This section contains a case study with ${n} questions. Each question uses the same scenario; use the tabs to read the parts of the case study. You can move between the questions of this case study until you finish the section.`,
  }[sec.kind];
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Section ${S.sec + 1} of ${S.secs.length}</span>${clockChip()}</div>
    <h2>${{ std: "Questions", series: "Problem-solution series", case: "Case study" }[sec.kind]}</h2>
    <p>${esc(text)}</p>
    ${S.sec === 0 ? `<p class="muted">${S.items.length} questions in total, 100 minutes. Passing score: 700 on a scale of 1 to 1000.</p>` : ""}
    <div class="actions"><button id="go" type="button">Start section</button></div></div>`;
  document.getElementById("go").onclick = () => { S.i = sec.start; S.tab = 0; show(); };
}

// ---------- question ----------
function casePanel(id) {
  const c = CASES[id]; if (!c) return "";
  const t = Math.min(S.tab, c.sections.length - 1);
  return `<details class="case" ${S.caseClosed ? "" : "open"}><summary><strong>Case study: ${esc(c.title)}</strong></summary>
    <div class="tabs">${c.sections.map(([h], k) => `<button type="button" class="ghost sm" data-tab="${k}" aria-pressed="${k === t}">${esc(h)}</button>`).join("")}</div>
    <div class="case-body">${md(c.sections[t][1])}</div></details>`;
}

function sel(it, i, lock, reveal) {
  const q = it.q, t = q.targets[i], p = it.picked;
  const cls = reveal ? (p[i] === q.answer[i] ? "correct" : "wrong") : "";
  return `<select data-t="${i}" class="${cls}" ${lock ? "disabled" : ""} aria-label="Box ${i + 1}"><option value="">Select...</option>${t.options.map((o, k) => `<option value="${k}" ${p[i] === k ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

function stemHTML(it, lock, reveal) {
  const h = md(it.q.stem);
  return it.q.type === "dropdown" ? h.replace(/\[\[(\d+)\]\]/g, (_, n) => sel(it, n - 1, lock, reveal)) : h;
}

function answerHTML(it, lock, reveal) {
  const q = it.q, p = it.picked, dis = lock ? "disabled" : "", drag = !lock;
  switch (q.type) {
    case "single": case "multi": {
      const multi = q.type === "multi";
      return `<div>${it.order.map(ci => {
        const cls = reveal ? (q.answer.includes(ci) ? "correct" : p.includes(ci) ? "wrong" : "") : "";
        return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" data-c="${ci}" ${dis} ${p.includes(ci) ? "checked" : ""}>
          <span>${inline(q.choices[ci])}${reveal ? why(q.rationale[ci]) : ""}</span></label>`;
      }).join("")}</div>`;
    }
    case "yesno":
      return `<table class="yn"><tr><th>Statement</th><th>Yes</th><th>No</th></tr>${q.choices.map((s, i) => {
        const cls = reveal ? (p[i] === q.answer.includes(i) ? "correct" : "wrong") : "";
        return `<tr class="${cls}"><td>${inline(s)}${reveal ? why(q.rationale[i]) : ""}</td>${[1, 0].map(v => `<td><input type="radio" name="yn${i}" data-i="${i}" data-v="${v}" aria-label="${v ? "Yes" : "No"}: statement ${i + 1}" ${dis} ${p[i] === !!v ? "checked" : ""}></td>`).join("")}</tr>`;
      }).join("")}</table>`;
    case "order": {
      const tile = (ci, k) => {
        const cls = reveal ? (q.answer[k] === ci ? "correct" : "wrong") : "";
        return `<div class="tile ${cls}" draggable="${drag}" data-c="${ci}" ${k === undefined && !lock ? `tabindex="0" role="button"` : ""}>
          ${k === undefined ? "" : `<span class="num">${k + 1}.</span>`}<span class="txt">${inline(q.choices[ci])}</span>
          ${k === undefined || lock ? "" : `<span class="tools"><button type="button" class="ghost sm" data-up="${k}" aria-label="Move up">&uarr;</button><button type="button" class="ghost sm" data-down="${k}" aria-label="Move down">&darr;</button><button type="button" class="ghost sm" data-rm="${k}" aria-label="Remove">&times;</button></span>`}</div>`;
      };
      return `<div class="dd">
        <div><div class="lbl">Actions</div><div class="zone pool" data-zone="pool">${it.order.filter(ci => !p.includes(ci)).map(ci => tile(ci)).join("")}</div></div>
        <div><div class="lbl">Answer area</div><div class="zone area" data-zone="area">${p.map((ci, k) => tile(ci, k)).join("")}</div></div></div>
        ${lock ? "" : `<p class="muted">Click or drag an action into the answer area, then use the arrows to put it in order.</p>`}
        ${reveal ? `<div class="lbl">Correct sequence</div><ol>${q.answer.map(ci => `<li>${inline(q.choices[ci])}${why(q.rationale[ci])}</li>`).join("")}</ol>
          <div class="lbl">Not part of the sequence</div><ul>${q.choices.map((c, ci) => q.answer.includes(ci) ? "" : `<li>${inline(c)}${why(q.rationale[ci])}</li>`).join("")}</ul>` : ""}`;
    }
    case "dragdrop":
      return `<div class="lbl">Values</div><div class="zone pool flat">${it.order.map(ci => `<div class="tile ${S.sel === ci ? "sel" : ""}" draggable="${drag}" data-c="${ci}" ${lock ? "" : `tabindex="0" role="button"`}><span class="txt">${inline(q.choices[ci])}</span></div>`).join("")}</div>
        <div class="lbl">Answer area</div><table>${q.targets.map((t, i) => {
          const ok = p[i] === q.answer[i], cls = reveal ? (ok ? "correct" : "wrong") : "";
          return `<tr><td>${inline(t)}</td><td><div class="slot ${cls}" data-t="${i}" ${lock ? "" : `tabindex="0" role="button"`}>${p[i] === null ? `<span class="muted">${lock ? "(empty)" : "Click a value, then click here"}</span>` : inline(q.choices[p[i]])}</div>
            ${reveal ? why((ok ? "" : `Answer: ${q.choices[q.answer[i]]}. `) + q.rationale[i]) : ""}</td></tr>`;
        }).join("")}</table>
        ${lock ? "" : `<p class="muted">Each value may be used once, more than once, or not at all.</p>`}
        ${reveal ? `<div class="lbl">About each value</div><ul>${q.choices.map((c, ci) => `<li><strong>${inline(c)}</strong>${why(q.notes[ci])}</li>`).join("")}</ul>` : ""}`;
    case "dropdown": {
      const inStem = q.stem.includes("[[1]]");
      if (inStem && !reveal) return "";
      return `<table>${q.targets.map((t, i) => {
        const ok = p[i] === q.answer[i];
        return `<tr><td>${inStem ? `Box ${i + 1}` : inline(t.label)}</td><td>${inStem ? "" : sel(it, i, lock, reveal)}
          ${reveal ? `<div class="why"><span class="${ok ? "ok" : "bad"}">${ok ? "Your answer is correct" : p[i] === null ? "No answer" : "Your answer is incorrect"}</span>
            <ul>${t.options.map((o, k) => `<li class="${k === q.answer[i] ? "ok" : k === p[i] ? "bad" : ""}"><code>${esc(o)}</code>: ${inline(t.why[k])}</li>`).join("")}</ul></div>` : ""}</td></tr>`;
      }).join("")}</table>`;
    }
  }
  return "";
}

function bindAnswer(it, lock) {
  if (lock) return;
  const q = it.q, p = it.picked, redraw = () => show(true);
  $$("input[data-c]").forEach(b => b.onchange = () => {
    const ci = +b.dataset.c;
    if (q.type === "single") it.picked = [ci];
    else if (b.checked) { if (p.length < q.answer.length) p.push(ci); } else p.splice(p.indexOf(ci), 1);
    redraw();
  });
  $$("input[data-i]").forEach(b => b.onchange = () => { p[+b.dataset.i] = b.dataset.v === "1"; redraw(); });
  $$("select[data-t]").forEach(s => s.onchange = () => { p[+s.dataset.t] = s.value === "" ? null : +s.value; redraw(); });
  $$(".tile[draggable=true]").forEach(t => t.ondragstart = e => e.dataTransfer.setData("text/plain", t.dataset.c));
  $$("[tabindex][role=button]").forEach(el => el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } });
  const zone = (el, drop) => { el.ondragover = e => e.preventDefault(); el.ondrop = e => { e.preventDefault(); drop(+e.dataTransfer.getData("text/plain"), e); redraw(); }; };
  if (q.type === "order") {
    $$(".pool .tile").forEach(t => t.onclick = () => { if (p.length < q.answer.length) { p.push(+t.dataset.c); redraw(); } });
    $$("[data-up]").forEach(b => b.onclick = () => { const k = +b.dataset.up; if (k > 0) [p[k - 1], p[k]] = [p[k], p[k - 1]]; redraw(); });
    $$("[data-down]").forEach(b => b.onclick = () => { const k = +b.dataset.down; if (k < p.length - 1) [p[k + 1], p[k]] = [p[k], p[k + 1]]; redraw(); });
    $$("[data-rm]").forEach(b => b.onclick = () => { p.splice(+b.dataset.rm, 1); redraw(); });
    $$("[data-zone=area]").forEach(z => zone(z, (ci, e) => {
      const from = p.indexOf(ci);
      if (from >= 0) p.splice(from, 1); else if (p.length >= q.answer.length) return;
      const li = e.target.closest(".tile[data-c]"), at = li ? p.indexOf(+li.dataset.c) : -1;
      p.splice(at < 0 ? p.length : at, 0, ci);
    }));
    $$("[data-zone=pool]").forEach(z => zone(z, ci => { const k = p.indexOf(ci); if (k >= 0) p.splice(k, 1); }));
  }
  if (q.type === "dragdrop") {
    $$(".pool .tile").forEach(t => t.onclick = () => { S.sel = S.sel === +t.dataset.c ? null : +t.dataset.c; redraw(); });
    $$(".slot").forEach(s => {
      s.onclick = () => { p[+s.dataset.t] = S.sel ?? null; S.sel = null; redraw(); };
      zone(s, ci => { p[+s.dataset.t] = ci; S.sel = null; });
    });
  }
}

function show(keep) {
  const it = S.items[S.i], q = it.q, sec = S.secs[S.sec], practice = S.mode === "practice";
  const lock = practice ? it.checked : it.locked, reveal = practice && it.checked;
  const levels = { easy: "Easy", medium: "Medium", hard: "Hard" };
  const prog = practice ? S.i / S.items.length : S.items.filter(answered).length / S.items.length;
  $app.innerHTML = `
  <div class="bar"><div style="width:${100 * prog}%"></div></div>
  <div class="card">
    <div class="chips">
      <span class="chip">Question ${S.i + 1} of ${S.items.length}</span>
      ${S.sim ? "" : `<span class="chip">${q.obj} ${esc(OBJ[q.obj])}</span><span class="chip ${q.difficulty}">${levels[q.difficulty]}</span>`}
      ${HOW[q.type] && !q.series ? `<span class="chip">${HOW[q.type](q)}</span>` : ""}
      ${it.mark ? `<span class="chip">Marked for review</span>` : ""}
      ${clockChip()}
    </div>
    ${q.case ? casePanel(q.case) : ""}
    ${q.series ? `<div class="note">${esc(SERIES_NOTE)}</div>` : ""}
    <div class="stem">${stemHTML(it, lock, reveal)}</div>
    ${answerHTML(it, lock, reveal)}
    ${reveal ? feedback(it) : ""}
    <div class="actions">${practice ? navPractice(it) : navExam(it, sec)}</div>
  </div>`;
  bindAnswer(it, lock);
  $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = +b.dataset.tab; show(true); });
  $$("details.case").forEach(d => d.ontoggle = () => { S.caseClosed = !d.open; });
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  on("prev", () => { S.i--; S.sel = null; show(); });
  on("check", () => {
    it.score = grade(q, it.picked); it.checked = true;
    history[q.id] = it.score === 1; store.set(KEY + ".history", history);
    show(true);
  });
  on("next", () => {
    if (q.series && !practice) it.locked = true;
    S.sel = null;
    if (S.i + 1 < sec.end) { S.i++; return show(); }
    if (practice) return result();
    sec.kind === "series" ? endSection() : review();
  });
  on("mark", () => { it.mark = !it.mark; show(true); });
  on("review", review);
  on("quit", () => {
    if (practice) return S.review || !S.items.some(x => x.checked) ? home() : result();
    if (confirm("End the exam now? Unanswered questions count as incorrect.")) finish();
  });
  if (!keep) window.scrollTo(0, 0);
}

function navPractice(it) {
  const last = S.i + 1 === S.items.length;
  return `${S.i > 0 ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    ${it.checked ? `<button id="next" type="button">${last ? (S.review ? "Done" : "Results") : "Next"}</button>`
      : `<button id="check" type="button" ${complete(it.q, it.picked) ? "" : "disabled"}>Check</button><button class="ghost" id="next" type="button">Skip</button>`}
    <button class="ghost" id="quit" type="button">${S.review ? "Close review" : "Stop"}</button>`;
}

function navExam(it, sec) {
  const series = sec.kind === "series" || it.q.series, last = S.i + 1 === sec.end;
  const prevOk = S.i > sec.start && !series && !S.items[S.i - 1].locked;
  return `${prevOk ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    <button id="next" type="button">${!last ? "Next" : series ? (S.sec + 1 < S.secs.length ? "Next section" : "Finish exam") : "Review"}</button>
    ${series ? "" : `<button class="ghost" id="mark" type="button" aria-pressed="${it.mark}">Mark for review</button><button class="ghost" id="review" type="button">Review screen</button>`}
    <button class="ghost" id="quit" type="button">End exam</button>`;
}

function review() {
  const sec = S.secs[S.sec], idx = [];
  for (let i = sec.start; i < sec.end; i++) if (!S.items[i].q.series) idx.push(i);
  const open = idx.filter(i => !answered(S.items[i])).length, marked = idx.filter(i => S.items[i].mark).length;
  const lastSec = S.sec + 1 === S.secs.length;
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Review screen${S.secs.length > 1 ? ` -- section ${S.sec + 1} of ${S.secs.length}` : ""}</span>${clockChip()}</div>
    <p>${idx.length - open} answered, ${open} unanswered, ${marked} marked for review. Select a question to return to it.</p>
    <div class="rv">${idx.map(i => { const x = S.items[i]; return `<button class="ghost" type="button" data-go="${i}">Question ${i + 1}<br><span class="muted">${answered(x) ? "Answered" : "Unanswered"}${x.mark ? ", marked" : ""}</span></button>`; }).join("")}</div>
    <div class="actions">
      <button id="endsec" type="button">${lastSec ? "Submit exam" : "Finish section"}</button>
      <button class="ghost" id="back" type="button">Return to question ${S.i + 1}</button>
    </div></div>`;
  $$("[data-go]").forEach(b => b.onclick = () => { S.i = +b.dataset.go; S.tab = 0; show(); });
  document.getElementById("back").onclick = () => show();
  document.getElementById("endsec").onclick = () => {
    const msg = (open ? `${open} question(s) are unanswered. ` : "") + (lastSec ? "Submit the exam?" : "After you finish this section, you cannot return to it. Continue?");
    if (confirm(msg)) endSection();
  };
  window.scrollTo(0, 0);
}

function endSection() {
  const sec = S.secs[S.sec];
  for (let i = sec.start; i < sec.end; i++) S.items[i].locked = true;
  if (++S.sec >= S.secs.length) return finish();
  S.sim ? intro() : (S.i = S.secs[S.sec].start, show());
}

function finish() {
  clearInterval(tick); S.done = true;
  S.items.forEach(it => {
    it.score = grade(it.q, it.picked); it.checked = true;
    if (answered(it)) history[it.q.id] = it.score === 1;
  });
  store.set(KEY + ".history", history);
  result();
}

function feedback(it) {
  const q = it.q, s = it.score;
  return `<p class="verdict ${s === 1 ? "ok" : "bad"}">${s === 1 ? "Correct!" : s > 0 ? `Partially correct (${Math.round(100 * s)}%).` : "Incorrect."}</p>
    <div>${md(q.explanation)}</div>
    <p class="muted">Source: <a href="${esc(q.ref)}" target="_blank" rel="noopener">${esc(q.ref.replace("https://", ""))}</a></p>`;
}

function result() {
  clearInterval(tick);
  const xs = S.mode === "practice" ? S.items.filter(x => x.checked) : S.items;
  const pts = xs.reduce((s, x) => s + x.score, 0), pct = xs.length ? Math.round(100 * pts / xs.length) : 0;
  const per = Object.entries(DOMAINS).map(([k, d]) => {
    const ds = xs.filter(x => dom(x.q) === k); if (!ds.length) return "";
    const g = ds.reduce((s, x) => s + x.score, 0);
    return `<tr><td>${esc(d.title)}</td><td>${+g.toFixed(1)}/${ds.length}</td><td>${Math.round(100 * g / ds.length)}%</td></tr>`;
  }).join("");
  const wrong = xs.filter(x => x.score < 1), mins = Math.round((Date.now() - S.t0) / 60000);
  $app.innerHTML = `
  <div class="card">
    <h2>Results</h2>
    <div class="big">${pct}%</div>
    <p>${+pts.toFixed(1)} of ${xs.length} points${S.sim ? `, ${mins} minutes used` : ""}. Multi-part questions earn partial credit.
      ${pct >= 70 ? "Around passing level." : "Below passing level."} <span class="muted">The real exam reports a scaled score where 700 of 1000 passes; that is not exactly 70% correct.</span></p>
    <table><tr><th>Domain</th><th>Points</th><th>%</th></tr>${per}</table>
    <div class="actions">
      ${wrong.length ? `<button id="rwrong" type="button">Review ${wrong.length} mistakes</button>` : ""}
      <button class="ghost" id="rall" type="button">Review all</button>
      <button class="ghost" id="home" type="button">New session</button>
    </div>
  </div>`;
  const rev = list => { S = { mode: "practice", review: true, items: list, secs: [{ kind: "std", start: 0, end: list.length }], sec: 0, i: 0, tab: 0, sel: null }; show(); };
  document.getElementById("home").onclick = home;
  document.getElementById("rall").onclick = () => rev(xs);
  const rw = document.getElementById("rwrong"); if (rw) rw.onclick = () => rev(wrong);
}

home();
</script>
</body>
</html>
