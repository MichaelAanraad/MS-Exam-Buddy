<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-300 Exam Buddy</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6573; --line: #dde1e6;
  --accent: #0b63ce; --accent-text: #ffffff; --ok: #1a7f37; --ok-bg: #e6f4ea; --bad: #c62828; --bad-bg: #fdecea;
  --code-bg: #f0f2f5; --chip: #eef2f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
    --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
    --code-bg: #0c0f13; --chip: #242a32;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
  --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
  --code-bg: #0c0f13; --chip: #242a32;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; overflow-wrap: anywhere; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.muted { color: var(--muted); font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
label.opt { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
legend { font-weight: 600; margin-bottom: 8px; }
button, select { font: inherit; }
button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button.sm { padding: 2px 9px; font-weight: 500; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, .choice:focus-within, select:focus-visible, .tile:focus-visible, .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); max-width: 100%; }
pre select { font: inherit; padding: 0 4px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
.chip.easy { color: var(--ok); } .chip.hard { color: var(--bad); } .chip.clock { color: var(--text); font-weight: 600; }
.stem p { margin: 0 0 10px; }
pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; overflow-wrap: normal; font-size: .85rem; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0; cursor: pointer; }
.choice input { margin-top: 4px; }
.correct { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
.wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.why { font-size: .9rem; color: var(--muted); margin-top: 4px; }
.verdict { font-weight: 700; margin: 12px 0 4px; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.bar > div { height: 100%; background: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { min-width: 64px; }
table.yn td:not(:first-child), table.yn th:not(:first-child) { text-align: center; width: 56px; }
.big { font-size: 2.2rem; font-weight: 700; }
a { color: var(--accent); }
.lbl { font-weight: 600; margin: 14px 0 6px; }
.dd { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .dd { grid-template-columns: 1fr; } }
.zone { min-height: 60px; border: 1px dashed var(--line); border-radius: 10px; padding: 6px; background: var(--bg); }
.pool.flat { display: flex; flex-wrap: wrap; gap: 6px; }
.pool.flat .tile { margin: 0; }
.tile { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--card); cursor: grab; }
.tile.sel { outline: 2px solid var(--accent); }
.tile .num { font-weight: 600; flex: none; }
.tile .txt { flex: 1; }
.tools { display: flex; gap: 4px; flex: none; }
.slot { min-height: 40px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px; cursor: pointer; background: var(--bg); }
.case { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; background: var(--bg); }
.case summary { cursor: pointer; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.case-body { max-height: 55vh; overflow: auto; }
.case-body p { margin: 0 0 10px; }
.note { border-left: 4px solid var(--accent); padding: 8px 12px; background: var(--chip); border-radius: 6px; margin-bottom: 12px; font-size: .9rem; }
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.rv button { text-align: left; font-weight: 500; }
</style>
</head>

    <h1>AI-300 Exam Buddy</h1>
    <button class="ghost" id="theme" type="button" aria-label="Toggle light/dark theme">Theme</button>

const DATA = {"exam":{"id":"AI-300","title":"Operationalizing Machine Learning and Generative AI Solutions"},"domains":{"1":{"title":"Design and implement an MLOps infrastructure","weight":"15-20%"},"2":{"title":"Implement machine learning model lifecycle and operations","weight":"25-30%"},"3":{"title":"Design and implement a GenAIOps infrastructure","weight":"20-25%"},"4":{"title":"Implement generative AI quality assurance and observability","weight":"10-15%"},"5":{"title":"Optimize generative AI systems and model performance","weight":"10-15%"}},"objectives":{"1.1.1":"Create and manage a workspace","1.1.2":"Create and manage datastores","1.1.3":"Create and manage compute targets","1.1.4":"Configure identity and access management for workspaces","1.2.1":"Create and manage data assets","1.2.2":"Create and manage environments","1.2.3":"Create and manage components","1.2.4":"Share assets across workspaces by using registries","1.3.1":"Configure GitHub integration with Machine Learning to enable secure access","1.3.2":"Deploy Machine Learning workspaces and resources by using Bicep and Azure CLI","1.3.3":"Automate resource provisioning by using GitHub Actions workflows","1.3.4":"Restrict network access to Machine Learning workspaces","1.3.5":"Manage source control for machine learning projects by using Git","2.1.1":"Configure experiment tracking with MLflow","2.1.2":"Use automated machine learning to explore optimal models","2.1.3":"Use notebooks for experimentation and exploration","2.1.4":"Automate hyperparameter tuning","2.1.5":"Run model training scripts","2.1.6":"Manage distributed training for large and deep learning models","2.1.7":"Implement training pipelines","2.1.8":"Compare model performance across jobs","2.2.1":"Package a feature retrieval specification with the model artifact","2.2.2":"Register an MLflow model","2.2.3":"Evaluate a model by using responsible AI principles","2.2.4":"Manage model lifecycle, including archiving models","2.3.1":"Deploy models as real-time or batch endpoints with managed inference options","2.3.2":"Test and troubleshoot model endpoints","2.3.3":"Implement progressive rollout and safe rollback strategies","2.4.1":"Detect and analyze data drift","2.4.2":"Monitor performance metrics of models deployed to production","2.4.3":"Configure retraining or alert triggers when thresholds are exceeded","3.1.1":"Create and configure Foundry resources and project environments","3.1.2":"Configure identity and access management with managed identities and role-based access control (RBAC)","3.1.3":"Implement network security and private networking configurations","3.1.4":"Deploy infrastructure using Bicep templates and Azure CLI","3.2.1":"Deploy foundation models by using serverless API endpoints and managed compute options","3.2.2":"Select appropriate models for specific use cases","3.2.3":"Implement model versioning and production deployment strategies","3.2.4":"Configure provisioned throughput units for high-volume workloads","3.3.1":"Design and develop prompts","3.3.2":"Create prompt variants and compare performance across different prompts","3.3.3":"Implement version control for prompts by using Git repositories","4.1.1":"Create test datasets and data mapping for comprehensive model evaluation","4.1.2":"Implement AI quality metrics, including groundedness, relevance, coherence, and fluency","4.1.3":"Configure risk and safety evaluations for harmful content detection","4.1.4":"Set up automated evaluation workflows by using built-in and custom evaluation metrics","4.2.1":"Examine continuous monitoring in Foundry","4.2.2":"Monitor performance metrics, including latency, throughput, and response times","4.2.3":"Track and optimize cost metrics, including token consumption and resource usage","4.2.4":"Configure detailed logging, tracing, and debugging capabilities for production troubleshooting","5.1.1":"Optimize retrieval performance by tuning similarity thresholds, chunk sizes, and retrieval strategies","5.1.2":"Select and fine-tune embedding models for domain-specific use cases and accuracy improvements","5.1.3":"Implement and optimize hybrid search approaches combining semantic and keyword-based retrieval","5.1.4":"Evaluate and improve RAG system performance by using relevance metrics and A/B testing frameworks","5.2.1":"Design and implement advanced fine-tuning methods","5.2.2":"Create and manage synthetic data for fine-tuning","5.2.3":"Monitor and optimize fine-tuned model performance","5.2.4":"Manage a fine-tuned model from development through production deployment"},"questions":[{"id":"1.3.1-01","obj":"1.3.1","difficulty":"easy","type":"order","stem":"Contoso, Ltd. has a private GitHub repository that contains training code. User1 works on a compute instance in an Azure Machine Learning workspace and must clone the repository to the compute instance by using the SSH protocol. Company policy does not allow personal access tokens for GitHub.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In a terminal on the compute instance, run `ssh-keygen -t ed25519 -C \"user1@contoso.com\"` and save the key in /home/azureuser/.ssh.","Run `cat ~/.ssh/id_ed25519.pub` and add the output as a new SSH key in the GitHub account of User1.","Run `git clone git@github.com:contoso/churn-model.git` and verify the SSH fingerprint of the host.","Add the contents of the ~/.ssh/id_ed25519 file as a new SSH key in the GitHub account of User1.","Create a personal access token in GitHub and run `git clone https://github.com/contoso/churn-model.git`."],"answer":[0,1,2],"explanation":"To clone over SSH from a compute instance, you generate a key pair in the terminal, register the public key with the Git service, and then clone by using the SSH URL. The private key stays on the compute instance, where only the owner of the instance can access it. HTTPS with a personal access token is the alternative when SSH is not an option.","rationale":["Step 1: ssh-keygen creates the public and private key pair on the compute instance. Save it in /home/azureuser/.ssh, where the key is accessible only to the compute instance owner and where SSH looks for it.","Step 2: GitHub authenticates the compute instance by its public key, so the contents of id_ed25519.pub must be added to the GitHub account before an SSH clone can succeed.","Step 3: with the public key registered, git clone with the SSH URL succeeds. On the first connection SSH shows the host fingerprint, which you verify to protect against a man-in-the-middle attack.","Incorrect: id_ed25519 without the .pub extension is the private key. It must stay on the compute instance; GitHub needs only the public key, and uploading the private key would expose the credential.","Incorrect: cloning over HTTPS with a personal access token is the documented alternative to SSH, but the policy forbids personal access tokens and the requirement is SSH. Use HTTPS with a token when SSH cannot be used."],"ref":"https://learn.microsoft.com/azure/machine-learning/concept-train-model-git-integration"},{"id":"1.3.1-02","obj":"1.3.1","difficulty":"easy","type":"single","series":"S-iac","stem":"Fabrikam, Inc. stores Azure Machine Learning job definitions in a GitHub repository. A GitHub Actions workflow that runs on GitHub-hosted runners must sign in to Azure and submit jobs to a workspace named Workspace1. Company policy prohibits storing a client secret, a password, or any other long-lived Azure credential in GitHub.\n\nYou need to configure how the workflow authenticates to Azure.\n\nSolution: You create a service principal that has a client secret and assign it a role on Workspace1. You save the JSON output of the service principal in a repository secret named AZURE_CREDENTIALS and set the creds input of the azure/login action to that secret.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"The azure/login action supports two sign-in methods: a service principal with a client secret (the creds input) and OpenID Connect with a federated identity credential. Only OpenID Connect avoids a stored secret, because GitHub issues a short-lived token that Microsoft Entra ID exchanges for an Azure access token.","rationale":["Incorrect: the JSON in AZURE_CREDENTIALS contains the client secret of the service principal, which is a long-lived credential stored in GitHub. Learn describes this method as less secure and not recommended.","Correct: the solution does not meet the goal because the client secret is stored in GitHub. The secret-based method is an option only when OpenID Connect cannot be used and policy allows a stored secret."],"ref":"https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect"},{"id":"1.3.1-03","obj":"1.3.1","difficulty":"medium","type":"single","series":"S-iac","stem":"Fabrikam, Inc. stores Azure Machine Learning job definitions in a GitHub repository. A GitHub Actions workflow that runs on GitHub-hosted runners must sign in to Azure and submit jobs to a workspace named Workspace1. Company policy prohibits storing a client secret, a password, or any other long-lived Azure credential in GitHub.\n\nYou need to configure how the workflow authenticates to Azure.\n\nSolution: You create a user-assigned managed identity, assign it a role on Workspace1, and add a federated identity credential that trusts the repository. You store the client ID, tenant ID, and subscription ID as GitHub secrets, grant the workflow the id-token: write permission, and pass the three IDs to the azure/login action.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[0],"explanation":"OpenID Connect sign-in needs three parts: an identity (a Microsoft Entra application or a user-assigned managed identity) with a role assignment, a federated identity credential that matches the GitHub subject, and a workflow that has the id-token: write permission and passes client-id, tenant-id, and subscription-id to azure/login.","rationale":["Correct: the federated identity credential lets the workflow exchange its GitHub OIDC token for an Azure access token. The client, tenant, and subscription IDs are identifiers, not credentials, and id-token: write lets the job request the token.","Incorrect: the solution meets the goal. No would apply if the workflow lacked the id-token: write permission or if the credential subject did not match the branch, environment, or pull request that runs the job."],"ref":"https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect"},{"id":"1.3.1-04","obj":"1.3.1","difficulty":"hard","type":"single","series":"S-iac","stem":"Fabrikam, Inc. stores Azure Machine Learning job definitions in a GitHub repository. A GitHub Actions workflow that runs on GitHub-hosted runners must sign in to Azure and submit jobs to a workspace named Workspace1. Company policy prohibits storing a client secret, a password, or any other long-lived Azure credential in GitHub.\n\nYou need to configure how the workflow authenticates to Azure.\n\nSolution: You enable the system-assigned managed identity of Workspace1, assign the identity a role on Workspace1, and configure the azure/login action to sign in as that identity.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"A GitHub-hosted runner runs outside Azure, so it cannot sign in as the managed identity of an Azure resource. For secretless sign-in, Learn lists two options: a Microsoft Entra application or a user-assigned managed identity, each with a federated identity credential that trusts tokens that GitHub issues for the repository.","rationale":["Incorrect: the system-assigned identity belongs to the workspace and is used by the workspace itself. A GitHub workflow signs in without a secret through a federated identity credential, and Learn states that configuring one on a system-assigned managed identity is not supported.","Correct: the solution does not meet the goal because the workflow cannot sign in as the system-assigned identity of Workspace1. The workspace identity is the right choice when the workspace accesses its own storage account or key vault."],"ref":"https://learn.microsoft.com/entra/workload-id/workload-identity-federation-create-trust-user-assigned-managed-identity"},{"id":"1.3.1-05","obj":"1.3.1","difficulty":"hard","type":"yesno","case":"C-a","stem":"You plan the federated identity credentials of id-mlops-gh for the GitHub workflows.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The deploy job needs a federated credential that has the entity type Environment and the value production.","A federated credential that has the entity type Branch and the value main lets the deploy job sign in.","The validate-infra.yml workflow needs a federated credential that has the entity type Pull request."],"answer":[0,2],"explanation":"Microsoft Entra ID compares the issuer and subject of the GitHub token with each federated identity credential. The subject depends on how the job runs: environment:<name> for jobs tied to an environment, ref:refs/heads/<branch> or a tag ref for other push jobs, and pull_request for pull request events. A subject that does not match makes the token exchange fail.","rationale":["Yes: the deploy job runs in the production environment, so its token subject names the environment, for example repo:lamna/mlops-infra:environment:production. The credential must match that subject exactly, which requires the entity type Environment and the value production.","No: a Branch credential has the subject repo:lamna/mlops-infra:ref:refs/heads/main, which matches jobs that are not tied to an environment. Because the deploy job runs in an environment, its token carries the environment subject instead.","Yes: validate-infra.yml runs on pull_request events, which produce a subject that ends in :pull_request. A Pull request credential matches it, so the workflow can sign in as id-mlops-gh to preview the changes."],"ref":"https://learn.microsoft.com/entra/workload-id/workload-identity-federation-create-trust"},{"id":"1.3.1-06","obj":"1.3.1","difficulty":"hard","type":"single","stem":"Litware, Inc. uses an app registration named App1 to sign in to Azure from GitHub Actions by using OpenID Connect. App1 has one federated identity credential that has the entity type Branch and the value main. A workflow that runs on pushes to the main branch contains a job that includes the setting environment: staging. The azure/login step of this job fails because Microsoft Entra ID rejects the token exchange. Other workflows that sign in as App1 must keep working.\n\nWhat should you do?","choices":["Add a federated credential to App1 that has the entity type Pull request","Add a federated credential to App1 that has the entity type Environment and the value staging","Change the existing credential of App1 to the entity type Tag and the value main","Change the audience of the existing credential to https://token.actions.githubusercontent.com"],"answer":[1],"explanation":"A GitHub job that references an environment gets a token whose subject names the environment instead of the branch. Each subject that must sign in needs its own federated identity credential, because a standard credential matches one exact subject. An app or user-assigned managed identity can have up to 20 credentials.","rationale":["Incorrect: the Pull request entity type produces the subject repo:<org>/<repo>:pull_request, which matches workflows triggered by pull_request events. The failing job runs on a push and is tied to an environment.","Correct: a job that references an environment presents the subject repo:<org>/<repo>:environment:staging. A new Environment credential fixes the job, and keeping the Branch credential keeps the other workflows working.","Incorrect: a Tag credential matches workflows triggered by a pushed tag, and changing the existing credential breaks the workflows that rely on the main branch credential. Use Tag when release workflows run on tags.","Incorrect: https://token.actions.githubusercontent.com is the issuer of GitHub tokens, not the audience. The recommended audience is api://AzureADTokenExchange, and this failure is caused by the subject."],"ref":"https://learn.microsoft.com/entra/workload-id/workload-identity-federation-create-trust"},{"id":"1.3.1-07","obj":"1.3.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank uses a user-assigned managed identity named Identity1 to run a GitHub Actions workflow. The workflow submits training jobs to an existing compute cluster in a workspace named Workspace1 and registers the resulting models. Identity1 must not be able to create or delete compute resources or change the workspace. You need to grant Identity1 access by following the principle of least privilege.\n\nWhich role assignment should you create?","choices":["Contributor on the resource group that contains Workspace1","AzureML Compute Operator on Workspace1","AzureML Data Scientist on Workspace1","Reader on Workspace1"],"answer":[2],"explanation":"A workflow identity needs a role assignment just like a user. Azure Machine Learning has built-in roles for typical duties: AzureML Data Scientist for experiments, jobs, and models, and AzureML Compute Operator for compute. Scope the assignment to the workspace, and combine roles only when the workflow also manages compute.","rationale":["Incorrect: Contributor can create, edit, and delete assets and compute, and at resource group scope it covers every other resource in the group too. Use it for an identity that deploys the templates that create the workspace.","Incorrect: AzureML Compute Operator can create, manage, and delete compute resources, which the requirements forbid, and it does not cover job submission or model registration. Assign it to an identity that manages clusters.","Correct: AzureML Data Scientist can perform all actions in a workspace except creating or deleting compute resources and modifying the workspace itself, so the workflow can submit jobs and register models within the stated limits.","Incorrect: Reader allows read-only actions, so the workflow could list jobs and models but not submit jobs or register models. Use Reader for an identity that only reports on workspace assets."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-assign-roles?view=azureml-api-2#default-roles"},{"id":"1.3.1-08","obj":"1.3.1","difficulty":"easy","type":"single","stem":"Relecloud configures a federated identity credential on a Microsoft Entra application so that a GitHub Actions workflow can sign in to the public Azure cloud by using the azure/login action. The workflow uses the default settings of the action.\n\nWhich audience value should you set in the federated identity credential?","choices":["api://AzureADTokenExchangeUSGov","https://management.azure.com","https://token.actions.githubusercontent.com","api://AzureADTokenExchange"],"answer":[3],"explanation":"A federated identity credential has three matching fields: the issuer (the GitHub OIDC provider), the subject (the repository plus a branch, environment, tag, or pull request), and the audience. The token exchange succeeds only when all three match the claims in the token that GitHub issues.","rationale":["Incorrect: api://AzureADTokenExchangeUSGov is the audience that Learn shows for signing in to Azure US Government, together with the environment input set to AzureUSGovernment. It does not apply to the public cloud.","Incorrect: https://management.azure.com is the Azure Resource Manager endpoint that the access token is used against after sign-in. It is not the audience of the GitHub token that Microsoft Entra ID exchanges.","Incorrect: https://token.actions.githubusercontent.com is the issuer of GitHub OIDC tokens. It belongs in the issuer field of the credential, which the portal fills in for the GitHub Actions scenario.","Correct: in public clouds, the azure/login action uses the audience api://AzureADTokenExchange by default, and it is the recommended audience value for a federated identity credential."],"ref":"https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect"},{"id":"1.3.2-01","obj":"1.3.2","difficulty":"medium","type":"order","stem":"Northwind Traders has a file named main.bicep that defines an Azure Machine Learning workspace named mlw-prod and its dependent resources. The file targets a resource group. A resource group named rg-mlprod does not exist yet. The Azure CLI and its ml extension are installed.\n\nYou need to preview the changes that main.bicep makes, deploy the file, and then use the ml extension to display the properties of the new workspace.\n\nWhich four commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.","choices":["`az group create --name rg-mlprod --location westeurope`","`az deployment group what-if --resource-group rg-mlprod --template-file main.bicep`","`az deployment group create --resource-group rg-mlprod --template-file main.bicep`","`az ml workspace show --name mlw-prod --resource-group rg-mlprod`","`az deployment sub create --location westeurope --template-file main.bicep`","`az ml workspace create --name mlw-prod --resource-group rg-mlprod`","`bicep build main.bicep`"],"answer":[0,1,2,3],"explanation":"A Bicep deployment from the Azure CLI follows the target scope of the file: a resource group file uses the az deployment group commands, and the resource group must exist first. Run what-if before create to preview the changes, and use az ml workspace show to display the new workspace.","rationale":["Step 1: a resource group deployment needs an existing resource group, and both what-if and create run at resource group scope. az group create makes rg-mlprod in the chosen region.","Step 2: what-if lists the resources that the file would create, modify, or delete without changing anything, and it also validates the file. It runs against the existing resource group, so it follows az group create.","Step 3: az deployment group create compiles main.bicep and deploys the workspace and its dependent resources into rg-mlprod after you review the preview.","Step 4: az ml workspace show uses the ml extension to return the properties of mlw-prod, such as its storage account, key vault, and MLflow tracking URI. It runs last because the workspace exists only after the deployment.","Incorrect: az deployment sub create deploys at subscription scope, which you use for a file that sets targetScope to subscription, for example to create resource groups. main.bicep targets a resource group.","Incorrect: az ml workspace create would create the workspace outside the Bicep file, with new dependent resources. Use it when you manage the workspace with the CLI and a YAML file instead of Bicep.","Incorrect: the Azure CLI compiles a .bicep file during what-if and deployment, so a separate build is not needed. Use bicep build when you need the compiled JSON template, for example to inspect or publish it."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-cli"},{"id":"1.3.2-02","obj":"1.3.2","difficulty":"hard","type":"dropdown","stem":"Proseware, Inc. writes a Bicep file that creates an Azure Machine Learning workspace. The file already declares resources that have the symbolic names storage, vault, and appInsights. The workspace must meet the following requirements:\n\n- Use a managed identity that does not have to be created as a separate resource.\n- Use the key vault that the file declares.\n- Reject requests from the public internet.\n- Access the system datastores in the default storage account by using Microsoft Entra ID instead of account keys.\n\nHow should you complete the Bicep code? To answer, select the appropriate options in the answer area.\n\n```bicep\nresource workspace 'Microsoft.MachineLearningServices/workspaces@2024-04-01' = {\n  name: workspaceName\n  location: location\n  identity: {\n    type: '[[1]]'\n  }\n  properties: {\n    storageAccount: storage.id\n    keyVault: [[2]]\n    applicationInsights: appInsights.id\n    publicNetworkAccess: '[[3]]'\n    systemDatastoresAuthMode: '[[4]]'\n  }\n}\n```","targets":[{"label":"Box 1","options":["SystemAssigned","UserAssigned","None"],"why":["Correct: SystemAssigned enables an identity that belongs to the workspace itself, so no separate identity resource is needed. The workspace uses it to access its storage account and key vault.","Incorrect: UserAssigned requires a separate Microsoft.ManagedIdentity resource that you list in userAssignedIdentities. Use it when several resources share one identity or it must exist before the workspace.","Incorrect: None disables the managed identity, so the workspace has no identity to use for identity-based access to its storage account and key vault."]},{"label":"Box 2","options":["vault.id","vault.name","vault.properties.vaultUri"],"why":["Correct: the keyVault property expects the Azure Resource Manager resource ID of the key vault, and vault.id returns it. storageAccount and applicationInsights follow the same pattern.","Incorrect: vault.name returns only the name of the key vault. A name alone does not identify the resource across resource groups and subscriptions, so the workspace properties take full resource IDs.","Incorrect: vault.properties.vaultUri is the data-plane URI that applications use to read secrets. The workspace property takes the Azure Resource Manager resource ID, not the vault URI."]},{"label":"Box 3","options":["Disabled","Enabled"],"why":["Correct: Disabled makes the workspace reject requests from the public network, so clients must connect through a private endpoint.","Incorrect: Enabled accepts requests from the public network. Combine Enabled with IP network rules when only selected public IP ranges must reach the workspace."]},{"label":"Box 4","options":["identity","accesskey"],"why":["Correct: identity makes the workspace use Microsoft Entra ID, through its managed identity or the identity of the user, to access the system datastores instead of the shared key of the storage account.","Incorrect: accesskey keeps shared key access to the default storage account. It is the value you set to revert a workspace when key-based access to the storage account is required again."]}],"answer":[0,0,0,0],"explanation":"In Bicep, the workspace properties reference dependent resources by resource ID (symbolicName.id). The identity block sets the managed identity type, publicNetworkAccess controls inbound public access, and systemDatastoresAuthMode set to identity switches the system datastores from shared keys to Microsoft Entra ID authorization, as in the Learn template sample for API version 2024-04-01.","ref":"https://learn.microsoft.com/azure/machine-learning/how-to-disable-local-auth-storage?view=azureml-api-2"},{"id":"1.3.2-03","obj":"1.3.2","difficulty":"easy","type":"single","stem":"Alpine Ski House must create a new Azure Machine Learning workspace by using the Azure CLI. The workspace must use an existing storage account and an existing key vault. The CLI can create any other dependent resources automatically.\n\nWhat should you do?","choices":["Run `az ml workspace create -n ws1 -g rg1` without a YAML file and let the CLI create the dependent resources","Add the storage_account and key_vault resource IDs to a YAML file and run `az ml workspace create -g rg1 --file ws1.yml`","Run `az ml workspace create -n ws1 -g rg1` and then run `az ml workspace sync-keys -n ws1 -g rg1`","Add the storage_account and key_vault resource IDs to a YAML file and run `az ml workspace update -g rg1 --file ws1.yml`"],"answer":[1],"explanation":"The CLI v2 creates a workspace with new dependent resources by default. To bring your own storage account, key vault, container registry, or Application Insights resource, put their Azure Resource Manager IDs in a workspace YAML file and pass it with --file (the command also accepts IDs in parameters such as --storage-account and --key-vault). You can mix existing and automatically created resources.","rationale":["Incorrect: with no YAML file and no resource ID parameters, az ml workspace create creates new dependent services, such as a storage account and a key vault. Use it when you have no existing resources to reuse.","Correct: a workspace YAML file lists the resource IDs of existing resources in storage_account and key_vault. Resources that you leave out, such as Application Insights, are created automatically.","Incorrect: the first command creates new dependent resources, and sync-keys only makes the workspace pick up regenerated access keys immediately instead of after about an hour. It does not change which resources it uses.","Incorrect: az ml workspace update changes settings of a workspace that already exists, such as public network access. The workspace in this scenario must be created, so the update command does not apply."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-manage-workspace-cli"},{"id":"1.3.2-04","obj":"1.3.2","difficulty":"medium","type":"single","stem":"Fourth Coffee deploys a Bicep file that creates an Azure Machine Learning workspace and sets an existing storage account as the default storage account of the workspace. The deployment fails because the storage account is not supported as default storage. The storage account has the following settings:\n\n- Performance: Standard\n- Redundancy: Standard_GRS\n- Hierarchical namespace: Enabled\n- Minimum TLS version: 1.2\n\nWhich setting should you change so that the deployment succeeds?","choices":["Standard performance","Standard_GRS redundancy","Minimum TLS version 1.2","Hierarchical namespace"],"answer":[3],"explanation":"The default storage account of a workspace must be a standard account, not a premium one, with both Blob and File capabilities and no hierarchical namespace. Premium storage and Data Lake Storage accounts can still be attached to the workspace as additional datastores.","rationale":["Incorrect: Standard performance is supported for the default storage account. The default storage account cannot be a premium account, such as Premium_LRS or Premium_GRS.","Incorrect: geo-redundant storage is a standard SKU and is supported. Only premium accounts are excluded, so Standard_GRS does not cause the failure.","Incorrect: a minimum TLS version of 1.2 is a common security setting and is not one of the requirements for the default storage account, so it does not cause the failure.","Correct: the default storage account cannot have a hierarchical namespace, which is the Azure Data Lake Storage feature. A hierarchical namespace account can still be used as a non-default datastore."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-create-workspace-template"},{"id":"1.3.2-05","obj":"1.3.2","difficulty":"hard","type":"single","stem":"Trey Research has a main.bicep file and a main.bicepparam file that starts with the statement using './main.bicep'. The team must keep using the .bicepparam file. A deployment script contains the following commands:\n\n```bash\nbicep build main.bicep\naz deployment group create --resource-group rg-ml --template-file main.json --parameters main.bicepparam\n```\n\nThe deployment fails with the message \"Only a .bicep file is allowed with a .bicepparam file\".\n\nWhat should you do?","choices":["Pass the parameters file as --parameters @main.bicepparam","Remove the --template-file parameter and keep --parameters main.bicepparam","Run the deployment by using az deployment sub create instead","Convert main.bicepparam to a JSON parameters file and pass it by using @"],"answer":[1],"explanation":"A .bicepparam file links itself to its template with a using statement, so the Azure CLI 2.53.0 or later deploys it with --parameters alone. JSON parameters files use the @ prefix and work with --template-file. A .bicepparam file can be passed to --parameters only once per command.","rationale":["Incorrect: the @ prefix is the syntax for loading a JSON parameters file, such as @storage.parameters.json. It is not how you pass a .bicepparam file, and the command would still combine it with a JSON template.","Correct: the using statement already points to main.bicep, so the CLI needs only --parameters main.bicepparam. A .bicepparam file works with its .bicep template, and Learn states that adding --template-file causes this error.","Incorrect: az deployment sub create targets subscription scope and is used for files that set targetScope to subscription. The file deploys to a resource group, and the scope does not cause this error.","Incorrect: a JSON parameters file works with --template-file, but the team must keep using the .bicepparam file. Use JSON parameters files when your Azure CLI or Bicep CLI version does not support .bicepparam files."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-cli"},{"id":"1.3.2-06","obj":"1.3.2","difficulty":"medium","type":"single","stem":"Wide World Importers has a Bicep file named main.bicep that starts with targetScope = 'subscription'. The file creates a resource group and uses a module to deploy an Azure Machine Learning workspace into that resource group.\n\nWhich command should you use to deploy main.bicep?","choices":["`az deployment group create --resource-group rg-ml --template-file main.bicep`","`az deployment mg create --location westeurope --template-file main.bicep`","`az deployment sub create --location westeurope --template-file main.bicep`","`az deployment tenant create --location westeurope --template-file main.bicep`"],"answer":[2],"explanation":"Each Bicep file has one target scope, and the Azure CLI command must match it: az deployment group, sub, mg, or tenant. To create a resource group and deploy into it in one operation, use a subscription scope file with a module whose scope is the new resource group.","rationale":["Incorrect: az deployment group create deploys into an existing resource group, for files with the default resource group scope. This file creates the resource group itself, so it runs at subscription scope.","Incorrect: az deployment mg create deploys files that set targetScope to managementGroup, for example to deploy policies across subscriptions. It does not match a subscription scope file.","Correct: a file with targetScope set to subscription is deployed with az deployment sub create and a location for the deployment metadata. The module then deploys the workspace into the new resource group.","Incorrect: az deployment tenant create is for files with targetScope set to tenant, such as files that create management groups. It needs tenant-level permissions and does not match this file."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/create-resource-group"},{"id":"1.3.2-07","obj":"1.3.2","difficulty":"easy","type":"single","stem":"Coho Winery runs az deployment group create to deploy a Bicep file that creates the first Azure Machine Learning workspace in a new subscription. The deployment fails with the message \"The subscription is not registered to use namespace Microsoft.MachineLearningServices\".\n\nWhat should you do before you run the deployment again?","choices":["Register the Microsoft.MachineLearningServices resource provider in the subscription","Install the ml extension of the Azure CLI on the computer that runs the deployment","Assign the AzureML Data Scientist role to your account on the resource group","Request a quota increase for compute cores in the region of the workspace"],"answer":[0],"explanation":"Azure Machine Learning depends on several resource providers, such as Microsoft.MachineLearningServices, Microsoft.Storage, Microsoft.KeyVault, and Microsoft.ContainerRegistry, plus Microsoft.Network for a managed virtual network. An error about an unregistered namespace is fixed by registering that provider.","rationale":["Correct: the error means that the subscription has not registered the resource provider for Azure Machine Learning. Most providers register automatically, but not all, and the workspace cannot be created until it is registered.","Incorrect: the ml extension adds the az ml commands to the Azure CLI. A Bicep deployment with az deployment group create does not use the extension, and the error comes from Azure Resource Manager.","Incorrect: AzureML Data Scientist grants actions inside an existing workspace and cannot create workspaces. A missing permission returns an authorization error, not a namespace registration error.","Incorrect: quota limits apply to compute resources such as clusters and instances. The error names an unregistered namespace, not an exceeded quota."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-create-workspace-template?view=azureml-api-2#troubleshooting"},{"id":"1.3.2-08","obj":"1.3.2","difficulty":"hard","type":"single","case":"C-a","stem":"You need to resolve the compute instance failures that User1 and User2 report. The solution must meet the deployment requirements.\n\nWhat should you do?","choices":["Run the deployment in Complete mode so that the template defines the full state of the resource group","Give each deployment of main.bicep a unique name so that earlier deployments stay in the history","Remove the key vault from main.bicep and pass the resource ID of the existing key vault as a parameter","Change deploy-infra.yml so that a team member starts it manually instead of on each push"],"answer":[2],"explanation":"Most resource deployments from a template are idempotent, but a key vault that a template declares has its access policies cleared on each deployment, which can break stop and create operations of compute instances. Reference the existing vault by ID, set accessPolicies to the current policies, or avoid redeploying the vault.","rationale":["Incorrect: Complete mode deletes resources in the resource group that the template does not define. It does not stop the key vault declaration from clearing the access policies on every deployment.","Incorrect: unique deployment names keep separate history entries and stop concurrent runs from replacing each other. Each deployment would still redeploy the key vault with an empty access policy list.","Correct: redeploying a key vault from a template clears its access policies, which breaks compute instance operations. Referencing the existing vault by ID stops the reset, and the workflow keeps deploying on every merge.","Incorrect: deploying less often reduces how often the access policies are cleared but does not prevent it, and the requirements state that deploy-infra.yml must keep deploying on every merge to main."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-create-workspace-template"},{"id":"1.3.3-01","obj":"1.3.3","difficulty":"medium","type":"order","stem":"Tailspin Toys adds a job to a GitHub Actions workflow. An earlier step of the job checks out the repository and installs the ml extension of the Azure CLI. The remaining steps must sign in to Azure by using OpenID Connect, deploy the infra/main.bicep file, which defines a workspace named Workspace1, to an existing resource group named rg-ml, create a compute cluster from the infra/cluster.yml file, and submit the training job in the jobs/train.yml file, which runs on the new cluster. Workspace1 does not use a managed virtual network.\n\nWhich four steps should you add to the job in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.","choices":["Run the azure/login action with the client-id, tenant-id, and subscription-id inputs.","Run `az deployment group create --resource-group rg-ml --template-file infra/main.bicep`.","Run `az ml compute create --file infra/cluster.yml --resource-group rg-ml --workspace-name Workspace1`.","Run `az ml job create --file jobs/train.yml --resource-group rg-ml --workspace-name Workspace1`.","Run the azure/login action with the creds input set to the AZURE_CREDENTIALS secret.","Run `az deployment sub create --location westeurope --template-file infra/main.bicep`.","Run `az ml workspace provision-network -g rg-ml -n Workspace1`."],"answer":[0,1,2,3],"explanation":"In a provisioning workflow, order the steps by dependency: authenticate, deploy the infrastructure that contains everything else, create the compute, and then submit work to it. GitHub Actions runs the steps of a job in the listed order, so a wrong order fails at the first missing dependency.","rationale":["Step 1: every later step calls Azure, so the job signs in first. With OpenID Connect, azure/login receives the client, tenant, and subscription IDs and exchanges the GitHub token for an Azure access token.","Step 2: the Bicep deployment creates Workspace1 in rg-ml. The compute cluster and the job both belong to the workspace, so the workspace must exist before they are created.","Step 3: az ml compute create builds the cluster from its YAML definition in Workspace1. The training job targets this cluster, so the cluster must exist before the job is submitted.","Step 4: az ml job create submits the job definition in jobs/train.yml to Workspace1, where it runs on the cluster that the previous step created.","Incorrect: the creds input passes the JSON of a service principal that includes a client secret. That method is less secure and does not meet the requirement to sign in by using OpenID Connect.","Incorrect: az deployment sub create deploys a file that targets subscription scope. This file deploys Workspace1 into the existing resource group rg-ml, so it uses az deployment group create.","Incorrect: provision-network provisions the managed virtual network of a workspace before compute is created. Workspace1 has no managed virtual network, so the step is not needed."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-github-actions-machine-learning"},{"id":"1.3.3-02","obj":"1.3.3","difficulty":"hard","type":"dropdown","stem":"Adventure Works Cycles creates a GitHub Actions workflow that provisions machine learning infrastructure. The workflow must meet the following requirements:\n\n- Run after a pull request is merged into the main branch, and also when a team member starts it manually.\n- Run the Azure CLI commands in a step that installs the latest Azure CLI version.\n- Apply the changes in the infra/main.bicep file to the rg-mlops resource group.\n\nHow should you complete the workflow? To answer, select the appropriate options in the answer area.\n\n```yaml\nname: provision-ml-infra\non:\n  [[1]]:\n    branches: [ main ]\n  workflow_dispatch:\npermissions:\n  id-token: write\n  contents: read\njobs:\n  provision:\n    runs-on: ubuntu-latest\n    steps:\n    - uses: actions/checkout@v4\n    - uses: azure/login@v2\n      with:\n        client-id: ${{ secrets.AZURE_CLIENT_ID }}\n        tenant-id: ${{ secrets.AZURE_TENANT_ID }}\n        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}\n    - uses: [[2]]\n      with:\n        azcliversion: latest\n        inlineScript: |\n          az deployment group [[3]] --resource-group rg-mlops --template-file infra/main.bicep\n```","targets":[{"label":"Box 1","options":["push","pull_request"],"why":["Correct: merging a pull request adds a commit to main, so a push trigger filtered to the main branch runs the workflow after each merge.","Incorrect: pull_request runs when a pull request that targets main is opened or updated, before the change is merged. Use it for validation workflows, such as a what-if preview."]},{"label":"Box 2","options":["azure/cli@v2","azure/powershell@v2","azure/arm-deploy@v1"],"why":["Correct: the Azure CLI action runs the commands in inlineScript with the CLI version set in azcliversion, here the latest version, and it uses the session that azure/login created.","Incorrect: the Azure PowerShell action runs Azure PowerShell cmdlets and takes azPSVersion instead of azcliversion. Use it when the deployment script is written in Azure PowerShell.","Incorrect: arm-deploy deploys a template that you pass in its template and parameters inputs instead of running a script. For Bicep files, Learn recommends the azure/bicep-deploy action."]},{"label":"Box 3","options":["create","what-if","validate"],"why":["Correct: az deployment group create deploys the Bicep file and applies its changes to rg-mlops, which the workflow must do after each merge.","Incorrect: what-if previews the changes that the deployment would make without applying them. Run it in a pull request workflow so that reviewers see the impact before merging.","Incorrect: validate checks whether the template is valid and deployable but deploys nothing. Use it in a unit test workflow that runs on every commit."]}],"answer":[0,0,0],"explanation":"A typical IaC setup uses two triggers: pull_request for validation and what-if, and push to main, optionally with workflow_dispatch for manual runs, for the deployment. After azure/login, the azure/cli action runs Azure CLI scripts, such as az deployment group create for Bicep files.","ref":"https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect"},{"id":"1.3.3-03","obj":"1.3.3","difficulty":"easy","type":"single","stem":"Margie's Travel has a GitHub Actions workflow that retrains a model in Azure Machine Learning. The workflow must run automatically every night and must also run when a team member selects Run workflow on the Actions tab of the repository.\n\nWhich triggers should you configure in the on section of the workflow?","choices":["workflow_dispatch and schedule","push and schedule","pull_request and workflow_dispatch","push and pull_request"],"answer":[0],"explanation":"GitHub Actions triggers are events in the on section. schedule runs on a cron timetable, workflow_dispatch enables manual runs, pull_request reacts to pull request activity, and push reacts to commits. The Azure Machine Learning sample workflow runs on a cron schedule and on pull requests, and you can also start it with Run workflow.","rationale":["Correct: schedule with a cron expression starts the nightly run, and workflow_dispatch adds the Run workflow option so that a team member can start the workflow manually.","Incorrect: schedule covers the nightly run, but push starts the workflow on commits instead of on demand. Use push when code that is merged into a branch must trigger the workflow.","Incorrect: workflow_dispatch covers manual runs, but pull_request runs when a pull request is opened or updated, not on a timetable. Use pull_request to validate changes before merging.","Incorrect: neither trigger runs on a timetable or on demand. These are the code event triggers that validate pull requests and deploy merged changes."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-github-actions-machine-learning"},{"id":"1.3.3-04","obj":"1.3.3","difficulty":"medium","type":"single","stem":"City Power & Light has a GitHub Actions workflow that runs on every pull request to the main branch. Reviewers must see which Azure resources a change to the main.bicep file would create, modify, or delete. The workflow must not change any resources in the rg-ml resource group.\n\nWhich command should the workflow run?","choices":["`az deployment group validate --resource-group rg-ml --template-file main.bicep`","`az deployment group create --resource-group rg-ml --template-file main.bicep`","`bicep build main.bicep`","`az deployment group what-if --resource-group rg-ml --template-file main.bicep`"],"answer":[3],"explanation":"In an IaC pipeline, the pull request stage runs a what-if analysis and attaches the report to the pull request, and the deploy stage runs after the merge. What-if changes nothing, but Learn states that it has the same permission requirements as a deployment.","rationale":["Incorrect: validate checks that the template is valid and deployable at the resource group, but it does not list the resource changes. Use it in a unit test workflow that runs on every commit.","Incorrect: create deploys the file and changes resources in rg-ml before the pull request is reviewed. Run it in the workflow that triggers on pushes to main after the merge.","Incorrect: bicep build compiles main.bicep into an ARM JSON template, which catches syntax errors but does not compare the file with the resources in Azure.","Correct: what-if compares the file with the current state of rg-ml and reports each resource as Create, Modify, Delete, NoChange, or another change type, without deploying anything."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-what-if"},{"id":"1.3.3-05","obj":"1.3.3","difficulty":"easy","type":"single","stem":"Consolidated Messenger has a GitHub Actions job that signs in to Azure and then runs az ml job create --file train.yml. The step fails because the az ml command group is not available on the runner. The job must use the Azure Machine Learning CLI v2.\n\nWhat should you add before the failing step?","choices":["A step that runs `az extension add -n azure-cli-ml`","A step that runs `pip install azure-ai-ml`","A step that runs `az upgrade`","A step that runs `az extension add -n ml`"],"answer":[3],"explanation":"The Azure Machine Learning CLI v2 is the ml extension of the Azure CLI and requires Azure CLI 2.38.0 or later. On a fresh runner, install it with az extension add -n ml before the first az ml command. The older azure-cli-ml extension is CLI v1.","rationale":["Incorrect: azure-cli-ml is the deprecated CLI v1 extension. Learn tells you to remove it before you install the ml extension, so it does not provide the CLI v2 commands.","Incorrect: pip install azure-ai-ml installs the Python SDK v2, which you use from Python code through MLClient. It does not add commands to the Azure CLI.","Incorrect: az upgrade updates the Azure CLI and the extensions that are already installed. It does not install an extension that is missing on the runner.","Correct: the ml extension adds the az ml command group, which is the Azure Machine Learning CLI v2. Install it before any az ml command, and update it later with az extension update -n ml."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-configure-cli"},{"id":"1.3.3-06","obj":"1.3.3","difficulty":"hard","type":"single","stem":"Humongous Insurance has a GitHub Actions workflow that has two jobs. The inventory job runs az ml compute list against a workspace and must sign in as Identity1, which has only the Reader role. The deploy job references the production environment, deploys a Bicep file, and must sign in as Identity2, which has the Contributor role on the resource group. Each identity already has a federated credential that matches the subject of its job. Both jobs pass ${{ secrets.AZURE_CLIENT_ID }} to the azure/login action, and the repository secret AZURE_CLIENT_ID contains the client ID of Identity1. You must not change the workflow file.\n\nWhat should you do?","choices":["Replace the value of the repository secret AZURE_CLIENT_ID with the client ID of Identity2","Create an environment secret named AZURE_CLIENT_ID in production that contains the client ID of Identity2","Add a federated credential to Identity1 for the production environment","Assign the Contributor role to Identity1 at the resource group scope"],"answer":[1],"explanation":"GitHub environments can hold their own secrets. When a job references an environment, a secret of that environment takes precedence over a repository secret with the same name, and when the environment requires approval the job cannot read its secrets until a required reviewer approves. Learn's IaC reference architecture uses this to give the deploy stage a read/write identity while other jobs keep a read-only one.","rationale":["Incorrect: replacing the repository secret gives both jobs the client ID of Identity2, so the inventory job would run with Contributor access instead of as the Reader-only Identity1. Replace a repository secret when every job should use the new value.","Correct: a job that references an environment reads the secrets of that environment, and an environment secret overrides a repository secret with the same name. The deploy job gets the client ID of Identity2; the inventory job keeps Identity1.","Incorrect: a federated credential controls which GitHub subjects can sign in as an identity. The deploy job could then sign in, but as Identity1, which has only the Reader role and cannot deploy the Bicep file.","Incorrect: Contributor would let Identity1 deploy, but the inventory job would then also run with write access, which removes the separation between the two identities. Grant a role only when every job that uses the identity needs it."],"ref":"https://learn.microsoft.com/devops/deliver/iac-github-actions"},{"id":"1.3.3-07","obj":"1.3.3","difficulty":"medium","type":"single","stem":"Blue Yonder Airlines has a GitHub Actions workflow that runs the following command:\n\n```bash\naz deployment group create --name mlinfra --resource-group rg-ml --template-file main.bicep\n```\n\nWhen two workflow runs start at the same time with different parameter values, only the resources of the last run are deployed, and the deployment history shows a single entry.\n\nWhat should you change so that concurrent runs do not replace each other?","choices":["Add a value that is unique for each run to the deployment name","Add --mode Complete to the deployment command","Run az deployment group what-if before the deployment command","Deploy the file by using az deployment sub create instead"],"answer":[0],"explanation":"Each deployment name is an entry in the deployment history of the resource group. Reusing a name replaces the earlier entry, and concurrent deployments with the same name are replaced by the last one. Automation should give each deployment a unique name, for example by adding a random number or the date.","rationale":["Correct: deployments with the same name in the same resource group replace each other, so only the last one completes. A unique name per run lets the runs proceed side by side and keeps separate history entries.","Incorrect: Complete mode deletes resources in the resource group that the template does not define, which makes concurrent runs more destructive. It does not change how deployments with the same name replace each other.","Incorrect: what-if previews the changes of one deployment. It does not stop two deployments with the same name from replacing each other when they run at the same time.","Incorrect: subscription scope is for files that set targetScope to subscription. Changing the scope does not fix the shared deployment name, and a resource group file does not deploy that way."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-cli"},{"id":"1.3.3-08","obj":"1.3.3","difficulty":"hard","type":"multi","case":"C-a","stem":"You need to configure the job in validate-infra.yml so that it meets the deployment requirements and the security requirements.\n\nWhich two steps should the job include? Each correct answer presents part of the solution.","choices":["A step that runs azure/login with the client ID, tenant ID, and subscription ID of id-mlops-gh","A step that runs azure/login with the creds input set to the AZURE_CREDENTIALS secret","A step that runs `az deployment group what-if --resource-group rg-noshow-prod --template-file infra/main.bicep`","A step that runs `az deployment group create --resource-group rg-noshow-prod --template-file infra/main.bicep`","A step that runs `az deployment group validate --resource-group rg-noshow-prod --template-file infra/main.bicep`"],"answer":[0,2],"explanation":"A pull request workflow for infrastructure signs in with a secretless identity, runs a read-only what-if analysis, and posts the result for reviewers. The deploy workflow applies the change only after the merge, here gated by the approval rule of the production environment.","rationale":["Correct: id-mlops-gh signs in by using OpenID Connect, so azure/login needs only its client, tenant, and subscription IDs. No client secret is stored in GitHub, which meets the security requirement.","Incorrect: AZURE_CREDENTIALS holds the JSON of a service principal with a client secret. The security requirements forbid long-lived credentials in GitHub, and the planned changes replace this sign-in method.","Correct: what-if lists the resources that the change to infra/main.bicep would create, modify, or delete in rg-noshow-prod without deploying, which previews the change in each pull request.","Incorrect: create would deploy unmerged and unapproved changes from a pull request. Deployment belongs in deploy-infra.yml after the merge and after a member of the platform team approves it.","Incorrect: validate confirms that the template is deployable but does not show which resources change. It is a useful extra check, but it does not meet the preview requirement."],"ref":"https://learn.microsoft.com/devops/deliver/iac-github-actions"},{"id":"1.3.4-01","obj":"1.3.4","difficulty":"medium","type":"order","stem":"VanArsdel, Ltd. creates a new Azure Machine Learning workspace named Workspace1 in a resource group named rg1. Managed compute in Workspace1 must reach only approved destinations to minimize the risk of data exfiltration. The first compute instance must not time out while the network is provisioned, so you must confirm that network provisioning completed before you create the compute instance.\n\nWhich four commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.","choices":["`az ml workspace create --name Workspace1 --resource-group rg1 --managed-network allow_only_approved_outbound`","`az ml workspace provision-network -g rg1 -n Workspace1`","`az ml workspace show -n Workspace1 -g rg1 --query managed_network`","`az ml compute create --file instance.yml --resource-group rg1 --workspace-name Workspace1`","`az ml workspace create --name Workspace1 --resource-group rg1 --managed-network allow_internet_outbound`","`az network private-endpoint create --name pe1 --vnet-name VNet1 --subnet Subnet1 --private-connection-resource-id <Workspace1 ID> --group-id amlworkspace --connection-name workspace`"],"answer":[0,1,2,3],"explanation":"A managed virtual network isolates outbound traffic from managed compute, and its creation is deferred until the first compute resource is created or provisioning is started manually. Provision the network manually and check its status before you create compute, so that compute creation does not time out.","rationale":["Step 1: the allow_only_approved_outbound mode creates a managed virtual network that allows outbound traffic only to approved destinations and enables data exfiltration protection. The workspace must exist before its network is provisioned.","Step 2: otherwise the managed network is created together with the first compute, which can take about 30 minutes and can cause a timeout. provision-network starts the provisioning manually.","Step 3: az ml workspace show with --query managed_network returns the status of the managed network, which confirms that provisioning completed before any compute is created.","Step 4: the compute instance is created in the provisioned managed network, so its creation does not wait for the network and does not time out.","Incorrect: allow_internet_outbound allows all outbound internet traffic from the managed network. Use it when compute must download packages and models freely, not when only approved destinations are allowed.","Incorrect: a private endpoint for the workspace in your own virtual network secures inbound access to the workspace. The requirement is about outbound traffic from managed compute, which the managed network controls."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-managed-network"},{"id":"1.3.4-02","obj":"1.3.4","difficulty":"medium","type":"yesno","stem":"Nod Publishers configures a workspace named Workspace1 to use a managed virtual network in the allow only approved outbound mode.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Later, you can change the isolation mode of Workspace1 to allow internet outbound.","Adding an FQDN outbound rule to Workspace1 deploys an Azure Firewall, which adds charges to your bill.","You can add an FQDN outbound rule so that compute in Workspace1 can reach an Azure Storage account."],"answer":[1],"explanation":"In the allow only approved outbound mode, you add outbound rules of three types: private endpoint rules for Azure resources, service tag rules, and FQDN rules, which support ports 80 and 443 and use Azure Firewall. Plan the mode up front, because you cannot move from allow only approved outbound back to allow internet outbound or disable managed network isolation.","rationale":["No: after a managed network is set to allow only approved outbound, it cannot be reconfigured to allow internet outbound, and managed network isolation cannot be disabled once enabled. Choose the mode before you create compute.","Yes: FQDN outbound rules are implemented by an Azure Firewall that is created when you add the first FQDN rule. A Standard firewall is used by default, and you can select the Basic version instead.","No: in the allow only approved outbound mode, you cannot use an FQDN rule to access an Azure Storage account. Add a private endpoint outbound rule for the storage account instead."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-managed-network"},{"id":"1.3.4-03","obj":"1.3.4","difficulty":"easy","type":"dragdrop","stem":"Graphic Design Institute has three Azure Machine Learning workspaces that have different network requirements.\n\nWhich network configuration should you use for each workspace? To answer, drag the appropriate configurations to the correct workspaces. Each configuration may be used once, more than once, or not at all.","choices":["Public network access Disabled with a private endpoint","Public network access Enabled from selected IP addresses","Managed virtual network that allows only approved outbound","Managed virtual network that allows internet outbound"],"targets":["Workspace1: reject all requests from the internet; users connect from a peered virtual network","Workspace2: accept requests to the workspace only from the public IP range of the main office","Workspace3: let managed compute reach only approved destinations to limit data exfiltration"],"answer":[0,1,2],"rationale":["Workspace1 needs inbound isolation. Disabling public network access blocks requests from the internet, and a private endpoint in the virtual network gives users a private path to the workspace.","Workspace2 needs inbound filtering by public IP address. Enabled from selected IP addresses adds IP network rules that allow up to 200 public IPv4 ranges and block other internet traffic.","Workspace3 needs outbound control for managed compute. The allow only approved outbound mode limits traffic to approved rules and enables data exfiltration protection."],"notes":["Inbound control. Clients reach the workspace only through a private endpoint in your virtual network. Use it when the workspace must not be reachable from the internet.","Inbound control. IP network rules allow specific public IPv4 addresses or CIDR ranges and block general internet traffic. Private address ranges are not allowed in the rules.","Outbound control. Managed compute can reach only destinations that default or added outbound rules approve. Use it to minimize the risk of data exfiltration.","Outbound control. Managed compute can reach any internet destination, such as public package indexes. Use it when unrestricted downloads matter more than exfiltration protection."],"explanation":"Workspace network isolation has two directions. The public network access setting and private endpoints control inbound access to the workspace, and the managed virtual network isolation mode controls outbound access from managed compute. A secure workspace often combines one inbound and one outbound setting.","ref":"https://learn.microsoft.com/azure/machine-learning/how-to-network-isolation-planning?view=azureml-api-2#inbound-and-outbound-access"},{"id":"1.3.4-04","obj":"1.3.4","difficulty":"hard","type":"multi","stem":"Wingtip Toys creates a private endpoint for an Azure Machine Learning workspace in a virtual network named VNet1 by using az network private-endpoint create with the group ID amlworkspace. Clients in VNet1 must resolve the workspace endpoints to private IP addresses. The storage account, key vault, and container registry of the workspace already have their own private endpoints and private DNS zones.\n\nWhich two private DNS zones should you create and link to VNet1? Each correct answer presents part of the solution.","choices":["privatelink.api.azureml.ms","privatelink.notebooks.azure.net","privatelink.blob.core.windows.net","privatelink.vaultcore.azure.net","privatelink.azurecr.io"],"answer":[0,1],"explanation":"Each private endpoint needs DNS records in the zone that matches its resource type. A workspace private endpoint with the group ID amlworkspace uses privatelink.api.azureml.ms and privatelink.notebooks.azure.net, while dependent resources such as storage, Key Vault, and Container Registry use their own zones.","rationale":["Correct: privatelink.api.azureml.ms resolves the workspace API endpoints to the private endpoint. You create the zone, link it to the virtual network, and add it to the DNS zone group of the private endpoint.","Correct: privatelink.notebooks.azure.net resolves the notebook endpoints of the workspace. The workspace private endpoint needs this zone in addition to privatelink.api.azureml.ms.","Incorrect: privatelink.blob.core.windows.net is the zone for private endpoints of the blob service of a storage account. The storage account already has its own private endpoint and zone.","Incorrect: privatelink.vaultcore.azure.net is the zone for Azure Key Vault private endpoints. The key vault of the workspace is already covered by its own private endpoint and zone.","Incorrect: privatelink.azurecr.io is the zone for Azure Container Registry private endpoints. It is needed when the registry has a private endpoint, which already exists with its zone in this scenario."],"ref":"https://learn.microsoft.com/azure/private-link/private-endpoint-dns#commercial"},{"id":"1.3.4-05","obj":"1.3.4","difficulty":"easy","type":"single","stem":"Southridge Video has an Azure Machine Learning workspace named Workspace1. Data scientists connect to a virtual network named VNet1 through a VPN. Workspace1 must accept requests only from clients in VNet1 and must reject requests from the internet.\n\nWhat should you do?","choices":["Enable a managed virtual network for Workspace1 in the allow only approved outbound mode","Enable public access from selected IP addresses and add the address range of VNet1","Add a private endpoint for Workspace1 in VNet1 and disable public network access","Enable a managed virtual network in the allow internet outbound mode with private endpoint rules"],"answer":[2],"explanation":"Inbound access to a workspace is set by the public network access flag: Disabled requires a private endpoint, Enabled from selected IP addresses allows listed public IP addresses, and Enabled allows all networks. Outbound traffic from managed compute is a separate setting that the managed virtual network controls.","rationale":["Incorrect: a managed virtual network isolates outbound traffic from managed compute. It does not stop clients on the internet from reaching the workspace, so it does not meet the inbound requirement.","Incorrect: IP network rules accept only public internet addresses; private ranges such as those of VNet1 are not allowed. Use selected IP addresses when clients connect from known public IP addresses.","Correct: a private endpoint in VNet1 gives clients there a private path to Workspace1, and disabling public network access rejects all requests from the public internet.","Incorrect: private endpoint outbound rules let managed compute reach Azure resources privately. Like every managed network mode, this controls outbound traffic, not inbound access to the workspace."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-configure-private-link?view=azureml-api-2#enable-public-access-only-from-internet-ip-ranges"},{"id":"1.3.4-06","obj":"1.3.4","difficulty":"medium","type":"single","stem":"Lucerne Publishing has a workspace that uses a managed virtual network in the allow only approved outbound mode. A training job on a compute cluster fails because pip cannot download packages from pypi.org. All other outbound traffic must stay restricted to minimize the risk of data exfiltration.\n\nWhat should you do?","choices":["Add an FQDN outbound rule for pypi.org to the managed network","Add a private endpoint outbound rule for pypi.org to the managed network","Change the isolation mode of the managed network to allow internet outbound","Set the image build compute of the workspace to the compute cluster"],"answer":[0],"explanation":"In the allow only approved outbound mode, you allow extra destinations with outbound rules: private endpoint rules for Azure resources, service tag rules for Azure services, and FQDN rules for named internet hosts such as package indexes. Each added rule can increase exfiltration risk, so keep the list short.","rationale":["Correct: an FQDN rule allows outbound traffic to one named host on ports 80 and 443 while all other destinations stay blocked. The first FQDN rule deploys an Azure Firewall, which adds cost.","Incorrect: private endpoint rules connect the managed network to Azure resources, such as a storage account, by their resource ID. pypi.org is a public internet service, not an Azure resource.","Incorrect: a managed network in the allow only approved outbound mode cannot be changed to allow internet outbound, and opening all internet traffic would break the exfiltration requirement.","Incorrect: the image build compute builds Docker environment images when the container registry cannot build them behind a virtual network. It does not change which hosts a training job can reach."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-managed-network"},{"id":"1.3.4-07","obj":"1.3.4","difficulty":"hard","type":"single","stem":"First Up Consultants has an existing workspace named Workspace1 that contains two compute instances, a compute cluster, and a managed online endpoint. You must enable a managed virtual network for Workspace1 in the allow internet outbound mode, and all managed compute must run in the managed network.\n\nWhat should you do first?","choices":["Stop the compute instances and set the cluster minimum node count to zero","Run az ml workspace update with --managed-network allow_internet_outbound","Delete the compute instances, the compute cluster, and the managed online endpoint","Run az ml workspace provision-network to create the managed network"],"answer":[2],"explanation":"There is no migration path for existing managed compute when you enable a managed virtual network on a workspace. Delete the compute instances, compute clusters, and managed online endpoints, update the workspace, optionally provision the network, and then recreate the compute in the managed network.","rationale":["Incorrect: stopped compute instances and an idle cluster still exist in the workspace. Existing managed compute cannot
