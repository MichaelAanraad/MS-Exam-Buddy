"Few-shot examples shape only the current inference; they do not change the model's parameters or persist across unrelated future sessions.","ref":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"},{"id":"1.1.6-05","obj":"1.1.6","difficulty":"medium","type":"single","stem":"A finance team wants a generative AI model to expose its intermediate reasoning steps before giving a final answer, so errors are easier to spot. Which technique should they use?","choices":["Chain-of-thought prompting","Few-shot prompting","Zero-shot prompting","Cue-based prompting"],"answer":[0],"explanation":"Chain-of-thought prompting asks the model to reason step-by-step and show its work before the final answer, reducing errors and easing verification.","ref":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"},{"id":"1.1.6-06","obj":"1.1.6","difficulty":"hard","type":"single","stem":"A team is writing prompts for a reasoning-optimized model, such as an o-series or GPT-5 style model. What does Microsoft guidance say about using chain-of-thought prompting here?","choices":["It is required for the model to produce any usable output","It is generally unnecessary, since the model already reasons internally","It doubles accuracy compared to a plain instruction","It must be paired with fine-tuning to have any effect"],"answer":[1],"explanation":"Microsoft explicitly notes chain-of-thought prompting is not recommended for reasoning models like the o-series or GPT-5, since they already reason internally.","ref":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"},{"id":"1.1.6-07","obj":"1.1.6","difficulty":"easy","type":"single","stem":"An organization is training business users on writing effective prompts for Microsoft 365 Copilot. Which four-element framework does the training recommend?","choices":["Task, Audience, Tone, Length","Goal, Context, Expectations, Source","Input, Process, Output, Feedback","Instructions, Examples, Cue, Format"],"answer":[1],"explanation":"The M365 Copilot training module teaches the Goal, Context, Expectations, Source framework for business-user prompting.","ref":"https://learn.microsoft.com/en-us/training/modules/write-effective-prompts-do-more-prompting/"},{"id":"1.1.6-08","obj":"1.1.6","difficulty":"medium","type":"single","stem":"In the Goal, Context, Expectations, Source prompt framework used for Microsoft 365 Copilot, which element identifies what data Copilot should base its answer on?","choices":["Context","Expectations","Source","Goal"],"answer":[2],"explanation":"Source specifies what data or information the Copilot response should draw from, helping ground the answer.","ref":"https://learn.microsoft.com/en-us/training/modules/write-effective-prompts-do-more-prompting/"},{"id":"1.1.6-09","obj":"1.1.6","difficulty":"hard","type":"single","stem":"In the Goal, Context, Expectations, Source prompt framework, which element specifies the desired format, tone, and length of the response?","choices":["Goal","Source","Expectations","Context"],"answer":[2],"explanation":"Expectations captures the desired output format, audience, and length, guiding how the response should be shaped.","ref":"https://learn.microsoft.com/en-us/training/modules/write-effective-prompts-do-more-prompting/"},{"id":"1.1.6-10","obj":"1.1.6","difficulty":"easy","type":"single","stem":"A business wants to reduce hallucinated facts in AI-generated reports but does not want to fund a large data-integration project right now. Which low-cost lever should they try first?","choices":["Fine-tune the model on proprietary data","Build a full retrieval-augmented generation pipeline","Improve the design and structure of prompts","Retrain the model from scratch"],"answer":[2],"explanation":"Prompt engineering is a low-cost, no-code lever business users can apply to improve output quality, in contrast to more expensive fine-tuning or data-integration approaches like RAG.","ref":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ab-731"},{"id":"1.1.6-11","obj":"1.1.6","difficulty":"medium","type":"single","stem":"A compliance officer assumes that because a team applied strong prompt engineering, every AI-generated output is now guaranteed accurate and needs no further review. Why is this assumption flawed?","choices":["Prompt engineering changes the model's weights, which guarantees accuracy","Outputs must still be validated, since prompt engineering alone does not guarantee factual accuracy","Prompt engineering makes grounding unnecessary","Only fine-tuning can ever improve output accuracy"],"answer":[1],"explanation":"Microsoft stresses that generated outputs must still be validated, and grounding is the complementary technique for factual reliability rather than a replacement for review.","ref":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"},{"id":"1.1.7-01","obj":"1.1.7","difficulty":"easy","type":"single","stem":"A healthcare clinic's virtual assistant currently answers questions using only the language model's built-in knowledge, which is outdated. Leadership wants answers based on the clinic's current internal policy documents. Which capability should the solution add?","choices":["Grounding","Fine-tuning the model on historical chat transcripts","Increasing the model's temperature parameter","Applying output content filters only"],"answer":[0],"explanation":"Grounding supplies the LLM with relevant, current organizational content at query time so responses are anchored in real data rather than only the model's static training data.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-02","obj":"1.1.7","difficulty":"medium","type":"single","stem":"Which statement best describes retrieval-augmented generation (RAG) as an architecture pattern?","choices":["It retrains the model's weights directly on proprietary data before deployment","It combines retrieval of information from proprietary data sources with text generation by the LLM","It compresses prompts so they fit within the model's context window","It filters harmful content from the model's output after generation"],"answer":[1],"explanation":"RAG combines two steps: retrieving relevant content from enterprise or proprietary sources and having the LLM generate a response synthesized from that retrieved content.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-03","obj":"1.1.7","difficulty":"hard","type":"single","stem":"A business stakeholder asks whether adopting RAG means the underlying language model must be retrained on the company's data. What should they be told?","choices":["Yes, RAG always fine-tunes the model on the retrieved data before each response","No, RAG retrieves relevant content at query time and adds it to the prompt without changing the model's weights","Yes, RAG is simply another name for fine-tuning","No, RAG bypasses the language model and returns raw search results to the user"],"answer":[1],"explanation":"RAG is not fine-tuning; it retrieves relevant data at query time and injects it into the prompt/context, leaving the model's weights unchanged.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-04","obj":"1.1.7","difficulty":"easy","type":"single","stem":"Which of the following is the strongest business justification for adding grounding to a generative AI solution?","choices":["It removes the need for any content moderation on generated responses","It reduces fabricated or inaccurate answers by anchoring responses in real, current data","It guarantees the solution will require no further maintenance","It removes the need for access control on the underlying enterprise data"],"answer":[1],"explanation":"Grounding reduces hallucinations by anchoring responses in real, current, organization-specific content rather than only the model's static training data.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-05","obj":"1.1.7","difficulty":"medium","type":"single","stem":"Why do many generative AI solutions include a safety and governance validation step after retrieving grounding data and generating a response?","choices":["To rewrite the user's original question for clarity","To retrieve additional content from configured knowledge sources","To check the generated response for harmful content and flag claims not supported by the retrieved data","To translate the response into additional languages automatically"],"answer":[2],"explanation":"Organizations add a safety and governance validation step to catch harmful content and unsupported claims before a response reaches the user, reducing reputational and compliance risk.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/retrieval-augmented-generation"},{"id":"1.1.7-06","obj":"1.1.7","difficulty":"hard","type":"single","stem":"A decision-maker states that adopting RAG will completely eliminate hallucinated answers from the AI assistant. Why is this claim inaccurate?","choices":["RAG grounds responses in retrieved data, which reduces but does not guarantee elimination of fabricated content","RAG can only be used with structured databases, never unstructured text","RAG has no measurable effect on the accuracy of generated answers","RAG increases the likelihood of fabricated content because it adds more text to the prompt"],"answer":[0],"explanation":"RAG reduces hallucinations by grounding answers in retrieved data, but it does not guarantee elimination, which is precisely why a safety and governance validation step still checks for unsupported claims.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/retrieval-augmented-generation"},{"id":"1.1.7-07","obj":"1.1.7","difficulty":"easy","type":"single","stem":"A healthcare organization plans to ground its AI assistant using patient records from a proprietary database. Which requirement is most critical to address before deployment?","choices":["Maximizing the total volume of patient data retrieved for every query","Ensuring retrieval respects access control so each user only sees data they are authorized to view","Retraining the model monthly on the entire patient dataset","Removing citations from responses to simplify the interface"],"answer":[1],"explanation":"Grounding requires security and governance, including security trimming, so that retrieval only surfaces data the requesting user is authorized to see.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-08","obj":"1.1.7","difficulty":"medium","type":"single","stem":"Which statement correctly contrasts RAG with fine-tuning as approaches for using proprietary data with an LLM?","choices":["They are two names for the same underlying process","RAG retrieves relevant data at query time without altering the model, while fine-tuning updates the model's weights through additional training","Fine-tuning retrieves data at query time, while RAG updates the model's weights","Neither approach can incorporate an organization's proprietary data"],"answer":[1],"explanation":"RAG injects retrieved content into the prompt at query time, leaving the model unchanged, whereas fine-tuning actually retrains the model's weights, giving each a different cost, latency, and data-freshness tradeoff.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-09","obj":"1.1.7","difficulty":"hard","type":"single","stem":"An organization wants new product documentation published each day to be reflected in its AI assistant's answers, without retraining the model. What does this scenario primarily highlight?","choices":["The need to keep grounding data fresh through incremental updates to the retrieval index","The need to fine-tune the model nightly on the new documentation","The need to remove citations so updates can be applied faster","The need to delay indexing new content until the next major release"],"answer":[0],"explanation":"Content readiness for grounding requires data to be kept fresh through incremental updates, which is a key advantage of RAG over retraining.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-10","obj":"1.1.7","difficulty":"easy","type":"single","stem":"Why are citations and source provenance considered a business requirement for grounded AI solutions rather than just a technical nicety?","choices":["They are required only for legal contracts, not general question answering","They let users trace an answer back to its source, which builds trust and allows verification","They reduce the number of knowledge sources the solution must query","They remove the need for a separate content moderation step"],"answer":[1],"explanation":"Citations and provenance let users trace an answer back to its source, which is essential for building trust and enabling verification of AI-generated content.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/retrieval-augmented-generation"},{"id":"1.1.7-11","obj":"1.1.7","difficulty":"medium","type":"single","stem":"A team plans to ground its AI assistant using content from multiple systems, including one with strict access controls. What should they verify before deployment?","choices":["Whether retrieval will automatically and correctly enforce each user's existing access permissions on the retrieved content","Whether the chat interface uses a light or dark color theme","Whether the model was trained before a specific calendar year","Whether the retrieved content is stored on one server or replicated across several"],"answer":[0],"explanation":"Not every knowledge source automatically carries over an existing permission model when connected for retrieval, so organizations must verify and, where needed, explicitly configure access enforcement before go-live.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/retrieval-augmented-generation"},{"id":"1.1.7-12","obj":"1.1.7","difficulty":"hard","type":"single","stem":"A project team assumes that retrieving as much source content as possible for every query will always produce the best answers from an AI assistant. Why is this assumption flawed from a business perspective?","choices":["Excessive or irrelevant retrieved content can dilute the most relevant context and actually reduce answer quality","Retrieval has no practical limit on how much content can be used per query","More retrieved content always improves accuracy regardless of relevance","This limitation applies only to fine-tuned models, not to retrieval-based solutions"],"answer":[0],"explanation":"Retrieval works best when it returns concise, highly relevant content; pulling in excessive or irrelevant material can crowd out what matters and degrade the quality of the generated answer.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-13","obj":"1.1.7","difficulty":"easy","type":"single","stem":"A support team wants to use RAG to answer specific factual questions drawn from a large internal FAQ knowledge base. Is this an appropriate use case?","choices":["No, RAG is intended only for image generation tasks","Yes, RAG is well suited to factual question answering and specific fact retrieval","No, RAG should not be used for FAQ-style questions","Yes, but only after the model has been fine-tuned first"],"answer":[1],"explanation":"Microsoft's guidance identifies RAG as best suited for factual Q&A, FAQs, and specific fact retrieval scenarios.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/retrieval-augmented-generation"},{"id":"1.1.7-14","obj":"1.1.7","difficulty":"medium","type":"single","stem":"A legal team wants an AI solution to perform deep comparative analysis across many lengthy contracts to assess policy compliance. Is RAG the ideal architecture for this task?","choices":["Yes, RAG is designed for deep document comparison and complex multi-document reasoning","No, RAG is best suited to factual question answering and fact retrieval, not full document analysis or compliance evaluation","Yes, because RAG always retrieves and reasons over entire documents at once","No, because RAG cannot be applied to legal documents at all"],"answer":[1],"explanation":"Per Microsoft's own guidance, RAG is best for factual Q&A and fact retrieval, not for full document analysis or complex compliance evaluation across lengthy documents.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/retrieval-augmented-generation"},{"id":"1.1.7-15","obj":"1.1.7","difficulty":"hard","type":"single","stem":"Which of the following is NOT a typical knowledge source configured for content retrieval in a Copilot Studio RAG solution?","choices":["SharePoint","Dataverse","Graph connectors and uploaded files","The language model's original pretraining corpus"],"answer":[3],"explanation":"Retrieval draws from configured knowledge sources such as SharePoint, Dataverse, Graph connectors, Azure AI Search, uploaded files, or public web search, not from the model's original static pretraining corpus.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/retrieval-augmented-generation"},{"id":"1.1.7-16","obj":"1.1.7","difficulty":"easy","type":"single","stem":"Why must an organization's source content be broken into smaller, well-organized pieces before it can be used effectively to ground an AI assistant's answers?","choices":["Smaller, focused pieces of content can be retrieved and matched to a question more precisely, improving answer relevance and quality","It is only a legacy practice with no real benefit for modern AI systems","It removes the need to secure or govern access to the content","It applies only to image data, not to text-based documents"],"answer":[0],"explanation":"Preparing content in smaller, focused pieces lets retrieval return precise, relevant material for a given question instead of unwieldy full documents, improving grounded answer quality.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-17","obj":"1.1.7","difficulty":"medium","type":"single","stem":"Which scenario best illustrates a valid business use of RAG beyond a conversational chatbot?","choices":["A custom application built on Azure AI Search that retrieves proprietary content to ground generated answers","A batch process that classifies images with no text generation or retrieval involved","A translation feature that converts fixed phrase lists between languages without querying any external content","A spell-checker embedded in a word processor that flags typos using a static dictionary"],"answer":[0],"explanation":"RAG is a general architecture pattern usable across custom AI solutions, including applications built on Azure AI Search within Microsoft Foundry, not just chatbots or Copilot experiences. The other options involve no retrieval of external content to ground generated text.","ref":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation"},{"id":"1.1.7-18","obj":"1.1.7","difficulty":"hard","type":"single","stem":"A company is deciding between fine-tuning and RAG to keep its AI assistant's answers current with frequently changing product pricing. Which factor most favors RAG?","choices":["RAG can incorporate updated pricing data at query time without the cost and delay of retraining the model","Fine-tuning automatically re-trains itself whenever underlying data changes, at no additional cost","RAG requires the model to be retrained every time pricing changes, just like fine-tuning","Fine-tuning is generally cheaper and faster to keep current than RAG for frequently changing data"],"answer":[0],"explanation":"RAG retrieves current data at query time, making it cheaper and faster to keep answers up to date compared to the cost and delay of retraining the model via fine-tuning.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.7-19","obj":"1.1.7","difficulty":"easy","type":"single","stem":"An organization wants a custom AI solution to ground its answers in existing SharePoint and OneDrive content while preserving each user's existing access permissions, without building and maintaining a separate search index. Which Microsoft capability is designed for this?","choices":["A capability that lets custom applications retrieve relevant content directly from the Microsoft 365 content index while honoring existing permissions","A fine-tuning pipeline that retrains the model on exported SharePoint content","Azure AI Search, which always requires content to be re-indexed into a new vector store first","Microsoft Purview, which is used only for compliance auditing, not retrieval"],"answer":[0],"explanation":"Microsoft 365 offers a capability for custom applications to ground responses in relevant Microsoft 365 content without replicating or re-indexing it separately, while continuing to honor existing access and governance controls.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/api/ai-services/retrieval/overview"},{"id":"1.1.7-20","obj":"1.1.7","difficulty":"medium","type":"single","stem":"A data governance team is reviewing a planned RAG solution. Which of the following is a valid governance concern they should raise about the grounding data?","choices":["Whether the retrieved data respects data residency and regulatory compliance boundaries","Whether the language model's training data was collected before a specific year","Whether end users prefer a dark or light color theme in the chat interface","Whether the retrieval index is hosted on one server or replicated across several"],"answer":[0],"explanation":"Grounding requires security and governance considerations including data residency and compliance boundaries, which are core business requirements for a RAG solution.","ref":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"},{"id":"1.1.8-01","obj":"1.1.8","difficulty":"easy","type":"single","stem":"A retailer wants its AI assistant to answer questions using content from thousands of scanned invoice documents. What does this scenario illustrate about preparing data to ground an AI solution?","choices":["Unstructured documents need to be processed and indexed for semantic retrieval, unlike neatly structured tables that can be queried directly","Any document format can be used for grounding without any preparation","Only real-time API data can be used to ground an AI assistant","Structured and unstructured content require exactly the same preparation steps"],"answer":[0],"explanation":"Unstructured content such as scanned documents must be processed and indexed for semantic retrieval, while structured, tabular data is better served by direct query, a different data-readiness path an organization must plan for.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-unstructured-data"},{"id":"1.1.8-02","obj":"1.1.8","difficulty":"medium","type":"single","stem":"A finance team wants its AI assistant to return the exact total of a Dataverse sales table for the last quarter. Why is vector-based semantic search not well suited to this request?","choices":["Semantic search ranks content by relevance rather than performing precise aggregation over structured rows","Semantic search cannot be configured to access Dataverse tables under any circumstance","Semantic search is limited to image and video content only","Semantic search requires the data to be reformatted as unstructured documents first"],"answer":[0],"explanation":"Structured, tabular data is better served by direct query or a code interpreter, since semantic search is designed for relevance-based retrieval, not precise aggregation.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-code-interpreter-structured-data"},{"id":"1.1.8-03","obj":"1.1.8","difficulty":"hard","type":"single","stem":"Which term describes a training dataset that reflects the full diversity of the population and scenarios an AI solution will encounter in production?","choices":["A representative dataset","A normalized dataset","A synthetic dataset","A curated dataset"],"answer":[0],"explanation":"A representative dataset mirrors the actual population and scenarios the model will encounter, which is essential for fair and reliable outcomes.","ref":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ab-731"},{"id":"1.1.8-04","obj":"1.1.8","difficulty":"easy","type":"single","stem":"An HR screening AI is trained mostly on resumes from one demographic group, resulting in lower-quality recommendations for other groups. Which outcome and Responsible AI principle are most directly involved?","choices":["Biased recommendations, violating fairness","Increased latency, violating reliability and safety","Data exposure, violating privacy and security","Unclear reasoning, violating transparency"],"answer":[0],"explanation":"Non-representative training data causes the model to underserve underrepresented groups, directly violating the fairness principle of Responsible AI.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/responsible-ai"},{"id":"1.1.8-05","obj":"1.1.8","difficulty":"medium","type":"single","stem":"A business leader assumes that adding as much data as possible to an AI system will automatically improve its accuracy. What is the flaw in this assumption?","choices":["Data quality, relevance, and representativeness affect accuracy more than volume alone","AI systems reject any dataset beyond a fixed maximum size","Additional data always introduces bias with no exceptions","Larger datasets eliminate the need for grounding entirely"],"answer":[0],"explanation":"Volume alone does not guarantee better outcomes; poor-quality or unrepresentative data can degrade performance even at large scale.","ref":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ab-731"},{"id":"1.1.8-06","obj":"1.1.8","difficulty":"hard","type":"single","stem":"A company grounds its AI assistant in internal documents using retrieval-augmented generation (RAG), but the assistant continues to give outdated policy guidance. What is the most likely cause?","choices":["The knowledge source documents themselves are outdated or of poor quality","RAG is incompatible with internal document repositories","The underlying language model has stopped generating responses","Grounding guarantees answers are always current regardless of source content"],"answer":[0],"explanation":"RAG grounds responses in retrieved data, but if that source data is outdated or low quality, the grounded answers will still be wrong.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-copilot-studio"},{"id":"1.1.8-07","obj":"1.1.8","difficulty":"easy","type":"single","stem":"A team is deciding whether to fine-tune a model on newly released product specifications or ground it with retrieval-augmented generation (RAG) instead. Which factor favors RAG for this scenario?","choices":["RAG can incorporate the new content by updating the knowledge source, without retraining the model","RAG permanently bakes the new content into the model's weights, unlike fine-tuning","Fine-tuning always retrieves the latest data automatically at query time","RAG and fine-tuning have identical update costs and timelines"],"answer":[0],"explanation":"RAG lets an organization refresh what the model can reference simply by updating the connected knowledge source, avoiding the retraining cycle that fine-tuning requires to reflect new information.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-copilot-studio"},{"id":"1.1.8-08","obj":"1.1.8","difficulty":"medium","type":"single","stem":"To correct biased outputs, a team fine-tunes a model on a dataset that heavily overrepresents one customer segment. What is the likely result?","choices":["The existing bias is likely to be reinforced rather than corrected","The bias is automatically resolved because fine-tuning always improves fairness","Fine-tuning has no measurable effect on the model's fairness","Fine-tuning only changes response speed, not output bias"],"answer":[0],"explanation":"Fine-tuning on non-representative data reinforces the existing skew in the dataset, amplifying bias rather than resolving it.","ref":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai"},{"id":"1.1.8-09","obj":"1.1.8","difficulty":"hard","type":"single","stem":"Which of the following is an example of structured data used as a knowledge source for an AI solution?","choices":["A Dataverse table of customer orders","A folder of scanned support-ticket PDFs","A set of recorded customer service call transcripts","An archive of employee onboarding emails"],"answer":[0],"explanation":"Dataverse tables are structured, tabular data, in contrast to documents, transcripts, and emails, which are unstructured.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-copilot-studio"},{"id":"1.1.8-10","obj":"1.1.8","difficulty":"easy","type":"single","stem":"An executive argues that data quality only matters while training a model, not when the model retrieves grounding data to answer a live question. Why is this reasoning incorrect?","choices":["Grounding solutions retrieve data at query time, so poor-quality source data directly degrades live answers","Grounding never involves external data sources, only the trained model","Data quality only affects structured data, never documents used for grounding","Retrieval-augmented systems automatically correct quality issues before responding"],"answer":[0],"explanation":"Since grounding solutions retrieve source data at query time to produce answers, low-quality grounding data directly produces low-quality live responses.","ref":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ab-731"},{"id":"1.1.8-11","obj":"1.1.8","difficulty":"medium","type":"single","stem":"Which of the following best defines 'data quality' in the context of an AI solution?","choices":["The accuracy, completeness, consistency, and timeliness of the data","The total volume of data available to the solution","The file format used to store the data, such as CSV or JSON","The number of distinct knowledge sources connected to the solution"],"answer":[0],"explanation":"Data quality refers to attributes like accuracy, completeness, consistency, and timeliness, not volume, format, or source count.","ref":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ab-731"},{"id":"1.1.8-12","obj":"1.1.8","difficulty":"hard","type":"single","stem":"A hospital's AI triage assistant recommends different treatment priorities for patients with identical symptoms based on their zip code, reflecting patterns in historical data. Which Responsible AI principle is most directly at risk?","choices":["Fairness","Transparency","Accountability","Inclusiveness"],"answer":[0],"explanation":"Fairness requires that AI systems treat people with similar circumstances similarly; unequal treatment based on a proxy variable like zip code signals a fairness violation rooted in data bias.","ref":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai"},{"id":"1.1.8-13","obj":"1.1.8","difficulty":"easy","type":"single","stem":"A company is connecting two knowledge sources to an AI agent: SharePoint policy documents (unstructured text) and a database table of current inventory levels (structured data). What is the most effective way to make both usable by the agent?","choices":["Use semantic search over the documents, and query the structured table directly for precise, up-to-date values","Convert the database table into documents so every source is handled the same way","Query both sources directly and skip any retrieval processing for the documents","Apply identical processing to both sources, since data type does not affect retrieval"],"answer":[0],"explanation":"Unstructured documents are best retrieved through semantic/document search, while structured tabular data is better served by querying it directly for precise, current values rather than treating it like text.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-code-interpreter-structured-data"},{"id":"1.1.8-14","obj":"1.1.8","difficulty":"medium","type":"single","stem":"Which scenario best illustrates a data quality problem, as distinct from a data type or representativeness issue?","choices":["A customer database contains duplicate and outdated records that were never cleaned","A model is trained only on data from a single region, ignoring others","A knowledge source consists of PDF files rather than database tables","A knowledge source mixes structured and unstructured content"],"answer":[0],"explanation":"Duplication and staleness are core data quality issues (accuracy, consistency, timeliness), distinct from data type or population representativeness.","ref":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ab-731"},{"id":"1.1.8-15","obj":"1.1.8","difficulty":"hard","type":"single","stem":"A team wants an AI agent to perform reliable calculations and table joins on an uploaded spreadsheet, rather than relying on the model's own math reasoning to estimate the result. Which capability addresses this need?","choices":["A code interpreter feature that runs generated code for deterministic, reproducible computation on structured data","Semantic search that retrieves the most similar text passages","A visual card-formatting feature for chat responses","Trigger phrases that route conversations to the right topic"],"answer":[0],"explanation":"A code interpreter capability lets the agent generate and run code against structured data files, producing deterministic, reproducible results instead of relying on the model's inherent math ability.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-code-interpreter-structured-data"},{"id":"1.1.8-16","obj":"1.1.8","difficulty":"easy","type":"single","stem":"A company wants to reduce the risk of AI bias stemming from its training data. Which recommendation best addresses the root cause?","choices":["Audit datasets for representativeness across the populations the AI will serve","Increase the total amount of training data regardless of source diversity","Disable grounding entirely to avoid any data-related issues","Rely on fine-tuning after deployment to correct any bias that surfaces"],"answer":[0],"explanation":"Ensuring representativeness across relevant populations addresses the root cause of bias, whereas volume increases or after-the-fact fine-tuning alone do not fix underlying data skew.","ref":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/responsible-ai"},{"id":"1.1.8-17","obj":"1.1.8","difficulty":"medium","type":"single","stem":"When assessing how data affects the reliability of an AI solution, which three factors should a business leader evaluate?","choices":["Data type, data quality, and representativeness of the dataset","Data type, storage cost, and encryption method","Data quality, data ownership, and retention period","Representativeness of the dataset, compression method, and backup frequency"],"answer":[0],"explanation":"Evaluating an AI solution's data foundation means looking at the type of data, its quality, and how representative it is of the populations and scenarios the AI will serve.","ref":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ab-731"},{"id":"1.1.9-01","obj":"1.1.9","difficulty":"easy","type":"single","stem":"A compliance officer is reviewing whether Microsoft 365 Copilot interactions could end up improving the underlying foundation models over time. What should the officer be told?","choices":["Prompts, responses, and Microsoft Graph grounding data are not used to train the foundation LLMs","Interactions are used to retrain the model, but only after being anonymized","Interactions are used to train the model unless the tenant is on a trial license","Interactions are used to train the model only during off-peak hours to limit performance impact"],"answer":[0],"explanation":"Microsoft explicitly excludes Microsoft 365 Copilot prompts, responses, and grounding data from being used to train the foundation LLMs, as part of its enterprise data protection commitments.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/enterprise-data-protection"},{"id":"1.1.9-02","obj":"1.1.9","difficulty":"medium","type":"single","stem":"An IT director is worried that employees could use Microsoft 365 Copilot to surface content from files they cannot already open directly. How should the director evaluate this risk?","choices":["Copilot can only surface content the requesting user already has at least view permission to","The risk is low because Copilot caches only anonymized summaries of every document in the tenant","The risk is low because Copilot access is scoped entirely by the user's assigned Microsoft 365 license tier","Copilot temporarily elevates the user's read access for the duration of the chat session to generate a complete answer"],"answer":[0],"explanation":"Copilot respects the existing permissions model in Microsoft Graph and SharePoint; it never grants new or elevated access beyond what the requesting user already has.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy"},{"id":"1.1.9-03","obj":"1.1.9","difficulty":"hard","type":"single","stem":"Which control primarily enforces logical separation of customer data between tenants using Microsoft 365 Copilot?","choices":["Microsoft Entra authorization combined with role-based access control","Per-tenant firewall rules configured manually by each customer","A shared service principal scoped by contractual agreement","Client-side encryption keys generated by the end-user device"],"answer":[0],"explanation":"Tenant isolation for Copilot is enforced through Microsoft Entra ID authorization and RBAC, along with encryption at rest and in transit.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/enterprise-data-protection"},{"id":"1.1.9-04","obj":"1.1.9","difficulty":"easy","type":"single","stem":"A finance document in SharePoint has a Microsoft Purview sensitivity label with restricted permissions applied. A user without access to that document asks Copilot a question that relates to its contents. What happens?","choices":["Copilot honors the label's restrictions, so the document's content is not surfaced to that user","Copilot surfaces a redacted summary that omits only the numeric figures","Copilot surfaces the content but appends a visible sensitivity watermark to the response","Copilot notifies the document owner and waits for approval before responding"],"answer":[0],"explanation":"Copilot inherits and honors Purview sensitivity labels and Information Rights Management restrictions, so protected content is not exposed to users lacking access.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy"},{"id":"1.1.9-05","obj":"1.1.9","difficulty":"medium","type":"single","stem":"A security team is cataloguing risks that are novel to generative AI systems rather than carried over from traditional web applications. Which risk belongs in that category?","choices":["Crafted input that manipulates a model into disregarding its original instructions","Weak password policies enabling credential-stuffing attacks","Excessive request volume causing service degradation","Misconfigured server certificates leading to trust warnings"],"answer":[0],"explanation":"Prompt injection (including cross-prompt injection attacks) is a novel risk specific to generative AI, where malicious input attempts to override the model's intended behavior.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy"},{"id":"1.1.9-06","obj":"1.1.9","difficulty":"hard","type":"single","stem":"A security team wants to understand how Microsoft reduces the risk of attackers manipulating Microsoft 365 Copilot through malicious instructions embedded in external content. Which approach describes Microsoft's mitigation?","choices":["Layered protections, including screening that blocks high-risk prompts before they reach the model plus separate content-harm filters","Every prompt referencing external content is queued for manual review by a Microsoft engineer","External content sources are disabled tenant-wide by default to remove the attack surface entirely","Mitigation relies solely on the requesting user's own judgment, supported by periodic security awareness training"],"answer":[0],"explanation":"Microsoft uses a defense-in-depth approach, screening and blocking risky prompts before they reach the model and applying separate content-harm filters for categories like hate, violence, and self-harm.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy"},{"id":"1.1.9-07","obj":"1.1.9","difficulty":"easy","type":"single","stem":"An organization's security policy separately tracks prompt injection and data breach as distinct incident categories. Which statement justifies keeping them separate?","choices":["Prompt injection targets how the model interprets its instructions, and while it can lead to data exposure, it is a distinct attack vector from a breach itself","The two terms describe identical events and only differ by which team reports them","A prompt injection can only be logged after a data breach has already been confirmed","Prompt injection is a legal/compliance classification rather than a technical one, unlike data breach"],"answer":[0],"explanation":"Prompt injection targets how the model interprets instructions and is a distinct application-security vector, separate from (though potentially a precursor to) a data breach.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy"},{"id":"1.1.9-08","obj":"1.1.9","difficulty":"medium","type":"single","stem":"A vendor risk assessor asks where Microsoft 365 Copilot actually sends and processes a user's prompt along with the grounding data retrieved for it. What is the accurate description?","choices":["It stays within the Microsoft 365 service boundary and is processed via the Azure OpenAI Service","It is routed to the public OpenAI API using the organization's own subscription key","It is processed on the end user's local device with no cloud round trip","It is routed through a third-party AI provider selected during tenant onboarding"],"answer":[0],"explanation":"Microsoft 365 Copilot processing stays within the Microsoft 365 service boundary and uses the Azure OpenAI Service rather than public OpenAI endpoints, and Azure OpenAI does not cache customer content.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/enterprise-data-protection"},{"id":"1.1.9-09","obj":"1.1.9","difficulty":"hard","type":"single","stem":"A CISO asks whether Microsoft 365 Copilot traffic goes through the same human abuse-review process applied to general Azure OpenAI Service customers. What should the CISO be told?","choices":["Microsoft 365 Copilot has opted out of that standard human abuse-monitoring review","Yes, and a human reviewer approves each response before it reaches the user","Yes, but only for prompts submitted outside business hours","Review only applies to prompts in languages other than English"],"answer":[0],"explanation":"Microsoft 365 Copilot has opted out of the standard Azure OpenAI abuse-monitoring human review process to further protect customer data privacy.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/enterprise-data-protection"},{"id":"1.1.9-10","obj":"1.1.9","difficulty":"easy","type":"single","stem":"A governance lead is mapping where security fits within Microsoft's Responsible AI Standard. How should this relationship be described?","choices":["Privacy and security form one of several pillars alongside fairness, reliability, inclusiveness, transparency, and accountability","Security is a separate framework that predates and is unrelated to the Responsible AI Standard","The Responsible AI Standard is essentially another name for Microsoft's security controls","Security was added as an additional pillar only after the original standard's publication"],"answer":[0],"explanation":"The Responsible AI Standard covers fairness, reliability/safety, privacy/security, inclusiveness, transparency, and accountability; security is one component, not the whole framework.","ref":"https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ai/secure"},{"id":"1.1.9-11","obj":"1.1.9","difficulty":"medium","type":"single","stem":"A compliance team wants to know which certifications extend to their organization's Microsoft 365 Copilot deployment. Which statement is accurate?","choices":["Copilot inherits existing Microsoft 365 commitments such as GDPR, the EU Data Boundary, and ISO/IEC 27001/27018, in addition to ISO 42001 for AI management","Copilot requires an entirely separate AI-specific certification with no relationship to existing Microsoft 365 commitments","Only ISO 42001 applies, superseding all prior Microsoft 365 compliance certifications for that tenant","Certifications apply only to human-authored content, not to any Copilot-generated output"],"answer":[0],"explanation":"Copilot inherits the underlying Microsoft 365 compliance commitments (GDPR, EU Data Boundary, ISO/IEC 27018, ISO 27001) plus ISO 42001 for AI management systems, rather than requiring wholly separate AI certifications.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/enterprise-data-protection"},{"id":"1.1.9-12","obj":"1.1.9","difficulty":"hard","type":"single","stem":"During grounding, what keeps the Microsoft 365 Copilot Semantic Index from returning content the requesting user is not authorized to view?","choices":["Retrieval operates within the requesting user's existing identity-based access boundary","The index only stores content that has been explicitly marked as public by an admin","Retrieval is filtered afterward by a separate manual approval step before the response is shown","Access is limited based on the size of the user's mailbox"],"answer":[0],"explanation":"The Semantic Index performs grounding within the boundaries of the requesting user's existing identity-based access, preventing exposure of content the user cannot already view.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-privacy"},{"id":"1.1.9-13","obj":"1.1.9","difficulty":"easy","type":"single","stem":"An organization is auditing overly broad sharing permissions in SharePoint as part of preparing for a Copilot rollout. Why does this matter for Copilot's data exposure model?","choices":["Copilot surfaces only what a user already has access to, so gaps in source-system permissions directly translate into broader Copilot exposure","Copilot maintains its own independent access list that overrides SharePoint permissions","Permission hygiene mainly affects storage costs rather than what Copilot can expose","Copilot cannot connect to a SharePoint site at all until sharing is fully locked down"],"answer":[0],"explanation":"Since Copilot surfaces only what a user already has view access to, overly broad or misconfigured permissions in source systems directly translate into broader Copilot exposure.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-privacy"},{"id":"1.1.9-14","obj":"1.1.9","difficulty":"medium","type":"single","stem":"Which set of categories is covered by Microsoft's content-harm filtering as part of its defense-in-depth approach to AI-generated content?","choices":["Hate & Fairness, Sexual, Violence, and Self-harm","Spelling, Grammar, Tone, and Formatting consistency","Network latency, uptime, throughput, and cost thresholds","Font size, color contrast, and layout accessibility"],"answer":[0],"explanation":"Microsoft's content-harm filtering covers categories such as Hate & Fairness, Sexual, Violence, and Self-harm, in addition to jailbreak/XPIA classifiers and protected-material detection.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-privacy"},{"id":"1.1.9-15","obj":"1.1.9","difficulty":"hard","type":"single","stem":"A knowledge worker asks whether prompts they submit to Microsoft 365 Copilot might be retained and reused within another customer's session. What is the accurate answer?","choices":["No, Azure OpenAI Service does not cache customer content, and tenant data stays logically isolated","Yes, prompts are cached briefly and can surface in other tenants' sessions for efficiency","Yes, but only prompts exceeding a certain length are cached across tenants","No, but only if the user manually clears their chat history at the end of each day"],"answer":[0],"explanation":"Azure OpenAI Service, as used by Microsoft 365 Copilot, does not cache customer content, and tenant data remains logically isolated and is not shared across customers.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/enterprise-data-protection"},{"id":"1.1.9-16","obj":"1.1.9","difficulty":"easy","type":"single","stem":"A compliance officer wants a retained, searchable record of who exchanged which prompts and responses with Microsoft 365 Copilot, for later investigation. Which capability provides this?","choices":["Microsoft Purview audit logging of Copilot interaction events","Power BI usage metrics reports for the tenant","Azure Monitor Application Insights for App Service","Microsoft Defender for Cloud secure score recommendations"],"answer":[0],"explanation":"Copilot and AI-application interaction events are captured automatically as part of Microsoft Purview Audit once auditing is enabled for the organization, giving compliance teams a searchable record of prompts and responses.","ref":"https://learn.microsoft.com/en-us/purview/audit-copilot"},{"id":"1.1.10-01","obj":"1.1.10","difficulty":"easy","type":"single","stem":"A regional retailer wants to predict weekly product demand per store using two years of historical sales figures. Which approach should the retailer choose?","choices":["A generative AI model prompted to describe expected demand in narrative form","A machine learning model trained on the historical sales data to predict future demand","A digital assistant that answers store managers' questions about inventory","A model that generates promotional images for underperforming products"],"answer":[1],"explanation":"Forecasting a numeric target from structured historical data is a classical machine learning scenario, not a content-generation task suited to generative AI.","ref":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning?view=azureml-api-2"},{"id":"1.1.10-02","obj":"1.1.10","difficulty":"medium","type":"single","stem":"How does Microsoft describe Azure Machine Learning as a service?","choices":["A service for accelerating and managing the end-to-end machine learning lifecycle, including training, deployment, and MLOps","A managed relational database service tuned for high-volume transactions","A hosted large language model used to draft business documents","A dashboarding tool for visualizing pre-computed business metrics"],"answer":[0],"explanation":"Microsoft Learn defines Azure Machine Learning as a cloud service for accelerating and managing the machine learning project lifecycle, covering training, deployment, and MLOps.","ref":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning?view=azureml-api-2"},{"id":"1.1.10-03","obj":"1.1.10","difficulty":"hard","type":"single","stem":"Compared with performing analysis manually, what business value does machine learning primarily provide?","choices":["It removes the need for any historical data before predictions can be made","It automates and scales predictive or classification tasks across large data volumes","It guarantees fully autonomous decisions without any human review","It produces original written or visual content on demand"],"answer":[1],"explanation":"ML's core value driver is automating and scaling analytical/predictive tasks that would otherwise require manual statistical effort.","ref":"https://learn.microsoft.com/en-us/training/modules/business-value-microsoft-azure-ai-solutions/"},{"id":"1.1.10-04","obj":"1.1.10","difficulty":"easy","type":"single","stem":"A data science team is starting a new project to build a predictive model. Which activity should occur first in the machine learning lifecycle?","choices":["Publishing the model to a production endpoint","Collecting, cleaning, and labeling the source data","Setting up drift monitoring for the deployed model","Tuning the model's hyperparameters during training"],"answer":[1],"explanation":"The lifecycle begins with data preparation, since model quality depends on clean, representative, well-labeled data before any training can occur.","ref":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning?view=azureml-api-2"},{"id":"1.1.10-05","obj":"1.1.10","difficulty":"medium","type":"single","stem":"A company's fraud-detection model has been in production for a year, and its accuracy is declining as customer behavior changes. What should the team do next, according to the machine learning lifecycle?","choices":["Leave the model unchanged, since production is the final stage of the lifecycle","Monitor for the performance change, then retrain and redeploy the model","Replace the model with a document-generation tool instead","Stop using predictive models for this business problem altogether"],"answer":[1],"explanation":"The ML lifecycle is iterative: monitoring for performance degradation or drift triggers retraining and redeployment, closing the loop rather than ending at deployment.","ref":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-management-and-deployment?view=azureml-api-2"},{"id":"1.1.10-06","obj":"1.1.10","difficulty":"hard","type":"single","stem":"A manufacturer has abundant sensor readings from its production line but no one has labeled which readings preceded a past equipment failure. The team wants the algorithm to group similar readings on its own to surface unusual patterns. Which approach fits this need?","choices":["Supervised learning trained on labeled failure examples","Unsupervised learning that clusters the sensor data without pre-existing labels","A retrieval-augmented generative model that summarizes maintenance manuals","A rules engine encoding each technician's manual inspection checklist"],"answer":[1],"explanation":"When no labeled outcomes exist and the goal is to discover structure or groupings in the data itself, unsupervised learning (such as clustering) is the fitting approach, unlike supervised learning which requires labeled examples.","ref":"https://learn.microsoft.com/en-us/training/modules/business-value-microsoft-azure-ai-solutions/"},{"id":"1.1.10-07","obj":"1.1.10","difficulty":"easy","type":"single","stem":"What does the term MLOps refer to within the machine learning lifecycle?","choices":["A style of prompt engineering used to guide language model output","The application of DevOps practices, such as CI/CD, to manage, audit, and reproduce models in production","A pricing tier for reserved Azure virtual machine capacity","A framework limited to labeling and cleaning training data"],"answer":[1],"explanation":"MLOps applies DevOps practices like CI/CD to the ML lifecycle, enabling collaboration between data scientists and engineers with auditability and reproducibility in production.","ref":"https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/machine-learning-operations-v2"},{"id":"1.1.10-08","obj":"1.1.10","difficulty":"medium","type":"single","stem":"How should a business decision-maker distinguish machine learning from generative AI when scoping a new project?","choices":["Machine learning creates new unstructured content, while generative AI predicts outcomes from historical data","Machine learning learns patterns from historical, labeled data to predict or classify, while generative AI uses pretrained foundation models to create new content","The two terms describe the same underlying technology under different branding","Generative AI always requires more historical labeled data to operate than machine learning does"],"answer":[1],"explanation":"Machine learning is defined by learning from historical/labeled data to predict or classify, whereas generative AI uses pretrained foundation models to generate new content.","ref":"https://learn.microsoft.com/en-us/training/modules/business-value-microsoft-azure-ai-solutions/"},{"id":"1.1.8-18","obj":"1.1.8","difficulty":"hard","type":"single","stem":"A company wants to build a churn-prediction model using historical customer data that is unlabeled and inconsistent. What guidance should leadership give before investing further in the project?","choices":["Proceed directly to model training, since data quality has no effect on model outcomes","Invest in data quality and preparation first, since a model's predictions are only as reliable as the data used to train it","Data preparation can be skipped as long as the model will be served through a real-time endpoint","Data preparation is unnecessary as long as results are reviewed after training"],"answer":[1],"explanation":"A recurring business-value theme is that AI outcomes are only as good as the underlying data; leadership should prioritize data quality and readiness before investing in model development.","ref":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning?view=azureml-api-2"},{"id":"1.1.10-09","obj":"1.1.10","difficulty":"hard","type":"single","stem":"A logistics company wants to route incoming support tickets into predefined categories such as billing, shipping, and technical, using thousands of previously labeled tickets. Which solution best fits this need?","choices":["A tool that drafts new category names dynamically for each ticket","A machine learning classification model trained on the labeled historical tickets","A manual triage process performed entirely by support staff","A model that translates tickets into other languages before routing"],"answer":[1],"explanation":"Classifying items into predefined categories using historical labeled examples is a textbook supervised machine learning classification scenario.","ref":"https://learn.microsoft.com/en-us/training/modules/business-value-microsoft-azure-ai-solutions/"},{"id":"1.1.10-10","obj":"1.1.10","difficulty":"easy","type":"single","stem":"A facilities team wants to predict the likelihood of equipment failure from years of sensor readings, in order to schedule preventive maintenance. Given a clear, measurable target and ample historical data, which approach is best suited to this scenario?","choices":["A tool that drafts maintenance reports in natural language","A machine learning model trained to predict failure likelihood from the sensor history","A tool that summarizes technician notes from past repairs","A model that generates diagrams illustrating equipment layouts"],"answer":[1],"explanation":"Predictive maintenance relies on a clear, measurable target (failure likelihood) derived from historical sensor data, making it a classical machine learning scenario rather than a content-generation task suited to generative AI.","ref":"https://learn.microsoft.com/en-us/training/modules/business-value-microsoft-azure-ai-solutions/"},{"id":"2.1.1-01","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Contoso wants to give every employee access to an AI chat assistant without purchasing any additional per-user licensing. Which offering meets this requirement?","choices":["Microsoft 365 Copilot Chat","Microsoft 365 Copilot (the licensed experience)","Microsoft Security Copilot","A custom agent built in Copilot Studio"],"answer":[0],"explanation":"Microsoft 365 Copilot Chat is included with any Microsoft 365 subscription at no extra cost, unlike the licensed Microsoft 365 Copilot add-on.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.1-02","obj":"2.1.1","difficulty":"medium","type":"single","stem":"How does the grounding of responses differ between Microsoft 365 Copilot Chat (no add-on license) and the fully licensed Microsoft 365 Copilot?","choices":["Copilot Chat grounds responses in the web by default with optional access to a user's work content, while licensed Copilot grounds responses in both organizational data via Microsoft Graph and the web","Copilot Chat grounds responses only in organizational data, while licensed Copilot grounds responses only in the web","Both experiences ground responses identically in organizational data and the web","Copilot Chat cannot ground responses in any external or internal data source"],"answer":[0],"explanation":"Copilot Chat defaults to web grounding with optional access to work files, while the licensed Microsoft 365 Copilot draws on both Microsoft Graph organizational data and the web.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-03","obj":"2.1.1","difficulty":"hard","type":"single","stem":"An employee opens Microsoft Copilot, the consumer app, on a company-issued laptop that has a Microsoft 365 Copilot license assigned, and switches the context toggle from 'web' to 'work'. What happens next?","choices":["The user is moved into the licensed, Graph-grounded Microsoft 365 Copilot experience","The consumer app deletes the current conversation and starts over","Nothing changes, because the web and work toggles behave identically","The user gains access to Microsoft Graph data even without a license"],"answer":[0],"explanation":"On a managed device where the user holds a Microsoft 365 Copilot license, selecting 'work' hands the session off to the licensed, Graph-grounded experience rather than the web-only consumer one.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.1-04","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An HR business partner wants to build and iterate on a low-code conversational agent tailored to an internal onboarding process, without writing code. Which offering is designed for this?","choices":["Copilot Studio","Microsoft 365 Copilot Chat","GitHub Copilot","Microsoft Security Copilot"],"answer":[0],"explanation":"Copilot Studio is the low-code tool for building and customizing agents, distinct from the ready-made chat and in-app Copilot experiences.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.1-05","obj":"2.1.1","difficulty":"medium","type":"single","stem":"A sales manager gives Copilot in Word a short prompt describing a client proposal and asks it to produce an initial version of the document. Which Word Copilot capability is being invoked?","choices":["Draft","Coaching","Real-time transcript Q&A","Automated formula suggestions"],"answer":[0],"explanation":"Draft is the Word Copilot feature that generates new document content from a prompt or reference files.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-06","obj":"2.1.1","difficulty":"hard","type":"single","stem":"An analyst asks Excel Copilot to generate an entirely new workbook from a text prompt, expecting the same behavior as PowerPoint's deck generation. What is the actual outcome?","choices":["Copilot in Excel cannot generate a full workbook; it is scoped to suggesting formulas, chart types, and data insights on existing data","Copilot in Excel generates a complete new workbook from the prompt, just like PowerPoint","Copilot in Excel only works after the add-on license has been purchased twice for that user","Excel has no Copilot integration of any kind"],"answer":[0],"explanation":"Unlike Word and PowerPoint, Excel's Copilot capability is limited to formula, chart, and insight suggestions rather than generating entire new workbooks.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-07","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A team lead wants Copilot to produce a new slide deck that follows the organization's approved template, starting from a short prompt or an existing Word document. Which capability supports this?","choices":["PowerPoint Draft","Excel Draft","Outlook Draft","Teams Meeting Copilot"],"answer":[0],"explanation":"PowerPoint's Draft feature creates a new presentation from a prompt or an existing Word file, applying the organization's enterprise templates.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-08","obj":"2.1.1","difficulty":"medium","type":"single","stem":"An executive returns to find a lengthy email thread and needs to catch up without reading every message. Which Outlook Copilot capability addresses this?","choices":["Thread summarization","Tone and clarity coaching","Drafting a reply from prior emails","Live meeting transcript Q&A"],"answer":[0],"explanation":"Outlook Copilot's summarization feature condenses long email threads so users can catch up quickly.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-09","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Before sending a message to an important client, a manager wants Copilot to flag whether the wording could be read as overly blunt. Which Outlook Copilot capability provides this?","choices":["Coaching on tone, clarity, and sentiment","Summarization of the thread","Drafting content from prior emails","Live transcript question answering"],"answer":[0],"explanation":"Outlook Copilot's coaching capability reviews a draft's tone, clarity, and sentiment before it is sent.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-10","obj":"2.1.1","difficulty":"easy","type":"single","stem":"An employee returns from a two-week leave, opens a single Teams chat, and asks Copilot to summarize everything they missed. What is Copilot's summary limited to?","choices":["Just that one chat thread, not other chats, meetings, or files","All of that employee's chats, meetings, and files from the leave period","Meetings only, never chat messages","Nothing, because Copilot cannot summarize past absences"],"answer":[0],"explanation":"Copilot in Teams chat is scoped to the thread it is invoked in and cannot pull in content from other chats, meetings, or files.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-11","obj":"2.1.1","difficulty":"medium","type":"single","stem":"During a live Teams meeting, a participant asks Copilot who mentioned a specific budget figure in a different meeting held the previous week. What limitation applies?","choices":["Copilot in a Teams meeting only draws on that meeting's live transcript and has no access to prior meetings","Copilot can reference any meeting the organization has ever recorded","Copilot automatically searches all attendees' mailboxes for the figure","Answering the question requires the add-on license, regardless of meeting scope"],"answer":[0],"explanation":"Teams Meeting Copilot answers only from the current, live transcript and cannot reference prior meetings.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-12","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A project manager wants a summary of key decisions and assigned task owners from a client call placed as a PSTN call through Teams Phone. Is this supported once transcription is enabled and the required license is assigned?","choices":["Yes, Copilot in Teams calls captures key points and task owners for both VoIP and PSTN calls","No, Copilot support is limited to VoIP calls and never applies to PSTN","No, Copilot in Teams calls can transcribe but cannot summarize","Yes, but only after the call recording is manually re-uploaded to Stream"],"answer":[0],"explanation":"With transcription enabled via calling policy and a Teams Premium or Microsoft 365 Copilot license assigned, in-call Copilot supports both VoIP and PSTN calls and captures key points, task owners, and next steps.","ref":"https://learn.microsoft.com/en-us/microsoftteams/copilot-teams-calling-transcription"},{"id":"2.1.1-13","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A product team is brainstorming on a digital whiteboard and wants Copilot to group the scattered sticky notes into common themes. Which app provides this capability?","choices":["Whiteboard","Excel","Outlook","Forms"],"answer":[0],"explanation":"Whiteboard Copilot can organize sticky notes into themes and summarize the board's content.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-14","obj":"2.1.1","difficulty":"medium","type":"single","stem":"An HR coordinator needs help drafting the question set for an employee satisfaction survey. Which app's Copilot capability is built for this?","choices":["Forms","Loop","Whiteboard","Excel"],"answer":[0],"explanation":"Forms Copilot is designed to draft survey, poll, and form questions.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-15","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A distributed team wants to co-author a living project plan with AI assistance built directly into the collaborative editing surface, rather than a static document. Which app is purpose-built for this?","choices":["Loop","Outlook","Excel","Teams Calls"],"answer":[0],"explanation":"Loop is designed for collaborative content creation, with Copilot assistance embedded in that shared editing workflow.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.2-01","obj":"2.1.2","difficulty":"easy","type":"single","stem":"A business leader is deciding whether to buy the paid Microsoft 365 Copilot add-on for a team that already has Microsoft 365 Copilot Chat included with their subscription. What does the paid add-on actually add?","choices":["Deep, in-app Copilot experiences with priority access inside apps like Word, Excel, PowerPoint, and Outlook, grounded in the organization's own content","Access to any AI chat at all, since Copilot Chat provides no chat capability on its own","A separate consumer-only assistant unrelated to Microsoft 365 apps","Security operations tooling such as incident investigation"],"answer":[0],"explanation":"The paid Microsoft 365 Copilot add-on unlocks full, in-app Copilot experiences with priority access across Office apps, grounded in organizational content, beyond what is included with Copilot Chat.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.1-16","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A finance director asks a licensed Microsoft 365 Copilot Chat user to review a large sales spreadsheet, surface anomalies, and explain the reasoning behind each one. Which built-in agent best fits this task?","choices":["Analyst","Researcher","A custom Copilot Studio agent","Microsoft Security Copilot"],"answer":[0],"explanation":"Analyst is the built-in agent focused on data and spreadsheet reasoning, making it the right fit for spreadsheet anomaly analysis.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.1-17","obj":"2.1.1","difficulty":"medium","type":"single","stem":"A strategy team needs a multi-step, source-cited report on a competitor, synthesizing both public web content and internal work documents. Which built-in agent should they use?","choices":["Researcher","Analyst","Forms Copilot","Whiteboard Copilot"],"answer":[0],"explanation":"Researcher performs multi-step, source-cited research across the web and work content, matching this scenario.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/researcher-agent"},{"id":"2.1.1-18","obj":"2.1.1","difficulty":"hard","type":"single","stem":"An IT administrator is concerned that employees could use the Researcher and Analyst agents to process highly sensitive internal data. What control does the admin have?","choices":["Admins can block the Researcher and Analyst agents tenant-wide in the Microsoft 365 admin center","There is no way to restrict these agents; they are always enabled for licensed users","Only Microsoft support can disable these agents on request","These agents require a separate purchase and are disabled by default with no admin toggle"],"answer":[0],"explanation":"Researcher and Analyst are part of the core licensed Microsoft 365 Copilot Chat experience, and admins can block them for the entire tenant using the Block action in the Microsoft 365 admin center.","ref":"https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-copilot-agents-integrated-apps"},{"id":"2.1.1-19","obj":"2.1.1","difficulty":"easy","type":"single","stem":"A CISO wants an AI assistant focused on threat investigation, incident summarization, and day-to-day security operations rather than document authoring. Which Microsoft offering fits this need?","choices":["Microsoft Security Copilot","Microsoft 365 Copilot Chat","GitHub Copilot","Copilot Studio"],"answer":[0],"explanation":"Microsoft Security Copilot is purpose-built for security operations tasks, distinct from the productivity-focused M365 Copilot.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.1-20","obj":"2.1.1","difficulty":"medium","type":"single","stem":"A user asks the licensed Microsoft 365 Copilot to pull details from a colleague's file that the user does not otherwise have permission to open. What happens?","choices":["Copilot will not surface that content, because it respects the user's existing Microsoft Graph permissions","Copilot bypasses file permissions for any licensed user","Copilot surfaces the content, but only in summarized form","Copilot forwards the request to an administrator for manual approval"],"answer":[0],"explanation":"Copilot's Microsoft Graph grounding respects the user's existing permissions and never surfaces data the user could not already access.","ref":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview"},{"id":"2.1.1-21","obj":"2.1.1","difficulty":"hard","type":"single","stem":"A department head is evaluating whether to buy the Microsoft 365 Copilot add-on license for a small team that mainly needs quick web-based answers with only occasional access to a few work documents, not deep in-app authoring. What is the most cost-effective choice?","choices":["Microsoft 365 Copilot Chat, since it is included with the subscription and supports optional access to work files","The licensed Microsoft 365 Copilot add-on, since it is the only option that can touch work files at all","Microsoft Security Copilot, since it covers general productivity scenarios as well","Copilot Studio, since a custom agent is required for any chat-based assistant"],"answer":[0],"explanation":"Since the team's needs are limited to web answers with occasional work file access rather than full in-app authoring, the included Copilot Chat meets the need without the added license cost.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.2-02","obj":"2.1.2","difficulty":"medium","type":"single","stem":"A sole proprietor wants a no-cost AI chat assistant for personal use, grounded in public internet content, reachable from a browser without any Microsoft 365 subscription. Which product should they choose?","choices":["Microsoft Copilot","Microsoft 365 Copilot Chat","Microsoft 365 Copilot","Microsoft Copilot Studio"],"answer":[0],"explanation":"Microsoft Copilot is the free, consumer-facing assistant grounded in the public web, available at copilot.microsoft.com, in Edge, and in Bing, with no subscription required.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.2-03","obj":"2.1.2","difficulty":"hard","type":"single","stem":"An IT director wants every employee who already holds a Microsoft 365 subscription to gain web-grounded AI chat with enterprise-grade data handling, without the company buying any additional license. Which offering satisfies this without further purchase?","choices":["Microsoft 365 Copilot","Microsoft 365 Copilot Chat","Microsoft Security Copilot","Microsoft Copilot Studio"],"answer":[1],"explanation":"Microsoft 365 Copilot Chat comes bundled with any Microsoft 365 subscription at no extra cost and provides web-grounded chat with enterprise data protection.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-overview"},{"id":"2.1.2-04","obj":"2.1.2","difficulty":"easy","type":"single","stem":"A finance manager wants an assistant that automatically answers questions using her organization's emails, files, and meetings stored in Microsoft Graph, without her needing to attach anything to the conversation. Which licensing tier provides this by default?","choices":["Microsoft 365 Copilot Chat","Microsoft Copilot (free consumer version)","Microsoft 365 Copilot (paid add-on license)","Microsoft Copilot Studio"],"answer":[2],"explanation":"Only the paid Microsoft 365 Copilot add-on grounds responses in organizational data via Microsoft Graph by default; Copilot Chat stays web-grounded unless content is explicitly provided.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-overview"},{"id":"2.1.2-05","obj":"2.1.2","difficulty":"medium","type":"single","stem":"An employee signs into Microsoft Copilot on a company-managed laptop where the organization has enabled Microsoft 365 Copilot. They switch a toggle from 'personal' to 'work.' What happens as a result?","choices":["The interface theme changes to match the company branding","The session redirects into Microsoft 365 Copilot with access to organizational data","The user is automatically issued a permanent Copilot license","The session switches into GitHub Copilot for coding tasks"],"answer":[1],"explanation":"On a managed device where Microsoft 365 Copilot is enabled, switching to 'work' mode in Microsoft Copilot redirects the session into Microsoft 365 Copilot with organizational data access.","ref":"https://learn.microsoft.com/en-us/microsoft-365/copilot/which-copilot-for-your-organization"},{"id":"2.1.2-06","obj":"2.1.2","difficulty":"hard","type":"single","stem
