rrect: dab start runs the engine and does not change the configuration file.","Incorrect: dab validate checks the file and does not add an entity to it.","Correct: dab add writes the entity, its source, and the read permission for anonymous into the file."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities"},{"id":"2.4.1-03","obj":"2.4.1","difficulty":"hard","type":"single","stem":"The team must not store the SQL connection string in dab-config.json. Which value should the connection-string setting use to read it from an environment variable at startup?","choices":["${SQL_CONNECTION}","@env('SQL_CONNECTION')","env:SQL_CONNECTION","%SQL_CONNECTION%"],"answer":[1],"explanation":"DAB resolves the @env() function at startup and reads the value from the named environment variable, so no secret is stored in the file.","rationale":["Incorrect: a dollar and brace pattern is not resolved by DAB when it reads the configuration.","Correct: the @env() function is the documented way to read a value from an environment variable.","Incorrect: a plain env: prefix is not a function that DAB resolves.","Incorrect: percent signs are not resolved by DAB when it reads the configuration."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/"},{"id":"2.4.1-04","obj":"2.4.1","difficulty":"easy","type":"yesno","stem":"Fabrikam, Inc. reviews a dab-config.json file.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The $schema property is required at the top level of the file.","The database-type value for SQL Server is mssql.","The same entity name can appear in two configuration files that are combined."],"answer":[0,1],"explanation":"The schema property is required, SQL Server uses mssql, and entity names must be unique across files.","rationale":["Yes: the schema reference is one of the required top-level properties.","Yes: mssql is one of the documented data-source database types.","No: entity names must be unique across all configuration files that are combined."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/"},{"id":"2.4.1-05","obj":"2.4.1","difficulty":"medium","type":"multi","stem":"A DAB configuration file is stored in source control. Which two actions should you perform to keep secrets out of the file? Each correct answer presents part of the solution.","choices":["Keep the password in the file and use a private repository","Put the password in the description of the entity","Reference a secret in Azure Key Vault with @akv() and set the endpoint","Write the SQL password in the connection string for the test database","Reference the connection string with @env() and set the variable on the host"],"answer":[2,4],"explanation":"DAB can read values with @env() or from Azure Key Vault with @akv(), so the file holds only a reference and no secret.","rationale":["Incorrect: a private repository still exposes the password to everyone with access.","Incorrect: a description is plain text in the same file and exposes the password.","Correct: @akv() reads the secret from Key Vault by name, using the configured endpoint.","Incorrect: a password in the file is stored in the history of the repository.","Correct: @env() keeps the value in the host and the file holds only the name."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/"},{"id":"2.4.2-01","obj":"2.4.2","difficulty":"easy","type":"single","stem":"A client of the DAB REST API must return only the rows of the book entity where the year is 1970 or later. Which query option should the client use?","choices":["$filter","$first","$select","$orderby"],"answer":[0],"explanation":"The $filter option restricts rows by a condition. $select chooses columns, $orderby sorts, and $first limits the count.","rationale":["Correct: $filter restricts the rows with a condition such as year ge 1970.","Incorrect: $first limits how many rows return and does not test a condition.","Incorrect: $select chooses the returned fields and does not restrict rows.","Incorrect: $orderby sorts the rows and does not restrict them."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/rest"},{"id":"2.4.2-02","obj":"2.4.2","difficulty":"medium","type":"single","stem":"A DAB REST response contains a nextLink value. Which parameter should the client use to request the next page of results?","choices":["$next set to true","$after with the continuation token from nextLink","$page with the next page number","$skip with the number of rows already read"],"answer":[1],"explanation":"DAB uses continuation tokens. The nextLink holds the token, and the client passes it in the $after parameter.","rationale":["Incorrect: there is no $next parameter in the REST API of DAB.","Correct: $after continues from the token that the previous response returned.","Incorrect: DAB does not use page numbers for pagination. It does not satisfy the requirement in the question.","Incorrect: DAB pagination does not use an offset parameter such as $skip."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/rest"},{"id":"2.4.2-03","obj":"2.4.2","difficulty":"hard","type":"single","stem":"Wingtip Toys wants every REST request to return 50 items by default when the client sends no $first value. Which setting should the team change?","choices":["runtime.rest.path set to 50","The cache ttl-seconds value of the entity set to 50","$first=-1 on every request","runtime.pagination.default-page-size set to 50"],"answer":[3],"explanation":"The default page size is 100 and is configured with runtime.pagination.default-page-size.","rationale":["Incorrect: rest.path sets the route of the endpoint and does not control the page size.","Incorrect: ttl-seconds controls how long cached results live and not the page size.","Incorrect: $first=-1 asks for the maximum page size, which is the opposite of the goal.","Correct: this setting controls how many items return when the client gives no $first value."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/rest"},{"id":"2.4.2-04","obj":"2.4.2","difficulty":"easy","type":"yesno","stem":"Adventure Works configures caching and calls the DAB REST API.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Level 1 caching stores results in memory.","A ttl-seconds value on an entity overrides the global ttl-seconds value.","A GET request for a primary key that does not exist returns 404."],"answer":[0,1],"explanation":"L1 is in memory, the entity TTL overrides the global TTL, and a missing key returns an empty value array.","rationale":["Yes: L1 uses the memory of the DAB host only, while L1L2 also adds a distributed cache.","Yes: the entity value wins, and an entity without a value inherits the global one.","No: the response is 200 OK with an empty value array. This does not match the documented behavior."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/concept/cache/level-1"},{"id":"2.4.2-05","obj":"2.4.2","difficulty":"medium","type":"multi","stem":"Northwind Traders wants results of the Product entity to be cached for 30 seconds. Which two settings should you configure? Each correct answer presents part of the solution.","choices":["Set graphql.operation to query on the Product entity","Set cache enabled to true with ttl-seconds 30 on the Product entity","Set cache enabled to true in the runtime section","Send $first=30 with every request","Set rest.methods to GET on the Product entity"],"answer":[1,2],"explanation":"Caching is switched on globally and each entity opts in with its own cache block. The ttl-seconds value sets how long results stay.","rationale":["Incorrect: graphql.operation applies to stored procedures and does not control caching.","Correct: the entity block opts in and sets the lifetime to 30 seconds.","Correct: the global setting turns the cache on for the runtime.","Incorrect: $first limits the page size and has no effect on caching.","Incorrect: rest.methods applies to stored procedures and does not control caching."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/concept/cache/level-1"},{"id":"2.4.2-06","obj":"2.4.2","difficulty":"hard","type":"single","stem":"A client sends $select=id,Secret to a REST entity, and the role of the caller has no access to the Secret field. Which response should the client expect?","choices":["500 Internal Server Error","200 OK with the Secret field omitted","400 Bad Request","404 Not Found"],"answer":[2],"explanation":"A missing or inaccessible field in $select returns 400 Bad Request. DAB does not silently drop the field.","rationale":["Incorrect: 500 would mean a server fault, but the cause is an invalid request.","Incorrect: DAB does not silently omit a requested field that the role cannot read.","Correct: DAB rejects the request when a selected field is missing or not accessible.","Incorrect: 404 is used for a missing route and not for an inaccessible field in $select."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/rest"},{"id":"2.4.3-01","obj":"2.4.3","difficulty":"easy","type":"single","stem":"Tailspin Toys runs DAB with the default settings. Which URL path should a client use to read the book entity through REST?","choices":["/rest/book","/dab/book","/graphql/book","/api/book"],"answer":[3],"explanation":"Each entity is reachable at the base URL followed by /api and the entity name by default.","rationale":["Incorrect: /rest is not the default route of the DAB REST endpoint.","Incorrect: /dab is not a route that DAB registers for entities.","Incorrect: /graphql is the default route of the GraphQL endpoint and not of REST.","Correct: the default REST route is /api followed by the entity name."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/rest"},{"id":"2.4.3-02","obj":"2.4.3","difficulty":"medium","type":"single","stem":"The team must serve GraphQL at /data/graphql instead of the default path. Which setting should the team change in the configuration file?","choices":["data-source.options","runtime.rest.path","runtime.graphql.path","runtime.host.mode"],"answer":[2],"explanation":"The GraphQL path is set in the graphql section of the runtime. This default path comes from general knowledge of DAB.","rationale":["Incorrect: data-source options describe the database and not the endpoint paths.","Incorrect: the rest section holds the path of the REST endpoint and not of GraphQL.","Correct: the graphql section of the runtime holds the path of the GraphQL endpoint.","Incorrect: host mode switches between development and production and sets no path."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/"},{"id":"2.4.3-03","obj":"2.4.3","difficulty":"hard","type":"single","stem":"An application uses only GraphQL, and the team wants the REST endpoints to be unavailable. Which setting should the team apply?","choices":["Set runtime.host.mode to development","Set runtime.rest.enabled to false","Set runtime.graphql.enabled to false","Remove all permissions from every role"],"answer":[1],"explanation":"The enabled flag of the rest section switches the REST endpoints off while GraphQL stays available. This comes from general knowledge of DAB.","rationale":["Incorrect: development mode does not disable any endpoint. It does not satisfy the requirement in the question.","Correct: the flag turns off REST and keeps GraphQL available for the application.","Incorrect: this would turn off the endpoint that the application needs.","Incorrect: removing permissions blocks GraphQL too and does not switch off REST routes."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/"},{"id":"2.4.3-04","obj":"2.4.3","difficulty":"easy","type":"yesno","stem":"Litware, Inc. reviews the REST endpoint settings of DAB.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Path components and query parameters of REST requests are case sensitive.","The rest.path setting of an entity can contain slashes.","The compression level can be set to maximum."],"answer":[0,1],"explanation":"REST paths are case sensitive, an entity path can contain slashes, and the compression levels are optimal, fastest, and none.","rationale":["Yes: a request for /api/Book and /api/book can differ, as can $filter and $Filter.","Yes: version 2.0 and later allow paths such as shopping-cart/item.","No: the documented levels are optimal, fastest, and none. This does not match the documented behavior."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/rest"},{"id":"2.4.3-05","obj":"2.4.3","difficulty":"medium","type":"multi","stem":"A DAB endpoint is going to production for a web app at https://app.contoso.com. Which two actions should you perform? This guidance comes from general knowledge of DAB. Each correct answer presents part of the solution.","choices":["Limit the CORS origins to the origin of the web app","Set the host mode to development to see detailed errors","Grant anonymous create on every entity","Allow all origins with a wildcard","Set the host mode to production"],"answer":[0,4],"explanation":"A production endpoint should run in production mode and accept browser calls only from the known origin.","rationale":["Correct: a fixed origin list stops other sites from calling the API from a browser.","Incorrect: development mode exposes details that a production endpoint should hide.","Incorrect: anonymous create lets anyone insert rows and widens the attack surface.","Incorrect: a wildcard allows every site to call the API from a browser.","Correct: production mode turns off development features and detailed error output."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/"},{"id":"2.4.3-06","obj":"2.4.3","difficulty":"hard","type":"single","stem":"A client wants the largest page that the REST endpoint allows in one request. Which value of the $first parameter should the client send?","choices":["1000000","-1","0","max"],"answer":[1],"explanation":"Sending $first=-1 requests the maximum page size that is configured for the endpoint.","rationale":["Incorrect: a large number is not the documented way and can be rejected by the limit.","Correct: the value -1 asks for the maximum page size. This is the option that satisfies the requirement in the question.","Incorrect: 0 does not ask for the maximum and returns no useful page.","Incorrect: max is not a valid value of the $first parameter."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/rest"},{"id":"2.4.4-01","obj":"2.4.4","difficulty":"easy","type":"single","stem":"Contoso, Ltd. wants to expose the stored procedure dbo.get_book_by_id through DAB. Which source type should the entity use?","choices":["stored-procedure","function","view","table"],"answer":[0],"explanation":"The source type stored-procedure tells DAB that the object is executed and not read as a table.","rationale":["Correct: stored-procedure is the documented source type for procedures.","Incorrect: function is not a source type of an entity in DAB.","Incorrect: view is for views and a procedure cannot be queried like one.","Incorrect: table is for tables and a procedure cannot be queried like one."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities"},{"id":"2.4.4-02","obj":"2.4.4","difficulty":"medium","type":"single","stem":"Which permission action should the configuration grant to a role so that the role can call a stored-procedure entity?","choices":["create","execute","update","read"],"answer":[1],"explanation":"Stored-procedure entities use the execute action. The wildcard expands to execute for procedures.","rationale":["Incorrect: create inserts rows into a table and does not allow a procedure call.","Correct: execute is the action that allows a call of the stored procedure.","Incorrect: update changes rows of a table and does not allow a procedure call.","Incorrect: read is a table and view action and does not allow a procedure call."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities"},{"id":"2.4.4-03","obj":"2.4.4","difficulty":"hard","type":"single","stem":"A Book entity and an Author entity are linked through the join table dbo.books_authors. Which property of the relationship should name the join table?","choices":["target.entity","source.fields","cardinality","linking.object"],"answer":[3],"explanation":"For a many-to-many relationship, linking.object names the join table, and linking.source.fields and linking.target.fields name its columns.","rationale":["Incorrect: target.entity names the related entity and not the join table.","Incorrect: source.fields lists the columns of the source entity and not the join table.","Incorrect: cardinality says one or many and does not name a table.","Correct: linking.object holds the name of the join table of a many-to-many relationship."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/relationships"},{"id":"2.4.4-04","obj":"2.4.4","difficulty":"easy","type":"yesno","stem":"Adventure Works defines relationships between DAB entities.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Relationships can be traversed in GraphQL queries.","Relationships can be traversed in REST requests.","DAB supports navigation across only one hop of a relationship."],"answer":[0,2],"explanation":"Relationships work in GraphQL only, and navigation is limited to one hop.","rationale":["Yes: related entities appear as nested objects in a single request.","No: relationships apply to GraphQL only and REST does not support them.","Yes: the documentation lists one-hop navigation as a limitation."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/relationships"},{"id":"2.4.4-05","obj":"2.4.4","difficulty":"medium","type":"multi","stem":"A SQL view dbo.vw_Sales has no primary key, and the team wants to expose it through DAB. Which two actions should you perform? Each correct answer presents part of the solution.","choices":["Set the source type of the entity to view","Create a clustered index on the configuration file","Mark the key column with primary-key true in the fields of the entity","Set graphql.operation to mutation for the entity","Set the source type of the entity to table"],"answer":[0,2],"explanation":"A view is declared with the type view, and because a view has no key, DAB needs a field marked as the primary key.","rationale":["Correct: the type view tells DAB how to read the object. This is the option that satisfies the requirement in the question.","Incorrect: a configuration file has no indexes. It does not satisfy the requirement in the question.","Correct: DAB needs a key to address single rows, so one field is marked as the primary key.","Incorrect: graphql.operation applies to stored procedures and does not give a key.","Incorrect: the type table does not match the object and can cause errors."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities"},{"id":"2.4.4-06","obj":"2.4.4","difficulty":"hard","type":"single","stem":"A stored-procedure entity must be callable with an HTTP GET request. Which setting should the team change?","choices":["Set rest.methods to [\"GET\"] on the entity","Set the parameter of the procedure to not required","Grant the read action to the role","Set graphql.operation to query on the entity"],"answer":[0],"explanation":"By default a stored-procedure entity accepts POST. The rest.methods array lists the allowed HTTP methods.","rationale":["Correct: rest.methods lists the HTTP methods and the default is POST only.","Incorrect: making a parameter optional does not change the allowed HTTP method.","Incorrect: read is not an action for stored procedures, which use execute.","Incorrect: graphql.operation controls the GraphQL root type and not the REST method."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities"},{"id":"2.4.5-01","obj":"2.4.5","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. builds a container image for DAB. Which base image should the Dockerfile start from?","choices":["docker.io/library/nginx","mcr.microsoft.com/mssql/server","mcr.microsoft.com/azure-sql-edge","mcr.microsoft.com/azure-databases/data-api-builder"],"answer":[3],"explanation":"The DAB container image is published by Microsoft in the Microsoft Container Registry, and a custom image is built on top of it.","rationale":["Incorrect: nginx is a web server and contains no DAB engine.","Incorrect: the mssql/server image runs a SQL Server instance and not the DAB engine.","Incorrect: the Azure SQL Edge image runs a database engine and not the DAB engine.","Correct: this is the published image of Data API builder. This is the option that satisfies the requirement in the question."],"ref":"https://learn.microsoft.com/azure/data-api-builder/deployment/azure-container-apps"},{"id":"2.4.5-02","obj":"2.4.5","difficulty":"medium","type":"single","stem":"A Dockerfile for a custom DAB image must include the configuration file. Which destination path should the COPY instruction use?","choices":["/var/lib/dab-config.json","/etc/dab-config.json","/App/dab-config.json","/home/dab-config.json"],"answer":[2],"explanation":"The documented image expects the configuration file at /App/dab-config.json.","rationale":["Incorrect: the image does not look in /var/lib for its configuration file.","Incorrect: the image does not look in /etc for its configuration file.","Correct: the engine in the base image reads its configuration from the /App folder.","Incorrect: the image does not look in /home for its configuration file."],"ref":"https://learn.microsoft.com/azure/data-api-builder/deployment/azure-container-apps"},{"id":"2.4.5-03","obj":"2.4.5","difficulty":"hard","type":"single","stem":"DAB runs in Azure Container Apps, and the external ingress must reach the engine. Which target port should the ingress use?","choices":["8443","5000","1433","80"],"answer":[1],"explanation":"The DAB container listens on port 5000, so the ingress target port is set to 5000.","rationale":["Incorrect: port 8443 is not the port of the DAB container. It does not satisfy the requirement in the question.","Correct: the engine in the DAB image listens on port 5000. This is the option that satisfies the requirement in the question.","Incorrect: port 1433 is the SQL Server port and not the port of the API engine.","Incorrect: port 80 is the HTTP default, but the DAB container does not listen on it."],"ref":"https://learn.microsoft.com/azure/data-api-builder/deployment/azure-container-apps"},{"id":"2.4.5-04","obj":"2.4.5","difficulty":"easy","type":"yesno","stem":"Northwind Traders deploys DAB to Azure Container Apps.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The connection string can be read from an environment variable that is set on the container app.","Managed identities are recommended instead of a connection string with keys.","The ingress target port of the DAB container should be 1433."],"answer":[0,1],"explanation":"The connection string comes from an environment variable, managed identities are recommended, and the DAB port is 5000.","rationale":["Yes: the configuration uses @env() and the variable is set on the host.","Yes: role-based access with managed identities avoids storing keys.","No: the container listens on port 5000, and 1433 is the SQL Server port."],"ref":"https://learn.microsoft.com/azure/data-api-builder/deployment/azure-container-apps"},{"id":"2.4.5-05","obj":"2.4.5","difficulty":"medium","type":"multi","stem":"Wingtip Toys deploys DAB to Azure Container Apps. Which two actions should you perform? Each correct answer presents part of the solution.","choices":["Disable ingress so that clients use SQL directly","Write the database password in dab-config.json","Open the ingress target port 1433","Set the environment variable that the configuration references on the container app","Build a custom image from the DAB base image and copy dab-config.json into it"],"answer":[3,4],"explanation":"The image carries the configuration, and the container app provides the secret value through the environment variable the configuration names.","rationale":["Incorrect: disabling ingress stops clients from reaching the API.","Incorrect: a password in the file exposes it in the image and in source control.","Incorrect: port 1433 is the database port and is not the port of the API.","Correct: the variable supplies the connection string at start without storing it in the file.","Correct: the image packages the engine and the configuration file together."],"ref":"https://learn.microsoft.com/azure/data-api-builder/deployment/azure-container-apps"},{"id":"2.4.5-06","obj":"2.4.5","difficulty":"hard","type":"single","stem":"After the deployment, a team member wants to open the Swagger UI of the DAB container. Which path should the team member add to the app URL?","choices":["/api/swagger","/swagger/index.html","/graphql/swagger","/dab/docs"],"answer":[0],"explanation":"The documentation shows the Swagger UI of the REST API at /api/swagger of the deployed app.","rationale":["Correct: the Swagger UI is served under the REST path at /api/swagger.","Incorrect: /swagger/index.html is not the documented location in DAB.","Incorrect: the GraphQL path does not serve a Swagger page. It does not satisfy the requirement in the question.","Incorrect: /dab/docs is not a path that DAB registers. It does not satisfy the requirement in the question."],"ref":"https://learn.microsoft.com/azure/data-api-builder/deployment/azure-container-apps"},{"id":"2.4.6-01","obj":"2.4.6","difficulty":"easy","type":"single","stem":"Which section of dab-config.json should hold the Application Insights settings of DAB?","choices":["runtime.telemetry.application-insights","azure-key-vault.telemetry","entities.telemetry","data-source.application-insights"],"answer":[0],"explanation":"Application Insights is configured in the application-insights block under runtime.telemetry.","rationale":["Correct: the telemetry section of the runtime contains the application-insights block.","Incorrect: azure-key-vault describes where secrets are read from and has no telemetry block.","Incorrect: entities describe exposed objects and have no telemetry block.","Incorrect: data-source describes the database and has no telemetry block."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights"},{"id":"2.4.6-02","obj":"2.4.6","difficulty":"medium","type":"single","stem":"The team enables Application Insights for DAB. Which value should the connection-string setting contain?","choices":["The full Application Insights connection string","The name of the Log Analytics workspace","The URL of the DAB endpoint","Only the instrumentation key"],"answer":[0],"explanation":"The documentation tells to use the full connection string and not only the instrumentation key.","rationale":["Correct: the full string identifies the resource and its ingestion endpoint.","Incorrect: a workspace name does not identify where telemetry is sent.","Incorrect: the URL of the API is not a destination for telemetry.","Incorrect: the documentation says to use the full string and not only the key."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights"},{"id":"2.4.6-03","obj":"2.4.6","difficulty":"hard","type":"single","stem":"The configuration sets application-insights enabled to true but has no connection string. Which behavior should the team expect when DAB starts?","choices":["DAB creates a new Application Insights resource","DAB starts and silently ignores the setting","DAB starts and sends telemetry to a default resource","DAB reports an error"],"answer":[3],"explanation":"When telemetry is enabled without a connection string, DAB reports an error at startup.","rationale":["Incorrect: DAB does not create Azure resources by itself. It does not satisfy the requirement in the question.","Incorrect: the setting is not ignored, because DAB validates it at startup.","Incorrect: DAB has no default Application Insights resource to send telemetry to.","Correct: a missing connection string with telemetry enabled is reported as an error."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights"},{"id":"2.4.6-04","obj":"2.4.6","difficulty":"easy","type":"yesno","stem":"Adventure Works monitors DAB with Application Insights.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Requests and response times of REST and GraphQL calls are logged.","Calls to SQL are logged as dependencies with their duration.","The connection string of Application Insights should be stored in source control."],"answer":[0,1],"explanation":"Application Insights logs requests and SQL dependencies, and the connection string stays out of source control.","rationale":["Yes: request telemetry includes the response times and status codes.","Yes: dependency telemetry shows how long the database calls took.","No: it should be stored in an environment variable or Azure Key Vault."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights"},{"id":"2.4.6-05","obj":"2.4.6","difficulty":"medium","type":"multi","stem":"Tailspin Toys wants to see slow SQL calls made by DAB and to query the data over time. Which two actions should you perform? The Log Analytics part comes from general knowledge. Each correct answer presents part of the solution.","choices":["Enable the level 2 cache for every entity","Turn off the traces that DAB writes","Query the telemetry with Kusto Query Language in a Log Analytics workspace","Set the host mode to development on the production host","Enable Application Insights telemetry in the DAB configuration"],"answer":[2,4],"explanation":"Dependency telemetry shows the SQL call durations, and a Log Analytics workspace lets the team query it with KQL over time.","rationale":["Incorrect: a cache can hide slow calls and does not record any of them.","Incorrect: turning off traces removes information that helps to diagnose problems.","Correct: KQL queries in Log Analytics find slow calls and trends across a time range.","Incorrect: development mode does not collect telemetry and exposes details on production.","Correct: Application Insights collects requests, dependencies, and exceptions from DAB."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights"},{"id":"2.4.6-06","obj":"2.4.6","difficulty":"hard","type":"single","stem":"The developer wants to add the telemetry settings to the configuration file without editing the JSON by hand. Which command should the developer run?","choices":["dab add-telemetry --app-insights-enabled true --app-insights-conn-string \"@env('app-insights-connection-string')\"","dab init --telemetry true","dab update --telemetry true","dab start --monitor application-insights"],"answer":[0],"explanation":"The dab add-telemetry command writes the application-insights block into the configuration file.","rationale":["Correct: add-telemetry writes the block with the enabled flag and the connection string reference.","Incorrect: dab init creates a new file and does not add telemetry to an existing one.","Incorrect: dab update changes an entity and has no general telemetry switch.","Incorrect: dab start runs the engine and does not edit the configuration file."],"ref":"https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights"},{"id":"2.4.7-01","obj":"2.4.7","difficulty":"easy","type":"single","stem":"Contoso, Ltd. needs to know only which rows of dbo.Orders changed since the last synchronization, and the application reads the current values from the table. Which feature should the team enable?","choices":["Temporal tables","Change tracking","Query Store","Change data capture"],"answer":[1],"explanation":"Change tracking records that a row changed, identified by its primary key, and not the old or new data. It has lower overhead than change data capture.","rationale":["Incorrect: temporal tables keep row history and are not a synchronization feed.","Correct: change tracking records the fact of a change by primary key at low cost.","Incorrect: Query Store records query performance data and not row changes.","Incorrect: change data capture stores the changed data and costs more than the stated need."],"ref":"https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/track-data-changes-sql-server"},{"id":"2.4.7-02","obj":"2.4.7","difficulty":"medium","type":"single","stem":"An audit solution at Fabrikam, Inc. needs the history of each change, including the old and new values of the rows. Which feature should the team enable?","choices":["Change tracking","Resource Governor","Change data capture","Automatic tuning"],"answer":[2],"explanation":"Change data capture reads the transaction log with a capture job and stores historical row data in change tables.","rationale":["Incorrect: change tracking records only that a row changed and not the data.","Incorrect: Resource Governor manages resource limits and does not record changes.","Correct: CDC stores the historical data of each change in change tables.","Incorrect: automatic tuning manages indexes and plans and does not record changes."],"ref":"https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/track-data-changes-sql-server"},{"id":"2.4.7-03","obj":"2.4.7","difficulty":"hard","type":"single","stem":"A function with an Azure SQL trigger must run when rows of dbo.ToDo change. Which prerequisite should the team meet?","choices":["Enable Query Store on the database","Enable change data capture on the dbo.ToDo table","Enable change tracking on the database and on the dbo.ToDo table","Convert dbo.ToDo to a system-versioned temporal table"],"answer":[2],"explanation":"The Azure SQL trigger uses change tracking, which must be enabled on both the database and the monitored table.","rationale":["Incorrect: Query Store records query data and is not read by the trigger.","Incorrect: the trigger does not read CDC change tables. It does not satisfy the requirement in the question.","Correct: the trigger polls change tracking data, so it must be on for the database and the table.","Incorrect: a temporal table keeps history and is not read by the trigger."],"ref":"https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-azure-sql-trigger"},{"id":"2.4.7-04","obj":"2.4.7","difficulty":"easy","type":"yesno","stem":"Litware, Inc. evaluates change event streaming (CES), which is in preview.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["CES publishes each change as a CloudEvent.","Azure Event Hubs is a supported destination of CES.","CES is generally available in every SQL product."],"answer":[0,1],"explanation":"CES publishes CloudEvents to Event Hubs or Fabric Eventstream, and it is a preview feature.","rationale":["Yes: the event carries the schema, the previous values, and the new values.","Yes: Event Hubs and Fabric Eventstream are the documented destinations.","No: CES is in preview and the support differs between SQL products."],"ref":"https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/overview"},{"id":"2.4.7-05","obj":"2.4.7","difficulty":"medium","type":"order","stem":"Northwind Traders configures change event streaming (preview) from Azure SQL Database to Azure Event Hubs. Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run sys.sp_create_event_stream_group with the Event Hubs destination.","Run sys.sp_add_object_to_event_stream_group for the table.","Run sys.sp_cdc_enable_db on the database.","Create a master key and a database scoped credential.","Set the recovery model of the database to FULL.","Create a SQL Server Agent job that polls the table.","Run sys.sp_enable_event_stream."],"answer":[4,3,6,0,1],"explanation":"CES needs the FULL recovery model, a credential, the feature enabled, a stream group with a destination, and then the tables added to the group.","rationale":["Step 4: the group defines the destination and must exist before tables are added.","Step 5: adding the table is the last step, because it needs the existing group.","Incorrect: CES does not use CDC, so enabling it is not part of this setup.","Step 2: the stream group refers to the credential, so it must exist before the group.","Step 1: the stream needs the transaction log, so the recovery model must be FULL first.","Incorrect: CES pushes events to the destination, and no polling job is needed.","Step 3: the feature must be enabled before a stream group can be created."],"ref":"https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/configure"},{"id":"2.4.7-06","obj":"2.4.7","difficulty":"hard","type":"single","stem":"A workflow in Azure Logic Apps must start when a new row is added to a table in Azure SQL Database. Which trigger of the SQL Server connector should the workflow use? This comes from general knowledge of the connector.","choices":["When an item is created","When a message arrives in a queue","When an HTTP request is received","When a blob is added or modified"],"answer":[0],"explanation":"The SQL Server connector provides a polling trigger that fires when an item, which is a row, is created in the table.","rationale":["Correct: the connector trigger checks the table and starts the workflow for a new row.","Incorrect: a queue trigger belongs to a messaging service and does not watch the table.","Incorrect: an HTTP trigger needs a caller to send a request and does not watch the table.","Incorrect: a blob trigger belongs to Azure Storage and not to a SQL table."],"ref":"https://learn.microsoft.com/azure/connectors/connectors-create-api-sqlazure"},{"id":"3.1.1-01","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. stores product descriptions in French, German, and Japanese, and users search in English. Which characteristic should the team look for when it evaluates embedding models?","choices":["Support for several languages in one vector space","A fixed output of zero dimensions for every input","Support for returning structured JSON answers","Support for image input as the only supported input"],"answer":[0],"explanation":"A multilingual embedding model maps text in different languages to a shared vector space, so an English query can match descriptions in other languages.","rationale":["Correct: a multilingual model places the same meaning in different languages close together.","Incorrect: a model must return vectors with dimensions, and zero is not useful.","Incorrect: JSON answers belong to chat models and are not an embedding property.","Incorrect: image input is for multimodal models and does not help with text in other languages."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/"},{"id":"3.1.1-02","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. wants to search product photos and text captions with one query vector. Which kind of embedding model should the team evaluate?","choices":["A model that returns only keywords","A speech-to-text model","A text-only embedding model","A multimodal embedding model"],"answer":[3],"explanation":"A multimodal embedding model puts different kinds of input, such as text and images, in the same vector space so they can be compared.","rationale":["Incorrect: keywords are not vectors and cannot be compared by distance.","Incorrect: a speech model converts audio to text and does not embed images.","Incorrect: a text-only model cannot embed the photos. It does not satisfy the requirement in the question.","Correct: a multimodal model embeds text and images into one comparable space."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/"},{"id":"3.1.1-03","obj":"3.1.1","difficulty":"hard","type":"single","stem":"The embedding model of Wingtip Toys returns 3,072 dimensions by default, and the team stores the vectors in a float32 vector column. Which action should the team take?","choices":["Store the vectors as VARCHAR(MAX) text in the column","Declare the column as VECTOR(3072) with the float32 type","Request fewer dimensions, such as 1,536, in PARAMETERS","Cut the JSON array with LEFT before the insert is run"],"answer":[2],"explanation":"A float32 vector supports up to 1,998 dimensions. A model that allows it can return fewer dimensions when PARAMETERS carries a dimensions value. The default size of this model comes from general knowledge.","rationale":["Incorrect: text cannot be used with vector functions or indexes.","Incorrect: float32 allows only 1,998 dimensions, so 3,072 is rejected.","Correct: a smaller dimension count fits the column limit and the model still returns usable vectors.","Incorrect: cutting the array changes the vector and breaks the meaning of the embedding."],"ref":"https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type"},{"id":"3.1.1-04","obj":"3.1.1","difficulty":"easy","type":"yesno","stem":"Northwind Traders sizes the storage for its embeddings.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["A float32 vector with 1,536 dimensions needs about 6 KB per row.","A smaller number of dimensions reduces the storage that each vector needs.","A float16 vector column supports up to 1,998 dimensions."],"answer":[0,1],"explanation":"Storage follows dimensions times element size, and float16 doubles the allowed dimensions compared with float32.","rationale":["Yes: each element uses 4 bytes, and 1,536 times 4 bytes is about 6 KB.","Yes: storage grows with the number of elements, so fewer dimensions use less space.","No: float16 supports up to 3,996 dimensions, and 1,998 is the limit of float32."],"ref":"https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type"},{"id":"3.1.1-05","obj":"3.1.1","difficulty":"medium","type":"multi","stem":"Adventure Works compares embedding models for a large product catalog. Which two factors should the team compare? Each correct answer presents part of the solution.","choices":["The number of indexes on the source table","The collation of the database name","The languages that the model supports for the text in the catalog","The size of the transaction log of the source table","The number of dimensions that the model returns"],"answer":[2,4],"explanation":"Dimensions decide storage, index size, and cost, and the language coverage decides whether the model understands the catalog text.","rationale":["Incorrect: indexes on the source table do not describe the model.","Incorrect: a collation of a database name is not a property of an embedding model.","Correct: a model that does not cover the languages of the data returns weak matches.","Incorrect: the log size belongs to the source table and is not a property of a model.","Correct: more dimensions use more storage and make search slower and costlier."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/"},{"id":"3.1.1-06","obj":"3.1.1","difficulty":"medium","type":"single","stem":"A RAG application of Tailspin Toys needs the answer of the language model as JSON with fixed property names. Which capability should the team look for in the language model?","choices":["More embedding dimensions","Structured output","Multimodal input","A larger vector index"],"answer":[1],"explanation":"Structured output lets a model return JSON that follows a given schema, which makes the answer easy to parse in T-SQL.","rationale":["Incorrect: embedding dimensions apply to vectors and not to the answer format.","Correct: structured output makes the model return JSON with the requested shape.","Incorrect: multimodal input accepts images and does not fix the shape of the answer.","Incorrect: a vector index speeds up search and does not shape an answer."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/"},{"id":"3.1.1-07","obj":"3.1.1","difficulty":"hard","type":"single","stem":"A developer tries to register a chat completion model with CREATE EXTERNAL MODEL and sets MODEL_TYPE to a value other than EMBEDDINGS. Which result should the developer expect?","choices":["The statement fails because only EMBEDDINGS is accepted","The statement succeeds and the model returns text answers","The statement creates a local ONNX model","The statement succeeds and the model can be used in AI_GENERATE_EMBEDDINGS"],"answer":[0],"explanation":"CREATE EXTERNAL MODEL accepts only EMBEDDINGS as the model type. Chat models are called with sp_invoke_external_rest_endpoint.","rationale":["Correct: only EMBEDDINGS is accepted, so another model type is rejected.","Incorrect: the object registers embeddings models and does not generate text answers.","Incorrect: the ONNX format is set in API_FORMAT and not by another model type.","Incorrect: a model of another type cannot be accepted and so cannot be used for embeddings."],"ref":"https://learn.microsoft.com/sql/t-sql/statements/create-external-model-transact-sql"},{"id":"3.1.2-01","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Litware, Inc. creates an external model for an embedding endpoint. Which option of CREATE EXTERNAL MODEL should name the model that the provider hosts, such as text-embedding-3-large?","choices":["LOCATION","API_FORMAT","MODEL_TYPE","MODEL"],"answer":[3],"explanation":"The MODEL option names the model that the provider hosts. LOCATION is the endpoint, API_FORMAT is the request format, and MODEL_TYPE is the purpose of the model.","rationale":["Incorrect: LOCATION holds the address of the endpoint and not the model name.","Incorrect: API_FORMAT holds the request format such as Azure OpenAI.","Incorrect: MODEL_TYPE holds the purpose, which is EMBEDDINGS.","Correct: MODEL holds the name of the model at the provider. This is the option that satisfies the requirement in the question."],"ref":"https://learn.microsoft.com/sql/t-sql/statements/create-external-model-transact-sql"},{"id":"3.1.2-02","obj":"3.1.2","difficulty":"medium","type":"single","stem":"The embeddings model of Contoso, Ltd. is deployed in Azure OpenAI. Which API_FORMAT value should the CREATE EXTERNAL MODEL statement use?","choices":["Cognitive Search","ONNX Runtime","Ollama","Azure OpenAI"],"answer":[3],"explanation":"API_FORMAT names the request format of the endpoint. Azure OpenAI deployments use the Azure OpenAI value.","rationale":["Incorrect: Cognitive Search is not an accepted API format value.","Incorrect: ONNX Runtime is for a model that runs locally. It does not satisfy the requirement in the question.","Incorrect: Ollama is the format of an Ollama server. It does not satisfy the requirement in the question.","Correct: this value matches the request format of an Azure OpenAI deployment."],"ref":"https://learn.microsoft.com/sql/t-sql/statements/create-external-model-transact-sql"},{"id":"3.1.2-03","obj":"3.1.2","difficulty":"hard","type":"single","stem":"An external model must authenticate to its endpoint. Which object should the CREDENTIAL option of CREATE EXTERNAL MODEL refer to?","choices":["A database scoped credential","A secret name in Azure Key Vault","A certificate in the master database","A server-level login"],"answer":[0],"explanation":"CREDENTIAL takes a database scoped credential that follows the URL matching rules for the endpoint.","rationale":["Correct: a database scoped credential stores the identity or key for the endpoint.","Incorrect: T-SQL does not read a Key Vault secret by name in this option.","Incorrect: a certificate is used for signing or encryption and is not accepted here.","Incorrect: a login authenticates to the server and not to a web endpoint."],"ref":"https://learn.microsoft.com/sql/t-sql/statements/create-external-model-transact-sql"},{"id":"3.1.2-04","obj":"3.1.2","difficulty":"easy","type":"yesno","stem":"Fabrikam, Inc. manages external models in its database.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["MODEL_TYPE accepts only the value EMBEDDINGS.","A principal needs EXECUTE permission on the model to use it in AI functions.","An existing external model can be changed only by dropping it and creating it again."],"answer":[0,1],"explanation":"Only embeddings are supported, EXECUTE controls use, and ALTER EXTERNAL MODEL modifies a model.","rationale":["Yes: embedding models are the only type that can be registered at this time.","Yes: the grant is given with GRANT EXECUTE ON EXTERNAL MODEL.","No: ALTER EXTERNAL MODEL changes an existing model. This does not match the documented behavior."],"ref":"https://learn.microsoft.com/sql/t-sql/statements/create-external-model-transact-sql"},{"id":"3.1.2-05","obj":"3.1.2","difficulty":"medium","type":"multi","stem":"The key of the embedding endpoint of Fabrikam, Inc. is rotated, and the external model uses a database scoped credential. Which two actions should you perform? Each correct answer presents part of the solution.","choices":["Update the secret of the credential with ALTER DATABASE SCOPED CREDENTIAL","Restart the instance to load the new key","Test the model with a call of AI_GENERATE_EMBEDDINGS after the change","Drop and create the vector index again","Create all embeddings again from the source text"],"answer":[0,2],"explanation":"The model refers to the credential by name, so changing the secret of the credential is enough, and a test call proves that the new key works. The credential statement comes from general knowledge.","rationale":["Correct: the new secret is stored in the credential that the model already uses.","Incorrect: a restart is not needed to use a changed credential.","Correct: a test call shows that the endpoint accepts the new key.","Incorrect: a vector index does not hold the key of the endpoint.","Incorrect: existing embeddings stay valid because the model did not change."],"ref":"https://learn.microsoft.com/sql/t-sql/statements/create-external-model-transact-sql"},{"id":"3.1.2-06","obj":"3.1.2","difficulty":"medium","type":"single","stem":"A DBA at Adventure Works wants to list the external models that exist in a database. Which catalog view should the DBA query?","choices":["sys.external_tables","sys.sql_modules","sys.database_scoped_credentials","sys.external_models"],"answer":[3],"explanation":"The view sys.external_models returns metadata of the external models that the user is allowed to see.","rationale":["Incorrect: external_tables lists tables on external data sources and not models.","Incorrect: sql_modules holds the definitions of procedures and functions.","Incorrect: scoped credentials lists credentials and not the models that use them.","Correct: this view returns the metadata of external models. This is the option that satisfies the requirement in the question."],"ref":"https://learn.microsoft.com/sql/t-sql/statements/create-external-model-transact-sql"},{"id":"3.1.2-07","obj":"3.1.2","difficulty":"hard","type":"single","stem":"On SQL Server 2025, a call of AI_GENERATE_EMBEDDINGS fails because external REST endpoints are disabled. Which action should an administrator take?","choices":["Restart the SQL Server Agent service on the instance","Run sp_configure to enable external rest endpoint, then RECONFIGURE","Create a clustered columnstore index on the embeddings table","Run ALTER DATABASE SCOPED CONFIGURATION to turn on Query Store"],"answer":[1],"explanation":"External REST endpoints are off by default on SQL Server 2025 and must be enabled with sp_configure. Azure SQL Database has them on by default.","rationale":["Incorrect: the Agent runs jobs and does not control endpoint calls.","Correct: the option allows the engine to call HTTPS endpoints, which the AI functions need.","Incorrect: an index does not change whether the engine may call an endpoint.","Incorrect: Query Store records query data and does not control endpoint calls."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-embeddings-transact-sql"},{"id":"3.1.3-01","obj":"3.1.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. wants INSERT statements of its application never to wait for the embedding model. Which maintenance method should the team avoid?","choices":["A queue that is filled by a trigger and read later","An AFTER trigger that calls the model inside the transaction","A scheduled batch that embeds changed rows","A function that reads changes after the transaction"],"answer":[1],"explanation":"A call to an external model inside a trigger runs in the transaction of the user, so every write waits for the network call. This comes from general knowledge of triggers.","rationale":["Incorrect: a queue moves the slow call out of the transaction.","Correct: the trigger holds the transaction open during the call, so writes become slow and can fail.","Incorrect: a scheduled batch runs outside the user transaction.","Incorrect: a function that runs after the commit does not delay the user transaction."],"ref":"https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/track-data-changes-sql-server"},{"id":"3.1.3-02","obj":"3.1.3","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. wants code to run in batches whenever rows of a table change, and the code recomputes the embeddings of those rows. Which feature should start the code?","choices":["A foreign key with cascading updates","A SQL Server Agent job that runs a full table scan","The Resource Governor","Azure Functions with the Azure SQL trigger binding"],"answer":[3],"explanation":"The Azure SQL trigger polls change tracking and starts the function with batches of changed rows.","rationale":["Incorrect: cascading updates change related rows and do not start code.","Incorrect: a full scan every run is not change-based and wastes calls to the model.","Incorrect: Resource Governor limits resources and does not react to changes.","Correct: the trigger starts the function with the changed rows in batches."],"ref":"https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-azure-sql-trigger"},{"id":"3.1.3-03","obj":"3.1.3","difficulty":"hard","type":"single","stem":"A function with the Azure SQL trigger throws an error for the same changed row five times in a row. Which behavior should the team expect?","choices":["The row is ignored for future changes after the fifth failure","The function is disabled until an administrator restarts it","The row is deleted from the monitored table","The trigger switches to change data capture"],"answer":[0],"explanation":"A failed batch is retried after 60 seconds, and a row that fails five times in a row is ignored for future changes.","rationale":["Correct: after five failures the trigger stops processing that row.","Incorrect: the trigger does not disable the whole function for one row.","Incorrect: the trigger never changes the data of the monitored table.","Incorrect: the trigger always uses change tracking and does not switch."],"ref":"https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-azure-sql-trigger"},{"id":"3.1.3-04","obj":"3.1.3","difficulty":"easy","type":"yesno","stem":"Wingtip Toys compares ways to detect changes for embedding maintenance.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Change event streaming sends changes as events to Azure Event Hubs.","Change tracking stores the old values of the changed columns.","Change data capture uses a capture job that reads the transaction log."],"answer":[0,2],"explanation":"CES publishes events, change tracking keeps only keys, and CDC reads the transaction log.","rationale":["Yes: Event Hubs and Fabric Eventstream are the destinations of CES.","No: change tracking records only that a row changed, identified by its primary key.","Yes: the job reads the log asynchronously and writes the changes to change tables."],"ref":"https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/track-data-changes-sql-server"},{"id":"3.1.3-05","obj":"3.1.3","difficulty":"medium","type":"multi","stem":"Northwind Traders wants to react to row changes without adding work to the user transaction. Which two methods should the team consider? Each correct answer presents part of the solution.","choices":["Change event streaming to Azure Event Hubs (preview)","A call to the model by the application inside the same transaction","Azure Functions with the Azure SQL trigger binding","A full rebuild of all embeddings after every statement","An AFTER INSERT trigger that calls the model for each row"],"answer":[0,2],"explanation":"Both the SQL trigger and CES read changes after they are committed, so the user transaction does not wait for the model.","rationale":["Correct: CES publishes committed changes as events for consumers to process.","Incorrect: the application call inside the transaction makes the transaction wait.","Correct: the function polls changes after the commit and processes them in batches.","Incorrect: a rebuild after every statement is very costly and is not change-based.","Incorrect: the trigger runs in the user transaction and waits for the call."],"ref":"https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/overview"},{"id":"3.1.3-06","obj":"3.1.3","difficulty":"medium","type":"single","stem":"Adventure Works prefers a low-code solution that embeds new rows by using connector actions and an HTTP call to the embedding endpoint. Which service should the team use?","choices":["Query Performance Insight","The Database Engine Tuning Advisor","Azure Logic Apps with a SQL connector trigger","Azure SQL Database elastic jobs only for index rebuilds"],"answer":[2],"explanation":"Azure Logic Apps provides a workflow with a SQL connector trigger and actions such as an HTTP call. This comes from general knowledge of Logic Apps.","rationale":["Incorrect: Query Performance Insight shows query statistics and does not run workflows.","Incorrect: the tuning advisor recommends indexes and does not run workflows.","Correct: a workflow can react to a new row and call the endpoint without custom code.","Incorrect: an elastic job for index rebuilds does not react to new rows."],"ref":"https://learn.microsoft.com/azure/connectors/connectors-create-api-sqlazure"},{"id":"3.1.3-07","obj":"3.1.3","difficulty":"hard","type":"single","stem":"Tailspin Toys turns on change event streaming (preview) for a table that already holds one million rows. Which action should the team take to also embed the existing rows?","choices":["Wait, because CES streams the existing rows automatically","Run a one-time batch that embeds the existing rows","Truncate the table and load the rows again","Disable CES and enable change tracking"],"answer":[1],"explanation":"Only changes made after the configuration are streamed, and existing rows are not seeded. A one-time batch handles the existing rows.","rationale":["Incorrect: existing rows are not seeded into the stream. It does not satisfy the requirement in the question.","Correct: the stream does not contain old rows, so an initial batch is needed.","Incorrect: truncating the table loses data and is not needed.","Incorrect: switching the feature does not create embeddings for old rows."],"ref":"https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/configure"},{"id":"3.1.4-01","obj":"3.1.4","difficulty":"easy","type":"single","stem":"A table of Contoso, Ltd. has the columns ProductID, ProductDescription, ListPrice, and ModifiedDate. Which column should the team include in the embedding?","choices":["ProductID identifier","ListPrice amount","ModifiedDate value","ProductDescription text"],"answer":[3],"explanation":"Free-form text such as a description carries the meaning that an embedding captures. Identifiers, numbers, and dates add little.","rationale":["Incorrect: an identifier has no meaning and only adds tokens.","Incorrect: a number has little semantic value and is better used as a filter.","Incorrect: a date is operational metadata and has little semantic value.","Correct: a description has semantic content that a model can embed."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads"},{"id":"3.1.4-02","obj":"3.1.4","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. wants one vector to represent both the title and the description of an article. Which input should the team send to the embedding model?","choices":["Only the primary key of the article","Only the data type names of both columns","The title and description joined into one text value","Two separate vectors that are added by SQL operators"],"answer":[2],"explanation":"The model embeds one text value, so the meaningful columns are combined into a single string. Vectors do not support arithmetic operators.","rationale":["Incorrect: a key has no meaning and gives a useless vector. It does not satisfy the requirement in the question.","Incorrect: type names describe the structure and not the content.","Correct: one combined text lets a single vector represent both columns.","Incorrect: vectors cannot be added with operators, because arithmetic is not supported."],"ref":"https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type"},{"id":"3.1.4-03","obj":"3.1.4","difficulty":"hard","type":"single","stem":"The Notes column of Litware, Inc. contains customer e-mail addresses and phone numbers mixed with free text, and the team wants semantic search on it. Which action should the team take before generating embeddings? This comes from general knowledge.","choices":["Send the text as it is because vectors cannot be read","Embed only the e-mail address of each customer","Mask the personal data in the text before it is sent","Store the notes inside the model endpoint itself"],"answer":[2],"explanation":"The text is sent to an external endpoint, so personal data should be removed or masked first. A vector can leak information and does not make data anonymous.","rationale":["Incorrect: vectors are derived from the text and are not guaranteed to be anonymous.","Incorrect: an e-mail address has no semantic value and is personal data.","Correct: masking keeps personal data away from the endpoint and out of the vectors.","Incorrect: a model endpoint does not store the source data of the table."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads"},{"id":"3.1.4-04","obj":"3.1.4","difficulty":"easy","type":"yesno","stem":"Adventure Works decides which columns to embed.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Identifiers add little semantic value to an embedding.","Leaving out columns that carry no meaning reduces token use and cost.","Vectors must always be stored in the same table as the source text."],"answer":[0,1],"explanation":"Meaningful text is embedded, other columns are left out, and vectors can live in a separate table.","rationale":["Yes: they carry no meaning and only increase the number of tokens.","Yes: fewer tokens are sent to the model, so each request costs less.","No: a separate embeddings table is easier to rebuild without affecting the source data."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads"},{"id":"3.1.4-05","obj":"3.1.4","difficulty":"medium","type":"multi","stem":"A Reviews table of Northwind Traders has the columns ReviewID, ReviewTitle, ReviewText, StarRating, and CreatedAtUtc. Which two columns should you include in the embedding? Each correct answer presents part of the solution.","choices":["CreatedAtUtc","ReviewID","ReviewText","StarRating","ReviewTitle"],"answer":[2,4],"explanation":"The title and the text hold the meaning of a review. The key, the rating, and the date are better used as filters or sort keys.","rationale":["Incorrect: the date is metadata that works better as a filter.","Incorrect: the key is an identifier without meaning. It does not satisfy the requirement in the question.","Correct: the text holds the opinion and the details of the review.","Incorrect: the rating is a number that works better as a filter.","Correct: the title summarizes the content in a few words. This is the option that satisfies the requirement in the question."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads"},{"id":"3.1.4-06","obj":"3.1.4","difficulty":"medium","type":"single","stem":"Which location should the team use to store the generated vectors so that it can rebuild them without touching the source data?","choices":["In a variable that lives for one session only","In the transaction log of the database itself","In a separate embeddings table with the source key","In the primary key column of the source table"],"answer":[2],"explanation":"Storing vectors in a separate table keyed to the source row makes it easy to track storage and rebuild embeddings without changing the source.","rationale":["Incorrect: a variable is lost at the end of the session and cannot be searched later.","Incorrect: the log is internal and is not a storage place for application data.","Correct: a separate table can be rebuilt or dropped without affecting the source rows.","Incorrect: vectors cannot be used as a primary key and the key must stay unique."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads"},{"id":"3.1.4-07","obj":"3.1.4","difficulty":"hard","type":"single","stem":"Queries of Wingtip Toys combine a semantic search on the description with filters on category and price. Which design should the team use?","choices":["Embed only the category and the price of each product","Embed only the description and filter on category and price columns","Replace the filters by vector distance on the price column","Embed category, price, and description into one text value"],"answer":[1],"explanation":"The embedding captures free text, while exact conditions on category and price are handled better by normal columns and predicates.","rationale":["Incorrect: category and price carry little meaning to match descriptions.","Correct: filters stay exact and fast, and the vector covers the meaning of the text.","Incorrect: distance on a price is not an exact filter and returns the wrong rows.","Incorrect: numbers inside the text blur the meaning and cannot be filtered exactly."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads"},{"id":"3.1.5-01","obj":"3.1.5","difficulty":"easy","type":"single","stem":"Contoso, Ltd. must split a long text column into smaller fragments in T-SQL before it generates embeddings. Which function should the team use?","choices":["AI_GENERATE_CHUNKS","AI_GENERATE_EMBEDDINGS","OPENJSON","STRING_SPLIT"],"answer":[0],"explanation":"AI_GENERATE_CHUNKS is a table-valued function that splits text into chunks of a given size. STRING_SPLIT splits on a separator character.","rationale":["Correct: the function returns the chunks of a text with a chunk size and an overlap.","Incorrect: AI_GENERATE_EMBEDDINGS turns text into a vector and does not split it.","Incorrect: OPENJSON reads JSON text and does not split free text into chunks.","Incorrect: STRING_SPLIT splits on a separator and has no size or overlap option."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-chunks-transact-sql"},{"id":"3.1.5-02","obj":"3.1.5","difficulty":"medium","type":"single","stem":"Which value should the CHUNK_TYPE argument of AI_GENERATE_CHUNKS have?","choices":["FIXED","SENTENCE","SEMANTIC","PARAGRAPH"],"answer":[0],"explanation":"FIXED is the only accepted chunk type, and it splits the text by a number of characters.","rationale":["Correct: FIXED is the only accepted value. This is the option that satisfies the requirement in the question.","Incorrect: SENTENCE is not an accepted chunk type. It does not satisfy the requirement in the question.","Incorrect: SEMANTIC is not an accepted chunk type. It does not satisfy the requirement in the question.","Incorrect: PARAGRAPH is not an accepted chunk type. It does not satisfy the requirement in the question."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-chunks-transact-sql"},{"id":"3.1.5-03","obj":"3.1.5","difficulty":"hard","type":"single","stem":"A query uses CHUNK_SIZE = 200 and OVERLAP = 10 with AI_GENERATE_CHUNKS. How many characters of the previous chunk should each later chunk repeat?","choices":["200","20","2000","10"],"answer":[1],"explanation":"OVERLAP is a percentage of CHUNK_SIZE, so 10 percent of 200 characters is 20 characters.","rationale":["Incorrect: 200 is the full chunk size and would repeat the entire chunk.","Correct: 10 percent of 200 characters is 20 characters. This is the option that satisfies the requirement in the question.","Incorrect: 2000 is more than the chunk size and cannot be repeated.","Incorrect: 10 is the percentage and not the number of characters."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-chunks-transact-sql"},{"id":"3.1.5-04","obj":"3.1.5","difficulty":"easy","type":"yesno","stem":"Fabrikam, Inc. configures AI_GENERATE_CHUNKS.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The OVERLAP value is a whole number from 0 to 50.","The CHUNK_SIZE value is the number of characters of each chunk.","The function works at any database compatibility level."],"answer":[0,1],"explanation":"Overlap is 0 to 50 percent, the size is in characters, and compatibility level 170 or higher is required.","rationale":["Yes: the number is a percentage of the chunk size, and the default is 0.","Yes: the size is a character count and cannot be NULL, negative, or zero.","No: the function requires compatibility level 170 or higher."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-chunks-transact-sql"},{"id":"3.1.5-05","obj":"3.1.5","difficulty":"medium","type":"multi","stem":"Adventure Works must chunk the Body column of dbo.Docs and keep the key of each document next to its chunks. Which two actions should you perform? Each correct answer presents part of the solution.","choices":["Call AI_GENERATE_CHUNKS without a table and use SELECT *","Select the document key from dbo.Docs together with the chunk column","Use OPENROWSET to read the Body column","Call AI_GENERATE_CHUNKS with CROSS APPLY and SOURCE set to the Body column","Set CHUNK_TYPE to SENTENCE"],"answer":[1,3],"explanation":"CROSS APPLY runs the function for each row, so the key of the row can be selected next to each chunk.","rationale":["Incorrect: the function needs a source text and cannot run without one.","Correct: the key of the row links every chunk back to its document.","Incorrect: OPENROWSET reads external files and is not needed for a column.","Correct: the apply runs the function once per document row. This is the option that satisfies the requirement in the question.","Incorrect: SENTENCE is not an accepted chunk type. It does not satisfy the requirement in the question."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-chunks-transact-sql"},{"id":"3.1.5-06","obj":"3.1.5","difficulty":"medium","type":"single","stem":"Search results of Northwind Traders are vague because each chunk holds a whole chapter. Which change should the team make?","choices":["Remove all overlap and keep the size","Switch to a model with more dimensions only","Increase the chunk size","Reduce the chunk size"],"answer":[3],"explanation":"Chunks that are too large dilute the meaning of the text in one vector. Smaller chunks keep each vector focused.","rationale":["Incorrect: overlap does not fix chunks that are too large. It does not satisfy the requirement in the question.","Incorrect: more dimensions do not fix text that mixes many topics in one chunk.","Incorrect: bigger chunks dilute the meaning even more and can exceed token limits.","Correct: smaller chunks give each vector a focused meaning. This is the option that satisfies the requirement in the question."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads"},{"id":"3.1.5-07","obj":"3.1.5","difficulty":"hard","type":"single","stem":"The team wants the result of AI_GENERATE_CHUNKS to include a column that groups the chunks of the same source row. Which argument should the team set?","choices":["ENABLE_CHUNK_SET_ID = 1","CHUNK_TYPE = GROUPED","OVERLAP = 50","SOURCE = NULL"],"answer":[0],"explanation":"ENABLE_CHUNK_SET_ID set to 1 adds the chunk_set_id column, which groups chunks that come from the same source row or document.","rationale":["Correct: the argument returns the chunk_set_id column for each chunk.","Incorrect: GROUPED is not an accepted chunk type, because only FIXED is accepted.","Incorrect: overlap repeats text between chunks and does not add a column.","Incorrect: a NULL source returns no chunks. It does not satisfy the requirement in the question."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-chunks-transact-sql"},{"id":"3.1.6-01","obj":"3.1.6","difficulty":"easy","type":"single","stem":"Wingtip Toys generates embeddings in T-SQL. Which clause should the developer use to name the external model in AI_GENERATE_EMBEDDINGS?","choices":["WITH MODEL","FROM MODEL","AS MODEL","USE MODEL"],"answer":[3],"explanation":"The syntax is AI_GENERATE_EMBEDDINGS(source USE MODEL model_name), and an optional PARAMETERS clause follows.","rationale":["Incorrect: WITH MODEL is not part of the syntax of the function.","Incorrect: FROM MODEL is not part of the syntax of the function.","Incorrect: AS MODEL is not part of the syntax of the function.","Correct: USE MODEL is the clause that names the model in the function."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-embeddings-transact-sql"},{"id":"3.1.6-02","obj":"3.1.6","difficulty":"medium","type":"single","stem":"The team must store an embedding for each chunk of a text column. Which statement pattern should the team use?","choices":["SELECT AI_GENERATE_CHUNKS(txt USE MODEL m) AS chunk_vector FROM t WHERE txt IS NOT NULL AND LEN(txt) > 500 ORDER BY 1","INSERT INTO emb SELECT c.chunk, AI_GENERATE_EMBEDDINGS(c.chunk USE MODEL m) FROM t CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = t.txt, CHUNK_TYPE = FIXED, CHUNK_SIZE = 500) AS c","INSERT INTO emb SELECT VECTOR_NORMALIZE(txt, 'norm2') FROM t WHERE txt IS NOT NULL AND LEN(txt) > 500 ORDER BY 1","UPDATE t SET txt = AI_GENERATE_EMBEDDINGS(txt USE MODEL m) WHERE txt IS NOT NULL AND LEN(txt) > 500 AND txt LIKE '%a%'"],"answer":[1],"explanation":"The pattern chunks the text with CROSS APPLY and passes each chunk to AI_GENERATE_EMBEDDINGS, then inserts the result next to the chunk.","rationale":["Incorrect: the chunk function does not accept a model and the call is invalid.","Correct: this pattern chunks the text and embeds each chunk in one statement.","Incorrect: VECTOR_NORMALIZE scales a vector and does not create one from text.","Incorrect: an update would replace the source text with a vector and loses the text."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-embeddings-transact-sql"},{"id":"3.1.6-03","obj":"3.1.6","difficulty":"hard","type":"single","stem":"Calls of the embedding endpoint sometimes fail with throttling errors. Which setting should the team change so the engine retries a failed call up to three times?","choices":["Set LOCK_TIMEOUT of the session to a value of 3 for retries","Set PARAMETERS of the model with retry_count of 3","Set MAXDOP of the database to a value of 3 for retries","Set the compatibility level of the database to a value of 3"],"answer":[1],"explanation":"The retry_count in sql_rest_options accepts a whole number from 0 to 10 and can be set in the PARAMETERS of the model.","rationale":["Incorrect: LOCK_TIMEOUT controls waits for locks and not endpoint calls.","Correct: retry_count in sql_rest_options controls how often the call is repeated.","Incorrect: MAXDOP controls parallelism and does not repeat endpoint calls.","Incorrect: a compatibility level of 3 is not valid and has no effect on retries."],"ref":"https://learn.microsoft.com/sql/t-sql/statements/create-external-model-transact-sql"},{"id":"3.1.6-04","obj":"3.1.6","difficulty":"easy","type":"yesno","stem":"Litware, Inc. reviews how AI_GENERATE_EMBEDDINGS works.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The source can be a character type such as nvarchar.","The PARAMETERS clause adds JSON to the body of the request.","A retry_count of 25 is valid."],"answer":[0,1],"explanation":"The source is a character type, PARAMETERS adds JSON, and retry_count allows 0 to 10.","rationale":["Yes: the source accepts char, varchar, nchar, and nvarchar expressions.","Yes: the values can override matching settings of the model at run time.","No: the retry count must be a whole number from 0 to 10. This does not match the documented behavior."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-embeddings-transact-sql"},{"id":"3.1.6-05","obj":"3.1.6","difficulty":"medium","type":"multi","stem":"A developer calls AI_GENERATE_EMBEDDINGS and must name the model and set the number of dimensions for this call only. Which two clauses should the call contain? Each correct answer presents part of the solution.","choices":["OPTION (MODEL = 'name') at the end of the query","WITH MODEL followed by the name of the external model","PARAMETERS with a JSON object that sets dimensions","USE MODEL followed by the name of the external model","DIMENSIONS = 755 placed after the source text"],"answer":[2,3],"explanation":"The syntax uses USE MODEL to name the model and an optional PARAMETERS clause with a JSON object, for example one that sets dimensions.","rationale":["Incorrect: a query hint with MODEL is not part of the syntax.","Incorrect: WITH MODEL is not part of the syntax. It does not satisfy the requirement in the question.","Correct: PARAMETERS passes JSON values such as dimensions with the request.","Correct: USE MODEL is the clause that names the model. This is the option that satisfies the requirement in the question.","Incorrect: DIMENSIONS = 755 is not part of the syntax. It does not satisfy the requirement in the question."],"ref":"https://learn.microsoft.com/sql/t-sql/functions/ai-generate-embeddings-transact-sql"},{"id":"3.1.6-06","obj":"3.1.6","difficulty":"medium","type":"single","stem":"An embeddings mode
